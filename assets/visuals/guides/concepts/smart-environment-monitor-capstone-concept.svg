-linecap="round" marker-end="url(#arrow)"/><text x="545" y="397" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f718b">Measure</text><path d="M 995 415 C 1065 415, 1045 415, 1115 415" fill="none" stroke="#0f718b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1055" y="397" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f718b">Display and alert</text></g>

<g><rect x="120" y="665" width="250" height="42" rx="21" fill="#eaf8ef" stroke="#a9cbd3" stroke-width="1.5"/><text x="245" y="693" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">GPIO21 / GPIO22 I2C</text></g><g><rect x="412" y="665" width="250" height="42" rx="21" fill="#eef6ff" stroke="#a9cbd3" stroke-width="1.5"/><text x="537" y="693" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">Temp humidity pressure</text></g><g><rect x="704" y="665" width="250" height="42" rx="21" fill="#eaf8ef" stroke="#a9cbd3" stroke-width="1.5"/><text x="829" y="693" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">TEMP_APPROACH_C</text></g><g><rect x="996" y="665" width="250" height="42" rx="21" fill="#eef6ff" stroke="#a9cbd3" stroke-width="1.5"/><text x="1121" y="693" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">TEMP_WARNING_C</text></g><g><rect x="1288" y="665" width="250" height="42" rx="21" fill="#eaf8ef" stroke="#a9cbd3" stroke-width="1.5"/><text x="1413" y="693" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">Green normal / red warning</text></g>
<text x="800" y="810" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#5d7382">Concept illustration only: process flow, logic, and data direction. Not a wiring diagram.</text>
