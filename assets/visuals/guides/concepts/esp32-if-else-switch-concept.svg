<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" width="1020" height="430" role="img" aria-labelledby="title desc"><title id="title">ONE DECISION</title><desc id="desc">Reject invalid values before classifying. Concept diagram, not hardware evidence.</desc><rect width="1020" height="430" rx="24" fill="#0d2631"/><g font-family="Arial, sans-serif"><text x="54" y="82" font-size="34" font-weight="700" fill="#ffffff">ONE DECISION</text><rect x="54" y="148" width="284" height="170" rx="16" fill="#153c49"/><text x="196" y="195" text-anchor="middle" font-size="23" fill="#ffffff">score &lt; 40</text><text x="196" y="266" text-anchor="middle" font-size="36" fill="#70e3cb">LOW</text><rect x="358" y="148" width="284" height="170" rx="16" fill="#153c49"/><text x="500" y="195" text-anchor="middle" font-size="23" fill="#ffffff">score &lt; 70</text><text x="500" y="266" text-anchor="middle" font-size="36" fill="#70e3cb">MIDDLE</text><rect x="662" y="148" width="284" height="170" rx="16" fill="#153c49"/><text x="804" y="195" text-anchor="middle" font-size="23" fill="#ffffff">otherwise</text><text x="804" y="266" text-anchor="middle" font-size="36" fill="#70e3cb">HIGH</text><text x="54" y="377" font-size="25" fill="#d5e9ef">Reject invalid values before classifying.</text></g></svg>