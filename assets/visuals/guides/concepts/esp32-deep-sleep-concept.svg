t-size="17">RTC counter retained</text><text x="50" y="560" fill="#b9d8eb" font-family="sans-serif" font-size="24">Conceptual reference — follow the board-specific instructions below</text><text x="50" y="605" fill="#b9d8eb" font-family="sans-serif" font-size="21">Expected behavior described; physical hardware operation not verified</text></svg>