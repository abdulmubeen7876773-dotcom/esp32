<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Local AP web server</title><desc id="desc">Conceptual communication flow, not a physical wiring diagram. AP passphrase is not HTTP authentication. This example has no TLS.</desc><rect width="1200" height="675" rx="24" fill="#102b36"/><text x="70" y="100" fill="#ffffff" font-family="sans-serif" font-size="34">Local AP web server</text><text x="70" y="150" fill="#cce9ed" font-family="sans-serif" font-size="23">Conceptual reference · classic ESP32-WROOM · Arduino-ESP32 3.3.2</text><rect x="65" y="230" width="235" height="160" rx="16" fill="#e5f5f5"/><text x="80" y="288" fill="#102b36" font-family="sans-serif" font-size="25">Phone / PC</text><text x="80" y="330" fill="#153f4b" font-family="sans-serif" font-size="15">Join this Wi-Fi network</text><path d="M306 306h30m-10-8 10 8-10 8" stroke="#8fe1d5" stroke-width="4" fill="none"/><rect x="345" y="230" width="235" height="160" rx="16" fill="#e5f5f5"/><text x="360" y="288" fill="#102b36" font-family="sans-serif" font-size="25">ESP32-Lab AP</text><text x="360" y="330" fill="#153f4b" font-family="sans-serif" font-size="15">No internet gateway</text><path d="M586 306h30m-10-8 10 8-10 8" stroke="#8fe1d5" stroke-width="4" fill="none"/><rect x="625" y="230" width="235" height="160" rx="16" fill="#e5f5f5"/><text x="640" y="288" fill="#102b36" font-family="sans-serif" font-size="25">GET /uptime</text><text x="640" y="330" fill="#153f4b" font-family="sans-serif" font-size="15">HTTP on printed AP address</text><path d="M866 306h30m-10-8 10 8-10 8" stroke="#8fe1d5" stroke-width="4" fill="none"/><rect x="905" y="230" width="235" height="160" rx="16" fill="#e5f5f5"/><text x="920" y="288" fill="#102b36" font-family="sans-serif" font-size="25">Text response</text><text x="920" y="330" fill="#153f4b" font-family="sans-serif" font-size="15">Millis since board reset</text><text x="65" y="475" fill="#ffffff" font-family="sans-serif" font-size="21">AP passphrase is not HTTP authentication. This example has no TLS.</text><text x="65" y="550" fill="#cce9ed" font-family="sans-serif" font-size="22">Illustration of the data path; no tested build or physical pin order is implied.</text></svg>