<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" width="1020" height="430" role="img" aria-labelledby="title desc"><title id="title">A SMALL STATE MACHINE</title><desc id="desc">x cancels. r reports. No long blocking wait. Concept diagram, not hardware evidence.</desc><rect width="1020" height="430" rx="24" fill="#0d2631"/><g font-family="Arial, sans-serif"><text x="54" y="82" font-size="34" font-weight="700" fill="#ffffff">A SMALL STATE MACHINE</text><rect x="54" y="148" width="284" height="170" rx="16" fill="#153c49"/><text x="196" y="195" text-anchor="middle" font-size="22" fill="#ffffff">IDLE</text><text x="196" y="263" text-anchor="middle" font-size="28" fill="#70e3cb">s: start</text><rect x="358" y="148" width="284" height="170" rx="16" fill="#153c49"/><text x="500" y="195" text-anchor="middle" font-size="22" fill="#ffffff">WAITING</text><text x="500" y="263" text-anchor="middle" font-size="28" fill="#70e3cb">2000 ms</text><rect x="662" y="148" width="284" height="170" rx="16" fill="#153c49"/><text x="804" y="195" text-anchor="middle" font-size="22" fill="#ffffff">DONE</text><text x="804" y="263" text-anchor="middle" font-size="28" fill="#70e3cb">s: repeat</text><text x="54" y="377" font-size="25" fill="#d5e9ef">x cancels. r reports. No long blocking wait.</text></g></svg>