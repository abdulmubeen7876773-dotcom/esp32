<path d="M60 138 H1540 V172 H60 Z" fill="#10233f"/>
<text x="800" y="105" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" fill="#ffffff">ESP32 Button Debounce with millis()</text>
<text x="800" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#d9f7fb">Raw button bounce becomes one stable press after debounce timing.</text>
