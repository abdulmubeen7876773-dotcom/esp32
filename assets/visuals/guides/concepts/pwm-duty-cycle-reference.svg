<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">Ideal PWM duty-cycle comparison at the same frequency</title><desc id="desc">Three ideal 5000 Hz waveforms. Each period is 200 microseconds. HIGH time is 50, 100 or 150 microseconds. Illustration, not a captured or measured signal.</desc><rect width="1600" height="900" fill="#f5f8fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#102b46">
<text x="75" y="75" font-size="45" font-weight="700">Same period. Different HIGH time.</text>
<text x="75" y="125" font-size="27">Ideal 5000 Hz PWM: one cycle = 200 µs. Not an oscilloscope capture.</text>
<text x="80" y="220" font-size="32" font-weight="700">25% duty</text>
<text x="80" y="265" font-size="25">50 µs HIGH</text>
<path d="M440 275 H1340" stroke="#c7d7dd" stroke-width="2"/>
<polyline points="440,265 440,195 515.0,195 515.0,265 740,265 740,195 815.0,195 815.0,265 1040,265 1040,195 1115.0,195 1115.0,265 1340,265" fill="none" stroke="#08756c" stroke-width="5"/>
<path d="M440 180 V280" stroke="#b6cbd4" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M740 180 V280" stroke="#b6cbd4" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M1040 180 V280" stroke="#b6cbd4" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M1340 180 V280" stroke="#b6cbd4" stroke-width="1" stroke-dasharray="4 4"/>
<text x="1375" y="200" font-size="22">HIGH</text>
<text x="1375" y="265" font-size="22">LOW</text>
<text x="80" y="400" font-size="32" font-weight="700">50% duty</text>
<text x="80" y="445" font-size="25">100 µs HIGH</text>
<path d="M440 455 H1340" stroke="#c7d7dd" stroke-width="2"/>
<polyline points="440,445 440,375 590.0,375 590.0,445 740,445 740,375 890.0,375 890.0,445 1040,445 1040,375 1190.0,375 1190.0,445 1340,445" fill="none" stroke="#08756c" stroke-width="5"/>
<path d="M440 360 V460" stroke="#b6cbd4" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M740 360 V460" stroke="#b6cbd4" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M1040 360 V460" stroke="#b6cbd4" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M1340 360 V460" stroke="#b6cbd4" stroke-width="1" stroke-dasharray="4 4"/>
<text x="1375" y="380" font-size="22">HIGH</text>
<text x="1375" y="445" font-size="22">LOW</text>
<text x="80" y="580" font-size="32" font-weight="700">75% duty</text>
<text x="80" y="625" font-size="25">150 µs HIGH</text>
<path d="M440 635 H1340" stroke="#c7d7dd" stroke-width="2"/>
<polyline points="440,625 440,555 665.0,555 665.0,625 740,625 740,555 965.0,555 965.0,625 1040,625 1040,555 1265.0,555 1265.0,625 1340,625" fill="none" stroke="#08756c" stroke-width="5"/>
<path d="M440 540 V640" stroke="#b6cbd4" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M740 540 V640" stroke="#b6cbd4" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M1040 540 V640" stroke="#b6cbd4" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M1340 540 V640" stroke="#b6cbd4" stroke-width="1" stroke-dasharray="4 4"/>
<text x="1375" y="560" font-size="22">HIGH</text>
<text x="1375" y="625" font-size="22">LOW</text>
<text x="425" y="780" font-size="22">0 µs</text>
<text x="725" y="780" font-size="22">200 µs</text>
<text x="1025" y="780" font-size="22">400 µs</text>
<text x="1325" y="780" font-size="22">600 µs</text>
<text x="75" y="844" font-size="27" font-weight="700">The pin switches LOW/HIGH. Average effect is not a steady intermediate GPIO voltage.</text>
</g></svg>
