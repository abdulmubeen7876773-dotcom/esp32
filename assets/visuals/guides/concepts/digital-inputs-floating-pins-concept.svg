<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ESP32 Floating Pins and Digital Inputs Explained Concept Illustration</title>
<desc id="desc">ESP32 floating input concept comparing GPIO27 floating state with forced LOW at GND and forced HIGH at 3.3 V.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f718b"/></marker><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#eef6f8"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="60" y="54" width="1480" height="792" rx="34" fill="#ffffff" stroke="#d6e3ea" stroke-width="2"/>
<rect x="60" y="54" width="1480" height="118" rx="34" fill="#10233f"/>
<path d="M60 138 H1540 V172 H60 Z" fill="#10233f"/>
<text x="800" y="105" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" fill="#ffffff">ESP32 Floating Pins and Digital Inputs Explained</text>
<text x="800" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#d9f7fb">A floating GPIO is undefined until forced HIGH or LOW.</text>
<g><rect x="160" y="300" width="560" height="260" rx="24" fill="#ffffff" stroke="#b7cbd9" stroke-width="2"/><text x="440" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#10233f">Floating input</text><text x="440" y="397" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#17415a">No default HIGH or LOW</text><g><rect x="238" y="440" width="250" height="42" rx="21" fill="#e8f6f8" stroke="#a9cbd3" stroke-width="1.5"/><text x="363" y="468" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">INPUT mode</text></g><g><rect x="238" y="492" width="250" height="42" rx="21" fill="#e8f6f8" stroke="#a9cbd3" stroke-width="1.5"/><text x="363" y="520" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">No pull resistor</text></g><rect x="880" y="300" width="560" height="260" rx="24" fill="#ffffff" stroke="#b7cbd9" stroke-width="2"/><text x="1160" y="350" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#10233f">Defined input</text><text x="1160" y="397" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#17415a">Forced state is stable</text><g><rect x="958" y="440" width="250" height="42" rx="21" fill="#e8f6f8" stroke="#a9cbd3" stroke-width="1.5"/><text x="1083" y="468" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">Forced to GND = LOW</text></g><g><rect x="958" y="492" width="250" height="42" rx="21" fill="#e8f6f8" stroke="#a9cbd3" stroke-width="1.5"/><text x="1083" y="520" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">Forced to 3.3 V = HIGH</text></g><path d="M 720 430 C 790 430, 810 430, 880 430" fill="none" stroke="#0f718b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="800" y="412" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f718b">compare behavior</text></g>

<g><rect x="120" y="665" width="250" height="42" rx="21" fill="#eaf8ef" stroke="#a9cbd3" stroke-width="1.5"/><text x="245" y="693" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">INPUT mode</text></g><g><rect x="412" y="665" width="250" height="42" rx="21" fill="#eef6ff" stroke="#a9cbd3" stroke-width="1.5"/><text x="537" y="693" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">No pull resistor</text></g><g><rect x="704" y="665" width="250" height="42" rx="21" fill="#eaf8ef" stroke="#a9cbd3" stroke-width="1.5"/><text x="829" y="693" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">Forced to GND = LOW</text></g><g><rect x="996" y="665" width="250" height="42" rx="21" fill="#eef6ff" stroke="#a9cbd3" stroke-width="1.5"/><text x="1121" y="693" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">Forced to 3.3 V = HIGH</text></g><g><rect x="1288" y="665" width="250" height="42" rx="21" fill="#eaf8ef" stroke="#a9cbd3" stroke-width="1.5"/><text x="1413" y="693" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#123044">Fix with pull-up or pull-down</text></g>
<text x="800" y="810" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#5d7382">Concept illustration only: process flow, logic, and data direction. Not a wiring diagram.</text>
</svg>