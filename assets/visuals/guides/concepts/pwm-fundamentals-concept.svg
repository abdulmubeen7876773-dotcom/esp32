<text x="800" y="105" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" fill="#ffffff">ESP32 PWM Fundamentals Tutorial</text>
<text x="800" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#d9f7fb">Duty cycle changes average energy while GPIO18 still switches digitally.</text>
