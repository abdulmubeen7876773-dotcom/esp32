<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Local OTA: install, update, recover</title><desc id="desc">Conceptual diagram, not a physical pinout. FIRST INSTALL / USB + OTA partitions / Keep USB recovery; LOCAL NETWORK / Same trusted LAN / Unique OTA password; UPDATE / Next application slot / Keep stable power; VERIFY / Restart + build ID / No rollback guarantee</desc><rect width="1200" height="675" rx="32" fill="#102a43"/><text x="50" y="95" fill="#e7f5ff" font-family="sans-serif" font-size="32">Local OTA: install, update, recover</text><rect x="50" y="190" width="260" height="290" rx="20" fill="#163b54"/><text x="68" y="250" fill="#5eead4" font-family="sans-serif" font-size="25">FIRST INSTALL</text><text x="68" y="325" fill="#e7f5ff" font-family="sans-serif" font-size="20">USB + OTA partitions</text><text x="68" y="380" fill="#e7f5ff" font-family="sans-serif" font-size="17">Keep USB recovery</text><rect x="330" y="190" width="260" height="290" rx="20" fill="#163b54"/><text x="348" y="250" fill="#5eead4" font-family="sans-serif" font-size="25">LOCAL NETWORK</text><text x="348" y="325" fill="#e7f5ff" font-family="sans-serif" font-size="20">Same trusted LAN</text><text x="348" y="380" fill="#e7f5ff" font-family="sans-serif" font-size="17">Unique OTA password</text><rect x="610" y="190" width="260" height="290" rx="20" fill="#163b54"/><text x="628" y="250" fill="#5eead4" font-family="sans-serif" font-size="25">UPDATE</text><text x="628" y="325" fill="#e7f5ff" font-family="sans-serif" font-size="20">Next application slot</text><text x="628" y="380" fill="#e7f5ff" font-family="sans-serif" font-size="17">Keep stable power</text><rect x="890" y="190" width="260" height="290" rx="20" fill="#163b54"/><text x="908" y="250" fill="#5eead4" font-family="sans-serif" font-size="25">VERIFY</text><text x="908" y="325" fill="#e7f5ff" font-family="sans-serif" font-size="20">Restart + build ID</text><text x="908" y="380" fill="#e7f5ff" font-family="sans-serif" font-size="17">No rollback guarantee</text><text x="50" y="560" fill="#b9d8eb" font-family="sans-serif" font-size="24">Conceptual reference — follow the board-specific instructions below</text><text x="50" y="605" fill="#b9d8eb" font-family="sans-serif" font-size="21">Expected behavior described; physical hardware operation not verified</text></svg>