ans-serif" font-size="18" font-weight="500" fill="#0f718b">Sensor prepares data</text><path d="M 995 415 C 1065 415, 1045 415, 1115 415" fill="none" stroke="#0f718b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1055" y="397" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#0f718b">Library decodes</text></g>

