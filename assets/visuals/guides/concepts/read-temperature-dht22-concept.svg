<title id="title">ESP32 DHT22 Temperature and Humidity Sensor Tutorial Concept Illustration</title>
<desc id="desc">ESP32 DHT22 concept showing temperature and humidity data pulses on GPIO4 decoded by the ESP32.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f718b"/></marker><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#eef6f8"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="60" y="54" width="1480" height="792" rx="34" fill="#ffffff" stroke="#d6e3ea" stroke-width="2"/>
<rect x="60" y="54" width="1480" height="118" rx="34" fill="#10233f"/>
<path d="M60 138 H1540 V172 H60 Z" fill="#10233f"/>
<text x="800" y="105" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" fill="#ffffff">ESP32 DHT22 Temperature and Humidity Sensor Tutorial</text>
<text x="800" y="146" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#d9f7fb">DHT22 sends timed data pulses slowly on one GPIO.</text>
