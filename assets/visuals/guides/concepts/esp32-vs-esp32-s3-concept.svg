<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Chip capabilities are not board connectors</title><desc id="desc">Conceptual diagram, not a physical pinout. CLASSIC ESP32 / Dual-core LX6 example / Classic Bluetooth + LE; CLASSIC USB / USB-UART bridge / No native USB controller; ESP32-S3 / Dual-core LX7 / Bluetooth LE only; S3 USB / Native USB controllers / Board routing matters</desc><rect width="1200" height="675" rx="32" fill="#102a43"/><text x="50" y="95" fill="#e7f5ff" font-family="sans-serif" font-size="32">Chip capabilities are not board connectors</text><rect x="50" y="190" width="260" height="290" rx="20" fill="#163b54"/><text x="68" y="250" fill="#5eead4" font-family="sans-serif" font-size="25">CLASSIC ESP32</text><text x="68" y="325" fill="#e7f5ff" font-family="sans-serif" font-size="20">Dual-core LX6 example</text><text x="68" y="380" fill="#e7f5ff" font-family="sans-serif" font-size="17">Classic Bluetooth + LE</text><rect x="330" y="190" width="260" height="290" rx="20" fill="#163b54"/><text x="348" y="250" fill="#5eead4" font-family="sans-serif" font-size="25">CLASSIC USB</text><text x="348" y="325" fill="#e7f5ff" font-family="sans-serif" font-size="20">USB-UART bridge</text><text x="348" y="380" fill="#e7f5ff" font-family="sans-serif" font-size="17">No native USB controller</text><rect x="610" y="190" width="260" height="290" rx="20" fill="#163b54"/><text x="628" y="250" fill="#5eead4" font-family="sans-serif" font-size="25">ESP32-S3</text><text x="628" y="325" fill="#e7f5ff" font-family="sans-serif" font-size="20">Dual-core LX7</text><text x="628" y="380" fill="#e7f5ff" font-family="sans-serif" font-size="17">Bluetooth LE only</text><rect x="890" y="190" width="260" height="290" rx="20" fill="#163b54"/><text x="908" y="250" fill="#5eead4" font-family="sans-serif" font-size="25">S3 USB</text><text x="908" y="325" fill="#e7f5ff" font-family="sans-serif" font-size="20">Native USB controllers</text><text x="908" y="380" fill="#e7f5ff" font-family="sans-serif" font-size="17">Board routing matters</text><text x="50" y="560" fill="#b9d8eb" font-family="sans-serif" font-size="24">Conceptual reference — follow the board-specific instructions below</text><text x="50" y="605" fill="#b9d8eb" font-family="sans-serif" font-size="21">Expected behavior described; physical hardware operation not verified</text></svg>