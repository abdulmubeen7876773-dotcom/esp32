<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
<title id="title">Pull-up vs Pull-down Button Wiring</title>
<desc id="desc">GPIO27 comparison: external 10 kOhm pull-down and internal INPUT_PULLUP button-to-ground wiring</desc>
<rect width="1600" height="900" fill="#f6f8fb"/>
<rect x="28" y="28" width="1544" height="844" rx="30" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
<text x="800" y="74" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#102030">Pull-up vs Pull-down Button Wiring</text>
<text x="800" y="105" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#52616f">GPIO27 comparison: external 10 kOhm pull-down and internal INPUT_PULLUP button-to-ground wiring</text>
<g transform="translate(55,138) scale(0.78)"><g id="esp32"><rect x="90" y="150" width="250" height="540" rx="22" fill="#113a5c" stroke="#0a2238" stroke-width="4"/><rect x="150" y="232" width="130" height="190" rx="12" fill="#1f5f8f" stroke="#d7e7f4" stroke-width="2"/><rect x="172" y="170" width="86" height="42" rx="7" fill="#d8dde5" stroke="#8894a2" stroke-width="2"/><text x="215" y="132" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#102030">ESP32 DevKit</text><text x="215" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">ESP32-WROOM</text><text x="215" y="355" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#cde7f7">3.3 V logic</text><circle cx="340" cy="232" r="10" fill="#fff" stroke="#c1121f" stroke-width="4"/><text x="358" y="237" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#c1121f">3V3</text><circle cx="340" cy="570" r="10" fill="#fff" stroke="#111111" stroke-width="4"/><text x="358" y="575" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#111111">GND</text><circle cx="340" cy="350" r="10" fill="#fff" stroke="#e87500" stroke-width="4"/><text x="358" y="355" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#e87500">GPIO27</text><circle cx="112" cy="230" r="4" fill="#c7d2de"/><circle cx="318" cy="230" r="4" fill="#c7d2de"/><circle cx="112" cy="264" r="4" fill="#c7d2de"/><circle cx="318" cy="264" r="4" fill="#c7d2de"/><circle cx="112" cy="298" r="4" fill="#c7d2de"/><circle cx="318" cy="298" r="4" fill="#c7d2de"/><circle cx="112" cy="332" r="4" fill="#c7d2de"/><circle cx="318" cy="332" r="4" fill="#c7d2de"/><circle cx="112" cy="366" r="4" fill="#c7d2de"/><circle cx="318" cy="366" r="4" fill="#c7d2de"/><circle cx="112" cy="400" r="4" fill="#c7d2de"/><circle cx="318" cy="400" r="4" fill="#c7d2de"/><circle cx="112" cy="434" r="4" fill="#c7d2de"/><circle cx="318" cy="434" r="4" fill="#c7d2de"/><circle cx="112" cy="468" r="4" fill="#c7d2de"/><circle cx="318" cy="468" r="4" fill="#c7d2de"/><circle cx="112" cy="502" r="4" fill="#c7d2de"/><circle cx="318" cy="502" r="4" fill="#c7d2de"/><circle cx="112" cy="536" r="4" fill="#c7d2de"/><circle cx="318" cy="536" r="4" fill="#c7d2de"/><circle cx="112" cy="570" r="4" fill="#c7d2de"/><circle cx="318" cy="570" r="4" fill="#c7d2de"/><circle cx="112" cy="604" r="4" fill="#c7d2de"/><circle cx="318" cy="604" r="4" fill="#c7d2de"/></g></g><rect x="410" y="170" width="500" height="580" rx="22" fill="#fbfcfd" stroke="#d7dee8" stroke-width="3"/><text x="660" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#102030">Example A: external pull-down</text><g><rect x="550" y="313" width="140" height="84" rx="14" fill="#e8edf3" stroke="#4b5563" stroke-width="3"/><circle cx="620" cy="355" r="25" fill="#c7d2de" stroke="#667085" stroke-width="3"/><line x1="528" y1="333" x2="550" y2="333" stroke="#333" stroke-width="5"/><line x1="690" y1="377" x2="712" y2="377" stroke="#333" stroke-width="5"/><text x="620" y="297" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#26313d">Button to 3.3 V</text></g><g><line x1="700" y1="485" x2="726" y2="485" stroke="#444" stroke-width="5"/><rect x="726" y="472" width="68" height="26" rx="12" fill="#e6c98f" stroke="#5c4b2d" stroke-width="2"/><line x1="794" y1="485" x2="820" y2="485" stroke="#444" stroke-width="5"/><rect x="742" y="472" width="5" height="26" fill="#8b5a2b"/><rect x="758" y="472" width="5" height="26" fill="#111"/><rect x="774" y="472" width="5" height="26" fill="#d6a400"/><text x="760" y="461" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2c3138">10 kOhm</text></g><path d="M420 370 C480 360, 535 350, 528 333" fill="none" stroke="#c1121f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="342" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#c1121f">3.3 V</text><path d="M712 377 C735 425, 740 455, 700 485" fill="none" stroke="#e87500" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M325 412 C435 430, 540 472, 700 485" fill="none" stroke="#e87500" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="455" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#e87500">GPIO27 node</text><path d="M820 485 C840 585, 720 652, 500 650" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="705" y="625" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#111111">10 kOhm to GND</text><rect x="520" y="565" width="300" height="86" rx="10" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/><text x="534" y="589" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#17212b">Released = LOW</text><text x="534" y="607" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#52616f">Pressed = HIGH</text><rect x="960" y="170" width="500" height="580" rx="22" fill="#fbfcfd" stroke="#d7dee8" stroke-width="3"/><text x="1210" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#102030">Example B: internal pull-up</text><g><rect x="1090" y="353" width="140" height="84" rx="14" fill="#e8edf3" stroke="#4b5563" stroke-width="3"/><circle cx="1160" cy="395" r="25" fill="#c7d2de" stroke="#667085" stroke-width="3"/><line x1="1068" y1="373" x2="1090" y2="373" stroke="#333" stroke-width="5"/><line x1="1230" y1="417" x2="1252" y2="417" stroke="#333" stroke-width="5"/><text x="1160" y="337" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#26313d">Button to GND</text></g><path d="M325 412 C510 230, 840 330, 1068 373" fill="none" stroke="#e87500" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="790" y="305" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#e87500">GPIO27 INPUT_PULLUP</text><path d="M1252 417 C1310 565, 1180 650, 1030 650" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="1290" y="580" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#111111">GND</text><rect x="1110" y="540" width="285" height="86" rx="10" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/><text x="1124" y="564" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#17212b">Released = HIGH</text><text x="1124" y="582" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#52616f">Pressed = LOW</text><rect x="1120" y="250" width="300" height="78" rx="10" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/><text x="1134" y="274" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#17212b">Pull-up is inside ESP32</text><text x="1134" y="292" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#52616f">Do not draw external resistor here</text>
</svg>
