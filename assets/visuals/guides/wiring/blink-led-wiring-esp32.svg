<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">External LED circuit for classic ESP32 GPIO2</title><desc id="desc">GPIO2 connects through a 220 ohm resistor to a red LED anode. LED cathode connects to ESP32 ground. USB powers the board; no connection to 5 V. This is a logical circuit, not physical pin positions.</desc>
<style>text{font:21px Arial,sans-serif;fill:#0f172a}.head{font-size:27px;font-weight:bold}.wire{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="960" height="540" rx="16" fill="#fff"/>
<text x="40" y="48" class="head">Blink: external red LED on GPIO2</text><text x="40" y="88">Classic ESP32-WROOM DevKit; logical circuit</text>
<rect x="40" y="150" width="245" height="210" rx="12" fill="#eff6ff" stroke="#334155"/>
<text x="60" y="190" class="head">ESP32</text><text x="60" y="243">GPIO2</text><text x="60" y="323">GND</text><text x="60" y="350">USB power</text>
<path d="M285 235 H390 M450 235 H580" class="wire"/>
<rect x="390" y="218" width="60" height="34" fill="#fef3c7" stroke="#334155" stroke-width="3"/>
<text x="355" y="190">220 Ω resistor</text>
<path d="M580 213 L580 257 L623 235 Z" fill="#ef4444" stroke="#334155" stroke-width="3"/>
<path d="M623 212 V258 M623 235 H755 V315 H285" class="wire"/>
<path d="M602 205 L625 182 M621 209 L644 186" stroke="#b91c1c" stroke-width="3"/>
<path d="M618 182 H625 V189 M637 186 H644 V193" fill="none" stroke="#b91c1c" stroke-width="3"/>
<text x="525" y="286">Anode (+)</text><text x="655" y="352">Cathode (−)</text>
<text x="665" y="190">Red LED</text>
<text x="40" y="411">HIGH → LED on; LOW → LED off. No onboard LED required.</text>
<text x="40" y="451">GPIO2 → resistor → LED anode → cathode → GND</text>
<text x="40" y="493">Unplug USB before rewiring. Never connect 5 V to GPIO.</text>
</svg>