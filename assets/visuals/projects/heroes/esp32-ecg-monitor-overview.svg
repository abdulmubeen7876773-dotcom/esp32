<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Arial, sans-serif" role="img" aria-labelledby="title"><title id="title">AD8232 bench signal viewer: conceptual data flow</title><rect width="1600" height="900" fill="#0d2d28"/><rect x="55" y="55" width="1490" height="790" rx="30" fill="#143f36" stroke="#70ceb7" stroke-width="3"/><text x="105" y="170" font-size="54" font-weight="bold" fill="#f7fbf8">AD8232 bench signal viewer</text><text x="105" y="240" font-size="32" font-weight="normal" fill="#bce8db">All electrode ports remain disconnected</text><rect x="105" y="330" width="420" height="220" rx="18" fill="#eff7f3"/><text x="135" y="412" font-size="43" font-weight="bold" fill="#143f36">AD8232</text><text x="135" y="478" font-size="28" font-weight="normal" fill="#143f36">OUTPUT + LO flags</text><text x="540" y="455" font-size="45" font-weight="bold" fill="#bce8db">→</text><rect x="590" y="330" width="420" height="220" rx="18" fill="#eff7f3"/><text x="620" y="412" font-size="43" font-weight="bold" fill="#143f36">ESP32 ADC1</text><text x="620" y="478" font-size="28" font-weight="normal" fill="#143f36">Actual raw counts</text><text x="1025" y="455" font-size="45" font-weight="bold" fill="#bce8db">→</text><rect x="1075" y="330" width="420" height="220" rx="18" fill="#eff7f3"/><text x="1105" y="412" font-size="43" font-weight="bold" fill="#143f36">USB Serial</text><text x="1105" y="478" font-size="28" font-weight="normal" fill="#143f36">Non-body-connected</text><text x="105" y="660" font-size="32" font-weight="bold" fill="#f7fbf8">No electrodes  •  No patient interface  •  No measured ECG</text><text x="105" y="760" font-size="27" font-weight="normal" fill="#bce8db">Logical illustration — not a hardware photo, screenshot or recorded result</text></svg>
