<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>ESP32 Telegram Motion Notifications logical wiring</title><rect width="1200" height="800" rx="24" fill="#0b1d32"/><g font-family="Arial,sans-serif" fill="#f4f8ff"><text x="45" y="65" font-size="30">Telegram Motion Notifications</text><text x="45" y="110" font-size="22" fill="#c0d6e8">Logical connections only — verify actual module terminal labels</text><text x="45" y="200" font-size="24">Regulated external 5 V</text><path d="M435 193 H540" stroke="#8bd6e4" stroke-width="4"/><text x="570" y="200" font-size="24">Selected PIR + supply</text><text x="570" y="234" font-size="19" fill="#c0d6e8">Adafruit #189, not an unknown clone</text><text x="45" y="300" font-size="24">5 V minus + ESP32 GND</text><path d="M435 293 H540" stroke="#8bd6e4" stroke-width="4"/><text x="570" y="300" font-size="24">PIR GND</text><text x="570" y="334" font-size="19" fill="#c0d6e8">Share ground; do not join positive rails</text><text x="45" y="400" font-size="24">GPIO27</text><path d="M435 393 H540" stroke="#8bd6e4" stroke-width="4"/><text x="570" y="400" font-size="24">PIR OUT</text><text x="570" y="434" font-size="19" fill="#c0d6e8">Documented 3.3 V output; verify module</text><text x="45" y="500" font-size="24">USB data cable</text><path d="M435 493 H540" stroke="#8bd6e4" stroke-width="4"/><text x="570" y="500" font-size="24">ESP32 power</text><text x="570" y="534" font-size="19" fill="#c0d6e8">No relay, buzzer or actuator attached</text><text x="45" y="740" font-size="22" fill="#c0d6e8">Disconnect power before rewiring. Not a physical pinout or verified build.</text></g></svg>