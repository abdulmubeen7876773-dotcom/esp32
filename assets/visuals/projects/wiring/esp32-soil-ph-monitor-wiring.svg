<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1000" role="img" aria-labelledby="title desc">
<title id="title">Two-buffer pH lesson — logical interface</title>
<desc id="desc">Not a physical connector layout or tested circuit. Separate regulated module supply, common ground and divided signal to ADC1 GPIO34.</desc>
<rect width="1100" height="1000" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172b3a">
<text x="45" y="42" font-size="28">Two-buffer pH lesson — supported logical circuit</text>
<text x="45" y="78" font-size="18">Classic ESP32-WROOM DevKit / Arduino-ESP32 3.3.2; identify actual connector labels.</text>
<rect x="50" y="110" width="340" height="100" rx="12" fill="#edf8f4" stroke="#12614f" stroke-width="2"/>
<text x="70" y="145" font-size="18">External regulated 5.0 V ±5%</text>
<text x="70" y="177" font-size="18">Module supply only; not GPIO power</text>
<rect x="50" y="270" width="340" height="135" rx="12" fill="#edf8f4" stroke="#12614f" stroke-width="2"/>
<text x="70" y="303" font-size="20">SEN0161-V2 + liquid pH probe</text>
<text x="70" y="335" font-size="18">VCC (+) / GND (−) / AOUT (A)</text>
<text x="70" y="372" font-size="18">Probe → BNC; board/BNC stay dry</text>
<rect x="770" y="270" width="285" height="135" rx="12" fill="#eef4fc" stroke="#244a78" stroke-width="2"/>
<text x="788" y="303" font-size="20">Classic ESP32 DevKit</text>
<text x="788" y="335" font-size="18">USB power / 3.3 V GPIO logic</text>
<text x="788" y="372" font-size="18">GPIO34 = ADC1 input only</text>
<g fill="none" stroke-width="3">
<path d="M220 210 V270" stroke="#b74813"/>
<path d="M80 210 H25 V525 H220" stroke="#293844"/>
<path d="M390 350 H440 M540 350 H770" stroke="#245bb1"/>
<path d="M220 405 V525 H910 V405 M650 475 V525 M590 475 V525" stroke="#293844"/>
<path d="M650 350 V400 M590 350 V425 M590 440 V475" stroke="#293844"/>
<path d="M570 425 H610 M570 440 H610" stroke="#293844"/>
</g>
<rect x="440" y="334" width="100" height="32" fill="#fff" stroke="#245bb1" stroke-width="3"/>
<text x="452" y="357" font-size="18">15 kΩ</text>
<rect x="634" y="400" width="32" height="75" fill="#fff" stroke="#293844" stroke-width="3"/>
<text x="682" y="442" font-size="18">10 kΩ</text>
<text x="487" y="458" font-size="18">100 nF</text>
<circle cx="650" cy="350" r="5" fill="#245bb1"/><circle cx="590" cy="350" r="5" fill="#245bb1"/>
<text x="408" y="315" font-size="18">AOUT → 15 kΩ → ADC node → GPIO34</text>
<text x="235" y="249" font-size="18">+5 V</text>
<text x="245" y="548" font-size="16">Common GND: module, divider, capacitor, ESP32, supply minus</text>
<text x="45" y="580" font-size="18">Both resistors 1%. Never join external +5 V to USB/DevKit positive rails.</text>
<text x="45" y="610" font-size="18">Power USB and module together while connected; switch both off before rewiring.</text>
<text x="45" y="665" font-size="18">BNC liquid probe only: never connect a bare pH electrode directly to ADC.</text>
<text x="45" y="703" font-size="18">Record actual pin-mV in both buffers; no supplied calibration numbers.</text>
<text x="45" y="741" font-size="18">pH only within the recorded interval; no temperature compensation.</text>
<text x="45" y="779" font-size="18">Invalid/unrecorded/outside-buffer signal → no calculated pH.</text>
<text x="45" y="965" font-size="17">Logical illustration, not physical pin order, observed output or hardware validation.</text>
</g></svg>
