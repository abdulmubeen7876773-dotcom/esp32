<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Weather Clock: shared 3.3 V I2C bus</title><desc id="desc">Logical connections; verify module pin order and supply compatibility. Both devices share SDA/SCL; arrows show the signal flow, not a series connection. Bus pull-ups must go to 3.3 V. Follow the breakout CSB/SDO documentation. Unplug USB before rewiring. This build does not use an online weather forecast.</desc><rect width="1200" height="800" rx="24" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="40" y="58" font-size="30" font-weight="bold">Weather Clock: shared 3.3 V I2C bus</text><text x="40" y="96" font-size="20">Logical connections; verify module pin order and supply compatibility.</text><rect x="40" y="150" width="340" height="380" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="60" y="194" font-size="23" font-weight="bold">ESP32-WROOM DevKit</text><text x="60" y="238" font-size="20">USB → board power</text><text x="60" y="276" font-size="20">3.3 V → module supplies</text><text x="60" y="314" font-size="20">GND → both grounds</text><text x="60" y="352" font-size="20">GPIO21 → both SDA</text><text x="60" y="390" font-size="20">GPIO22 → both SCL</text><path d="M384 335h38m-10-10 10 10-10 10" fill="none" stroke="#0369a1" stroke-width="4"/><rect x="430" y="150" width="340" height="380" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="450" y="194" font-size="23" font-weight="bold">SSD1306 OLED</text><text x="450" y="238" font-size="20">128 × 64 I2C module</text><text x="450" y="276" font-size="20">VCC/VIN → 3.3 V</text><text x="450" y="314" font-size="20">GND → common GND</text><text x="450" y="352" font-size="20">SDA → GPIO21</text><text x="450" y="390" font-size="20">SCL → GPIO22</text><text x="450" y="428" font-size="20">Scan 0x3C / 0x3D</text><path d="M774 335h38m-10-10 10 10-10 10" fill="none" stroke="#0369a1" stroke-width="4"/><rect x="820" y="150" width="340" height="380" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="840" y="194" font-size="23" font-weight="bold">BME280 breakout</text><text x="840" y="238" font-size="20">VCC/VIN → 3.3 V</text><text x="840" y="276" font-size="20">GND → common GND</text><text x="840" y="314" font-size="20">SDA/SDI → GPIO21</text><text x="840" y="352" font-size="20">SCL/SCK → GPIO22</text><text x="840" y="390" font-size="20">CSB high: I2C mode</text><text x="840" y="428" font-size="20">SDO: 0x76 / 0x77</text><text x="40" y="585" font-size="21">Both devices share SDA/SCL; arrows show the signal flow, not a series connection.</text><text x="40" y="621" font-size="21">Bus pull-ups must go to 3.3 V. Follow the breakout CSB/SDO documentation.</text><text x="40" y="657" font-size="21">Unplug USB before rewiring. This build does not use an online weather forecast.</text></g></svg>
