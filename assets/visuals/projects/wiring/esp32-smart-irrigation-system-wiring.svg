<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1074" role="img" aria-labelledby="title desc">
<title id="title">ESP32 supervised irrigation — SEN0193 + STEMMA 4409</title>
<desc id="desc">Logical connection reference, not physical connector orientation. Follow exact module labels.</desc>
<rect width="1200" height="1074" rx="20" fill="#edf3f7"/>
<g font-family="Arial, sans-serif" fill="#14283a">
<text x="40" y="52" font-size="30" font-weight="700">ESP32 supervised irrigation — SEN0193 + STEMMA 4409</text>
<text x="40" y="90" font-size="21">Logical connections only — verify actual terminal labels. Disconnect power to rewire.</text>
<rect x="30" y="120" width="1140" height="197" rx="12" fill="#fff" stroke="#577387"/>
<text x="50" y="155" font-size="25" font-weight="700">Sensor side: selected SEN0193 only</text>
<text x="50" y="195" font-size="22">ESP32 3V3</text>
<path d="M535 188h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="195" font-size="22">SEN0193 VCC</text>
<text x="50" y="239" font-size="22">ESP32 GND</text>
<path d="M535 232h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="239" font-size="22">SEN0193 GND</text>
<text x="50" y="283" font-size="22">SEN0193 OUT (0–3.0 V)</text>
<path d="M535 276h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="283" font-size="22">GPIO34 / ADC1</text>
<rect x="30" y="342" width="1140" height="241" rx="12" fill="#fff" stroke="#577387"/>
<text x="50" y="377" font-size="25" font-weight="700">Relay control: active HIGH; USB powers ESP32 separately</text>
<text x="50" y="417" font-size="22">External regulated +5 V</text>
<path d="M535 410h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="417" font-size="22">STEMMA Vin</text>
<text x="50" y="461" font-size="22">External supply −</text>
<path d="M535 454h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="461" font-size="22">STEMMA GND + ESP32 GND</text>
<text x="50" y="505" font-size="22">GPIO26</text>
<path d="M535 498h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="505" font-size="22">STEMMA Signal</text>
<text x="50" y="549" font-size="22">10 kΩ resistor</text>
<path d="M535 542h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="549" font-size="22">Signal to control GND</text>
<rect x="30" y="608" width="1140" height="241" rx="12" fill="#fff" stroke="#577387"/>
<text x="50" y="643" font-size="25" font-weight="700">Separate low-voltage pump circuit (not breadboard power wiring)</text>
<text x="50" y="683" font-size="22">Separate regulated 3 V +, fused</text>
<path d="M535 676h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="683" font-size="22">Relay COM</text>
<text x="50" y="727" font-size="22">Relay NO</text>
<path d="M535 720h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="727" font-size="22">Pump +</text>
<text x="50" y="771" font-size="22">Pump −</text>
<path d="M535 764h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="771" font-size="22">Pump supply −</text>
<text x="50" y="815" font-size="22">Flyback diode across brushed pump</text>
<path d="M535 808h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="815" font-size="22">Stripe/cathode at +; anode at −</text>
<text x="40" y="894" font-size="20">NC unused. Pump return need not join control ground through isolated contacts.</text>
<text x="40" y="929" font-size="20">Adafruit #4547 pump: keep inlet submerged. Verify stall current, fuse and DC contact rating.</text>
<text x="40" y="964" font-size="20">Keep external +5 V off the USB-powered board positive. No mains. Keep wiring dry.</text>
<text x="40" y="999" font-size="20">Default calibration-only mode holds OFF. Firmware OFF does not isolate welded contacts.</text>
</g></svg>
