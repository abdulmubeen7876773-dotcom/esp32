<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>ESP32 Browser LED On and Off Control logical wiring</title><rect width="1200" height="800" rx="24" fill="#0b1d32"/><g font-family="Arial,sans-serif" fill="#f4f8ff"><text x="45" y="65" font-size="30">Browser LED On and Off Control</text><text x="45" y="110" font-size="22" fill="#c0d6e8">Electrical relationships only — verify actual terminal orientation</text><text x="45" y="200" font-size="24">GPIO25</text><path d="M435 193 H540" stroke="#8bd6e4" stroke-width="4"/><circle cx="435" cy="193" r="6" fill="#8bd6e4"/><text x="570" y="200" font-size="24">470 Ω resistor → LED anode</text><text x="570" y="234" font-size="19" fill="#c0d6e8">Series path; LED cathode returns to GND</text><text x="45" y="300" font-size="24">GND</text><path d="M435 293 H540" stroke="#8bd6e4" stroke-width="4"/><circle cx="435" cy="293" r="6" fill="#8bd6e4"/><text x="570" y="300" font-size="24">LED cathode</text><text x="570" y="334" font-size="19" fill="#c0d6e8">Verify actual LED polarity</text><text x="45" y="400" font-size="24">USB data cable</text><path d="M435 393 H540" stroke="#8bd6e4" stroke-width="4"/><circle cx="435" cy="393" r="6" fill="#8bd6e4"/><text x="570" y="400" font-size="24">DevKit power</text><text x="570" y="434" font-size="19" fill="#c0d6e8">No onboard LED or 5 V signal assumed</text><text x="45" y="740" font-size="22" fill="#c0d6e8">Unplug power before wiring. No mains wiring. No verified physical layout implied.</text></g></svg>