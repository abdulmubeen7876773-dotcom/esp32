<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1230" role="img" aria-labelledby="title desc">
<title id="title">MQ135: bare-sensor ESP32 interface</title>
<desc id="desc">Classic ESP32-WROOM DevKit • regulated 5.0 V ±0.1 V heater/loop • no breakout DOUT</desc>
<rect width="1200" height="1230" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173c32;font-size:20px}.small{font-size:18px}.heading{font-size:28px;font-weight:700}.label{font-weight:700}.wire{fill:none;stroke:#17644d;stroke-width:3;stroke-linejoin:round}.power{stroke:#a33723}.ground{stroke:#334155}.box{fill:#f1f7f3;stroke:#17644d;stroke-width:2}</style>
<text x="40" y="45" class="heading">MQ135: bare-sensor ESP32 interface</text>
<text x="40" y="80" class="small">Classic ESP32-WROOM DevKit • regulated 5.0 V ±0.1 V heater/loop • no breakout DOUT</text>
<rect x="40" y="115" width="390" height="160" rx="8" class="box"/>
<text x="56" y="145" class="label">Bare Winsen six-pin sensor</text>
<text x="56" y="175" class="small">H pair across external 5 V / GND</text>
<text x="56" y="202" class="small">Both A pins to external 5 V</text>
<text x="56" y="229" class="small">Both B pins joined: RAW</text>
<text x="56" y="256" class="small">Pin orientation: manufacturer drawing</text>
<rect x="770" y="115" width="385" height="160" rx="8" class="box"/>
<text x="786" y="145" class="label">Power boundary</text>
<text x="786" y="175" class="small">External 5 V supply: ≥500 mA</text>
<text x="786" y="202" class="small">4.5 V rail ≥200 mA; ESP32 USB</text>
<text x="786" y="229" class="small">Common GND; do not join + rails</text>
<text x="786" y="256" class="small">USB ON first; external OFF first</text>
<text x="45" y="325" class="label">Sensing and divider network (both grounds are the same common net)</text>
<text x="40" y="375" class="">5 V</text>
<polyline points="90,370 130,370" class="wire "/>
<rect x="130" y="340" width="220" height="85" rx="8" class="box"/>
<text x="146" y="370" class="label">A — sensor Rs — B</text>
<text x="146" y="400" class="small">H heater is separate</text>
<polyline points="350,370 435,370" class="wire "/>
<circle cx="435" cy="370" r="5" fill="#17644d"/>
<text x="380" y="345" class="">RAW</text>
<polyline points="435,370 510,370" class="wire "/>
<rect x="510" y="356" width="130" height="28" fill="white" stroke="#17644d" stroke-width="2"/>
<text x="510" y="346" class="small">12 kΩ, 1%</text>
<polyline points="640,370 760,370 1020,370" class="wire "/>
<circle cx="760" cy="370" r="5" fill="#17644d"/>
<text x="910" y="345" class="">GPIO34 / ADC1</text>
<polyline points="435,370 435,455" class="wire "/>
<rect x="345" y="455" width="180" height="72" rx="8" class="box"/>
<text x="361" y="485" class="label">RL = 10 kΩ</text>
<polyline points="435,527 435,565" class="wire "/>
<text x="400" y="595" class="">GND</text>
<polyline points="760,370 760,455" class="wire "/>
<rect x="655" y="455" width="210" height="72" rx="8" class="box"/>
<text x="671" y="485" class="label">10 kΩ, 1%</text>
<polyline points="760,527 760,565" class="wire "/>
<text x="725" y="595" class="">GND</text>
<polyline points="1020,370 1020,455" class="wire "/>
<rect x="910" y="455" width="220" height="72" rx="8" class="box"/>
<text x="926" y="485" class="label">100 nF to GND</text>
<polyline points="1020,527 1020,565" class="wire "/>
<text x="985" y="595" class="">GND</text>
<text x="40" y="640" class="label">RAW ≤5.1 V: worst case 5.1 × 10.1/(11.88+10.1) = 2.344 V at GPIO34.</text>
<text x="40" y="670" class="small">11 dB classic ESP32 ADC range ≈0.15–3.10 V; no 5 V-tolerant GPIO or fault-proof protection.</text>
<text x="40" y="725" class="label">GPIO26 controls only the supported relay input, never a bare coil or fan.</text>
<rect x="40" y="770" width="390" height="145" rx="8" class="box"/>
<text x="56" y="800" class="label">ESP32 control / reset state</text>
<text x="56" y="830" class="small">GPIO26 → relay signal</text>
<text x="56" y="857" class="small">10 kΩ signal → GND</text>
<text x="56" y="884" class="small">LOW/OFF at startup; HIGH = ON</text>
<polyline points="430,810 650,810" class="wire "/>
<text x="455" y="790" class="">3.3 V signal</text>
<rect x="650" y="770" width="505" height="145" rx="8" class="box"/>
<text x="666" y="800" class="label">Adafruit STEMMA relay 4409</text>
<text x="666" y="830" class="small">V+ → separate 4.5 V ±5%; GND → common GND</text>
<text x="666" y="857" class="small">Built-in driver; active HIGH</text>
<text x="666" y="884" class="small">NC unused; contacts separate from logic</text>
<rect x="40" y="965" width="1115" height="150" rx="8" class="box"/>
<text x="56" y="995" class="label">Only the isolated low-voltage contact load below is supported</text>
<text x="56" y="1025" class="small">3 V battery + → COM; NO → 330 Ω → red LED anode</text>
<text x="56" y="1052" class="small">LED cathode → that battery minus. No connection from battery + to ESP32.</text>
<text x="56" y="1079" class="small">No motor, mains circuit or ventilation safety function is demonstrated.</text>
<text x="40" y="1182" class="small">Logical nets only: identify actual terminals using the selected manufacturer/package view.</text>
</svg>
