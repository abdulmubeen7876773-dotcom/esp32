<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Three FS90 servo bench with biased joystick inputs</title><desc id="desc">Logical connections, not physical pin orientation or verified hardware.</desc><rect width="100%" height="100%" fill="#fff"/>
<text x="35" y="45" font-family="Arial,sans-serif" font-size="30" fill="#153f38" font-weight="700">Three-servo bench: no startup sweep or homing</text>
<text x="35" y="82" font-family="Arial,sans-serif" font-size="21" fill="#153f38">Classic WROOM / core 3.3.2 / three documented FEETECH FS90 positional servos</text>
<text x="35" y="116" font-family="Arial,sans-serif" font-size="19" fill="#153f38">Logical nets, not connector order. Remove horns/load and restrain cases before applying servo power.</text>
<rect x="35" y="145" width="1130" height="95" rx="12" fill="#edf7f2" stroke="#326e60" stroke-width="2"/>
<text x="55" y="178" font-family="Arial,sans-serif" font-size="24" fill="#153f38" font-weight="700">1500 µs is a requested center region, NOT a measured home.</text>
<text x="55" y="211" font-family="Arial,sans-serif" font-size="20" fill="#153f38">Enable can move immediately. Commands stay 1400–1600 µs; no mechanical travel is validated.</text>
<text x="35" y="280" font-family="Arial,sans-serif" font-size="24" fill="#153f38" font-weight="700">1. Signal channels — FS90 supplier supports 3.3 V control</text>
<text x="45" y="330" font-family="Arial,sans-serif" font-size="22" fill="#153f38" font-weight="700">GPIO13</text>
<path d="M180,323 L900,323" fill="none" stroke="#326e60" stroke-width="3"/>
<text x="920" y="330" font-family="Arial,sans-serif" font-size="21" fill="#153f38" font-weight="700">Base signal</text>
<circle cx="550" cy="323" r="5" fill="#326e60"/>
<path d="M550,323 L550,335" fill="none" stroke="#326e60" stroke-width="3"/>
<rect x="540" y="335" width="20" height="35" fill="#fff" stroke="#326e60" stroke-width="2"/>
<path d="M550,370 L550,380" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M550,380 L550,390" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M538.0,390 L562.0,390" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M542.0,397 L558.0,397" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M546.0,404 L554.0,404" fill="none" stroke="#326e60" stroke-width="3"/>
<text x="585" y="360" font-family="Arial,sans-serif" font-size="19" fill="#153f38">10kΩ to GND</text>
<text x="45" y="440" font-family="Arial,sans-serif" font-size="22" fill="#153f38" font-weight="700">GPIO16</text>
<path d="M180,433 L900,433" fill="none" stroke="#326e60" stroke-width="3"/>
<text x="920" y="440" font-family="Arial,sans-serif" font-size="21" fill="#153f38" font-weight="700">Shoulder signal</text>
<circle cx="550" cy="433" r="5" fill="#326e60"/>
<path d="M550,433 L550,445" fill="none" stroke="#326e60" stroke-width="3"/>
<rect x="540" y="445" width="20" height="35" fill="#fff" stroke="#326e60" stroke-width="2"/>
<path d="M550,480 L550,490" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M550,490 L550,500" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M538.0,500 L562.0,500" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M542.0,507 L558.0,507" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M546.0,514 L554.0,514" fill="none" stroke="#326e60" stroke-width="3"/>
<text x="585" y="470" font-family="Arial,sans-serif" font-size="19" fill="#153f38">10kΩ to GND</text>
<text x="45" y="550" font-family="Arial,sans-serif" font-size="22" fill="#153f38" font-weight="700">GPIO17</text>
<path d="M180,543 L900,543" fill="none" stroke="#326e60" stroke-width="3"/>
<text x="920" y="550" font-family="Arial,sans-serif" font-size="21" fill="#153f38" font-weight="700">Elbow signal</text>
<circle cx="550" cy="543" r="5" fill="#326e60"/>
<path d="M550,543 L550,555" fill="none" stroke="#326e60" stroke-width="3"/>
<rect x="540" y="555" width="20" height="35" fill="#fff" stroke="#326e60" stroke-width="2"/>
<path d="M550,590 L550,600" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M550,600 L550,610" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M538.0,610 L562.0,610" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M542.0,617 L558.0,617" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M546.0,624 L554.0,624" fill="none" stroke="#326e60" stroke-width="3"/>
<text x="585" y="580" font-family="Arial,sans-serif" font-size="19" fill="#153f38">10kΩ to GND</text>
<rect x="35" y="645" width="1130" height="155" rx="12" fill="#edf7f2" stroke="#326e60" stroke-width="2"/>
<text x="55" y="679" font-family="Arial,sans-serif" font-size="24" fill="#153f38" font-weight="700">2. Power distribution — separate positive rails, common ground</text>
<text x="55" y="715" font-family="Arial,sans-serif" font-size="20" fill="#153f38">External switched regulated 5 V / 3 A source + → all three servo positive terminals.</text>
<text x="55" y="748" font-family="Arial,sans-serif" font-size="20" fill="#153f38">Servo returns → supply minus directly. Join minus to ESP32 GND; never to USB/3V3 positive.</text>
<text x="55" y="780" font-family="Arial,sans-serif" font-size="20" fill="#153f38">470 µF ≥10 V bulk cap across external rail, positive to +5 V. Not a supply substitute.</text>
<text x="35" y="845" font-family="Arial,sans-serif" font-size="24" fill="#153f38" font-weight="700">3. Passive joysticks — three identical ADC node networks</text>
<text x="35" y="880" font-family="Arial,sans-serif" font-size="19" fill="#153f38">COM-09032 pot ends → ESP32 3V3 / GND. Identify each wiper by an unpowered resistance check.</text>
<rect x="35" y="905" width="1130" height="335" rx="12" fill="#edf7f2" stroke="#326e60" stroke-width="2"/>
<text x="55" y="940" font-family="Arial,sans-serif" font-size="22" fill="#153f38" font-weight="700">Repeat this exact network for each used axis:</text>
<text x="55" y="976" font-family="Arial,sans-serif" font-size="21" fill="#153f38">Joystick 1 X → GPIO34     Joystick 1 Y → GPIO35     Joystick 2 X → GPIO36 (VP)</text>
<text x="60" y="1040" font-family="Arial,sans-serif" font-size="21" fill="#153f38" font-weight="700">Wiper</text>
<path d="M150,1033 L290,1033" fill="none" stroke="#326e60" stroke-width="3"/>
<rect x="290" y="1023" width="75" height="20" fill="#fff" stroke="#326e60" stroke-width="2"/>
<text x="302" y="1011" font-family="Arial,sans-serif" font-size="19" fill="#153f38">1kΩ</text>
<path d="M365,1033 L965,1033" fill="none" stroke="#326e60" stroke-width="3"/>
<text x="985" y="1040" font-family="Arial,sans-serif" font-size="21" fill="#153f38" font-weight="700">ADC pin</text>
<circle cx="570" cy="1033" r="5" fill="#326e60"/>
<path d="M570,1033 L570,1080" fill="none" stroke="#326e60" stroke-width="3"/>
<rect x="558" y="1080" width="24" height="45" fill="#fff" stroke="#326e60" stroke-width="2"/>
<path d="M570,1125 L570,1175" fill="none" stroke="#326e60" stroke-width="3"/>
<text x="450" y="1110" font-family="Arial,sans-serif" font-size="19" fill="#153f38">100kΩ</text>
<circle cx="790" cy="1033" r="5" fill="#326e60"/>
<path d="M790,1033 L790,1090" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M765,1090 L815,1090" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M765,1103 L815,1103" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M790,1103 L790,1175" fill="none" stroke="#326e60" stroke-width="3"/>
<text x="835" y="1105" font-family="Arial,sans-serif" font-size="19" fill="#153f38">100 nF</text>
<path d="M570,1175 L790,1175" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M680,1175 L680,1185" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M668.0,1185 L692.0,1185" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M672.0,1192 L688.0,1192" fill="none" stroke="#326e60" stroke-width="3"/>
<path d="M676.0,1199 L684.0,1199" fill="none" stroke="#326e60" stroke-width="3"/>
<text x="55" y="1220" font-family="Arial,sans-serif" font-size="19" fill="#153f38">Bias/filter lives at the ADC pin. Range checks cannot detect every disconnected or faulty input.</text>
<rect x="35" y="1270" width="1130" height="185" rx="12" fill="#edf7f2" stroke="#326e60" stroke-width="2"/>
<text x="55" y="1305" font-family="Arial,sans-serif" font-size="23" fill="#153f38" font-weight="700">4. Enable button: GPIO27 → bare momentary switch → GND</text>
<text x="55" y="1340" font-family="Arial,sans-serif" font-size="19" fill="#153f38">INPUT_PULLUP; release once, center axes, hold button and send A over USB Serial (115200).</text>
<text x="55" y="1373" font-family="Arial,sans-serif" font-size="20" fill="#153f38">Release, X, axis fault or 10 s lease removes pulses only; external servo power remains.</text>
<text x="55" y="1406" font-family="Arial,sans-serif" font-size="20" fill="#153f38" font-weight="700">No shaft feedback, limit switches, homing, load support or independent emergency stop.</text>
<text x="55" y="1437" font-family="Arial,sans-serif" font-size="19" fill="#153f38">Unused joystick wiper/click switches remain unconnected. No 5 V joystick signal.</text>
</svg>
