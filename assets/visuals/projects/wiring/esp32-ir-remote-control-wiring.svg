<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">IR remote: receiver and transistor-driven emitter</title>
<desc id="desc">Classic ESP32-WROOM • Vishay TSOP38238 + TSAL6200 • onsemi P2N2222A TO-92</desc>
<rect width="1200" height="1000" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173c32;font-size:20px}.small{font-size:18px}.heading{font-size:28px;font-weight:700}.label{font-weight:700}.wire{fill:none;stroke:#17644d;stroke-width:3;stroke-linejoin:round}.power{stroke:#a33723}.ground{stroke:#334155}.box{fill:#f1f7f3;stroke:#17644d;stroke-width:2}</style>
<text x="40" y="45" class="heading">IR remote: receiver and transistor-driven emitter</text>
<text x="40" y="80" class="small">Classic ESP32-WROOM • Vishay TSOP38238 + TSAL6200 • onsemi P2N2222A TO-92</text>
<rect x="40" y="125" width="535" height="180" rx="8" class="box"/>
<text x="56" y="155" class="label">Receive path: bare TSOP38238</text>
<text x="56" y="185" class="small">Pin 3 VS → ESP32 3V3</text>
<text x="56" y="212" class="small">Pin 2 GND → common GND</text>
<text x="56" y="239" class="small">Pin 1 OUT → GPIO15</text>
<text x="56" y="266" class="small">100 nF across VS / GND near receiver</text>
<text x="56" y="293" class="small">Use Vishay package view, not a generic module</text>
<rect x="610" y="125" width="545" height="180" rx="8" class="box"/>
<text x="626" y="155" class="label">Transmitter power boundary</text>
<text x="626" y="185" class="small">External regulated 5.0 V ±0.1 V</text>
<text x="626" y="212" class="small">External GND → ESP32 GND</text>
<text x="626" y="239" class="small">Do not join external +5 V to USB/VIN/3V3</text>
<text x="626" y="266" class="small">USB ON first; external rail OFF first</text>
<text x="45" y="380" class="">5 V</text>
<polyline points="95,375 180,375" class="wire "/>
<rect x="180" y="361" width="150" height="28" fill="white" stroke="#17644d" stroke-width="2"/>
<text x="180" y="351" class="small">220 Ω, 1%</text>
<polyline points="330,375 470,375" class="wire "/>
<rect x="470" y="340" width="300" height="85" rx="8" class="box"/>
<text x="486" y="370" class="label">TSAL6200 IR LED</text>
<text x="486" y="400" class="small">Anode left; cathode right</text>
<polyline points="770,375 965,375 965,565" class="wire "/>
<text x="45" y="555" class="">GPIO4</text>
<polyline points="135,550 200,550" class="wire "/>
<rect x="200" y="536" width="150" height="28" fill="white" stroke="#17644d" stroke-width="2"/>
<text x="200" y="526" class="small">680 Ω</text>
<polyline points="350,550 460,550" class="wire "/>
<circle cx="415" cy="550" r="5" fill="#17644d"/>
<rect x="460" y="495" width="425" height="175" rx="8" class="box"/>
<text x="476" y="525" class="label">P2N2222A: logical terminals</text>
<text x="476" y="555" class="small">Base (2) ← 680 Ω control path</text>
<text x="476" y="582" class="small">Collector (1) ← IR LED cathode</text>
<text x="476" y="609" class="small">Emitter (3) → common GND</text>
<text x="476" y="636" class="small">Do not assume another transistor pin order</text>
<polyline points="885,565 965,565" class="wire "/>
<text x="910" y="545" class="">C (1)</text>
<polyline points="650,670 650,780" class="wire "/>
<text x="665" y="750" class="">E (3) → GND</text>
<polyline points="415,550 415,705" class="wire "/>
<rect x="305" y="705" width="200" height="70" rx="8" class="box"/>
<text x="321" y="735" class="label">100 kΩ B–E</text>
<polyline points="415,775 415,800 650,800 650,780" class="wire "/>
<text x="380" y="835" class="">common GND</text>
<text x="40" y="890" class="small">GPIO4 drives the base only; LED load current comes from the external supply.</text>
<text x="40" y="920" class="small">GPIO15 is a strapping pin: no conflicting external reset pull. Replay sketch supports NEC only.</text>
<text x="40" y="952" class="small">Logical nets only: identify actual terminals using the selected manufacturer/package view.</text>
</svg>
