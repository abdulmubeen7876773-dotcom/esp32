<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Two-channel raw ADC logical wiring</title><desc id="desc">Board 3V3 feeds two independent resistor dividers. GPIO36 uses 10k over 10k; GPIO34 uses 20k over 10k; each node has 100 nF to common ground. No sensors, loads or external supply.</desc><rect width="1200" height="850" fill="#f8faf7"/><g font-family="Arial,sans-serif" fill="#172f2a"><text x="45" y="48" font-size="30">Two-channel raw ADC — logical wiring</text><text x="45" y="82" font-size="18">Classic ESP32-WROOM DevKit / Arduino-ESP32 3.3.2; not physical pin order.</text><text x="45" y="125" font-size="19">USB powers board only. Use board 3V3, never VIN/5V. No external inputs or loads.</text><text x="90" y="180" font-size="21">Channel A</text><text x="135" y="218" font-size="21">Board 3V3</text><path d="M200 230L200 260" stroke="#235d50" stroke-width="3" fill="none"/><rect x="180" y="260" width="40" height="65" fill="white" stroke="#235d50" stroke-width="3"/><text x="235" y="300" font-size="21">10 kΩ</text><path d="M200 325L200 380" stroke="#235d50" stroke-width="3" fill="none"/><circle cx="200" cy="380" r="5" fill="#235d50"/><path d="M200 380H370" stroke="#235d50" stroke-width="3" fill="none"/><text x="380" y="388" font-size="20">GPIO36</text><path d="M200 380L200 430" stroke="#235d50" stroke-width="3" fill="none"/><rect x="180" y="430" width="40" height="65" fill="white" stroke="#235d50" stroke-width="3"/><text x="100" y="470" font-size="21">10 kΩ</text><path d="M200 495L200 550" stroke="#235d50" stroke-width="3" fill="none"/><path d="M200 550H330" stroke="#235d50" stroke-width="3" fill="none"/><path d="M300 380L300 455" stroke="#235d50" stroke-width="3" fill="none"/><path d="M280 455H320" stroke="#235d50" stroke-width="3" fill="none"/><path d="M280 470H320" stroke="#235d50" stroke-width="3" fill="none"/><path d="M300 470L300 550" stroke="#235d50" stroke-width="3" fill="none"/><text x="340" y="470" font-size="17">100 nF</text><text x="165" y="580" font-size="21">GND</text><text x="630" y="180" font-size="21">Channel B</text><text x="675" y="218" font-size="21">Board 3V3</text><path d="M740 230L740 260" stroke="#235d50" stroke-width="3" fill="none"/><rect x="720" y="260" width="40" height="65" fill="white" stroke="#235d50" stroke-width="3"/><text x="775" y="300" font-size="21">20 kΩ</text><path d="M740 325L740 380" stroke="#235d50" stroke-width="3" fill="none"/><circle cx="740" cy="380" r="5" fill="#235d50"/><path d="M740 380H910" stroke="#235d50" stroke-width="3" fill="none"/><text x="920" y="388" font-size="20">GPIO34</text><path d="M740 380L740 430" stroke="#235d50" stroke-width="3" fill="none"/><rect x="720" y="430" width="40" height="65" fill="white" stroke="#235d50" stroke-width="3"/><text x="640" y="470" font-size="21">10 kΩ</text><path d="M740 495L740 550" stroke="#235d50" stroke-width="3" fill="none"/><path d="M740 550H870" stroke="#235d50" stroke-width="3" fill="none"/><path d="M840 380L840 455" stroke="#235d50" stroke-width="3" fill="none"/><path d="M820 455H860" stroke="#235d50" stroke-width="3" fill="none"/><path d="M820 470H860" stroke="#235d50" stroke-width="3" fill="none"/><path d="M840 470L840 550" stroke="#235d50" stroke-width="3" fill="none"/><text x="880" y="470" font-size="17">100 nF</text><text x="705" y="580" font-size="21">GND</text><text x="45" y="635" font-size="19">All resistors 1%. Separate nodes; common board ground. No OLED, relay or sensor.</text><text x="45" y="670" font-size="19">Verify 3V3 rail 3.0–3.45 V; calculated bounds: A 1.485–1.7423 V, B 0.9867–1.1654 V.</text><text x="45" y="705" font-size="19">GPIO34/36: ADC1 input only, no internal pull resistors. Unplug USB before rewiring.</text><text x="45" y="750" font-size="21">Raw sequential counts only — not measured volts, amps, watts or watt-hours.</text><text x="45" y="800" font-size="18">Illustration, not a photograph, recorded result or electrical validation.</text></g></svg>