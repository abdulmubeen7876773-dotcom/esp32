<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
<title id="title">LoRa: external RFM95W wiring, each node</title>
<desc id="desc">Classic ESP32-WROOM DevKit + labelled HopeRF RFM95W adapter; not an integrated Heltec board</desc>
<rect width="1200" height="990" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173c32;font-size:20px}.small{font-size:18px}.heading{font-size:28px;font-weight:700}.label{font-weight:700}.wire{fill:none;stroke:#17644d;stroke-width:3;stroke-linejoin:round}.power{stroke:#a33723}.ground{stroke:#334155}.box{fill:#f1f7f3;stroke:#17644d;stroke-width:2}</style>
<text x="40" y="45" class="heading">LoRa: external RFM95W wiring, each node</text>
<text x="40" y="80" class="small">Classic ESP32-WROOM DevKit + labelled HopeRF RFM95W adapter; not an integrated Heltec board</text>
<rect x="40" y="120" width="370" height="100" rx="8" class="box"/>
<text x="56" y="150" class="label">ESP32-WROOM DevKit</text>
<text x="56" y="180" class="small">USB power; 3.3 V GPIO logic</text>
<rect x="780" y="120" width="375" height="100" rx="8" class="box"/>
<text x="796" y="150" class="label">External RFM95W</text>
<text x="796" y="180" class="small">868/915 MHz variant; attach antenna</text>
<text x="120" y="275" class="">GPIO18</text>
<polyline points="320,268 780,268" class="wire "/>
<text x="800" y="275" class="">SCK (4)</text>
<text x="120" y="333" class="">GPIO19</text>
<polyline points="320,326 780,326" class="wire "/>
<text x="800" y="333" class="">MISO (2)</text>
<text x="120" y="391" class="">GPIO23</text>
<polyline points="320,384 780,384" class="wire "/>
<text x="800" y="391" class="">MOSI (3)</text>
<text x="120" y="449" class="">GPIO5</text>
<polyline points="320,442 780,442" class="wire "/>
<text x="800" y="449" class="">NSS / CS (5)</text>
<text x="120" y="507" class="">GPIO14</text>
<polyline points="320,500 780,500" class="wire "/>
<text x="800" y="507" class="">RESET (6)</text>
<text x="120" y="565" class="">GPIO26</text>
<polyline points="320,558 780,558" class="wire "/>
<text x="800" y="565" class="">DIO0 (8)</text>
<rect x="40" y="650" width="535" height="155" rx="8" class="box"/>
<text x="56" y="680" class="label">Radio power, each node</text>
<text x="56" y="710" class="small">External regulated 3.3 V → module 3.3V (13)</text>
<text x="56" y="737" class="small">Supply capacity ≥150 mA per radio</text>
<text x="56" y="764" class="small">100 nF + 10 µF at module; GND common</text>
<text x="56" y="791" class="small">External positive stays off DevKit 3V3</text>
<rect x="610" y="650" width="545" height="155" rx="8" class="box"/>
<text x="626" y="680" class="label">Sender-only DHT22</text>
<text x="626" y="710" class="small">VCC → ESP32 3V3; GND → common GND</text>
<text x="626" y="737" class="small">DATA → GPIO4; 10 kΩ DATA to 3V3</text>
<text x="626" y="764" class="small">Omit extra pull-up only if already fitted</text>
<text x="626" y="791" class="small">DHT22 is not DHT11</text>
<text x="40" y="850" class="small">GPIO5 is a strapping pin: no external pull-down / reset drive on NSS. No 5 V on the radio.</text>
<text x="40" y="882" class="small">Match both frequencies to the selected module and local rules; 915 MHz is not universally legal.</text>
<text x="40" y="942" class="small">Logical nets only: identify actual terminals using the selected manufacturer/package view.</text>
</svg>
