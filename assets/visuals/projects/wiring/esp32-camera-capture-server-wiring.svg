<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc" font-family="Arial,sans-serif"><title id="title">One local JPEG snapshot — logical programming map</title><desc id="desc">Not a physical pin layout or hardware test. Separate board power and UART logic.</desc><rect width="1200" height="1060" fill="#fff"/><text x="35" y="48" font-size="32" fill="#153f38" font-weight="700">One local JPEG snapshot</text><text x="35" y="86" font-size="23" fill="#153f38">AI-Thinker classic ESP32-CAM + OV2640 only / Arduino-ESP32 3.3.2</text><text x="35" y="122" font-size="20" fill="#153f38">Logical nets only: identify the actual board, regulator, header and UART voltage separately.</text><rect x="35" y="155" width="1130" height="94" rx="12" fill="#edf7f2" stroke="#326e60"/><text x="55" y="191" font-size="25" fill="#153f38" font-weight="700">Board supply: regulated 5 V at 5V. Signal logic: 3.3 V TTL only.</text><text x="55" y="227" font-size="22" fill="#153f38">Common ground. Adapter 5V/3V3 outputs disconnected; never join supply positives.</text><rect x="35" y="280" width="390" height="275" rx="12" fill="#edf7f2" stroke="#326e60"/><rect x="760" y="280" width="405" height="275" rx="12" fill="#edf7f2" stroke="#326e60"/><text x="55" y="319" font-size="25" fill="#153f38" font-weight="700">Verified 3.3 V USB–UART</text><text x="780" y="319" font-size="25" fill="#153f38" font-weight="700">AI-Thinker ESP32-CAM</text><text x="55" y="370" font-size="23" fill="#153f38">TX (3.3 V TTL)</text><text x="780" y="370" font-size="23" fill="#153f38">U0R / GPIO3 input</text><path d="M425,362 H760" stroke="#326e60" stroke-width="3"/><text x="55" y="425" font-size="23" fill="#153f38">RX input</text><text x="780" y="425" font-size="23" fill="#153f38">U0T / GPIO1 output</text><path d="M425,417 H760" stroke="#326e60" stroke-width="3"/><text x="55" y="480" font-size="23" fill="#153f38">GND</text><text x="780" y="480" font-size="23" fill="#153f38">GND / supply minus</text><path d="M425,472 H760" stroke="#326e60" stroke-width="3"/><text x="55" y="530" font-size="22" fill="#153f38">5V / 3V3 / DTR / RTS: NC</text><rect x="35" y="560" width="1130" height="140" rx="12" fill="#edf7f2" stroke="#326e60"/><text x="55" y="590" font-size="25" fill="#153f38" font-weight="700">External power and onboard camera</text><text x="55" y="622" font-size="20" fill="#153f38">External regulated 5 V + → board 5V; minus → common GND.</text><text x="55" y="654" font-size="20" fill="#153f38">OV2640 ribbon is internal: D0…D7 → 5,18,19,21,36,39,34,35.</text><text x="55" y="686" font-size="20" fill="#153f38">XCLK0 / PCLK22 / VSYNC25 / HREF23 / SCCB26,27 / PWDN32 / reset -1.</text><rect x="35" y="725" width="1130" height="140" rx="12" fill="#edf7f2" stroke="#326e60"/><text x="55" y="755" font-size="25" fill="#153f38" font-weight="700">Manual upload / run sequence</text><text x="55" y="787" font-size="20" fill="#153f38">Power off both sources → IO0 to GND → power on → press/release RST → upload.</text><text x="55" y="819" font-size="20" fill="#153f38">Then power off → REMOVE IO0 strap → power on/reset → Serial 115200.</text><text x="55" y="851" font-size="20" fill="#153f38">GPIO0 becomes camera XCLK. Keep adapter/board powered together while UART connects.</text><rect x="35" y="890" width="1130" height="110" rx="12" fill="#edf7f2" stroke="#326e60"/><text x="55" y="920" font-size="25" fill="#153f38" font-weight="700">Supported behavior</text><text x="55" y="952" font-size="20" fill="#153f38">QVGA JPEG → trusted LAN → GET /capture</text><text x="55" y="984" font-size="20" fill="#153f38">No stream, recording, OTA, authentication or TLS</text></svg>