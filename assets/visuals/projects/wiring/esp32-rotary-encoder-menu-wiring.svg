<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>ESP32 Rotary Encoder OLED Menu logical wiring</title><rect width="1200" height="800" rx="20" fill="#0b1d32"/><g font-family="Arial,sans-serif" fill="#f4f8ff"><text x="45" y="65" font-size="29">Rotary Encoder OLED Menu</text><text x="45" y="107" font-size="22" fill="#bcd4e8">Logical connections only — not physical connector order</text><text x="45" y="155" font-size="22">Classic ESP32 WROOM DevKit</text><text x="590" y="155" font-size="22">Peripheral signal</text><circle cx="490" cy="197" r="5" fill="#8bd6e4"/><path d="M495 197 H565" stroke="#8bd6e4" stroke-width="3"/><text x="45" y="204" font-size="21">GPIO25</text><text x="590" y="204" font-size="21">Encoder A</text><text x="590" y="228" font-size="16" fill="#bcd4e8">10 kΩ external pull-up to 3V3</text><circle cx="490" cy="262" r="5" fill="#8bd6e4"/><path d="M495 262 H565" stroke="#8bd6e4" stroke-width="3"/><text x="45" y="269" font-size="21">GPIO26</text><text x="590" y="269" font-size="21">Encoder B</text><text x="590" y="293" font-size="16" fill="#bcd4e8">10 kΩ external pull-up to 3V3</text><circle cx="490" cy="327" r="5" fill="#8bd6e4"/><path d="M495 327 H565" stroke="#8bd6e4" stroke-width="3"/><text x="45" y="334" font-size="21">GND</text><text x="590" y="334" font-size="21">Encoder common + switch return</text><text x="590" y="358" font-size="16" fill="#bcd4e8">Bare dry contacts only</text><circle cx="490" cy="392" r="5" fill="#8bd6e4"/><path d="M495 392 H565" stroke="#8bd6e4" stroke-width="3"/><text x="45" y="399" font-size="21">GPIO27</text><text x="590" y="399" font-size="21">Push switch signal</text><text x="590" y="423" font-size="16" fill="#bcd4e8">10 kΩ external pull-up to 3V3</text><circle cx="490" cy="457" r="5" fill="#8bd6e4"/><path d="M495 457 H565" stroke="#8bd6e4" stroke-width="3"/><text x="45" y="464" font-size="21">GPIO21</text><text x="590" y="464" font-size="21">OLED SDA</text><text x="590" y="488" font-size="16" fill="#bcd4e8">Module I2C pull-ups must go to 3V3</text><circle cx="490" cy="522" r="5" fill="#8bd6e4"/><path d="M495 522 H565" stroke="#8bd6e4" stroke-width="3"/><text x="45" y="529" font-size="21">GPIO22</text><text x="590" y="529" font-size="21">OLED SCL</text><text x="590" y="553" font-size="16" fill="#bcd4e8">Verify SSD1306 128x64 I2C variant</text><circle cx="490" cy="587" r="5" fill="#8bd6e4"/><path d="M495 587 H565" stroke="#8bd6e4" stroke-width="3"/><text x="45" y="594" font-size="21">3V3 / GND</text><text x="590" y="594" font-size="21">OLED VCC / GND</text><text x="590" y="618" font-size="16" fill="#bcd4e8">Documented 3.3 V supply module</text><text x="45" y="752" font-size="20" fill="#bcd4e8">Disconnect USB before wiring. All signal pull-ups go to 3.3 V.</text></g></svg>