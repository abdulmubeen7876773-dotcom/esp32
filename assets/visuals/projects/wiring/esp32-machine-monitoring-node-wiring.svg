<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc"><title id="title">Potentiometer threshold and LED relay logical circuit</title><desc id="desc">Board 3V3 powers a 10k potentiometer. Wiper through 15k to GPIO35 with 10k and 100 nF to ground. GPIO19 and a 10k pull-down command active-HIGH STEMMA 4409, separately powered at 5 V. COM and NO switch only a separate 3 V battery LED circuit.</desc><rect width="1400" height="1050" fill="#f8faf7"/><g font-family="Arial,sans-serif" fill="#172f2a"><text x="40" y="48" font-size="30">Threshold-to-relay lesson — supported logical wiring</text><text x="40" y="82" font-size="19">Classic ESP32-WROOM / Arduino-ESP32 3.3.2. Read labels; not physical connector order.</text><rect x="35" y="115" width="670" height="485" rx="10" fill="white" stroke="#235d50" stroke-width="2"/><text x="55" y="150" font-size="22">INPUT: potentiometer simulator; no current sensor</text><rect x="65" y="195" width="200" height="180" rx="10" fill="white" stroke="#235d50" stroke-width="2"/><text x="80" y="225" font-size="20">10 kΩ linear pot</text><text x="80" y="265" font-size="19">Outer 1 → 3V3</text><text x="80" y="300" font-size="19">Outer 2 → GND</text><text x="80" y="340" font-size="19">Wiper →</text><path d="M265 330H315" fill="none" stroke="#235d50" stroke-width="3"/><rect x="315" y="315" width="85" height="30" fill="white" stroke="#235d50" stroke-width="3"/><text x="325" y="300" font-size="18">15 kΩ</text><path d="M400 330H665" fill="none" stroke="#235d50" stroke-width="3"/><circle cx="465" cy="330" r="5" fill="#235d50"/><text x="540" y="312" font-size="20">GPIO35</text><path d="M465 330V385" fill="none" stroke="#235d50" stroke-width="3"/><rect x="450" y="385" width="30" height="60" fill="white" stroke="#235d50" stroke-width="3"/><text x="390" y="425" font-size="18">10 kΩ</text><path d="M465 445V490H630" fill="none" stroke="#235d50" stroke-width="3"/><path d="M570 330V395M550 395H590M550 410H590M570 410V490" fill="none" stroke="#235d50" stroke-width="3"/><text x="595" y="412" font-size="17">100 nF</text><text x="490" y="520" font-size="19">Common GND</text><text x="55" y="557" font-size="18">Divider resistors 1%. Use board 3V3, never VIN/5V.</text><text x="55" y="583" font-size="18">GPIO35: ADC1 input only; no internal pull resistor.</text><rect x="725" y="115" width="640" height="485" rx="10" fill="white" stroke="#235d50" stroke-width="2"/><text x="745" y="150" font-size="22">CONTROL: Adafruit STEMMA 4409 only</text><rect x="920" y="215" width="415" height="200" rx="10" fill="white" stroke="#235d50" stroke-width="2"/><text x="940" y="248" font-size="21">Non-latching, active HIGH</text><text x="940" y="292" font-size="19">Red Vin ← external regulated +5 V</text><text x="940" y="333" font-size="19">Black GND ← common control GND</text><text x="940" y="375" font-size="19">White Signal ← GPIO19</text><text x="750" y="360" font-size="19">GPIO19</text><path d="M835 375H920" fill="none" stroke="#235d50" stroke-width="3"/><path d="M880 375V440" fill="none" stroke="#235d50" stroke-width="3"/><rect x="865" y="440" width="30" height="55" fill="white" stroke="#235d50" stroke-width="3"/><text x="760" y="477" font-size="18">10 kΩ</text><path d="M880 495V530H1260" fill="none" stroke="#235d50" stroke-width="3"/><text x="960" y="553" font-size="18">Common GND: ESP32 + relay supply −</text><text x="745" y="580" font-size="18">USB powers ESP32. Never join positive supply rails.</text><rect x="35" y="625" width="1330" height="230" rx="10" fill="white" stroke="#235d50" stroke-width="2"/><text x="55" y="660" font-size="22">CONTACT SIDE: separate 3 V battery and red LED only — no controller GND connection</text><text x="75" y="715" font-size="19">Battery +3 V</text><path d="M215 710H350" fill="none" stroke="#235d50" stroke-width="3"/><text x="280" y="693" font-size="18">COM</text><circle cx="350" cy="710" r="5" fill="#235d50"/><path d="M350 710L420 680" fill="none" stroke="#235d50" stroke-width="3"/><circle cx="435" cy="710" r="5" fill="#235d50"/><text x="430" y="693" font-size="18">NO</text><path d="M435 710H560" fill="none" stroke="#235d50" stroke-width="3"/><rect x="560" y="695" width="100" height="30" fill="white" stroke="#235d50" stroke-width="3"/><text x="570" y="680" font-size="18">330 Ω</text><path d="M660 710H785" fill="none" stroke="#235d50" stroke-width="3"/><text x="800" y="717" font-size="19">LED anode → LED cathode → battery −</text><text x="75" y="775" font-size="19">NC unused. COM–NO closes when the supported coil is energized.</text><text x="75" y="815" font-size="19">LOW/OFF is a command, not proof that contacts cannot stick or weld.</text><text x="40" y="900" font-size="21">Start disabled/OFF. E: enable 10 s. X, invalid input or timeout: command OFF.</text><text x="40" y="940" font-size="21">Enabled valid input: ≥900 mV ON; ≤650 mV OFF; between them retains state.</text><text x="40" y="978" font-size="19">No machine, motor, mains or protective trip. Disconnect USB, 5 V and battery before rewiring.</text><text x="40" y="1015" font-size="18">Logical illustration — not a photograph, measured result or electrical safety validation.</text></g></svg>