<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
<title id="title">AC current monitor: isolated low-voltage exercise</title>
<desc id="desc">Only a factory-isolated, current-limited 12 V AC source and matching low-voltage load; no mains wiring</desc>
<rect width="1200" height="1030" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173c32;font-size:20px}.small{font-size:18px}.heading{font-size:28px;font-weight:700}.label{font-weight:700}.wire{fill:none;stroke:#17644d;stroke-width:3;stroke-linejoin:round}.power{stroke:#a33723}.ground{stroke:#334155}.box{fill:#f1f7f3;stroke:#17644d;stroke-width:2}</style>
<text x="40" y="45" class="heading">AC current monitor: isolated low-voltage exercise</text>
<text x="40" y="80" class="small">Only a factory-isolated, current-limited 12 V AC source and matching low-voltage load; no mains wiring</text>
<rect x="40" y="130" width="360" height="120" rx="8" class="box"/>
<text x="56" y="160" class="label">Isolated 12 V AC source</text>
<text x="56" y="190" class="small">Appropriate current limit / fuse</text>
<text x="56" y="217" class="small">Do not open or build its primary</text>
<rect x="820" y="130" width="335" height="120" rx="8" class="box"/>
<text x="836" y="160" class="label">Matching low-voltage load</text>
<text x="836" y="190" class="small">No DC source / no appliance lead</text>
<polyline points="400,165 820,165" class="wire "/>
<polyline points="820,225 700,225 700,280 400,280 400,225" class="wire "/>
<text x="420" y="118" class="small">ONE insulated conductor inside CT</text>
<ellipse cx="575" cy="165" rx="65" ry="38" fill="none" stroke="#17644d" stroke-width="4"/>
<text x="435" y="330" class="label">SCT-013-030, 30 A / 1 V, internal burden</text>
<text x="40" y="375" class="small">Magnetic coupling only: the sensed source/load circuit has no galvanic wire to the ADC.</text>
<rect x="40" y="430" width="350" height="145" rx="8" class="box"/>
<text x="56" y="460" class="label">CT secondary / jack</text>
<text x="56" y="490" class="small">Tip signal → capacitor negative</text>
<text x="56" y="517" class="small">Sleeve → ESP32 GND</text>
<text x="56" y="544" class="small">Verify actual plug connections</text>
<text x="56" y="571" class="small">Not SCT-013-000 current output</text>
<polyline points="390,465 470,465" class="wire "/>
<rect x="470" y="430" width="260" height="115" rx="8" class="box"/>
<text x="486" y="460" class="label">10 µF coupling cap</text>
<text x="486" y="490" class="small">Negative toward CT</text>
<text x="486" y="517" class="small">Positive toward ADC node</text>
<polyline points="730,465 850,465 1090,465" class="wire "/>
<circle cx="850" cy="465" r="5" fill="#17644d"/>
<text x="960" y="440" class="">GPIO34 / ADC1</text>
<text x="755" y="580" class="">ESP32 3V3</text>
<polyline points="850,590 850,615" class="wire "/>
<rect x="750" y="615" width="200" height="65" rx="8" class="box"/>
<text x="766" y="645" class="label">10 kΩ</text>
<polyline points="850,680 850,710" class="wire "/>
<circle cx="850" cy="710" r="5" fill="#17644d"/>
<polyline points="850,710 1090,710 1090,465" class="wire "/>
<text x="720" y="745" class="">Midpoint ≈1.65 V</text>
<polyline points="850,710 850,780" class="wire "/>
<rect x="750" y="780" width="200" height="65" rx="8" class="box"/>
<text x="766" y="810" class="label">10 kΩ</text>
<polyline points="850,845 850,875" class="wire "/>
<text x="820" y="905" class="">GND</text>
<rect x="40" y="630" width="610" height="175" rx="8" class="box"/>
<text x="56" y="660" class="label">Limits to verify before GPIO connection</text>
<text x="56" y="690" class="small">Check full waveform, not just midpoint:</text>
<text x="56" y="717" class="small">target about 0.2–2.9 V for ADC headroom.</text>
<text x="56" y="744" class="small">Bias divider is NOT an overvoltage clamp.</text>
<text x="56" y="771" class="small">Small loads may be buried in ADC noise.</text>
<text x="56" y="798" class="small">No billing, true-power or accuracy claim.</text>
<text x="40" y="982" class="small">Logical nets only: identify actual terminals using the selected manufacturer/package view.</text>
</svg>
