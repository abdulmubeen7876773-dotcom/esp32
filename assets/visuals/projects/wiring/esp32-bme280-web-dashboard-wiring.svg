<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>ESP32 BME280 Web Dashboard and Live Chart logical wiring</title><rect width="1200" height="800" rx="24" fill="#0b1d32"/><g font-family="Arial,sans-serif" fill="#f4f8ff"><text x="45" y="65" font-size="30">BME280 Web Dashboard and Live Chart</text><text x="45" y="110" font-size="22" fill="#c0d6e8">Logical connections only — verify actual module terminal labels</text><text x="45" y="200" font-size="24">ESP32 3V3</text><path d="M435 193 H540" stroke="#8bd6e4" stroke-width="4"/><text x="570" y="200" font-size="24">BME280 VIN</text><text x="570" y="234" font-size="19" fill="#c0d6e8">Selected breakout, not bare sensor</text><text x="45" y="300" font-size="24">ESP32 GND</text><path d="M435 293 H540" stroke="#8bd6e4" stroke-width="4"/><text x="570" y="300" font-size="24">BME280 GND</text><text x="570" y="334" font-size="19" fill="#c0d6e8">Common low-voltage reference</text><text x="45" y="400" font-size="24">GPIO21</text><path d="M435 393 H540" stroke="#8bd6e4" stroke-width="4"/><text x="570" y="400" font-size="24">BME280 SDI / SDA</text><text x="570" y="434" font-size="19" fill="#c0d6e8">100 kHz; pull-ups at 3.3 V only</text><text x="45" y="500" font-size="24">GPIO22</text><path d="M435 493 H540" stroke="#8bd6e4" stroke-width="4"/><text x="570" y="500" font-size="24">BME280 SCK / SCL</text><text x="570" y="534" font-size="19" fill="#c0d6e8">Leave CS, SDO and 3Vo unconnected</text><text x="45" y="740" font-size="22" fill="#c0d6e8">Disconnect power before rewiring. Not a physical pinout or verified build.</text></g></svg>