<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 910" font-family="Arial, sans-serif" role="img" aria-labelledby="title"><title id="title">Non-body-connected AD8232 bench wiring</title><rect width="1000" height="910" fill="white"/><text x="35" y="44" font-size="29" font-weight="bold" fill="#143f36">AD8232 bench acquisition — NO ELECTRODES</text><text x="35" y="80" font-size="21" font-weight="normal" fill="#143f36">Classic ESP32-WROOM + SparkFun SEN-12650 (v10 schematic)</text><text x="35" y="112" font-size="18" font-weight="normal" fill="#143f36">No person, animal, electrode lead or external generator connects to this bench.</text><rect x="55" y="160" width="350" height="370" rx="12" fill="#eff7f3" stroke="#17644d" stroke-width="2"/><rect x="625" y="160" width="320" height="370" rx="12" fill="#eff7f3" stroke="#17644d" stroke-width="2"/><text x="80" y="202" font-size="23" font-weight="bold" fill="#143f36">USB-powered ESP32</text><text x="650" y="202" font-size="22" font-weight="bold" fill="#143f36">SEN-12650 AD8232</text><text x="80" y="255" font-size="19" font-weight="normal" fill="#143f36">3V3</text><path d="M405 248 L625 248" fill="none" stroke="#17644d" stroke-width="3"/><text x="650" y="255" font-size="19" font-weight="normal" fill="#143f36">3.3V</text><text x="80" y="310" font-size="19" font-weight="normal" fill="#143f36">GND</text><path d="M405 303 L625 303" fill="none" stroke="#17644d" stroke-width="3"/><text x="650" y="310" font-size="19" font-weight="normal" fill="#143f36">GND</text><text x="80" y="365" font-size="19" font-weight="normal" fill="#143f36">GPIO34 / ADC1 input</text><path d="M405 358 L625 358" fill="none" stroke="#17644d" stroke-width="3"/><text x="650" y="365" font-size="19" font-weight="normal" fill="#143f36">OUTPUT</text><text x="80" y="420" font-size="19" font-weight="normal" fill="#143f36">GPIO32 input</text><path d="M405 413 L625 413" fill="none" stroke="#17644d" stroke-width="3"/><text x="650" y="420" font-size="19" font-weight="normal" fill="#143f36">LO+</text><text x="80" y="475" font-size="19" font-weight="normal" fill="#143f36">GPIO33 input</text><path d="M405 468 L625 468" fill="none" stroke="#17644d" stroke-width="3"/><text x="650" y="475" font-size="19" font-weight="normal" fill="#143f36">LO−</text><rect x="40" y="565" width="920" height="100" rx="12" fill="#eff7f3" stroke="#17644d" stroke-width="2"/><text x="60" y="599" font-size="21" font-weight="bold" fill="#143f36">SDN is left unconnected on this selected board.</text><text x="60" y="633" font-size="19" font-weight="normal" fill="#143f36">SparkFun v10 provides a pull-up. Another carrier needs its own schematic check.</text><rect x="40" y="700" width="920" height="130" rx="12" fill="#fff5ed" stroke="#9a4319" stroke-width="2"/><text x="60" y="736" font-size="24" font-weight="bold" fill="#78330e">3.5 mm jack + RA / LA / RL pads: EMPTY</text><text x="60" y="772" font-size="21" font-weight="bold" fill="#78330e">No body connection. USB ground is not patient isolation.</text><text x="60" y="807" font-size="18" font-weight="normal" fill="#78330e">Open-input counts/flags are not ECG data; no synthetic 2048 samples are emitted.</text><text x="40" y="875" font-size="18" font-weight="normal" fill="#143f36">Logical nets, not physical pin orientation. GPIO34 is an input, never OUTPUT.</text></svg>
