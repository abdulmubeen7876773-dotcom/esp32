<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc"><title id="title">TB6612FNG connection map and line-follower geometry</title><desc id="desc">Pololu 713 and classic WROOM. Both sensor spots must cover the line for forward. Four logical states, not measured mounting dimensions or a hardware-tested layout.</desc><rect width="1200" height="800" fill="#f5f8fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#102b46">
<text x="35" y="40" font-size="27" font-weight="700">Line follower: wiring and the track your code expects</text>
<text x="35" y="72" font-size="19">Classic ESP32-WROOM · Pololu TB6612FNG carrier #713 · logical map, not header order</text>
<rect x="35" y="92" width="1130" height="43" rx="10" fill="#ffffff" stroke="#b9cdd5" stroke-width="2"/>
<text x="49" y="120" font-size="17" font-weight="700">Sensor power / inputs</text>
<text x="270" y="120" font-size="17">Documented 3.3 V AO modules; left AO → GPIO34; right AO → GPIO35</text>
<rect x="35" y="142" width="1130" height="43" rx="10" fill="#ffffff" stroke="#b9cdd5" stroke-width="2"/>
<text x="49" y="170" font-size="17" font-weight="700">Direction inputs</text>
<text x="270" y="170" font-size="17">GPIO16 → AIN1; 17 → AIN2; 18 → BIN1; 19 → BIN2</text>
<rect x="35" y="192" width="1130" height="43" rx="10" fill="#ffffff" stroke="#b9cdd5" stroke-width="2"/>
<text x="49" y="220" font-size="17" font-weight="700">Logic and enables</text>
<text x="270" y="220" font-size="17">3V3 → VCC, PWMA, PWMB, STBY; no software speed / standby</text>
<rect x="35" y="242" width="1130" height="43" rx="10" fill="#ffffff" stroke="#b9cdd5" stroke-width="2"/>
<text x="49" y="270" font-size="17" font-weight="700">Motor power / outputs</text>
<text x="270" y="270" font-size="17">Switched motor + → VMOT; AO1/AO2 → left; BO1/BO2 → right</text>
<rect x="35" y="292" width="1130" height="43" rx="10" fill="#ffffff" stroke="#b9cdd5" stroke-width="2"/>
<text x="49" y="320" font-size="17" font-weight="700">Returns / limits</text>
<text x="270" y="320" font-size="17">Common GND; motor return to supply/carrier; match voltage and stall current</text>
<text x="35" y="376" font-size="23" font-weight="700">Top view: sensor spots look at the floor ahead of the wheels</text>
<text x="35" y="406" font-size="18">First verify these states with MOTOR POWER OFF. Panels are not to scale; no fixed mm spacing.</text>
<rect x="35" y="429" width="270" height="257" rx="10" fill="#ffffff" stroke="#b9cdd5" stroke-width="2"/>
<text x="49" y="459" font-size="19" font-weight="700">LINE / LINE</text>
<rect x="140" y="478" width="60" height="130" fill="#142633"/>
<path d="M78 573 V505 l-9 15 M78 505 l9 15" fill="none" stroke="#08756c" stroke-width="3"/>
<circle cx="154" cy="550" r="9" fill="#f4b54a" stroke="#102b46" stroke-width="2"/>
<text x="148" y="633" font-size="18" font-weight="700">L</text>
<circle cx="186" cy="550" r="9" fill="#f4b54a" stroke="#102b46" stroke-width="2"/>
<text x="180" y="633" font-size="18" font-weight="700">R</text>
<text x="50" y="670" font-size="18">Both motors forward</text>
<rect x="322" y="429" width="270" height="257" rx="10" fill="#ffffff" stroke="#b9cdd5" stroke-width="2"/>
<text x="336" y="459" font-size="19" font-weight="700">LINE / FLOOR</text>
<rect x="392" y="478" width="60" height="130" fill="#142633"/>
<path d="M365 573 V505 l-9 15 M365 505 l9 15" fill="none" stroke="#08756c" stroke-width="3"/>
<circle cx="441" cy="550" r="9" fill="#f4b54a" stroke="#102b46" stroke-width="2"/>
<text x="435" y="633" font-size="18" font-weight="700">L</text>
<circle cx="473" cy="550" r="9" fill="#f4b54a" stroke="#102b46" stroke-width="2"/>
<text x="467" y="633" font-size="18" font-weight="700">R</text>
<text x="337" y="658" font-size="18">Left stopped;</text>
<text x="337" y="680" font-size="18">right forward</text>
<rect x="609" y="429" width="270" height="257" rx="10" fill="#ffffff" stroke="#b9cdd5" stroke-width="2"/>
<text x="623" y="459" font-size="19" font-weight="700">FLOOR / LINE</text>
<rect x="749" y="478" width="60" height="130" fill="#142633"/>
<path d="M652 573 V505 l-9 15 M652 505 l9 15" fill="none" stroke="#08756c" stroke-width="3"/>
<circle cx="728" cy="550" r="9" fill="#f4b54a" stroke="#102b46" stroke-width="2"/>
<text x="722" y="633" font-size="18" font-weight="700">L</text>
<circle cx="760" cy="550" r="9" fill="#f4b54a" stroke="#102b46" stroke-width="2"/>
<text x="754" y="633" font-size="18" font-weight="700">R</text>
<text x="624" y="658" font-size="18">Left forward;</text>
<text x="624" y="680" font-size="18">right stopped</text>
<rect x="896" y="429" width="270" height="257" rx="10" fill="#ffffff" stroke="#b9cdd5" stroke-width="2"/>
<text x="910" y="459" font-size="19" font-weight="700">FLOOR / FLOOR</text>
<path d="M939 573 V505 l-9 15 M939 505 l9 15" fill="none" stroke="#08756c" stroke-width="3"/>
<circle cx="1015" cy="550" r="9" fill="#f4b54a" stroke="#102b46" stroke-width="2"/>
<text x="1009" y="633" font-size="18" font-weight="700">L</text>
<circle cx="1047" cy="550" r="9" fill="#f4b54a" stroke="#102b46" stroke-width="2"/>
<text x="1041" y="633" font-size="18" font-weight="700">R</text>
<text x="911" y="670" font-size="18">Both motors stopped</text>
<text x="35" y="721" font-size="19" font-weight="700">Centered = both spots on dark track. A narrow line BETWEEN sensors means FLOOR/FLOOR → STOP.</text>
<text x="35" y="753" font-size="19">Calibrate each threshold and shared polarity first. Lift wheels before motor power.</text>
<text x="35" y="782" font-size="18">Hard-wired HIGH STBY is not a reset-time motor interlock. Keep the motor switch accessible.</text>
</g></svg>
