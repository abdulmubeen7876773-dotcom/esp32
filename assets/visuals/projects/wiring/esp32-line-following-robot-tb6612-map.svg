<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ESP32 WROOM and TB6612FNG logical connection map</title>
<desc id="desc">Pololu carrier 713 reference. Direction pins, sensors, fixed-high enable pins and separate motor supply. Not a physical header diagram.</desc>
<rect width="1200" height="800" fill="#f4f8fc"/>
<g font-family="Arial, sans-serif" fill="#102b46">
<text x="44" y="52" font-size="30" font-weight="bold">ESP32-WROOM → TB6612FNG carrier</text>
<text x="44" y="86" font-size="20">Pololu #713 reference · logical map · no physical header positions</text>
<rect x="36" y="112" width="1128" height="82" rx="10" fill="white" stroke="#ccdbea"/>
<text x="54" y="146" font-size="22" font-weight="bold">Sensor input</text>
<text x="295" y="144" font-size="23">Left AO → GPIO34; right AO → GPIO35</text>
<text x="295" y="174" font-size="20" fill="#3b526a">Documented 3.3 V analog modules; shared GND</text>
<rect x="36" y="204" width="1128" height="82" rx="10" fill="white" stroke="#ccdbea"/>
<text x="54" y="238" font-size="22" font-weight="bold">Left motor control</text>
<text x="295" y="236" font-size="23">GPIO16 → AIN1; GPIO17 → AIN2</text>
<text x="295" y="266" font-size="20" fill="#3b526a">AO1 / AO2 → left motor</text>
<rect x="36" y="296" width="1128" height="82" rx="10" fill="white" stroke="#ccdbea"/>
<text x="54" y="330" font-size="22" font-weight="bold">Right motor control</text>
<text x="295" y="328" font-size="23">GPIO18 → BIN1; GPIO19 → BIN2</text>
<text x="295" y="358" font-size="20" fill="#3b526a">BO1 / BO2 → right motor</text>
<rect x="36" y="388" width="1128" height="82" rx="10" fill="white" stroke="#ccdbea"/>
<text x="54" y="422" font-size="22" font-weight="bold">Logic and enable</text>
<text x="295" y="420" font-size="23">3V3 → VCC, PWMA, PWMB, STBY</text>
<text x="295" y="450" font-size="20" fill="#3b526a">Fixed full-speed enable; not software PWM</text>
<rect x="36" y="480" width="1128" height="82" rx="10" fill="white" stroke="#ccdbea"/>
<text x="54" y="514" font-size="22" font-weight="bold">Motor power</text>
<text x="295" y="512" font-size="23">Switched motor supply + → VMOT</text>
<text x="295" y="542" font-size="20" fill="#3b526a">Motor supply − → carrier GND; match motor ratings</text>
<rect x="36" y="572" width="1128" height="82" rx="10" fill="white" stroke="#ccdbea"/>
<text x="54" y="606" font-size="22" font-weight="bold">Common reference</text>
<text x="295" y="604" font-size="23">ESP32 GND ↔ carrier GND ↔ sensor GND</text>
<text x="295" y="634" font-size="20" fill="#3b526a">Motor current returns directly to carrier / supply</text>
<text x="44" y="706" font-size="22" font-weight="bold">Motor supply OFF during calibration; wheels lifted before motor power.</text>
<text x="44" y="740" font-size="20">PWMA/PWMB/STBY tied HIGH do not provide a reset-time motor interlock.</text>
<text x="44" y="775" font-size="18">Use the page connection table, actual carrier labels and manufacturer ratings.</text>
</g></svg>
