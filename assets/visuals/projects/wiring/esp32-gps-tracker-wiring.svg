<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">GPS reader: qualified 3.3 V carrier interface</title>
<desc id="desc">Classic ESP32-WROOM RX2 • read-only UART • identify carrier schematic before applying power</desc>
<rect width="1200" height="800" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173c32;font-size:20px}.small{font-size:18px}.heading{font-size:28px;font-weight:700}.label{font-weight:700}.wire{fill:none;stroke:#17644d;stroke-width:3;stroke-linejoin:round}.power{stroke:#a33723}.ground{stroke:#334155}.box{fill:#f1f7f3;stroke:#17644d;stroke-width:2}</style>
<text x="40" y="45" class="heading">GPS reader: qualified 3.3 V carrier interface</text>
<text x="40" y="80" class="small">Classic ESP32-WROOM RX2 • read-only UART • identify carrier schematic before applying power</text>
<rect x="40" y="130" width="470" height="200" rx="8" class="box"/>
<text x="56" y="160" class="label">Supported NEO-6M carrier</text>
<text x="56" y="190" class="small">Documented 3.3 V-rated input</text>
<text x="56" y="217" class="small">Native 3.3 V UART TX</text>
<text x="56" y="244" class="small">Regulator/dropout checked in schematic</text>
<text x="56" y="271" class="small">Not every unmarked GPS breakout</text>
<text x="56" y="298" class="small">RX intentionally unconnected</text>
<rect x="750" y="130" width="405" height="200" rx="8" class="box"/>
<text x="766" y="160" class="label">ESP32-WROOM DevKit</text>
<text x="766" y="190" class="small">USB-powered; GPIO16 exposed</text>
<text x="766" y="217" class="small">GPIO16 = UART2 RX</text>
<text x="766" y="244" class="small">Do not use WROVER-reserved pins</text>
<text x="766" y="271" class="small">No ESP32 TX wire in this example</text>
<text x="100" y="385" class="">Carrier TX</text>
<polyline points="285,378 750,378" class="wire "/>
<text x="800" y="385" class="">GPIO16 / RX2</text>
<text x="100" y="450" class="">Carrier GND</text>
<polyline points="285,443 750,443" class="wire "/>
<text x="800" y="450" class="">ESP32 GND</text>
<rect x="40" y="510" width="1115" height="145" rx="8" class="box"/>
<text x="56" y="540" class="label">Supply and signal voltage are separate specifications</text>
<text x="56" y="570" class="small">External regulated 3.3 V → documented carrier supply input; external GND → common GND.</text>
<text x="56" y="597" class="small">Keep external positive off DevKit USB/VIN/3V3. USB ON first; carrier supply OFF first.</text>
<text x="56" y="624" class="small">Bare NEO-6M VCC is 2.7–3.6 V; a carrier VIN regulator does not make UART 5 V tolerant.</text>
<text x="40" y="700" class="small">9600-baud NMEA reception proves serial traffic, not a valid satellite fix or indoor reception.</text>
<text x="40" y="752" class="small">Logical nets only: identify actual terminals using the selected manufacturer/package view.</text>
</svg>
