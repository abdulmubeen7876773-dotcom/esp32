<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">LED Matrix: buffer 3.3 V control to 5 V logic</title><desc id="desc">Logical signal path; standard 14-pin SN74AHCT125 pinout shown. Unused channel4: OE pin13 → 5 V, 4A pin12 → GND; 4Y pin11 left open. Matrix and buffer use external 5 V; share GND, keep independent positive rails separate. Check module decoupling and supply budget. Begin at intensity1; GPIO5 is a strapping pin. Unplug all power before rewiring. MAX7219 HIGH minimum 3.5 V needs buffering here.</desc><rect width="1200" height="800" rx="24" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="40" y="58" font-size="30" font-weight="bold">LED Matrix: buffer 3.3 V control to 5 V logic</text><text x="40" y="96" font-size="20">Logical signal path; standard 14-pin SN74AHCT125 pinout shown.</text><rect x="40" y="150" width="340" height="380" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="60" y="194" font-size="23" font-weight="bold">ESP32-WROOM DevKit</text><text x="60" y="238" font-size="20">GPIO23 → 1A pin2</text><text x="60" y="276" font-size="20">GPIO18 → 2A pin5</text><text x="60" y="314" font-size="20">GPIO5 → 3A pin9</text><text x="60" y="352" font-size="20">GND → common ground</text><text x="60" y="390" font-size="20">USB powers ESP32</text><text x="60" y="428" font-size="20">Never input 5 V to GPIO</text><path d="M384 335h38m-10-10 10 10-10 10" fill="none" stroke="#0369a1" stroke-width="4"/><rect x="430" y="150" width="340" height="380" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="450" y="194" font-size="23" font-weight="bold">SN74AHCT125 at 5 V</text><text x="450" y="238" font-size="20">1Y pin3 → DIN</text><text x="450" y="276" font-size="20">2Y pin6 → CLK</text><text x="450" y="314" font-size="20">3Y pin8 → CS/LOAD</text><text x="450" y="352" font-size="20">OE pins1,4,10 → GND</text><text x="450" y="390" font-size="20">VCC pin14 → 5 V</text><text x="450" y="428" font-size="20">GND pin7 → GND</text><text x="450" y="466" font-size="20">100 nF at VCC/GND</text><path d="M774 335h38m-10-10 10 10-10 10" fill="none" stroke="#0369a1" stroke-width="4"/><rect x="820" y="150" width="340" height="380" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="840" y="194" font-size="23" font-weight="bold">MAX7219 input side</text><text x="840" y="238" font-size="20">DIN / CLK / CS from Y</text><text x="840" y="276" font-size="20">VCC → regulated 5 V</text><text x="840" y="314" font-size="20">GND → common ground</text><text x="840" y="352" font-size="20">DOUT → next DIN only</text><text x="840" y="390" font-size="20">Do not return to ESP32</text><text x="840" y="428" font-size="20">Check FC16 mapping</text><text x="840" y="466" font-size="20">Count driver chips</text><text x="40" y="585" font-size="21">Unused channel4: OE pin13 → 5 V, 4A pin12 → GND; 4Y pin11 left open.</text><text x="40" y="621" font-size="21">Matrix and buffer use external 5 V; share GND, keep independent positive rails separate.</text><text x="40" y="657" font-size="21">Check module decoupling and supply budget. Begin at intensity1; GPIO5 is a strapping pin.</text><text x="40" y="693" font-size="21">Unplug all power before rewiring. MAX7219 HIGH minimum 3.5 V needs buffering here.</text></g></svg>
