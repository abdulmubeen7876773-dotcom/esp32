<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" font-family="Arial, sans-serif" role="img" aria-labelledby="title"><title id="title">MAX30102 raw logger logical wiring</title><rect width="1000" height="840" fill="white"/><text x="35" y="44" font-size="30" font-weight="bold" fill="#143f36">MAX30102 raw optical logger</text><text x="35" y="80" font-size="21" font-weight="normal" fill="#143f36">Classic ESP32-WROOM + MAXREFDES117# reference board</text><text x="35" y="112" font-size="18" font-weight="normal" fill="#143f36">Logical connections only; identify physical pads from the manufacturer documentation.</text><rect x="40" y="155" width="920" height="95" rx="12" fill="#eff7f3" stroke="#17644d" stroke-width="2"/><text x="60" y="188" font-size="22" font-weight="bold" fill="#143f36">Power and logic boundary</text><text x="60" y="216" font-size="19" font-weight="normal" fill="#143f36">Use VIN = 3.3 V and host-side SDA/SCL. Internal sensor core uses its own 1.8 V rail.</text><rect x="55" y="285" width="350" height="315" rx="12" fill="#eff7f3" stroke="#17644d" stroke-width="2"/><rect x="625" y="285" width="320" height="315" rx="12" fill="#eff7f3" stroke="#17644d" stroke-width="2"/><text x="80" y="323" font-size="23" font-weight="bold" fill="#143f36">Classic ESP32-WROOM</text><text x="650" y="323" font-size="23" font-weight="bold" fill="#143f36">MAXREFDES117#</text><text x="80" y="370" font-size="19" font-weight="normal" fill="#143f36">3V3</text><path d="M405 363 L625 363" fill="none" stroke="#17644d" stroke-width="3"/><text x="650" y="370" font-size="19" font-weight="normal" fill="#143f36">VIN</text><text x="80" y="425" font-size="19" font-weight="normal" fill="#143f36">GND</text><path d="M405 418 L625 418" fill="none" stroke="#17644d" stroke-width="3"/><text x="650" y="425" font-size="19" font-weight="normal" fill="#143f36">GND</text><text x="80" y="480" font-size="19" font-weight="normal" fill="#143f36">GPIO21 (SDA)</text><path d="M405 473 L625 473" fill="none" stroke="#17644d" stroke-width="3"/><text x="650" y="480" font-size="19" font-weight="normal" fill="#143f36">Host SDA</text><text x="80" y="535" font-size="19" font-weight="normal" fill="#143f36">GPIO22 (SCL)</text><path d="M405 528 L625 528" fill="none" stroke="#17644d" stroke-width="3"/><text x="650" y="535" font-size="19" font-weight="normal" fill="#143f36">Host SCL</text><rect x="40" y="635" width="920" height="130" rx="12" fill="#eff7f3" stroke="#17644d" stroke-width="2"/><text x="60" y="670" font-size="21" font-weight="bold" fill="#143f36">INT unconnected; poll FIFO at I2C address 0x57.</text><text x="60" y="704" font-size="19" font-weight="normal" fill="#143f36">No green channel, no finger threshold, no BPM and no oxygen-saturation output.</text><text x="60" y="738" font-size="19" font-weight="normal" fill="#143f36">Raw red/IR counts and host receipt times are not calibrated physiological measurements.</text><text x="40" y="805" font-size="18" font-weight="normal" fill="#143f36">Bare MAX30102 VDD is not a 3.3 V input. Unknown carriers require separate review.</text></svg>
