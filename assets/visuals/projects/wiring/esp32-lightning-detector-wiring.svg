<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc"><title id="title">Classic ESP32 and SparkFun SEN-15441 v2.0 logical SPI map</title><desc id="desc">Named connections, LED resistor and genuinely optional SSD1306. Not physical header positions, a photograph or tested hardware.</desc><rect width="1200" height="800" fill="#f5f8fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#102b46">
<text x="35" y="44" font-size="28" font-weight="700">AS3935: selected SPI breakout, not a generic module</text>
<text x="35" y="78" font-size="20">Classic ESP32-WROOM · core 3.3.2 · SparkFun AS3935 library 1.4.9</text>
<rect x="35" y="100" width="1130" height="120" rx="10" fill="#ffffff" stroke="#b9cdd5" stroke-width="2"/>
<text x="55" y="130" font-size="22" font-weight="700">Power: USB → ESP32; ESP32 3V3 → SEN-15441 3V3; GND → GND</text>
<text x="55" y="165" font-size="20">Use SEN-15441 hardware v2.0 in documented SPI mode. IRQ is active HIGH.</text>
<text x="55" y="197" font-size="20">Read real pin labels. Keep the antenna clear. No 5 V connection in this exercise.</text>
<rect x="35" y="240" width="560" height="390" rx="10" fill="#ffffff" stroke="#b9cdd5" stroke-width="2"/>
<text x="55" y="278" font-size="23" font-weight="700">ESP32 GPIO             Sensor header</text>
<text x="65" y="330" font-size="23">GPIO5</text>
<path d="M235 323 H315" stroke="#08756c" stroke-width="3"/>
<text x="335" y="330" font-size="21">CS (idle HIGH)</text>
<text x="65" y="388" font-size="23">GPIO18</text>
<path d="M235 381 H315" stroke="#08756c" stroke-width="3"/>
<text x="335" y="388" font-size="21">SCK</text>
<text x="65" y="446" font-size="23">GPIO23</text>
<path d="M235 439 H315" stroke="#08756c" stroke-width="3"/>
<text x="335" y="446" font-size="21">MOSI</text>
<text x="65" y="504" font-size="23">GPIO19</text>
<path d="M235 497 H315" stroke="#08756c" stroke-width="3"/>
<text x="335" y="504" font-size="21">MISO</text>
<text x="65" y="562" font-size="23">GPIO4</text>
<path d="M235 555 H315" stroke="#08756c" stroke-width="3"/>
<text x="335" y="562" font-size="21">IRQ (input)</text>
<text x="55" y="607" font-size="18">GPIO5: no conflicting reset pull-down.</text>
<rect x="625" y="240" width="540" height="257" rx="10" fill="#ecf5f1" stroke="#b9cdd5" stroke-width="2"/>
<text x="645" y="278" font-size="23" font-weight="700">Optional OLED: USE_OLED=1 only</text>
<text x="645" y="315" font-size="20">3.3 V-compatible 128×64 I2C SSD1306</text>
<text x="645" y="348" font-size="20">VCC → 3V3; GND → common GND</text>
<text x="645" y="381" font-size="20">SDA → GPIO21; SCL → GPIO22</text>
<text x="645" y="414" font-size="20">Pull-ups to 3.3 V; check 0x3C / 0x3D</text>
<text x="645" y="447" font-size="20">USE_OLED=0: leave display disconnected</text>
<text x="645" y="480" font-size="20">Read ACK and buffer/init diagnostics</text>
<rect x="625" y="515" width="540" height="115" rx="10" fill="#ffffff" stroke="#b9cdd5" stroke-width="2"/>
<text x="645" y="550" font-size="22" font-weight="700">Indicator LED: GPIO26 → 220–330 Ω</text>
<text x="645" y="582" font-size="21">→ LED anode; LED cathode → GND</text>
<text x="645" y="615" font-size="19">Do not omit the series resistor.</text>
<text x="35" y="680" font-size="21" font-weight="700">Power off before wiring. Serial Monitor: 115200. Indoor supervised lesson only.</text>
<text x="35" y="719" font-size="20">Setup read-back is not chip identification, antenna tuning or lightning validation.</text>
<text x="35" y="757" font-size="21" font-weight="700">Use official weather warnings. No storm exposure, sparks or mains tests.</text>
</g></svg>
