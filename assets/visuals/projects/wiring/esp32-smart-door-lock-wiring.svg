<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">ESP32 RFID tabletop demo — MFRC522 + positional FS90</title>
<desc id="desc">Logical connection reference, not physical connector orientation. Follow exact module labels.</desc>
<rect width="1200" height="940" rx="20" fill="#edf3f7"/>
<g font-family="Arial, sans-serif" fill="#14283a">
<text x="40" y="52" font-size="30" font-weight="700">ESP32 RFID tabletop demo — MFRC522 + positional FS90</text>
<text x="40" y="90" font-size="21">Logical connections only — verify actual terminal labels. Disconnect power to rewire.</text>
<rect x="30" y="120" width="1140" height="329" rx="12" fill="#fff" stroke="#577387"/>
<text x="50" y="155" font-size="25" font-weight="700">3.3 V SPI reader: follow labels, not module orientation</text>
<text x="50" y="195" font-size="22">ESP32 3V3 / GND</text>
<path d="M535 188h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="195" font-size="22">Reader 3.3V / GND</text>
<text x="50" y="239" font-size="22">GPIO18</text>
<path d="M535 232h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="239" font-size="22">Reader SCK</text>
<text x="50" y="283" font-size="22">GPIO19</text>
<path d="M535 276h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="283" font-size="22">Reader MISO (reader → ESP32)</text>
<text x="50" y="327" font-size="22">GPIO23</text>
<path d="M535 320h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="327" font-size="22">Reader MOSI</text>
<text x="50" y="371" font-size="22">GPIO5</text>
<path d="M535 364h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="371" font-size="22">Reader SDA / SS (SPI select)</text>
<text x="50" y="415" font-size="22">GPIO22</text>
<path d="M535 408h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="415" font-size="22">Reader RST; IRQ unused</text>
<rect x="30" y="474" width="1140" height="241" rx="12" fill="#fff" stroke="#577387"/>
<text x="50" y="509" font-size="25" font-weight="700">Unloaded FS90 positional servo: separate regulated 5 V</text>
<text x="50" y="549" font-size="22">GPIO26</text>
<path d="M535 542h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="549" font-size="22">Servo Signal (3.3 V accepted)</text>
<text x="50" y="593" font-size="22">10 kΩ resistor</text>
<path d="M535 586h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="593" font-size="22">Signal to shared GND</text>
<text x="50" y="637" font-size="22">External regulated +5 V</text>
<path d="M535 630h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="637" font-size="22">Servo positive only</text>
<text x="50" y="681" font-size="22">External supply −</text>
<path d="M535 674h50m-10-6 10 6-10 6" fill="none" stroke="#205776" stroke-width="3"/>
<text x="610" y="681" font-size="22">Servo GND + ESP32 GND</text>
<text x="40" y="760" font-size="20">SPI.begin(18,19,23,5); GPIO5 is a classic ESP32 strap: review reset loading.</text>
<text x="40" y="795" font-size="20">Enrollment default: print UID, no servo pulses. Provision only your demonstration card.</text>
<text x="40" y="830" font-size="20">MFRC522: matching 13.56 MHz ISO/IEC 14443-A card, not a 125 kHz fob.</text>
<text x="40" y="865" font-size="20">Keep external +5 V off board positive. No solenoid, real door or security guarantee.</text>
</g></svg>
