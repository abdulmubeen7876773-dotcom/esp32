<text x="1005" y="547" font-family="Arial,sans-serif" font-size="19" fill="#153f38" font-weight="700">Motor B #992</text>
<text x="1005" y="577" font-family="Arial,sans-serif" font-size="17" fill="#153f38">100 nF across</text>
<text x="1005" y="602" font-family="Arial,sans-serif" font-size="17" fill="#153f38">motor terminals</text>
