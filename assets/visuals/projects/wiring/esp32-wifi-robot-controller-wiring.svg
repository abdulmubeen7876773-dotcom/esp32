<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc"><title id="title">ESP32 TB6612FNG bounded robot bench wiring</title><desc id="desc">Logical connections, not physical pin orientation or verified hardware.</desc><rect width="100%" height="100%" fill="#fff"/>
<text x="35" y="45" font-family="Arial,sans-serif" font-size="30" fill="#153f38" font-weight="700">Wi-Fi robot: defined standby + separate motor power</text>
<text x="35" y="82" font-family="Arial,sans-serif" font-size="21" fill="#153f38">Classic ESP32-WROOM / core 3.3.2 / Pololu carrier #713 / two #992 LP 6 V motors</text>
<text x="35" y="117" font-family="Arial,sans-serif" font-size="18" fill="#153f38">Logical net map only. Wheels lifted, chassis secured. No verified physical pin order or hardware result.</text>
<rect x="35" y="150" width="1130" height="78" rx="12" fill="#edf7f2" stroke="#326e60" stroke-width="2"/>
<text x="55" y="181" font-family="Arial,sans-serif" font-size="24" fill="#153f38" font-weight="700">USB powers ESP32; separate switched 6 V supply powers motors.</text>
<text x="55" y="211" font-family="Arial,sans-serif" font-size="20" fill="#153f38">Common GND only. Never join the motor-positive rail to USB, 3V3 or GPIO.</text>
<rect x="35" y="255" width="300" height="455" rx="12" fill="#edf7f2" stroke="#326e60" stroke-width="2"/>
<rect x="590" y="255" width="330" height="455" rx="12" fill="#edf7f2" stroke="#326e60" stroke-width="2"/>
