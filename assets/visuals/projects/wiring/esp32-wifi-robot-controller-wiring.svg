<path d="M920,585 L990,585" fill="none" stroke="#326e60" stroke-width="3"/>
<text x="930" y="525" font-family="Arial,sans-serif" font-size="15" fill="#153f38">BO1/2</text>
<rect x="35" y="745" width="1130" height="155" rx="12" fill="#edf7f2" stroke="#326e60" stroke-width="2"/>
<text x="55" y="779" font-family="Arial,sans-serif" font-size="23" fill="#153f38" font-weight="700">Motor-current loop — not breadboard signal rails</text>
<text x="55" y="815" font-family="Arial,sans-serif" font-size="20" fill="#153f38">Switched, regulated 6 V / 2 A current-limited source + → VMOT; minus → carrier GND.</text>
<text x="55" y="850" font-family="Arial,sans-serif" font-size="20" fill="#153f38">470 µF / 16 V at VMOT–GND, correct polarity. Retain carrier decoupling/protection.</text>
<text x="55" y="882" font-family="Arial,sans-serif" font-size="19" fill="#153f38">Motor return runs directly to carrier/supply. All signal grounds share that reference.</text>
<rect x="35" y="925" width="1130" height="130" rx="12" fill="#edf7f2" stroke="#326e60" stroke-width="2"/>
<text x="55" y="958" font-family="Arial,sans-serif" font-size="23" fill="#153f38" font-weight="700">STBY LOW = high-impedance standby; wheels can coast.</text>
<text x="55" y="994" font-family="Arial,sans-serif" font-size="19" fill="#153f38">250 ms software burst is not a certified stop. HTTP waits during each commanded burst.</text>
<text x="55" y="1027" font-family="Arial,sans-serif" font-size="19" fill="#153f38">Use the independent motor-power switch. No encoders, collision sensing or unattended operation.</text>
</svg>
