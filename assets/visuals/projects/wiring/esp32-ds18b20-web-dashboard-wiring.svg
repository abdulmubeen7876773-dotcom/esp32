<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>ESP32 DS18B20 Web Dashboard logical wiring</title><rect width="1200" height="800" rx="20" fill="#0b1d32"/><g font-family="Arial,sans-serif" fill="#f4f8ff"><text x="45" y="65" font-size="29">DS18B20 Web Dashboard</text><text x="45" y="107" font-size="22" fill="#bcd4e8">Logical connections only — not physical connector order</text><text x="45" y="155" font-size="22">Classic ESP32 WROOM DevKit</text><text x="590" y="155" font-size="22">Peripheral signal</text><circle cx="490" cy="197" r="5" fill="#8bd6e4"/><path d="M495 197 H565" stroke="#8bd6e4" stroke-width="3"/><text x="45" y="204" font-size="21">GPIO4</text><text x="590" y="204" font-size="21">DS18B20 DQ</text><text x="590" y="228" font-size="16" fill="#bcd4e8">4.7 kΩ pull-up between DQ and 3V3</text><circle cx="490" cy="262" r="5" fill="#8bd6e4"/><path d="M495 262 H565" stroke="#8bd6e4" stroke-width="3"/><text x="45" y="269" font-size="21">3V3</text><text x="590" y="269" font-size="21">DS18B20 VDD</text><text x="590" y="293" font-size="16" fill="#bcd4e8">Externally powered mode; no parasite power</text><circle cx="490" cy="327" r="5" fill="#8bd6e4"/><path d="M495 327 H565" stroke="#8bd6e4" stroke-width="3"/><text x="45" y="334" font-size="21">GND</text><text x="590" y="334" font-size="21">DS18B20 GND</text><text x="590" y="358" font-size="16" fill="#bcd4e8">Match actual part pin labels</text><text x="45" y="752" font-size="20" fill="#bcd4e8">Disconnect USB before wiring. All signal pull-ups go to 3.3 V.</text></g></svg>