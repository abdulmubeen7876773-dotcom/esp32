<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Thermostat: sensor, relay command and low-voltage load</title><desc id="desc">Logical blocks; active-HIGH input is the default. Never connect a bare coil to GPIO. Bare DHT22: vented front, leads down; left-to-right VCC, DATA, NC, GND. COM/NO opens the load circuit when the relay releases. Verify active-LOW variants. Startup/fault command OFF; reset/boot behavior requires module-specific hardware review. Unplug all supplies before rewiring. Mains and HVAC wiring are outside this tutorial.</desc><rect width="1200" height="800" rx="24" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="40" y="58" font-size="30" font-weight="bold">Thermostat: sensor, relay command and low-voltage load</text><text x="40" y="96" font-size="20">Logical blocks; active-HIGH input is the default. Never connect a bare coil to GPIO.</text><rect x="40" y="150" width="340" height="380" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="60" y="194" font-size="23" font-weight="bold">DHT22 → ESP32</text><text x="60" y="238" font-size="20">DHT22 VCC → 3.3 V</text><text x="60" y="276" font-size="20">DHT22 GND → GND</text><text x="60" y="314" font-size="20">DATA → GPIO4</text><text x="60" y="352" font-size="20">10 kΩ DATA → 3.3 V</text><text x="60" y="390" font-size="20">Bare pin3 NC: open</text><text x="60" y="428" font-size="20">GPIO26 → relay IN</text><path d="M384 335h38m-10-10 10 10-10 10" fill="none" stroke="#0369a1" stroke-width="4"/><rect x="430" y="150" width="340" height="380" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="450" y="194" font-size="23" font-weight="bold">Verified relay module</text><text x="450" y="238" font-size="20">3.3 V-compatible IN</text><text x="450" y="276" font-size="20">Built-in coil driver</text><text x="450" y="314" font-size="20">Supply: per module</text><text x="450" y="352" font-size="20">Signal GND → ESP32 GND</text><text x="450" y="390" font-size="20">HIGH = ON in example</text><text x="450" y="428" font-size="20">LOW = OFF in example</text><path d="M774 335h38m-10-10 10 10-10 10" fill="none" stroke="#0369a1" stroke-width="4"/><rect x="820" y="150" width="340" height="380" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="840" y="194" font-size="23" font-weight="bold">Low-voltage contacts</text><text x="840" y="238" font-size="20">Separate rated supply</text><text x="840" y="276" font-size="20">Supply + → COM</text><text x="840" y="314" font-size="20">NO → load +</text><text x="840" y="352" font-size="20">Load − → supply −</text><text x="840" y="390" font-size="20">NC is unused</text><text x="840" y="428" font-size="20">Not connected to GPIO</text><text x="40" y="585" font-size="21">Bare DHT22: vented front, leads down; left-to-right VCC, DATA, NC, GND.</text><text x="40" y="621" font-size="21">COM/NO opens the load circuit when the relay releases. Verify active-LOW variants.</text><text x="40" y="657" font-size="21">Startup/fault command OFF; reset/boot behavior requires module-specific hardware review.</text><text x="40" y="693" font-size="21">Unplug all supplies before rewiring. Mains and HVAC wiring are outside this tutorial.</text></g></svg>
