<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Learning Trainer: button and LED</title>
<desc id="desc">Classic ESP32-WROOM DevKit • INPUT_PULLUP on GPIO27 • no powered button module</desc>
<rect width="1200" height="780" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173c32;font-size:20px}.small{font-size:18px}.heading{font-size:28px;font-weight:700}.label{font-weight:700}.wire{fill:none;stroke:#17644d;stroke-width:3;stroke-linejoin:round}.power{stroke:#a33723}.ground{stroke:#334155}.box{fill:#f1f7f3;stroke:#17644d;stroke-width:2}</style>
<text x="40" y="45" class="heading">Learning Trainer: button and LED</text>
<text x="40" y="80" class="small">Classic ESP32-WROOM DevKit • INPUT_PULLUP on GPIO27 • no powered button module</text>
<rect x="40" y="130" width="400" height="145" rx="8" class="box"/>
<text x="56" y="160" class="label">Button input</text>
<text x="56" y="190" class="small">GPIO27 uses internal pull-up</text>
<text x="56" y="217" class="small">Released = HIGH; pressed = LOW</text>
<text x="56" y="244" class="small">No VCC wire to a bare button</text>
<text x="90" y="355" class="">GPIO27</text>
<polyline points="200,348 425,348" class="wire "/>
<rect x="425" y="310" width="300" height="90" rx="8" class="box"/>
<text x="441" y="340" class="label">Normally open button</text>
<text x="441" y="370" class="small">Check paired terminals first</text>
<polyline points="725,348 1000,348" class="wire "/>
<text x="1020" y="355" class="">GND</text>
<text x="90" y="475" class="">GPIO14</text>
<polyline points="205,468 320,468" class="wire "/>
<rect x="320" y="454" width="150" height="28" fill="white" stroke="#17644d" stroke-width="2"/>
<text x="320" y="444" class="small">1 kΩ</text>
<polyline points="470,468 590,468" class="wire "/>
<rect x="590" y="430" width="255" height="85" rx="8" class="box"/>
<text x="606" y="460" class="label">Discrete red LED</text>
<text x="606" y="490" class="small">Anode left; cathode right</text>
<polyline points="845,468 1000,468" class="wire "/>
<text x="1020" y="475" class="">GND</text>
<rect x="40" y="555" width="1115" height="110" rx="8" class="box"/>
<text x="56" y="585" class="label">Boot boundary</text>
<text x="56" y="615" class="small">GPIO12 is a strapping pin; its reset level can select the flash supply regardless of Wi-Fi use.</text>
<text x="56" y="642" class="small">This lesson uses GPIO27 instead. GPIO14 is available here because JTAG is not in use.</text>
<text x="40" y="732" class="small">Logical nets only: identify actual terminals using the selected manufacturer/package view.</text>
</svg>
