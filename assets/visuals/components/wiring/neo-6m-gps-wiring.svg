<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 685" role="img" aria-labelledby="title desc">
<title id="title">NEO-6M GPS: logical wiring</title><desc id="desc">GPS TX → GPIO16, common GND. Separate documented 3.3 V GPS supply; ESP32 USB. GPS RX and GPIO17 unwired.. Not a physical pin layout.</desc>
<rect width="1000" height="100%" rx="18" fill="#f4f8fb"/>
<g font-family="Arial,sans-serif" fill="#102b40"><text x="32" y="42" font-size="25" font-weight="bold">Logical connections · classic ESP32-WROOM</text><text x="32" y="75" font-size="17">Follow terminal labels and the table; not a physical pin layout.</text>
<rect x="30" y="92" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="92" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 125 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="115" font-size="17">GPS documented 3.3 V input</text>
<text x="595" y="115" font-size="17">External regulated 3.3 V</text>
<rect x="30" y="177" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="177" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 210 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="200" font-size="17">GPS GND / supply minus</text>
<text x="595" y="200" font-size="17">ESP32 GND</text>
<rect x="30" y="262" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="262" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 295 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="285" font-size="17">GPS TXD / TX</text>
<text x="595" y="285" font-size="17">GPIO16 (ESP32 RX)</text>
<rect x="30" y="347" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="347" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 380 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="370" font-size="17">GPS RXD / RX</text>
<text x="595" y="370" font-size="17">Leave disconnected</text>
<rect x="30" y="432" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="432" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 465 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="455" font-size="17">ESP32 GPIO17</text>
<text x="595" y="455" font-size="17">Leave disconnected</text>
<rect x="30" y="517" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="517" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 550 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="540" font-size="17">GPS antenna connector</text>
<text x="595" y="540" font-size="17">Documented compatible antenna</text>
</g></svg>