<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1110" role="img" aria-labelledby="title desc">
<title id="title">A4988 Stepper Driver: logical wiring</title><desc id="desc">VDD3.3 V; VMOT12 V with local capacitor; common GND. STEP25, DIR26, /ENABLE27. RESET/SLEEP HIGH, MS1–3 LOW; separate winding pairs to 1A/B and 2A/B.. Not a physical pin layout.</desc>
<rect width="1000" height="100%" rx="18" fill="#f4f8fb"/>
<g font-family="Arial,sans-serif" fill="#102b40"><text x="32" y="42" font-size="25" font-weight="bold">Logical connections · classic ESP32-WROOM</text><text x="32" y="75" font-size="17">Follow terminal labels and the table; not a physical pin layout.</text>
<rect x="30" y="92" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="92" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 125 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="115" font-size="17">VDD</text>
<text x="595" y="115" font-size="17">ESP32 3V3</text>
<rect x="30" y="177" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="177" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 210 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="200" font-size="17">Logic and motor GND</text>
<text x="595" y="200" font-size="17">ESP32 GND / supply negative</text>
<rect x="30" y="262" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="262" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 295 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="285" font-size="17">VMOT</text>
<text x="595" y="285" font-size="17">External regulated +12 V</text>
<rect x="30" y="347" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="347" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 380 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="370" font-size="17">≥47 µF / ≥25 V capacitor</text>
<text x="595" y="370" font-size="17">+ VMOT; − motor GND</text>
<rect x="30" y="432" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="432" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 465 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="455" font-size="17">STEP</text>
<text x="595" y="455" font-size="17">GPIO25 + 10 kOhm to GND</text>
<rect x="30" y="517" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="517" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 550 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="540" font-size="17">DIR</text>
<text x="595" y="540" font-size="17">GPIO26 + 10 kOhm to GND</text>
<rect x="30" y="602" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="602" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 635 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="625" font-size="17">/ENABLE</text>
<text x="595" y="625" font-size="17">GPIO27 + 10 kOhm to 3V3</text>
<rect x="30" y="687" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="687" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 720 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="710" font-size="17">/RESET and /SLEEP</text>
<text x="595" y="710" font-size="17">Both joined to VDD (3.3 V)</text>
<rect x="30" y="772" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="772" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 805 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="795" font-size="17">MS1, MS2, MS3</text>
<text x="595" y="795" font-size="17">GND</text>
<rect x="30" y="857" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="857" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 890 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="880" font-size="17">1A / 1B</text>
<text x="595" y="880" font-size="17">Motor coil A pair</text>
<rect x="30" y="942" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="942" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 975 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="965" font-size="17">2A / 2B</text>
<text x="595" y="965" font-size="17">Motor coil B pair</text>
</g></svg>