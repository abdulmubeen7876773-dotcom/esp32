<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Mini DC Gear Motor: logical wiring</title><desc id="desc">A documented unloaded motor connects to rated external DC supply; no ESP32 power or signal connection.. Not a physical pin layout.</desc>
<rect width="1000" height="100%" rx="18" fill="#f4f8fb"/>
<g font-family="Arial,sans-serif" fill="#102b40"><text x="32" y="42" font-size="25" font-weight="bold">Logical connections · bench setup</text><text x="32" y="75" font-size="17">Follow terminal labels and the table; not a physical pin layout.</text>
<rect x="30" y="92" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="92" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 125 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="115" font-size="17">Known motor terminal A</text>
<text x="595" y="115" font-size="17">Rated external supply positive</text>
<rect x="30" y="177" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="177" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 210 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="200" font-size="17">Known motor terminal B</text>
<text x="595" y="200" font-size="17">Supply negative</text>
<rect x="30" y="262" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="262" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 295 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="285" font-size="17">ESP32 GPIO /3V3</text>
<text x="595" y="285" font-size="17">No motor connection</text>
</g></svg>