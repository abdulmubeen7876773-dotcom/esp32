<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" role="img" aria-labelledby="title desc">
<title id="title">pH 7 buffer: logical preparation</title><desc id="desc">Fresh pH 7 aliquot → clean beaker → compatible probe/meter; no liquid-to-GPIO connection.. Not a physical pin layout.</desc>
