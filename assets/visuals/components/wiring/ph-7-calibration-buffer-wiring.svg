<g font-family="Arial,sans-serif" fill="#102b40"><text x="32" y="42" font-size="25" font-weight="bold">Logical connections · bench setup</text><text x="32" y="75" font-size="17">Preparation flow only; no electrical terminals on the solution.</text>
<rect x="30" y="92" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="92" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 125 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="115" font-size="17">Fresh labelled buffer</text>
<text x="595" y="115" font-size="17">Separate clean beaker</text>
<rect x="30" y="177" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="177" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 210 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="200" font-size="17">Compatible probe sensing end</text>
<text x="595" y="200" font-size="17">Buffer in beaker</text>
<rect x="30" y="262" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="262" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 295 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="285" font-size="17">Probe cable</text>
<text x="595" y="285" font-size="17">Compatible meter/interface</text>
<rect x="30" y="347" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="347" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 380 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="370" font-size="17">ESP32 GPIO</text>
<text x="595" y="370" font-size="17">No buffer connection</text>
