<text x="45" y="200" font-size="17">MFRC522 reader supply/SPI</text>
<text x="595" y="200" font-size="17">Existing reader wiring guide</text>
<rect x="30" y="262" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="262" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 295 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="285" font-size="17">Fob VCC / GPIO</text>
