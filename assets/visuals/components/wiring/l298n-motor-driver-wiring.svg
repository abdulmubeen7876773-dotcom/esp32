<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">l298n-motor-driver logical wiring connections</title>
<desc id="desc">Logical terminal-to-circuit connections, not a physical pin layout. Full wiring table on the page supplies electrical qualifications.</desc>
<rect width="1200" height="720" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#081d3a"><text x="35" y="38" font-size="27">Logical connections — not physical pin positions</text><text x="35" y="72" font-size="21">L298N Motor Driver · use the actual part/board documentation</text>
<rect x="35" y="105" width="330" height="80" rx="10" fill="#eaf0f7" stroke="#1488a6"/>
<text x="50" y="135" font-size="19">ENA</text>
<path d="M365 145H455" stroke="#1488a6" stroke-width="4"/>
<rect x="455" y="105" width="710" height="80" rx="10" fill="#ffffff" stroke="#1488a6"/>
<text x="473" y="134" font-size="19">GPIO25 with 10 kiloohm pull-down to GND</text>
<rect x="35" y="200" width="330" height="80" rx="10" fill="#eaf0f7" stroke="#1488a6"/>
<text x="50" y="230" font-size="19">IN1 / IN2</text>
<path d="M365 240H455" stroke="#1488a6" stroke-width="4"/>
<rect x="455" y="200" width="710" height="80" rx="10" fill="#ffffff" stroke="#1488a6"/>
<text x="473" y="229" font-size="19">GPIO26 / GPIO27, each with 10 kiloohm pull-down</text>
<rect x="35" y="295" width="330" height="80" rx="10" fill="#eaf0f7" stroke="#1488a6"/>
<text x="50" y="325" font-size="19">OUT1 / OUT2</text>
<path d="M365 335H455" stroke="#1488a6" stroke-width="4"/>
<rect x="455" y="295" width="710" height="80" rx="10" fill="#ffffff" stroke="#1488a6"/>
<text x="473" y="324" font-size="19">Two motor leads</text>
<rect x="35" y="390" width="330" height="80" rx="10" fill="#eaf0f7" stroke="#1488a6"/>
<text x="50" y="420" font-size="19">Motor supply / GND</text>
<path d="M365 430H455" stroke="#1488a6" stroke-width="4"/>
<rect x="455" y="390" width="710" height="80" rx="10" fill="#ffffff" stroke="#1488a6"/>
<text x="473" y="419" font-size="19">External 6 V / common GND</text>
<rect x="35" y="485" width="330" height="80" rx="10" fill="#eaf0f7" stroke="#1488a6"/>
<text x="50" y="515" font-size="19">Logic supply</text>
<path d="M365 525H455" stroke="#1488a6" stroke-width="4"/>
<rect x="455" y="485" width="710" height="80" rx="10" fill="#ffffff" stroke="#1488a6"/>
<text x="473" y="514" font-size="19">External regulated 5 V</text>
<rect x="35" y="580" width="330" height="80" rx="10" fill="#eaf0f7" stroke="#1488a6"/>
<text x="50" y="610" font-size="19">Unused bridge B</text>
<path d="M365 620H455" stroke="#1488a6" stroke-width="4"/>
<rect x="455" y="580" width="710" height="80" rx="10" fill="#ffffff" stroke="#1488a6"/>
<text x="473" y="609" font-size="19">ENB LOW; IN3/IN4 LOW; outputs unconnected</text>
</g></svg>