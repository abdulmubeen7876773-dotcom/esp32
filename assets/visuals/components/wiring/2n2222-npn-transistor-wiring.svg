<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 535" role="img" aria-labelledby="title desc">
<title id="title">2N2222 NPN Transistor: logical connections</title><desc id="desc">GPIO25 → 2.2 kOhm → base; emitter/GND common; 100 kOhm base-emitter. 3.3 V → 470 ohm → red LED anode; cathode → collector.. Terminal names only; not a physical pin layout.</desc>
<rect width="1000" height="535" rx="18" fill="#f4f8fb"/>
<g font-family="Arial,sans-serif" fill="#102b40"><text x="30" y="40" font-size="25" font-weight="bold">Logical connections · classic ESP32-WROOM</text><text x="30" y="75" font-size="17">Use the wiring table and manufacturer package view.</text>
<rect x="30" y="92" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="92" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 122 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="110" font-size="17">P2N2222A pin3 emitter</text>
<text x="595" y="110" font-size="17">ESP32 GND</text>
<rect x="30" y="167" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="167" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 197 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="185" font-size="17">P2N2222A pin2 base</text>
<text x="595" y="185" font-size="17">GPIO25 through 2.2 kOhm</text>
<rect x="30" y="242" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="242" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 272 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="260" font-size="17">100 kOhm resistor</text>
<text x="595" y="260" font-size="17">Base to emitter</text>
<rect x="30" y="317" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="317" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 347 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="335" font-size="17">ESP32 3.3 V</text>
<text x="595" y="335" font-size="17">470 ohm → LED anode</text>
<rect x="30" y="392" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="392" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 422 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="410" font-size="17">LED cathode</text>
<text x="595" y="410" font-size="17">P2N2222A pin1 collector</text>
</g></svg>