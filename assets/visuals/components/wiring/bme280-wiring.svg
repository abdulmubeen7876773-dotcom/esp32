<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 DevKit wired to BME280 over I2C</title>
  <desc id="desc">Wiring diagram showing BME280 VIN to ESP32 3.3 V, GND to GND, SDA to GPIO21, and SCL to GPIO22.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E8F7FF"/>
    </linearGradient>
    <linearGradient id="esp" x1="170" y1="126" x2="516" y2="624" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F718B"/>
      <stop offset="1" stop-color="#081D3A"/>
    </linearGradient>
    <linearGradient id="bme" x1="800" y1="214" x2="1100" y2="522" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1488A6"/>
      <stop offset="1" stop-color="#081D3A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#081D3A" flood-opacity=".16"/>
    </filter>
    <style>
      .label{font-family:Inter,Arial,sans-serif;font-weight:850;fill:#0F172A}
      .small{font-family:Inter,Arial,sans-serif;font-weight:750;fill:#475569}
      .pin{font-family:Inter,Arial,sans-serif;font-weight:850;fill:#E0F2FE}
      .wire{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1280" height="760" rx="34" fill="url(#bg)"/>
  <text x="640" y="64" text-anchor="middle" class="label" font-size="34">ESP32 DevKit + BME280 I2C wiring</text>
  <text x="640" y="102" text-anchor="middle" class="small" font-size="20">Common Arduino-ESP32 defaults: SDA on GPIO21 and SCL on GPIO22.</text>
  <g filter="url(#shadow)">
    <rect x="142" y="132" width="390" height="496" rx="36" fill="url(#esp)"/>
    <rect x="247" y="170" width="180" height="76" rx="14" fill="#111827"/>
    <text x="337" y="216" text-anchor="middle" class="pin" font-size="28">ESP32</text>
    <rect x="268" y="286" width="138" height="188" rx="16" fill="#0B1220" stroke="#BAE6FD" stroke-width="5"/>
    <text x="337" y="368" text-anchor="middle" class="pin" font-size="24">DevKit</text>
    <text x="337" y="402" text-anchor="middle" class="pin" font-size="17">3.3 V logic</text>
    <g fill="#FBBF24">
      <circle cx="532" cy="236" r="11"/>
      <circle cx="532" cy="304" r="11"/>
      <circle cx="532" cy="372" r="11"/>
      <circle cx="532" cy="440" r="11"/>
    </g>
    <g class="pin" font-size="18" text-anchor="end">
      <text x="510" y="243">3V3</text>
      <text x="510" y="311">GND</text>
      <text x="510" y="379">GPIO21 SDA</text>
      <text x="510" y="447">GPIO22 SCL</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="806" y="214" width="320" height="326" rx="34" fill="url(#bme)"/>
    <circle cx="856" cy="264" r="18" fill="#E0F2FE"/>
    <circle cx="1076" cy="490" r="18" fill="#E0F2FE"/>
    <rect x="920" y="292" width="92" height="80" rx="13" fill="#111827" stroke="#BAE6FD" stroke-width="5"/>
    <text x="966" y="416" text-anchor="middle" class="pin" font-size="32">BME280</text>
    <text x="966" y="446" text-anchor="middle" class="pin" font-size="16">0x76 or 0x77</text>
    <g fill="#FBBF24">
      <circle cx="806" cy="286" r="11"/>
      <circle cx="806" cy="354" r="11"/>
      <circle cx="806" cy="422" r="11"/>
      <circle cx="806" cy="490" r="11"/>
    </g>
    <g class="pin" font-size="18">
      <text x="828" y="293">VIN / VCC</text>
      <text x="828" y="361">GND</text>
      <text x="828" y="429">SDA / SDI</text>
      <text x="828" y="497">SCL / SCK</text>
    </g>
  </g>
  <path class="wire" d="M532 236 C630 200 704 216 806 286" stroke="#EF4444"/>
  <path class="wire" d="M532 304 C625 300 713 318 806 354" stroke="#111827"/>
  <path class="wire" d="M532 372 C630 404 716 430 806 422" stroke="#0EA5E9"/>
  <path class="wire" d="M532 440 C632 500 716 516 806 490" stroke="#F59E0B"/>
  <g class="label" font-size="18">
    <rect x="582" y="176" width="198" height="42" rx="14" fill="#FEE2E2"/>
    <text x="681" y="204" text-anchor="middle" fill="#991B1B">3.3 V only</text>
    <rect x="584" y="524" width="244" height="42" rx="14" fill="#DBEAFE"/>
    <text x="706" y="552" text-anchor="middle" fill="#075985">I2C signals stay at 3.3 V</text>
  </g>
  <g transform="translate(132 668)">
    <rect width="1016" height="54" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="28" y="35" class="small" font-size="18">No OLED, Wi-Fi, MQTT, or extra devices shown here: this is the first BME280 bench test wiring.</text>
  </g>
</svg>
