<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
<title id="title">WS2812B RGB Strip: logical connections</title><desc id="desc">GPIO25 → AHCT input; output → 330 ohm → DIN. Pixel/buffer use external5 V and common GND; DOUT unused. Capacitor and buffer terminations as listed.. Terminal names only; not a physical pin layout.</desc>
<rect width="1000" height="1060" rx="18" fill="#f4f8fb"/>
<g font-family="Arial,sans-serif" fill="#102b40"><text x="30" y="40" font-size="25" font-weight="bold">Logical connections · classic ESP32-WROOM</text><text x="30" y="75" font-size="17">Use the wiring table and manufacturer package view.</text>
<rect x="30" y="92" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="92" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 122 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="110" font-size="17">74AHCT125 pin14 VCC</text>
<text x="595" y="110" font-size="17">External regulated +5 V</text>
<rect x="30" y="167" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="167" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 197 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="185" font-size="17">74AHCT125 pin7 GND</text>
<text x="595" y="185" font-size="17">Common GND</text>
<rect x="30" y="242" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="242" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 272 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="260" font-size="17">74AHCT125 pin2 1A</text>
<text x="595" y="260" font-size="17">GPIO25 + 10 kOhm to GND</text>
<rect x="30" y="317" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="317" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 347 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="335" font-size="17">74AHCT125 pin1 /1OE</text>
<text x="595" y="335" font-size="17">GND</text>
<rect x="30" y="392" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="392" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 422 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="410" font-size="17">Unused /OE: 4,10,13</text>
<text x="595" y="410" font-size="17">+5 V</text>
<rect x="30" y="467" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="467" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 497 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="485" font-size="17">Unused A: 5,9,12</text>
<text x="595" y="485" font-size="17">GND</text>
<rect x="30" y="542" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="542" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 572 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="560" font-size="17">100 nF ceramic</text>
<text x="595" y="560" font-size="17">Between pins14 and7</text>
<rect x="30" y="617" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="617" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 647 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="635" font-size="17">74AHCT125 pin3 1Y</text>
<text x="595" y="635" font-size="17">330 ohm → pixel DIN</text>
<rect x="30" y="692" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="692" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 722 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="710" font-size="17">Pixel +5 V</text>
<text x="595" y="710" font-size="17">External regulated +5 V</text>
<rect x="30" y="767" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="767" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 797 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="785" font-size="17">Pixel GND</text>
<text x="595" y="785" font-size="17">Common GND</text>
<rect x="30" y="842" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="842" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 872 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="860" font-size="17">Pixel DOUT</text>
<text x="595" y="860" font-size="17">Not connected</text>
<rect x="30" y="917" width="390" height="64" rx="7" fill="#e2edf3"/><rect x="580" y="917" width="390" height="64" rx="7" fill="#e2edf3"/><path d="M420 947 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="935" font-size="17">1000 microfarad capacitor</text>
<text x="595" y="935" font-size="17">+ to +5 V; - to GND</text>
</g></svg>