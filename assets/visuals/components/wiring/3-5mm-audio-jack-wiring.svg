<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">3.5 mm Audio Jack: logical wiring</title><desc id="desc">Map plug tip/ring/sleeve to actual jack terminals using continuity, not drawing position.. Not a physical pin layout.</desc>
<rect width="1000" height="100%" rx="18" fill="#f4f8fb"/>
<g font-family="Arial,sans-serif" fill="#102b40"><text x="32" y="42" font-size="25" font-weight="bold">Logical connections · bench setup</text><text x="32" y="75" font-size="17">Follow terminal labels and the table; not a physical pin layout.</text>
<rect x="30" y="92" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="92" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 125 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="115" font-size="17">Inserted plug tip</text>
<text x="595" y="115" font-size="17">Measured jack T terminal</text>
<rect x="30" y="177" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="177" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 210 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="200" font-size="17">Inserted plug ring</text>
<text x="595" y="200" font-size="17">Measured jack R terminal</text>
<rect x="30" y="262" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="262" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 295 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="285" font-size="17">Inserted plug sleeve</text>
<text x="595" y="285" font-size="17">Measured jack S terminal</text>
<rect x="30" y="347" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="347" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 380 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="370" font-size="17">Other / switch terminals</text>
<text x="595" y="370" font-size="17">Document separately; leave</text>
<text x="595" y="391" font-size="17">isolated</text>
<rect x="30" y="432" width="390" height="72" rx="7" fill="#e2edf3"/><rect x="580" y="432" width="390" height="72" rx="7" fill="#e2edf3"/>
<path d="M420 465 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="455" font-size="17">ESP32 GPIO</text>
<text x="595" y="455" font-size="17">No connection</text>
</g></svg>