<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" role="img" aria-labelledby="title desc">
<title id="title">MPU6050 Motion Sensor: logical wiring</title><desc id="desc">Reference Adafruit VIN to 3.3 V, common GND, SDA21, SCL22 and default AD0 LOW for 0x68. INT unused.. Not a physical pin layout.</desc>
<rect width="1000" height="100%" rx="18" fill="#f4f8fb"/>
<g font-family="Arial,sans-serif" fill="#102b40"><text x="32" y="42" font-size="25" font-weight="bold">Logical connections · classic ESP32-WROOM</text><text x="32" y="75" font-size="17">Follow terminal labels and the table; not a physical pin layout.</text>
<rect x="30" y="92" width="390" height="40" rx="7" fill="#e2edf3"/><rect x="580" y="92" width="390" height="40" rx="7" fill="#e2edf3"/>
<path d="M420 112 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="118" font-size="19">VIN (reference breakout)</text><text x="595" y="118" font-size="19">ESP32 3.3 V</text>
<rect x="30" y="147" width="390" height="40" rx="7" fill="#e2edf3"/><rect x="580" y="147" width="390" height="40" rx="7" fill="#e2edf3"/>
<path d="M420 167 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="173" font-size="19">GND</text><text x="595" y="173" font-size="19">ESP32 GND</text>
<rect x="30" y="202" width="390" height="40" rx="7" fill="#e2edf3"/><rect x="580" y="202" width="390" height="40" rx="7" fill="#e2edf3"/>
<path d="M420 222 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="228" font-size="19">SDA</text><text x="595" y="228" font-size="19">GPIO21</text>
<rect x="30" y="257" width="390" height="40" rx="7" fill="#e2edf3"/><rect x="580" y="257" width="390" height="40" rx="7" fill="#e2edf3"/>
<path d="M420 277 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="283" font-size="19">SCL</text><text x="595" y="283" font-size="19">GPIO22</text>
<rect x="30" y="312" width="390" height="40" rx="7" fill="#e2edf3"/><rect x="580" y="312" width="390" height="40" rx="7" fill="#e2edf3"/>
<path d="M420 332 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="338" font-size="19">AD0 (reference breakout)</text><text x="595" y="338" font-size="19">Leave at default LOW</text>
<rect x="30" y="367" width="390" height="40" rx="7" fill="#e2edf3"/><rect x="580" y="367" width="390" height="40" rx="7" fill="#e2edf3"/>
<path d="M420 387 H580" stroke="#146f88" stroke-width="3"/>
<text x="45" y="393" font-size="19">INT / auxiliary pins</text><text x="595" y="393" font-size="19">Not connected</text>
</g></svg>