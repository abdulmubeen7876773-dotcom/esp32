<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">STEMMA 4409 relay: logical wiring</title><desc id="desc">USB powers a classic ESP32. GPIO26 drives the supported STEMMA 4409 Signal with a 10 kiloohm ground pull-down. External regulated 5 V powers the relay; its negative shares ESP32 ground, not the USB 5 V rail. A separate 3 V battery powers an LED and 330 ohm resistor through COM and NO. NC is unused. </desc>
<style>text{font:21px Arial,sans-serif;fill:#0f172a}.head{font-weight:bold;font-size:24px}.small{font-size:18px}.wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="800" fill="#fff" rx="16"/>
<text x="50" y="40" class="head">STEMMA 4409 relay: logical wiring</text><text x="50" y="75">Supported relay: Adafruit STEMMA Non-Latching Mini Relay 4409</text>
<rect x="50" y="150" width="280" height="235" rx="12" fill="#eff6ff" stroke="#334155"/>
<text x="70" y="184" class="head">Classic ESP32</text><text x="70" y="223">GPIO26 — 3.3 V logic</text><text x="70" y="323">GND</text><text x="70" y="356" class="small">USB powered separately</text>
<rect x="750" y="150" width="390" height="235" rx="12" fill="#f0fdf4" stroke="#334155"/>
<text x="775" y="185" class="head">STEMMA 4409</text><text x="775" y="225">White Signal (HIGH = ON)</text><text x="775" y="275">Red Vin</text><text x="775" y="325">Black GND</text><text x="775" y="357" class="small">Driver is on the relay board</text>
<path d="M330 215 H750" class="wire" stroke="#047857"/>
<path d="M450 215 V248 M450 288 V315" class="wire" stroke="#334155"/><rect x="439" y="248" width="22" height="40" fill="#fff" stroke="#334155" stroke-width="3"/>
<text x="476" y="270">10 kΩ pull-down</text>
<path d="M330 315 H750" class="wire" stroke="#334155"/>
<circle cx="450" cy="215" r="6" fill="#047857"/><circle cx="450" cy="315" r="6" fill="#334155"/><circle cx="690" cy="315" r="6" fill="#334155"/><circle cx="450" cy="215" r="6" fill="#047857"/><circle cx="450" cy="315" r="6" fill="#334155"/><circle cx="690" cy="315" r="6" fill="#334155"/><circle cx="450" cy="215" r="6" fill="#047857"/><circle cx="450" cy="315" r="6" fill="#334155"/><circle cx="690" cy="315" r="6" fill="#334155"/><circle cx="450" cy="215" r="6" fill="#047857"/><circle cx="450" cy="315" r="6" fill="#334155"/><circle cx="690" cy="315" r="6" fill="#334155"/><rect x="370" y="100" width="345" height="75" rx="8" fill="#fff7ed" stroke="#334155"/><text x="385" y="125">External regulated 5 V</text><text x="385" y="151" class="small">≥100 mA for relay alone</text>
<path d="M715 140 H1180 V265 H1140" class="wire" stroke="#b91c1c"/><text x="725" y="119" class="small">+</text>
<path d="M380 175 V190 H350 V140 H30 V395 H690 V315" class="wire" stroke="#334155"/><text x="391" y="200" class="small">−</text>
<text x="60" y="421" class="small">Never join this external +5 V to the USB-powered DevKit 5 V rail.</text>
<rect x="50" y="445" width="1090" height="115" rx="10" fill="#f8fafc" stroke="#334155"/>
<text x="70" y="476" class="head">Separate contact circuit: 3 V battery LED load</text>
<text x="70" y="511">Battery + → COM → NO → 330 Ω → red LED anode → cathode → battery −</text>
<text x="70" y="541" class="small">NC unused. No connection to ESP32 GND is required for this battery circuit.</text>
<text x="60" y="635">HIGH commands ON: COM connects to NO.</text><text x="60" y="670">LOW commands OFF: COM connects to NC; the LED path is open.</text><text x="60" y="705">Use the supported module labels. This is not a physical pin-placement drawing.</text>
<text x="600" y="629" class="small"></text>
<text x="600" y="658" class="small"></text>
<text x="600" y="705" class="small"></text>
<text x="50" y="780" class="small">Disconnect all supplies before rewiring. Low-voltage demonstration only; no mains or fail-safe claim.</text>
</svg>