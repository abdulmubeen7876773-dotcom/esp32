<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">rgb-led logical wiring connections</title>
<desc id="desc">Logical terminal-to-circuit connections, not a physical pin layout. Full wiring table on the page supplies electrical qualifications.</desc>
<rect width="1200" height="530" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#081d3a"><text x="35" y="38" font-size="27">Logical connections — not physical pin positions</text><text x="35" y="72" font-size="21">Rgb Led · use the actual part/board documentation</text>
