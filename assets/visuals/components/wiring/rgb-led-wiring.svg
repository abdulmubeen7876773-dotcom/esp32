<text x="50" y="325" font-size="19">Green anode</text>
<path d="M365 335H455" stroke="#1488a6" stroke-width="4"/>
<rect x="455" y="295" width="710" height="80" rx="10" fill="#ffffff" stroke="#1488a6"/>
<text x="473" y="324" font-size="19">GPIO26 through 470 ohms</text>
