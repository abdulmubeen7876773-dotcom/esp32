<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">BME280 breakout module illustration</title>
  <desc id="desc">Clean illustration of a generic BME280 breakout sensor module with a small sensor package, mounting holes, and a six-pin header.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F7FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="board" x1="210" y1="118" x2="742" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F718B"/>
      <stop offset="1" stop-color="#081D3A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#081D3A" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <path d="M122 124h142M92 404h186M704 120h132M730 404h106" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" opacity=".45"/>
  <g filter="url(#shadow)">
    <rect x="210" y="118" width="540" height="304" rx="34" fill="url(#board)"/>
    <circle cx="266" cy="174" r="22" fill="#E0F2FE" opacity=".95"/>
    <circle cx="694" cy="366" r="22" fill="#E0F2FE" opacity=".95"/>
    <circle cx="266" cy="174" r="10" fill="#081D3A" opacity=".38"/>
    <circle cx="694" cy="366" r="10" fill="#081D3A" opacity=".38"/>
    <rect x="392" y="184" width="176" height="128" rx="18" fill="#0B1220" stroke="#BAE6FD" stroke-width="5"/>
    <rect x="426" y="214" width="108" height="68" rx="8" fill="#182338"/>
    <path d="M446 246h68M480 226v40" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
    <text x="480" y="348" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="800" fill="#E0F2FE">BME280</text>
    <text x="480" y="382" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#BAE6FD">I2C environmental sensor module</text>
    <g transform="translate(287 392)">
      <rect x="0" y="0" width="386" height="48" rx="16" fill="#1E293B"/>
      <g fill="#FBBF24">
        <circle cx="34" cy="24" r="11"/>
        <circle cx="98" cy="24" r="11"/>
        <circle cx="162" cy="24" r="11"/>
        <circle cx="226" cy="24" r="11"/>
        <circle cx="290" cy="24" r="11"/>
        <circle cx="354" cy="24" r="11"/>
      </g>
    </g>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-weight="800" fill="#0F172A">
    <text x="480" y="78" text-anchor="middle" font-size="30">Generic BME280 breakout/module illustration</text>
    <text x="480" y="488" text-anchor="middle" font-size="20" fill="#475569">Sensor package, breakout board, mounting holes, and header pins shown for orientation.</text>
  </g>
</svg>
