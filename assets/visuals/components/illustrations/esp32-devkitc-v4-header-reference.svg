<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc">
<title id="title">ESP32-DevKitC V4 WROOM header connector reference</title>
<desc id="desc">J2 and J3 connector numbers from Espressif documentation. This is a reference table, not a physical orientation drawing. Supply pins are distinct from 3.3 V GPIO signals.</desc>
<rect width="1200" height="1150" rx="20" fill="#f8fbfc"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#10233f">
<text x="40" y="55" font-size="30" font-weight="700">ESP32-DevKitC V4 • WROOM header reference</text>
<text x="40" y="95" font-size="21">Connector numbers — verify orientation on your actual board.</text>
<text x="40" y="150" font-size="26" font-weight="700">J2 • pin number and label</text>
<rect x="40" y="175" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="52" y="203" font-size="21">01   3V3 — supply</text>
<rect x="40" y="218" width="540" height="40" rx="4" fill="#ffffff"/><text x="52" y="246" font-size="21">02   EN — reset</text>
<rect x="40" y="261" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="52" y="289" font-size="21">03   VP — GPIO36 / ADC1 / input only</text>
<rect x="40" y="304" width="540" height="40" rx="4" fill="#ffffff"/><text x="52" y="332" font-size="21">04   VN — GPIO39 / ADC1 / input only</text>
<rect x="40" y="347" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="52" y="375" font-size="21">05   IO34 — ADC1 / input only</text>
<rect x="40" y="390" width="540" height="40" rx="4" fill="#ffffff"/><text x="52" y="418" font-size="21">06   IO35 — ADC1 / input only</text>
<rect x="40" y="433" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="52" y="461" font-size="21">07   IO32 — ADC1</text>
<rect x="40" y="476" width="540" height="40" rx="4" fill="#ffffff"/><text x="52" y="504" font-size="21">08   IO33 — ADC1</text>
<rect x="40" y="519" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="52" y="547" font-size="21">09   IO25 — ADC2</text>
<rect x="40" y="562" width="540" height="40" rx="4" fill="#ffffff"/><text x="52" y="590" font-size="21">10   IO26 — ADC2</text>
<rect x="40" y="605" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="52" y="633" font-size="21">11   IO27 — ADC2</text>
<rect x="40" y="648" width="540" height="40" rx="4" fill="#ffffff"/><text x="52" y="676" font-size="21">12   IO14 — ADC2</text>
<rect x="40" y="691" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="52" y="719" font-size="21">13   IO12 — ADC2 / strapping</text>
<rect x="40" y="734" width="540" height="40" rx="4" fill="#ffffff"/><text x="52" y="762" font-size="21">14   GND</text>
<rect x="40" y="777" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="52" y="805" font-size="21">15   IO13 — ADC2</text>
<rect x="40" y="820" width="540" height="40" rx="4" fill="#ffffff"/><text x="52" y="848" font-size="21">16   D2 — GPIO9 / flash: avoid</text>
<rect x="40" y="863" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="52" y="891" font-size="21">17   D3 — GPIO10 / flash: avoid</text>
<rect x="40" y="906" width="540" height="40" rx="4" fill="#ffffff"/><text x="52" y="934" font-size="21">18   CMD — GPIO11 / flash: avoid</text>
<rect x="40" y="949" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="52" y="977" font-size="21">19   5V — supply</text>
<text x="620" y="150" font-size="26" font-weight="700">J3 • pin number and label</text>
<rect x="620" y="175" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="632" y="203" font-size="21">01   GND</text>
<rect x="620" y="218" width="540" height="40" rx="4" fill="#ffffff"/><text x="632" y="246" font-size="21">02   IO23</text>
<rect x="620" y="261" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="632" y="289" font-size="21">03   IO22</text>
<rect x="620" y="304" width="540" height="40" rx="4" fill="#ffffff"/><text x="632" y="332" font-size="21">04   TX — GPIO1 / USB serial</text>
<rect x="620" y="347" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="632" y="375" font-size="21">05   RX — GPIO3 / USB serial</text>
<rect x="620" y="390" width="540" height="40" rx="4" fill="#ffffff"/><text x="632" y="418" font-size="21">06   IO21</text>
<rect x="620" y="433" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="632" y="461" font-size="21">07   GND</text>
<rect x="620" y="476" width="540" height="40" rx="4" fill="#ffffff"/><text x="632" y="504" font-size="21">08   IO19</text>
<rect x="620" y="519" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="632" y="547" font-size="21">09   IO18</text>
<rect x="620" y="562" width="540" height="40" rx="4" fill="#ffffff"/><text x="632" y="590" font-size="21">10   IO5 — strapping</text>
<rect x="620" y="605" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="632" y="633" font-size="21">11   IO17 — WROOM only*</text>
<rect x="620" y="648" width="540" height="40" rx="4" fill="#ffffff"/><text x="632" y="676" font-size="21">12   IO16 — WROOM only*</text>
<rect x="620" y="691" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="632" y="719" font-size="21">13   IO4 — ADC2</text>
<rect x="620" y="734" width="540" height="40" rx="4" fill="#ffffff"/><text x="632" y="762" font-size="21">14   IO0 — ADC2 / BOOT / strapping</text>
<rect x="620" y="777" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="632" y="805" font-size="21">15   IO2 — ADC2 / strapping</text>
<rect x="620" y="820" width="540" height="40" rx="4" fill="#ffffff"/><text x="632" y="848" font-size="21">16   IO15 — ADC2 / strapping</text>
<rect x="620" y="863" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="632" y="891" font-size="21">17   D1 — GPIO8 / flash: avoid</text>
<rect x="620" y="906" width="540" height="40" rx="4" fill="#ffffff"/><text x="632" y="934" font-size="21">18   D0 — GPIO7 / flash: avoid</text>
<rect x="620" y="949" width="540" height="40" rx="4" fill="#e8f0f5"/><text x="632" y="977" font-size="21">19   CLK — GPIO6 / flash: avoid</text>
<text x="40" y="1030" font-size="21">GPIO signals: 3.3 V logic, not 5 V tolerant. Supply pins are not GPIO.</text>
<text x="40" y="1065" font-size="21">* GPIO16/17: reserved on WROVER; available on WROOM versions.</text>
<text x="40" y="1100" font-size="21">Strapping pins affect boot. Flash pins are not beginner connection points.</text>
</g></svg>
