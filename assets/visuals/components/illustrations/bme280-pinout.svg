<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">BME280 breakout module pinout</title>
  <desc id="desc">Pinout diagram for a common BME280 breakout showing VIN, GND, SCL, SDA as beginner I2C pins and CS, SDO as optional advanced pins.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="board" x1="376" y1="126" x2="744" y2="532" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F718B"/>
      <stop offset="1" stop-color="#081D3A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#081D3A" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1120" height="680" rx="34" fill="url(#panel)"/>
  <text x="560" y="64" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="850" fill="#0F172A">BME280 I2C breakout pinout</text>
  <text x="560" y="102" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#475569">Beginner path: 3.3 V, GND, SDA, and SCL. Optional pins depend on breakout design.</text>
  <g filter="url(#shadow)">
    <rect x="386" y="148" width="348" height="386" rx="34" fill="url(#board)"/>
    <circle cx="432" cy="198" r="19" fill="#E0F2FE"/>
    <circle cx="688" cy="484" r="19" fill="#E0F2FE"/>
    <rect x="500" y="242" width="120" height="94" rx="14" fill="#111827" stroke="#BAE6FD" stroke-width="5"/>
    <text x="560" y="382" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="850" fill="#E0F2FE">BME280</text>
    <text x="560" y="414" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="750" fill="#BAE6FD">Temp + RH + Pressure</text>
    <g transform="translate(398 524)">
      <rect x="0" y="0" width="324" height="44" rx="14" fill="#0F172A"/>
      <g id="pins" fill="#FBBF24">
        <circle cx="27" cy="22" r="10"/>
        <circle cx="81" cy="22" r="10"/>
        <circle cx="135" cy="22" r="10"/>
        <circle cx="189" cy="22" r="10"/>
        <circle cx="243" cy="22" r="10"/>
        <circle cx="297" cy="22" r="10"/>
      </g>
    </g>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">
    <g fill="#0F766E" stroke="#0F766E" stroke-width="4" stroke-linecap="round">
      <path d="M425 546H198"/>
      <path d="M479 546H198"/>
      <path d="M533 546H198"/>
      <path d="M587 546H198"/>
    </g>
    <g fill="#0F766E">
      <rect x="74" y="198" width="230" height="58" rx="16" opacity=".12"/>
      <rect x="74" y="278" width="230" height="58" rx="16" opacity=".12"/>
      <rect x="74" y="358" width="230" height="58" rx="16" opacity=".12"/>
      <rect x="74" y="438" width="230" height="58" rx="16" opacity=".12"/>
      <text x="94" y="234">VIN / VCC -> ESP32 3.3 V</text>
      <text x="94" y="314">GND -> ESP32 GND</text>
      <text x="94" y="394">SCL / SCK -> GPIO22</text>
      <text x="94" y="474">SDA / SDI -> GPIO21</text>
    </g>
    <g fill="#64748B" stroke="#64748B" stroke-width="4" stroke-linecap="round">
      <path d="M641 546h290"/>
      <path d="M695 546h236"/>
    </g>
    <g fill="#475569">
      <rect x="810" y="254" width="232" height="64" rx="16" opacity=".14"/>
      <rect x="810" y="350" width="232" height="64" rx="16" opacity=".14"/>
      <text x="832" y="291">CS / CSB optional</text>
      <text x="832" y="387">SDO address select</text>
    </g>
  </g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" font-size="16" font-weight="850">
    <text x="425" y="616" fill="#0F766E">VIN</text>
    <text x="479" y="616" fill="#0F766E">GND</text>
    <text x="533" y="616" fill="#0F766E">SCL</text>
    <text x="587" y="616" fill="#0F766E">SDA</text>
    <text x="641" y="616" fill="#475569">CS</text>
    <text x="695" y="616" fill="#475569">SDO</text>
  </g>
  <rect x="74" y="556" width="298" height="54" rx="16" fill="#DCFCE7"/>
  <text x="223" y="590" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="850" fill="#14532D">Required I2C beginner pins</text>
  <rect x="748" y="556" width="298" height="54" rx="16" fill="#E2E8F0"/>
  <text x="897" y="590" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="850" fill="#334155">Optional / advanced pins</text>
</svg>
