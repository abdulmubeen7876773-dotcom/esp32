<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Product-style BME280 breakout module visual</title>
  <desc id="desc">Product-style illustration of a generic BME280 breakout module angled on a light bench surface with readable VIN, GND, SCL, SDA, CS, and SDO labels.</desc>
  <defs>
    <linearGradient id="bench" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="board" x1="276" y1="116" x2="689" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1488A6"/>
      <stop offset="1" stop-color="#081D3A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#081D3A" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bench)"/>
  <ellipse cx="486" cy="430" rx="254" ry="38" fill="#081D3A" opacity=".12"/>
  <g filter="url(#shadow)" transform="rotate(-7 480 270)">
    <rect x="262" y="116" width="436" height="304" rx="32" fill="url(#board)"/>
    <circle cx="320" cy="174" r="21" fill="#E0F2FE"/>
    <circle cx="640" cy="362" r="21" fill="#E0F2FE"/>
    <circle cx="320" cy="174" r="9" fill="#0F172A" opacity=".35"/>
    <circle cx="640" cy="362" r="9" fill="#0F172A" opacity=".35"/>
    <rect x="414" y="184" width="132" height="106" rx="16" fill="#111827" stroke="#BAE6FD" stroke-width="5"/>
    <rect x="445" y="211" width="70" height="50" rx="8" fill="#1E293B"/>
    <path d="M460 236h40M480 220v32" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
    <text x="480" y="328" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#E0F2FE">BME280</text>
    <text x="480" y="356" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#BAE6FD">TEMP  HUMIDITY  PRESSURE</text>
    <g transform="translate(309 390)">
      <rect x="0" y="0" width="342" height="46" rx="15" fill="#0F172A"/>
      <g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#E0F2FE" text-anchor="middle">
        <text x="28" y="-10">VIN</text>
        <text x="85" y="-10">GND</text>
        <text x="142" y="-10">SCL</text>
        <text x="199" y="-10">SDA</text>
        <text x="256" y="-10">CS</text>
        <text x="313" y="-10">SDO</text>
      </g>
      <g fill="#FBBF24">
        <circle cx="28" cy="23" r="10"/>
        <circle cx="85" cy="23" r="10"/>
        <circle cx="142" cy="23" r="10"/>
        <circle cx="199" cy="23" r="10"/>
        <circle cx="256" cy="23" r="10"/>
        <circle cx="313" cy="23" r="10"/>
      </g>
    </g>
  </g>
  <text x="480" y="72" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#0F172A">BME280 breakout module visual</text>
  <text x="480" y="494" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#475569">Illustration, not a manufacturer-specific photo.</text>
</svg>
