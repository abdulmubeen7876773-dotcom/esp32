- id: programming
  title: Make sense of the code
  label: ESP32 programming
  level: Beginner
  description: Build confidence reading and changing a small Arduino sketch.
  outcome: Start with a complete example; the standalone programming topics are a future expansion.
  parts: Working IDE and ESP32; Serial-only examples need no extra circuit.
  challenge: Locate setup() and loop() in a complete sketch and explain what each part does.
  quiz:
    question: Which Arduino function repeats during normal execution?
    answers:
    - setup()
    - loop()
    correct: 1
    explanation: setup() runs once after startup; loop() repeats during normal execution.
