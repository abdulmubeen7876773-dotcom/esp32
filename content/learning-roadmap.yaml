- id: foundations
  title: Start with the board
  label: ESP32 basics
  level: Beginner
  description: Understand your board before you power a circuit.
  outcome: Identify chip, module and development board; read the actual pin labels.
  parts: ESP32 board; no external circuit needed.
  challenge: Find the USB connector, BOOT, EN, 3V3 and GND on your own board.
  quiz:
    question: Does USB power make an ESP32 GPIO 5 V tolerant?
    answers:
    - Yes, all pins accept USB voltage
    - No, GPIO signal limits are separate
    correct: 1
    explanation: The board supply and GPIO signal limits are different. Use the limits in your exact board and chip
      documentation.
