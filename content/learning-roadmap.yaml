  label: Arduino IDE setup
  level: Beginner
  description: Get from a blank sketch to a working Serial message.
  outcome: Install the board package, select a port and verify a Serial-only upload.
  parts: ESP32, data-capable USB cable and computer.
  challenge: Note your selected board, port, installed core and Serial baud rate.
  quiz:
    question: A board powers up but no port appears. What should you check first?
    answers:
    - A known data-capable USB cable
    - Add more delay() calls
    correct: 0
    explanation: A charge-only cable can power a board without providing an upload connection.
