title: Contact | ESP32 Engine
meta_description: Contact ESP32 Engine for questions, feedback, or collaboration about our ESP32 tutorials.
body_html: |
  <section class="premium-page-hero">
    <div class="premium-page-copy">
      <h1>Contact</h1>
  <p>We welcome questions, feedback, tutorial corrections, and topic suggestions. For the fastest response, include the project page URL and a short description of your issue.</p>
    </div>
    <div class="premium-page-visual"><img src="/assets/images/heroes/contact-hero.webp" alt="ESP32 board connected beside test tools, OLED screen, and development laptop" width="1024" height="576" loading="eager" decoding="async" style="width:100%;height:100%;min-height:300px;object-fit:cover;display:block;"></div>
  </section>
  <h2>How to reach us</h2>
  <ul>
  <li><strong>Email:</strong> <a href="mailto:contact@esp32engine.com">contact@esp32engine.com</a> (general inquiries and AdSense or partnership questions)</li>
  <li><strong>GitHub Issues:</strong> <a href="https://github.com/abdulmubeen7876773-dotcom/esp32/issues" target="_blank" rel="noopener">Report bugs or suggest improvements</a></li>
  <li><strong>Repository:</strong> <a href="https://github.com/abdulmubeen7876773-dotcom/esp32" target="_blank" rel="noopener">View source on GitHub</a></li>
  </ul>
  <h2>Response time</h2>
  <p>We aim to respond within 2–5 business days. Tutorial corrections that affect wiring safety or code accuracy are prioritized.</p>
  <h2>What to include</h2>
  <ul>
  <li>Project name or URL</li>
  <li>ESP32 board model and sensor modules used</li>
  <li>Steps you already tried and any error messages</li>
  <li>Whether you are using USB power, an external supply, batteries, relays, motors, pumps, or LED strips</li>
  </ul>
  <h2>Corrections and safety issues</h2>
  <p>For wiring, safety, code, or factual corrections, include the exact URL and what you observed. Safety-related corrections are prioritized. Our review process is explained in the <a href="/editorial-policy.html">Editorial Policy</a>.</p>
  <h2>What we can and cannot help with</h2>
  <p>We can review tutorial clarity, broken links, suspected wiring mistakes, code-copying problems, and suggestions for future ESP32 learning topics. We cannot provide emergency support, medical advice, certification, custom product engineering, or approval for mains-voltage wiring. Projects involving relays, mains power, batteries, pumps, motors, or unattended hardware need a qualified local review before real-world use.</p>
  <p>If your question includes personal information, account details, or analytics/privacy concerns, read the <a href="/privacy.html">Privacy Policy</a> first and only include the minimum detail needed to investigate. Public GitHub issues are best for technical corrections that other learners can benefit from; email is better for privacy, partnership, or site policy questions.</p>
