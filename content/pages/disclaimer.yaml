title: Disclaimer | ESP32 Engine
meta_description: Disclaimer for ESP32 Engine tutorials — educational use, safety, and liability information.
body_html: |
  <h1>Disclaimer</h1>
  <p>All tutorials on ESP32 Engine are provided for educational and informational purposes only. They are intended to help learners understand ESP32 wiring, code structure, sensor readings, displays, and simple automation patterns.</p>
  <p>Electronics projects involve risk. Always verify wiring, use appropriate power supplies, unplug USB before moving jumper wires, and check the exact datasheet or module label for the board you are using. A diagram or wiring table on this site is a learning aid, not a certification that a build is safe for unattended or production use.</p>
  <h2>Low-voltage learning scope</h2>
  <p>Most ESP32 tutorials are designed around USB power or regulated low-voltage bench supplies. ESP32 GPIO pins are 3.3 V logic pins and are not 5 V tolerant. Use level shifting, drivers, fuses, enclosures, and separate power where the project requires motors, pumps, LED strips, servos, relays, or other higher-current loads.</p>
  <h2>Mains, relays, and high-current loads</h2>
  <p>ESP32 Engine does not provide instructions for unsafe mains wiring. Relay and AC projects are educational control examples only; mains wiring must be handled by qualified adults using correctly rated modules, isolation, strain relief, enclosures, fusing, and local electrical-code compliance. Do not connect exposed mains wiring on a breadboard.</p>
  <h2>Sensors, calibration, and readings</h2>
  <p>Sensor values are affected by module quality, placement, noise, supply voltage, calibration, and environment. Thresholds shown in tutorials are starting points for classroom or bench testing. Verify readings with known references before using any project for decisions about irrigation, alarms, safety, air quality, health, or power usage.</p>
  <h2>Healthcare and life-safety limits</h2>
  <p><strong>Healthcare projects:</strong> Tutorials in the Healthcare category are not medical advice and must not be used for diagnosis, treatment, patient monitoring, or emergency response. Fire, gas, leak, security, and alarm projects are not certified life-safety systems and should not replace commercial detectors or professional installations.</p>
  <h2>Code and adaptation responsibility</h2>
  <p>Code samples are starting points. You are responsible for testing and adapting firmware for your exact hardware and use case. See our <a href="/testing-methodology.html">Testing Methodology</a>, <a href="/editorial-policy.html">Editorial Policy</a>, and <a href="/contact.html">Contact</a> page for how tutorials are prepared and how to report a correction.</p>
