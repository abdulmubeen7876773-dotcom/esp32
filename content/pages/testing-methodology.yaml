meta_description: How ESP32 Engine distinguishes documentation review, automated content/browser checks, sketch
  compilation and physical hardware testing, with evidence limitations.
body_html: |
  <nav class="breadcrumb" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li aria-current="page">Review and Testing Methodology</li></ol></nav>
  <h1>Review and Testing Methodology</h1>
  <p>A tutorial can be reviewed without being compiled or run on hardware. These checks establish different things. Follow the specific board, core, library and module assumptions on each page.</p>
  <h2>What each check means</h2>
  <table><thead><tr><th>Check</th><th>Evidence and limits</th></tr></thead><tbody>
  <tr><td>Documentation review</td><td>Compare code, pin assignments and electrical assumptions with the cited platform or manufacturer references. This does not establish that a particular clone module matches those references.</td></tr>
  <tr><td>Automated content checks</td><td>Compare YAML with generated output; check local links, assets, metadata and preserved URLs. Passing checks does not establish compilation or circuit operation.</td></tr>
  <tr><td>Browser checks</td><td>Inspect representative viewport sizes and themes, keyboard controls, code copying and overflow. Desktop browser simulation is not physical-device testing or proof that an embedded video plays.</td></tr>
  <tr><td>Sketch compilation</td><td>A recorded compiler result should identify the sketch revision, board profile, core/library versions and result. Code inspection is not compilation, and compilation alone does not verify wiring.</td></tr>
  <tr><td>Physical hardware testing</td><td>A record should identify the actual board/module, power arrangement, procedure, observed results and limits. Expected readings and a reader checklist are not measured results.</td></tr>
  </tbody></table>
  <h2>What is currently recorded</h2>
  <p>Recent revision reports record documentation review, source/output and link checks, and focused Chromium layout checks. Their reports explicitly state when compilation, hardware and playback testing were not performed. Internal reports are retained with the editorial records rather than served as website downloads.</p>
  <p>There is no published per-example bench-test record covering the whole catalog. A successful site build is a website generation check. Do not infer that an older sketch was compiled or a circuit physically tested when its page supplies no such evidence. A review date or editorial attribution is not a test certificate.</p>
  <h2>Board, module and power assumptions</h2>
  <p>Many examples target a classic ESP32-WROOM DevKit and Arduino-ESP32 3.x, but camera boards and other ESP32 families have different pin restrictions. GPIO numbers are not physical header positions. Check the page's exact board profile, module pin labels, supply requirements and GPIO logic limits.</p>
  <p>Breakouts may differ in power regulation, pull-ups and signal voltage. Motors, servos, displays and relays may need separate supplies and suitable interfaces. Keep beginner load examples at low voltage; these tutorials do not establish mains safety, medical suitability, production reliability or unattended operation.</p>
  <h2>Expected results and reader checks</h2>
  <p>Expected-output sections explain what to look for; they do not document measurements unless explicitly identified as recorded observations. Thresholds and sensor readings depend on the module and environment. Before changing wiring, disconnect all power. If observations differ, use the tutorial's troubleshooting steps and report the exact board, versions and symptoms.</p>
  <h2>References and corrections</h2>
