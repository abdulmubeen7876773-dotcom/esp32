body_html: |
  <nav class="breadcrumb" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li aria-current="page">News</li></ol></nav>
  <h1>News & Updates</h1>
  <p class="section-sub">Site updates, project-library changes, and editorial notes from ESP32 Engine.</p>
  <p>ESP32 Engine does not publish filler news articles or pretend that every site edit is a breaking announcement. This page is reserved for meaningful updates that help readers understand what changed: new project batches, learning-path improvements, component reference work, policy updates, and major validation passes.</p>
  <p>For day-to-day learning, the best entry points are still the <a href="/learning.html">learning paths</a>, <a href="/guides.html">guides</a>, <a href="/components.html">components</a>, and <a href="/projects.html">project library</a>. News items are kept short so they do not duplicate tutorial content.</p>
  <div class="resource-grid">
    <article class="resource-card"><h3>Platform redesign launch</h3><p>The site structure was rebuilt around clearer learning paths, simpler discovery, and footer access to trust pages such as About, Contact, Privacy, Terms, Disclaimer, and Editorial Policy.</p><span class="meta">June 2026</span></article>
    <article class="resource-card"><h3>Component encyclopedia</h3><p>Component pages collect practical ESP32-safe wiring notes, interface type, common mistakes, and related project links for sensors, displays, camera boards, relays, and the ESP32 DevKit.</p><a class="btn btn-card" href="/components.html">Browse components →</a></article>
    <article class="resource-card"><h3>{{golden_projects}} public project tutorials</h3><p>The public project library focuses on reviewed ESP32 builds with difficulty labels, wiring guidance, Arduino code, troubleshooting notes, and related project paths.</p><a class="btn btn-card" href="/projects.html">Explore projects →</a></article>
  </div>
  <h2>How updates are handled</h2>
  <p>When a tutorial changes for safety, wiring clarity, component accuracy, or search-discovery quality, the source page is updated and regenerated through the site build. Pages that are staged or incomplete are kept out of the public project index until they are ready.</p>
  <p>For content standards, see the <a href="/editorial-policy.html">Editorial Policy</a> and <a href="/testing-methodology.html">Testing Methodology</a>. For a specific correction, use the <a href="/contact.html">Contact</a> page or open a GitHub issue with the affected URL.</p>
  <p class="meta">Looking for a specific update or tutorial? Use the <a href="/search.html">site search</a>.</p>
