  <section class="section-block" id="esp32-basics" aria-labelledby="esp32-basics-heading">
    <p class="section-eyebrow">Start here</p>
    <h2 id="esp32-basics-heading">ESP32 Basics</h2>
    <p class="section-sub">Follow this order when you are new to ESP32. Each step uses an existing beginner guide or component page, so students always know what to read next.</p>
    <div class="learning-path-grid" style="margin-top:1.5rem">
      <div class="path-card"><h3>1. Meet the ESP32</h3><p>Understand what the ESP32 is, what it can do, and where it fits before wiring anything.</p><a class="btn btn-primary" href="/guides/what-is-esp32.html">Read the intro</a></div>
      <div class="path-card"><h3>2. Know the DevKit</h3><p>Learn the board, USB power, GPIO labels, and the pins beginners should avoid.</p><a class="btn btn-primary" href="/components/esp32-devkit.html">Open the board guide</a></div>
      <div class="path-card"><h3>3. Blink an LED</h3><p>Wire a simple output and upload your first ESP32 sketch with a visible result.</p><a class="btn btn-primary" href="/guides/blink-led-esp32.html">Blink the LED</a></div>
      <div class="path-card"><h3>4. Read a button</h3><p>Add a digital input and use a button to control an LED with clear wiring.</p><a class="btn btn-primary" href="/guides/button-led-control.html">Read the button</a></div>
      <div class="path-card"><h3>5. Fix floating pins</h3><p>See why unconnected digital inputs behave unpredictably and how to spot the problem.</p><a class="btn btn-primary" href="/guides/digital-inputs-floating-pins.html">Fix input noise</a></div>
      <div class="path-card"><h3>6. Use pull resistors</h3><p>Choose pull-up or pull-down wiring so button readings stay stable.</p><a class="btn btn-primary" href="/guides/pull-up-vs-pull-down-resistors.html">Compare pull resistors</a></div>
      <div class="path-card"><h3>7. Debounce inputs</h3><p>Make button presses reliable in code before using them in projects.</p><a class="btn btn-primary" href="/guides/debouncing-buttons.html">Debounce the button</a></div>
      <div class="path-card"><h3>8. Control brightness</h3><p>Use PWM to dim LEDs and prepare for motors, buzzers, and analog-style outputs.</p><a class="btn btn-primary" href="/guides/pwm-fundamentals.html">Learn PWM</a></div>
      <div class="path-card"><h3>9. Read analog signals</h3><p>Move from simple on/off inputs to sensor values that change over time.</p><a class="btn btn-primary" href="/guides/analog-inputs.html">Read analog input</a></div>
    </div>
  </section>
  <section class="section-block" id="sensor-basics" aria-labelledby="sensor-basics-heading">
    <p class="section-eyebrow">Sensor path</p>
    <h2 id="sensor-basics-heading">ESP32 Sensors</h2>
    <p class="section-sub">Use this path when a student is ready to make the ESP32 measure the real world. It starts with sensor ideas, then moves through wiring, readings, displays, and small projects.</p>
    <div class="learning-path-grid" style="margin-top:1.5rem">
      <div class="path-card"><h3>1. Understand sensors</h3><p>Learn what environmental sensors measure and why readings need context before you automate anything.</p><a class="btn btn-primary" href="/guides/environmental-sensors.html">Start sensor basics</a></div>
      <div class="path-card"><h3>2. Connect a first sensor</h3><p>Wire a DHT22 and print temperature and humidity so the input loop feels concrete.</p><a class="btn btn-primary" href="/guides/read-temperature-dht22.html">Read DHT22 values</a></div>
      <div class="path-card"><h3>3. Compare sensor modules</h3><p>Review DHT22, BME280, PIR motion, and HC-SR04 distance pages before choosing parts.</p><a class="btn btn-primary" href="/components/dht22.html">Open sensor components</a></div>
      <div class="path-card"><h3>4. Read changing values</h3><p>Practice analog sensor readings and learn why raw numbers need calibration and thresholds.</p><a class="btn btn-primary" href="/guides/reading-analog-sensors.html">Read analog sensors</a></div>
      <div class="path-card"><h3>5. Show the result</h3><p>Combine readings into a small environmental monitor and make values visible.</p><a class="btn btn-primary" href="/guides/smart-environment-monitor-capstone.html">Build the capstone</a></div>
      <div class="path-card"><h3>6. Build a sensor project</h3><p>Apply the same pattern to weather, motion, distance, soil, or irrigation projects.</p><a class="btn btn-primary" href="/projects/esp32-iot-weather-station.html">Open a project</a></div>
    </div>
    <div class="learning-path-grid" style="margin-top:1rem">
      <div class="path-card"><h3>Component shortcuts</h3><p><a href="/components.html">All components</a> · <a href="/components/bme280.html">BME280</a> · <a href="/components/pir-sensor.html">PIR motion</a> · <a href="/components/hc-sr04.html">HC-SR04 distance</a></p></div>
      <div class="path-card"><h3>Project shortcuts</h3><p><a href="/projects/esp32-motion-security-alert.html">Motion alert</a> · <a href="/projects/esp32-distance-monitoring-system.html">Distance monitor</a> · <a href="/projects/esp32-soil-moisture-monitor.html">Soil monitor</a> · <a href="/projects/esp32-smart-irrigation-system.html">Smart irrigation</a></p></div>
    </div>
  </section>
  <section class="section-block" id="display-basics" aria-labelledby="display-basics-heading">
    <p class="section-eyebrow">Display path</p>
    <h2 id="display-basics-heading">ESP32 Displays</h2>
    <p class="section-sub">Use this path when a student is ready to make an ESP32 show information on a local screen. It keeps the order simple: display basics, I2C, address scanning, first OLED text, live values, and a real display project.</p>
    <div class="learning-path-grid" style="margin-top:1.5rem">
      <div class="path-card"><h3>1. Understand OLED displays</h3><p>Learn what an SSD1306 OLED is, how its tiny screen buffer works, and why it is useful for status and sensor readings.</p><a class="btn btn-primary" href="/components/ssd1306-oled.html">Open SSD1306 basics</a></div>
      <div class="path-card"><h3>2. Understand I2C</h3><p>See how SDA, SCL, addresses, and shared wiring let one ESP32 talk to a display and sensors on two signal wires.</p><a class="btn btn-primary" href="/guides/i2c-communication.html">Learn I2C</a></div>
      <div class="path-card"><h3>3. Find the address</h3><p>Use the I2C guide's scanner workflow to confirm whether the OLED appears at 0x3C or 0x3D before changing display code.</p><a class="btn btn-primary" href="/guides/i2c-communication.html">Run the scanner</a></div>
      <div class="path-card"><h3>4. Connect the OLED</h3><p>Wire VCC, GND, SDA, and SCL to the ESP32 and verify the display responds.</p><a class="btn btn-primary" href="/guides/connect-oled-esp32.html">Connect the OLED</a></div>
      <div class="path-card"><h3>5. Show text and data</h3><p>Draw simple text, update the screen, and understand why display.display() matters.</p><a class="btn btn-primary" href="/guides/oled-display-esp32.html">Write to the display</a></div>
      <div class="path-card"><h3>6. Display sensor values</h3><p>Combine sensor readings with a local screen so values are visible without Serial Monitor.</p><a class="btn btn-primary" href="/guides/smart-environment-monitor-capstone.html">Show sensor values</a></div>
      <div class="path-card"><h3>7. Build a display project</h3><p>Apply OLED wiring, I2C scanning, and live data updates in a finished weather clock.</p><a class="btn btn-primary" href="/projects/esp32-oled-weather-clock.html">Build the weather clock</a></div>
    </div>
    <div class="learning-path-grid" style="margin-top:1rem">
      <div class="path-card"><h3>Display shortcuts</h3><p><a href="/components/ssd1306-oled.html">SSD1306 OLED</a> · <a href="/guides/connect-oled-esp32.html">Connect OLED</a> · <a href="/guides/oled-display-esp32.html">OLED display guide</a></p></div>
      <div class="path-card"><h3>Project shortcuts</h3><p><a href="/projects/esp32-oled-weather-clock.html">OLED weather clock</a> · <a href="/projects/esp32-led-matrix-display.html">LED matrix display</a> · <a href="/projects/esp32-smart-thermostat.html">Thermostat display</a></p></div>
    </div>
  </section>
  <section class="section-block" id="iot-basics" aria-labelledby="iot-basics-heading">
    <p class="section-eyebrow">IoT path</p>
    <h2 id="iot-basics-heading">ESP32 IoT</h2>
    <p class="section-sub">Use this path when a student is ready to move from local circuits to connected projects. It starts with ESP32 Wi-Fi concepts, then moves through browser control, data publishing, remote readings, and smart-home builds.</p>
    <div class="learning-path-grid" style="margin-top:1.5rem">
      <div class="path-card"><h3>1. Understand ESP32 Wi-Fi</h3><p>Learn why ESP32 is useful for connected sensors, dashboards, and automation before adding network code.</p><a class="btn btn-primary" href="/guides/what-is-esp32.html">Review ESP32 Wi-Fi</a></div>
      <div class="path-card"><h3>2. Connect and control</h3><p>Use an ESP32-hosted browser page to send simple commands over Wi-Fi.</p><a class="btn btn-primary" href="/projects/esp32-wifi-robot-controller.html">Try browser control</a></div>
      <div class="path-card"><h3>3. Control an output safely</h3><p>Understand relay behavior before using network commands to switch real loads.</p><a class="btn btn-primary" href="/components/relay-module.html">Review relay control</a></div>
      <div class="path-card"><h3>4. Read a sensor remotely</h3><p>Start with weather readings, then think about what should stay local and what belongs on a dashboard.</p><a class="btn btn-primary" href="/projects/esp32-iot-weather-station.html">Open weather station</a></div>
      <div class="path-card"><h3>5. Publish data</h3><p>Send temperature and humidity to MQTT topics and view readings from a dashboard workflow.</p><a class="btn btn-primary" href="/projects/esp32-mqtt-sensor-dashboard.html">Build MQTT dashboard</a></div>
      <div class="path-card"><h3>6. Build smart-home control</h3><p>Turn local sensor readings into careful automation with thermostat and irrigation examples.</p><a class="btn btn-primary" href="/projects/esp32-smart-thermostat.html">Build smart control</a></div>
      <div class="path-card"><h3>7. Continue the path</h3><p>Explore connected home projects after local wiring, output safety, and dashboard behavior are stable.</p><a class="btn btn-primary" href="/projects/esp32-home-climate-automation.html">Continue smart home</a></div>
    </div>
    <div class="learning-path-grid" style="margin-top:1rem">
      <div class="path-card"><h3>IoT shortcuts</h3><p><a href="/projects/esp32-iot-weather-station.html">Weather station</a> · <a href="/projects/esp32-mqtt-sensor-dashboard.html">MQTT dashboard</a> · <a href="/projects/esp32-camera-capture-server.html">Camera server</a></p></div>
      <div class="path-card"><h3>Smart-home shortcuts</h3><p><a href="/projects/esp32-smart-irrigation-system.html">Smart irrigation</a> · <a href="/projects/esp32-motion-security-alert.html">Motion alert</a> · <a href="/projects/esp32-smart-power-strip.html">Smart power strip</a></p></div>
    </div>
  </section>
  <section class="section-block" id="robotics-basics" aria-labelledby="robotics-basics-heading">
    <p class="section-eyebrow">Robotics path</p>
    <h2 id="robotics-basics-heading">ESP32 Robotics</h2>
    <p class="section-sub">Use this path when a student is ready to make an ESP32 move something. It starts with safe outputs and PWM, then moves through distance sensing, motor-driver projects, browser control, and a servo arm.</p>
    <div class="learning-path-grid" style="margin-top:1.5rem">
      <div class="path-card"><h3>1. Understand robot outputs</h3><p>Start with PWM and output timing before motors or servos move real hardware.</p><a class="btn btn-primary" href="/guides/pwm-fundamentals.html">Review PWM</a></div>
      <div class="path-card"><h3>2. Learn motor-driver thinking</h3><p>Use the line follower to see why motor power, shared ground, and direction wiring matter.</p><a class="btn btn-primary" href="/projects/esp32-line-following-robot.html">Open line follower</a></div>
      <div class="path-card"><h3>3. Measure distance</h3><p>Use HC-SR04 distance readings to understand obstacles before adding autonomous behavior.</p><a class="btn btn-primary" href="/components/hc-sr04.html">Learn HC-SR04</a></div>
      <div class="path-card"><h3>4. Build a distance test</h3><p>Turn ultrasonic readings into a complete distance monitor before mounting sensors on a robot.</p><a class="btn btn-primary" href="/projects/esp32-distance-monitoring-system.html">Build distance monitor</a></div>
      <div class="path-card"><h3>5. Build a moving robot</h3><p>Use line sensors and a motor driver to make a robot steer from real readings.</p><a class="btn btn-primary" href="/projects/esp32-line-following-robot.html">Build line follower</a></div>
      <div class="path-card"><h3>6. Add remote control</h3><p>Compare autonomous line following with a browser-controlled Wi-Fi robot.</p><a class="btn btn-primary" href="/projects/esp32-wifi-robot-controller.html">Control robot over Wi-Fi</a></div>
      <div class="path-card"><h3>7. Control servos safely</h3><p>Move from drive motors to bounded servo motion with separate servo power and angle limits.</p><a class="btn btn-primary" href="/projects/esp32-robot-arm-controller.html">Build servo arm</a></div>
    </div>
    <div class="learning-path-grid" style="margin-top:1rem">
      <div class="path-card"><h3>Robotics shortcuts</h3><p><a href="/projects/esp32-line-following-robot.html">Line follower</a> · <a href="/projects/esp32-wifi-robot-controller.html">Wi-Fi robot</a> · <a href="/projects/esp32-robot-arm-controller.html">Servo arm</a></p></div>
      <div class="path-card"><h3>Sensing shortcuts</h3><p><a href="/components/hc-sr04.html">HC-SR04 component</a> · <a href="/projects/esp32-distance-monitoring-system.html">Distance monitor</a> · <a href="/projects/esp32-smart-parking-sensor.html">Parking sensor</a></p></div>
    </div>
  </section>
