meta_description: 'ESP32 learning resources: complete tutorial sketches, qualified pin references, wiring instructions
  and setup help.'
body_html: |
  <nav class="breadcrumb" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li aria-current="page">Learning Resources</li></ol></nav>
  <section class="premium-page-hero">
    <div class="premium-page-copy">
      <h1>Learning Resources</h1>
  <p class="section-sub">Free guides, references, tools, and source links to support your ESP32 learning journey.</p>
    </div>
    <div class="premium-page-visual"><img src="/assets/images/heroes/downloads-hero.webp" alt="ESP32 board on breadboard with wiring notes, laptop, and workshop tools" width="1024" height="576" loading="eager" decoding="async" style="width:100%;height:100%;min-height:300px;object-fit:cover;display:block;"></div>
  </section>
  <section class="section-block">
    <h2>What you can use here</h2>
    <p>Use the resources below for complete examples and connection instructions. Code is shown inside tutorials with copy controls; some pages also link manufacturer references. A wiring table or steps may be supplied without a separate diagram.</p>
  </section>
  <div class="resource-grid">
    <div class="resource-card"><h3>📌 ESP32 Pinout Reference</h3><p>Classic ESP32-WROOM DevKit GPIO choices, boot restrictions and power guidance; other ESP32 families differ.</p><a class="btn btn-card" href="/components/esp32-devkit.html">View Pinout →</a></div>
    <div class="resource-card"><h3>💾 Complete first sketch</h3><p>Arduino Blink example, external LED wiring and troubleshooting. Copy the sketch from the guide.</p><a class="btn btn-card" href="/guides/blink-led-esp32.html#code">Open Blink code →</a></div>
    <div class="resource-card"><h3>📐 Wiring reference</h3><p>MAX7219 matrix connections, power and logic-buffer assumptions, with a full-size diagram and Arduino example.</p><a class="btn btn-card" href="/components/max7219-led-matrix.html#wiring">Open matrix wiring →</a></div>
    <div class="resource-card"><h3>📖 Setup Guide</h3><p>Install Arduino IDE and the ESP32 board package — Windows, Mac, and Linux, step by step.</p><a class="btn btn-card" href="/guides/installing-arduino-ide-esp32.html">Read Guide →</a></div>
    <div class="resource-card"><h3>👨‍👩‍👧 Parent Guide</h3><p>Safety information, age recommendations, and how to support learning at home.</p><a class="btn btn-card" href="/parents.html">Open →</a></div>
    <div class="resource-card"><h3>🏫 Teacher Guide</h3><p>Curriculum links, lesson timing, and classroom-ready activity notes for STEM sessions.</p><a class="btn btn-card" href="/teachers.html">Open →</a></div>
  </div>
  <section class="section-block">
    <h2>Good starting paths</h2>
    <ul>
      <li><strong>First ESP32 setup:</strong> use the <a href="/guides/installing-arduino-ide-esp32.html">Arduino IDE setup guide</a>, then verify your board with <a href="/guides/blink-led-esp32.html">Mission 01 - Blink LED</a>.</li>
      <li><strong>Sensor projects:</strong> start with <a href="/guides/reading-analog-sensors.html">reading analog sensors</a>, then browse <a href="/category/sensor-projects.html">sensor projects</a>.</li>
      <li><strong>Display projects:</strong> learn <a href="/guides/i2c-communication.html">I2C basics</a>, connect an <a href="/guides/connect-oled-esp32.html">OLED display</a>, then try the <a href="/projects/esp32-oled-weather-clock.html">OLED weather clock</a>.</li>
      <li><strong>Classroom use:</strong> use <a href="/teachers.html">teacher notes</a>, <a href="/parents.html">parent guidance</a>, and the <a href="/learning.html">learning paths</a> to pick a safe sequence.</li>
    </ul>
  </section>
