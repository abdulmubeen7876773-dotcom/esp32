title: Privacy Policy | ESP32 Engine
meta_description: Privacy Policy for ESP32 Engine — cookies, analytics, advertising, and how we handle visitor data.
body_html: |-
  <h1>Privacy Policy</h1>
  <p>Last updated: October 2026</p>
  <p>ESP32 Engine (<a href="https://esp32engine.com/">https://esp32engine.com</a>) is an educational website operated by ESP32 Engine. We do not require account registration and we do not sell personal information.</p>
  <h2>Information we collect</h2>
  <ul>
  <li><strong>Hosting logs:</strong> Our hosting provider may record standard server logs such as browser type, pages viewed, referring URL, IP address, and approximate region for security and performance.</li>
  <li><strong>Analytics:</strong> After acceptance, Google Analytics 4 (measurement ID G-WLHZKSEFP3) collects usage data such as pages visited, session duration, device type, and general location to help us understand site usage and performance.</li>
  <li><strong>Advertising:</strong> If Google AdSense or similar ad services are enabled, they may use cookies or similar technologies to serve and measure ads. See <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">How Google uses data in advertising</a>.</li>
  <li><strong>Contact messages:</strong> If you contact us via GitHub Issues, GitHub processes that information under its own privacy policy.</li>
  </ul>
  <h2>Cookies and your choices</h2>
  <p>Google Analytics loads only after you accept optional analytics on production pages. Before an analytics choice or after analytics rejection, the GA4 script does not start. Analytics is off by default; open Analytics choices in the footer to opt in. The AdSense tag loads separately to deliver Google's published European regulations message and advertising service. Google manages advertising consent through that message; accepting analytics does not grant advertising consent. The Google message is configured for eligible regions and may not appear elsewhere. Tutorials, navigation, search and theme controls work without analytics. Theme and consent preferences use local storage; hosting and externally hosted fonts operate separately from analytics.</p>
  <p>Your accepted/rejected choice is stored under cookie-consent-v2. Earlier banner choices are not treated as consent under this implementation. Use Analytics choices in the footer to change your decision. Revoking acceptance saves rejection, removes accessible first-party Analytics cookies and reloads the page to stop the loaded tag. It cannot undo information already sent or erase third-party storage. If local storage is unavailable, the choice applies to this page and the next page asks again. Clearing site data resets the choice.</p>
  <h2>Advertising privacy choices</h2>
  <p>When Google's consent API is available, the footer shows Privacy and cookie settings (ads), which reopens Google's message so you can consent, manage options or decline. Google stores and applies those choices independently of our analytics preference. If the API is blocked or unavailable, the control stays hidden; allowing the Google consent service to load may be necessary to manage its choices. Google's regional consent and advertising rules apply; rejecting consent does not imply that no service requests or permitted limited ads can occur.</p>
  <h2>Embedded YouTube tutorials</h2>
  <p>Some guides embed YouTube videos using the privacy-enhanced youtube-nocookie.com player. The iframe has native browser lazy loading and does not autoplay. Lazy loading is not a click-to-load or consent barrier: the browser may fetch the player when it is near the viewport, before you press Play. Loading the player sends network information such as your IP address, browser information, and site origin to YouTube/Google; playback and interaction may involve cookies or other browser storage. Privacy-enhanced mode limits personalization but does not make the service entirely cookie-free or prevent data processing.</p>
  <p>The analytics choice does not block YouTube iframes. The Open on YouTube fallback opens YouTube, where its own policies and controls apply. Browser settings or content blockers may limit third-party requests; guide text and code remain available.</p>
  <h2>Third-party services</h2>
  <ul>
  <li>Google Analytics — <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google Privacy Policy</a></li>
  <li>Google AdSense (if enabled) — <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener">Google Ads technologies</a></li>
  <li>YouTube/Google — <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google Privacy Policy</a>; <a href="https://support.google.com/youtube/answer/171780" target="_blank" rel="noopener">YouTube embedding and privacy-enhanced mode</a></li>
  <li>GitHub — <a href="https://docs.github.com/en/site-policy/privacy-policies/github-privacy-statement" target="_blank" rel="noopener">GitHub Privacy Statement</a></li>
  </ul>
  <h2>Your choices</h2>
  <ul>
  <li>Opt out of Google personalized ads: <a href="https://adssettings.google.com/" target="_blank" rel="noopener">Google Ads Settings</a></li>
  <li>Industry opt-out (US): <a href="https://optout.networkadvertising.org/" target="_blank" rel="noopener">NAI Opt-Out</a></li>
  <li>Clear site data: remove cookies for esp32engine.com in your browser</li>
  </ul>
  <h2>Data retention</h2>
  <p>Server logs are retained by our hosting provider for a limited period. Analytics data is retained according to Google Analytics settings. We do not maintain user accounts on this site.</p>
  <h2>Children's privacy</h2>
  <p>This site is intended for general audiences interested in electronics education. We do not knowingly collect personal information from children under 13.</p>
  <h2>International visitors</h2>
  <p>Visitors from the EU, UK, and other regions may have rights to access, correct, or delete personal data processed by third-party services we use. Contact us to exercise applicable rights where we can assist.</p>
  <h2>Changes</h2>
  <p>We may update this policy when we add analytics, advertising, or new features. The "Last updated" date will change accordingly.</p>
  <p>Questions? Visit our <a href="/contact.html">Contact</a> page. Editorial and testing standards are described in our <a href="/editorial-policy.html">Editorial Policy</a> and <a href="/testing-methodology.html">Testing Methodology</a>.</p>
