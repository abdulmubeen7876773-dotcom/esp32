eli12: 'Male ends enter sockets; female ends fit pins. Choose male–male, male–female or female–female for the actual
  headers. Common prototyping headers use 2.54 mm spacing, but a connector shape does not prove pitch or contact
  quality.


  Color is a useful convention, not electrical evidence. Keep a written pin map, use short leads for buses and pull
  on housings rather than wires. Check continuity with every supply removed; intermittent crimps can mimic software
  faults.'
electrical:
  supply: Passive conductor; no generated voltage or regulation.
  signal: A jumper passes the connected signal voltage unchanged. Connecting 5 V through it still endangers ESP32
    GPIO.
  protection: No universal current rating for this assortment. Keep motor/heater/high-current supply paths on rated
    wiring and connectors.
specs:
- name: Ends
  value: Match actual pin/socket
  why: Male/female describes contacts, not voltage.
- name: Pitch
  value: Often 2.54 mm
  why: Verify actual mating header.
- name: Current rating
  value: Unspecified for artwork
  why: Do not apply a universal motor-power rating.
output: An isolated wire should give low end-to-end resistance within meter/lead limits. Flexing gently should not
  interrupt it. This does not certify current capacity or high-speed bus performance.
how_it_works: A wire joins two electrical nodes. Resistance, loose contacts and wire length affect real circuits.
  A ground wire provides a common reference but is not a substitute for properly routed high-current returns.
applications:
- Low-current breadboard connections
- Short SPI/I2C prototyping links with suitable pull-ups
troubleshooting:
- problem: Intermittent readings
  cause: Loose crimp or poor header fit.
  fix: Test unpowered while gently moving the wire; replace damaged leads.
- problem: Wrong pin despite correct color
  cause: Color used instead of labels.
  fix: Trace actual GPIO and module terminal labels end-to-end.
- problem: Warm connector
  cause: Excess current or poor contact.
  fix: Disconnect; use documented power wiring rather than more unknown jumpers.
faqs:
- question: Does a red wire have to carry 5 V?
  answer: No. Label and verify the actual circuit.
- question: Can a jumper level-shift?
  answer: No. It simply connects voltage from one node to another.
