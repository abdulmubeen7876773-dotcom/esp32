slug: dupont-jumper-wires
name: 'Dupont Jumper Wires: Check Connections Before Power'
category: Miscellaneous
difficulty: Beginner
summary: Choose the right ends and check continuity. Jumper wires connect nodes; they do not regulate voltage or
  guarantee a current rating.
