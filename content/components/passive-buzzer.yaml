eli12: |-
  A passive sounder needs an alternating drive waveform. An active buzzer contains an oscillator and can sound from DC. Neither its round case nor a plus mark identifies its internal construction.

  The example deliberately supports only an external-drive piezo qualified for this circuit. Do not connect an unknown magnetic coil, speaker or active module directly to the GPIO. The approved illustration is a category image, not a verified electrical model.
electrical:
  supply: Piezo receives only the GPIO25 waveform through 1 kiloohm; no external power rail in this example.
  signal: LEDC produces a 0–3.3 V, 50% duty waveform. GPIO is LOW during silence.
  protection: The 1 kiloohm series resistor limits edge/short-circuit current to about 3.3 mA at 3.3 V. It does
    not make an unknown magnetic load suitable or replace a manufacturer drive circuit.
  basis: Murata external-drive sounder guidance and Espressif LEDC API; actual piezo suitability must be checked.
