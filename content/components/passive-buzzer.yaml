code:
  title: Short tone with pin-based LEDC
  filename: passive_buzzer_esp32.ino
  wiring: Qualified piezo drive terminal → 1 kiloohm → GPIO25; return → GND. No magnetic or active sounder substitution.
  content: |
    #include <Arduino.h>
    constexpr uint8_t BUZZER_PIN = 25;
    bool ready = false;
    void setup() {
      Serial.begin(115200);
      pinMode(BUZZER_PIN, OUTPUT);
      digitalWrite(BUZZER_PIN, LOW);
      ready = ledcAttach(BUZZER_PIN, 2000, 8);
      if (!ready) Serial.println("LEDC attach failed; check board and resources.");
    }
    void loop() {
      if (!ready) { delay(1000); return; }
      if (ledcWriteTone(BUZZER_PIN, 2000) == 0) {
        ledcWriteTone(BUZZER_PIN, 0);
        Serial.println("Tone setup failed.");
        delay(1000);
        return;
      }
      Serial.println("TONE");
      delay(250);
      ledcWriteTone(BUZZER_PIN, 0);
      Serial.println("SILENT");
      delay(1000);
    }
  notes: Arduino-ESP32 3.x APIs take the pin, not an old channel number. No tone library required. Zero frequency
    sets duty to zero; sounder ratings must be checked separately.
library: Arduino-ESP32 3.x; no additional library
output: A 2 kHz tone lasts 250 ms, followed by silence for one second. Serial prints TONE and SILENT. Volume depends
  on the sounder and the series resistor.
how_it_works: The LEDC peripheral toggles the output at the selected frequency; tone generation continues during
  delay. Setting frequency to zero stops the drive. Resonance affects acoustic output, so a working Serial message
  is not proof that the sounder is suitable or audible. A series resistor trades volume for lower GPIO charging
  current.
applications:
- Short status tone
- Digital piano preparation
- Low-volume user feedback
troubleshooting:
- problem: Serial works but no sound
  cause: Wrong sounder type, unsuitable frequency or wiring.
  fix: Confirm an external-drive piezo and its data. Check GPIO25 and ground; do not bypass protection on an unknown
    load.
- problem: Sound pitch does not change
  cause: An active buzzer may have its own oscillator.
  fix: Identify the actual part; active-buzzer control is a different example.
- problem: LEDC attach fails
  cause: Wrong core/board or peripheral resources occupied.
  fix: Use Arduino-ESP32 3.x, a valid unused output pin and the standalone sketch.
faqs:
- question: Can a passive magnetic buzzer use this wiring?
  answer: No. Its coil current and inductive switching require a selected transistor/driver and appropriate protection.
    This illustration does not establish that interface.
- question: Why not supply constant HIGH?
  answer: An external-drive piezo needs a changing waveform for a sustained tone. DC is not the provided operating
    mode.
