eli12: |
  The BME280 is a small I2C environmental sensor. With ESP32 it measures temperature, humidity, and local air pressure over four wires: 3.3 V, GND, SDA, and SCL.

  Most ESP32 Arduino examples use GPIO21 for SDA and GPIO22 for SCL, and most BME280 modules answer at I2C address 0x76 or 0x77. Temperature tells you how warm the air is. Humidity tells you how much water vapor is in the air. Pressure tells you how hard the air is pushing on everything around it.

  BME280 is different from BMP280, even though breakout boards can look very similar. BMP280 measures temperature and pressure only; BME280 also measures humidity. Use the BME280 for weather stations, room monitors, pressure trend logs, approximate altitude experiments, and OLED dashboards, but do not treat it as a lab-grade weather instrument.
quick_facts:
  - label: Measures
    value: Temperature, humidity, and barometric pressure
    why: One small module gives the main values used in beginner weather and climate projects.
  - label: Interface
    value: I2C on SDA and SCL
    why: I2C lets the ESP32 share two wires with other devices such as OLED displays.
  - label: Common address
    value: 0x76 or 0x77
    why: Wrong address is the most common reason a working module appears missing.
  - label: ESP32 pins
    value: GPIO21 SDA, GPIO22 SCL defaults
    why: These are common Arduino-ESP32 defaults, but Wire.begin() can choose other GPIOs.
  - label: BME280 vs BMP280
    value: BME280 adds humidity
    why: BMP280 boards look similar but measure temperature and pressure only.
  - label: Library
    value: Adafruit BME280 plus Unified Sensor
    why: The library handles calibration math stored inside the sensor.
how_it_works: |
  The BME280 contains three sensing systems inside one chip. Its temperature sensor measures the chip temperature, its humidity sensor responds to water vapor in the air, and its pressure sensor measures tiny deflections caused by atmospheric pressure.

  The pressure part is the most interesting engineering idea. Air pressure pushes on a microscopic structure inside the chip. That structure changes electrically when it bends. The BME280 converts that tiny change into a local station-pressure reading measured in pascals or hectopascals. Weather apps often show sea-level adjusted pressure instead, so their numbers may differ from your raw sensor reading.

  The raw measurements are not directly useful on their own. Bosch stores calibration constants inside each sensor during manufacturing. The Arduino library reads those constants and uses compensation formulas to turn raw ADC values into temperature, humidity, and pressure.

  The ESP32 talks to the BME280 over I2C. SDA carries data and SCL carries the clock. GPIO21 and GPIO22 are common Arduino-ESP32 defaults on classic ESP32 boards, not fixed electrical pins. If your board uses different pins, Wire.begin(SDA, SCL) must match the GPIO numbers you actually wired.

  Every I2C device has an address, so the ESP32 can ask the BME280 for data while other devices, such as an SSD1306 OLED display, share the same two wires. BME280 modules commonly use 0x76 or 0x77. SSD1306 OLED modules commonly use 0x3C and sometimes 0x3D, so an I2C scanner is the fastest way to confirm the real bus.

  Pressure can also estimate altitude, but altitude is only approximate unless you know the current sea-level pressure for your location. The common 1013.25 hPa value is a standard reference, not a promise about your current weather. For weather projects, pressure trends over time are usually more useful than a single pressure number.
specs:
  - name: Supply voltage
    value: Low-voltage chip; use 3.3 V breakout power with ESP32 unless the exact module documentation says otherwise
    why: Some breakouts add regulators or level shifting and some do not, so 3.3 V is the safest beginner choice.
  - name: Temperature range
    value: -40 C to 85 C
    why: Covers indoor rooms, outdoor shaded enclosures, greenhouses, and many classroom experiments.
  - name: Temperature accuracy
    value: Typically about +/-1 C
    why: Good for trend monitoring; avoid treating the module as a calibrated thermometer.
  - name: Humidity range
    value: 0 to 100 percent RH, non-condensing
    why: Lets the same board detect dry rooms, comfortable air, and humid greenhouse conditions without exposing the sensing element to liquid water.
  - name: Humidity accuracy
    value: Typically about +/-3 percent RH
    why: Useful for comfort and trends, but not a laboratory humidity reference.
  - name: Pressure range
    value: 300 to 1100 hPa
    why: Covers normal weather pressure and altitude changes from below sea level to mountain elevations.
  - name: Pressure accuracy
    value: About +/-1 hPa absolute, better relative resolution
    why: Relative pressure changes are excellent for weather trend and altitude experiments.
  - name: Interface
    value: I2C by default; SPI on some breakout boards
    why: This ESP32 guide uses I2C because it needs only two shared signal wires.
  - name: I2C address
    value: 0x76 or 0x77
    why: The SDO/address pin decides the address; code must match the actual module.
  - name: Default ESP32 I2C pins
    value: SDA GPIO21, SCL GPIO22
    why: These are common Arduino core defaults and match most ESP32 tutorials, but they can be changed in Wire.begin(SDA, SCL).
  - name: Pull-up resistors
    value: Usually included on breakout boards
    why: I2C lines need pull-ups; bare sensors need an external circuit, and multiple modules can place pull-ups in parallel.
  - name: Current consumption
    value: Very low; depends on sampling mode and oversampling
    why: Good for battery projects when paired with ESP32 deep sleep and low sample rates.
  - name: Response behavior
    value: Temperature and humidity change gradually; pressure changes slowly indoors
    why: Environmental sensors should be read as trends, not instant switches.
pinout:
  - pin: VIN / VCC
    role: Power input
    connects: ESP32 3.3 V
    note: Use 3.3 V unless the exact breakout documentation confirms other input support. Do not assume VIN is 5 V tolerant.
  - pin: GND
    role: Ground reference
    connects: ESP32 GND
    note: Ground must be shared with the ESP32 and every other I2C device.
  - pin: SDA / SDI
    role: I2C data
    connects: ESP32 GPIO21
    note: Bidirectional data line. GPIO21 is the common Arduino-ESP32 default; follow GPIO numbers, not another board's physical layout.
  - pin: SCL / SCK
    role: I2C clock
    connects: ESP32 GPIO22
    note: Clock line generated by the ESP32 master. GPIO22 is common by default, but Wire.begin() can choose other pins.
  - pin: SDO
    role: Address select or SPI data output
    connects: Usually left as breakout default
    note: On many boards, SDO selects I2C address 0x76 or 0x77. Check your module if scanning fails.
  - pin: CS / CSB
    role: SPI chip select or I2C mode select
    connects: Usually tied HIGH on I2C breakouts
    note: If exposed, keep CS high for I2C mode. Pulling it low selects SPI mode on the chip.
