setup:
  items:
  - label: Board and pins
    value: 'Classic ESP32-WROOM-32 DevKit, Arduino board: ESP32 Dev Module. This example explicitly uses GPIO21
      for SDA and GPIO22 for SCL; these are GPIO numbers, not header positions. Other ESP32 boards need a suitable
      pin map.'
  - label: Module assumption
    value: An I2C BME280 breakout whose manufacturer permits 3.3 V at the chosen supply input, with SDA/SCL pulled
      up to 3.3 V and CS/SDO configured for I2C. Vendor and exact board variant are unspecified; verify its schematic
      before wiring. This is not a bare-chip build.
  - label: Software and libraries
    value: 'Arduino IDE 2.x; esp32 by Espressif Systems 3.x (API review baseline 3.3.2). Install Adafruit BME280
      Library 2.3.0 in Library Manager and accept Adafruit Unified Sensor and Adafruit BusIO dependencies. Wire
      is included with the core. Serial Monitor: 115200 baud.'
  - label: Prerequisites and parts
    value: Be able to upload a sketch and open Serial Monitor. Use an ESP32 DevKit, verified 3.3 V BME280 breakout,
      USB data cable and four short jumper wires; use a breadboard if needed. Begin with only this sensor on the
      bus.
  - label: Expected result
    value: The sketch reports a responding address and chip ID, confirms BME280 initialization, then prints °C,
      relative humidity (%) and pressure (hPa) about once a second. Numeric examples below are illustrative, not
      hardware measurements.
  - label: Verification status
    value: Reviewed against Espressif, Bosch and Adafruit documentation. Not compiled for an ESP32 or tested on
      hardware in this update.
