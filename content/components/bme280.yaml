date_modified: '2026-10-08'
experience_required: Basic Arduino upload, breadboard wiring, Serial Monitor, and beginner I2C wiring
applications:
- ESP32 weather station
- Indoor climate monitor
- Greenhouse environment logger
- Barometric pressure trend tracker
- Approximate altitude monitor
- OLED weather dashboard
- Classroom atmosphere experiment
- Home automation sensor node
eli12: |-
  BME280 measures temperature, relative humidity and air pressure. BMP280 measures temperature and pressure only: it cannot supply humidity. Similar-looking boards and a 0x76/0x77 response do not establish which chip you have.

  Bosch specifies chip ID 0x60 at register 0xD0 for BME280, and 0x58 for BMP280. The example checks that register before initializing the BME280 library. A different or unreadable ID calls for a wiring and module-identity check; do not diagnose the sensor from missing humidity alone.
quick_facts:
- label: Measures
  value: Temperature, humidity, and barometric pressure
  why: One small module gives the main values used in beginner weather and climate projects.
- label: Interface
  value: I2C on SDA and SCL
  why: I2C lets the ESP32 share two wires with other devices such as OLED displays.
- label: Common address
  value: 0x76 or 0x77
  why: Wrong address is the most common reason a working module appears missing.
- label: ESP32 pins
  value: GPIO21 SDA, GPIO22 SCL defaults
  why: These are common Arduino-ESP32 defaults, but Wire.begin() can choose other GPIOs.
- label: BME280 vs BMP280
  value: BME280 adds humidity
  why: BMP280 boards look similar but measure temperature and pressure only.
- label: Library
  value: Adafruit BME280 plus Unified Sensor
  why: The library handles calibration math stored inside the sensor.
how_it_works: |-
  Adafruit readTemperature() returns degrees Celsius; readHumidity() returns relative humidity percent. readPressure() returns pascals (Pa). Divide by 100 for hectopascals (hPa): 100 Pa = 1 hPa = 1 mbar. This is local station pressure, not automatically adjusted to sea level.

  A weather service may report sea-level pressure, so comparing that number directly with local pressure is misleading. Compare the same type of pressure or apply an appropriate altitude correction. Watch trends over time rather than treating one number as a rain forecast.

  For an optional altitude estimate, bme.readAltitude(1013.25F) returns metres using standard sea-level pressure in hPa. Replace 1013.25 with a current local sea-level reference for a more useful estimate. Weather changes and the assumed atmospheric model introduce error: it is not GPS height or a survey measurement, and a fixed reference can make a stationary sensor appear to move.

  The library uses factory calibration coefficients for compensation. Temperature reflects the chip’s temperature and can estimate ambient air temperature when placement is suitable. Keep it away from ESP32/regulator heat, direct sunlight, fingers and condensation; allow airflow and settling time.
specs:
- name: Bare-chip supply limits
  value: VDD 1.71–3.6 V; VDDIO 1.2–3.6 V
  why: These Bosch limits are not a rating for a breakout VIN pin. A regulator may change supply requirements but
    does not alone level-shift SDA/SCL.
- name: Module supply in this example
  value: 3.3 V at a manufacturer-approved input
  why: VIN, VCC and 3V3 labels are not interchangeable guarantees. Check the exact module’s allowed input and regulator
    requirements.
- name: ESP32 signal voltage
  value: SDA and SCL pull-ups to 3.3 V
  why: ESP32 GPIO is not 5 V tolerant. Do not use direct 5 V I2C pull-ups; use an appropriate level-shifting interface
    if required.
- name: Interface
  value: I2C here; the chip also supports SPI
  why: The example uses one shared Wire bus at 100 kHz. SDA carries data; SCL carries the clock.
- name: Chip operating ranges
  value: −40 to +85 °C; 0–100% RH; 300–1100 hPa
  why: Ranges do not imply uniform accuracy across all conditions. See Bosch’s specified accuracy conditions; keep
    the sensor dry.
- name: Manufacturer accuracy conditions
  value: Humidity ±3% RH at 20–80% RH and 25 °C; pressure ±1 hPa at 300–1100 hPa and 0–65 °C
  why: Bosch specifications apply under stated conditions, not a guarantee of your assembled board’s readings.
- name: Chip temperature accuracy
  value: ±0.5 °C at 0–65 °C in the current Bosch datasheet
  why: This is chip temperature. PCB heat and placement can bias ambient estimates; resolution and accuracy are
    different.
pinout:
- pin: VIN / VCC
  role: Power input
  connects: ESP32 3.3 V
  note: Use only the supply input documented for your exact board. A VIN label or regulator does not prove 5 V-safe
    GPIO signals.
- pin: GND
  role: Ground reference
  connects: ESP32 GND
  note: Ground must be shared with the ESP32 and every other I2C device.
- pin: SDA / SDI
  role: I2C data
  connects: ESP32 GPIO21
  note: 'SDA may be labeled SDI on a dual-interface board. Confirm the schematic: SDI is I2C data in I2C mode, whereas
    SDO is not the SDA connection.'
- pin: SCL / SCK
  role: I2C clock
  connects: ESP32 GPIO22
  note: SCL may be labeled SCK on a dual-interface board. Use GPIO22 here; the Wire.begin() pin arguments must match
    your wiring.
- pin: SDO
  role: Address select or SPI data output
  connects: GND for 0x76 or VDDIO for 0x77 (chip)
  note: The chip’s SDO must not float in I2C mode. A breakout may set it with a resistor or address jumper. Verify
    that configuration; do not add a conflicting connection.
- pin: CS / CSB
  role: SPI chip select or I2C mode select
  connects: HIGH at VDDIO for I2C (chip)
  note: The breakout may tie CS/CSB HIGH already. Confirm its schematic; a LOW CS selects SPI, and a floating CS
    is not a defined I2C configuration.
pinout_image: /assets/visuals/components/illustrations/bme280-pinout.svg
pinout_illustration_alt: BME280 breakout module pinout showing VIN, GND, SDA, SCL, SDO, and CS with the I2C beginner
  pins emphasized
wiring:
  image: /assets/visuals/components/wiring/bme280-wiring.svg
  illustration_alt: ESP32 DevKit wired to a BME280 sensor over I2C using 3.3 V, GND, GPIO21 SDA, and GPIO22 SCL
  summary: |-
    SDA goes to GPIO21 and SCL to GPIO22 in this sketch. The same chip signals may be labeled SDI and SCK on a board that exposes SPI pins. Follow the module schematic, not its physical pin order or a photograph of another variant.

    I2C needs pull-ups on both lines. Many breakouts include them, but this module is unspecified: confirm they connect to 3.3 V. If the module lacks them, add pull-ups sized for the bus’s capacitance, speed and device sink limits. A supply regulator alone does not make 5 V pull-ups safe.

    At chip level, CSB must be HIGH for I2C. SDO LOW selects 0x76 and SDO HIGH selects 0x77; SDO must not float. Leave breakout defaults only after checking they establish these levels. Change address jumpers with power disconnected.
  table_columns:
  - BME280 Pin
  - ESP32 Pin
  - Purpose / Notes
  table_rows:
  - component_pin: VIN / VCC
    esp32_pin: 3.3 V
    notes: Use a documented 3.3 V-compatible supply input; do not infer a 5 V rating from VIN.
  - component_pin: GND
    esp32_pin: GND
    notes: Shared ground is required for reliable I2C communication.
  - component_pin: SDA / SDI
    esp32_pin: GPIO21
    notes: SDA may be SDI in I2C mode. Use short wires and verify pull-ups to 3.3 V.
  - component_pin: SCL / SCK
    esp32_pin: GPIO22
    notes: SCL may be SCK in I2C mode. Must match Wire.begin(21, 22, 100000).
  - component_pin: SDO
    esp32_pin: Verified module address setting
    notes: 'At chip level: LOW → 0x76, HIGH at VDDIO → 0x77. Never leave SDO floating.'
  - component_pin: CS / CSB
    esp32_pin: Verified module I2C setting
    notes: CSB must be HIGH at VDDIO. Check whether the board already establishes that level.
  steps:
  - Disconnect USB before wiring. Verify your exact module accepts 3.3 V on the chosen supply pin.
  - Connect that input to ESP32 3.3 V, and GND to ESP32 GND.
  - Connect SDA/SDI to GPIO21 and SCL/SCK to GPIO22. Confirm these labels from the module schematic.
  - Verify CSB is HIGH and SDO has a defined address-select level, through the board’s documented defaults or jumpers.
    Confirm SDA/SCL pull-ups are to 3.3 V.
  - Install the libraries, select ESP32 Dev Module and the correct port, then upload the example.
  - Open Serial Monitor at 115200 baud. It probes 0x76 and 0x77, reads chip ID and initializes a responding BME280.
    If neither responds, use the I2C scanner linked in Continue learning and the checks below.
library: 'Adafruit BME280 Library 2.3.0; dependencies: Adafruit Unified Sensor and Adafruit BusIO'
code:
  title: Minimal BME280 readout with address and identity checks
  filename: bme280_esp32_environment_test.ino
  wiring: Use the four-wire I2C circuit above, with GPIO21 SDA, GPIO22 SCL and verified 3.3 V supply/pull-ups. Upload
    this complete Arduino sketch.
  notes: The two-address probe reports an I2C response separately from BME280 initialization. A response alone does
    not identify the chip. The register read checks for short/failed transfers; a valid 0x60 is required before
    bme.begin(). The delay only sets the print interval for this simple local demonstration. If initialization fails,
    correct the circuit or module identity and reset the ESP32.
  content: |
    #include <Wire.h>
    #include <Adafruit_Sensor.h>
    #include <Adafruit_BME280.h>

    Adafruit_BME280 bme;
    bool sensorReady = false;

    int readChipId(uint8_t address) {
      Wire.beginTransmission(address);
      Wire.write(0xD0);  // Bosch chip-ID register
      if (Wire.endTransmission(false) != 0) return -1;
      if (Wire.requestFrom(address, uint8_t(1)) != 1) return -1;
      return Wire.read();
    }

    void setup() {
      Serial.begin(115200);
      delay(1000);
      if (!Wire.begin(21, 22, 100000)) {
        Serial.println("I2C bus setup failed.");
        return;
      }

      for (uint8_t address = 0x76; address <= 0x77; ++address) {
        Wire.beginTransmission(address);
        if (Wire.endTransmission() != 0) continue;
        Serial.print("I2C response at 0x");
        Serial.println(address, HEX);
        int id = readChipId(address);
        if (id < 0) {
          Serial.println("Chip-ID read failed; check the I2C bus.");
          continue;
        }
        Serial.print("Chip ID: 0x");
        Serial.println(id, HEX);
        if (id != 0x60) {
          Serial.println("Not a BME280 ID (BMP280 is 0x58).");
          continue;
        }
        if (bme.begin(address, &Wire)) {
          sensorReady = true;
          Serial.println("BME280 initialized.");
          break;
        }
        Serial.println("BME280 initialization failed.");
      }
      if (!sensorReady) {
        Serial.println("No initialized BME280. Check wiring, mode and identity.");
      }
    }

    void loop() {
      if (sensorReady) {
        float temperatureC = bme.readTemperature();
        float humidity = bme.readHumidity();
        float pressureHpa = bme.readPressure() / 100.0F;
        if (isnan(temperatureC) || isnan(humidity) || isnan(pressureHpa)) {
          Serial.println("Invalid reading; check the sensor and bus.");
        } else {
          Serial.print("Temperature: "); Serial.print(temperatureC, 1);
          Serial.print(" C | Humidity: "); Serial.print(humidity, 1);
          Serial.print(" % | Pressure: "); Serial.print(pressureHpa, 1);
          Serial.println(" hPa");
        }
      }
      delay(1000);
    }
output: |-
  Set Serial Monitor to 115200 baud. For an initialized BME280, expect I2C response at 0x76 (or 0x77), Chip ID: 0x60 and BME280 initialized.

  An illustrative reading is: Temperature: 24.1 C | Humidity: 48.7 % | Pressure: 1012.6 hPa. Your numbers depend on the surroundings; they are not pass/fail target values. Readings print about once a second after initialization.

  If you see an address response but no initialization, use the chip-ID message and troubleshooting table. No response at either address suggests a bus, supply, mode or connection problem. A full I2C scan finds other responding addresses but still does not identify a sensor.
common_mistakes:
- text: Swapping SDA and SCL.
- text: Using 0x76 in code when the module is actually 0x77.
- text: Assuming VIN means every breakout is 5 V tolerant.
- text: Forgetting that I2C requires common ground.
- text: Treating GPIO21 and GPIO22 as fixed pins instead of common Arduino defaults.
- text: Comparing raw local pressure directly with sea-level adjusted weather app pressure.
- text: Treating calculated altitude as GPS-level accuracy.
- text: Assuming invalid humidity always proves the board is a BMP280.
- text: Connecting an OLED and BME280 without checking both I2C addresses.
- text: Placing the sensor next to a warm voltage regulator, USB chip, OLED display, direct sun, or enclosed warm
    board.
- text: Using long jumper wires without understanding I2C pull-ups.
troubleshooting:
- problem: No response at 0x76 or 0x77
  cause: Supply or ground missing, wrong SDA/SCL, SPI mode, floating address select, missing pull-ups or damaged
    module.
  fix: Disconnect power and verify the module schematic, 3.3 V-compatible supply input, shared GND, GPIO21/22, CSB
    HIGH, defined SDO and 3.3 V pull-ups. Retry with short wires and only this device; run a full I2C scanner.
- problem: Address responds but Chip ID is 0x58
  cause: The responding chip identifies as BMP280, which lacks humidity.
  fix: Use the BMP280 library for that sensor or obtain a verified BME280. Changing 0x76 to 0x77 cannot add humidity.
- problem: Chip-ID read failed or a different ID appears
  cause: A transaction failed, another device occupies the address, or this is a different sensor.
  fix: Check the short-wire bus and pull-ups, isolate this module, verify its identity and compare its manufacturer
    documentation. An address ACK alone is not proof of BME280.
- problem: ID is 0x60 but initialization fails
  cause: Intermittent I2C, unstable supply or calibration/register communication trouble.
  fix: Verify the same Wire bus and pins, power-cycle after correcting connections, then retry with the specified
    Adafruit library. If failure persists, check the module with its vendor before assuming a software fault.
- problem: Missing header or compilation error
  cause: A required library or the ESP32 board package is missing or the wrong board is selected.
  fix: Select ESP32 Dev Module with esp32 by Espressif Systems 3.x. Install Adafruit BME280 Library 2.3.0 and its
    Unified Sensor and BusIO dependencies.
- problem: Temperature or humidity is unrealistic
  cause: Board heat, restricted airflow, condensation, contamination or a bus fault.
  fix: Move the sensor away from heat, keep it dry and allow airflow. Check successful initialization and wiring;
    missing humidity by itself does not prove BMP280.
- problem: Pressure or optional altitude differs from a weather app
  cause: Local pressure is compared with sea-level pressure, or the altitude reference is outdated.
  fix: Compare like pressure units/types. Use current sea-level pressure for readAltitude(); do not treat the result
    as precise elevation.
- problem: Works alone but fails beside an OLED
  cause: Address collision, wiring problem or combined pull-ups/load affect the bus.
  fix: Scan with each device alone and then together. Ensure distinct addresses, shared ground and 3.3 V pull-ups;
    check effective pull resistance and bus capacitance.
- problem: Output is unreadable or missing
  cause: Wrong port, baud or USB cable, or an earlier initialization message was missed.
  fix: Use a data cable, select the correct port, set 115200 baud and reset to see startup diagnostics.
