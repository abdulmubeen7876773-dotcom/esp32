code:
  title: Read motion axes and chip temperature
  filename: mpu6050_motion_sensor.ino
  wiring: Reference Adafruit VIN to 3.3 V, common GND, SDA21, SCL22 and default AD0 LOW for 0x68. INT unused.
  content: "#include <Arduino.h>\n#include <Wire.h>\n#include <Adafruit_MPU6050.h>\n#include <Adafruit_Sensor.h>\n\
    Adafruit_MPU6050 mpu;\nbool ready = false;\nvoid setup() {\n  Serial.begin(115200);\n  if (!Wire.begin(21, 22,\
    \ 100000)) {\n    Serial.println(\"I2C bus initialization failed\");\n    return;\n  }\n  if (!mpu.begin(0x68,\
    \ &Wire)) {\n    Serial.println(\"MPU6050 initialization failed; check wiring and AD0/address\");\n    return;\n\
    \  }\n  mpu.setAccelerometerRange(MPU6050_RANGE_2_G);\n  mpu.setGyroRange(MPU6050_RANGE_250_DEG);\n  mpu.setFilterBandwidth(MPU6050_BAND_21_HZ);\n\
    \  ready = true;\n}\nvoid loop() {\n  if (!ready) { delay(100); return; }\n  sensors_event_t a, g, t;\n  mpu.getEvent(&a,\
    \ &g, &t);\n  Serial.printf(\"Accel m/s^2: %.2f %.2f %.2f | Gyro rad/s: %.2f %.2f %.2f | Chip C: %.2f\\n\",\n\
    \    a.acceleration.x, a.acceleration.y, a.acceleration.z,\n    g.gyro.x, g.gyro.y, g.gyro.z, t.temperature);\n\
    \  delay(200);\n}\n"
  notes: getEvent is not a robust continuous bus-health check. If disconnected after initialization, stop and diagnose
    instead of trusting repeated values. No fusion or calibration is performed.
output: At rest, acceleration magnitude is roughly one g (about 9.8 m/s²), distributed among axes by orientation.
  Gyro values may have bias near zero. These are expected relationships, not measured results. Chip temperature
  reflects the device and board, not calibrated air temperature.
how_it_works: Tilting changes gravity on each axis; rotation changes angular rate. Integrating gyro values accumulates
  bias and drift. Position inference from acceleration requires gravity removal and calibration; this demonstration
  does neither.
applications:
- Tilt and movement visualization
- Motion-input experiments
- Data for a separately designed orientation filter
troubleshooting:
- problem: Initialization fails
  cause: Wrong address, chip or wiring.
  fix: Scan the 3.3 V bus, check AD0 and actual markings; change to 0x69 only if appropriate.
- problem: Nonzero acceleration at rest
  cause: Gravity is included.
  fix: Compare vector magnitude and rotate the board; do not zero every axis and remove useful gravity information.
- problem: Gyro bias or saturation
  cause: Uncalibrated offset or range too small.
  fix: Estimate bias while still; choose a wider documented range for large motion. Do not claim compass accuracy.
faqs:
- question: Is it a nine-axis compass?
  answer: No. It has three acceleration and three gyro axes, without a magnetometer.
- question: Do all GY-521 boards accept the same power?
  answer: No schematic is established by this artwork. The worked circuit uses the documented Adafruit board; other
    regulators and pull-ups require checks.
