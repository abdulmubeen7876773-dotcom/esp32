slug: mpu6050-motion-sensor
name: 'MPU6050 Motion Sensor: ESP32 Acceleration and Gyroscope'
category: Sensors
difficulty: Beginner
summary: Read acceleration in m/s² and angular velocity in rad/s over I2C. Distinguish gravity, gyro bias and chip
  temperature from calibrated orientation.
