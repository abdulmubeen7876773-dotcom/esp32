setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with the listed GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.3.2 (review baseline, not a latest-release claim). Select the documented board or ESP32
      Dev Module for a generic WROOM board. Other families need their own pin map. Serial Monitor: 115200 baud.'
  - label: Supported hardware
    value: 'Reference circuit: documented Adafruit MPU6050 breakout with VIN, GND, SDA, SCL and AD0. VIN accepts
      3–5 V; use 3.3 V here. The approved illustration depicts a generic GY-521-style family, not this exact Adafruit
      board. Unknown regulators, pull-ups and header order require separate checks.'
  - label: Prerequisites and parts
    value: Complete IDE setup and I2C scanner lesson. Documented breakout, short wires and breadboard; secure it
      against shorts while moving.
  - label: Libraries
    value: Install Adafruit MPU6050 2.2.6 plus Adafruit BusIO and Unified Sensor. Accept Library Manager dependencies;
      this release also declares GFX/SSD1306 for packaged display examples, although this sketch uses no display.
  - label: Expected result
    value: Six motion axes and chip temperature print every 200 ms. A stationary sensor still measures gravity;
      rotation changes the gyro readings.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
related_components:
- title: ESP32 DevKit power and pins
  href: /components/esp32-devkit.html
  description: Check board labels, supply rails and GPIO restrictions.
eli12: 'MPU6050 combines three-axis acceleration and three-axis angular-rate sensing. Gravity is part of acceleration.
  It has no built-in magnetometer, so six-axis readings do not provide a drift-free compass heading.


  Start with Serial values before adding displays or motion control. The Adafruit interface reports SI units; this
  example does not calculate position or fused orientation.'
electrical:
  supply: Reference Adafruit VIN to 3.3 V; bare-chip and unknown GY-521 requirements are separate.
  signal: GPIO21/22 I2C at 3.3 V; reference breakout has level shifting and pull-ups.
  protection: Keep ESP32-side pulls at 3.3 V. Do not infer 5 V tolerance from a generic VCC label or bypass an undocumented
    regulator.
  basis: Documented Adafruit breakout and pinned library; manufacturer documents linked through its downloads.
specs:
- name: Address
  value: 0x68 default; 0x69 with AD0 HIGH
  why: ACK alone does not establish identity.
- name: Example ranges
  value: ±2 g; ±250 degrees/s
  why: Large motion can saturate these selected ranges.
- name: Reported units
  value: m/s²; rad/s; °C chip temperature
  why: Not degrees/s, calibrated ambient temperature or orientation.
