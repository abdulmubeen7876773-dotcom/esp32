eli12: 'A brushless cooling fan includes its own commutation electronics. Its supply rating is not a GPIO voltage.
  The approved picture identifies a 12 V fan family; it cannot establish current, connector order, airflow or PWM
  support.


  The worked reference has power, ground and a tachometer lead. Leave tachometer disconnected for the first constant-power
  test. Two-, three- and four-wire fans are different interfaces; wire color alone is not a pinout. Do not reverse
  supply to reverse rotation.'
electrical:
  supply: Rated external DC supply; worked reference 12 V. Never fan power from GPIO or DevKit 3V3.
  signal: No ESP32 signal connection in this exercise. Tachometer and PWM interfaces require separate documentation
    and compatible pull-ups.
  protection: Confirm polarity and current budget before power. Use insulated suitable wiring; no mains supply assembly
    or motor current through GPIO/breadboard rails.
specs:
- name: Illustration label
  value: DC12V
  why: Model/current and lead order remain unverified.
- name: Worked reference
  value: NF-A4x10 FLX at 12 V
  why: Only that documented model; not a universal fan specification.
output: With correct rated power the unloaded fan should spin. A stationary fan, noise or overheating is a reason
  to disconnect and inspect, not increase voltage.
how_it_works: 'A constant supply powers the fan internal controller. For ESP32 switching, use a suitably rated driver
  and its complete power/protection circuit; do not copy a bare brushed-motor flyback circuit without checking fan/driver
  requirements. A four-wire PWM input is separate from switching the fan supply.


  A future non-isolated ESP32 control driver needs a common signal ground between ESP32 and fan supply, with fan
  current returning directly to that supply. Verify startup current and driver transient protection from the actual
  fan/driver documentation. A brushless fan has internal electronics; do not apply bare-motor stall-current or flyback
  assumptions blindly. The separate constant-power exercise has no ESP32 connection.'
applications:
- Enclosure cooling with a documented fan
- Learning separate load power before adding control
troubleshooting:
- problem: No rotation
  cause: Wrong polarity, supply/current limit or obstructed rotor.
  fix: Disconnect power, verify connector/rating and clear obstruction.
- problem: ESP32 resets
  cause: Fan current taken from board supply.
  fix: Use suitable external supply and a reviewed driver circuit before connecting any control.
- problem: Extra wire unidentified
  cause: Tach/PWM role assumed by color.
  fix: Leave it disconnected until model documentation establishes interface and voltage.
faqs:
- question: Can GPIO power the fan?
  answer: No. GPIO is a logic output, not the fan supply.
- question: Does 12 V identify a model?
  answer: No. It does not establish current, dimensions or control interface.
