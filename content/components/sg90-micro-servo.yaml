setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with these GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.x (API review baseline 3.3.2, not a latest-version claim). Select the exact board
      or ESP32 Dev Module for a generic WROOM board. Other ESP32 families need their own pin map. Serial Monitor:
      115200 baud.'
  - label: Hardware assumption
    value: A positional SG90-class servo documented for 4.8 V supply and a 50 Hz RC control signal accepting
      1400–1600 µs pulses. Tower Pro lists 4.8 V for its SG90 Digital; clones/different revisions are not assumed
      identical. Use a standard 14-pin SN74AHCT125 powered from the same regulated 4.8 V rail.
  - label: Prerequisites and parts
    value: First complete Arduino IDE setup and Blink. Servo without mechanical load, regulated external 4.8
      V supply sized for its actual starting/stall current, SN74AHCT125, 100 nF buffer decoupling and suitable
      supply wiring.
  - label: Expected result
    value: The servo starts near its pulse-defined center, then alternates between two nearby positions. No
      angle, torque or travel is promised for an unidentified variant.
  - label: Verification status
    value: Reviewed against the technical references below. Not compiled for an ESP32 or tested on hardware
      in this update. The approved product-style illustration identifies the family; follow documented terminal
      labels and the logical wiring diagram, not its rendered pin positions.
related_components:
- title: ESP32 DevKit board assumptions
  href: /components/esp32-devkit.html
  description: Check classic WROOM power, pin labels and GPIO restrictions.
code:
  title: Narrow-range positional pulse test
  filename: sg90_micro_servo_esp32.ino
  wiring: External regulated 4.8 V powers the documented servo and SN74AHCT125; all grounds join. GPIO25 controls
    buffer channel1, whose output drives the identified servo signal lead.
  content: "#include <Arduino.h>\nconstexpr uint8_t SERVO_PIN = 25;\nconstexpr uint8_t RESOLUTION = 16; //\
    \ Classic ESP32 supports this at 50 Hz.\nconstexpr uint32_t PERIOD_US = 20000;\nbool ready = false;\nbool\
    \ nextHigh = false;\nbool writePulse(uint32_t pulseUs) {\n  uint32_t duty = (pulseUs * (1UL << RESOLUTION)\
    \ + PERIOD_US / 2) / PERIOD_US;\n  return ledcWrite(SERVO_PIN, duty); // 3.x uses the pin, not a channel\
    \ number.\n}\nvoid setup() {\n  Serial.begin(115200);\n  ready = ledcAttach(SERVO_PIN, 50, RESOLUTION);\n\
    \  if (ready) ready = writePulse(1500);\n  if (!ready) { Serial.println(\"LEDC configuration failed.\"\
    ); return; }\n  Serial.println(\"Start at 1500 us; next pulses are 1400 and 1600 us.\");\n  delay(2000);\n\
    }\nvoid loop() {\n  if (!ready) { delay(1000); return; }\n  uint32_t pulseUs = nextHigh ? 1600 : 1400;\n\
    \  nextHigh = !nextHigh;\n  ready = writePulse(pulseUs);\n  if (!ready) { Serial.println(\"LEDC write failed.\"\
    ); return; }\n  Serial.printf(\"Pulse: %lu us\\n\", static_cast<unsigned long>(pulseUs));\n  delay(2000);\n\
    }\n"
  notes: Pulse duty equals pulse duration divided by the 20 ms period, scaled to 2^16. Hardware LEDC maintains
    pulses during delay(). This is positional control, not speed control; a successful API return does not
    verify a connected servo.
