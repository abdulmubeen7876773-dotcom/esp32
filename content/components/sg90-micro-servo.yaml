  steps:
  - Disconnect USB and servo power. Verify the exact servo supply range, signal lead and allowed pulses. Remove
    the horn/load for first movement.
  - Wire buffer channel1, enables, decoupling and unused inputs as shown. Share ground but do not join external
    positive to USB/3V3.
  - Upload the sketch with Arduino-ESP32 3.x, then power the verified servo circuit. Keep fingers and loose
    wires away from motion.
  - Start with the narrow pulse range. Disconnect power if the servo strains; do not force the shaft or widen
    endpoints blindly.
library: No additional servo library; Arduino-ESP32 3.x LEDC API
output: After the initial 1500 µs pulse, the sketch sends 1400 and 1600 µs alternately every two seconds. A
  compatible unloaded positional servo should move between nearby positions. Exact angles depend on the model;
  continuous rotation, buzzing, hard stops or resets call for stopping and checking hardware.
how_it_works: Pulse width requests position. Increasing supply voltage does not select an angle. The buffer
  provides a documented logic interface instead of assuming every servo accepts ESP32 3.3 V HIGH. External
  supply capacity and a common reference remain necessary even when code and pulse timing are correct.
applications:
- Small indicator pointer
- Unloaded servo learning experiment
- Documented low-load robot joint
troubleshooting:
- problem: ESP32 resets when the servo moves
  cause: Supply droop or motor current in ESP32 power wiring.
  fix: Use separate rated servo power and common ground; check actual surge current, wiring and supply decoupling.
- problem: No movement
  cause: Wrong connector, disabled buffer, unsupported pulse input or no servo power.
  fix: Check vendor lead order, 4.8 V-compatible supply, shared ground, buffer OE and pulses; USB alone is
    not servo power.
- problem: Buzzing or hard stop
  cause: Load, mechanical obstruction or unsuitable pulse range.
  fix: Disconnect power, remove the load and verify the model/pulse range. Do not force the shaft.
- problem: ledcAttach is missing
  cause: Arduino-ESP32 2.x or wrong board/core.
  fix: Select Arduino-ESP32 3.x and the classic WROOM board. Do not mix channel-based legacy calls with this
    pin-based example.
faqs:
- question: Can I power SG90 from ESP32 3.3 V?
  answer: No in this build. Use an external supply documented for the exact servo and sized for motor surges;
    share only the required ground reference.
- question: Are all SG90 servos rated 5–6 V?
  answer: No such blanket claim is made. Tower Pro’s referenced SG90 Digital page lists 4.8 V; the exact servo/revision
    controls your supply choice.
- question: Does 1500 µs mean exactly 90 degrees?
  answer: Not for every variant. It is a conventional starting pulse, not a verified angle; check the actual
    servo documentation and mechanical range.
