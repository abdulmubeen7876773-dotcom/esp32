image_alt: Product-style illustration of SG90 Micro Servo; not a verified module pinout
summary: Control a positional SG90-class servo using Arduino-ESP32 3.x LEDC. Use a documented external supply,
  common ground and a buffered control signal; begin with small unloaded movements.
date_modified: '2026-10-08'
