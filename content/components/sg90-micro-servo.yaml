eli12: 'A positional servo uses repeated control pulses to choose a position; it is not powered from the signal
  wire. The motor can draw a surge when starting or blocked, so its supply must be independent of the ESP32
  3.3 V rail.


  Tower Pro lists 4.8 V and external adapter power for its SG90 Digital. This example uses that nominal rail;
  do not infer a universal 5–6 V rating from the SG90 name. A 5 V supply is acceptable only if the exact servo
  documentation permits it. Share ground with the USB-powered ESP32, not independent positive rails.'
electrical:
  supply: External regulated 4.8 V for a servo documented for that rail and the AHCT buffer. Never ESP32 3V3.
  signal: GPIO25 at 3.3 V into buffer; buffer output to servo signal.
  protection: Common ground; verify supply surge capacity and servo input limits. Keep external positive rail
    separate from ESP32 USB/3V3.
  basis: Tower Pro SG90 Digital nominal supply; TI AHCT 4.5–5.5 V supply and TTL input; actual servo variant
    must be documented.
specs:
- name: Servo type
  value: Positional SG90-class
  why: Continuous-rotation conversions behave differently; no universal travel/torque claim.
- name: Power
  value: Documented external 4.8 V supply
  why: Size for actual peak/stall current; stop if buzzing or blocked.
- name: Control
  value: 50 Hz (20 ms period)
  why: Assumed standard RC positional control; verify actual servo.
- name: Example pulse width
  value: 1500 µs start; 1400 / 1600 µs movement
  why: Small initial range, not universal angles or endpoints.
- name: LEDC
  value: GPIO25, 16-bit resolution on classic ESP32
  why: Uses ledcAttach and pin-based ledcWrite in Arduino-ESP32 3.x; other families may have lower resolution
    limits.
pinout:
- pin: Servo positive
  role: Motor/electronics supply
  connects: External regulated 4.8 V
  note: 'Common red convention is not proof: verify connector wiring.'
- pin: Servo ground
  role: Return
  connects: Supply minus + ESP32 GND + buffer pin7
  note: Use supply wiring sized for motor current; no motor current through GPIO.
- pin: Servo signal
  role: RC pulse input
  connects: GPIO25 → buffer 1A pin2 / 1Y pin3 → signal
  note: Buffer VCC pin14 to 4.8 V; OE pin1 LOW; 100 nF between supply/ground.
- pin: Unused buffer channels
  role: Defined unused state
  connects: OE pins4/10/13 HIGH; A pins5/9/12 LOW
  note: Outputs6/8/11 unconnected; verify standard 14-pin package. Do not substitute plain HC125 without checking
    input thresholds.
