eli12: 'A common four-leg tactile button has two electrical contacts, each brought out to two legs. Pressing
  joins the two contacts. Choosing two legs already in the same group makes the circuit look permanently pressed.


  Disconnect power and label your verified groups A1/A2 and B1/B2. Connect one A terminal to GPIO27 and one
  B terminal to GND. INPUT_PULLUP holds a released input HIGH; pressing closes it to LOW. The logical diagram
  is not a promise about every switch’s physical orientation.'
electrical:
  supply: No active supply for this bare contact; no VCC pin.
  signal: GPIO27 with 3.3 V INPUT_PULLUP; press closes to GND.
  protection: Confirm terminal groups and breadboard rows. Never wire a bare switch directly between 3.3 V
    and GND.
  basis: Omron B3F example contact diagrams and Espressif GPIO API; unknown switch layout/rating must be checked.
specs:
- name: Switch assumption
  value: Momentary, normally open
  why: Latching and illuminated variants differ.
- name: Terminal groups
  value: A1/A2 joined; B1/B2 joined
  why: Verify which physical legs form each group with power off.
- name: Released state
  value: HIGH with INPUT_PULLUP
  why: An unconnected INPUT is not a reliable LOW.
- name: Pressed state
  value: LOW
  why: The contact grounds the input; it does not apply a supply voltage.
- name: Debounce window
  value: 30 ms starting value
  why: A software example, not a measured specification; tune for the actual switch.
pinout:
- pin: A1 / A2 (verified group)
  role: First contact
  connects: One A terminal → GPIO27
  note: Both A legs are electrically the same node; these labels are assigned after continuity checking.
- pin: B1 / B2 (verified group)
  role: Second contact
  connects: One B terminal → ESP32 GND
  note: Leave duplicate legs unused or in the same intended node; avoid breadboard shorts.
- pin: Internal pull-up
  role: Defined released state
  connects: pinMode(27, INPUT_PULLUP)
  note: Classic ESP32 GPIO27 supports pull-up; input-only GPIO34–39 do not have internal pulls.
