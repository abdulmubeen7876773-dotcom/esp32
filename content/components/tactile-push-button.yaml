  steps:
  - Disconnect USB. Find the two pairs that are connected without pressing; pressing must join the groups.
  - Place the switch across separate breadboard nodes, often across the center gap when its actual geometry
    permits. Recheck continuity after insertion.
  - Connect one terminal from each different group as shown; do not bridge 3.3 V directly to GND.
  - Upload the stable-state sketch, then try slow and fast presses. Use actual contacts to tune the starting
    debounce window.
library: No additional library; Arduino-ESP32 GPIO and millis
output: At 115200 baud, expect RELEASED when untouched and PRESSED when held, after the stable window. A four-leg
  switch wired across two permanently joined legs reads pressed even when untouched. Fast transitions shorter
  than the debounce window are intentionally ignored.
how_it_works: Contact bounce can produce several raw changes from one movement. Restarting the stability timer
  on each change avoids accepting those intermediate states. The duplicate legs are mechanical conveniences,
  not four independent inputs. Verify pairing rather than relying on an image or a same-side rule.
applications:
- Menu button
- LED control input
- Mode selection with debounced edges
troubleshooting:
- problem: Always PRESSED
  cause: Both chosen legs are in the same group or breadboard rows are shorted.
  fix: Unplug USB, identify pairs and recheck the inserted circuit with a meter.
- problem: Random RELEASED/PRESSED
  cause: Wrong GPIO, missing INPUT_PULLUP or loose connection.
  fix: Use GPIO27 with the matching sketch, common ground and the verified contact groups.
- problem: One press becomes several actions
  cause: Raw reads used as events or debounce bypassed.
  fix: Use accepted stable transitions; count only HIGH-to-LOW edges, not every loop while LOW.
faqs:
- question: Why does a button have four legs?
  answer: In the assumed switch, each of its two electrical contacts has two legs. Confirm the actual pairing
    with the datasheet or continuity.
- question: Should the button connect to 3.3 V?
  answer: This INPUT_PULLUP circuit connects the switch to GND. A pull-down circuit is different; do not mix
    their wiring and logic.
- question: Do I need an external resistor?
  answer: GPIO27 can use INPUT_PULLUP for this short-wire example. An external pull resistor may be appropriate
    for a different pin or noisy/long wiring; choose it for the circuit.
