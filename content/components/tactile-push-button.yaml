  href: /components/esp32-devkit.html
  description: Check classic WROOM power, pin labels and GPIO restrictions.
code:
  title: Debounced button state
  filename: tactile_push_button_esp32.ino
  wiring: One verified A terminal to GPIO27 and one verified B terminal to GND. The sketch enables INPUT_PULLUP;
    released is HIGH and pressed is LOW.
  content: "#include <Arduino.h>\nconstexpr uint8_t CONTACT_PIN = 27;\nconstexpr uint32_t DEBOUNCE_MS = 30;\
    \ // Starting value; adjust for actual contacts.\nint lastRaw = HIGH;\nint stableState = -1;\nuint32_t\
    \ changedAt = 0;\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(CONTACT_PIN, INPUT_PULLUP);\n  lastRaw\
    \ = digitalRead(CONTACT_PIN);\n  changedAt = millis();\n}\nvoid loop() {\n  int raw = digitalRead(CONTACT_PIN);\n\
    \  uint32_t now = millis();\n  if (raw != lastRaw) { lastRaw = raw; changedAt = now; }\n  if (now - changedAt\
    \ >= DEBOUNCE_MS && raw != stableState) {\n    stableState = raw;\n    Serial.println(stableState == LOW\
    \ ? \"PRESSED\" : \"RELEASED\");\n  }\n  delay(1);\n}\n"
  notes: A held button produces one state message, not repeated press events. The first report waits for stability.
    Count press edges only on accepted HIGH-to-LOW transitions if you later add a counter.
