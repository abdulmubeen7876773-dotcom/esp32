slug: usb-a-to-usb-c-cable
name: 'USB-A to USB-C Cable: Power Is Not Data'
category: Miscellaneous
difficulty: Beginner
summary: Choose a data-capable cable for the actual ESP32 USB port. Power indicators alone do not prove USB enumeration
  or upload support.
