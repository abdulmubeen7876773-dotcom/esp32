slug: esp32-devkit
name: 'ESP32 DevKit: First Use, Power and GPIO Guide'
category: Boards
difficulty: Beginner
icon: 🖥
image: /assets/visuals/components/photos/esp32-devkit-photo.webp
summary: 'Start with a classic ESP32-WROOM DevKit: USB setup, 3.3 V GPIO, pin labels, safe beginner choices,
  and practical upload troubleshooting.'
date_modified: '2026-10-08'
applications:
- First ESP32 learning board
- Wi-Fi sensor node
- Bluetooth controller
- Robot brain
- Home automation prototype
- Classroom lab board
- MQTT device
- Low-cost IoT gateway
eli12: 'A DevKit adds USB programming, a voltage regulator, buttons and headers around an ESP32 module. The
  example here uses a classic ESP32-WROOM board, not ESP32-C3, S2, S3 or a WROVER/PSRAM board. These families
  share branding but differ in GPIO maps, USB options and peripherals.


  Read the metal module marking and the exact board documentation first. A 30-pin clone and a 38-pin DevKitC
  do not have the same physical header positions. GPIO16 in code means chip GPIO16, not the sixteenth header
  pin. IO16 may mean GPIO16; an unexplained D label needs the board pin map.'
how_it_works: 'For classic ESP32, GPIO34–39 are input-only and have no internal pull-up/down. Not every module
  exposes every pin in that range; many WROOM boards expose only 34, 35, 36 and 39. Use an external bias resistor
  for an otherwise floating switch input.


  GPIO0, 2, 5, 12 and 15 are strapping pins sampled during reset. Avoid them for first circuits because attached
  pull resistors and loads can change startup behavior. GPIO6–11 are used for flash; board labels D0/D1/D2/D3/CMD/CLK
  in the DevKitC map refer to these flash signals. GPIO1/3 normally carry UART upload and serial output.


  GPIO16/17 are available on the documented WROOM board but reserved for internal use on WROVER modules. Do
  not carry these restrictions over unchanged to C3/S2/S3 boards; consult their own documentation.


  On classic ESP32, ADC2 conflicts with active Wi-Fi. Choose an exposed ADC1 pin such as GPIO32 or GPIO33 for
  a beginner Wi-Fi analog project. GPIO34/35/36/39 can also be ADC1 inputs where exposed, but need externally
  defined signals. ADC readings require appropriate attenuation and calibration; 3.3 V GPIO logic does not
  guarantee an accurate ADC range up to 3.3 V.'
specs:
- name: USB power
  value: Use USB as the sole power source for first use
  why: USB supplies the board, whose regulator provides 3.3 V. Do not connect an external supply at the same
    time.
- name: GPIO signal voltage
  value: 3.3 V logic; not 5 V tolerant
  why: USB/5V power and GPIO signal voltage are different. Level-shift incompatible signals.
- name: 3V3 and VIN/5V
  value: Power rails, not signal pins
  why: DevKitC documents separate power inputs; clone VIN direction and regulator limits vary. Do not assume
    every rail can safely be back-fed.
- name: Beginner digital choices
  value: GPIO18, 19, 21, 22, 23, 25, 26, 27, 32 or 33, when free
  why: Check attached hardware and the exact board map. GPIO21/22 are common Arduino I2C defaults, not fixed-only
    I2C pins.
- name: GPIO16 / 17
  value: Available on the WROOM example; reserved on WROVER variants
  why: The external LED diagram uses GPIO16. Do not reuse that wiring on a PSRAM module without its pin documentation.
- name: ADC with Wi-Fi
  value: Prefer available ADC1 inputs, especially GPIO32/33
  why: Classic ESP32 ADC2 reads conflict with Wi-Fi. This does not prohibit normal digital use of an ADC2-capable
    GPIO.
pinout:
- pin: 3V3
  role: 3.3 V rail
  connects: Compatible small sensor supply
  note: Verify total load and regulator rating; not a motor/relay-coil supply.
- pin: 5V / VIN
  role: Board power rail
  connects: No external connection in this USB-powered example
  note: Clone labels and power circuits vary.
- pin: GND
  role: Signal/power reference
  connects: LED cathode and module grounds
  note: Use a shared reference when exchanging signals.
- pin: IO16 / GPIO16
  role: LED output in this WROOM example
  connects: 220 Ω resistor → LED anode
  note: Not a portable choice for WROVER/PSRAM boards.
- pin: VP / VN
  role: Common classic labels for GPIO36 / GPIO39
  connects: Externally driven inputs only
  note: Input-only; no internal pull-up/down. Check the actual board pin map.
- pin: BOOT / EN
  role: Download-mode / reset buttons
  connects: Usually no wiring needed
  note: Classic BOOT holds GPIO0 low; EN resets. Use only for the appropriate board procedure.
wiring:
  illustration_alt: ESP32 DevKit on breadboard with USB power, GND shared, GPIO16 through resistor to an external
    LED, and GPIO21/GPIO22 marked as common I2C defaults
  image: /assets/visuals/components/wiring/esp32-devkit-wiring.svg
  summary: 'Use USB power only. This existing schematic is a logical WROOM example, not a physical header-position
    map. GPIO16 drives an external LED through 220 Ω to its anode; the cathode goes to GND. The pictured GPIO21/22
    labels are common I2C choices and are not needed for this blink test.


    A board power LED is not necessarily programmable. The sketch does not depend on an onboard GPIO2 LED.
    Do not use GPIO16 on a WROVER variant where it is reserved.'
  table_columns:
  - DevKit Pin / Feature
  - Beginner Use
  - Purpose / Notes
  table_rows:
  - component_pin: USB connector
    esp32_pin: Computer USB data cable
    notes: Sole power source and upload connection.
  - component_pin: GPIO16
    esp32_pin: 220 Ω → LED anode (long leg)
    notes: Classic WROOM board with pin exposed and free.
  - component_pin: GND
    esp32_pin: LED cathode (short leg / flat side)
    notes: Complete the LED return circuit.
  steps:
  - Identify the classic WROOM module, board pin map and USB bridge.
  - Leave external wiring disconnected; install IDE and esp32 package, then select board/port.
  - Upload the Serial-only first sketch from the installation guide and verify its message.
  - Unplug USB and add the external LED circuit shown here.
  - Reconnect, upload this sketch and set Serial Monitor to 115200 baud.
  - If it fails, return to the working Serial-only test before debugging the LED.
library: Arduino ESP32 board package
code:
  filename: esp32_devkit_blink_test.ino
  notes: This example is for classic WROOM GPIO16. A WROVER/PSRAM board may reserve GPIO16/17. Never replace
    LED_PIN with an arbitrary header position or input-only pin.
  content: "#define LED_PIN 16\n\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(LED_PIN, OUTPUT);\n  Serial.println(\"\
    ESP32 DevKit external LED blink test started\");\n}\n\nvoid loop() {\n  digitalWrite(LED_PIN, HIGH);\n\
    \  Serial.println(\"LED ON\");\n  delay(500);\n\n  digitalWrite(LED_PIN, LOW);\n  Serial.println(\"LED\
    \ OFF\");\n  delay(500);\n}"
  title: Optional external LED test on WROOM GPIO16
  wiring: USB power; GPIO16 → 220 Ω → LED anode, LED cathode → GND. Use the exact WROOM pin map.
output: 'Expected, not measured: Serial Monitor at 115200 baud alternates LED ON and LED OFF about every half
  second. The external LED should follow. If text works but the LED does not, check its polarity, resistor
  placement and actual GPIO label; a power LED staying lit is normal.'
troubleshooting:
- problem: No new Windows COM port
  cause: Cable, hub/connector or bridge driver problem.
  fix: 'Use a known data cable and direct USB port. In Device Manager unplug/replug to identify the device.
    Read the bridge marking or hardware ID: use Silicon Labs for CP210x, WCH for the matching CH340/CH341/other
    WCH chip, or the actual vendor. BOOT does not install a driver.'
- problem: Failed to connect / stuck on Connecting
  cause: Wrong port, external wiring on boot/UART pins or missing automatic reset.
  fix: 'Close other serial apps and disconnect peripherals. For a classic BOOT/EN UART board only: hold BOOT,
    tap EN, start upload and release BOOT when writing begins. After flashing, tap EN if it stays in download
    mode. Consult board instructions for native USB variants.'
- problem: LED does not blink
  cause: Wrong header, reversed LED or pin reserved by variant.
  fix: Verify WROOM GPIO16 and the series resistor. On WROVER select a documented free output and change wiring/code
    together. GPIO34–39 cannot drive the LED.
- problem: Board stops booting after wiring
  cause: Strapping/flash/UART pin conflict.
  fix: Disconnect the new circuit and retest. Avoid classic GPIO0/2/5/12/15 and flash GPIO6–11 for beginner
    additions.
- problem: Analog reads fail when Wi-Fi runs
  cause: Classic ADC2/Wi-Fi resource conflict.
  fix: Move the analog signal to available ADC1, for example GPIO32/33, and update code. Check input voltage,
    attenuation and calibration.
- problem: Unreadable serial / resets
  cause: Wrong baud or unstable supply.
  fix: Use 115200 baud for this sketch and a sound cable. Remove heavy loads. If the board becomes hot, disconnect
    power and inspect for shorts.
