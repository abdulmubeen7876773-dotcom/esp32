setup:
  items:
  - label: Board
    value: Classic ESP32-WROOM-32/32E DevKit with USB-to-UART bridge, GPIO16 exposed and unused. DevKitC V4
      documentation is the reference; clone vendor, bridge and exact header layout are unspecified.
  - label: Software
    value: 'Arduino IDE 2.x; esp32 by Espressif Systems 3.x (API review baseline 3.3.2). Serial Monitor: 115200
      baud. Choose the documented board profile; ESP32 Dev Module is the generic classic WROOM fallback.'
  - label: Parts
    value: Known USB data cable, breadboard, LED, 220 Ω series resistor and jumper wires for the optional external
      LED test.
  - label: Prerequisite
    value: Identify the module, USB bridge and printed GND/GPIO16 labels before wiring. First verify upload
      with the Serial-only sketch in the installation guide.
  - label: Expected result
    value: External LED alternates ON/OFF every half second with matching serial text. Documentation/API reviewed;
      not compiled or hardware tested.
