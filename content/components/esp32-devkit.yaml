electrical:
  supply: USB / 5 V board input
  signal: 3.3 V GPIO
  protection: Never apply 5 V to GPIO; use level shifting for higher-voltage signals. Verify clone power pins
    and use one power source.
  basis: ESP32-DevKitC V4 documentation; clone regulator and input limits vary.
