faqs:
- question: Is every ESP32 DevKit the same?
  answer: No. Check the chip/module family, USB bridge, pin map and power schematic. This example uses classic
    WROOM hardware.
- question: Can a USB-powered board accept 5 V GPIO signals?
  answer: No. USB power is converted to the board’s operating rail; ESP32 GPIO remains 3.3 V logic.
- question: Does every board need BOOT held for upload?
  answer: No. Automatic reset usually handles it. The manual BOOT/EN sequence here is a recovery step for a
    classic UART board, not a universal native USB procedure.
