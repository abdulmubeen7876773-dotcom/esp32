setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with the listed GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.3.2 (review baseline, not a latest-release claim). Select the documented board or ESP32
      Dev Module for a generic WROOM board. Other families need their own pin map. Serial Monitor: 115200 baud.'
  - label: Supported hardware
    value: One physical WS2812B RGB pixel cut at a permitted strip cut mark, with documented 5 V supply, 800 kbit/s
      data and GRB order. TI SN74AHCT125N DIP-14 buffer. The approved coil illustration does not establish strip
      revision, density, current, waterproofing or connector order. RGBW and clocked strips need different settings/hardware.
  - label: Prerequisites and parts
    value: Complete Blink. One correctly identified physical pixel, regulated 5 V supply rated for that pixel’s
      documented maximum current plus margin, buffer, 100 nF bypass, 10 kOhm input pull-down, 330 ohm data resistor
      and 1000 microfarad electrolytic rated at least 6.3 V. Power ESP32 by USB; common ground only between supplies.
  - label: Libraries
    value: Install Adafruit NeoPixel 1.12.3 by Adafruit. Its pinned ESP32 IDF5 branch uses the core 3.x RMT API;
      reviewed against Arduino-ESP32 3.3.2.
  - label: Expected result
    value: The single pixel cycles dim red, green and blue, one second each; Serial identifies the commanded color.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
