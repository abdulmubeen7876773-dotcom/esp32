  steps:
  - Disconnect both supplies. Identify DIN from arrows/labels and use one physical documented pixel.
  - Fit the buffer, pull-down, bypass and polarized capacitor. Check supply polarity; do not tie external +5 V to
    the USB-powered ESP32.
  - Install Adafruit NeoPixel 1.12.3; upload and open Serial at 115200. Apply regulated pixel power only after checking
    connections.
code:
  title: Dim red, green and blue test
  filename: ws2812b_rgb_led_strip.ino
  wiring: GPIO25 → AHCT input; output → 330 ohm → DIN. Pixel/buffer use external5 V and common GND; DOUT unused.
    Capacitor and buffer terminations as listed.
  content: "#include <Arduino.h>\n#include <Adafruit_NeoPixel.h>\nconstexpr uint8_t DATA_PIN = 25;\nconstexpr uint16_t\
    \ PIXEL_COUNT = 1;\nAdafruit_NeoPixel pixels(PIXEL_COUNT, DATA_PIN, NEO_GRB + NEO_KHZ800);\nuint8_t phase =\
    \ 0;\nuint32_t changedAt = 0;\nbool ready = false;\nvoid setPhase() {\n  pixels.clear();\n  const uint8_t r\
    \ = phase == 0 ? 16 : 0;\n  const uint8_t g = phase == 1 ? 16 : 0;\n  const uint8_t b = phase == 2 ? 16 : 0;\n\
    \  pixels.setPixelColor(0, pixels.Color(r, g, b));\n  pixels.show();\n  Serial.println(phase == 0 ? \"RED\"\
    \ : (phase == 1 ? \"GREEN\" : \"BLUE\"));\n}\nvoid setup() {\n  Serial.begin(115200);\n  pixels.begin();\n \
    \ if (pixels.getPixels() == nullptr) {\n    Serial.println(\"Pixel buffer allocation failed\");\n    return;\n\
    \  }\n  pixels.clear();\n  pixels.show();\n  ready = true;\n  setPhase();\n  changedAt = millis();\n}\nvoid\
    \ loop() {\n  if (!ready) return;\n  const uint32_t now = millis();\n  if (now - changedAt >= 1000) {\n    changedAt\
    \ = now;\n    phase = (phase + 1) % 3;\n    setPhase();\n  }\n}\n"
  notes: Low color values reduce demonstration brightness; they are not an electrical current limiter. begin() is
    void in 1.12.3. getPixels checks allocation only; show() does not acknowledge physical pixel receipt. Test alone
    before combining other RMT consumers.
output: The physical pixel should cycle red, green and blue. Wrong colors suggest byte-order mismatch, not necessarily
  bad wiring. Printed color names only show what software sent; the one-wire interface supplies no readback.
how_it_works: The pinned library serializes color bytes using ESP32 RMT rather than LEDC PWM. The buffer raises
  the data level; supply and signal voltage are separate requirements. Modern WS2812B revisions vary, so do not
  infer an input threshold or per-pixel current from the family name. Extra pixels increase full-load current and
  may need distributed power injection; low software brightness does not remove the need for suitable wiring and
  supply protection.
applications:
- One-pixel status indicator
- Addressable color lessons
- Preparation for a music visualizer with separate input and power requirements
troubleshooting:
- problem: Pixel remains dark
  cause: Wrong DIN end, missing ground, buffer disabled or supply absent.
  fix: Power off and trace the arrow, 5 V rail and /1OE before changing code.
- problem: Colors are swapped
  cause: Different color byte order.
  fix: Confirm strip specifications; choose the appropriate NEO_RGB/NEO_GRB order, not arbitrary GPIO changes.
- problem: Random colors or ESP32 resets
  cause: Poor signal integrity, supply drop or shared power wiring.
  fix: Check the resistor/buffer/common ground and actual supply budget. Do not connect a long coil to this one-pixel
    circuit.
- problem: Library or RMT errors
  cause: Wrong core/library version or peripheral resource conflict.
  fix: Verify the pinned pair and run this sketch alone; no successful compilation is claimed here.
faqs:
- question: Is every WS2812B strip a 60 mA-per-pixel load?
  answer: No. Revisions and products vary. Design from the actual datasheet and worst-case count; the illustration
    cannot establish current.
- question: Can ESP32 3.3 V data go straight to a 5 V strip?
  answer: This example deliberately uses AHCT buffering rather than assuming an unspecified revision accepts 3.3
    V data.
