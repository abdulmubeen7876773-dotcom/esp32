library: Adafruit NeoPixel 1.12.3
eli12: 'Each addressable pixel receives color bytes and forwards the remaining stream to the next pixel. Data travels
  from DIN toward DOUT; a connector that looks right can still be at the wrong end. A WS2812B strip is not the same
  as a four-lead RGB LED whose channels you drive individually.


  Begin with one physical pixel so unused downstream pixels cannot retain unknown colors. Do not leave an entire
  unconfigured coil attached to a supply selected for one LED. Extend only after checking strip specifications,
  connectors, wire ratings and voltage drop.'
electrical:
  supply: Regulated external 5 V for the documented pixel and buffer. Do not power a strip from GPIO or the DevKit
    3.3 V rail.
  signal: GPIO25 at 3.3 V → 5 V AHCT buffer → 330 ohm → pixel DIN. Common ground.
  protection: 1000 microfarad supply capacitor with correct polarity and voltage rating, short data wire, buffer
    bypass and input pull-down.
  basis: Worldsemi family documentation, Adafruit NeoPixel guidance and TI AHCT datasheet; current budget depends
    on actual pixel revision/count.
specs:
- name: Reference format
  value: RGB / GRB byte order / 800 kbit/s
  why: Confirm the purchased strip; not RGBW, APA102 or 12 V strips.
- name: PIXEL_COUNT
  value: 1 physical pixel in this first test
  why: Changing the constant does not resize the power supply.
- name: Current planning
  value: Use the actual strip datasheet maximum
  why: Traditional 60 mA per full-white pixel is a conservative planning rule for some parts, not a universal measured
    WS2812B rating.
pinout:
- pin: 74AHCT125 pin14 VCC
  role: Supply
  connects: External regulated +5 V
  note: Use SN74AHCT125N DIP-14; not an HC125.
- pin: 74AHCT125 pin7 GND
  role: Return
  connects: Common GND
  note: ESP32 GND and external supply negative.
- pin: 74AHCT125 pin2 1A
  role: Input
  connects: GPIO25 + 10 kOhm to GND
  note: Pull-down holds input LOW during reset.
- pin: 74AHCT125 pin1 /1OE
  role: Enable
  connects: GND
  note: Active LOW; channel1 enabled.
- pin: 'Unused /OE: 4,10,13'
  role: Disable
  connects: +5 V
  note: Outputs6,8,11 left unconnected.
- pin: 'Unused A: 5,9,12'
  role: Input
  connects: GND
  note: Do not leave CMOS inputs floating.
- pin: 100 nF ceramic
  role: Bypass
  connects: Between pins14 and7
  note: Close to buffer; no polarity.
- pin: 74AHCT125 pin3 1Y
  role: Data
  connects: 330 ohm → pixel DIN
  note: Resistor close to first pixel; follow data arrow.
- pin: Pixel +5 V
  role: Supply
  connects: External regulated +5 V
  note: No connection to ESP32 3.3 V.
- pin: Pixel GND
  role: Return
  connects: Common GND
  note: Connect ground first; no hot plugging.
- pin: Pixel DOUT
  role: Next pixel
  connects: Not connected
  note: One-pixel reference only.
- pin: 1000 microfarad capacitor
  role: Bulk bypass
  connects: + to +5 V; - to GND
  note: Rated ≥6.3 V; verify polarity before power.
