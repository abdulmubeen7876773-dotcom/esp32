code:
  title: One color at a time
  filename: rgb_led_esp32.ino
  wiring: Verified common cathode → GND; R/G/B anodes → separate 470 ohm resistors → GPIO25/26/27.
  content: |
    #include <Arduino.h>
    constexpr uint8_t RED_PIN = 25, GREEN_PIN = 26, BLUE_PIN = 27;
    const uint8_t pins[] = {RED_PIN, GREEN_PIN, BLUE_PIN};
    const char* names[] = {"RED", "GREEN", "BLUE"};
    void allOff() { for (uint8_t pin : pins) digitalWrite(pin, LOW); }
    void setup() {
      Serial.begin(115200);
      for (uint8_t pin : pins) { pinMode(pin, OUTPUT); digitalWrite(pin, LOW); }
    }
    void loop() {
      for (uint8_t i = 0; i < 3; ++i) {
        allOff();
        digitalWrite(pins[i], HIGH);
        Serial.println(names[i]);
        delay(1000);
        allOff();
        delay(300);
      }
    }
  notes: Common-cathode only. Begin with one active color to identify leads; this is not calibrated color mixing
    or a brightness measurement.
library: Arduino-ESP32 3.x; no additional library
output: Red, green and blue channels are requested in turn for one second, with an all-off pause. Blue/green brightness
  at 3.3 V is not guaranteed; it depends on actual forward voltage.
how_it_works: Each GPIO controls one LED junction. Resistor values and different forward voltages affect balance,
  so equal drive does not imply equal brightness. This simple digital test avoids PWM setup. The linked controller
  introduces PWM using its own hardware assumptions. If higher voltage is needed, design a separate transistor/driver
  interface rather than feeding 5 V into ESP32 GPIO.
applications:
- Three-state indicator
- Color pattern learning
- RGB PWM project preparation
troubleshooting:
- problem: Colors do not match Serial labels
  cause: Lead order differs from the assumed assignment.
  fix: Power off and remap leads from the actual datasheet.
- problem: All colors stay dark
  cause: Common-anode device, incorrect common wire or unsuitable voltage.
  fix: Identify topology first; do not randomly attach a supply rail.
- problem: Only red is bright
  cause: Blue/green forward voltage or resistor/part differences.
  fix: Check actual forward-voltage data. Do not remove the resistors to force brightness.
faqs:
- question: Can I use common anode unchanged?
  answer: No. A 3.3 V common-anode circuit uses GPIO sinking with LOW meaning on, and needs verified pin/current
    limits. The provided code and wiring are common-cathode only.
- question: Is this an addressable RGB LED?
  answer: No. Four-lead analog RGB LEDs need three separate color outputs. WS2812-style parts use a different power
    and data interface.
