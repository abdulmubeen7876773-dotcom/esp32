eli12: |-
  Three LED junctions share one terminal. Common cathode joins their negative terminals; common anode joins their positive terminals. This example supports common cathode only. It is not a WS2812/addressable LED.

  Find the actual circuit symbol and lead order in the datasheet. Do not treat the longest lead, the artwork or another LED's pin order as proof. Kingbright's RGB datasheet is a reference example, not a match to this illustration.
electrical:
  supply: No separate rail in this common-cathode example; each GPIO drives a color through 470 ohms.
  signal: GPIO25/26/27 are 3.3 V outputs; HIGH turns the selected channel on.
  protection: One resistor per channel. Never connect a common anode to 5 V and return its channels directly to
    ESP32 pins.
  basis: Actual LED datasheet required; this page assumes common cathode and qualified 3.3 V operation.
