eli12: 'A MAX7219 multiplexes up to 64 LEDs, so the ESP32 sends pixel data instead of driving every LED. Start
  with one driver and a low intensity. A four-panel board may contain four drivers: chip count, not board count,
  determines MAX_DEVICES.


  Supply voltage and logic voltage are separate. The driver needs regulated 5 V in this build; its specified
  HIGH minimum is 3.5 V. Direct ESP32 3.3 V signals are not guaranteed. Buffer DIN, CLK and LOAD through the
  named AHCT device, or use a module interface with documented translation.'
electrical:
  supply: Regulated external 5 V for matrix and buffer; MAX7219 chip operating range 4.0–5.5 V.
  signal: ESP32 3.3 V into SN74AHCT125; buffered signals to matrix DIN/CLK/LOAD.
  protection: Common ground, decoupling and sized supply wires; keep 5 V away from ESP32 GPIO/3V3.
  basis: Analog Devices MAX7219 and TI SN74AHCT125 datasheets; exact matrix supplier/current setting unspecified.
specs:
- name: Driver and panel
  value: One MAX7219; 8x8 matrix
  why: Check chip count and module wiring.
- name: Module power
  value: Regulated 5 V
  why: Current depends on ISET, lit pixels, intensity and driver count; no universal current budget.
- name: Logic translation
  value: SN74AHCT125 powered at 5 V
  why: TTL-compatible inputs accept ESP32 HIGH; MAX7219 needs a higher guaranteed HIGH.
- name: Decoupling
  value: 100 nF + 10 µF near MAX7219; 100 nF at buffer
  why: Check what the module already provides; wire power with the supply disconnected.
- name: Intensity
  value: 0–15; start at 1
  why: Zero is minimum brightness, not shutdown, and is not a supply current limit.
pinout:
- pin: VCC / V+
  role: Supply
  connects: External regulated 5 V
  note: Not ESP32 3V3; verify module label.
- pin: GND
  role: Reference
  connects: Supply minus + ESP32 GND + buffer GND
  note: Do not join independent positive power rails.
- pin: DIN (input side)
  role: Data
  connects: GPIO23 → buffer 1A pin2 / 1Y pin3 → DIN
  note: DOUT is cascade output, not the ESP32 data input.
- pin: CLK
  role: Clock
  connects: GPIO18 → buffer 2A pin5 / 2Y pin6 → CLK
  note: Short buffered connection.
- pin: CS / LOAD
  role: Latch
  connects: GPIO27 → buffer 3A pin9 / 3Y pin8 → LOAD
  note: This reference uses GPIO27; the linked project uses GPIO5 with a strapping qualification.
- pin: Buffer power / enables
  role: 14-pin SN74AHCT125
  connects: VCC pin14 to 5 V; GND pin7 to common GND
  note: Ground OE pins1/4/10. Unused OE pin13 HIGH, input4A pin12 LOW, output4Y pin11 unconnected; verify package.
