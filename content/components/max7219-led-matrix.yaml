  steps:
  - Disconnect USB and external power; identify the matrix input-side header and actual buffer package.
  - Wire the three buffered channels and enables exactly as the table shows. Add local decoupling and check
    supply capacity.
  - Install MD_MAX72XX by MajicDesigns in Library Manager; SPI comes with the ESP32 core. Select HARDWARE_TYPE
    using the library hardware guide, not the artwork.
  - Start at intensity 1, power the verified circuit, upload and inspect the pattern. Do not connect MAX7219
    DOUT to ESP32 GPIO.
library: MD_MAX72XX by MajicDesigns, with SPI supplied by the Arduino-ESP32 core
output: Eight diagonal pixels should light for about one second and clear for one second. A different orientation
  is possible until mapping is correct. A successful library message does not prove power or data wiring. Start
  with the simple pattern before adding scrolling text.
how_it_works: The library sends pixel data through the three named software-interface pins and the driver refreshes
  the display. Verify module layout in MD_MAX72XX before judging orientation. The supply must support the configured
  LED load; increasing intensity is not a repair for unstable power.
applications:
- LED status panel
- Small clock display
- Scrolling message board
troubleshooting:
- problem: No pixels
  cause: Wrong header, missing power/ground or LOAD wiring.
  fix: Check the regulated supply, input DIN, buffered channels, enabled outputs and chip count.
- problem: Random pixels or resets
  cause: Supply droop, long wiring or direct 3.3 V control.
  fix: Use the specified buffer, short wires and decoupling; check the supply under load.
- problem: Mirrored or rotated pattern
  cause: Wrong hardware mapping or panel orientation.
  fix: Choose the documented MD_MAX72XX module type; do not assume every board is FC-16.
- problem: Missing MD_MAX72xx.h
  cause: Library absent or include case differs.
  fix: Install MD_MAX72XX by MajicDesigns; keep the exact header spelling shown.
faqs:
- question: Can I power MAX7219 from 3.3 V?
  answer: This build uses regulated 5 V. MAX7219 specifies 4.0–5.5 V operation; another driver or translated
    module needs its own documentation.
- question: Does intensity zero turn the matrix off?
  answer: No. It selects minimum intensity. Clear the pixels or use the library shutdown control for a blank
    display.
- question: Is the image a pinout?
  answer: No. It is a product-style illustration. Use documented header labels, buffer package pins and the
    wiring table.
