code:
  title: One-driver diagonal test
  filename: max7219_led_matrix_esp32.ino
  wiring: GPIO23 data, GPIO18 clock and GPIO27 LOAD go through a 5 V SN74AHCT125. Matrix/buffer power is external
    5 V; grounds are shared. This is one driver, not a chain.
  content: "#include <Arduino.h>\n#include <MD_MAX72xx.h>\n#include <SPI.h>\n\n// Replace GENERIC_HW with the\
    \ type verified for your module.\nconstexpr auto HARDWARE_TYPE = MD_MAX72XX::GENERIC_HW;\nconstexpr uint8_t\
    \ DIN_PIN = 23, CLK_PIN = 18, LOAD_PIN = 27;\nconstexpr uint8_t MAX_DEVICES = 1;\nMD_MAX72XX matrix(HARDWARE_TYPE,\
    \ DIN_PIN, CLK_PIN, LOAD_PIN, MAX_DEVICES);\nbool ready = false;\n\nvoid setup() {\n  Serial.begin(115200);\n\
    \  ready = matrix.begin();\n  if (!ready) { Serial.println(\"Library initialization failed.\"); return;\
    \ }\n  matrix.control(MD_MAX72XX::INTENSITY, 1);\n  matrix.clear();\n  Serial.println(\"Diagonal test;\
    \ verify module mapping and buffered wiring.\");\n}\nvoid loop() {\n  if (!ready) { delay(1000); return;\
    \ }\n  for (uint8_t i = 0; i < 8; ++i) matrix.setPoint(i, i, true);\n  delay(1000);\n  matrix.clear();\n\
    \  delay(1000);\n}\n"
  notes: begin() reports library initialization, not a sensor-style hardware identity or wiring test. GENERIC_HW
    is a configurable example, not a claim about the supplied illustration. For text/scrolling use the linked
    project and verified module mapping.
