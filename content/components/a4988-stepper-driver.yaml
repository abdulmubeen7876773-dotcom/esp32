eli12: 'A4988 turns STEP pulses and a DIR level into controlled currents in two windings. ESP32 sends commands;
  external supply and driver provide motor current. It is for bipolar steppers, not servos or the separate DC-motor
  example.


  Purple board color does not prove DRV8825, revision, pin order or current-sense resistance. The approved image
  depicts A4988 family only; use the documented Pololu item 1182 reference or verify another carrier schematic.
  Never connect/disconnect the motor while powered.'
electrical:
  supply: Reference VDD 3–5.5 V, worked 3.3 V; VMOT 8–35 V, worked regulated 12 V. ESP32 remains USB powered; no
    12 V connection to DevKit.
  signal: 3.3 V STEP/DIR/ENABLE with VDD at 3.3 V. No motor output connects to GPIO.
  protection: Common ground, short suitable power wiring, ≥47 µF / ≥25 V electrolytic near VMOT for this 12 V setup.
    Set coil current from real Rs/motor rating; no blanket 2 A carrier promise. No hot-plugging.
specs:
- name: Mode
  value: Full step; MS1/MS2/MS3 LOW
  why: No universal angle per pulse.
- name: Current limit
  value: Imax ≤0.5 A and ≤motor rating
  why: VREF = 8 × Imax × Rs; supply current is not coil current.
- name: Reference calculation
  value: 'Rs=0.068 ohm: 0.5 A → 0.272 V'
  why: Only for that verified revision, not another carrier preset.
- name: STEP timing
  value: 5 µs HIGH; about 10 ms LOW
  why: Datasheet minimum HIGH/LOW is 1 µs; no acceleration profile.
- name: Reference supply limits
  value: VDD 3–5.5 V; VMOT 8–35 V
  why: Worked VDD is 3.3 V and VMOT is 12 V; ESP32 uses separate USB power.
- name: Control versus winding voltage
  value: 3.3 V control with VDD at 3.3 V
  why: Motor outputs and the 12 V supply never connect to ESP32 GPIO. Common ground does not mean joining positive
    rails.
