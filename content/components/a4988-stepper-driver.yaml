  steps:
  - Unpowered, identify carrier labels, Rs and motor coil pairs. Use manufacturer VREF procedure to set Imax ≤0.5
    A and ≤motor rating. Rs=0.068 ohm gives 0.272 V for 0.5 A; do not copy to another Rs.
  - Adjust VREF with the motor disconnected using the manufacturer procedure, avoiding shorts/unintended outputs.
    Full-step coil current is about 70% of Imax; supply current is not a substitute. Remove power before attaching
    motor.
  - Install capacitor near VMOT, wire grounds/supplies/control pull resistors. Upload with motor power off. Keep
    shaft clear and unloaded.
  - Power the documented setup, send g at 115200 baud. The bounded pulse burst finishes disabled. Disconnect both
    supplies before wiring changes.
code:
  title: Commanded full-step pulse burst
  filename: a4988_stepper_driver.ino
  wiring: VDD3.3 V; VMOT12 V with local capacitor; common GND. STEP25, DIR26, /ENABLE27. RESET/SLEEP HIGH, MS1–3
    LOW; separate winding pairs to 1A/B and 2A/B.
  content: "#include <Arduino.h>\nconstexpr uint8_t STEP_PIN = 25;\nconstexpr uint8_t DIR_PIN = 26;\nconstexpr uint8_t\
    \ ENABLE_PIN = 27; // active LOW\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(ENABLE_PIN, OUTPUT);\n\
    \  digitalWrite(ENABLE_PIN, HIGH);\n  pinMode(STEP_PIN, OUTPUT);\n  pinMode(DIR_PIN, OUTPUT);\n  digitalWrite(STEP_PIN,\
    \ LOW);\n  digitalWrite(DIR_PIN, LOW);\n  Serial.println(\"Set current limit first. Send g for 100 full-step\
    \ pulses.\");\n}\nvoid loop() {\n  if (Serial.available() == 0) return;\n  if (Serial.read() != 'g') return;\n\
    \  digitalWrite(ENABLE_PIN, LOW);\n  delay(2);\n  for (uint16_t n = 0; n < 100; ++n) {\n    digitalWrite(STEP_PIN,\
    \ HIGH);\n    delayMicroseconds(5);\n    digitalWrite(STEP_PIN, LOW);\n    delay(10);\n  }\n  digitalWrite(ENABLE_PIN,\
    \ HIGH);\n  Serial.println(\"100 pulses sent; outputs disabled. Movement is not sensed.\");\n}\n"
  notes: 'Hardware /ENABLE pull-up provides reset bias. About one-second burst intentionally blocks other work:
    first bench test, not motion-control scheduler. Disabled motor has no holding torque; no gravity-loaded axis.
    Current limit is hardware setup, not code.'
output: Unloaded motor should move during the burst, then lose holding torque. 100 commands do not prove 100 steps
  or a specific angle. If it vibrates, stop and check pairs/current setup rather than increasing current blindly.
how_it_works: 'A rising STEP edge advances the translator; DIR chooses direction and /ENABLE gates outputs. RESET/SLEEP
  stay HIGH. A chopper driver can use supply voltage above motor winding nominal voltage only with correct current
  limiting.


  Imax = VREF/(8×Rs); verify real Rs, since reference revisions differ. Thermal limits, cooling and wiring matter.
  Chip protection does not establish safe operation of an unknown carrier at headline maximum current.'
applications:
- Unloaded first stepper test
- Learning STEP/DIR and hardware current limiting
troubleshooting:
- problem: Vibration without rotation
  cause: Mixed winding pairs, unsuitable motor or insufficient torque.
  fix: Power off, verify coils/rating and start unloaded at low rate.
- problem: No movement
  cause: Disabled output, RESET/SLEEP LOW or missing supply.
  fix: Trace the table and command; printed count is not movement feedback.
- problem: Excessive heat/cutout
  cause: Current too high or cooling inadequate.
  fix: Remove power and review current/thermal limits; do not raise VREF to fix wiring.
- problem: Failure after rewiring
  cause: Hot-plugged motor or voltage spike.
  fix: No powered rewiring; use local capacitor and short supply wiring.
faqs:
- question: Does purple mean DRV8825?
  answer: No. Identify real IC/carrier from documentation, not color.
- question: Is 100 steps half a turn?
  answer: Only for a 200-step/revolution motor without missed steps; no universal angle claim.
