setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with the listed GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.3.2 (review baseline, not a latest-release claim). Select the documented board or ESP32
      Dev Module for a generic WROOM board. Other families need their own pin map. Serial Monitor: 115200 baud.'
  - label: Supported hardware
    value: 'Worked carrier: Pololu A4988 item 1182 with published schematic/labels, not unidentified purple artwork.
      Four-wire bipolar motor with documented coil pairs and rated phase current at least 0.5 A. Set driver limit
      ≤0.5 A and ≤motor rating. No universal size or step angle assumed.'
  - label: Prerequisites and parts
    value: Complete Blink and board pin checks. Reference carrier, documented motor, current-limited regulated 12
      V supply sized for actual load, ≥47 µF / ≥25 V capacitor near VMOT, meter, short suitable power wiring and
      10 kOhm resistors. Set VREF first. Keep motor power paths off ordinary breadboard rails.
  - label: Libraries
    value: Arduino-ESP32 3.3.2 GPIO and delay only; no extra library.
  - label: Expected result
    value: After command g, 100 full-step pulses in one direction, then outputs disabled. Angle depends on actual
      motor; software count does not prove motion.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
