  signal: 3.3 V GPIO output; HIGH lights the correctly oriented LED.
  protection: One series resistor per LED; choose from actual forward-voltage/current limits. Never connect an LED
    directly across a GPIO and ground.
  basis: Kingbright indicator-LED documentation; GPIO compatibility is conditional on the selected LED.
