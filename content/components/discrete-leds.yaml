eli12: |-
  An LED conducts mainly in one direction and converts some electrical energy into light. A series resistor limits current. Lens color alone does not establish emitted color, forward voltage, current rating or package size.

  Use the actual datasheet or a power-off diode test to identify anode and cathode. A longer lead or flat case edge can be a clue, but cut leads and unusual packages make those clues unreliable. The illustration is not a polarity diagram.
