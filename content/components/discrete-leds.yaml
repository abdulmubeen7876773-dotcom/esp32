code:
  title: External red LED blink
  filename: discrete_leds_esp32.ino
  wiring: GPIO25 → 470 ohm resistor → LED anode; LED cathode → GND.
  content: |
    #include <Arduino.h>
    constexpr uint8_t LED_PIN = 25;
    void setup() {
      pinMode(LED_PIN, OUTPUT);
      digitalWrite(LED_PIN, LOW);
      Serial.begin(115200);
    }
    void loop() {
      digitalWrite(LED_PIN, HIGH);
      Serial.println("ON");
      delay(1000);
      digitalWrite(LED_PIN, LOW);
      Serial.println("OFF");
      delay(1000);
    }
  notes: This GPIO differs from some linked tutorials; follow this page's wiring. No onboard LED assumed.
library: Arduino-ESP32 3.x; no additional library
output: Red LED alternates one second on and one second off; Serial reports ON and OFF. Brightness is part-dependent.
how_it_works: HIGH places about 3.3 V across the series path. Estimate current with I=(VGPIO−VF)/R, then check the
  actual part limits. A red LED at an illustrative 2.0 V forward drop draws roughly 2.8 mA through 470 ohms; this
  is a calculation, not a measurement. Green or blue parts with higher forward voltage may be dim or fail to light
  on this rail.
applications:
- Blink learning exercise
- Low-current status indication
- Button-controlled LED
troubleshooting:
- problem: Serial changes but LED stays dark
  cause: Reversed LED, wrong row or unsupported forward voltage.
  fix: Power off; confirm polarity and series path. Try the documented red indicator LED, not a higher-voltage lamp.
- problem: LED stays on
  cause: Wrong GPIO or wiring to the supply instead of GPIO25.
  fix: Trace GPIO25 to the resistor and check the uploaded sketch.
- problem: LED is unexpectedly bright or hot
  cause: Missing/bypassed resistor or unsuitable part.
  fix: Disconnect immediately; verify resistance and actual LED limits before retrying.
faqs:
- question: Can three LEDs share one resistor?
  answer: Use one resistor for each independently driven LED. A shared resistor makes current and brightness depend
    on which LEDs are on.
- question: Does the longer lead always mean anode?
  answer: It is a common clue, not a universal guarantee. Use the actual datasheet or a diode test, especially with
    trimmed leads.
