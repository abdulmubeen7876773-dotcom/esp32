code:
  title: Raw axis and push-switch readout
  filename: analog_joystick_esp32.ino
  wiring: VCC to 3.3 V, GND to GND, VRx to GPIO32, VRy to GPIO33 and SW to GPIO27. This example prints raw
    axis readings and the instantaneous switch level.
  content: "#include <Arduino.h>\nconstexpr uint8_t X_PIN = 32, Y_PIN = 33, SW_PIN = 27;\nvoid setup() {\n\
    \  Serial.begin(115200);\n  pinMode(SW_PIN, INPUT_PULLUP);\n  analogReadResolution(12);\n  analogSetPinAttenuation(X_PIN,\
    \ ADC_11db);\n  analogSetPinAttenuation(Y_PIN, ADC_11db);\n}\nvoid loop() {\n  int x = analogRead(X_PIN);\n\
    \  int y = analogRead(Y_PIN);\n  Serial.printf(\"X=%d Y=%d SW=%s\\n\", x, y,\n                digitalRead(SW_PIN)\
    \ == LOW ? \"pressed\" : \"released\");\n  delay(100);\n}\n"
  notes: Raw values demonstrate input changes, not calibrated voltage. Center need not be 2048, and 3.3 V can
    clip the classic ESP32 ADC measurement range. This monitor does not debounce SW; use the linked debouncing
    lesson before counting presses.
