eli12: 'Each axis is a potentiometer whose wiper voltage changes with movement. The ESP32 samples those voltages;
  a separate switch detects a press on the stick.


  Power the assumed passive module from 3.3 V, not 5 V: otherwise its wipers can drive unsafe voltage into
  ESP32 inputs. Read GPIO32 and GPIO33, which are ADC1 on classic ESP32. The illustration does not verify the
  circuit inside another module.'
electrical:
  supply: 3.3 V for the documented passive joystick used here.
  signal: VRx/VRy between GND and the 3.3 V rail; SW pulls GPIO27 to GND.
  protection: Do not connect 5 V wiper outputs or 5 V pull-ups; verify the actual module circuit.
  basis: Potentiometer-divider principle and Espressif classic ESP32 ADC/GPIO documentation.
specs:
- name: Interface
  value: Two analog wipers + one switch
  why: Verify VRx/VRy/SW labels; physical pin order varies.
- name: Supply
  value: 3.3 V in this build
  why: Assumes passive potentiometers and a switch, not an active 5 V module.
- name: Axes
  value: GPIO32 and GPIO33 (ADC1)
  why: Avoid the classic ESP32 ADC2/Wi-Fi conflict; other families differ.
- name: Resolution
  value: 12-bit raw counts, 0–4095
  why: Counts are not calibrated volts or guaranteed full mechanical range.
- name: Attenuation
  value: ADC_11db
  why: Classic ESP32 documented measurable range is about 150–3100 mV; endpoints may clip even with safe 3.3
    V supply.
pinout:
- pin: VCC / +
  role: Potentiometer supply
  connects: ESP32 3.3 V
  note: Only for a module documented for this passive 3.3 V use.
- pin: GND / -
  role: Reference
  connects: ESP32 GND
  note: Shared reference for both axes and switch.
- pin: VRx / X
  role: X wiper
  connects: GPIO32
  note: ADC1 input; never a 5 V wiper.
- pin: VRy / Y
  role: Y wiper
  connects: GPIO33
  note: ADC1 input; orientation may reverse an axis.
- pin: SW
  role: Push switch
  connects: GPIO27 with INPUT_PULLUP
  note: Assumes switch closes to GND. GPIO34–39 lack internal pull resistors on classic ESP32.
