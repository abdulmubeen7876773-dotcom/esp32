  steps:
  - With power disconnected, verify the module circuit/labels and its 3.3 V suitability.
  - Connect only the five named signals, then select the classic WROOM board profile.
  - Upload and open Serial Monitor; move each axis separately and press the stick.
  - Observe the actual center and extremes before choosing a dead zone or mapping values to motion.
library: No additional library; Arduino-ESP32 ADC and GPIO APIs
output: At 115200 baud, X and Y should vary with the stick and SW should change between released and pressed.
  Numbers shown on your board depend on its potentiometers and ADC behavior. Establish a dead zone from observed
  center noise; do not assume an exact center or endpoint value.
how_it_works: 'A potentiometer is a divider, so the wiper follows its position between the supply rails. A
  higher axis supply can create a higher output: analog input is not automatically voltage-safe. For control
  projects, calibrate each axis, allow a center dead zone and debounce the switch separately.'
applications:
- Menu navigation
- Joystick-controlled robot arm
- Two-axis position input
troubleshooting:
- problem: Axis remains near an endpoint
  cause: Wrong pin, loose wiper wire or clipped ADC range.
  fix: Check GPIO numbers, 3.3 V supply and both axis labels. Test each axis alone; clipping is not automatically
    a broken potentiometer.
- problem: Center jitters
  cause: Potentiometer/ADC noise and mechanical variation.
  fix: Use short wires, stable supply, averaging and a measured dead zone; do not demand exactly 2048.
- problem: Axes fail with Wi-Fi
  cause: ADC2 used on classic ESP32 or wrong family map.
  fix: Use the named ADC1 GPIO32/33 here and verify your board family.
- problem: SW always pressed
  cause: Wrong terminal, a short or mismatched switch circuit.
  fix: Check that SW is normally open to GND and GPIO27 has INPUT_PULLUP; inspect module pull-ups.
faqs:
- question: Can I power the joystick at 5 V?
  answer: Not with direct axis connections in this example. The passive wipers may then reach 5 V. Use the
    assumed 3.3 V-compatible module or a properly documented interface.
- question: Why is center not exactly 2048?
  answer: Mechanical center, potentiometer tolerance and ADC response vary. Calibrate instead of assuming ideal
    midpoint counts.
- question: Is this the same pin map as the robot arm?
  answer: No. The linked project uses its own ADC and servo pins. Follow one complete matching wiring/code
    set.
