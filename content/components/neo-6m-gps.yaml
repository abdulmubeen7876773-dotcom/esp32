library: Arduino-ESP32 3.3.2 built-in HardwareSerial; no extra library.
eli12: 'A GPS receiver computes a position from satellite signals and sends status over UART. Start by reading that
  stream before adding a parser or a map: this separates wiring and baud problems from sky-view problems.


  NEO-6M is a GPS receiver family, not a guarantee about a generic breakout’s voltage input. The module itself operates
  from 2.7–3.6 V; a carrier may put a regulator between its header and the receiver. This worked connection requires
  a header documented for 3.3 V input. Do not blindly apply 5 V to the module or assume 3.3 V reaches it through
  every carrier regulator.'
electrical:
  supply: External regulated 3.3 V to the carrier’s documented compatible input. Budget for carrier and antenna
    in addition to receiver; no GPIO power and no inferred universal board current rating.
  signal: Verified native 3.3 V UART TX to ESP32 GPIO16 RX. GPS RX is unused; ESP32 GPIO17 is configured TX but
    left unwired.
  protection: Common GND; separate positive rails. Do not connect GPS TX while ESP32 is unpowered. Antenna and connector
    require the purchased board documentation; not interchangeable by appearance.
specs:
- name: Receiver identity
  value: NEO-6M; UART NMEA demonstration
  why: Different families/configurations need their own documentation.
- name: Receiver supply versus carrier
  value: Module 2.7–3.6 V; worked header 3.3 V
  why: Carrier regulators can require different header voltages.
- name: UART setup
  value: 9600 baud, 8N1
  why: Default NEO-6 settings; saved/custom settings may differ.
- name: Host Serial Monitor
  value: 115200 baud
  why: Independent of receiver-side UART baud.
