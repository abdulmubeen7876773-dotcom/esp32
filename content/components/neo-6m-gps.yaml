setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with the listed GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.3.2 (review baseline, not a latest-release claim). Select the documented board or ESP32
      Dev Module for a generic WROOM board. Other families need their own pin map. Serial Monitor: 115200 baud.'
  - label: Supported hardware
    value: Documented NEO-6M carrier with a 3.3 V-compatible supply input and native 3.3 V UART TX, configured for
      default 9600 8N1 NMEA output. Check carrier regulator/input requirements and antenna before wiring; the illustration
      cannot identify a revision or authentic silicon. Not a NEO-6G or an RS-232 output.
  - label: Prerequisites and parts
    value: IDE setup first. Documented compatible antenna/carrier, short wires and a regulated external 3.3 V source
      with budget for receiver, carrier and antenna. GPS TX → GPIO16, shared ground. WROOM GPIO16/17 must be exposed
      and unused; PSRAM boards can reserve them. ESP32 stays on USB.
  - label: Libraries
    value: Arduino-ESP32 3.3.2 built-in HardwareSerial; no NMEA parsing library required.
  - label: Expected result
    value: Serial Monitor at 115200 shows receiver bytes; readable NMEA may be emitted even when there is no valid
      position fix.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
