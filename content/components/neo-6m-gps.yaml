slug: neo-6m-gps
name: 'NEO-6M GPS: Read UART Sentences Before Parsing'
category: Communication Modules
difficulty: Beginner
summary: Check a documented NEO-6M UART connection and inspect raw NMEA sentences. Serial activity and a valid satellite
  fix are different results.
