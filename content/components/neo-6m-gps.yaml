  steps:
  - Verify actual carrier power input, TTL signal and antenna documentation, then disconnect supplies before wiring.
  - Upload and open Serial Monitor at 115200. GPS side starts at 9600 8N1; correct only if the receiver is documented
    at another baud.
  - Place the matched antenna with unobstructed sky view without touching RF contacts. Inspect sentence validity
    separately from whether bytes arrive.
code:
  title: Read-only receiver UART bridge
  filename: neo_6m_gps.ino
  wiring: GPS TX → GPIO16, common GND. Separate documented 3.3 V GPS supply; ESP32 USB. GPS RX and GPIO17 unwired.
  content: "#include <Arduino.h>\nconstexpr int8_t GPS_RX = 16;\nconstexpr int8_t UNUSED_TX = 17;\nuint32_t bytesSeen\
    \ = 0;\nuint32_t lastCheck = 0;\nvoid setup() {\n  Serial.begin(115200);\n  Serial2.begin(9600, SERIAL_8N1,\
    \ GPS_RX, UNUSED_TX);\n  Serial.println(\"GPS TX -> GPIO16; Monitor 115200, GPS 9600.\");\n}\nvoid loop() {\n\
    \  for (uint8_t n = 0; n < 64 && Serial2.available() > 0; ++n) {\n    const int value = Serial2.read();\n  \
    \  if (value >= 0) {\n      Serial.write(static_cast<uint8_t>(value));\n      ++bytesSeen;\n    }\n  }\n  const\
    \ uint32_t now = millis();\n  if (now - lastCheck >= 5000) {\n    lastCheck = now;\n    if (bytesSeen == 0)\
    \ Serial.println(\"No UART bytes: check power, RX wiring and baud.\");\n    bytesSeen = 0;\n  }\n  delay(1);\n\
    }\n"
  notes: A bounded receive loop and five-second no-byte diagnostic; no blocking wait for satellites. Does not parse/validate
    checksums, coordinates or a fix. No commands sent; attach a version-pinned parser with validation before using
    coordinates in an application.
output: Expect lines beginning with sentence identifiers such as $GPRMC or $GPGGA for default NMEA output. No fix
  is still compatible with readable sentences. Receiver configurations can change talker IDs/messages; this sketch
  makes no location or accuracy assertion.
how_it_works: 'The two UARTs have different baud rates: the receiver sends slowly to Serial2 while the USB debugging
  port prints at 115200. The program forwards bytes only, so corrupt data is not silently converted into plausible
  coordinates.


  For NMEA navigation, inspect RMC status (A valid / V void) and GGA fix-quality (0 means no fix) with checksum
  validation in a parser. Latitude/longitude fields use degrees and minutes, not ready-made decimal degrees. A first-byte
  check is a communications check; it is not a satellite-fix test.'
applications:
- UART bring-up before adding a NMEA parser
- Learning the difference between serial output and navigation validity
troubleshooting:
- problem: No bytes
  cause: Wrong RX pin, missing supply/ground or disabled UART output.
  fix: Check the actual header voltage, GPS TX to GPIO16 and receiver configuration; sky view alone does not fix
    a silent UART.
- problem: Unreadable characters
  cause: Wrong GPS baud/protocol or signal level.
  fix: Keep Monitor at 115200; verify receiver baud separately. UBX binary output will not look like NMEA text.
- problem: Sentences but no fix
  cause: Poor antenna/sky view, startup acquisition or receiver configuration.
  fix: Use a documented antenna and open sky; check status with validation. Do not promise a universal acquisition
    time.
- problem: Works on one board only
  cause: GPIO16/17 reserved or board family differs.
  fix: Use the stated WROOM map; choose available UART pins from the actual board documentation.
faqs:
- question: Can I use a 5 V GPS breakout?
  answer: Only if its carrier documentation permits that supply and confirms ESP32-safe UART levels. That is a different
    supply connection from this worked 3.3 V example.
- question: Does printing coordinates prove a fix?
  answer: No. A parser must check status, age and checksum; old or invalid fields must not be treated as a current
    position.
