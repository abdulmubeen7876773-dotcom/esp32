eli12: 'A resistor limits current or forms a divider/pull resistor with other parts. It has no preferred direction
  and no independent supply pin. A series resistor is essential for a bare indicator LED; it does not make
  a 5 V signal automatically safe for ESP32.


  Read four bands as two significant digits, multiplier and tolerance; five bands add a third digit. The tolerance
  band often has extra spacing, but confirm ambiguous bands with a meter. Body size/color and this illustration
  do not prove wattage.'
electrical:
  supply: No active supply; the example resistor is in series with a GPIO-driven LED.
  signal: GPIO25 uses 3.3 V logic; the resistor limits LED current, not logic voltage by itself.
  protection: Use documented resistance/power rating; verify LED polarity and current. Disconnect power before
    resistance measurements.
  basis: Vishay resistor color chart/fundamentals; Ohm’s law and power calculation for the explicitly assumed
    circuit.
specs:
- name: Four-band 220 ohm example
  value: Red, red, brown, gold = 22 × 10, ±5%
  why: A teaching example, not a reading of the generated artwork.
- name: Four-band 470 ohm example
  value: Yellow, violet, brown, gold = 47 × 10, ±5%
  why: Verify the actual resistor with a meter.
- name: Four-band 10 kOhm example
  value: Brown, black, orange, gold = 10 × 1000, ±5%
  why: Useful pull-up value in suitable circuits; not universal.
- name: Five-band 1 kOhm example
  value: Brown, black, black, brown, brown = 100 × 10, ±1%
  why: Three significant digits, then multiplier and tolerance.
- name: LED resistor selection
  value: R ≥ (supply − LED forward voltage) / target current
  why: Illustrative 3.3 V, 2.0 V LED and 3 mA target gives at least 433 ohm; 470 ohm gives about 2.8 mA. Actual
    LED voltage varies.
- name: Power rating
  value: P = I²R = Vresistor²/R
  why: That illustrative 470 ohm calculation dissipates about 3.6 mW. Use the documented 0.25 W part here;
    larger loads need derating and their own calculation.
pinout:
- pin: Resistor lead A
  role: Series current path
  connects: GPIO25
  note: An unpolarized resistor can be installed either way.
- pin: Resistor lead B
  role: LED feed
  connects: LED anode
  note: Either side of the LED may hold the series resistor; this example puts it on the anode side.
- pin: LED cathode
  role: Return
  connects: ESP32 GND
  note: Verify polarity from LED documentation/diode test, not a shortened lead.
