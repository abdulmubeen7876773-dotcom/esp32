  url: https://www.vishay.com/docs/49411/resistor_color_code_calculator.pdf
  note: Four- and five-band significant digits, multipliers and tolerance.
- title: Vishay resistor fundamentals
  url: https://www.vishay.com/docs/28771/basics.pdf
