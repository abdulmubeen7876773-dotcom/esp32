  steps:
  - Unplug USB. Read the actual bands and verify the resistor value; measure isolated or lift one lead to avoid
    parallel circuit paths.
  - Confirm documented resistor wattage and LED polarity/current limits; calculate for your actual forward
    voltage and target current.
  - Connect the series circuit and upload the sketch. Never connect a bare LED directly across GPIO and ground.
  - Stop and check wiring/value if a part heats; this is only a small low-voltage indicator circuit.
library: No additional library; Arduino GPIO output
output: A correctly wired suitable LED should blink about once each second on/off. A dim LED may be normal
  at the chosen low current. The resistance and calculated dissipation examples are illustrative; no meter
  reading or hardware measurement is claimed.
how_it_works: Ohm’s law relates voltage across the resistor to current. Choose resistance from the actual LED
  forward voltage and desired current, then check resistor power with margin under its datasheet conditions.
  Pull-ups define an input state; voltage dividers use two resistors and can be affected by the connected load.
  A single series resistor is not a general 5-to-3.3 V level shifter.
applications:
- LED current limiting
- Button/reed pull-up
- Documented voltage divider
troubleshooting:
- problem: Meter disagrees with the bands
  cause: Reading direction, wrong multiplier or parallel paths.
  fix: Disconnect power, isolate the resistor and confirm four/five-band rules; check tolerance.
- problem: LED does not light
  cause: Polarity reversed, wrong GPIO/breadboard row or resistor too large.
  fix: Check LED polarity and GPIO25 series path; confirm actual resistance and supply.
- problem: Resistor gets hot
  cause: Wrong resistance, excessive voltage/current or insufficient power rating.
  fix: Disconnect power; recalculate dissipation and check documented rating/derating. Do not infer wattage
    from the artwork.
faqs:
- question: Does a resistor have polarity?
  answer: An ordinary fixed axial resistor does not; an LED does. Follow the LED’s documented polarity.
- question: Does band color tell me wattage?
  answer: The shown codes describe resistance and tolerance. Obtain power rating from the exact resistor series/part
    documentation.
- question: Can one resistor protect a GPIO from 5 V?
  answer: Do not assume that. Select a documented divider or level-shifting interface for the signal; a single
    series resistor is not a universal voltage converter.
