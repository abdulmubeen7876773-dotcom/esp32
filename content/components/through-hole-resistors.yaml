code:
  title: External LED with a series resistor
  filename: through_hole_resistors_esp32.ino
  wiring: GPIO25 → known 470 ohm resistor → LED anode; LED cathode → GND. Use an external LED, not an assumed
    onboard GPIO2 LED.
  content: "#include <Arduino.h>\nconstexpr uint8_t LED_PIN = 25;\nvoid setup() {\n  pinMode(LED_PIN, OUTPUT);\n\
    \  digitalWrite(LED_PIN, LOW);\n}\nvoid loop() {\n  digitalWrite(LED_PIN, HIGH);\n  delay(1000);\n  digitalWrite(LED_PIN,\
    \ LOW);\n  delay(1000);\n}\n"
  notes: Code cannot compensate for a missing or wrong resistor. The 2.0 V forward voltage is a calculation
    assumption, not a measured specification of the pictured parts. Recalculate for another LED or driver voltage.
sources:
