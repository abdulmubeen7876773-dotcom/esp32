eli12: 'pH 4 buffer provides an acidic reference for a compatible pH meter. Paired with a near-neutral point, it
  helps the instrument assess electrode slope on the acidic side. It is a consumable solution, not a probe or an
  analog-output module.


  Choose points that bracket the intended samples and are supported by the meter. pH 4 and 7 are not the right pair
  for every range: alkaline samples may require a different second point. The approved illustration says 4.0; the
  separately documented Hanna reference is 4.01. Enter the actual reference value at its specified temperature,
  not the rounded artwork label.'
electrical:
  supply: No electrical supply; chemical reference only.
  signal: No GPIO or analog output. The separate meter/interface determines ESP32 voltage compatibility.
  protection: Keep liquids away from powered electronics. Follow actual product handling/SDS and do not return used
    buffer to the bottle.
specs:
- name: Illustration label
  value: pH 4.0
  why: Exact certified value/temperature and lot unknown.
- name: Documented reference
  value: Hanna pH 4.01 buffer
  why: Use actual product temperature table; not an artwork specification.
- name: Calibration role
  value: acidic slope point
  why: Follow instrument-supported points and sequence.
output: After a valid neutral point, the meter should accept the documented acidic reference. Its slope diagnostic,
  if provided, is instrument-specific. Acceptance is not independent proof of accuracy on unknown samples.
how_it_works: 'After the meter accepts its near-neutral point, rinse the electrode as its manual directs and move
  it to a separate fresh acidic aliquot. Immerse the bulb and junction to the required depth, allow stabilization
  and accept the supported second point. Save the calibration according to the instrument instructions; do not derive
  a universal ESP32 conversion coefficient from two displayed numbers.


  Use a clean beaker for each solution and never return a used aliquot to stock. Keep the stock bottle closed and
  follow its actual storage conditions, lot and expiry instructions. Buffer is not automatically electrode storage
  solution. See the pH 7 page for the first-point and stabilization checks.'
applications:
- A documented pH 4 calibration point
- Checking reference stability before designing a probe interface
troubleshooting:
- problem: Neutral point accepted, acidic point rejected
  cause: Wrong second-point selection, contaminated reference or electrode response issue.
  fix: Use a fresh labelled acidic aliquot at the documented temperature; consult the meter slope diagnostic rather
    than adding a software offset.
- problem: Trying to calibrate alkaline samples with only pH 4 and 7
  cause: Calibration points do not bracket the intended range.
  fix: Select the supported reference pair for the sample range; Hanna gives 7.01 and 10.01 as an example for samples
    around pH 8.
- problem: Acidic reading drifts
  cause: Carryover, insufficient immersion or electrode condition.
  fix: Rinse between separate beakers, cover the bulb/junction as specified and follow electrode maintenance instructions.
faqs:
- question: Is pH 4 always the second point?
  answer: No. The meter procedure and intended range decide the sequence and reference values.
- question: Can I use the illustration value 4.0 for every bottle?
  answer: No. Use the actual certificate/label and temperature table; a 4.01 product is a separately specified reference.
