slug: mq135-air-quality-sensor
name: 'MQ-135: Protected ESP32 Analog Readings'
category: Sensors
difficulty: Beginner
summary: Read an MQ-135 analog signal without exposing ESP32 GPIO to 5 V. Separate broad gas sensitivity from a
  selective CO2 measurement or an air-quality index.
