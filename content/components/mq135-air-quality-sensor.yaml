setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with the listed GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.3.2 (review baseline, not a latest-release claim). Select the documented board or ESP32
      Dev Module for a generic WROOM board. Other families need their own pin map. Serial Monitor: 115200 baud.'
  - label: Supported hardware
    value: Documented MQ-135 analog breakout with VCC, GND and AO, a 5.0 V heater/circuit supply and a nonnegative
      AO bounded by that supply. Verify the purchased schematic, labels and load resistor. Not a bare six-pin sensor
      circuit; no exact carrier revision or authenticity established by the illustration.
  - label: Prerequisites and parts
    value: Complete IDE setup and analog-input lesson. Regulated external 5.0 V ±0.1 V supply sized for the heater
      plus actual carrier load, two 10 kohm 1% resistors, 100 nF ceramic capacitor, meter and short wires. DevKit
      stays on USB; do not join its positive power rail to the sensor supply. Heater alone can require about 190
      mA at 5 V from the 950 mW limit; account for carrier overhead. GPIO32 must be free.
  - label: Libraries
    value: Arduino-ESP32 3.3.2 built-in ADC; no gas-concentration library.
  - label: Expected result
    value: Once powered, Serial reports raw ADC counts and calibrated estimates of divider-node millivolts once
      per second. There is no ppm, AQI or alarm result.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
