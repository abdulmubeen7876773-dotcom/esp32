library: Arduino-ESP32 3.3.2 built-in ADC; no additional library.
eli12: 'MQ-135 responds to several gases rather than identifying one of them. Its resistance-based signal cannot
  by itself distinguish ammonia, smoke or other vapors. The approved image is correctly assigned to MQ-135, not
  MQ-2.


  A number from this module is not a CO2 concentration or an AQI. Neither a clean-air assumption nor an internet
  conversion formula supplies the missing reference gas, actual load resistance and calibration conditions. This
  page exposes the electrical reading without labeling it as a health measurement.'
electrical:
  supply: External regulated 5.0 V ±0.1 V for this documented carrier; heater and loop requirements differ from
    ESP32 logic. Never power the heater from a GPIO or assume the DevKit 3.3 V regulator can supply it.
  signal: AO → 10 kohm → node → GPIO32; node → 10 kohm → GND. At AO=5.1 V, ideal node=2.55 V; with 1% resistor worst-case
    ratio, about 2.576 V. Verify with meter before connecting ESP32. DO is unused.
  protection: 100 nF from node to GND, shared ground and separate positive supplies. Divider is required even with
    high ADC attenuation. Avoid powered signals into an unpowered ESP32; disconnect together. This is not a safety
    gas alarm.
specs:
- name: Heater/circuit reference
  value: 5.0 V ±0.1 V
  why: Winsen conditions for the stated sensor; check the carrier schematic.
- name: AO interface
  value: Two 10 kohm 1% resistors + 100 nF
  why: Divider reduces voltage; it also loads AO by 20 kohm.
- name: ADC input
  value: GPIO32, ADC1, ADC_11db
  why: 12-bit raw counts; calibrated millivolts are a separate conversion.
- name: Initial conditioning
  value: 'MQ-135: over 48 hours'
  why: Manufacturer test preheat, not a sketch delay or guaranteed stabilization time.
pinout:
- pin: Sensor VCC
  role: Supply
  connects: External regulated 5.0 V
  note: Only the documented 5 V carrier; not ESP32 3.3 V.
- pin: Sensor GND / supply minus
  role: Reference
  connects: ESP32 GND
  note: Common reference; positive supplies stay separate.
- pin: Sensor AO
  role: Analog output
  connects: 10 kohm R1 then node N
  note: Never connect AO directly to GPIO.
- pin: Node N
  role: Divider
  connects: GPIO32; 10 kohm R2 to GND
  note: Both resistors 1%; verify voltage before attachment.
- pin: 100 nF ceramic capacitor
  role: Filter
  connects: Node N to GND
  note: Place close to ADC input; no polarity.
- pin: Sensor DO, if fitted
  role: Comparator
  connects: Leave disconnected
  note: Threshold/polarity and pull-up rail are carrier-specific.
