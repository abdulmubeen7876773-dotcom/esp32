    do not copy physical pin positions from the artwork.
  - With ESP32 signal disconnected, power the sensor, check supply and node voltages. Disconnect power again before
    attaching GPIO32.
  - Upload, power both systems and open 115200 baud. Follow manufacturer conditioning for any repeatable study;
    startup readings are not readiness evidence. Do not introduce hazardous test gases.
code:
  title: MQ-135 divided-voltage logger
  filename: mq135_air_quality_sensor.ino
  wiring: External 5 V → sensor VCC; all grounds common. AO → R1 10 kohm → N → GPIO32. R2 10 kohm and 100 nF both
    connect N to GND. DO unused.
  content: "#include <Arduino.h>\nconstexpr uint8_t SENSOR_ADC = 32;\nuint32_t lastReport = 0;\nvoid setup() {\n\
    \  Serial.begin(115200);\n  analogReadResolution(12);\n  analogSetPinAttenuation(SENSOR_ADC, ADC_11db);\n  Serial.println(\"\
    AO through 10k/10k divider; readings are not ppm.\");\n}\nvoid loop() {\n  const uint32_t now = millis();\n\
    \  if (now - lastReport >= 1000) {\n    lastReport = now;\n    const uint16_t raw = analogRead(SENSOR_ADC);\n\
    \    const uint32_t nodeMv = analogReadMilliVolts(SENSOR_ADC);\n    Serial.printf(\"raw=%u node_mV=%lu\\n\"\
    ,\n                  static_cast<unsigned>(raw),\n                  static_cast<unsigned long>(nodeMv));\n \
    \ }\n  delay(1);\n}\n"
  notes: Raw counts and calibrated millivolts are two successive samples, not one identical sample converted twice.
    No voltage-to-ppm formula, automatic alarm threshold or sensor-ready indication. GPIO32 avoids classic ESP32
    ADC2/Wi-Fi contention.
output: Lines such as raw=<count> node_mV=<estimate> should appear once a second; these are format placeholders,
  not measured values. Compare node_mV with a meter. The signal may drift during heating. The sketch does not declare
  the sensor conditioned or identify a gas.
how_it_works: 'The equal-resistor divider halves the connected AO voltage in the ideal circuit. Its 20 kohm load
  can change an unbuffered carrier’s effective load resistance and therefore its transfer curve; do not reuse the
  bare-sensor calibration curve unchanged. The capacitor helps slow noise at the ADC node. Calibrated ADC millivolts
  are still an estimate, not a calibration of the gas sensor.


  Follow the actual sensor’s storage/reconditioning and manufacturer test conditions for later studies. Initial
  48-hour-class conditioning is not a promise that every power-up requires exactly that delay or that subsequent
  readings are accurate. There is no defensible universal clean-air count.'
applications:
- Comparing repeated relative readings under documented conditions
- Learning why cross-sensitive sensors cannot identify gases
troubleshooting:
- problem: ADC stays near full scale
  cause: Missing divider, wrong node or excessive voltage.
  fix: Disconnect GPIO first and measure N; verify R1/R2 and supply. Attenuation does not protect an overvoltage
    input.
- problem: Baseline keeps moving
  cause: Heater conditioning, environment or supply changes.
  fix: Check actual conditioning procedure and stable power; log context rather than converting drift to ppm.
- problem: ESP32 resets
  cause: Heater shares an inadequate supply path or ground wiring.
  fix: Use the qualified external source, check its current budget and keep positive rails separate.
- problem: DO LED disagrees with AO
  cause: Comparator threshold or output circuit differs.
  fix: DO is not read here. Check the actual schematic; its LED is not a calibrated alarm.
- problem: Reading seems too low
  cause: Divider loading or ADC response.
  fix: Measure both AO and N; characterize the connected circuit before any conversion. Do not assume AO is unchanged
    by added resistors.
faqs:
- question: Can I power it at 3.3 V to avoid a divider?
  answer: Not for the specified 5 V heater/circuit conditions. Lowering heater voltage changes operation; use the
    documented supply and protected input.
- question: Can the sketch report CO2 or a safe/unsafe level?
  answer: No. It reports electrical readings only; gas-specific calibration and a suitable validated system are
    separate requirements.
