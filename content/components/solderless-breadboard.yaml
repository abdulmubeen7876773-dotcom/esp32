  - label: Prerequisites and parts
    value: Complete IDE setup. Known red indicator LED suitable for a few mA, 470 ohm 0.25 W resistor, jumpers and
      continuity meter. GPIO25 exposed/unused. No assumed onboard LED.
  - label: Libraries
    value: Arduino-ESP32 3.3.2 GPIO only; no breadboard library.
  - label: Expected result
    value: External red LED blinks one second on/off with its terminals in separate nodes.
