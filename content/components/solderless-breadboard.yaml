  open_full_size: true
  image: /assets/visuals/components/wiring/solderless-breadboard-wiring.svg
  illustration_alt: Logical wiring for Solderless Breadboard; terminal labels rather than physical pin positions
  summary: GPIO25 → A → 470 ohm → B → LED anode; cathode → C → GND. A/B/C are separate verified electrical nodes.
  table_columns:
  - Component terminal
  - ESP32 / circuit connection
  - Purpose and qualification
  table_rows:
  - component_pin: GPIO25 + resistor end 1
    esp32_pin: Verified terminal node A
    notes: A is a logical node name, not column A.
  - component_pin: Resistor end 2 + LED anode
    esp32_pin: Separate terminal node B
    notes: Must not share metal strip with A.
  - component_pin: LED cathode + GND wire
    esp32_pin: Separate terminal node C
    notes: C connects to DevKit GND.
  - component_pin: Optional ground rail
    esp32_pin: Node C after continuity check
    notes: Bridge splits only when needed.
  - component_pin: Unused power rails
    esp32_pin: Leave unpowered
