eli12: 'A solderless breadboard holds leads in spring contacts so a circuit can be rearranged. Holes on one internal
  strip are one electrical node; spacing alone does not tell you where connections go.


  Conventional boards connect each five-hole terminal group, with the center trench separating sides. Power rails
  may split midway and opposite-side rails are usually independent. Letters, numbers and red/blue lines are labels,
  not a continuity test. Map the actual board with all power removed. A wide DevKit may cover usable holes; use
  jumper leads or two boards rather than force a fit.'
electrical:
  supply: Passive contacts, not a regulator. LED example uses DevKit USB and GPIO25; no breadboard power module
    needed.
  signal: GPIO25 is 3.3 V logic. Separate nodes and 470 ohm series resistor required; rail color does not protect
    GPIO from 5 V.
  protection: Continuity only with all power removed. Keep motor/heater/high-current LED power off unspecified breadboard
    rails; never mains wiring.
specs:
- name: Connection pattern
  value: Verify strips and rails
  why: Five-hole groups/split rails are typical, not universal.
- name: LED circuit
  value: GPIO25 → 470 ohm → anode; cathode → GND
  why: Each component end needs a different node except intended junctions.
- name: Estimated current
  value: About 2.8 mA assuming 2.0 V LED
  why: (3.3−2.0)/470; actual brightness/voltage varies.
- name: Pin label
  value: GPIO25, not a hole number
  why: Breadboard row numbers are placement labels only.
pinout:
- pin: GPIO25 + resistor end 1
  role: Output
  connects: Verified terminal node A
  note: A is a logical node name, not column A.
- pin: Resistor end 2 + LED anode
  role: Junction
  connects: Separate terminal node B
  note: Must not share metal strip with A.
- pin: LED cathode + GND wire
  role: Return
  connects: Separate terminal node C
  note: C connects to DevKit GND.
- pin: Optional ground rail
  role: Distribution
  connects: Node C after continuity check
  note: Bridge splits only when needed.
- pin: Unused power rails
  role: Unused
  connects: Leave unpowered
  note: No supply module required.
