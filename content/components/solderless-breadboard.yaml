  steps:
  - Unplug all supplies. Check terminal-group, cross-trench and rail continuity; record which holes share a node.
  - Place resistor across A/B, LED across B/C, GPIO25 wire to A and GND to C. Confirm LED polarity from actual markings/datasheet,
    not trimmed lead length.
  - Check no GPIO-to-GND short and no component has both leads in one strip. Upload complete sketch and observe
    external LED.
code:
  title: External LED on separate nodes
  filename: solderless_breadboard.ino
  wiring: GPIO25 → A → 470 ohm → B → LED anode; cathode → C → GND. A/B/C are separate verified electrical nodes.
  content: "#include <Arduino.h>\nconstexpr uint8_t LED_PIN = 25;\nvoid setup() {\n  pinMode(LED_PIN, OUTPUT);\n\
    \  digitalWrite(LED_PIN, LOW);\n}\nvoid loop() {\n  digitalWrite(LED_PIN, HIGH);\n  delay(1000);\n  digitalWrite(LED_PIN,\
    \ LOW);\n  delay(1000);\n}\n"
  notes: Complete external LED example; pinMode before digitalWrite. Delay is suitable for this single-task first
    exercise, not a multitask application. Row labels do not change code.
output: LED should alternate on/off each second. Darkness, constant light or resets need inspection, not congratulations.
  The 2.8 mA value is calculated using an assumed red-LED voltage, not measured.
how_it_works: Resistor and LED share only their intended junction B, so current passes through the resistor. Both
  resistor ends in one strip bypass it; both LED leads in one strip short the LED. Routing is a translation of electrical
  nodes, not an illustration to copy without connectivity checks.
applications:
- Low-current Blink/button lessons
- Sensor prototypes with verified rails
- Mapping wiring tables to electrical nodes
troubleshooting:
- problem: No light
  cause: Reversed LED, wrong GPIO, bad contact or same-node leads.
  fix: Unplug and trace A/B/C and polarity.
- problem: Reset or warming
  cause: Power/GPIO short or unsafe supply module.
  fix: Disconnect and inspect unpowered; do not use a bigger source.
- problem: Half a rail is dead
  cause: Rail center split.
  fix: Check unpowered continuity; bridge only intended matching nodes.
- problem: Works only when pressed
  cause: Bad contact or jumper.
  fix: Replace suspect parts and secure leads; one brief result does not prove stability.
faqs:
- question: Are colored rails powered automatically?
  answer: No. They label passive contacts; supply and continuity must be checked.
- question: Can motor power use this board?
  answer: Not on an unspecified board. Use actual connector/current ratings and suitable direct power paths.
