slug: mfrc522-rfid-reader
name: 'MFRC522 RFID Reader: Read a Tag UID with ESP32'
category: Communication Modules
difficulty: Beginner
summary: Connect a documented 3.3 V RC522 SPI reader, check its register response and print a compatible tag UID.
  A UID is identification data, not secure authentication.
date_modified: '2026-10-10'
