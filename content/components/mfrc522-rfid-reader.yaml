setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with the listed GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.3.2 (review baseline, not a latest-release claim). Select the documented board or ESP32
      Dev Module for a generic WROOM board. Other families need their own pin map. Serial Monitor: 115200 baud.'
  - label: Supported hardware
    value: A documented RC522/MFRC522 board configured for SPI with 3.3 V, GND, SCK, MOSI, MISO, SS (often SDA),
      RST and optional IRQ. Supply and host logic must both be 3.3 V. The illustration does not prove genuine NXP
      silicon or a board schematic.
  - label: Prerequisites and parts
    value: Complete IDE setup and Blink. Reader, short wires and a known ISO/IEC 14443 Type A test tag, such as
      MIFARE Classic. A generic RFID card/fob or phone is not automatically compatible.
  - label: Libraries
    value: Install MFRC522 by GithubCommunity 1.4.12 from Library Manager. SPI is bundled with Arduino-ESP32 3.3.2.
  - label: Expected result
    value: A version byte appears, then UID bytes when a compatible card is presented. Remove and present it again
      for another read.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
