  description: Check board labels, supply rails and GPIO restrictions.
eli12: 'The reader energizes a nearby passive 13.56 MHz tag and exchanges data. This example prints the UID without
  writing the card. It is useful for learning SPI or labelling classroom objects.


  The RC522 pin labelled SDA is chip select in this SPI example, not ESP32 I2C SDA. Match labels, not the artwork’s
  pin order. UID-only access control is easy to spoof and is not a secure lock design.'
electrical:
  supply: ESP32 3.3 V only for this documented 3.3 V module; check the DevKit regulator budget.
  signal: SPI and reset use 3.3 V logic; common ground.
  protection: No 5 V supply or host signals. Disconnect before wiring and keep SPI wires short.
  basis: NXP MFRC522 datasheet and pinned library; unknown module designs need their own documentation.
specs:
- name: RF interface
  value: 13.56 MHz, ISO/IEC 14443 A
  why: Frequency alone does not establish tag compatibility.
- name: Host interface
  value: SPI with explicit pins
  why: Not I2C despite the SDA header label.
- name: UID
  value: Variable-length hexadecimal bytes
  why: Not a secret or proof of authorized ownership.
