code:
  title: SPI reader check and tag UID
  filename: mfrc522_rfid_reader.ino
  wiring: Reader 3.3 V and common GND; SCK18, MISO19, MOSI23, SS27 and RST26. IRQ unused.
  content: "#include <Arduino.h>\n#include <SPI.h>\n#include <MFRC522.h>\nconstexpr uint8_t SS_PIN = 27;\nconstexpr\
    \ uint8_t RST_PIN = 26;\nMFRC522 reader(SS_PIN, RST_PIN);\nbool ready = false;\nvoid setup() {\n  Serial.begin(115200);\n\
    \  if (!SPI.begin(18, 19, 23, SS_PIN)) {\n    Serial.println(\"SPI initialization failed\");\n    return;\n\
    \  }\n  reader.PCD_Init();\n  delay(4);\n  byte version = reader.PCD_ReadRegister(MFRC522::VersionReg);\n  Serial.print(\"\
    Reader version byte: 0x\");\n  Serial.println(version, HEX);\n  if (version == 0x00 || version == 0xFF) {\n\
    \    Serial.println(\"No usable reader response; check power, SS and SPI wiring\");\n    return;\n  }\n  ready\
    \ = true;\n  Serial.println(\"Present a compatible Type A test card\");\n}\nvoid loop() {\n  if (!ready) { delay(100);\
    \ return; }\n  if (reader.PICC_IsNewCardPresent() && reader.PICC_ReadCardSerial()) {\n    Serial.print(\"UID:\"\
    );\n    for (byte i = 0; i < reader.uid.size; ++i) {\n      Serial.print(' ');\n      if (reader.uid.uidByte[i]\
    \ < 0x10) Serial.print('0');\n      Serial.print(reader.uid.uidByte[i], HEX);\n    }\n    Serial.println();\n\
    \    reader.PICC_HaltA();\n    reader.PCD_StopCrypto1();\n  }\n  delay(10);\n}\n"
  notes: The version read detects a missing SPI response, not authenticity. A halted stationary card need not produce
    repeated lines. This reads UID only, with no authentication or protected data access.
output: Expect one version line and UID bytes for a successful presentation. Bytes and length depend on the tag;
  no fixed sample UID is promised. A silent tag can be an unsupported protocol rather than a wiring fault.
how_it_works: SPI commands control the reader; its antenna handles the RF exchange. The library requests a new card,
  selects it and exposes its UID. Card halt and crypto cleanup finish the transaction.
applications:
- Classroom object identification
- SPI communication practice
- Non-security inventory prototype
troubleshooting:
- problem: Version 00 or FF
  cause: Missing power, wrong SPI pins or unsoldered header.
  fix: Disconnect power; trace 3.3 V, GND and every named signal. Check the actual module schematic.
- problem: Reader responds but no UID
  cause: Wrong tag protocol or poor antenna coupling.
  fix: Use a known Type A test card, short wires and avoid metal beside the antenna. No universal read distance
    is promised.
- problem: No repeat UID while held still
  cause: The example halts the selected card.
  fix: Remove and present it again; transaction handling is deliberate.
faqs:
- question: Can the SDA pin use an I2C scanner?
  answer: Not in this SPI-configured example. SDA means SS/NSS here; another interface needs different hardware
    configuration and software.
- question: Can a UID safely unlock a real door?
  answer: UIDs can be copied or changed on some tags. This is a reading demonstration, not secure authentication.
