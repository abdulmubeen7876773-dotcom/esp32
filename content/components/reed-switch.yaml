  steps:
  - Disconnect USB; check continuity with and without the magnet to confirm a normally open contact.
  - Connect the two terminals as shown, without bending against the glass seal.
  - Upload the sketch and move/align the magnet slowly; observe contact state rather than assuming a detection
    distance.
  - Mount only after deciding which physical lid position should mean open or closed.
library: No additional library; Arduino-ESP32 GPIO and millis
output: Serial reports OPEN or CLOSED after a state stays unchanged for 30 ms. It prints changes rather than
  repeating every loop. For this normally open assumption, a correctly aligned nearby magnet closes the switch.
  Do not equate CLOSED with lid-closed until the mounting is checked.
how_it_works: Mechanical contacts may bounce. Each raw change restarts a timer; the code accepts a state only
  after the quiet window. The starting 30 ms value can be adjusted for the actual contact/cable and response
  requirements. Magnet alignment and switch type matter more than a guessed distance.
applications:
- Mailbox lid sensing
- Magnetic cabinet contact
- Low-voltage position experiment
troubleshooting:
- problem: Always OPEN
  cause: Magnet alignment, broken lead or unsuitable contact type.
  fix: Check continuity with power disconnected and try another magnet orientation; identify the actual switch.
- problem: Always CLOSED
  cause: Shorted wiring or normally closed contact.
  fix: Remove the magnet and isolate the switch; check its type and breadboard rows.
- problem: Repeated changes
  cause: Contact chatter, vibration or noisy long wires.
  fix: Check mounting, use short wires and adjust the stable window; review external pull-up/protection for
    long cables.
faqs:
- question: Does a reed switch need 5 V?
  answer: A bare dry contact does not. This example only closes a 3.3 V GPIO input to ground; electronic reed
    modules need their own documentation.
- question: Can it switch a motor directly?
  answer: Do not use this unknown part as a power switch. Select contacts/driver/protection for the actual
    load; this page covers sensing only.
- question: Does LOW mean the mailbox is open?
  answer: LOW means this contact is closed. Which lid position closes it depends on magnet mounting.
