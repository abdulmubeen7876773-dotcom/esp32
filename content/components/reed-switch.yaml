eli12: 'A magnet moves contacts inside a sealed reed switch. In the assumed normally open type, the contact
  closes near a suitably aligned magnet and opens when the magnet moves away.


  The switch does not need a sensor supply pin. Connect it between GPIO33 and GND, with INPUT_PULLUP holding
  the open input HIGH. LOW means contact closed, not necessarily “door open”: mounting determines the meaning.'
electrical:
  supply: No active supply; a dry contact connects GPIO33 to GND.
  signal: 3.3 V GPIO input held HIGH by INPUT_PULLUP; closed contact reads LOW.
  protection: Use only a low-voltage sensing circuit; no mains or motor load. Handle glass/leads without stressing
    the seal.
  basis: Littelfuse reed-switch documentation plus Espressif GPIO API; unknown part ratings remain unspecified.
specs:
- name: Contact assumption
  value: Two-terminal normally open
  why: Check with a meter; other reed types exist.
- name: GPIO
  value: GPIO33 on classic ESP32
  why: Has an internal pull-up; same sensing GPIO as the mailbox project.
- name: Open / closed state
  value: HIGH / LOW
  why: Magnet mounting determines door/lid meaning.
- name: Debounce
  value: 30 ms starting window
  why: An example software setting, not a measured bounce specification.
- name: Contact/load rating
  value: Unspecified
  why: This low-current input is not authorization to switch power loads.
pinout:
- pin: Terminal A
  role: Dry contact
  connects: GPIO33
  note: Either lead of an unpolarized bare contact can be A; do not infer behavior from artwork.
- pin: Terminal B
  role: Dry contact return
  connects: ESP32 GND
  note: Closing the contact grounds the input.
- pin: Pull-up
  role: Defined open state
  connects: INPUT_PULLUP on GPIO33
  note: For long/noisy cables use a documented external pull-up and suitable input protection; do not connect
    a 5 V pull-up.
