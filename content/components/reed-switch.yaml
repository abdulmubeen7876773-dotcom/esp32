setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with these GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.x (API review baseline 3.3.2, not a latest-version claim). Select the exact board
      or ESP32 Dev Module for a generic WROOM board. Other ESP32 families need their own pin map. Serial Monitor:
      115200 baud.'
  - label: Hardware assumption
    value: A two-terminal, normally open dry-contact reed switch plus a magnet. Exact model/contact rating
      and operating distance are unspecified; verify your own part. Normally closed and changeover types need
      different assumptions.
  - label: Prerequisites and parts
    value: First complete Arduino IDE setup and Blink. Reed switch, magnet, breadboard and short wires; a continuity
      meter is useful for identifying contact behavior.
  - label: Expected result
    value: After a stable 30 ms sample window, Serial prints CLOSED when the contact closes and OPEN when it
      opens. Magnet distance is not specified.
  - label: Verification status
    value: Reviewed against the technical references below. Not compiled for an ESP32 or tested on hardware
      in this update. The approved product-style illustration identifies the family; follow documented terminal
      labels and the logical wiring diagram, not its rendered pin positions.
