code:
  title: Stable magnetic-contact state
  filename: reed_switch_esp32.ino
  wiring: Normally open reed contact between GPIO33 and GND; INPUT_PULLUP defines HIGH when open. No 5 V connection
    or additional sensor power pin.
  content: "#include <Arduino.h>\nconstexpr uint8_t CONTACT_PIN = 33;\nconstexpr uint32_t DEBOUNCE_MS = 30;\
    \ // Starting value; adjust for actual contacts.\nint lastRaw = HIGH;\nint stableState = -1;\nuint32_t\
    \ changedAt = 0;\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(CONTACT_PIN, INPUT_PULLUP);\n  lastRaw\
    \ = digitalRead(CONTACT_PIN);\n  changedAt = millis();\n}\nvoid loop() {\n  int raw = digitalRead(CONTACT_PIN);\n\
    \  uint32_t now = millis();\n  if (raw != lastRaw) { lastRaw = raw; changedAt = now; }\n  if (now - changedAt\
    \ >= DEBOUNCE_MS && raw != stableState) {\n    stableState = raw;\n    Serial.println(stableState == LOW\
    \ ? \"CLOSED\" : \"OPEN\");\n  }\n  delay(1);\n}\n"
  notes: The first reported state also waits for the stable window. Unsigned millis subtraction handles rollover.
    This is a polling demonstration, not the mailbox deep-sleep wake algorithm.
