eli12: |-
  An H-bridge reverses current through a motor. ENA disables bridge A independently of its two direction inputs. With ENA enabled, opposite input levels drive opposite directions; disabling ENA leaves the outputs inactive for a coast stop.

  The L298 is a bipolar driver with appreciable voltage loss and heating. Its chip limits are not the continuous safe ratings of an unidentified board. For a small battery-powered robot, a suitable modern MOSFET driver may waste less power; verify that alternative separately.
electrical:
  supply: 'Example motor rail: external 6 V; logic rail: regulated 5 V through a board-documented external-input
    configuration. Never power the motor from ESP32 3.3 V or GPIO.'
  signal: L298 chip IN/EN HIGH threshold is 2.3 V minimum; 3.3 V control is suitable only if the board has no conflicting
    5 V pull-ups or interface. Common ground required.
  protection: Disable the onboard regulator only by the exact board instructions before applying external logic
    power. Remove any documented ENA-to-5 V jumper before GPIO control. Add 10 kiloohm IN1/IN2/ENA pull-downs; qualify
    protection, supply current and temperature.
  basis: ST L298 datasheet establishes chip behavior; the exact module schematic remains mandatory.
