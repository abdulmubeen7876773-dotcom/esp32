troubleshooting:
- problem: Motor does not turn
  cause: ENA disabled, missing logic rail, supply current limit or driver voltage drop.
  fix: Check terminal voltages and configuration against the board schematic with motor power disconnected first.
    Do not raise supply above motor ratings to compensate blindly.
- problem: ESP32 resets when motor starts
  cause: Supply droop, motor noise or poor ground routing.
  fix: Keep motor current out of ESP32 supply paths; use documented decoupling and suitable separate rails.
- problem: Driver heats quickly
  cause: Excess load/current, short or inadequate heatsink.
  fix: Disconnect. Check motor stall current and board thermal ratings; reduce load or select a more appropriate
    driver.
- problem: Motor moves at startup
  cause: ENA pull-down missing or still tied to 5 V.
  fix: Power off; check the enable jumper/interface and external pull-down before another attempt.
faqs:
- question: Is the picture a pinout?
  answer: No. Its dual-chip layout is illustrative and not a documented module. Use the schematic and terminal labels
    of the actual purchased board.
- question: Can I use the board 5 V terminal to power ESP32?
  answer: Not assumed here. It may be a regulator output or logic input depending on board/jumpers. ESP32 stays
    on its own USB supply; only grounds are shared.
- question: Does this cover a two-motor robot unchanged?
  answer: No. It tests bridge A only; bridge B is disabled. The linked robot has a different pin map and requires
    its own verified enable and power design.
