setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with the specified unused GPIOs exposed; Arduino IDE 2.x and Arduino-ESP32
      3.x. Other families require their own pin map. Serial Monitor: 115200 baud. No extra library.'
  - label: Supported hardware
    value: A documented L298N breakout exposing ENA, IN1, IN2, OUT1/OUT2, motor supply, logic supply and ground.
      It must include correctly rated flyback diodes, decoupling, heatsinking and sense connections. The illustrated
      dual-chip board is not a verified breakout or pin map.
  - label: Prerequisites and parts
    value: IDE setup; verified module schematic; documented low-current 6 V brushed motor; current-limited external
      6 V motor supply and regulated 5 V logic supply; three 10 kiloohm pull-downs. Motor starting/stall current,
      voltage drop and thermal limits must fit the actual board. Secure the motor with no attached load.
  - label: Expected result
    value: Motor turns one way for one second, coasts for two seconds, then turns the other way. ENA stays LOW at
      startup and between changes. Rotation direction depends on motor lead order; never stall it for testing.
  - label: Verification limits
    value: Documentation and automated content/browser checks only in this update. No ESP32 compilation or physical
      hardware testing. The approved image depicts a component family; it does not authenticate a model, rating
      or terminal order.
