code:
  title: One motor, disabled before reversal
  filename: l298n_motor_driver_esp32.ino
  wiring: 'Verified module: ENA/IN1/IN2 → GPIO25/26/27 with 10 kiloohm pull-downs; motor → OUT1/OUT2; separate 6
    V motor and 5 V logic supplies; shared ground.'
  content: |
    #include <Arduino.h>
    constexpr uint8_t ENA = 25, IN1 = 26, IN2 = 27;
    void coast() {
      digitalWrite(ENA, LOW);
      digitalWrite(IN1, LOW);
      digitalWrite(IN2, LOW);
    }
    void runMotor(bool reverse) {
      coast();
      digitalWrite(IN1, reverse ? LOW : HIGH);
      digitalWrite(IN2, reverse ? HIGH : LOW);
      digitalWrite(ENA, HIGH);
    }
    void setup() {
      pinMode(ENA, OUTPUT);
      digitalWrite(ENA, LOW);
      pinMode(IN1, OUTPUT);
      pinMode(IN2, OUTPUT);
      coast();
      Serial.begin(115200);
      Serial.println("Disabled at startup; unloaded low-voltage motor only.");
      delay(2000);
    }
    void loop() {
      Serial.println("Direction A");
      runMotor(false);
      delay(1000);
      coast();
      Serial.println("Coast");
      delay(2000);
      Serial.println("Direction B");
      runMotor(true);
      delay(1000);
      coast();
      Serial.println("Coast");
      delay(2000);
    }
  notes: Coast is not braking or guaranteed standstill. Increase the off interval for actual inertia; never reverse
    a still-spinning loaded motor with this demonstration. Software does not replace pull-downs or protection.
library: Arduino-ESP32 3.x; no additional library
output: Motor turns one way for one second, coasts for two seconds, then turns the other way. ENA stays LOW at startup
  and between changes. Rotation direction depends on motor lead order; never stall it for testing.
how_it_works: Direction changes occur while ENA is LOW, after a coast interval. The example provides no closed-loop
  speed control, current sensing or fault handling. A stopped sketch cannot guarantee a safe motor; external enable
  bias, current limiting and an accessible power disconnect are required. Do not interpret a nominal chip current
  figure as a safe module operating current.
