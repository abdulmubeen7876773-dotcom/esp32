  ],
  "how_it_works": "The supported STEMMA input is active HIGH: GPIO26 HIGH commands ON, and LOW commands OFF. A 10 kΩ Signal-to-GND resistor helps keep it OFF while the ESP32 pin is high impedance. Firmware sets OFF before starting its slow toggle.\n\nOther relay boards can have different supply voltages, input thresholds, pull-ups, polarity and jumper arrangements. A coil marking alone does not establish GPIO compatibility. Before substitution, find the exact board schematic and documentation, establish its input voltage/current limits and OFF state, and select a suitable driver interface if needed. Never connect a 5 V-pulled input directly to ESP32 GPIO. Do not guess by trying opposite polarity.\n\nMechanical contacts are unsuitable for fast PWM. Motors and solenoids additionally need load-specific protection and contact ratings; they are outside this LED example. Module contact separation is not a certification of an assembled circuit or permission to wire mains.",
  "specs": [
    {
      "name": "Supported input",
      "value": "STEMMA 4409: active HIGH, 3–5 V signal",
      "why": "ESP32 supplies a 3.3 V command; this does not apply to generic relay boards."
