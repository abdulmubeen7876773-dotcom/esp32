  "faqs": [
    {
      "question": "Does the photo establish which relay I have?",
      "answer": "No. It is a generic illustration of the category. The example names the supported STEMMA 4409 board; use its manufacturer documentation and actual terminal labels."
    },
    {
      "question": "Can I reuse this sketch with an active-LOW relay?",
      "answer": "Not unchanged. Verify the exact supply, input circuit and OFF state first, and design any required interface. Changing constants alone cannot establish electrical compatibility."
    },
    {
      "question": "How do I check COM, NO and NC?",
      "answer": "Disconnect the load battery before using a continuity meter. With the relay de-energized, COM–NC should be closed and COM–NO open. Do not use continuity mode on a powered load circuit."
    },
    {
      "question": "Is common ground required?",
      "answer": "ESP32 ground and the relay control-supply negative are shared in this example. The separate battery/LED contact circuit does not need to share that ground."
    },
    {
      "question": "Can I drive a bare coil or use PWM?",
      "answer": "Do not power a coil from GPIO. This supported module includes its driver; mechanical contacts are unsuitable for fast PWM."
    },
    {
      "question": "Does this cover mains wiring?",
      "answer": "No. This tutorial covers only a separate 3 V battery LED load and does not establish mains safety, certification or fail-safe operation."
    }
