  "library": "Built-in Arduino digitalWrite",
  "code": {
    "title": "Arduino: supported active-HIGH relay test",
    "filename": "relay_stemma_led_test.ino",
    "content": "#include <Arduino.h>\n\n// Adafruit STEMMA Non-Latching Mini Relay 4409 only: active HIGH.\nconstexpr uint8_t RELAY_PIN = 26;\nconstexpr uint8_t RELAY_ON = HIGH;\nconstexpr uint8_t RELAY_OFF = LOW;\n\nvoid setup() {\n  pinMode(RELAY_PIN, OUTPUT);\n  digitalWrite(RELAY_PIN, RELAY_OFF);\n  Serial.begin(115200);\n  Serial.println(\"Relay OFF. Low-voltage LED load only.\");\n  delay(2000);  // Observe the initial OFF command before the first toggle.\n}\n\nvoid loop() {\n  digitalWrite(RELAY_PIN, RELAY_ON);\n  Serial.println(\"Relay ON\");\n  delay(2000);\n  digitalWrite(RELAY_PIN, RELAY_OFF);\n  Serial.println(\"Relay OFF\");\n  delay(2000);\n}\n",
    "notes": "Complete Arduino sketch; no third-party library is required. ESP-IDF and PlatformIO alternatives are deferred rather than presented as working examples. OFF is LOW for this supported board only. The external pull-down covers the high-impedance startup interval; software alone does not establish safe power sequencing."
  },
  "output": "After reset the command is OFF for two seconds. Relay ON and Relay OFF then print alternately every two seconds. With the separate LED battery connected, the red LED lights during ON and goes dark during OFF. A click alone is not proof that the load circuit is correctly wired.",
