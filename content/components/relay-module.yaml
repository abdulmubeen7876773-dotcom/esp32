  "eli12": "A relay uses a coil to move a mechanical contact. A driver module lets a GPIO command the coil without powering it from the pin. The control supply and the load supply do different jobs.\n\nCOM connects to NC with the supported relay de-energized. Energizing it connects COM to NO. Using NO makes this LED load off when the coil is off; it does not make a circuit fail-safe if contacts weld or software fails.",
