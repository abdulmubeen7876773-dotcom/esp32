setup:
  items:
  - label: Board
    value: Classic ESP32-WROOM-32 DevKit with GPIO4 available. Select ESP32 Dev Module for an otherwise undocumented
      generic WROOM board; use an exact supported profile when known.
  - label: Sensor
    value: Bare four-pin DHT22/AM2302 package or a verified 3.3 V-compatible breakout. Vendor and module pin
      order are unspecified; follow its labels and documentation.
  - label: Software
    value: 'Arduino IDE 2.x; esp32 by Espressif Systems 3.x (API review baseline 3.3.2). Serial Monitor: 115200
      baud. Install DHT sensor library by Adafruit (API reference 1.4.6) and its Adafruit Unified Sensor dependency
      using Library Manager.'
  - label: Parts
    value: USB data cable, short jumper wires, breadboard and 10 kΩ DATA-to-3.3 V pull-up for a bare sensor.
      Check whether a breakout already includes that resistor.
  - label: Expected result
    value: One temperature/humidity line about every 2.5 seconds, or a clear failed-read message. Documentation/API
      reviewed; not compiled or hardware tested.
