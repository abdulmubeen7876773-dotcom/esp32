faqs:
- question: Can I change DHT22 to DHT11 in code?
  answer: Only when the hardware is DHT11. Choose the constructor type for the actual part and follow its voltage
    and timing documentation.
- question: Does every DHT22 module include a pull-up?
  answer: No. Verify the breakout schematic or unpowered resistance. The bare sensor circuit here needs 10
    kΩ from DATA to 3.3 V.
- question: Can this read pressure?
  answer: No. DHT22 reports temperature and relative humidity. Use a pressure sensor such as BME280 for pressure.
