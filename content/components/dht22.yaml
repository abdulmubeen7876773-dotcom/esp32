slug: dht22
name: 'DHT22 with ESP32: Wiring, Readings and Troubleshooting'
category: Sensors
difficulty: Beginner
icon: 🌡
image: /assets/visuals/components/photos/dht22-photo.webp
summary: Read air temperature and humidity with a DHT22 on ESP32. Identify bare sensors and modules, wire a
  3.3 V data pull-up, and diagnose failed readings.
date_modified: '2026-10-08'
experience_required: Basic Arduino upload, breadboard wiring, and Serial Monitor
applications:
- Room comfort monitor
- ESP32 weather station
- Greenhouse humidity monitor
- Smart thermostat input
- Classroom environmental data logger
- Fan or ventilation trigger
eli12: 'DHT22 measures air temperature in °C and relative humidity in % RH. It does not measure pressure. Choose
  it for slow indoor comfort logging or a classroom sensor build. For pressure too, consider BME280. Neither
  sensor is a weatherproof enclosure or a calibrated laboratory instrument.


  DHT22 normally offers a wider temperature/humidity range and finer readings than the older DHT11 models described
  by Adafruit. DHT11 is useful when you already own one and only need a basic room demonstration. Match the
  library sensor type to the actual part; similar wiring does not make the two interchangeable in code.'
how_it_works: 'The sensor exchanges timed pulses on DATA; this is not I2C and not the Dallas OneWire protocol.
  The library checks the response and returns temperature and humidity. A failed checksum or timeout produces
  NaN.


  Adafruit describes older DHT11 parts as 0–50 °C and 20–80% RH with coarser accuracy, versus a wider range
  for its DHT22. DHT11 revisions and modules differ, so consult the actual datasheet. Our historical /guides/read-temperature-dht22.html
  quick build now deliberately uses DHT11 and a DHT11 video; it is labeled that way in the links below.


  The library limits both sensor types to one new cached measurement per 2 seconds. Updating the screen faster
  does not make the sensor sample faster. Avoid breathing directly on it when comparing readings; nearby heat
  and moisture affect local air conditions.'
specs:
- name: Measurements
  value: Temperature (°C) and relative humidity (% RH)
  why: Relative humidity depends on temperature; keep the sensor away from ESP32/regulator heat.
- name: Supply in this example
  value: 3.3 V
  why: Aosong’s linked DHT22 datasheet specifies 3.3–6 V; Adafruit’s product guidance specifies 3–5 V. Use
    3.3 V here and verify your exact sensor/module rating.
- name: DATA signal
  value: Pull up to 3.3 V, never 5 V into ESP32
  why: A module powered at 5 V may pull DATA to 5 V. This example uses 3.3 V throughout; verify module circuitry.
- name: Pull-up
  value: 10 kΩ from DATA to 3.3 V for short breadboard wiring
  why: Adafruit shows 10 kΩ. A verified breakout may already have it; the weak ESP32 internal pull-up is not
    a substitute for the specified circuit.
- name: Sampling
  value: 2.5 seconds in this sketch
  why: Aosong asks for more than 2 seconds between samples. The library’s cache minimum is 2000 ms; the sketch
    waits 2500 ms, including before its first read.
- name: Published DHT22 range
  value: −40 to 80 °C; 0–100% RH
  why: Adafruit product guidance, not a promise for every module or operation under condensation.
- name: Published accuracy
  value: ±0.5 °C; 2–5 percentage points RH
  why: Adafruit product guidance. Decimal resolution does not establish calibration or guaranteed accuracy
    for your sensor.
pinout:
- pin: '1: VCC'
  role: Bare sensor power
  connects: 3.3 V
  note: For the standard bare package, face the vented front toward you with leads pointing down; count left
    to right. Verify the part datasheet before power.
- pin: '2: DATA'
  role: Bidirectional digital signal
  connects: GPIO4 and 10 kΩ to 3.3 V
  note: 'Do not use an input-only GPIO: the host must drive DATA low to start a read.'
- pin: '3: NC'
  role: No connection
  connects: Leave disconnected
  note: Bare four-pin package only; not a ground pin.
- pin: '4: GND'
  role: Ground
  connects: ESP32 GND
  note: Three-pin breakouts can reorder +, DATA/OUT/S and −. Follow printed labels, not this bare-package order.
wiring:
  illustration_alt: 'Logical DHT22 wiring: VCC to 3.3 V, DATA to GPIO4 with a 10 kΩ pull-up to 3.3 V, NC disconnected
    and GND shared. Standard bare package viewed from its vented front; physical ESP32 header positions vary.'
  image: /assets/visuals/components/wiring/dht22-wiring.svg
  summary: 'Bare sensor: vented front facing you, leads down, pins 1–4 run VCC, DATA, NC, GND from left to
    right for the standard package. A three-pin breakout is a different assembly: follow its VCC/+/DATA/OUT/S/GND/−
    labels.


    Use 3.3 V supply and a DATA pull-up to 3.3 V. Check module documentation or unpowered resistance between
    DATA and VCC before adding a duplicate pull-up. Never assume an onboard resistor goes to a safe voltage.
    Keep leads short and unplug USB before changing wiring.'
  table_columns:
  - DHT22 Pin
  - ESP32 Connection
  - Purpose / Notes
  table_rows:
  - component_pin: VCC / + (bare pin 1)
    esp32_pin: 3.3 V
    notes: Verify module supports 3.3 V supply.
  - component_pin: DATA / OUT / S (bare pin 2)
    esp32_pin: GPIO4
    notes: 10 kΩ to 3.3 V on bare sensor; verify module pull-up.
  - component_pin: NC (bare pin 3)
    esp32_pin: Not connected
    notes: Not exposed on many three-pin breakouts.
  - component_pin: GND / − (bare pin 4)
    esp32_pin: GND
    notes: Common signal reference.
  steps:
  - Disconnect USB and identify the actual package/module labels.
  - Wire supply, ground and DATA as listed; add the bare-sensor pull-up.
  - Reconnect USB, install the libraries and upload the DHT22 sketch.
  - Open Serial Monitor at 115200 baud and wait at least 2 seconds.
library: DHT sensor library by Adafruit plus Adafruit Unified Sensor
code:
  title: DHT22 on GPIO4
  filename: esp32_dht22_readings.ino
  wiring: Use the 3.3 V wiring above. This example uses DHT22, not DHT11.
  content: "#include <DHT.h>\n\nconstexpr uint8_t DHT_PIN = 4;\nDHT dht(DHT_PIN, DHT22);\n\nvoid setup() {\n\
    \  Serial.begin(115200);\n  dht.begin();\n}\n\nvoid loop() {\n  delay(2500);\n  float humidity = dht.readHumidity();\n\
    \  float temperature = dht.readTemperature();\n  if (isnan(humidity) || isnan(temperature)) {\n    Serial.println(\"\
    DHT22 read failed: check wiring, pull-up and sensor type.\");\n    return;\n  }\n  Serial.print(\"Temperature:\
    \ \");\n  Serial.print(temperature, 1);\n  Serial.print(\" C | Humidity: \");\n  Serial.print(humidity,\
    \ 1);\n  Serial.println(\" % RH\");\n}"
  notes: The temperature call uses the same cached measurement as the humidity call. Do not force faster reads.
    This blocking delay is adequate for this isolated demonstration; a larger project can schedule reads with
    millis().
output: 'Illustrative output, not a measured result: Temperature: 23.4 C | Humidity: 48.2 % RH. Your room determines
  the values; they need not change on every line. NaN means an invalid read, not 0 °C. Keep the sensor away
  from condensation and let it settle after moving it.'
troubleshooting:
- problem: Read failed / NaN
  cause: Incorrect wiring, missing pull-up, wrong DHT type or damaged sensor.
  fix: Unplug USB, verify package orientation and DATA GPIO4, check 3.3 V supply/shared GND and the 10 kΩ pull-up.
    Use DHT22 in the constructor and short leads.
- problem: 'DHT.h: No such file'
  cause: Adafruit DHT library is absent or installed into a different IDE environment.
  fix: Install DHT sensor library by Adafruit in Library Manager and accept Adafruit Unified Sensor. Reopen
    the sketch and compile again.
- problem: Values repeat
  cause: Read caching or slowly changing room conditions.
  fix: Keep at least 2 seconds between samples. Repeated values are normal; do not force reads faster to seek
    variation.
- problem: Temperature too warm / humidity unexpected
  cause: Nearby regulator heat, enclosure airflow, condensation or an uncalibrated part.
  fix: Move the sensor away from heat, allow settling time and compare in the same air conditions. Do not infer
    precision from one decimal place.
- problem: Bare package order differs from module
  cause: Breakout manufacturer rearranged the header.
  fix: Follow your module labels and schematic. Do not transfer the bare four-pin left-to-right sequence to
    a three-pin board.
