setup:
  items:
  - label: Board and software
    value: Low-voltage bench setup as specified below. ESP32 is optional for passive exercises. Coded examples require
      classic ESP32-WROOM-32/32E DevKit, unused exposed pins, Arduino IDE 2.x and Arduino-ESP32 3.3.2 (review baseline,
      not a latest-release claim). Other families need their own pin map.
  - label: Supported hardware
    value: 'Approved generic SD card adapter illustration; regulator and level shifting unverified. Worked reference:
      Adafruit MicroSD SPI/SDIO breakout 4682, a 3 V-only board, used in SPI mode.'
  - label: Prerequisites and parts
    value: Classic WROOM DevKit, documented reference breakout, spare FAT32 card prepared on a computer with /hello.txt
      and short wires. Back up data; power off before inserting/removing or rewiring.
  - label: Libraries
    value: Arduino-ESP32 3.3.2 built-in SD, FS and SPI; no separately installed generic SD library.
  - label: Expected result
    value: Serial prints up to 256 bytes of /hello.txt or a clear mount/file error; the sketch does not format or
      write the card.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
related_components:
- title: ESP32 DevKit power and pins
  href: /components/esp32-devkit.html
  description: Check board labels, supply rails and GPIO restrictions.
eli12: 'A microSD socket carrier exposes the card through SPI or another supported interface. A module marked 5V
  may include a regulator, level shifters, both or neither; the illustration cannot establish its circuit.


  This example uses a documented 3 V-only reference and explicit SPI pins. Card power and signals stay in the 3.3
  V domain. Other carriers can change labels, pull-ups and timing. The card must be formatted compatibly before
  the test; mounting is not formatting.'
electrical:
  supply: Reference 4682 at 3.3 V only; never 5 V. Verify regulator capacity/decoupling for card bursts on actual
    board.
  signal: SPI clock/data/CS in 3.3 V domain. Generic adapter supply label does not prove level compatibility.
  protection: Common ground and short wires; power off for insertion/removal. No unknown 5 V pull-ups or shared
    positive supplies.
specs:
- name: SPI assignment
  value: SCK18, MISO19, MOSI23, CS27
  why: Unused exposed WROOM pins required.
- name: Test clock
  value: 1 MHz
  why: Conservative starting value, not guaranteed performance.
- name: Test file
  value: /hello.txt on prepared FAT32
  why: Read only; at most 256 bytes printed.
