code:
  title: Read a prepared text file without writing
  filename: microsd_card_module.ino
  wiring: Reference3.3 V/GND, CLK18, SO19, SI23, CS27; other pins unconnected.
  content: "#include <Arduino.h>\n#include <SPI.h>\n#include <SD.h>\n#include <FS.h>\nconstexpr uint8_t CARD_CS\
    \ = 27;\nvoid setup() {\n  Serial.begin(115200);\n  SPI.begin(18, 19, 23, CARD_CS);\n  if (!SD.begin(CARD_CS,\
    \ SPI, 1000000)) {\n    Serial.println(\"SD mount failed: check power, wiring and prepared card\"); return;\n\
    \  }\n  if (SD.cardType() == CARD_NONE) { Serial.println(\"No card detected\"); SD.end(); return; }\n  File\
    \ file = SD.open(\"/hello.txt\", FILE_READ);\n  if (!file || file.isDirectory()) {\n    Serial.println(\"Missing\
    \ /hello.txt or not a file\");\n    if (file) file.close();\n    SD.end(); return;\n  }\n  Serial.println(\"\
    First up to 256 bytes of /hello.txt:\");\n  for (uint16_t count = 0; count < 256 && file.available(); ++count)\
    \ {\n    const int value = file.read();\n    if (value < 0) { Serial.println(\"Read error\"); break; }\n   \
    \ Serial.write(static_cast<uint8_t>(value));\n  }\n  Serial.println(); file.close(); SD.end();\n}\nvoid loop()\
    \ { delay(1000); }\n"
  notes: Pinned 3.3.2 SD.begin uses format_if_empty=false by default. This sketch reads once at startup; reset after
    changing a file with power removed. It does not prove sustained write performance or data integrity.
output: A supported prepared card should mount and print the first up to 256 bytes. A missing file is distinct from
  a failed mount. No automatic formatting, logging or filesystem repair occurs.
how_it_works: SPI assigns separate clock, input, output and chip-select pins; SO/MISO is from the card perspective.
  The ESP32 SD wrapper mounts the filesystem and opens one file read-only. Power interruptions during other applications
  writes can corrupt data; this simple reader is not a power-loss-safe logger.
applications:
- Reading configuration or text from a prepared card
- Checking SPI wiring before building a logger
troubleshooting:
- problem: Mount failed
  cause: Wrong labels, supply/burst current, format or unsuitable carrier.
  fix: Check actual schematic, short wires and spare supported FAT32 card; do not autoformat valuable data.
- problem: File missing
  cause: Name/path differs or card prepared incorrectly.
  fix: Verify root hello.txt on computer, then power off before moving card.
- problem: Intermittent reads
  cause: Poor contact, long wires or marginal power.
  fix: Review power/decoupling and connections; do not assume faster clock fixes it.
faqs:
- question: Can a 5V-labelled module connect directly?
  answer: Only after verifying its actual signal/level-shifting circuit; the label is insufficient.
- question: Does mount create a filesystem?
  answer: Not in this example. Prepare a compatible card separately.
