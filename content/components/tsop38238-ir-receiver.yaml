code:
  title: Receive and print decoded frames
  filename: tsop38238_ir_receiver.ino
  wiring: Pin1 OUT to GPIO27, pin2 GND to GND, pin3 VS to 3.3 V; 100 nF across VS/GND.
  content: "#include <Arduino.h>\n#include <IRremote.hpp>\nconstexpr uint8_t IR_PIN = 27;\nvoid setup() {\n  Serial.begin(115200);\n\
    \  IrReceiver.begin(IR_PIN, DISABLE_LED_FEEDBACK);\n  Serial.println(\"Aim a compatible 38 kHz remote and press\
    \ a key\");\n}\nvoid loop() {\n  if (IrReceiver.decode()) {\n    IrReceiver.printIRResultShort(&Serial);\n \
    \   IrReceiver.resume();\n  }\n}\n"
  notes: Feedback is disabled so no onboard LED is assumed. Resume reception after each frame. Test alone before
    adding code that blocks interrupts and interferes with timing.
output: Supported protocols produce decoded fields, not a universal button number. UNKNOWN need not mean a defective
  receiver. Repeated frames while holding a key are normal for many remotes.
how_it_works: The receiver removes the optical carrier. IRremote samples the envelope with a timer and attempts
  supported decoders. Bright illumination and supply noise can reduce reception.
applications:
- Remote-controlled low-voltage indicator
- Protocol exploration
- Alternative input to a push button
troubleshooting:
- problem: Nothing prints after startup
  cause: Wrong lead order, remote batteries or carrier mismatch.
  fix: Recheck the package view and 3.3 V; try a known 38 kHz remote close to the receiver.
- problem: UNKNOWN or unreliable frames
  cause: Protocol mismatch, strong illumination or timing noise.
  fix: Shade the receiver, check bypassing and short wires; test without interrupt-blocking additions.
- problem: Legacy sketch will not compile
  cause: Old IRremote API mixed with version 4.4.1.
  fix: Use IRremote.hpp and IrReceiver begin/decode/resume; confirm the selected library version.
faqs:
- question: Does a held button keep OUT LOW?
  answer: The remote sends pulse frames. Decode them rather than treating OUT as a mechanical switch.
- question: Do all three-pin IR receivers share this order?
  answer: No. This diagram is for the documented TSOP38238 package; check your actual part or module.
