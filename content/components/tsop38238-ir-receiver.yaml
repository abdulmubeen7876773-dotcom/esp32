  description: Check board labels, supply rails and GPIO restrictions.
eli12: 'The receiver filters infrared bursts near 38 kHz and outputs their envelope as active-LOW pulses. It is
  not a raw photodiode, obstacle sensor or transmitter. A protocol decoder interprets the pulse pattern.


  Use a known compatible remote first. Decoding depends on protocol, lighting and placement; the artwork cannot
  establish the authenticity of a physical part.'
electrical:
  supply: 3.3 V to VS here; documented operating range 2.0–5.5 V.
  signal: OUT to GPIO27; powering at 3.3 V references the output to the ESP32 logic rail.
  protection: Do not use 5 V supply with OUT directly attached to ESP32. Fit 100 nF near VS/GND; assess extra filtering
    for noisy supplies.
  basis: Vishay TSOP382.. datasheet and IRremote 4.4.1.
specs:
- name: Carrier
