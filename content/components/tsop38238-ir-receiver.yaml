slug: tsop38238-ir-receiver
name: 'TSOP38238 IR Receiver: Decode a Remote with ESP32'
category: Input Devices
difficulty: Beginner
summary: Power a documented TSOP38238 at 3.3 V and decode a compatible 38 kHz remote on GPIO27. Follow the manufacturer
  pin drawing, not the illustration.
