slug: veml6075-uv-sensor
name: 'VEML6075 UV Sensor: UVA, UVB and Estimated UV Index'
category: Sensors
difficulty: Beginner
summary: Read compensated UVA/UVB counts and an estimated UV index with a documented 3.3 V I2C setup. Do not treat
  the module as a calibrated exposure instrument.
