setup:
  items:
  - label: Board and software
    value: Low-voltage bench setup as specified below. ESP32 is optional for passive exercises. Coded examples require
      classic ESP32-WROOM-32/32E DevKit, unused exposed pins, Arduino IDE 2.x and Arduino-ESP32 3.3.2 (review baseline,
      not a latest-release claim). Other families need their own pin map.
  - label: Supported hardware
    value: 'Approved VEML6075-labelled illustration, exact carrier unverified. Worked reference: Adafruit VEML6075
      breakout powered at 3.3 V; use its documented labels, not artwork pin positions.'
  - label: Prerequisites and parts
    value: Classic WROOM DevKit, documented reference breakout and short wires. GPIO21 SDA / GPIO22 SCL exposed
      and unused. I2C scanner can check response, not prove identity.
  - label: Libraries
    value: Adafruit VEML6075 Library 2.2.2 and its Adafruit BusIO dependency; Arduino-ESP32 3.3.2 Wire. Install
      dependencies through Library Manager.
  - label: Expected result
    value: Serial prints compensated UVA/UVB counts and estimated UV index; initialization failure is reported instead
      of invented readings.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
related_components:
- title: ESP32 DevKit power and pins
  href: /components/esp32-devkit.html
  description: Check board labels, supply rails and GPIO restrictions.
eli12: 'VEML6075 measures two ultraviolet bands and compensation channels. The library converts them to compensated
  UVA/UVB counts and an estimated UV index using coefficients. Counts are not watts per square meter; the estimate
  depends on optical conditions and calibration.


  The approved marking supports the sensor family, not a verified carrier circuit. The bare sensor and breakout
  have different supply provisions. This example uses the documented Adafruit board at 3.3 V so bus pull-ups are
  compatible with ESP32. Do not expose yourself to UV lamps to test it; indoor/window-filtered light may give small
  or negative compensated values.


  This is legacy hardware: the reference breakout is listed as no longer stocked. The instructions are for an existing
  documented board, not a claim of current availability.'
electrical:
  supply: Reference breakout VIN at 3.3 V; its regulator output is left disconnected. Bare-chip supply differs;
    follow Vishay datasheet.
  signal: I2C SDA/SCL pull-ups must reach 3.3 V, never 5 V for ESP32. Reference board powered at 3.3 V.
  protection: Common ground. Confirm actual carrier circuit before using a different board; an I2C response does
    not identify the sensor.
specs:
- name: Address
  value: '0x10'
  why: Fixed VEML6075 address; response alone is not identity.
- name: Library output
  value: Compensated counts and estimated UVI
  why: Not calibrated irradiance or a health dosimeter.
- name: Bus
  value: GPIO21 SDA, GPIO22 SCL at 100 kHz
  why: Classic WROOM reference pins only.
