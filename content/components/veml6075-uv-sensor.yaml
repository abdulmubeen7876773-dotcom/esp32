code:
  title: Read UV channels with initialization checks
  filename: veml6075_uv_sensor.ino
  wiring: Adafruit reference VIN3.3 V/GND, SDA21/SCL22; 3v3 unconnected.
  content: "#include <Arduino.h>\n#include <Wire.h>\n#include <Adafruit_VEML6075.h>\n#include <math.h>\nAdafruit_VEML6075\
    \ uv;\nbool ready = false;\nvoid setup() {\n  Serial.begin(115200);\n  Wire.begin(21, 22, 100000);\n  ready\
    \ = uv.begin(VEML6075_100MS, false, false, &Wire);\n  if (!ready) Serial.println(\"VEML6075 init failed: check\
    \ board, power and I2C\");\n}\nvoid loop() {\n  if (!ready) { delay(1000); return; }\n  const float a = uv.readUVA(),\
    \ b = uv.readUVB(), index = uv.readUVI();\n  if (!isfinite(a) || !isfinite(b) || !isfinite(index))\n    Serial.println(\"\
    Invalid UV read; check sensor/bus\");\n  else Serial.printf(\"UVA counts=%.2f UVB counts=%.2f estimated UVI=%.2f\\\
    n\", a, b, index);\n  delay(1000);\n}\n"
  notes: Pinned 2.2.2 begin/read APIs; default library integration and compensation settings. Sequential calls are
    not a guaranteed simultaneous snapshot. Finite checks do not detect every I2C fault or establish calibration.
output: Serial should show numeric compensated channels and estimated UVI under suitable illumination. Indoors,
  low or negative compensated values can occur. No specific value, measured accuracy or sun-exposure advice is promised.
how_it_works: The library subtracts compensation channels from UVA/UVB and applies its UV-index model. Enclosures,
  window glass, angle, contamination and coefficients can change the result. A serial number is not evidence of
  traceable calibration.
applications:
- Comparing documented sensor responses under ordinary light
- Learning I2C initialization and unit qualifications
troubleshooting:
- problem: Initialization fails
  cause: Wrong device/carrier, power or bus wiring.
  fix: Check actual marking and 0x10 response; a scanner does not authenticate identity.
- problem: Very low or negative reading
  cause: Weak UV or compensation/optical conditions.
  fix: Do not clamp away evidence or use UV lamps; review environment and library model.
- problem: Unexpectedly high estimate
  cause: Optical setup/coefficient mismatch or fault.
  fix: Check raw context and documentation; do not use this as a safety instrument.
faqs:
- question: Are UVA counts irradiance?
  answer: No. Library compensated counts and estimated UVI are different quantities.
- question: Can any VEML6075 carrier use 5 V safely?
  answer: No blanket claim. Supply and pull-up circuits must be checked for that board.
