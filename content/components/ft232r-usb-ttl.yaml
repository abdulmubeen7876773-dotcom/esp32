  steps:
  - Upload through DevKit USB before attaching the adapter. Confirm voltage configuration and pin availability.
  - Unplug both devices, wire only TX/RX/GND and check for shorts. Identify separate OS ports by unplugging one
    device at a time.
  - Open both terminals at 115200 8N1, flow control/local echo off. Send a short line from the adapter terminal.
code:
  title: Separate UART byte echo
  filename: ft232r_usb_ttl.ino
  wiring: Adapter TX → GPIO16, RX ← GPIO17, GND ↔ GND. Separate USB power; no positive-rail connection.
  content: "#include <Arduino.h>\nconstexpr int8_t UART_RX = 16;\nconstexpr int8_t UART_TX = 17;\nvoid setup() {\n\
    \  Serial.begin(115200);\n  Serial2.begin(115200, SERIAL_8N1, UART_RX, UART_TX);\n  Serial.println(\"Adapter\
    \ terminal: 115200 8N1, flow control off\");\n}\nvoid loop() {\n  for (uint8_t n = 0; n < 32 && Serial2.available()\
    \ > 0; ++n) {\n    const int value = Serial2.read();\n    if (value >= 0) {\n      Serial2.write(static_cast<uint8_t>(value));\n\
    \      Serial.write(static_cast<uint8_t>(value));\n    }\n  }\n  delay(1);\n}\n"
  notes: 'Pinned HardwareSerial begin(baud, config, RX, TX) API. Short-line diagnostic, not a high-rate bridge:
    long streams can overflow buffers. No automatic boot/reset or voltage measurement.'
output: A short line should echo once in the adapter terminal and appear in DevKit Serial Monitor. Local echo can
  produce duplicate text even with bad wiring; turn it off before interpreting the result.
how_it_works: Serial2 receives on GPIO16, echoes on GPIO17 and copies each byte to Serial on the board USB bridge.
  Enumeration, UART communication and flashing are separate tasks. This tests communication after a normal USB upload,
  not an adapter-specific boot circuit.
applications:
- A second serial diagnostic console
- Checking a documented adapter before adding a UART peripheral
troubleshooting:
- problem: No adapter port
  cause: Charge-only cable, missing driver or wrong assumed bridge.
  fix: Identify the device; use FTDI drivers only for FTDI hardware and try a data cable.
- problem: Port opens but no echo
  cause: TX/RX not crossed, no ground or wrong pins.
  fix: Check the table and available WROOM pins; confirm baud/framing and flow control.
- problem: Garbled text
  cause: Framing mismatch, noise or unsafe signal voltage.
  fix: Verify 115200 8N1 and carrier documentation before reconnecting; idle voltage alone is not a schematic.
- problem: Resets or upload failures
  cause: Power/modem-control outputs accidentally connected.
  fix: Remove VCC/DTR/RTS wiring; upload through original board USB.
faqs:
- question: Does a 3.3V header prove TX voltage?
  answer: No. Verify VCCIO and the actual carrier circuit.
- question: Can every ESP32 use GPIO16/17?
  answer: No. This WROOM example requires unused exposed pins; PSRAM modules and other families need their own map.
