slug: ft232r-usb-ttl
name: 'FT232R Serial Adapter: ESP32 UART Diagnostics'
category: Communication Modules
difficulty: Beginner
summary: Connect a documented 3.3 V UART adapter to a separate ESP32 serial port. Check signal voltage before wiring;
  a supply jumper is not proof of safe TX levels.
date_modified: '2026-10-10'
concise_layout: true
show_time_estimates: false
curated_faqs: true
board_family: Classic ESP32
