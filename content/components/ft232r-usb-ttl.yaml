setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with the listed GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.3.2 (review baseline, not a latest-release claim). Select the documented board or ESP32
      Dev Module for a generic WROOM board. Other families need their own pin map. Serial Monitor: 115200 baud.'
  - label: Supported hardware
    value: FT232R-family USB-UART carrier with manufacturer schematic confirming VCCIO at 3.3 V and non-inverted
      TTL UART TX/RX. Artwork is not an identified board revision; RL suffix, jumper behavior and authenticity are
      unverified. No RS-232 adapter.
  - label: Prerequisites and parts
    value: Upload through the DevKit USB first. Two data-capable USB cables, documented 3.3 V adapter, signal/ground
      wires and terminal program. GPIO16/17 must be available on this WROOM board; other modules may use them for
      PSRAM.
  - label: Libraries
    value: Arduino-ESP32 3.3.2 built-in HardwareSerial only. FTDI VCP driver if needed for the actual bridge.
  - label: Expected result
    value: Short text sent through the adapter terminal is echoed there; the ESP32 USB Serial Monitor also shows
      each received byte.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
related_components:
- title: ESP32 DevKit power and pins
  href: /components/esp32-devkit.html
  description: Check board labels, supply rails and GPIO restrictions.
eli12: 'A USB-UART adapter gives a computer a serial port with TX, RX and ground. It is useful when the ESP32 USB
  port already carries debugging output. It does not turn arbitrary voltage levels into safe inputs.


  FT232R separates its main supply from VCCIO, which sets interface levels. A header marked 3.3V may be a power
  output while TX uses another voltage. Read the actual carrier schematic/configuration; disconnected from ESP32,
  check idle TX against GND. If its signal level cannot be established, stop before connecting. The illustration
  cannot establish a jumper position or header order.'
electrical:
  supply: Adapter uses its USB; ESP32 uses DevKit USB. Leave adapter VCC/3V3/5V outputs disconnected.
  signal: Documented 3.3 V non-inverted TTL UART only; ESP32 GPIO is not 5 V tolerant. Main chip supply is not the
    UART signal voltage.
  protection: Common ground, crossed TX/RX; no RS-232 levels or adapter DTR/RTS/reset/power connections in this
    exercise.
specs:
- name: UART format
  value: 115200 baud, 8N1
  why: 'Both terminals: flow control and local echo off.'
- name: WROOM pins
  value: GPIO16 RX, GPIO17 TX
  why: Explicit Serial2 assignment; separate from board USB/UART0.
- name: Adapter signal
  value: Documented 3.3 V VCCIO
  why: Verify the carrier schematic; illustration is not a circuit reference.
- name: ESP32 signal protection
  value: 3.3 V UART only; no 5 V signal
  why: Do not connect an unknown-voltage TX output; leave adapter power outputs disconnected.
pinout:
- pin: Adapter TXD / TXO
  role: Output
  connects: GPIO16 (ESP32 RX)
  note: Manufacturer-confirmed 3.3 V UART.
- pin: Adapter RXD / RXI
  role: Input
  connects: GPIO17 (ESP32 TX)
  note: Crossed, from adapter perspective.
- pin: Adapter GND
  role: Reference
  connects: ESP32 GND
  note: Wire with both USB cables removed.
- pin: VCC / 3V3 / 5V
  role: Power
  connects: Leave disconnected
  note: ESP32 has its own USB supply.
- pin: DTR / RTS / CTS
  role: Control
  connects: Leave disconnected
  note: Flow control off; no reset wiring.
