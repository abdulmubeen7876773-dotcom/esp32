setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with the listed GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.3.2 (review baseline, not a latest-release claim). Select the documented board or ESP32
      Dev Module for a generic WROOM board. Other families need their own pin map. Serial Monitor: 115200 baud.'
  - label: Supported hardware
    value: 'Worked reference: Seeed Grove Vibration Sensor (SW-420), documented for 3.3 V, quiet HIGH and vibration
      LOW. Generic modules may invert polarity or have different pull-ups. The approved SW-420-labelled illustration
      is not the Grove board or a verified schematic; its AO label is not evidence of an analog acceleration output.'
  - label: Prerequisites and parts
    value: IDE setup and digital-input lesson. The documented Seeed reference or a carrier proven electrically equivalent
      for this wiring/polarity, short wires and GPIO27 free. Check the actual connector labels and signal voltage.
      No 5 V rail or external load required.
  - label: Libraries
    value: Arduino-ESP32 3.3.2 GPIO interrupts; no sensor library.
  - label: Expected result
    value: Serial reports accumulated falling edges once per second. Multiple pulses may follow one disturbance;
      counts do not measure force or displacement.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
