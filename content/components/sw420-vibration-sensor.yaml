slug: sw420-vibration-sensor
name: 'SW-420: Observe Digital Vibration Events'
category: Sensors
difficulty: Beginner
summary: Capture short digital pulses from a documented SW-420 comparator module. Treat the event count as electrical
  transitions, not calibrated acceleration or independent impacts.
