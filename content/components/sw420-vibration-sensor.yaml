library: Arduino-ESP32 3.3.2 built-in GPIO interrupts; no extra library.
eli12: 'SW-420 is a mechanical vibration-sensitive switch used with a comparator to create short digital changes.
  A trimmer changes the comparator threshold. It does not turn the switch into an accelerometer or establish a distance,
  force or vibration spectrum.


  The supported Seeed circuit is HIGH while quiet and briefly LOW when disturbed. This example captures falling
  edges because a slow polling sketch can miss a pulse. Verify the actual carrier’s supply, output pull-up and quiet/active
  states before using this code on a different board. A four-pin illustration is not evidence that the documented
  Grove reference has an AO connector.'
electrical:
  supply: 3.3 V from a DevKit with enough regulator budget for the documented Seeed module; its 5 V capability is
    not permission to expose ESP32 GPIO to 5 V.
  signal: Documented 3.3 V SIG/DO → GPIO27, quiet HIGH and event LOW in the worked reference. Other output polarities
    need an explicitly matched circuit/code.
  protection: Common ground, short wires and verified pin labels. Do not connect unknown AO/DO or 5 V pull-ups directly;
    use actual schematic and measured levels.
specs:
- name: Worked hardware
  value: Seeed Grove SW-420 at 3.3 V
  why: Generic artwork does not establish equivalence.
- name: Output meaning
  value: Short HIGH-to-LOW transitions
  why: Mechanical bounce and comparator chatter can create multiple events.
- name: GPIO27 interrupt
  value: FALLING; count in ISR
  why: No printing or delays inside the interrupt.
- name: Reported quantity
  value: Edges per reporting interval
  why: Not acceleration, force or distinct-impact count.
