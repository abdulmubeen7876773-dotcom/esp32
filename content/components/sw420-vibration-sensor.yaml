  steps:
  - Disconnect power; verify actual supply, connector pin map and comparator/output pull-up rail. For an unknown
    module, establish equivalence before connecting.
  - Upload and open 115200 baud. Let the assembly sit still, then gently disturb the supporting surface; do not
    strike the electronics.
  - Adjust the actual reference trimmer gradually if needed. Compare quiet/event behavior and keep pulse counts
    separate from impact counts.
code:
  title: Count brief digital pulses
  filename: sw420_vibration_sensor.ino
  wiring: Documented reference VCC → 3.3 V, GND → GND, SIG → GPIO27. Leave unused pins disconnected. FALLING edges
    represent the reference LOW pulses.
  content: "#include <Arduino.h>\nconstexpr uint8_t VIBRATION_PIN = 27;\nvolatile uint32_t edgeCount = 0;\nportMUX_TYPE\
    \ counterMux = portMUX_INITIALIZER_UNLOCKED;\nuint32_t lastReport = 0;\nvoid ARDUINO_ISR_ATTR onFallingEdge()\
    \ {\n  portENTER_CRITICAL_ISR(&counterMux);\n  ++edgeCount;\n  portEXIT_CRITICAL_ISR(&counterMux);\n}\nvoid\
    \ setup() {\n  Serial.begin(115200);\n  pinMode(VIBRATION_PIN, INPUT);\n  attachInterrupt(digitalPinToInterrupt(VIBRATION_PIN),\
    \ onFallingEdge, FALLING);\n  Serial.println(\"Reference: quiet HIGH, disturbance LOW; counts are edges.\");\n\
    }\nvoid loop() {\n  const uint32_t now = millis();\n  if (now - lastReport >= 1000) {\n    lastReport = now;\n\
    \    portENTER_CRITICAL(&counterMux);\n    const uint32_t captured = edgeCount;\n    edgeCount = 0;\n    portEXIT_CRITICAL(&counterMux);\n\
    \    Serial.printf(\"falling_edges=%lu level=%d\\n\",\n                  static_cast<unsigned long>(captured),\
    \ digitalRead(VIBRATION_PIN));\n  }\n  delay(1);\n}\n"
  notes: Critical sections protect a shared ISR counter; serial output occurs outside them. No universal debounce
    interval is asserted. Group pulses into application events only after observing the actual switch and deciding
    a suitable time window.
output: Quiet reference hardware should usually report HIGH and few/no edges. A disturbance can produce LOW pulses
  and multiple falling edges, even if the sampled level is HIGH by print time. These are expected behaviors for
  the stated circuit, not hardware measurements from this update.
how_it_works: In the Seeed circuit, mechanical contact changes move one comparator input relative to the trimmer
  reference. The comparator produces a pulse rather than a calibrated analog quantity. An interrupt records the
  transition and the loop reports the snapshot. Pulse grouping for a mailbox/knock detector is an application decision;
  one mechanical disturbance may contain several electrical edges.
applications:
- Learning pulse capture with GPIO interrupts
- A relative disturbance indicator with verified sensitivity
troubleshooting:
- problem: No counts despite a visible pulse
  cause: Wrong signal pin/polarity or GPIO map.
  fix: Verify output level safely against GND and the documented quiet/active states; a rising-active carrier requires
    a separately matched example.
- problem: Counts while untouched
  cause: Threshold too sensitive, contact chatter or noise.
  fix: Use short wires and adjust the documented trimmer; distinguish environmental movement from wiring noise.
- problem: Printed level HIGH but count nonzero
  cause: Short LOW pulses ended before the report.
  fix: That is why the ISR is used. Do not expect a once-per-second level sample to preserve pulse duration.
- problem: Many counts for one knock
  cause: Switch bounce/comparator chatter.
  fix: Do not call them impacts. Add a documented application grouping window only after observation.
faqs:
- question: Can AO measure acceleration?
  answer: Not from the illustration or this digital reference circuit. Use a documented accelerometer when physical
    acceleration is required.
- question: Can I copy a generic pin order?
  answer: No. Check purchased module labels/schematic and output pull-ups. The logical diagram identifies connections,
    not a physical orientation.
