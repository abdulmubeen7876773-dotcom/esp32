slug: electrolytic-capacitors
name: 'Electrolytic Capacitors: Polarity and Low-Voltage Power Support'
category: Power Components
difficulty: Beginner
summary: Read capacitance and voltage ratings, identify polarity and try a low-voltage charge/discharge exercise.
  A capacitor supports a supply; it cannot replace one.
