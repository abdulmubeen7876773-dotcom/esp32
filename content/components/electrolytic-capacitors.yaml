setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with the listed GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.3.2 (review baseline, not a latest-release claim). Select the documented board or ESP32
      Dev Module for a generic WROOM board. Other families need their own pin map. Serial Monitor: 115200 baud.'
  - label: Supported hardware
    value: Known radial aluminum electrolytic, 100 µF rated at least 10 V, documented for the temperature/circuit.
      The assortment artwork does not authenticate values, series, ESR or lifetime.
  - label: Prerequisites and parts
    value: Regulated current-limited 5 V supply, known 100 µF / ≥10 V capacitor, 1 kOhm 0.25 W resistor, voltmeter
      and insulated connections. Read the actual part datasheet; keep this exercise separate from ESP32 GPIO and
      USB rails.
  - label: Libraries
    value: No firmware/library required for the meter exercise. Arduino-ESP32 3.3.2 is the site example baseline,
      not a dependency of this passive part.
  - label: Expected result
    value: A voltmeter shows charging toward 5 V and discharge toward zero after supply removal. No timing/ripple
      measurement performed.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
