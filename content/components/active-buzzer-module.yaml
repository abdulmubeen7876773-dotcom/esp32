setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with the listed GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.3.2 (review baseline, not a latest-release claim). Select the documented board or ESP32
      Dev Module for a generic WROOM board. Other families need their own pin map. Serial Monitor: 115200 baud.'
  - label: Supported hardware
    value: 'Worked reference: Joy-IT COM-KY012APB / KY-012 as documented in its May 2024 manual: voltage between
      S (powered terminal) and GND makes sound; middle pin is not connected. The generic approved module illustration
      is not identified as this product. Do not transplant this wiring to a VCC/GND/IN board without its schematic.'
  - label: Prerequisites and parts
    value: Complete Blink and the NPN switching lesson. Documented Joy-IT module, onsemi P2N2222A, 680 ohm base
      resistor, 100 kOhm base-emitter pull-down, short wires and a regulated 5 V supply rated for the documented
      module current. ESP32 remains USB powered; join grounds, not positive rails.
  - label: Libraries
    value: No extra library. Arduino-ESP32 3.3.2 GPIO and millis APIs.
  - label: Expected result
    value: A fixed-pitch beep for 200 ms followed by 1800 ms silence. The sketch controls the envelope, not pitch.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
