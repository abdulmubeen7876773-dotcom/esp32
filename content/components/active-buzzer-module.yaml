slug: active-buzzer-module
name: 'Active Buzzer Module: Safe ESP32 On/Off Control'
category: Actuators
difficulty: Beginner
summary: Switch a documented active buzzer through an NPN transistor. Keep buzzer power off the GPIO and distinguish
  a powered signal terminal from a low-current logic input.
