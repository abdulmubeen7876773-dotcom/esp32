  note: External supply negative and ESP32 GND.
- pin: P2N2222A pin2 base
  role: Control
  connects: GPIO25 through 680 ohm
  note: Verify exact onsemi numbered package view.
- pin: 100 kOhm resistor
  role: Pull-down
  connects: Base to emitter
