library: Arduino-ESP32 3.3.2 (no additional library)
eli12: 'An active buzzer contains an oscillator, so steady power produces a tone. Turn that power on and off to
  make alert patterns. A passive buzzer instead needs an alternating drive signal and can play different pitches.
  The approved image depicts an active-module family but cannot verify a real unit’s oscillator or trigger polarity.


  The reference KY-012 terminal S carries buzzer power, not just a logic command. Use the transistor below instead
  of drawing buzzer current from ESP32 GPIO. Other active modules may have separate VCC and IN, active-LOW control
  or different ratings.'
electrical:
  supply: Regulated external 5 V for the documented KY-012; reference operating range includes 3.3–5 V.
  signal: GPIO25 → 680 ohm → NPN base. No 5 V terminal connects to ESP32 GPIO.
  protection: Shared ground, 100 kOhm base-emitter pull-down and a documented low-side transistor. Never drive an
    unknown buzzer load directly.
  basis: Joy-IT KY-012 manual/sensor documentation and onsemi P2N2222A datasheet; not a rating for the illustration.
specs:
- name: Reference interface
  value: S powered terminal, GND return, middle NC
  why: Not a universal VCC/GND/IN connector.
- name: Reference current budget
  value: Up to 30 mA per Joy-IT sensor documentation
  why: Check the purchased product revision and supply; no current measured here.
- name: Base resistor
  value: 680 ohm with P2N2222A
  why: About 3.7 mA for a 0.8 V base-emitter estimate; sized separately from the LED lesson.
