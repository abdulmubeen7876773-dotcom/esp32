code:
  title: Short beep envelope
  filename: active_buzzer_module.ino
  wiring: External +5 V → KY-012 S; KY-012 minus → NPN collector; emitter → common GND. GPIO25 → 680 ohm → base,
    100 kOhm base-emitter; middle NC.
  content: "#include <Arduino.h>\nconstexpr uint8_t OUTPUT_PIN = 25;\nbool active = false;\nuint32_t changedAt =\
    \ 0;\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(OUTPUT_PIN, OUTPUT);\n  digitalWrite(OUTPUT_PIN, LOW);\n\
    \  Serial.println(\"Starts OFF; repeating on/off demonstration\");\n}\nvoid loop() {\n  const uint32_t now =\
    \ millis();\n  const uint32_t interval = active ? 200 : 1800;\n  if (now - changedAt >= interval) {\n    changedAt\
    \ = now;\n    active = !active;\n    digitalWrite(OUTPUT_PIN, active ? HIGH : LOW);\n    Serial.println(active\
    \ ? \"ON\" : \"OFF\");\n  }\n}\n"
  notes: HIGH switches the transistor on in this circuit. No tone() or PWM is needed for the active reference. The
    software OFF state and hardware pull-down assume correct wiring; this is not a fail-safe alarm.
output: A short repeating beep is expected from the supported reference. A click without a steady tone during the
  ON interval can indicate a passive device, wrong voltage or poor wiring; do not compensate by blindly changing
  pin polarity.
how_it_works: GPIO current enters the base through 680 ohm. The collector switches the buzzer return while its S
  terminal remains at 5 V. The roughly 3.7 mA base-drive estimate provides margin for the documented 30 mA load
  using an approximately 10:1 forced-gain design target. Actual junction drop and current vary; no values were measured.
applications:
- Non-safety-critical reminders
- Button confirmation beeps
- Status alerts with a fixed tone
troubleshooting:
- problem: Only clicks
  cause: Passive buzzer or unsuitable supply.
  fix: Match the exact active reference and check voltage across its S/minus terminals during ON.
- problem: Continuous sound
  cause: Buzzer return bypasses transistor or transistor is shorted.
  fix: Unplug power; trace the switched return and verify the base pull-down.
- problem: A different module behaves backwards
  cause: Different trigger circuit or pin order.
  fix: Stop and obtain its schematic; neither polarity nor GPIO compatibility follows from the module name.
faqs:
- question: Is the green illustration a Joy-IT KY-012?
  answer: That exact model is not established. The worked reference and diagram are explicitly separate from the
    family illustration.
- question: Can it play the digital piano project?
  answer: An active buzzer is unsuitable for changing musical pitch. That project uses a passive buzzer; follow
    its separate driver guidance.
