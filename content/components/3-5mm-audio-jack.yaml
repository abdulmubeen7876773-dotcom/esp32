slug: 3-5mm-audio-jack
name: '3.5 mm Audio Jack: Map TRS Contacts'
category: Miscellaneous
difficulty: Beginner
summary: Identify tip, ring and sleeve with an unpowered plug and meter. Do not infer solder-terminal order or connect
  audio directly to ESP32 GPIO.
date_modified: '2026-10-11'
concise_layout: true
