setup:
  items:
  - label: Board and software
    value: Low-voltage bench setup as specified below. ESP32 is optional for passive exercises. Coded examples require
      classic ESP32-WROOM-32/32E DevKit, unused exposed pins, Arduino IDE 2.x and Arduino-ESP32 3.3.2 (review baseline,
      not a latest-release claim). Other families need their own pin map.
  - label: Supported hardware
    value: 'Approved PJ-307-labelled 3.5 mm stereo jack illustration; exact drawing and switched contacts unverified.
      Worked contact terminology: known three-contact TRS jack, such as Same Sky SJ1-3523NG, not an identification
      of artwork.'
  - label: Prerequisites and parts
    value: Known TRS plug/breakout, actual jack drawing and continuity meter. Disconnect audio sources, amplifiers
      and ESP32. A TRRS headset is a different contact arrangement.
  - label: Libraries
    value: No firmware or library required for this exercise. Arduino-ESP32 3.3.2 is the site review baseline, not
      a dependency of this passive setup.
  - label: Expected result
    value: Each assigned jack terminal connects to the intended tip, ring or sleeve of an inserted unpowered TRS
      plug.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
related_components:
- title: ESP32 DevKit power and pins
  href: /components/esp32-devkit.html
  description: Check board labels, supply rails and GPIO restrictions.
eli12: 'A stereo TRS plug has tip, ring and sleeve separated by insulating rings. Conventional unbalanced stereo
  uses tip for left, ring for right and sleeve for return. That signal convention is not the mechanical solder-pin
  order.


  Some jacks add switched contacts that change when a plug enters. Map them with the actual drawing and continuity
  test; leave unneeded switches isolated. The illustration label cannot establish a numbered footprint. TRRS headset
  microphone standards are outside this three-contact exercise.'
electrical:
  supply: Passive connector; no power requirement or voltage conversion.
  signal: Audio can be bipolar or exceed GPIO limits. No direct audio-to-ADC connection in this exercise.
  protection: A finished ADC audio input needs designed bias, filtering and voltage limiting. ESP32 GPIO is not
    an audio amplifier or a 5 V tolerant input.
specs:
- name: Contact system
  value: 3.5 mm TRS
  why: Three plug contacts; not TRRS.
- name: Terminal numbers
  value: From actual jack drawing
  why: No universal footprint or switch order assumed.
output: With the plug inserted, label measured contacts T/R/S and record any switches separately. Continuity identifies
  connections, not audio impedance, gain or noise.
how_it_works: The jack spring contacts touch the corresponding plug surfaces. Use an unpowered test plug with accessible
  labelled conductors; test insertion/removal if switches exist. Do not join left and right amplifier outputs to
  make mono.
applications:
- Preparing a documented audio connector pin map
- Checking broken connector contacts before audio-circuit design
troubleshooting:
- problem: More than three terminals
  cause: Jack includes switches or shell contacts.
  fix: Consult drawing and map with plug inserted/removed.
- problem: Hum or one channel missing
  cause: Return/contact mapping wrong or damaged jack.
  fix: Check unpowered TRS continuity before reconnecting audio.
- problem: Headset contacts differ
  cause: TRRS used instead of TRS.
  fix: Use the matching connector and headset standard; do not guess microphone pin.
faqs:
- question: Is the nearest solder pin always sleeve?
  answer: No. Use actual drawing and continuity.
- question: Can I connect headphone audio to GPIO34?
  answer: Not directly; it requires a suitable biased and protected input circuit.
