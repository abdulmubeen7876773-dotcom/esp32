  description: Check board labels, supply rails and GPIO restrictions.
eli12: 'APDS-9960 combines ambient/color channels with infrared proximity and directional gesture sensing. Clear
  is a broad light-intensity channel, not transparency or distance. Start with color to check the bus before enabling
  the gesture engine.


  The example enables color only, leaving proximity and gestures off. It does not promise swipe recognition. The
  linked gesture project has its own mode, wiring and library assumptions.'
electrical:
  supply: Reference Adafruit VIN to 3.3 V. Bare-chip VDD is 2.4–3.6 V; its LED supply is separate.
  signal: SDA21/SCL22 with ESP32-side pulls at 3.3 V, even if a different board accepts 5 V supply.
  protection: No 5 V on an undocumented generic board. Reference regulation/level shifting is not inferred from
    artwork.
  basis: Broadcom datasheet, documented Adafruit breakout and pinned library.
