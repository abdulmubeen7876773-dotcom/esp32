code:
  title: Raw RGB/clear counts and bounded data-ready diagnostic
  filename: apds9960_sensor.ino
  wiring: Reference Adafruit VIN to 3.3 V, common GND, SDA21/SCL22; INT and 3Vo unused. Generic board circuitry
    is not inferred.
  content: "#include <Arduino.h>\n#include <Wire.h>\n#include <Adafruit_APDS9960.h>\nAdafruit_APDS9960 apds;\nbool\
    \ ready = false;\nuint32_t lastReady = 0;\nuint32_t lastSample = 0;\nvoid setup() {\n  Serial.begin(115200);\n\
    \  if (!Wire.begin(21, 22, 100000)) {\n    Serial.println(\"I2C bus initialization failed\");\n    return;\n\
    \  }\n  if (!apds.begin(50, APDS9960_AGAIN_4X, 0x39, &Wire)) {\n    Serial.println(\"APDS9960 initialization\
    \ failed; check board, power and I2C\");\n    return;\n  }\n  apds.enableProximity(false);\n  apds.enableGesture(false);\n\
    \  apds.enableColor(true);\n  ready = true;\n  lastReady = millis();\n}\nvoid loop() {\n  if (!ready) { delay(100);\
    \ return; }\n  uint32_t now = millis();\n  if (now - lastSample >= 500) {\n    lastSample = now;\n    if (apds.colorDataReady())\
    \ {\n      uint16_t r, g, b, c;\n      apds.getColorData(&r, &g, &b, &c);\n      Serial.printf(\"R=%u G=%u B=%u\
    \ Clear=%u\\n\",\n        unsigned(r), unsigned(g), unsigned(b), unsigned(c));\n      lastReady = now;\n   \
    \ }\n  }\n  if (now - lastReady >= 3000) {\n    Serial.println(\"No ready color data for 3 s; check bus and\
    \ sensor mode\");\n    lastReady = now;\n  }\n  delay(1);\n}\n"
  notes: The diagnostic does not wait forever. The pinned begin implementation checks chip ID; ACK alone is insufficient.
    Data-ready and getColorData do not guarantee continuing bus health after unplugging the sensor.
output: Counts change with light, surface color, geometry and exposure/gain. No fixed numbers are promised. Saturated
  counts suggest excessive exposure; low counts can mean little light or an obstructed window. This sketch reports
  neither gestures nor centimetres.
how_it_works: Color sensing integrates light for the configured interval; data-ready gates reading the four channel
  registers. Gesture mode instead uses reflected infrared patterns and a separate engine/FIFO workflow. Keep those
  tasks distinct.
applications:
- Relative color/light experiments
- Brightness input after calibration
- Prerequisite for gesture-control experiments
troubleshooting:
- problem: Initialization fails despite 0x39 ACK
  cause: Wiring, chip variant or identification failure.
  fix: Check supply/pulls and markings; another device can ACK this address. Do not bypass the ID check.
- problem: No ready data diagnostic
  cause: Mode, power or bus failure.
  fix: Check connections, then restart. Do not block indefinitely waiting for data.
- problem: Saturation or unstable comparisons
  cause: High gain/exposure or changing lighting.
  fix: Use consistent geometry; reduce gain/integration using the documented API. Calibrate before claiming physical
    units.
faqs:
- question: Does Clear mean distance?
  answer: No. It is a light channel; proximity is separate and not automatically calibrated distance.
- question: Why are no hand swipes reported?
  answer: Only color is enabled. Gesture recognition needs a different engine and setup; follow the separate project’s
    workflow.
