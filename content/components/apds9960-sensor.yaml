setup:
  items:
  - label: Board and software
    value: 'Classic ESP32-WROOM-32/32E DevKit with the listed GPIOs exposed and unused. Arduino IDE 2.x; esp32 by
      Espressif Systems 3.3.2 (review baseline, not a latest-release claim). Select the documented board or ESP32
      Dev Module for a generic WROOM board. Other families need their own pin map. Serial Monitor: 115200 baud.'
  - label: Supported hardware
    value: 'Reference circuit: documented Adafruit APDS9960 breakout powered at VIN 3.3 V, with level-shifted SDA/SCL.
      The illustrated generic board is not identified as Adafruit. Generic regulators, pull-ups and level shifting
      must be checked separately.'
  - label: Prerequisites and parts
    value: Complete IDE setup and I2C scanner lesson. Documented breakout, short wires and colored objects under
      consistent lighting; leave the optical window uncovered.
  - label: Libraries
    value: Install Adafruit APDS9960 1.3.1 and Adafruit BusIO. Wire is bundled with core 3.3.2. Use this Adafruit
      API, not SparkFun gesture examples.
  - label: Expected result
    value: Raw R/G/B/C counts print when ready. Lighting and objects change them; they are not calibrated display
      RGB, lux or distance.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
