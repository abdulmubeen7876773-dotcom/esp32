  steps:
  - Unplug USB and external supply. Match the MOSFET package and DIP-14 buffer pin drawings.
  - Wire every buffer supply/enable/unused input and pull-down, then the LED load. Join grounds; do not join external
    +5 V to the USB-powered board.
  - Upload and apply regulated 5 V. Compare LED switching with Serial commands.
code:
  title: Slow buffered MOSFET switch
  filename: irlb8721_mosfet.ino
  wiring: GPIO25 → AHCT 1A; 1Y → 1 kOhm → gate; source → common GND. +5 V → 1 kOhm → LED → drain. Buffer5 V, enables/unused
    inputs, bypass and pull-downs as listed.
  content: "#include <Arduino.h>\nconstexpr uint8_t OUTPUT_PIN = 25;\nbool active = false;\nuint32_t changedAt =\
    \ 0;\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(OUTPUT_PIN, OUTPUT);\n  digitalWrite(OUTPUT_PIN, LOW);\n\
    \  Serial.println(\"Starts OFF; repeating on/off demonstration\");\n}\nvoid loop() {\n  const uint32_t now =\
    \ millis();\n  const uint32_t interval = active ? 500 : 1000;\n  if (now - changedAt >= interval) {\n    changedAt\
    \ = now;\n    active = !active;\n    digitalWrite(OUTPUT_PIN, active ? HIGH : LOW);\n    Serial.println(active\
    \ ? \"ON\" : \"OFF\");\n  }\n}\n"
  notes: Do not connect GPIO directly to the gate in this reference circuit. This sketch uses ordinary HIGH/LOW,
    not obsolete LEDC channel APIs. It is not a high-frequency PWM gate-driver design.
output: The LED should follow the repeated ON/OFF commands. Serial is a command log, not evidence of gate voltage
  or successful switching. If the LED stays on, inspect source/drain orientation and wiring before trying a larger
  load.
how_it_works: With /1OE grounded, the AHCT channel passes the command without inversion. Its 5 V output raises gate
  voltage relative to the grounded source. The series gate resistor limits transient charging current; the pull-down
  discharges the gate when drive is absent. Larger or faster loads need gate-charge, switching-loss, safe-operating-area,
  thermal and supply analysis. Motors/coils also need an appropriate flyback path; the MOSFET body diode is not
  a substitute for a diode across a low-side inductive load.
applications:
- Learning buffered gate drive
- Small resistive/LED load switching
- Preparation for a separately engineered low-voltage power stage
troubleshooting:
- problem: Always on
  cause: Reversed source/drain, floating gate or load bypassing drain.
  fix: Power off; trace the manufacturer terminals and both pull-downs.
- problem: Never on
  cause: Disabled buffer, wrong chip family or missing common ground.
  fix: Verify AHCT markings, 5 V supply, /1OE and named signal paths.
- problem: Hot transistor
  cause: Insufficient drive, excessive load or fast switching losses.
  fix: Disconnect. Do not extrapolate from package current ratings; return to the small LED reference.
faqs:
- question: Does logic-level mean guaranteed operation from 3.3 V?
  answer: Not for every part/load. This datasheet does not guarantee low on-resistance at 3.3 V; the reference uses
    a buffer.
- question: Can I use HC125 instead of AHCT125?
  answer: Do not assume it. This example relies on AHCT TTL-compatible inputs while powered at 5 V.
