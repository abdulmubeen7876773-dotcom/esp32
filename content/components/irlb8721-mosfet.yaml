slug: irlb8721-mosfet
name: 'IRLB8721 MOSFET: Buffered ESP32 Load Switching'
category: Power Components
difficulty: Beginner
summary: Use an IRLB8721 as a low-side switch with a 5 V gate buffer and a small LED load. Gate threshold does not
  guarantee low resistance at 3.3 V.
