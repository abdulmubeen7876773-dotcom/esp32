library: Arduino-ESP32 3.3.2 (no additional library)
eli12: 'A MOSFET’s gate voltage controls the path from drain to source. Unlike an NPN base, it mainly draws current
  while its gate capacitance charges or discharges. This circuit switches the ground side of a small LED load.


  IRLB8721 is often advertised as logic-level, but its guaranteed on-resistance is specified at 4.5 V and 10 V gate
  drive. The threshold value describes a tiny test current, not full-load conduction. A 5 V AHCT buffer accepts
  ESP32’s 3.3 V command and gives this slow demonstration a defined higher gate drive.'
electrical:
  supply: External regulated 5 V for the LED and AHCT buffer; source at common GND.
  signal: ESP32 GPIO25 drives only the TTL-compatible buffer input. The gate sees buffer output through 1 kOhm.
  protection: 10 kOhm input pull-down, 100 kOhm gate-source pull-down, 100 nF buffer bypass and 1 kOhm LED resistor.
    Never put 5 V on ESP32 GPIO.
  basis: Infineon IRLB8721 and TI SN74AHCT125 datasheets; this is a slow small-load example, not a general power
    driver.
specs:
- name: Guaranteed RDS(on) test points
  value: 4.5 V and 10 V gate drive
  why: No guaranteed 3.3 V on-resistance claimed.
- name: Reference terminals
  value: Gate, drain, source; tab = drain
  why: Use the exact TO-220AB package drawing.
- name: Example load
  value: One red LED and 1 kOhm resistor
  why: A few mA design estimate; no heatsink/current claim inferred from package ratings.
pinout:
- pin: 74AHCT125 pin14 VCC
  role: Supply
  connects: External regulated +5 V
  note: Use SN74AHCT125N DIP-14; not an HC125.
- pin: 74AHCT125 pin7 GND
  role: Return
  connects: Common GND
  note: ESP32 GND and external supply negative.
- pin: 74AHCT125 pin2 1A
  role: Input
  connects: GPIO25 + 10 kOhm to GND
  note: Pull-down holds input LOW during reset.
- pin: 74AHCT125 pin1 /1OE
  role: Enable
  connects: GND
  note: Active LOW; channel1 enabled.
- pin: 'Unused /OE: 4,10,13'
  role: Disable
  connects: +5 V
  note: Outputs6,8,11 left unconnected.
- pin: 'Unused A: 5,9,12'
  role: Input
  connects: GND
  note: Do not leave CMOS inputs floating.
- pin: 100 nF ceramic
  role: Bypass
  connects: Between pins14 and7
  note: Close to buffer; no polarity.
- pin: 74AHCT125 pin3 1Y
  role: Gate drive
  connects: 1 kOhm → MOSFET gate
  note: No connection back to GPIO.
- pin: 100 kOhm resistor
  role: Pull-down
  connects: MOSFET gate to source
  note: Keeps gate discharged when buffer is unavailable.
- pin: IRLB8721 source
  role: Return
  connects: Common GND
  note: Confirm manufacturer package view.
- pin: External +5 V
  role: Load supply
  connects: 1 kOhm → red LED anode
  note: Separate LED current-limiting resistor.
- pin: Red LED cathode
  role: Switched load
  connects: IRLB8721 drain
  note: Tab is also drain; avoid accidental shorts.
