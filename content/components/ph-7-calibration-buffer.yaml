eli12: 'A near-neutral buffer is commonly the first calibration point for a pH electrode, allowing a compatible
  meter to establish its offset. This is a known solution for a separate probe and meter, not a sensor with electrical
  pins.


  The approved illustration is labelled 7.0. Hanna HI7007 is a separately documented 7.01 reference, not the identified
  contents of that bottle. Select the instrument buffer set and actual reference temperature value before accepting
  a point. A single neutral point does not establish electrode slope across an acidic or alkaline range.'
electrical:
  supply: No electrical supply; chemical reference only.
  signal: No GPIO or analog output. The separate meter/interface determines ESP32 voltage compatibility.
  protection: Keep liquids away from powered electronics. Follow actual product handling/SDS and do not return used
    buffer to the bottle.
