- name: Illustration label
  value: pH 7.0
  why: Exact certified value/temperature and lot unknown.
- name: Documented reference
  value: Hanna pH 7.01 buffer
  why: Use actual product temperature table; not an artwork specification.
- name: Calibration role
  value: near-neutral offset point
  why: Follow instrument-supported points and sequence.
output: The meter should stabilize and accept the selected neutral reference. Check a failed first point before
  proceeding; matching one reference alone does not verify slope or sample accuracy.
how_it_works: 'Check that the electrode has been stored and hydrated according to its manual. Pour fresh near-neutral
  buffer into a clean beaker, rinse off storage solution as directed, and immerse the bulb and junction to the required
  depth. Wait for a stable reading; the meter may accept it automatically or require confirmation.


  Keep stock capped and follow actual bottle storage/expiry instructions. Do not return used solution to stock or
  confuse calibration buffer with electrode storage solution. After the neutral point, rinse and use a separate
  fresh reference that brackets the intended samples: the pH 4 page covers the acidic-point workflow. Save the completed
  calibration in the meter.'
applications:
- A documented pH 7 calibration point
- Checking reference stability before designing a probe interface
troubleshooting:
- problem: First point will not stabilize
  cause: Dry/dirty electrode, wrong immersion or stale solution.
  fix: Follow hydration/cleaning instructions, check bulb/junction coverage and try a fresh aliquot before changing
    calibration settings.
- problem: Meter expects 7.00 but bottle says 7.01
  cause: Wrong buffer set or temperature reference.
  fix: Select the instrument-supported buffer set using the actual bottle documentation; do not substitute the illustration
    label.
- problem: Neutral point passes but other samples look wrong
  cause: One-point calibration does not assess slope over the measurement range.
  fix: Complete the documented multi-point procedure with a suitable second reference; no accuracy conclusion from
    one accepted point.
faqs:
- question: Does one pH 7 point calibrate every range?
  answer: It establishes the supported first point, not a universal slope or accuracy guarantee. Follow the full
    meter procedure.
- question: Should the electrode stay in this bottle between uses?
  answer: No generic storage recommendation applies. Use the electrode manufacturer storage solution/procedure,
    keeping calibration stock uncontaminated.
