library: Arduino-ESP32 3.3.2 (no additional library)
eli12: 'A small base current controls a larger collector current. In this low-side circuit the LED connects to the
  positive rail through its own resistor, while the emitter returns to ground. HIGH on GPIO25 supplies base current
  and turns the LED on.


  Use this as a first switching circuit before an IR-emitter or buzzer project. A transistor is not a replacement
  for a motor driver or an LED current-limiting resistor. Similar part names can have opposite lead orders.'
electrical:
  supply: 3.3 V LED supply in this example; emitter at common GND.
  signal: GPIO25 supplies base current through 2.2 kOhm; never connect GPIO directly to base.
  protection: 470 ohm series LED resistor and 100 kOhm base-emitter pull-down. No inductive load in this circuit.
  basis: onsemi P2N2222A datasheet; resistor/current calculations apply only to the small LED example.
specs:
- name: Reference pin numbers
  value: 1 collector / 2 base / 3 emitter
  why: Match onsemi package orientation; not a universal 2N2222 arrangement.
- name: Load
  value: One red LED, 470 ohm series resistor
  why: (3.3 V - LED drop - transistor drop) / 470 ohm is the design estimate.
- name: Base resistor
  value: 2.2 kOhm
  why: Roughly 1 mA at a 0.7 V base-emitter drop; not a measured value.
pinout:
- pin: P2N2222A pin3 emitter
  role: Return
  connects: ESP32 GND
  note: Verify numbered package view.
- pin: P2N2222A pin2 base
  role: Control
  connects: GPIO25 through 2.2 kOhm
  note: Series base resistor required.
- pin: 100 kOhm resistor
  role: Pull-down
  connects: Base to emitter
  note: Keeps transistor off with input floating.
- pin: ESP32 3.3 V
  role: Load supply
  connects: 470 ohm → LED anode
  note: Anode to resistor; no bare LED across supply.
- pin: LED cathode
  role: Load return
  connects: P2N2222A pin1 collector
  note: Collector switches LED current to emitter.
