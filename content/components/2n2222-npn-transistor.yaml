  steps:
  - Unplug USB. Identify the onsemi part and its numbered leads from the package drawing.
  - Wire the LED and both base resistors; inspect for rail shorts.
  - Upload, then open Serial Monitor at 115200; compare LED behavior with the commands.
code:
  title: Small LED low-side switch
  filename: 2n2222_npn_transistor.ino
  wiring: GPIO25 → 2.2 kOhm → base; emitter/GND common; 100 kOhm base-emitter. 3.3 V → 470 ohm → red LED anode;
    cathode → collector.
  content: "#include <Arduino.h>\nconstexpr uint8_t OUTPUT_PIN = 25;\nbool active = false;\nuint32_t changedAt =\
    \ 0;\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(OUTPUT_PIN, OUTPUT);\n  digitalWrite(OUTPUT_PIN, LOW);\n\
    \  Serial.println(\"Starts OFF; repeating on/off demonstration\");\n}\nvoid loop() {\n  const uint32_t now =\
    \ millis();\n  const uint32_t interval = active ? 500 : 1000;\n  if (now - changedAt >= interval) {\n    changedAt\
    \ = now;\n    active = !active;\n    digitalWrite(OUTPUT_PIN, active ? HIGH : LOW);\n    Serial.println(active\
    \ ? \"ON\" : \"OFF\");\n  }\n}\n"
  notes: The sketch commands GPIO25, not an onboard LED. The pull-down provides hardware bias before setup. HIGH
    is ON in this exact NPN circuit.
output: After one second OFF, the LED should blink with a half-second ON interval. Printed ON/OFF confirms software
  intent; it does not detect LED current, polarity or a wiring fault.
how_it_works: The base-emitter junction needs limited current. The LED resistor determines load current; transistor
  gain alone does not set it. Calculate base drive for a new load using saturation conditions, GPIO limits and the
  exact datasheet. The datasheet’s 600 mA absolute maximum is not permission to switch that current from this circuit.
  Inductive loads require appropriate suppression and a fresh electrical design.
applications:
- Small low-voltage indicators
- Learning low-side switching
- Preparation for a documented IR LED driver
troubleshooting:
- problem: LED never lights
  cause: Reversed LED, wrong C/E order or missing common ground.
  fix: Power off; check the manufacturer pin view, LED polarity and series resistors.
- problem: LED stays on
  cause: Collector/emitter short or base held high.
  fix: Check breadboard rows and base pull-down; compare GPIO state with Serial.
- problem: Part heats up
  cause: Short, excessive load or incorrect base drive.
  fix: Disconnect power. Return to the small LED load; do not transplant this design into a motor circuit.
faqs:
- question: Can I use any PN2222 or metal-can 2N2222?
  answer: Only after checking that exact manufacturer’s pinout and electrical data. The numbered reference here
    is onsemi P2N2222A.
- question: Can I reuse 2.2 kOhm for a buzzer?
  answer: Not automatically. A larger load needs different base drive; the linked buzzer example uses its own resistor
    calculation.
