slug: 2n2222-npn-transistor
name: '2N2222 NPN Transistor: Switch a Small LED with ESP32'
category: Power Components
difficulty: Beginner
summary: Learn base, collector and emitter connections using a documented P2N2222A and a small 3.3 V LED load. A
  base resistor and verified package pinout are essential.
date_modified: '2026-10-10'
concise_layout: true
