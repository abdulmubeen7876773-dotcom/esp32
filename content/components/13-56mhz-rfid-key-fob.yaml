hide_empty_downloads: true
setup:
  items:
  - label: Board and software
    value: Low-voltage bench setup as specified below. ESP32 is optional for passive exercises. Coded examples require
      classic ESP32-WROOM-32/32E DevKit, unused exposed pins, Arduino IDE 2.x and Arduino-ESP32 3.3.2 (review baseline,
      not a latest-release claim). Other families need their own pin map.
  - label: Supported hardware
    value: Approved illustration marked MIFARE13.56MHz/Classic1K; authenticity, memory and exact IC unverified.
      Use an actual documented ISO14443A/MIFARE Classic-compatible tag for the existing MFRC522 example.
  - label: Prerequisites and parts
    value: Documented compatible fob and the existing3.3 V MFRC522 reader setup. Follow its complete SPI wiring/sketch
      rather than wiring the passive fob to GPIO.
  - label: Libraries
    value: No firmware or library required for this exercise. Arduino-ESP32 3.3.2 is the site review baseline, not
      a dependency of this passive setup.
  - label: Expected result
    value: The existing reader guide reports tag communication/UID when a compatible fob enters its field; no security
      or authenticity claim.
  - label: Verification status
    value: Documentation and source review only. Not compiled or tested on hardware. The approved product-style
      illustration identifies a family, not a verified physical pin layout or manufacturer-authenticated board.
      Follow the logical diagram and documentation for your actual part.
related_components:
- title: Complete MFRC522 reader example
  href: /components/mfrc522-rfid-reader.html
  description: Use its documented3.3 V SPI wiring and pinned library.
eli12: 'A passive RFID fob receives energy from the reader field and communicates wirelessly. It has no VCC pin
  to connect. Frequency alone does not establish protocol: a125 kHz tag, ISO15693 tag or every NFC product is not
  interchangeable with this example.


  The visible Classic1K label supports the approved family mapping but cannot authenticate its chip. The MFRC522
  tutorial qualifies supported13.56 MHz ISO14443A/MIFARE-type communication. Reading a UID does not prove ownership,
  uniqueness or secure authorization.'
electrical:
  supply: Passive tag energized by compatible reader field; no wired supply.
  signal: No fob-to-GPIO signal. The separate MFRC522 reference reader uses3.3 V supply/SPI logic.
  protection: Follow the reader power/pinout circuit. Do not connect USB/5 V or probe wires to the fob.
specs:
- name: Illustrated label
  value: 13.56 MHz / Classic1K
  why: Exact IC/authenticity/capacity not verified.
- name: Compatibility
  value: Documented ISO14443A / supported MIFARE
  why: Frequency alone is insufficient.
- name: Security
  value: UID demonstration only
  why: Do not build a trusted lock from UID matching.
output: The reader sketch should report a compatible tag at practical close range. No response can be compatibility,
  reader wiring or distance/orientation; it does not by itself identify a faulty fob.
how_it_works: Reader and passive tag couple through their antennas. Use the existing complete MFRC522 example for
  first detection. Keep this passive-part page focused on compatibility and limitations rather than duplicating
  its SPI code. Do not write unknown card blocks or keys just to test presence.
applications:
- RFID reader learning and tag detection
- Comparing documented compatible tags without modifying memory
troubleshooting:
- problem: No detection
  cause: Incompatible protocol/frequency, wiring or field coupling.
  fix: Verify actual tag specification and existing reader setup; try close orientation without promising range.
- problem: UID differs from expectation
  cause: Different tag or UID representation/type.
  fix: Compare library output carefully; do not infer authenticity from UID.
- problem: Phone cannot read it
  cause: Phone/protocol support differs.
  fix: Use the documented compatible reader;13.56 MHz does not promise all phone support.
faqs:
- question: Does a fob need3.3 V wiring?
  answer: No. Only its separate reader has power and GPIO connections.
- question: Is UID access secure?
  answer: No. This example demonstrates identification data, not secure authentication.
