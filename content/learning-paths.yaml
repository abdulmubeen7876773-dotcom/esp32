beginner_route:
  title: 'Start here: five beginner steps'
  intro: Follow this order with a classic ESP32 WROOM DevKit and Arduino-ESP32 3.x. Each guide explains its exact
    hardware assumptions. Finish each expected result before moving on.
  steps:
  - slug: installing-arduino-ide-esp32
    label: Arduino IDE setup
    learn: Install the board package, select your board and port, then verify a Serial-only upload.
    parts: ESP32 DevKit, data-capable USB cable and computer.
    ready: Start here; no circuit or onboard LED is required.
  - slug: blink-led-esp32
    label: Blink LED
    learn: Wire an external LED and control a digital output.
    parts: Add an LED, 220 ohm resistor, breadboard and jumper wires.
    ready: First confirm the Serial upload in step 1 works.
  - slug: button-led-control
    label: Button input
    learn: Read a button with INPUT_PULLUP and use it to control the LED.
    parts: Add a pushbutton; reuse the LED circuit and breadboard.
    ready: First make the external LED blink in step 2.
  - slug: read-temperature-dht22
    label: DHT11 sensor
    learn: Install a sensor library and read temperature and humidity in Serial Monitor.
    parts: Add a DHT11; check the guide for bare-sensor versus module wiring and pull-up requirements.
    ready: Keep the working upload setup and practise the button wiring before adding a sensor.
  - slug: connect-oled-esp32
    label: OLED display
    learn: Wire an SSD1306 I2C OLED and show text. Combining sensor values is a later exercise.
    parts: Add the guide’s 128×64 SSD1306 I2C OLED; verify its supply and signal requirements.
    ready: Use the library-installation and Serial Monitor skills from step 4.
guide_index:
