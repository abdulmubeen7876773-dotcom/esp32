    image: /assets/visuals/projects/wiring/esp32-lightning-detector-wiring.svg
    full_size_link: true
    illustration_alt: Logical classic ESP32 to SparkFun SEN-15441 v2.0 SPI map, LED circuit and optional 3.3 V SSD1306;
      not physical header order
    summary: This map is for SparkFun SEN-15441 hardware v2.0 in SPI mode, powered through its 3V3 header from the
      USB-powered classic ESP32 board. Read the real board labels; the drawing does not show physical connector
      positions. Keep the antenna clear of wiring and noisy electronics.
    steps:
    - Disconnect USB before wiring. Confirm the exact SEN-15441 v2.0 board is in its documented SPI configuration;
      do not adapt an unknown module or change jumpers while powered.
    - Board 3V3 → sensor 3V3; board GND → sensor GND. No 5 V signal or power connection is used in this supported
      exercise.
    - 'GPIO5 → CS, GPIO18 → SCK, GPIO23 → MOSI, GPIO19 ← MISO, GPIO4 ← IRQ. IRQ is active HIGH; old silkscreen versions
      may imply otherwise. GPIO5 is a classic strapping pin: do not add a reset-time pull-down or substitute a module
      that holds it LOW.'
    - GPIO26 → 220–330 Ω resistor → red LED anode; LED cathode → GND. Do not omit the resistor.
    - 'Default USE_OLED=0: leave the display disconnected and install only the SparkFun library. For USE_OLED=1,
      also connect the selected OLED VCC→3V3, GND→GND, SDA→21, SCL→22, with bus pull-ups only to 3.3 V. Set OLED_ADDRESS
      to its documented/scanned 0x3C or 0x3D; an ACK does not identify the controller.'
    - Select the matching classic ESP32 board, install the pinned libraries, upload the complete sketch and open
      Serial Monitor at 115200. Keep the demonstration indoors; never go outdoors during a storm to create a test
      event.
