    filename: esp32-lightning-detector.ino
    content: "#include <Arduino.h>\n#include <SPI.h>\n#include <SparkFun_AS3935.h>\n// Classic ESP32-WROOM DevKit;\
      \ Arduino-ESP32 3.3.2 review baseline.\n// SparkFun SEN-15441 v2.0 in SPI mode; SparkFun AS3935 library 1.4.9.\n\
      // Indoor educational demo only. Not a storm warning or verified distance.\n#define USE_OLED 0 // Set to 1\
      \ only with the optional SSD1306 circuit/libraries.\n#if USE_OLED\n#include <Wire.h>\n#include <Adafruit_SSD1306.h>\n\
      Adafruit_SSD1306 oled(128, 64, &Wire, -1);\nconstexpr uint8_t OLED_ADDRESS = 0x3C; // Check the documented\
      \ module/address.\nbool oledReady = false;\n#endif\nconstexpr uint8_t AS3935_CS = 5, AS3935_IRQ = 4, LED_PIN\
      \ = 26;\nSparkFun_AS3935 lightning; // Default constructor is for SPI, not an I2C address.\nbool sensorReady\
      \ = false, ledOn = false;\nuint32_t ledAt = 0, lastIdle = 0;\n\nvoid displayStatus(const char* text) {\n#if\
      \ USE_OLED\n  if (!oledReady) return;\n  oled.clearDisplay();\n  oled.setTextSize(1);\n  oled.setTextColor(SSD1306_WHITE);\n\
      \  oled.setCursor(0, 0);\n  oled.println(text);\n  oled.println(\"Educational only\");\n  oled.println(\"\
      Use official alerts\");\n  oled.display();\n#endif\n}\n\nvoid startOptionalDisplay() {\n#if USE_OLED\n  if\
      \ (!Wire.begin(21, 22)) {\n    Serial.println(\"OLED I2C setup failed; continuing Serial-only.\");\n    return;\n\
      \  }\n  Wire.beginTransmission(OLED_ADDRESS);\n  if (Wire.endTransmission() != 0) {\n    Serial.println(\"\
      No OLED address ACK; continuing Serial-only.\");\n    return;\n  }\n  // An ACK is not controller identification;\
      \ begin() is not visible-pixel proof.\n  oledReady = oled.begin(SSD1306_SWITCHCAPVCC, OLED_ADDRESS, true,\
      \ false);\n  if (!oledReady) Serial.println(\"OLED buffer/init failed; continuing Serial-only.\");\n#endif\n\
      }\n\nbool startSensor() {\n  if (!SPI.begin(18, 19, 23, AS3935_CS)) return false;\n  // In library 1.4.9 beginSPI()\
      \ configures the bus; it does NOT detect a chip.\n  if (!lightning.beginSPI(AS3935_CS, 2000000, SPI)) return\
      \ false;\n  lightning.setIndoorOutdoor(INDOOR);\n  lightning.setNoiseLevel(2);\n  lightning.watchdogThreshold(2);\n\
      \  lightning.spikeRejection(2);\n  lightning.maskDisturber(false);\n  lightning.lightningThreshold(1);\n \
      \ if (lightning.readIndoorOutdoor() != INDOOR ||\n      lightning.readNoiseLevel() != 2 || lightning.readWatchdogThreshold()\
      \ != 2 ||\n      lightning.readSpikeRejection() != 2 || lightning.readMaskDisturber() != 0 ||\n      lightning.readLightningThreshold()\
      \ != 1) return false;\n  // Internal RC-oscillator status only; no antenna tuning or distance validation.\n\
      \  return lightning.calibrateOsc();\n}\n\nvoid describeDistance(uint8_t code, char* text, size_t capacity)\
      \ {\n  switch (code) {\n    case 1: snprintf(text, capacity, \"Chip reports overhead\"); return;\n    case\
      \ 63: snprintf(text, capacity, \"Distance out of range\"); return;\n    case 5: case 6: case 8: case 10: case\
      \ 12: case 14: case 17:\n    case 20: case 24: case 27: case 31: case 34: case 37: case 40:\n      snprintf(text,\
      \ capacity, \"Storm-front estimate: %u km\", unsigned(code)); return;\n    default: snprintf(text, capacity,\
      \ \"No valid distance (code %u)\", unsigned(code));\n  }\n}\n\nvoid setup() {\n  Serial.begin(115200);\n \
      \ digitalWrite(LED_PIN, LOW);\n  pinMode(LED_PIN, OUTPUT);\n  pinMode(AS3935_IRQ, INPUT);\n  startOptionalDisplay();\n\
      \  sensorReady = startSensor();\n  Serial.println(sensorReady ? \"AS3935 setup checks passed; listening indoors.\"\
      \ :\n    \"AS3935 setup/read-back failed; events disabled. Power off and check wiring.\");\n  Serial.println(\"\
      No independent chip, antenna or lightning-detection verification.\");\n  displayStatus(sensorReady ? \"Listening\
      \ for IRQ\" : \"Sensor setup failed\");\n}\n\nvoid loop() {\n  const uint32_t now = millis();\n  if (ledOn\
      \ && uint32_t(now - ledAt) >= 100) {\n    digitalWrite(LED_PIN, LOW);\n    ledOn = false;\n  }\n  if (uint32_t(now\
      \ - lastIdle) >= 5000) {\n    lastIdle = now;\n    Serial.println(sensorReady ? \"Waiting for IRQ; silence\
      \ does not mean no storm.\" :\n      \"Events disabled; correct wiring and reset after power-off inspection.\"\
      );\n  }\n  if (!sensorReady || digitalRead(AS3935_IRQ) != HIGH) {\n    delay(5);\n    return;\n  }\n  delay(2);\
      \ // Datasheet: wait at least 2 ms after IRQ before reading its register.\n  const uint8_t type = lightning.readInterruptReg();\
      \ // Also clears the IRQ latch.\n  if (type == NOISE_TO_HIGH) {\n    Serial.println(\"Noise floor exceeded;\
      \ no lightning or distance confirmation.\");\n    displayStatus(\"Noise floor exceeded\");\n  } else if (type\
      \ == DISTURBER_DETECT) {\n    Serial.println(\"Disturber rejected; not confirmed lightning.\");\n    displayStatus(\"\
      Disturber rejected\");\n  } else if (type == LIGHTNING) {\n    char text[48];\n    describeDistance(lightning.distanceToStorm(),\
      \ text, sizeof(text));\n    Serial.print(\"Lightning-like event. \");\n    Serial.println(text);\n    Serial.println(\"\
      Sensor report only; not a verified strike or safety radius.\");\n    digitalWrite(LED_PIN, HIGH);\n    ledOn\
      \ = true;\n    ledAt = millis();\n    displayStatus(text);\n  } else {\n    Serial.printf(\"Other IRQ code\
      \ 0x%02X; no new distance result.\\n\", unsigned(type));\n  }\n}\n"
  code_explanation: USE_OLED=0 excludes display dependencies and starts a Serial/LED-only lesson. With USE_OLED=1,
    the code separately checks I2C startup, address ACK and framebuffer initialization. Any display failure leaves
    Serial operation available; no drawing occurs unless initialization succeeded. A setup/read-back or oscillator-status
    failure disables event processing until the reader corrects the wiring and resets. A successful setup does not
    continuously detect every disconnection. Event names come from the pinned header; describeDistance maps special/undefined
    codes without inventing kilometres.
  expected_output: 'Illustrative expected behavior, not recorded observations: Serial at 115200 reports either setup
    checks passed or setup/read-back failed. Every five seconds it prints a waiting or disabled diagnostic. Noise
    and disturber reports do not print a distance. A lightning-like report may say Chip reports overhead, Distance
    out of range, a listed storm-front estimate, or No valid distance. The LED flashes only for that report category,
    not proof of a real strike. With USE_OLED=1 and successful display initialization, the OLED repeats the status
    and Use official alerts. Silence is not an all-clear.'
  common_mistakes:
  - text: Treating the project as a life-safety warning system.
  - text: Testing outdoors during storms.
  - text: Masking disturbers before learning what local interference looks like.
  - text: Changing indoor/outdoor mode, noise level, and spike rejection all at once.
  - text: Claiming exact strike distance from the distance code.
  troubleshooting:
  - problem: Compile error for event names
    fix: Install SparkFun AS3935 1.4.9 and copy the whole revised sketch; it uses NOISE_TO_HIGH, DISTURBER_DETECT
      and LIGHTNING from that header, not undefined example macros.
  - problem: Setup/read-back failed
    fix: Unplug USB, check exact board identity, SPI configuration, 3V3/GND and CS/SCK/MOSI/MISO labels. Reset after
      corrections. beginSPI() alone is not a presence check.
  - problem: Waiting for IRQ, no events
    fix: Check GPIO4/IRQ and use the manufacturer register examples indoors. No event is expected on demand. Do
      not create hazardous sparks, approach lightning or treat silence as sensor validation.
  - problem: Frequent noise or disturbers
    fix: Move the antenna away from the ESP32, USB supplies, LED lamps and switching electronics; shorten wiring.
      Keep disturbers visible and change one documented threshold at a time. Do not assume every accepted event
      is lightning.
  - problem: Distance says out of range or no valid distance
    fix: Keep the status label. Code 63 is not 63 km and code 1 is an overhead status, not a precise 1 km measurement.
      Do not substitute a plausible value.
  - problem: Optional OLED remains blank
    fix: First get Serial-only operation with USE_OLED=0. With USE_OLED=1, confirm controller/dimensions, 3.3 V
      power and bus pull-ups, SDA21/SCL22, address and pinned libraries. An ACK or begin success does not prove
      visible pixels.
  - problem: Board does not boot with sensor attached
    fix: Disconnect power and inspect the GPIO5 CS connection and reset pulls. Do not substitute an unknown breakout
      or move connections on a powered board.
  testing_checklist:
  - Check exact board identity, power and every named connection with USB disconnected.
  - Keep USE_OLED=0 for the first Serial-only attempt; record board/core/library versions and setup diagnostics.
  - If setup passes, record the configuration and actual observations separately; this is not a completed antenna
    or detection calibration.
  - Log any event categories indoors without treating test data as a weather alert. No storms, sparks or deliberate
    high-voltage interference are part of this exercise.
  - If adding OLED, check its address and initialization diagnostics independently of the sensor.
  engineer_tips:
  - Keep the antenna area clear; avoid nearby switching supplies and wiring.
  - Use INDOOR for this bench example. Outdoor operation and weatherproofing are not implemented here.
  - Keep noise and disturber reports visible while learning; suppressed messages do not prove a quieter electromagnetic
    environment.
  - Follow official weather warnings; do not use the hobby device for safety decisions.
