levels:
  beginner:
    level: beginner
    overview_html: <p>An AS3935 educational sensor demo that logs event types and displays lightning-like distance codes.
      Do not rely on this for storm safety. Follow official weather alerts and local guidance. Do not go outside to test during
      lightning.</p>
    components:
    - ESP32 DevKit board
    - AS3935 lightning sensor module
    - SSD1306 OLED display
    - Red LED and 220 ohm resistor
    - Breadboard and jumper wires
    wiring:
    - - AS3935 CS
      - GPIO5
      - Keep stable during boot.
    - - AS3935 SCK
      - GPIO18
      - VSPI clock.
    - - AS3935 MOSI
      - GPIO23
      - ESP32 to sensor.
    - - AS3935 MISO
      - GPIO19
      - Sensor to ESP32.
    - - AS3935 IRQ
      - GPIO4
      - Interrupt event line.
    - - Event LED
      - GPIO26
      - Series resistor required.
    - - OLED SDA/SCL
      - GPIO21/GPIO22
      - Optional display.
    key_concepts:
    - The AS3935 reports event types through registers after raising IRQ. SPI reads classify noise, disturber, or lightning-like
      events.
    - Noise means the local electrical environment is too noisy, disturber means interference looked storm-like but was rejected,
      and lightning-like means the chip accepted the pattern.
    - Distance codes are estimates from the sensor algorithm, not exact strike distances. Indoor electronics can cause false positives.
    applications: &id003
    - Weather-sensor education
    - Interrupt classification lesson
    - False-positive analysis demo
    troubleshooting:
    - - AS3935 not found
      - Check SPI wiring, chip select GPIO5, and 3.3 V power.
    - - Frequent disturbers
      - Move away from USB chargers, switching supplies, laptop power bricks, LED lamps, and long jumper wires; tune one setting at a time.
    - - No events
      - Confirm IRQ wiring and module library configuration with a register read example.
    improvements: &id002
    - Add local timestamp logging.
    - Add a display page for event counts.
    - Compare indoor noise floor settings.
    code: "// ESP32 AS3935 educational lightning sensor demo\n// Not a life-safety warning system. Follow official weather\
      \ alerts.\n#include <SPI.h>\n#include <Wire.h>\n#include <Adafruit_SSD1306.h>\n#include <SparkFun_AS3935.h>\n\nconst\
      \ int AS3935_CS = 5;\nconst int AS3935_IRQ = 4;\nconst int LED_PIN = 26;\n\nSparkFun_AS3935 lightning(AS3935_CS);\n\
      Adafruit_SSD1306 oled(128, 64, &Wire, -1);\n\nvolatile bool eventFlag = false;\n\nvoid IRAM_ATTR onAs3935Event() {\n\
      \  eventFlag = true;\n}\n\nvoid setup() {\n  Serial.begin(115200);\n  Wire.begin(21, 22);\n  SPI.begin(18, 19, 23, AS3935_CS);\n\
      \  oled.begin(SSD1306_SWITCHCAPVCC, 0x3C);\n  oled.setTextColor(WHITE);\n  pinMode(LED_PIN, OUTPUT);\n  pinMode(AS3935_IRQ,\
      \ INPUT);\n\n  if (!lightning.beginSPI(AS3935_CS, 2000000)) {\n    Serial.println(\"AS3935 not found. Check SPI wiring\
      \ and 3.3 V power.\");\n    while (true) delay(10);\n  }\n\n  lightning.setIndoorOutdoor(INDOOR);\n  lightning.maskDisturber(false);\n\
      \  lightning.setNoiseLevel(2);\n  lightning.spikeRejection(2);\n  attachInterrupt(digitalPinToInterrupt(AS3935_IRQ),\
      \ onAs3935Event, RISING);\n\n  Serial.println(\"AS3935 demo ready. Do not test outdoors during storms.\");\n}\n\nvoid\
      \ loop() {\n  if (!eventFlag) return;\n  eventFlag = false;\n  delay(5);\n\n  int type = lightning.readInterruptReg();\n\
      \  if (type == NOISE_INT) {\n    Serial.println(\"Noise event. Move the sensor away from electronics or raise noise\
      \ level.\");\n  } else if (type == DISTURBER_INT) {\n    Serial.println(\"Disturber event. Electrical interference,\
      \ not confirmed lightning.\");\n  } else if (type == LIGHTNING_INT) {\n    int distanceKm = lightning.distanceToStorm();\n\
      \    Serial.print(\"Lightning-like event. AS3935 distance code: \");\n    Serial.print(distanceKm);\n    Serial.println(\"\
      \ km. Not a verified strike distance.\");\n\n    digitalWrite(LED_PIN, HIGH);\n    delay(100);\n    digitalWrite(LED_PIN,\
      \ LOW);\n\n    oled.clearDisplay();\n    oled.setTextSize(1);\n    oled.setCursor(0, 0);\n    oled.println(\"Lightning-like\
      \ event\");\n    oled.print(\"Distance code: \");\n    oled.print(distanceKm);\n    oled.println(\" km\");\n    oled.println(\"\
      Use official alerts\");\n    oled.display();\n  }\n}\n"
    code_filename: esp32-lightning-detector-beginner.ino
