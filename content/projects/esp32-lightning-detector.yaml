  - name: SparkFun AS3935
    note: Install SparkFun AS3935 Lightning Detector library.
  - name: Adafruit SSD1306
    note: For OLED output.
  code:
    filename: esp32-lightning-detector.ino
    content: "// ESP32 AS3935 educational lightning sensor demo\n// Not a life-safety warning system. Follow official weather\
      \ alerts.\n#include <SPI.h>\n#include <Wire.h>\n#include <Adafruit_SSD1306.h>\n#include <SparkFun_AS3935.h>\n\nconst\
      \ int AS3935_CS = 5;\nconst int AS3935_IRQ = 4;\nconst int LED_PIN = 26;\n\nSparkFun_AS3935 lightning(AS3935_CS);\n\
      Adafruit_SSD1306 oled(128, 64, &Wire, -1);\n\nvolatile bool eventFlag = false;\n\nvoid IRAM_ATTR onAs3935Event() {\n\
      \  eventFlag = true;\n}\n\nvoid setup() {\n  Serial.begin(115200);\n  Wire.begin(21, 22);\n  SPI.begin(18, 19, 23, AS3935_CS);\n\
      \  oled.begin(SSD1306_SWITCHCAPVCC, 0x3C);\n  oled.setTextColor(WHITE);\n  pinMode(LED_PIN, OUTPUT);\n  pinMode(AS3935_IRQ,\
      \ INPUT);\n\n  if (!lightning.beginSPI(AS3935_CS, 2000000)) {\n    Serial.println(\"AS3935 not found. Check SPI wiring\
      \ and 3.3 V power.\");\n    while (true) delay(10);\n  }\n\n  lightning.setIndoorOutdoor(INDOOR);\n  lightning.maskDisturber(false);\n\
      \  lightning.setNoiseLevel(2);\n  lightning.spikeRejection(2);\n  attachInterrupt(digitalPinToInterrupt(AS3935_IRQ),\
      \ onAs3935Event, RISING);\n\n  Serial.println(\"AS3935 demo ready. Do not test outdoors during storms.\");\n}\n\nvoid\
      \ loop() {\n  if (!eventFlag) return;\n  eventFlag = false;\n  delay(5);\n\n  int type = lightning.readInterruptReg();\n\
      \  if (type == NOISE_INT) {\n    Serial.println(\"Noise event. Move the sensor away from electronics or raise noise\
      \ level.\");\n  } else if (type == DISTURBER_INT) {\n    Serial.println(\"Disturber event. Electrical interference,\
      \ not confirmed lightning.\");\n  } else if (type == LIGHTNING_INT) {\n    int distanceKm = lightning.distanceToStorm();\n\
      \    Serial.print(\"Lightning-like event. AS3935 distance code: \");\n    Serial.print(distanceKm);\n    Serial.println(\"\
      \ km. Not a verified strike distance.\");\n\n    digitalWrite(LED_PIN, HIGH);\n    delay(100);\n    digitalWrite(LED_PIN,\
      \ LOW);\n\n    oled.clearDisplay();\n    oled.setTextSize(1);\n    oled.setCursor(0, 0);\n    oled.println(\"Lightning-like\
      \ event\");\n    oled.print(\"Distance code: \");\n    oled.print(distanceKm);\n    oled.println(\" km\");\n    oled.println(\"\
      Use official alerts\");\n    oled.display();\n  }\n}\n"
  code_explanation: GPIO4 sets an event flag when the AS3935 raises IRQ. The loop waits for that flag, reads the AS3935 interrupt register over SPI, and handles three event types. NOISE_INT means the noise floor is too high. DISTURBER_INT means an electrical pulse resembled lightning but was rejected as interference. LIGHTNING_INT means the chip accepted the pattern and returns a distance code for display and logging.
  expected_output: Serial Monitor reports noise, disturber, and lightning-like event categories. The LED flashes only on lightning-like events, and the OLED labels the distance as an AS3935 distance code rather than an exact strike location.
  common_mistakes:
  - text: Treating the project as a life-safety warning system.
  - text: Testing outdoors during storms.
  - text: Masking disturbers before learning what local interference looks like.
  - text: Changing indoor/outdoor mode, noise level, and spike rejection all at once.
  - text: Claiming exact strike distance from the distance code.
  troubleshooting:
  - problem: AS3935 not found
    fix: Check SPI wiring, chip select GPIO5, and 3.3 V power.
  - problem: Frequent disturbers
    fix: Move the module away from USB chargers, switching supplies, laptop power bricks, LED lamps, appliance wiring, and long jumper wires. Keep disturbers unmasked while tuning so you can see the interference source.
  - problem: Frequent noise events
    fix: Shorten wiring, improve ground connections, move the antenna/module away from the ESP32 Wi-Fi antenna and power wiring, then raise the AS3935 noise level one step if needed.
  - problem: Lightning-like events happen indoors with no storm nearby
    fix: Treat them as false positives until compared with official weather information. Increase spike rejection one step, move away from noisy electronics, and log whether the event repeats.
  - problem: No events
    fix: Confirm IRQ wiring and module library configuration with a register read example.
  - problem: Distance value seems wrong
    fix: Treat distance as the AS3935 algorithm's distance code in kilometers, not a GPS location, exact range, or proof that a strike occurred.
  testing_checklist:
  - Verify SPI communication indoors.
  - Confirm GPIO4 IRQ changes when the AS3935 reports an event.
  - Log noise, disturber, and lightning-like categories separately.
  - Change only one tuning setting at a time, then record whether false positives improve.
  - Compare any lightning-like messages with official weather alerts without relying on the sensor.
  engineer_tips:
  - Keep antenna/module away from noisy electronics.
  - Use INDOOR mode for bench testing and OUTDOOR mode only for protected, supervised experiments when conditions are safe.
  - Start with disturbers visible, then mask them only if the lesson needs quieter output after tuning.
  - Tune noise level and spike rejection separately so you know which change helped.
  - Label distance as a sensor code in any display, log, or screenshot.
  - Use official alerts for safety decisions.
  - Document false positives instead of hiding them.
