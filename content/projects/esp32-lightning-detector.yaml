  circuit_explanation: The USB-powered ESP32 provides 3.3 V power and signal levels for the selected breakout. SPI
    carries register operations; IRQ is a separate active-HIGH event notification. A LOW IRQ simply means no unread
    interrupt, not evidence that no lightning exists. The optional display is another device on an independent I2C
    bus. The logical map is not a physical pinout photograph.
  engineering_explanation: 'In SparkFun library 1.4.9, beginSPI() returns true after configuring the interface;
    it does not probe a chip. This sketch writes documented settings and compares their read-back values, then checks
    the library internal RC-oscillator routine. A pass is only a setup sanity check: it neither proves chip identity,
    antenna resonance, continued connection nor detection accuracy. Antenna tuning requires the manufacturer procedure
    and suitable measurement equipment; this sketch does not choose a made-up tuning capacitance.


    The AS3935 distance register describes estimated distance to the storm front, not an individually located strike.
    Code 1 means the chip reports overhead; 63 means out of range. Only the datasheet-listed numeric bins are printed
    in km; any other value is labelled no valid distance. Never convert these categories into an all-clear or a
    safety radius.


    The short loop polls IRQ instead of using an interrupt service routine. After HIGH, it waits 2 ms before reading
    the interrupt register, which clears the latch. A zero/other code can occur without a new distance result. The
    LED timer avoids a 100 ms blocking flash, but this is not a guaranteed lossless event recorder. Start with disturbers
    unmasked. Change one setting at a time and record conditions; quieter output is not proof of improved accuracy.'
