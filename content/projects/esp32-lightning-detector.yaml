  what_you_build: An indoor classic ESP32-WROOM / SparkFun SEN-15441 v2.0 SPI lesson. The default sketch logs noise,
    disturber and lightning-like events in Serial Monitor and flashes a low-current LED for a lightning-like report.
    Set USE_OLED to 1 only after adding the documented optional SSD1306 circuit and libraries. This is not storm
    protection or a verified strike detector.
  story: Start with a known SPI breakout and inspect what its registers report. This lesson distinguishes successful
    interface setup, sensor-generated event codes and independent evidence of lightning. None of those can be inferred
    from a website build or a simulated output.
  eli12: Lightning makes radio noise. The AS3935 listens for patterns like that, but other electronics can also
    make noise, so the ESP32 labels what the chip reports.
  parent_safety: Do not rely on this for storm safety. Follow official weather alerts and local guidance. Do not
    go outside to test during lightning. Use the project as an indoor bench lesson, and unplug USB and external
    power before rewiring.
  safety_standards:
  - Follow official weather alerts and local guidance for storm decisions; this hobby circuit is educational only.
  - Do not go outdoors, handle antennas, or move wiring during thunder or lightning.
  - Keep the AS3935, ESP32, OLED, and LED on low-voltage bench power. Unplug USB before changing SPI, IRQ, OLED,
    or LED wiring.
  learning_objectives:
  - Wire the selected SEN-15441 v2.0 board to the named classic ESP32 GPIOs.
  - Use the pinned library event identifiers and poll its active-HIGH IRQ line.
  - Check configuration read-back without calling that chip identification or detection validation.
  - Distinguish valid storm-front distance bins, overhead, out-of-range and undefined codes.
  - Keep the optional OLED separate from Serial-only operation and handle display startup failure.
