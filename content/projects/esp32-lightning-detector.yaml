  circuit_explanation: The AS3935 raises its IRQ pin when it has an event to report. The ESP32 then reads the interrupt register over SPI and classifies the event as noise, disturber, or lightning-like. Noise means the sensor floor is too noisy for a clean decision. Disturber means an electrical pulse looked storm-like but did not pass the chip's lightning checks. Lightning-like means the AS3935 algorithm accepted the pattern and can return a distance code.
  engineering_explanation: Indoor and outdoor modes change the AS3935 analog front-end gain, so the same wiring can behave differently on a desk, near electronics, or outside under cover. Start indoors with disturbers unmasked so you can see interference instead of hiding it. Tune noise level and spike rejection one step at a time, record the false-positive rate, then decide whether the setting is too sensitive or too quiet. The distance value is a sensor code in kilometers from the AS3935 algorithm, not a verified strike location or a safety radius.
