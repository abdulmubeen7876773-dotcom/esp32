  faqs:
  - question: Is this a safety alarm?
    answer: No. Follow official weather alerts.
  - question: Can I test it in a storm?
    answer: No. Do not go outdoors during lightning.
  - question: What do AS3935 event types mean?
    answer: Noise means the local electrical environment is too noisy, disturber means interference resembled lightning but was rejected, and lightning-like means the chip accepted the pattern.
  - question: Are distance readings exact?
    answer: No. Treat them as AS3935 distance codes with false-positive limits, not verified strike distances.
