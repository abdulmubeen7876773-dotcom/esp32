  faqs:
  - question: Is mains wiring covered?
    answer: No. Only the isolated, current-limited low-voltage AC loop is supported; a clamp does not make mains
      work safe for beginners.
  - question: Why can a small load read almost zero?
    answer: The selected CT is rated 30 A / 1 V. A small bench current produces a small secondary voltage and may
      be obscured by ADC noise.
  - question: Are the displayed amps or VA calibrated?
    answer: No. ICAL is an unvalidated starter value and 12 V is assumed, not measured. No accuracy result is supplied.
