  circuit_explanation: The SCT-013 produces an isolated AC signal proportional to current. The bias network shifts
    that waveform into the ESP32 ADC range so EmonLib can estimate RMS current.
  engineering_explanation: The SCT-013-030 is the 30 A / 1 V voltage-output version with an internal burden; it
    is not interchangeable with an SCT-013-000 current-output clamp. A small low-voltage bench load may produce
    readings dominated by ADC noise. The two 10 kΩ resistors bias the input nominally to 1.65 V; the 10 µF coupling
    capacitor has its positive terminal toward the biased ADC node. Verify actual waveform bounds, not just midpoint.
    EmonLib 1.1.0 assumes 10-bit counts on non-ARM builds; this example explicitly requests that resolution. Neither
    that change nor the library establishes calibration. The assumed 12 V multiplication is only an illustrative
    VA estimate, not measured voltage, watts, power factor or energy.
  libraries:
  - name: Arduino-ESP32 3.3.2
    note: Classic ESP32-WROOM review baseline. Uses 10-bit analogRead here to match EmonLib non-ARM ADC_COUNTS,
      not the default 12-bit setting.
  - name: EmonLib 1.1.0
    note: OpenEnergyMonitor library. ICAL=29 is an unvalidated starter factor; ADC transfer, CT tolerance and coupling
      network require a separate calibration. No ESP32 firmware compilation or current-accuracy result is claimed.
  code:
    filename: esp32-ac-power-monitor.ino
    content: "// ESP32 Isolated AC Current Monitor Prototype\n// Isolated current-limited 12 V AC bench loop ONLY;\
      \ no mains wiring.\n// Arduino-ESP32 3.3.2 / EmonLib 1.1.0 review baseline; uncalibrated estimate.\n#include\
      \ \"EmonLib.h\"\n\nEnergyMonitor emon;\nconst int CT_PIN = 34;          // ADC1 input at 1.65 V biased midpoint\n\
      const float ICAL = 29.0;        // Starter calibration; tune with a known safe reference\nconst float ASSUMED_VOLTAGE\
      \ = 12.0; // Nominal bench AC source, not measured voltage\n\nvoid setup() {\n  Serial.begin(115200);\n  analogReadResolution(10);\n\
      \  analogSetPinAttenuation(CT_PIN, ADC_11db);\n  emon.current(CT_PIN, ICAL);\n  Serial.println(\"Educational\
      \ isolated CT current monitor. Not billing-grade.\");\n}\n\nvoid loop() {\n  double irms = emon.calcIrms(1480);\n\
      \  double apparentPower = irms * ASSUMED_VOLTAGE;\n  Serial.printf(\"Irms estimate: %.3f A  Apparent power\
      \ estimate: %.1f VA\\n\", irms, apparentPower);\n  delay(5000);\n}\n"
  code_explanation: CT_PIN is GPIO34. EmonLib samples the biased waveform, estimates RMS current, and multiplies
    by an assumed voltage only for apparent-power practice.
  expected_output: Serial Monitor prints Irms estimate and apparent power estimate every five seconds. Treat both
    as prototype estimates that need calibration.
  common_mistakes:
  - text: 'Using a DC source: a current transformer requires changing current.'
  - text: Clamping around both low-voltage source and return conductors, cancelling the field.
  - text: Assuming a mid-rail divider prevents excessive waveform peaks.
  - text: Treating a nominal-voltage VA calculation as measured watts or billing energy.
  troubleshooting:
  - problem: Current reads near zero
    fix: Confirm the clamp surrounds one conductor only and the jack wiring reaches GPIO34.
  - problem: Readings drift
    fix: Check the midpoint bias and capacitor orientation.
  - problem: Values disagree with a meter
    fix: Tune ICAL against a known safe reference; do not claim precision.
  testing_checklist:
  - Confirm the source is factory-isolated 12 V AC with an appropriate current limit/fuse and matching low-voltage
    load.
  - Verify bias and waveform limits before connecting GPIO34.
  - Record unloaded noise and a supervised low-voltage load observation separately from any reference measurement.
  - Do not infer useful low-current precision from plausible Serial output.
  engineer_tips:
  - Use only the isolated low-voltage AC arrangement described here.
  - Check the CT model and secondary plug contacts before wiring.
  - Keep all accuracy claims pending an actual reference comparison.
  upgrade_ideas:
  - Display the explicitly uncalibrated estimate on an OLED.
  - Log the bench source, load and ADC settings with each observation.
