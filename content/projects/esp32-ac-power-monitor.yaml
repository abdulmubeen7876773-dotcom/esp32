  wiring:
    full_size_link: true
    illustration_alt: Build an Isolated AC Current Monitor Prototype wiring diagram
    summary: Only the isolated 12 V AC source and its low-voltage load form the sensed loop. The SCT-013-030 has
      a built-in burden; its secondary output feeds the separate biased GPIO34 circuit.
    steps:
    - Unplug USB before changing the ADC bias circuit.
    - Build the 10 kOhm / 10 kOhm divider between 3.3 V and GND.
    - Connect the divider midpoint to GPIO34.
    - Couple the SCT-013 tip signal into the midpoint through the 10 uF capacitor, observing capacitor polarity
      for the biased node.
    - Connect the SCT-013 sleeve to ESP32 GND on the low-voltage side.
    - With the isolated 12 V AC source OFF, clamp around ONE insulated conductor between that source and its matching
      low-voltage load. Do not clamp the complete two-wire cable; no mains lead is used.
    - 'Before GPIO34 is connected, verify the midpoint and waveform with a meter/oscilloscope: keep the complete
      waveform within approximately 0.2–2.9 V for headroom inside the classic ESP32 11 dB measurement range. Limit
      the low-voltage source/load accordingly. The bias divider is not an overvoltage clamp.'
