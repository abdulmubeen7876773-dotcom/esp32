  wiring:
    full_size_link: true
    illustration_alt: Logical MQ135 bare-sensor heater, load resistor and 12 kΩ/10 kΩ ESP32 interface with qualified
      output stage
    summary: One bounded bare-sensor circuit. Heater and sensing-loop supply are 5.0 V ±0.1 V; ESP32 signals remain
      in the 3.3 V domain. Unknown comparator breakouts are not covered.
    steps:
    - Disconnect USB and the external supply. Confirm the manufacturer pin-view orientation; the logical drawing
      is not a physical pin layout.
    - Connect the bare MQ135 H heater pair across external regulated 5.0 V ±0.1 V. Connect both A electrode pins
      to that same 5 V rail; join both B pins as RAW.
    - Connect a separate RL = 10 kΩ from RAW to common GND. Connect RAW through 12 kΩ (1%) to the ADC node, then
      10 kΩ (1%) from that node to GND.
    - Connect only the divided node to GPIO34. Add 100 nF from that node to GND. There is no DOUT connection in
      this circuit.
    - Join ESP32 GND, 5 V heater-supply GND and 4.5 V output-supply GND. Keep both external positive rails off USB/VIN/3V3
      and separate from each other.
    - Adafruit 4409 V+ -> separate regulated 4.5 V ±5%, GND -> common GND, signal -> GPIO26; 10 kΩ signal to GND
      keeps the input LOW during reset.
    - Separate 3 V battery + -> relay COM; NO -> 330 Ω -> red LED anode; cathode -> battery minus. NC unused. The
      contact load is separate from the ESP32 supply.
    - Before attaching GPIO34, check the divider values and output with a meter. Power USB first, then the heater/output
      supply; type d to disarm and switch both external rails off before USB to avoid back-power through a signal
      pin.
    - Complete the sensor conditioning procedure, observe the actual warm-up trend, and record stable reference
      conditions before typing b then a. No automatic delay proves stability.
