  faqs:
  - question: Can this replace a certified alarm?
    answer: No. Continue using approved smoke, fire and gas safety equipment; this circuit is an educational demonstration
      only.
  - question: Can I reuse an AOUT/DOUT breakout?
    answer: Not without its exact schematic, heater specification and verified output limits. This page supports
      the bare sensor circuit only; there is no DOUT wire.
  - question: When is the sensor ready?
    answer: Initial manufacturer conditioning and subsequent warm-up are different. Observe the actual baseline;
      elapsed time or typing b does not demonstrate stability, selectivity or calibration.
