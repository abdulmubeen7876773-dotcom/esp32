  - item: 10 kΩ load resistor RL; 12 kΩ and 10 kΩ divider resistors
    note: Divider resistors must be 1%; RL is separate from the 10 kΩ divider leg.
  - item: 100 nF ceramic capacitor
    note: At GPIO34 to common GND; filtering does not replace the divider.
  - item: Adafruit STEMMA non-latching relay, product 4409
    note: Documented 3 V logic-compatible, HIGH-active signal input; do not substitute an unknown active-LOW relay
      board.
  - item: 10 kΩ input pull-down; 3 V battery, red LED and 330 Ω resistor
    note: Pull-down from GPIO26/relay signal to GND. Separate battery LED load through COM/NO; NC unused. No fan
