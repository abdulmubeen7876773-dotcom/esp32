    note: Identify the H heater pair and A/B electrode pairs using the manufacturer lead-view drawing before wiring;
      no module DOUT is used.
  - item: Regulated 5.0 V ±0.1 V external supply, at least 500 mA
    note: Heater and sensing-loop supply only; never ESP32 VIN/USB. The 950 mW heater rating corresponds to about
