  code:
    filename: line-following-robot.ino
    content: |
      const int LEFT_SENSOR = 34;
      const int RIGHT_SENSOR = 35;

      const int L_IN1 = 16;
      const int L_IN2 = 17;
      const int R_IN1 = 18;
      const int R_IN2 = 19;

      // Calibrate these from your own dark line and light floor readings.
      const int LEFT_THRESHOLD = 1800;
      const int RIGHT_THRESHOLD = 1800;

      // Set false if your sensors produce lower values on the dark line.
      const bool LINE_IS_HIGH = true;

      bool isOnLine(int value, int threshold) {
        return LINE_IS_HIGH ? value > threshold : value < threshold;
      }

      void leftMotor(bool forward) {
        digitalWrite(L_IN1, forward ? HIGH : LOW);
        digitalWrite(L_IN2, forward ? LOW : HIGH);
      }

      void rightMotor(bool forward) {
        digitalWrite(R_IN1, forward ? HIGH : LOW);
        digitalWrite(R_IN2, forward ? LOW : HIGH);
      }

      void stopLeftMotor() {
        digitalWrite(L_IN1, LOW);
        digitalWrite(L_IN2, LOW);
      }

      void stopRightMotor() {
        digitalWrite(R_IN1, LOW);
        digitalWrite(R_IN2, LOW);
      }

      void stopMotors() {
        stopLeftMotor();
        stopRightMotor();
      }

      void setup() {
        Serial.begin(115200);
        analogReadResolution(12);
        pinMode(L_IN1, OUTPUT); pinMode(L_IN2, OUTPUT);
        pinMode(R_IN1, OUTPUT); pinMode(R_IN2, OUTPUT);
        stopMotors();
        Serial.println("ESP32 line follower ready");
        Serial.println("Record raw values over LINE and FLOOR before running motors.");
      }

      void loop() {
        int leftValue = analogRead(LEFT_SENSOR);
        int rightValue = analogRead(RIGHT_SENSOR);

        bool leftOnLine = isOnLine(leftValue, LEFT_THRESHOLD);
        bool rightOnLine = isOnLine(rightValue, RIGHT_THRESHOLD);

        if (leftOnLine && rightOnLine) {
          leftMotor(true);
          rightMotor(true);
        } else if (leftOnLine && !rightOnLine) {
          stopLeftMotor();
          rightMotor(true);
        } else if (!leftOnLine && rightOnLine) {
          leftMotor(true);
          stopRightMotor();
        } else {
          stopMotors();
        }

        Serial.printf("L:%4d %s | R:%4d %s\n",
                      leftValue, leftOnLine ? "LINE" : "FLOOR",
                      rightValue, rightOnLine ? "LINE" : "FLOOR");
        delay(40);
      }
  expected_output: |
    Serial Monitor should show raw left and right analog readings plus LINE or FLOOR labels, such as "L:2350 LINE | R: 900 FLOOR".

    With both sensors on the line the robot moves forward. With one sensor on the line it corrects toward that side. With both sensors on the floor it stops because the line is lost.
  common_mistakes:
  - text: Using the digital DO pin from the IR module while the sketch expects analog AO on GPIO34/GPIO35.
  - text: Treating LEFT_THRESHOLD and RIGHT_THRESHOLD starter values as universal instead of calibrating each sensor.
  - text: Expecting an ESP32 GPIO to power a DC motor directly.
  - text: Forgetting the shared ground/reference between ESP32 and the motor driver control side.
  - text: Testing floor movement before raw sensor readings and motor direction are verified.
  troubleshooting:
  - problem: Both sensors always read the same
    fix: Confirm the left AO wire goes to GPIO34 and the right AO wire goes to GPIO35, then test each sensor over the line and floor separately.
  - problem: Sensor readings barely change between black and white
    fix: Adjust sensor height, improve track contrast, avoid glossy material, and test under the same room lighting used for driving.
  - problem: Robot turns the wrong direction
    fix: If left LINE / right FLOOR makes the robot turn away from the line, swap the left/right sensor wires or reverse the correction actions.
  - problem: Robot oscillates left and right
    fix: Calibrate separate LEFT_THRESHOLD and RIGHT_THRESHOLD values, slow the robot mechanically, or add PWM speed control later.
  - problem: Robot loses the line on sharp curves
    fix: Use wider curves, lower motor speed as an upgrade, and keep the sensors close to the floor but not scraping.
  - problem: Readings change when room lighting changes
    fix: Re-test thresholds under real lighting, shade the sensors from direct sunlight, and avoid shiny track surfaces.
  - problem: One motor spins backwards
    fix: Reverse that motor's two output wires or swap its two motor-driver direction inputs; motor orientation varies by chassis.
  - problem: Motors run but ESP32 resets
    fix: Power motors through the driver from a suitable low-voltage motor supply and use common ground only as required by the module.
  - problem: Robot works while lifted but fails on the floor
    fix: Recheck traction, battery voltage under motor load, sensor height at driving height, and threshold values measured on the actual floor.
  upgrade_ideas:
