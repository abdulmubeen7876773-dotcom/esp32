  wiring:
    illustration_alt: Logical connection map for classic ESP32 WROOM, analog line sensors and Pololu TB6612FNG
      carrier with enable and supply connections
    image: /assets/visuals/projects/wiring/esp32-line-following-robot-tb6612-map.svg
    summary: This reference circuit uses a Pololu TB6612FNG carrier (#713) and a classic ESP32-WROOM board with
      GPIO16/17 free. It is a logical connection map, not a physical header layout or a hardware-tested build.
      L298N modules need their own enable and supply wiring.
    steps:
    - Disconnect USB and the separate motor supply before wiring. Leave motor power disconnected during sensor
      calibration.
    - Use documented 3.3 V-compatible analog reflectance modules. Connect their supply to 3V3 and grounds to
      GND; left AO to GPIO34, right AO to GPIO35. Do not use a 5 V AO signal or substitute DO-only modules.
    - Connect carrier VCC to ESP32 3V3 and all signal grounds together. VCC is the logic supply; VMOT is the
      separate motor supply.
    - Connect GPIO16 to AIN1, GPIO17 to AIN2, GPIO18 to BIN1 and GPIO19 to BIN2. This WROOM example is not for
      WROVER boards reserving GPIO16/17.
    - Connect PWMA, PWMB and STBY to the 3.3 V logic rail for this full-speed direction-only sketch. They must
      not float. There is no software PWM speed control or software standby in this example.
    - Connect the left motor to AO1/AO2 and the right motor to BO1/BO2. Motor mounting may require swapping that
      motor pair to make the forward command move forward.
    - With power off, connect the switched motor supply positive to VMOT and negative to carrier GND. Use a motor-rated
      4.5-6 V supply and compatible small motors. Verify documented stall current against the carrier rating
      (1 A continuous per channel); do not design around its brief peak-current number. Keep motor current out
      of ESP32/breadboard signal rails.
    - With only USB on, print line/floor readings and set both thresholds and sensor polarity. The loop already
      issues motor commands; motor supply stays off during calibration.
    - Lift the wheels before enabling motor power and keep its switch accessible. Hard-wired STBY does not provide
      a reset-time motor interlock. Verify start, steering and stop commands before floor testing.
