  faqs:
  - question: Why does my ESP32 line follower threshold not work?
    answer: The starter value is not universal. Print raw GPIO34/GPIO35 readings over the dark line and light floor,
      then choose separate LEFT_THRESHOLD and RIGHT_THRESHOLD values between your measured readings.
  - question: Can I use digital DO outputs instead of analog AO outputs?
    answer: Only with different code. This project uses analogRead() on GPIO34 and GPIO35 so you can calibrate raw
      sensor values. DO-only modules require digitalRead() logic.
  - question: Why does the robot turn the wrong way?
    answer: First confirm the left and right sensor readings in Serial Monitor. Then reverse one motor's direction
      or swap the relevant motor-driver outputs because chassis wiring and motor orientation vary.
  - question: Why does the motor driver not respond?
    answer: Confirm shared ground/reference, motor supply, and GPIO16-GPIO19 direction wiring. The ESP32 GPIO pins
      control the driver; they do not power the motors directly.
  - question: Why does the robot reset when motors start?
    answer: Motor startup current can pull the supply down. Use a separate motor supply with common ground and test
      sensor readings before enabling movement.
