  engineering_explanation: 'Raw counts are uncalibrated 12-bit codes, not volts or a physical quantity. analogReadMilliVolts
    uses the core ADC calibration path to estimate voltage at the divided pin; it is not independent system calibration
    or a voltmeter accuracy guarantee. Raw and mV use separate conversions. Classic ESP32 at 11 dB has a documented
    measurement range of about 150–3100 mV, distinct from 3.3 V logic. The sketch accepts only 250–2200 mV and rejects
    rail samples or more than 20 mV span within 32 samples. These are conservative lesson screening choices, not
    manufacturer sensor specifications. Slow drift and plausible wiring faults can pass.


    Vpin=Vout×Rb/(Rt+Rb). For Rt=15 kΩ and Rb=10 kΩ, ratio=0.4 nominal; with 1% resistors the largest ratio is 10.1/(14.85+10.1)=0.40481.
    Documented 3.0 V output gives at most 1.2145 V. A 5.0 V supply at +5% gives 5.25 V; even output-to-supply pass-through
    gives only 2.1253 V at the ADC. At the module maximum 5.5 V, the bound is 2.2265 V, below the classic 11 dB
    range ceiling around 3.1 V; the sketch rejects above 2.2 V. This bounded calculation is not protection from
    arbitrary supplies, miswiring or transients. The divider also pulls a disconnected signal wire low, but does
    not prove electrode health. Nominal module voltage is 2.5×pin voltage; resistor-ratio uncertainty alone is about
    ±1.2%, before ADC, loading and sensor errors. Endpoint records are ADC-pin values from this complete chain;
    changing any part invalidates them.'
  libraries:
  - text: Arduino-ESP32 3.3.2 built-in ADC APIs
    note: No DFRobot library or EEPROM dependency. Explicit recorded-point calculation, not library defaults.
  code:
    filename: esp32-soil-ph-monitor.ino
    content: "#include <Arduino.h>\n#include <math.h>\n// Classic ESP32-WROOM DevKit; Arduino-ESP32 3.3.2 review\
      \ baseline.\nconstexpr uint8_t SENSOR_PIN = 34; // ADC1 input only; no internal pull resistor.\n// AOUT --\
      \ 15k (1%) -- GPIO34 -- 10k (1%) -- GND; 100 nF GPIO34 to GND.\n// Raw and mV are separate conversions, averaged\
      \ over the same short window.\nfloat rawMean = 0, pinMv = 0;\nbool readWindow() {\n  uint32_t rawSum = 0,\
      \ mvSum = 0, minMv = 100000, maxMv = 0;\n  bool rails = false;\n  for (int i = 0; i < 32; ++i) {\n    uint16_t\
      \ raw = analogRead(SENSOR_PIN);\n    uint32_t mv = analogReadMilliVolts(SENSOR_PIN);\n    rawSum += raw; mvSum\
      \ += mv;\n    if (raw <= 16 || raw >= 4079) rails = true;\n    if (mv < minMv) minMv = mv;\n    if (mv > maxMv)\
      \ maxMv = mv;\n    delay(5);\n  }\n  rawMean = rawSum / 32.0f; pinMv = mvSum / 32.0f;\n  // Lesson screening,\
      \ not electrical protection or sensor-health proof.\n  return !rails && minMv >= 250 && maxMv <= 2200 && maxMv\
      \ - minMv <= 20;\n}\n\n// No measured endpoint data is supplied. Record YOUR ADC-pin mV with this chain.\n\
      constexpr bool CALIBRATION_RECORDED = false;\nconstexpr float PH7_PIN_MV = 0.0f, PH4_PIN_MV = 0.0f;\n// Use\
      \ buffer certificate values at the actual common measurement temperature.\nconstexpr float PH7_VALUE = 7.00f,\
      \ PH4_VALUE = 4.00f;\nbool validCalibration() {\n  return CALIBRATION_RECORDED && isfinite(PH7_PIN_MV) &&\
      \ isfinite(PH4_PIN_MV) &&\n    PH7_PIN_MV >= 250 && PH4_PIN_MV <= 2200 && PH4_PIN_MV - PH7_PIN_MV >= 100 &&\n\
      \    isfinite(PH7_VALUE) && isfinite(PH4_VALUE) &&\n    PH7_VALUE >= 6.5f && PH7_VALUE <= 7.5f && PH4_VALUE\
      \ >= 3.5f && PH4_VALUE <= 4.5f;\n}\nvoid setup() {\n  Serial.begin(115200);\n  analogReadResolution(12);\n\
      \  analogSetPinAttenuation(SENSOR_PIN, ADC_11db);\n  Serial.println(\"SEN0161-V2 limited-interval pH lesson;\
      \ no accuracy verification\");\n}\nvoid loop() {\n  bool valid = readWindow();\n  Serial.printf(\"raw_counts=%.1f\
      \ ADC_pin_mV_est=%.1f\\n\", rawMean, pinMv);\n  if (!valid) Serial.println(\"INVALID_SIGNAL: rail, range or\
      \ short-window noise; no pH\");\n  else if (!validCalibration()) Serial.println(\"CALIBRATION_REQUIRED: record\
      \ both stable buffer mV; no pH\");\n  else if (pinMv < PH7_PIN_MV || pinMv > PH4_PIN_MV)\n    Serial.println(\"\
      OUTSIDE_BUFFER_INTERVAL: no extrapolated pH\");\n  else {\n    float ph = PH7_VALUE + (pinMv - PH7_PIN_MV)\
      \ *\n      (PH4_VALUE - PH7_VALUE) / (PH4_PIN_MV - PH7_PIN_MV);\n    if (!isfinite(ph)) Serial.println(\"\
      INVALID_CALCULATION: no pH\");\n    else Serial.printf(\"pH_interpolated_est=%.2f; no temperature compensation\\\
      n\", ph);\n  }\n  delay(5000); // Reporting cadence, not a claim that the electrode stabilized.\n}\n"
  code_explanation: 'Acquisition diagnostics remain available before calibration. CALIBRATION_RECORDED defaults
    false and both pin-mV endpoints zero. Finite/range/separation checks precede division; interpolation is limited
    to the two buffers. Screening cannot establish sensor health: disconnected probes or stuck signals may look
    plausible.'
  expected_output: Serial prints raw_counts/ADC_pin_mV_est then CALIBRATION_REQUIRED with unset constants. After
    valid records an in-interval signal may print pH_interpolated_est; invalid/noisy/outside-buffer signals print
    rejection, not pH. These are prospective message types, not recorded measurements or proof of calibration.
  common_mistakes:
  - text: Treating driver mV or endpoint fitting as independent accuracy verification.
  - text: Changing module, divider or board without new records.
  - text: Clamping failed signals into plausible results.
  - text: Immersing electronics or altering powered wiring.
  troubleshooting:
  - problem: No calculated result
    fix: Read the named state; record both stable endpoints with the same circuit. Zero defaults deliberately fail;
      enabling the flag alone is insufficient.
  - problem: INVALID_SIGNAL
    fix: Power off; check module, common ground, divider and GPIO34. Rail/zero, outside 250–2200 mV or >20 mV within-window
      span is rejected. Do not force a result.
  - problem: OUTSIDE interval
    fix: Do not clamp or extrapolate. Recheck conditions and references; pH beyond the two-buffer interval requires
      a separately justified range.
  - problem: Plausible but stuck reading
    fix: A disconnected electrode, floating module input or stuck signal may look plausible. Use controlled references
      and independent instruments; software cannot prove connection/health.
  testing_checklist:
