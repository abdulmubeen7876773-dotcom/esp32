  faqs:
  - question: Does this establish sensor accuracy?
    answer: No. ADC calibration and two recorded endpoints do not independently validate accuracy, drift or sample
      preparation.
  - question: Does rejection detect every disconnected sensor?
    answer: No. It rejects obvious rail/range/noise problems, but a plausible voltage can still be faulty.
