  circuit_explanation: Power the identified module from a separate regulated 5.0 V supply, ±5%, not from a GPIO.
    Its documented supply range is 3.3–5.5 V and output envelope is 0–3.0 V. USB powers the ESP32; never join the
    two positive supply outputs. Module AOUT feeds 15 kΩ (1%) then GPIO34; 10 kΩ (1%) and 100 nF connect this node
    to GND. Grounds are common. This divider scales the signal, not the module supply. Power both sides together
    while connected; power off USB and module supply before rewiring. Never connect a bare electrode or unknown
