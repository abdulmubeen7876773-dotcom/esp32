  what_you_build: A Serial-only pH interpolation lesson for the DFRobot Gravity SEN0161-V2 board and its liquid
    probe. Raw ADC counts, ADC-pin millivolt estimates and calculated pH are separate. It does not report pH before
    valid two-buffer records, extrapolate beyond them, compensate temperature or claim laboratory accuracy. The
    overview is a logical illustration, not a photograph or recorded result.
  eli12: A probe needs an interface before an ADC can read it. Two known buffers set an approximate line, valid
    only within the recorded interval and matching conditions.
