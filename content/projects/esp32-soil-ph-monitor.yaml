  safety_badge: Low-voltage measurement lesson — unverified hardware
  configuration: 'With CALIBRATION_RECORDED=false, rinse and condition the probe according to its instructions,
    then place in fresh pH 7 buffer. Keep BNC/board dry. Observe repeated ADC_pin_mV_est windows and slow drift;
    record stable means, times and temperature. Repeat in a fresh pH 4 aliquot after rinsing. Enter YOUR pin-mV
    means in PH7_PIN_MV/PH4_PIN_MV and certified buffer pH at the common temperature in PH7_VALUE/PH4_VALUE; only
    then enable the flag. Do not copy nominal manufacturer voltages or worksheet numbers. The identified V2 has
    higher output in acid buffer; equal/reversed/very close points are rejected. A small short-window span does
    not prove equilibrium.


    pH = pH7 + (Vpin−V7)×(pH4−pH7)/(V4−V7). Coefficients come from your records, not a universal sensor formula.
    One point adjusts zero but cannot determine slope. Only interpolate within the two recorded endpoints. No temperature
    compensation is implemented: keep sample/buffers at the same recorded temperature and consult certificates;
    changed conditions require new records. Two-point fitting is not independent full-range accuracy verification.
    A separate check solution/reference instrument and uncertainty analysis would be needed.


    This is a liquid probe, not a dry-soil spear. Use a documented laboratory soil-water extract/slurry method,
    recording soil/water ratio, water type, mixing/settling time and temperature. No universal recipe or direct
    comparison of differing sample preparations is implied. Protect the glass bulb from solids and follow probe
    care/storage guidance. No fertilizer or crop-treatment advice.'
