  mission_title: Build a Sound-Triggered Relay Demo
  difficulty: Intermediate
  age: Ages 13+
  recommended_age: Ages 13+
  estimated_time: 90-120 min
  budget: Under 30 USD
  adult_supervision: Adult supervision required for relay modules. Use only low-voltage demo loads on the bench.
  classroom_use: Use to discuss sound thresholds, false triggers, and relay safety boundaries.
  parent_prompt: Ask whether the project recognizes words or only detects a loud sound peak.
  screen_free_activity: Draw the signal path from microphone samples to relay state.
  skills_practiced:
  - I2S microphone input
  - Peak threshold and quiet rearming
  - Documented active-HIGH relay control
  mini_experiments:
  - Print room-noise peaks and choose a threshold.
  - Clap once and watch the relay toggle.
  - Compare quiet-rearm and cooldown settings while observing false triggers.
  next_challenge: Add an explicit physical override button to the low-voltage LED demonstration.
  what_you_build: An offline loud-sound detector that toggles the supported active-HIGH relay and a GPIO25
    LED indicator. It compares INMP441 sample peaks with a configurable threshold; it does not recognize words.
    A quiet interval and cooldown separate triggers, but room echoes and noise can still affect detection.
  story: Read microphone samples, choose a threshold from your own Serial readings, and use the result to switch
    a separate battery-powered LED circuit.
  eli12: 'The microphone sends sound samples to the ESP32. The code looks for a big sound peak; when it sees
    one, it toggles the relay input and LED. The ESP32 is the decision maker: it reads one signal, compares
    it with simple rules, then changes an output you can see or hear.'
  parent_safety: Use only the 3 V battery/LED contact load described here. No mains, motors or heaters. Disconnect
    USB, relay supply and load battery before rewiring. This demonstration is not a certified or fail-safe
    controller.
  components:
  - item: Classic ESP32-WROOM DevKit and USB data cable
    note: Board pins must match the table.
    link: /components/esp32-devkit.html
  - item: INMP441 I2S microphone breakout
    note: 3.3 V power; L/R to GND; not a PDM microphone.
  - item: Adafruit STEMMA Non-Latching Mini Relay 4409 and 3-pin JST-PH cable
    note: Documented active-HIGH, 3.3 V signal input.
    link: /components/relay-module.html
  - item: External regulated 5 V supply
    note: At least 100 mA for the relay alone; negative shares ESP32 ground; do not connect +5 V to USB-powered
      DevKit rail.
  - item: 10 kΩ resistor
    note: Relay Signal pull-down to GND.
  - item: Two ordinary red LEDs, 220 ohm and 330 ohm resistors
    note: GPIO25 indicator uses 220 ohms; separate battery load uses 330 ohms.
  - item: Separate 3 V battery holder, breadboard and jumper wires
    note: Battery powers only the switched LED load.
  wiring:
    image: /assets/visuals/projects/wiring/esp32-voice-controlled-relay-wiring.svg
    illustration_alt: 'Logical INMP441 sound relay circuit: GPIO14 SCK, GPIO15 WS, GPIO32 SD with 100 kiloohm
      pull-down, microphone at 3.3 V and L/R to GND; supported STEMMA relay Signal on GPIO26 with 10 kiloohm
      pull-down; external 5 V control power; GPIO25 LED and separate 3 V switched LED'
    summary: This is a logical connection diagram, not physical pin placement. The microphone uses ESP32 3.3
      V; the supported relay uses external 5 V. Both control grounds are shared. The LED contact load has its
      own 3 V battery.
    steps:
    - Disconnect USB, the external relay supply and the load battery before wiring.
    - Connect microphone VDD/VCC to 3.3 V, GND and L/R to ESP32 GND. Connect SCK/BCLK to GPIO14, WS/LRCLK to
      GPIO15 and SD/DOUT to GPIO32. Add a 100 kΩ SD-to-GND pull-down if the breakout does not already provide
      one, following the microphone datasheet.
    - Connect GPIO25 through 220 ohms to the indicator LED anode; its cathode goes to ESP32 GND.
    - Connect the supported relay red Vin lead to regulated external +5 V; connect its black GND lead to that
      supply negative and ESP32 GND. Do not join external +5 V to the USB-powered DevKit 5 V pin.
    - Connect the relay white Signal lead to GPIO26. Add a 10 kΩ resistor between Signal and control-side GND
      to hold the command LOW while GPIO26 is not driven.
    - Wire the separate 3 V battery positive to COM. Wire NO through a 330 ohm resistor to the red LED anode;
      LED cathode returns to battery negative. Leave NC unused.
    - Initially leave the load battery disconnected. Upload the example, open Serial Monitor at 115200 baud
      and check the relay command and contact operation.
    - Disconnect all supplies before adding the battery. Reconnect and confirm that the LED lights only when
      the relay is commanded ON.
  gpio_map:
  - - INMP441 SCK / WS
    - GPIO14 / GPIO15
    - Output
    - Standard I2S bit/frame clocks
  - - INMP441 SD
    - GPIO32
    - Input
    - Left slot; 100 kΩ to GND if absent on breakout
  - - INMP441 VDD; L/R
    - 3.3 V; GND
    - Power / selection
    - 3.3 V breakout; select left channel
  - - STEMMA white Signal
    - GPIO26
    - Output
    - HIGH=ON; LOW=OFF; 10 kΩ to control GND
  - - STEMMA red Vin / black GND
    - External +5 V / supply − and ESP32 GND
    - Power
    - External +5 V must not join USB power rail
  - - Indicator LED
    - GPIO25 → 220 ohms → anode; cathode → GND
    - Output
    - HIGH lights indicator
  - - Separate switched LED
    - 3 V battery + → COM → NO → 330 ohms → LED → battery −
    - Contact circuit
    - NC unused; independent of control supply
  circuit_explanation: The INMP441 sends digital microphone samples over I2S. The code calculates a peak value
    and toggles GPIO26 when the peak crosses the threshold.
  engineering_explanation: Sound peaks do not identify words or reliably distinguish claps from dropped objects
    or relay clicks. Thresholds, quiet rearming and cooldown improve this demonstration but do not guarantee
    recognition. The relay contact state is not fed back; OFF is a software command, not proof of isolation
    or a fail-safe state.
  libraries:
  - name: esp32 by Espressif Systems 3.x
    note: ESP_I2S.h is included in the core. API signatures reviewed against 3.0.7 and current official documentation;
      not a compilation or latest-release claim.
  - name: Arduino IDE setup
    note: Choose the exact WROOM board (or ESP32 Dev Module for a generic WROOM DevKit), select port and use
      Serial Monitor at 115200 baud. No third-party microphone library.
  code:
    filename: esp32_sound_relay.ino
    content: "#include <Arduino.h>\n#include <ESP_I2S.h>\n\nI2SClass microphone;\nconstexpr uint8_t RELAY_PIN\
      \ = 26;  // STEMMA 4409: active HIGH only\nconstexpr uint8_t LED_PIN = 25;\nconstexpr int32_t CLAP_THRESHOLD\
      \ = 50000;\nconstexpr int32_t QUIET_THRESHOLD = 15000;\nconstexpr uint32_t QUIET_MS = 200;\nconstexpr\
      \ uint32_t COOLDOWN_MS = 750;\nstatic_assert(QUIET_THRESHOLD > 0 && QUIET_THRESHOLD < CLAP_THRESHOLD,\n\
      \              \"Quiet threshold must be positive and below trigger threshold\");\nbool relayOn = false;\n\
      bool audioReady = false;\nbool armed = false;\nuint32_t lastAboveQuiet = 0;\nuint32_t lastTrigger = 0;\n\
      uint32_t lastReport = 0;\nint32_t reportPeak = 0;\n\nvoid setRelay(bool on) {\n  relayOn = on;\n  digitalWrite(RELAY_PIN,\
      \ on ? HIGH : LOW);\n  digitalWrite(LED_PIN, on ? HIGH : LOW);\n}\n\nvoid stopOnAudioError() {\n  setRelay(false);\n\
      \  audioReady = false;\n  Serial.println(\"I2S error: relay OFF. Check wiring/settings, then reset.\"\
      );\n}\n\nvoid setup() {\n  pinMode(RELAY_PIN, OUTPUT);\n  pinMode(LED_PIN, OUTPUT);\n  setRelay(false);\n\
      \  Serial.begin(115200);\n  microphone.setPins(14, 15, -1, 32); // BCLK, WS, no TX data, RX data\n  microphone.setTimeout(100);\n\
      \  if (!microphone.begin(I2S_MODE_STD, 16000, I2S_DATA_BIT_WIDTH_32BIT,\n                        I2S_SLOT_MODE_MONO,\
      \ I2S_STD_SLOT_LEFT)) {\n    stopOnAudioError();\n    return;\n  }\n  // Drain startup data while the\
      \ INMP441 settles; keep the output OFF.\n  int32_t discard[256];\n  const uint32_t started = millis();\n\
      \  while (millis() - started < 300) {\n    if (microphone.readBytes(reinterpret_cast<char *>(discard),\
      \ sizeof(discard))\n        != sizeof(discard)) {\n      stopOnAudioError();\n      return;\n    }\n\
      \  }\n  lastAboveQuiet = lastTrigger = lastReport = millis();\n  audioReady = true;\n  Serial.println(\"\
      Ready: wait for quiet, then make a loud sound. Relay OFF.\");\n}\n\nvoid loop() {\n  if (!audioReady)\
      \ {\n    delay(100);\n    return; // Error remains latched; reset after correcting the cause.\n  }\n\
      \  int32_t samples[256];\n  const size_t count = microphone.readBytes(\n      reinterpret_cast<char *>(samples),\
      \ sizeof(samples));\n  if (count != sizeof(samples)) {\n    stopOnAudioError();\n    return;\n  }\n \
      \ int32_t peak = 0;\n  for (size_t i = 0; i < 256; ++i) {\n    // 24-bit signed I2S audio is in the high\
      \ bits of a 32-bit slot.\n    const int32_t value = samples[i] / 256;\n    const int32_t magnitude =\
      \ value < 0 ? -value : value;\n    if (magnitude > peak) peak = magnitude;\n  }\n  const uint32_t now\
      \ = millis();\n  if (peak >= QUIET_THRESHOLD) lastAboveQuiet = now;\n  else if (now - lastAboveQuiet\
      \ >= QUIET_MS) armed = true;\n\n  if (armed && peak > CLAP_THRESHOLD && now - lastTrigger >= COOLDOWN_MS)\
      \ {\n    setRelay(!relayOn);\n    armed = false;\n    lastTrigger = now;\n    Serial.printf(\"Relay:\
      \ %s\\n\", relayOn ? \"ON\" : \"OFF\");\n  }\n  if (peak > reportPeak) reportPeak = peak;\n  if (now\
      \ - lastReport >= 100) {\n    Serial.printf(\"Peak: %ld\\n\", static_cast<long>(reportPeak));\n    reportPeak\
      \ = 0;\n    lastReport = now;\n  }\n}\n"
  code_explanation: 'The modern ESP_I2S API receives left-slot, 32-bit standard-I2S frames at 16 kHz. INMP441
    audio is 24-bit signed data; division by 256 produces a bounded value for peak comparison without overflowing
    when taking its magnitude. The sketch continuously drains samples, prints the largest peak seen in each
    reporting interval, and rearms only after quiet.


    setRelay() gives the documented active-HIGH relay and GPIO25 indicator the same command. Initialization/read
    errors latch both OFF; full-length zero readings cannot prove the microphone is healthy. Hardware contact
    state is not sensed by the program.'
  expected_output: 'Serial Monitor at 115200 baud first says the relay is OFF, then reports Peak values approximately
    every 100 ms. After a quiet interval, an accepted loud sound prints Relay: ON and lights the GPIO25 indicator;
    the separate battery LED should also light through COM/NO. A later accepted sound prints Relay: OFF and
    both LEDs go dark. Actual peaks and detection reliability depend on the room and hardware; no acoustic
    measurements are claimed.'
  common_mistakes:
  - text: Calling clap detection full speech recognition.
  - text: Putting mains voltage on a breadboard.
  - text: Substituting an unidentified relay instead of the documented active-HIGH model.
  - text: Setting the threshold before measuring room noise.
  troubleshooting:
  - problem: ESP_I2S.h not found
    fix: Install/select esp32 by Espressif Systems 3.x. Do not mix this sketch with the legacy driver/i2s.h
      example.
  - problem: I2S error and relay stays OFF
    fix: Check supported board/core, VDD/GND, clock/data pins and breakout identity. Correct the issue, then
      reset; the error deliberately remains latched.
  - problem: Peaks remain zero or very small
    fix: Check 3.3 V power, L/R=GND, GPIO32 data and SD pull-down. Confirm this is an INMP441 standard-I2S
      breakout. Complete zero-valued reads alone cannot diagnose a failed microphone.
  - problem: Unwanted or missed triggers
    fix: Record your own quiet and deliberate-sound peaks; adjust both thresholds. Move microphone away from
      relay clicks and echoes. If the room never becomes quiet enough, it will not rearm.
  - problem: Indicator toggles but relay or load does not
    fix: Disconnect load power. Verify STEMMA 4409, external 5 V and shared control ground, then trace the
      separate battery COM/NO LED circuit. Do not substitute an unknown active-LOW module.
  - problem: ESP32 resets when switching
    fix: Check the relay external supply and ground connections. Keep +5 V separate from the USB-powered board
      rail and keep microphone wiring short.
  testing_checklist:
  - With the battery load disconnected, confirm an OFF command at startup.
  - Observe your own quiet-room and loud-sound peak ranges before choosing thresholds.
  - Confirm that continuous sound does not repeatedly toggle; allow a quiet interval between events.
  - Disconnect all power before attaching the specified low-voltage LED load; compare its state with Serial
    and the GPIO25 indicator.
  - These are reader checks to perform, not hardware tests reported as completed.
  engineer_tips:
  - Call it sound-triggered unless real speech recognition is added.
  - Keep microphone wires short.
  - Use enclosures and professionals for mains work.
  upgrade_ideas:
  - Add a physical override button and explicit default-OFF behavior.
  - Add an OLED showing relay command and peak level.
  - Experiment with a two-event timing pattern after understanding false triggers.
  - Use a dedicated speech-recognition implementation before describing a project as responding to spoken commands.
