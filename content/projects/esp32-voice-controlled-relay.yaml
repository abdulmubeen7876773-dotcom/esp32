title: ESP32 Sound-Triggered Relay Demo
category: Home Automation
description: Build a low-voltage ESP32 relay demo that reacts to loud sound peaks from an INMP441 I2S microphone.
  This is threshold-based sound triggering, not speech recognition.
meta_description: Build an ESP32 sound-triggered relay demo with an INMP441 I2S microphone, peak detection,
  and a low-voltage relay load. Not speech recognition.
