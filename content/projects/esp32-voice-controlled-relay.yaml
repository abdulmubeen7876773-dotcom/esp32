  faqs:
  - question: Is this speech recognition?
    answer: No. It compares loud-sound peaks with thresholds and cannot identify words.
  - question: Can I use a generic active-LOW relay board?
    answer: Not unchanged. This complete example is for STEMMA 4409. Verify a different module schematic, thresholds,
      supply and OFF state before designing an interface.
  - question: Does OFF guarantee that a load is safe?
    answer: No. The program commands OFF but cannot sense a welded contact, a failed driver or microphone health.
      Use only the stated battery LED demonstration.
  tutorial_flow: true
  assumptions: 'Classic ESP32-WROOM-32/32E DevKit with the named GPIOs exposed and unused; Arduino IDE 2.x
    and esp32 by Espressif Systems 3.x. Other ESP32 families need their own pin map. Serial Monitor: 115200
    baud.


    The complete example supports the Adafruit STEMMA Non-Latching Mini Relay (product 4409), with red Vin,
    black GND and white Signal leads. It is active HIGH and accepts a 3.3 V signal. Use a regulated external
    5 V supply rated at least 100 mA for this relay alone (about 50 mA energized per manufacturer). Do not
    substitute a latching relay or an unidentified active-LOW board. The generic page photo does not identify
    this supported model.


    Use an INMP441 standard I2S breakout at 3.3 V, with its L/R pin tied to GND for the left slot. Confirm
    its labels and onboard decoupling; a PDM microphone is not a substitute. Use only a separate 3 V battery
    supply, one ordinary red LED and a 330 ohm series resistor as the contact-side load. No mains, motors,
    heaters or unattended operation are covered. The contact-side battery circuit needs no connection to ESP32
    ground.


    Verification: documentation/API and code-path review only; not compiled for ESP32 or tested on hardware
    in this update.'
  configuration: 'CLAP_THRESHOLD=50000 and QUIET_THRESHOLD=15000 are starting values in shifted PCM counts,
    not measured noise levels or decibels. Record quiet-room peaks and deliberate sounds, then choose a trigger
    above normal noise and a lower quiet threshold. Keep 0 < QUIET_THRESHOLD < CLAP_THRESHOLD.


    The example needs 200 ms below the quiet threshold to rearm and at least 750 ms between accepted triggers.
    These are software settings, not proof of one trigger per real clap. Keep the microphone away from the
    relay click. Startup discards 300 ms of microphone data before measuring.'
  behavior:
  - - Reset / startup
    - Relay and indicator commanded OFF; Signal pull-down holds LOW while GPIO is not driven.
  - - Quiet for 200 ms
    - Detector can rearm; no toggle yet.
  - - Armed peak above CLAP_THRESHOLD after cooldown
    - Toggle relay and indicator once; disarm until a new quiet interval.
  - - Continuous loud input
    - Remain disarmed; do not repeatedly toggle from the same sustained sound.
  - - I2S initialization failure or incomplete read
    - Latch OFF with an error message; correct the cause and reset.
  - - Silent or disconnected microphone that still returns complete reads
    - Zero samples are not a reliable fault diagnosis; do not use this demonstration for safety control.
