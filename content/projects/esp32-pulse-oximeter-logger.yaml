  faqs:
  - question: Does this measure blood oxygen or pulse rate?
    answer: No. It logs raw red/IR sensor counts only. No saturation or beat algorithm is implemented.
  - question: Can I use any MAX30102 module?
    answer: No. This supported circuit uses MAXREFDES117#. Other carriers require their own documented power
      and signal-level review.
  complete:
    summary: Compare actual output with the CSV format and troubleshooting above. Documentation review does
