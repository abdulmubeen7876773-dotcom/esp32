  learning_outcomes:
  - Identify the supported MAXREFDES117# board and its VIN/host I2C pads.
  - Read red and IR counts from the same FIFO record.
  - Separate host receipt time from the sensor sample cadence.
  - Explain why this sketch outputs neither BPM nor SpO₂.
  mini_experiments:
  - Move a clean, nonconductive white card above the optical window and compare raw counts.
  - Record ambient-light conditions alongside a short capture; do not treat changes as biological measurements.
  next_challenge: Save the serial CSV and graph raw optical counts; do not add a saturation conversion without
    a separately reviewed algorithm and validation.
  what_you_build: A USB Serial CSV logger for paired red/IR optical counts, using a MAX30102 on the documented
    MAXREFDES117# board and a classic ESP32-WROOM DevKit. It produces no oxygen-saturation, heart-rate or finger-presence
    result. The historical pulse-oximeter URL is retained.
  story: ''
  eli12: Two LEDs illuminate a target in turn. A detector measures reflected light. The sensor digitizes each
    channel and stores paired readings in a queue; the ESP32 copies those numbers to Serial Monitor.
  parent_safety: 'Use only the identified low-voltage board and disconnect USB before rewiring. Do not use
    this logger for diagnosis, health reassurance, screening or emergency decisions. No skin contact is needed:
    use a nonconductive card as the optical target. Do not press objects onto or damage the optical window.'
  safety_standards:
  - No medical measurement or calibrated light-intensity result is implemented.
  - Use MAXREFDES117# VIN at 3.3 V and host-side I2C at 3.3 V. An unknown MAX30102 breakout is not an interchangeable
    board.
  - Keep supplies off while wiring. No electrodes or conductive body connections are part of this optical exercise.
  components:
  - item: Classic ESP32-WROOM DevKit
    note: USB-powered; exposed GPIO21/GPIO22; Arduino-ESP32 3.3.2 review baseline.
    link: /components/esp32-devkit.html
  - item: Analog Devices / Maxim MAXREFDES117#
    note: Identified reference board containing MAX30102, MAX1921 regulator and MAX14595 host level translator.
      Not a bare MAX30102 IC or unidentified clone.
  - item: Short jumper wires and USB data cable
    note: Connect labelled pads; use the board documentation, not the logical diagram as a physical pin-order
      drawing.
  - item: Clean nonconductive white card
    note: Optional reflected-light target; no medical probe or body connection.
  wiring:
    full_size_link: true
    illustration_alt: 'Logical MAXREFDES117# to classic ESP32 I2C wiring: VIN 3V3, GND, SDA GPIO21 and SCL
      GPIO22; INT unconnected.'
    summary: Use the genuine MAXREFDES117# host-side VIN/GND/SDA/SCL pads. This example powers VIN from ESP32
      3V3, so the host bus is in the 3.3 V domain; INT is unused. It does not cover an unidentified MAX30102
      carrier.
    steps:
    - Disconnect USB and confirm the board identity and pad labels against the manufacturer documentation.
    - Connect MAXREFDES117# VIN to ESP32 3V3 and GND to GND. Do not connect 3.3 V directly to the bare sensor's
      1.8 V VDD.
    - Connect host-side SDA to GPIO21 and SCL to GPIO22. Use the reference board's host-level interface, not
      internal 1.8 V sensor nets. Leave INT unconnected.
    - 'Inspect idle host bus levels and pull-ups for a substituted board before connecting it: ESP32 GPIO is
      not 5 V tolerant. This wiring is not an endorsement of generic clone modules.'
    - Install SparkFun MAX3010x Pulse and Proximity Sensor Library version 1.1.2 in Arduino IDE, select the
      classic ESP32 board/core 3.3.2 and upload the complete sketch below.
    - Open Serial Monitor at 115200 baud. Hold a card above the window and log raw counts. No body contact
      or health interpretation is required.
  gpio_map:
  - signal: MAXREFDES117# VIN
    esp32_pin: 3V3
    direction: Power
    notes: Reference-board input only; its regulator supplies the sensor core.
  - signal: MAXREFDES117# GND
    esp32_pin: GND
    direction: Ground
    notes: Common reference.
  - signal: Host SDA
    esp32_pin: GPIO21
    direction: Bidirectional I2C
    notes: 3.3 V host-level bus; sensor address 0x57.
  - signal: Host SCL
    esp32_pin: GPIO22
    direction: I2C clock
    notes: 100 kHz in this sketch.
  - signal: INT
    esp32_pin: Not connected
    direction: Unused
    notes: FIFO is polled; no interrupt wire.
  circuit_explanation: The selected reference board separates the sensor's 1.8 V core supply from its LED supply
    and translates the I2C interface to the host side. Powering a generic pad labelled VCC does not prove it
    includes those circuits. Check the actual board before substitution.
  engineering_explanation: Each value is a dimensionless sensor ADC count, not percent oxygen saturation, BPM,
    lux or a calibrated blood measurement. LED current, target distance, ambient light and configuration affect
    the counts. A single IR/red ratio is not a saturation algorithm, and clipping a guessed answer to 70–100
    cannot validate it. No such calculation remains. The 411 μs setting selects 18-bit sensor data (nominal
    digital range 0–262143); full-scale counts indicate clipping, not a valid physiological result.
  libraries:
  - name: Arduino-ESP32 3.3.2
    note: Classic ESP32-WROOM review baseline; Wire on GPIO21/22. No claim that this is the latest core.
  - name: SparkFun MAX3010x Pulse and Proximity Sensor Library 1.1.2
    note: Install this exact version. MAX30105 is its driver class name; MAX30102 uses red/IR mode 2, without
      a green channel. No heartRate or SpO₂ helper is included.
  code:
    filename: esp32-pulse-oximeter-logger.ino
    content: "// Classic ESP32-WROOM DevKit; Arduino-ESP32 3.3.2.\n// MAXREFDES117# (MAX30102); SparkFun MAX3010x\
      \ library 1.1.2.\n// Raw optical counts only: no BPM, oxygen saturation or finger-validity test.\n#include\
      \ <Wire.h>\n#include \"MAX30105.h\"\n\nMAX30105 sensor; // This library class also supports MAX30102\
      \ red/IR mode.\nbool ready = false;\nuint32_t lastDataMs = 0;\n\nvoid setup() {\n  Serial.begin(115200);\n\
      \  if (!Wire.begin(21, 22)) {\n    Serial.println(\"# ERROR: I2C initialization failed; no samples emitted.\"\
      );\n    return;\n  }\n  Wire.setTimeOut(50);\n  if (!sensor.begin(Wire, I2C_SPEED_STANDARD)) {\n    Serial.println(\"\
      # ERROR: sensor ID not found at 0x57; check power/wiring, then reset.\");\n    return;\n  }\n  // LED\
      \ amplitude, FIFO averaging, red+IR, samples/s, pulse width us, ADC range nA.\n  sensor.setup(0x1F, 1,\
      \ 2, 50, 411, 4096);\n  lastDataMs = millis();\n  ready = true;\n  Serial.println(\"host_ms,red_counts,ir_counts\"\
      );\n}\n\nvoid loop() {\n  if (!ready) { delay(10); return; }\n  sensor.check();\n  while (sensor.available())\
      \ {\n    // Both channels come from the same queued FIFO record.\n    uint32_t red = sensor.getFIFORed();\n\
      \    uint32_t ir = sensor.getFIFOIR();\n    sensor.nextSample();\n    uint32_t hostMs = millis();\n \
      \   lastDataMs = hostMs;\n    Serial.printf(\"%lu,%lu,%lu\\n\", (unsigned long)hostMs,\n            \
      \      (unsigned long)red, (unsigned long)ir);\n  }\n  if ((uint32_t)(millis() - lastDataMs) >= 2000)\
      \ {\n    ready = false;\n    Serial.println(\"# ERROR: no fresh FIFO records for 2 s; logging stopped.\
      \ Inspect, then reset.\");\n  }\n}\n"
  code_explanation: The sketch configures red+IR at 50 sensor records/s with no FIFO averaging, 411 μs integration
    and ADC range setting 4096 nA. It drains paired FIFO records without an intentional sampling delay. host_ms
    is the ESP32 receipt timestamp, not an exact optical acquisition timestamp. Failure to identify the device
    emits an error and no rows. Two seconds without new FIFO records stops logging until reset. The driver
    does not supply a complete per-record integrity/overflow validity result; this is not lossless acquisition
    or a verified fault detector. Long host pauses can lose records in its small software buffer. A repeated
    number or zero is not a finger-validity result.
  expected_output: 'Serial Monitor first shows host_ms,red_counts,ir_counts, then decimal CSV rows from received
    samples. Values depend on the actual target and setup; no numeric readings or trace are supplied as test
    evidence. Ambient/background readings are retained. There is no BPM, SpO₂, percent sign or forced plausible
    measurement. Lines beginning # ERROR are diagnostics, not CSV samples.'
  common_mistakes:
  - text: Using getRed() and getIR() as proof of a calibrated oxygen reading.
  - text: Substituting an unknown 5 V or 1.8 V bus carrier without checking its schematic.
  - text: Treating a response at 0x57 as proof of the exact module identity.
  - text: Blocking the polling loop and assuming all samples were retained.
  troubleshooting:
  - problem: Device not found
    fix: Power off; check VIN/GND, host SDA/SCL orientation, 3.3 V logic and library version. The shared part
      ID also cannot distinguish MAX30102 from MAX30105; verify markings/documentation.
  - problem: No fresh FIFO records
    fix: Logging deliberately stops after the timeout. Inspect wiring and power with USB off, then reset; do
      not fill the CSV with fabricated zero samples.
  - problem: Counts sit near a rail or change unexpectedly
    fix: Check target distance, ambient light and selected LED settings. Do not infer SpO₂ or adjust a formula
      to make numbers look plausible.
  - problem: CSV has time gaps
    fix: Close other serial programs and avoid adding blocking work. Host timestamps expose receipt gaps, but
      do not certify continuity or sensor sampling precision.
  testing_checklist:
  - Confirm the exact board/pad identity before applying power.
  - Verify host bus voltage before substituting any board.
  - Check that output contains paired raw counts and no medical estimates.
  - Disconnect the sensor with power off, then confirm startup reports failure rather than sample rows.
  - These are checks to perform; no hardware test is recorded.
  engineer_tips:
  - Keep raw records and configuration together.
  - Use a card target for an electronics lesson.
  - Do not call raw-data collection calibration or physiological validation.
  upgrade_ideas:
  - Plot CSV offline while preserving host timestamps.
  - Review buffering/overflow handling separately before doing timing-sensitive signal analysis.
  real_world_applications:
  - Reflectance-sensing lesson
  - I2C FIFO acquisition practice
