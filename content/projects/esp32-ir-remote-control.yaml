  circuit_explanation: The TSOP38238 receiver demodulates 38 kHz infrared light into digital pulses on GPIO15. On
    transmit, GPIO4 switches the 2N2222 transistor, and the transistor pulses the IR LED through its current-limiting
    resistor. The 680 Ω base resistor limits GPIO current; 100 kΩ holds the transistor OFF during reset. The 220
    Ω emitter resistor bounds LED current below 23.5 mA even if LED and transistor voltage drops are ignored at
    5.1 V and -1% resistance. Actual current is lower and must be checked on the build; this is not a maximum-range
    transmitter.
  engineering_explanation: Consumer remotes encode address and command values inside timed IR pulse patterns. This
    sketch logs the decoded protocol, address, and command for study, then stores and retransmits NEC commands only.
    Unsupported protocols can still be observed in Serial Monitor, but they are not replayed by this beginner sketch.
    IR also needs line of sight, correct LED polarity, and a compatible target device.
