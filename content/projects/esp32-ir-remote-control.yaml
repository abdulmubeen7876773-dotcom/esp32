  beginner:
    level: beginner
    overview_html: <p>A safe receive-and-send IR learning demo for consumer-device education. Use IR for safe consumer devices
      only. Do not use it to bypass access-control systems. Drive stronger IR LEDs through a transistor, not directly from
      GPIO.</p>
    components:
    - ESP32 DevKit board
    - TSOP38238 IR receiver
    - 940 nm IR LED
    - 2N2222 NPN transistor
    - Resistors
    - Breadboard and jumper wires
    wiring:
    - - TSOP38238 OUT
      - GPIO15
      - IR receive data; boot strap pin, avoid external pull conflicts.
    - - IR LED driver
      - GPIO4
      - Controls transistor base through resistor.
    key_concepts:
    - The TSOP receiver demodulates 38 kHz IR into digital pulses. The transmitter uses GPIO4 to switch a transistor that
      pulses the IR LED.
    - IR protocols vary. This sketch stores and retransmits NEC commands only; unsupported protocols can still be logged for
      study.
    applications: &id003
    - Consumer remote protocol lesson
    - IR receiver test fixture
    - Line-of-sight communication demo
    troubleshooting:
    - - No receive data
      - Check receiver pinout and aim the remote close to the sensor.
    - - Protocol UNKNOWN
      - The remote may use an unsupported or complex protocol; inspect raw output.
    - - Transmit does not work
      - Check IR LED polarity, transistor wiring, and whether the appliance uses NEC.
    improvements: &id002
    - Store learned NEC codes in Preferences.
    - Add OLED display for the last decoded command.
    - Add a web page after local transmit works.
    code: |
      // ESP32 IR receive-and-send learning demo
      // Learn codes from your own remote before transmitting.
      #include <IRremote.hpp>

      const int IR_RECV_PIN = 15;
      const int IR_SEND_PIN = 4;

      uint16_t learnedAddress = 0;
      uint16_t learnedCommand = 0;
      decode_type_t learnedProtocol = UNKNOWN;
      bool hasLearnedCode = false;

      void sendLearnedCodeIfRequested() {
        if (!Serial.available()) return;

        char c = Serial.read();
        if ((c == 's' || c == 'S') && hasLearnedCode && learnedProtocol == NEC) {
          IrSender.sendNEC(learnedAddress, learnedCommand, 2);
          Serial.println("Sent learned NEC command.");
        } else if (c == 's' || c == 'S') {
          Serial.println("Learn an NEC code before sending.");
        }
      }

      void setup() {
        Serial.begin(115200);
        IrReceiver.begin(IR_RECV_PIN, ENABLE_LED_FEEDBACK);
        IrSender.begin(IR_SEND_PIN);
        Serial.println("IR demo ready. Point a safe consumer remote at the receiver.");
      }

      void loop() {
        sendLearnedCodeIfRequested();

        if (!IrReceiver.decode()) return;

        Serial.println("IR signal received");
        Serial.print("Protocol: ");
        Serial.println(getProtocolString(IrReceiver.decodedIRData.protocol));
        Serial.print("Address: 0x");
        Serial.println(IrReceiver.decodedIRData.address, HEX);
        Serial.print("Command: 0x");
        Serial.println(IrReceiver.decodedIRData.command, HEX);

        if (IrReceiver.decodedIRData.protocol == NEC) {
          learnedProtocol = NEC;
          learnedAddress = IrReceiver.decodedIRData.address;
          learnedCommand = IrReceiver.decodedIRData.command;
          hasLearnedCode = true;
          Serial.println("Stored NEC code. Type s in Serial Monitor to send it.");
        } else {
          Serial.println("This sketch retransmits NEC only. Use raw examples for other protocols.");
        }

        IrReceiver.resume();
      }
    code_filename: esp32-ir-remote-control-beginner.ino
