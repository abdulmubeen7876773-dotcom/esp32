  wiring:
    illustration_alt: Build an ESP32 IR Learning Remote Demo wiring diagram
    summary: TSOP38238 OUT goes to GPIO15 for receive data. GPIO4 drives a transistor stage for the IR LED transmitter, so
      the ESP32 controls the LED without sourcing LED current directly from the GPIO.
    steps:
    - Unplug USB before wiring.
    - Connect TSOP38238 VCC to 3.3 V, GND to GND, and OUT to GPIO15.
    - Connect GPIO4 through a base resistor to the 2N2222 base.
    - Wire the IR LED and current-limiting resistor through the transistor driver, observing LED polarity.
    - Keep the receiver window aimed at the handheld remote during learning.
    - Keep the IR LED aimed at the same safe consumer device during replay.
    - Upload the sketch and open Serial Monitor.
  gpio_map:
  - signal: TSOP38238 OUT
    esp32_pin: GPIO15
    direction: Input
    notes: IR receive data; boot strap pin, avoid external pull conflicts.
  - signal: IR LED driver
    esp32_pin: GPIO4
    direction: Output
    notes: Controls transistor base through resistor.
  circuit_explanation: The TSOP38238 receiver demodulates 38 kHz infrared light into digital pulses on GPIO15. On transmit,
    GPIO4 switches the 2N2222 transistor, and the transistor pulses the IR LED through its current-limiting resistor.
  engineering_explanation: Consumer remotes encode address and command values inside timed IR pulse patterns. This sketch
    logs the decoded protocol, address, and command for study, then stores and retransmits NEC commands only. Unsupported
    protocols can still be observed in Serial Monitor, but they are not replayed by this beginner sketch. IR also needs line
    of sight, correct LED polarity, and a compatible target device.
  libraries:
  - name: IRremote
    note: Install Arduino-IRremote library.
