  faqs:
  - question: Will this ESP32 IR remote control every appliance?
    answer: No. This beginner sketch stores and replays NEC commands only. Many appliances use other protocols,
      repeat frames, or timing details that need separate handling.
  - question: Can I copy any remote?
    answer: Only learn and replay codes for safe consumer devices you own and are allowed to control. Do not use
      the project to bypass access-control, security, or safety systems.
  - question: Why use a transistor for the IR LED?
    answer: IR LEDs often need more pulse current than an ESP32 GPIO should provide directly. The transistor lets
      GPIO4 control the LED while the LED current flows through the driver stage.
  - question: Why does IR transmit fail even after learning a code?
    answer: Check line of sight, IR LED polarity, target compatibility, and whether the learned protocol is NEC.
      Bright light and poor aiming can also reduce range.
