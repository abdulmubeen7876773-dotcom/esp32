  wiring:
    full_size_link: true
    illustration_alt: Build an ESP32 IR Learning Remote Demo wiring diagram
    summary: TSOP38238 OUT goes to GPIO15 for receive data. GPIO4 drives a transistor stage for the IR LED transmitter,
      so the ESP32 controls the LED without sourcing LED current directly from the GPIO.
    steps:
    - Disconnect both supplies before wiring. Use the manufacturer package views; this is a logical circuit, not
      a lead-orientation photograph.
    - 'Bare Vishay TSOP38238: pin 3 VS -> ESP32 3V3; pin 2 GND -> common GND; pin 1 OUT -> GPIO15. Add 100 nF across
      VS/GND near the receiver. Do not infer another receiver/module pin order.'
    - GPIO4 -> 680 Ω -> P2N2222A base (2); 100 kΩ from base (2) to emitter (3). Emitter -> common GND.
    - External regulated 5.0 V ±0.1 V -> 220 Ω -> TSAL6200 anode; LED cathode -> transistor collector (1). GPIO4
      supplies only base current.
    - Join external supply GND and ESP32 GND; keep external +5 V off board power pins. Power USB before the external
      rail, and switch the external rail off first.
    - GPIO15 is a strapping pin; do not attach a receiver board with a conflicting reset pull. Check boot with the
      documented circuit attached.
    - Aim the receiver at your own safe consumer remote; aim the emitter at that device for NEC replay. Upload and
      open Serial Monitor at 115200 baud.
