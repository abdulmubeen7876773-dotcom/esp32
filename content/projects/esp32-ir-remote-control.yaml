  faqs:
  - question: Will it control every appliance?
    answer: No. Protocols and timings vary.
  - question: Can I copy any remote?
    answer: Only learn and replay codes for devices you own and are allowed to control.
  - question: Why use a transistor?
    answer: IR LEDs often need more pulse current than an ESP32 pin should provide directly.
