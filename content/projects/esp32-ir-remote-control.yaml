  what_you_build: A safe ESP32 IR remote control learning demo that receives consumer remote codes with a TSOP38238 module,
    stores one NEC address and command in memory, and replays that learned NEC command through a transistor-driven IR LED.
  story: This project receives real IR codes and can replay learned NEC commands from devices you own. It is a learning
    remote for line-of-sight consumer electronics, not a universal compatibility promise or access-control bypass tool.
  eli12: A remote blinks invisible light in patterns. The receiver turns those patterns into numbers, and the ESP32 can blink
    an IR LED with the same pattern.
  parent_safety: Use IR for safe consumer devices you own, such as a classroom TV or spare media remote. Do not use it to
    bypass access-control systems. Drive the IR LED through a transistor stage, not directly from an ESP32 GPIO. Unplug USB
    and external power before rewiring.
