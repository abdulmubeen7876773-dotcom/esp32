  code_explanation: The sketch decodes any received IR signal, prints the protocol, address, and command, stores NEC
    address/command values, and then checks Serial Monitor for s or S on every loop so the learned NEC command can be sent
    after learning.
  expected_output: Serial Monitor shows protocol, address, and command whenever a remote signal is received. If the protocol
    is NEC, the sketch stores the command. After that, type s in Serial Monitor to retransmit the learned NEC command toward
    the same safe consumer device.
  common_mistakes:
  - text: Expecting universal compatibility from a beginner NEC replay sketch.
  - text: Driving a high-current IR LED directly from GPIO instead of using the transistor driver.
  - text: Using IR to bypass access systems or devices you are not allowed to control.
  - text: Forgetting that IR needs line of sight between remote, receiver, transmitter, and target device.
  - text: Reversing the IR LED polarity or aiming the LED away from the appliance.
  troubleshooting:
  - problem: No receive data
    fix: Check the TSOP38238 pinout, confirm OUT is on GPIO15, and aim the handheld remote directly at the receiver window.
  - problem: Protocol UNKNOWN
    fix: The remote may use an unsupported or complex protocol. Use the Serial output for study, but replay only works for
      stored NEC commands in this sketch.
  - problem: Transmit does not work
    fix: Check IR LED polarity, transistor wiring, line of sight, and whether the target appliance responds to the learned
      NEC command.
  - problem: Typing s does nothing
    fix: Learn a NEC command first, keep Serial Monitor focused at 115200 baud, and type s or S after the sketch prints that
      it stored the NEC code.
  testing_checklist:
  - Decode a known consumer remote.
  - Learn one NEC command.
  - Send only toward the same safe device.
  engineer_tips:
  - Test in moderate lighting.
  - Keep examples to owned consumer devices.
  - Label learned codes by device and button.
