  code_explanation: Camera setup is explicit QVGA JPEG with one frame buffer and PSRAM/DRAM selection. Missing or
    unexpected frames produce HTTP errors and buffers are returned. /capture sends binary JPEG bytes with explicit
    length through WebServer, not a String or zero-terminated text. Synchronous network writes can occupy the loop;
    this is not a real-time capture server. Wi-Fi connection attempts use 15-second windows, 30-second gaps and
    at most three attempts per outage, then require user correction/reset. Successful reconnection prints the current
    IP; no endless startup while-loop hides failure.
  expected_output: 'Serial should print initialization information and a local IP only after association succeeds.
    A browser request to /capture should display one JPEG of the current test target or receive an error. Verify
    actual HTTP status in browser network tools and image completeness separately: a response body, a call to send(),
    or an IP print is not proof of complete delivery. No captured image or measured rate from this setup is supplied.'
  common_mistakes:
  - text: Leaving IO0 connected to GND after upload.
  - text: Powering ESP32-CAM from a weak USB serial adapter.
  - text: Selecting the wrong camera model in code.
  - text: Using high resolution before confirming basic capture.
  - text: Touching the camera ribbon cable while powered.
  troubleshooting:
  - problem: Upload waits for connection
    fix: Power off and verify crossed 3.3 V UART, common ground and port. Fit IO0→GND, power up and press RST before
      retrying upload. Do not infer UART voltage from a supply jumper.
  - problem: Bootloader messages repeat after upload
    fix: Power off, remove the IO0 jumper and restart with RST. GPIO0 must be available for camera XCLK in run mode.
  - problem: Brownout or camera init error
    fix: Record the printed error code. Disconnect power before checking board identity, camera orientation/ribbon
      latch, supply/regulator and short return leads. A higher current label alone does not diagnose the fault;
      do not disable brownout protection.
  - problem: Unexpected sensor or missing PSRAM
    fix: Use only the identified OV2640/AI-Thinker arrangement. Check board profile and PSRAM setting. The QR example
      stops without PSRAM; the QVGA JPEG checks use explicit one-buffer DRAM fallback. Do not substitute another
      camera map blindly.
  - problem: No local IP or attempts exhausted
    fix: Use 2.4 GHz credentials, inspect Serial and network reachability. After three failures fix the cause and
      reset; do not wait indefinitely or publish credentials.
  - problem: IP works but /capture fails
    fix: Inspect actual HTTP status and Serial camera errors; verify OV2640 configuration and power before increasing
      resolution. Check LAN isolation separately.
  testing_checklist:
  - 'Documentation/API review only: no compilation or camera hardware operation recorded for this sketch.'
  - Check exact board/sensor, UART signal level, regulator input and supply wiring with power off.
  - Record upload, boot, initialization and actual output separately. Upload completion alone is not camera-function
    evidence.
  engineer_tips:
  - Start with the official CameraWebServer example.
  - Use 5 V power with enough current headroom.
  - Avoid high frame rate expectations; ESP32-CAM is not a full CCTV system.
  - Keep camera ribbon cable fully seated and locked.
  - Test on a local network before exposing anything outside your LAN.
  performance_tips:
  - Use lower resolution for faster capture.
  - Reduce JPEG quality number carefully; smaller files use less network time.
  - Store images only when motion or a timer requires it.
  - Keep Wi-Fi signal strong to reduce failed transfers.
