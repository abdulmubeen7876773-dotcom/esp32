levels:
  beginner:
    level: beginner
    overview_html: <p>A trusted-LAN STA-mode snapshot server. Open its Serial-printed local IP, then request one
      JPEG at /capture. There is no video stream, OTA, SD recording, face detection, authentication or cloud service.
      Keep the existing camera illustration separate from any claim of a working physical build.</p>
    components:
    - Documented AI-Thinker classic ESP32-CAM with OV2640
    - USB–UART adapter with verified 3.3 V TTL signals
    - Regulated 5 V / 2 A current-capable external supply and short leads
    - USB data cable, removable IO0 jumper and accessible RST button
    wiring:
    - - Programmer TX / RX
      - U0R GPIO3 / U0T GPIO1
      - Cross TX→RX; 3.3 V TTL only. Not RS-232 or 5 V UART.
    - - External regulated supply
      - 5V / GND
      - Board regulator input, not chip/GPIO voltage. Adapter positive outputs NC.
    - - Upload strap / camera clock
      - GPIO0 → GND for reset into upload only
      - Remove strap with power off and reset to run.
    - - OV2640 D0…D7
      - 5, 18, 19, 21, 36, 39, 34, 35
      - Onboard ribbon/internal wiring; do not externally rewire.
    - - OV2640 XCLK/PCLK/VSYNC/HREF
      - 0 / 22 / 25 / 23
      - AI-Thinker only, not WROVER-KIT or S3 map.
    - - OV2640 SCCB SDA/SCL
      - 26 / 27
      - Modern pin_sccb_sda/pin_sccb_scl API names.
    - - Camera PWDN / RESET
      - 32 / -1
      - Board RST resets the ESP32; camera reset=-1 is not the upload reset button.
    key_concepts:
    - 'The manufacturer V1.0 board specification lists a 5 V supply and external PSRAM; the ESP32 and UART remain
      in the 3.3 V signal domain. This does not establish the regulator or pinout of an unmarked clone. JPEG QVGA
      (320×240), one buffer, can use the driver''s low-resolution DRAM path when PSRAM is unavailable. Grayscale
      QR capture explicitly requires PSRAM here. More buffers/resolution are not free upgrades: upstream recommends
      multiple frame buffers only with JPEG. No frame rate or memory availability is guaranteed.'
    applications: &id002
    - Manual local snapshot experiment
    troubleshooting:
    - - Upload waits for connection
      - Power off and verify crossed 3.3 V UART, common ground and port. Fit IO0→GND, power up and press RST before
        retrying upload. Do not infer UART voltage from a supply jumper.
    - - Bootloader messages repeat after upload
      - Power off, remove the IO0 jumper and restart with RST. GPIO0 must be available for camera XCLK in run mode.
    - - Brownout or camera init error
      - Record the printed error code. Disconnect power before checking board identity, camera orientation/ribbon
        latch, supply/regulator and short return leads. A higher current label alone does not diagnose the fault;
        do not disable brownout protection.
    - - Unexpected sensor or missing PSRAM
      - Use only the identified OV2640/AI-Thinker arrangement. Check board profile and PSRAM setting. The QR example
        stops without PSRAM; the QVGA JPEG checks use explicit one-buffer DRAM fallback. Do not substitute another
        camera map blindly.
    - - No local IP or attempts exhausted
      - Use 2.4 GHz credentials, inspect Serial and network reachability. After three failures fix the cause and
        reset; do not wait indefinitely or publish credentials.
    - - IP works but /capture fails
      - Inspect actual HTTP status and Serial camera errors; verify OV2640 configuration and power before increasing
        resolution. Check LAN isolation separately.
    improvements: &id001
    - Streaming, recording and OTA are separate implementations, not features of this sketch.
    code: "// AI-Thinker classic ESP32-CAM + OV2640 only; Arduino-ESP32 3.3.2.\n// The board takes regulated 5 V\
      \ at 5V; UART signals must be 3.3 V.\n#include <Arduino.h>\n#include \"esp_camera.h\"\n\nbool initCamera(bool\
      \ grayscale) {\n  if (grayscale && !psramFound()) {\n    Serial.println(\"Grayscale example requires enabled\
      \ PSRAM; stopped\");\n    return false;\n  }\n  camera_config_t c = {};\n  c.ledc_channel = LEDC_CHANNEL_0;\n\
      \  c.ledc_timer = LEDC_TIMER_0;\n  c.pin_d0 = 5; c.pin_d1 = 18; c.pin_d2 = 19; c.pin_d3 = 21;\n  c.pin_d4\
      \ = 36; c.pin_d5 = 39; c.pin_d6 = 34; c.pin_d7 = 35;\n  c.pin_xclk = 0; c.pin_pclk = 22; c.pin_vsync = 25;\
      \ c.pin_href = 23;\n  c.pin_sccb_sda = 26; c.pin_sccb_scl = 27;\n  c.pin_pwdn = 32; c.pin_reset = -1;\n  c.xclk_freq_hz\
      \ = 20000000;\n  c.pixel_format = grayscale ? PIXFORMAT_GRAYSCALE : PIXFORMAT_JPEG;\n  c.frame_size = FRAMESIZE_QVGA;\
      \ // 320 x 240; not a promised frame rate.\n  c.jpeg_quality = 12; // Used only for JPEG.\n  c.fb_count =\
      \ 1;\n  c.grab_mode = CAMERA_GRAB_WHEN_EMPTY;\n  c.fb_location = psramFound() ? CAMERA_FB_IN_PSRAM : CAMERA_FB_IN_DRAM;\n\
      \  esp_err_t err = esp_camera_init(&c);\n  if (err != ESP_OK) {\n    Serial.printf(\"Camera init failed: 0x%x;\
      \ stopped\\n\", unsigned(err));\n    return false;\n  }\n  sensor_t *sensor = esp_camera_sensor_get();\n \
      \ if (!sensor || sensor->id.PID != OV2640_PID) {\n    Serial.println(\"This example requires OV2640; stopped\"\
      );\n    esp_camera_deinit();\n    return false;\n  }\n  Serial.printf(\"Camera initialized; PSRAM %s\\n\"\
      , psramFound() ? \"found\" : \"not found\");\n  return true;\n}\n\n#include <WiFi.h>\n#include <WebServer.h>\n\
      const char *WIFI_SSID = \"YOUR_2_4_GHZ_SSID\";\nconst char *WIFI_PASSWORD = \"YOUR_PASSWORD\";\nWebServer\
      \ server(80);\nbool cameraReady = false, serving = false, connecting = false;\nuint8_t attempts = 0;\nuint32_t\
      \ attemptAt = 0, lastTry = 0;\nconstexpr uint32_t CONNECT_MS = 15000, RETRY_MS = 30000;\n\nvoid handleCapture()\
      \ {\n  camera_fb_t *fb = esp_camera_fb_get();\n  if (!fb) { server.send(503, \"text/plain\", \"Frame unavailable;\
      \ retry later\\n\"); return; }\n  if (fb->format != PIXFORMAT_JPEG || fb->len == 0) {\n    esp_camera_fb_return(fb);\n\
      \    server.send(500, \"text/plain\", \"Unexpected frame format\\n\"); return;\n  }\n  server.sendHeader(\"\
      Cache-Control\", \"no-store\");\n  server.sendHeader(\"Content-Disposition\", \"inline; filename=capture.jpg\"\
      );\n  server.send_P(200, \"image/jpeg\", reinterpret_cast<const char *>(fb->buf), fb->len);\n  esp_camera_fb_return(fb);\
      \ // Return after synchronous send, also if the client disconnects.\n  // A call to send is not proof that\
      \ the client received a complete image.\n}\nvoid beginAttempt() {\n  ++attempts;\n  Serial.printf(\"Wi-Fi\
      \ attempt %u/3\\n\", unsigned(attempts));\n  WiFi.begin(WIFI_SSID, WIFI_PASSWORD);\n  attemptAt = lastTry\
      \ = millis();\n  connecting = true;\n}\nvoid setup() {\n  Serial.begin(115200);\n  cameraReady = initCamera(false);\n\
      \  if (!cameraReady) return;\n  WiFi.mode(WIFI_STA);\n  WiFi.setAutoReconnect(false); // This example owns\
      \ the bounded retry policy.\n  server.on(\"/\", HTTP_GET, []() {\n    server.sendHeader(\"Cache-Control\"\
      , \"no-store\");\n    server.send(200, \"text/html\", \"<!doctype html><html lang='en'><meta name='viewport'\
      \ content='width=device-width'><title>Local camera snapshot</title><h1>Local camera snapshot</h1><p><a href='/capture'>Request\
      \ one JPEG</a></p><p>No stream, recording or authentication. Trusted network only.</p></html>\");\n  });\n\
      \  server.on(\"/capture\", HTTP_GET, handleCapture);\n  server.onNotFound([]() { server.send(404, \"text/plain\"\
      , \"Not found\\n\"); });\n  beginAttempt();\n}\nvoid loop() {\n  if (!cameraReady) { delay(100); return; }\n\
      \  if (WiFi.status() == WL_CONNECTED) {\n    connecting = false;\n    if (!serving) {\n      server.begin();\
      \ serving = true; attempts = 0;\n      Serial.print(\"Open locally: http://\"); Serial.println(WiFi.localIP());\n\
      \    }\n    server.handleClient(); // Synchronous single-client requests can occupy this loop.\n  } else {\n\
      \    if (serving) {\n      server.stop(); serving = false; attempts = 0; connecting = false;\n      lastTry\
      \ = millis(); Serial.println(\"Wi-Fi lost; server stopped\");\n    }\n    if (connecting && uint32_t(millis()\
      \ - attemptAt) >= CONNECT_MS) {\n      WiFi.disconnect(); connecting = false; lastTry = millis();\n      Serial.println(attempts\
      \ >= 3 ? \"Three attempts failed; fix credentials/network and reset\" : \"Attempt timed out; retry after 30\
      \ seconds\");\n    }\n    if (!connecting && attempts < 3 && uint32_t(millis() - lastTry) >= RETRY_MS) beginAttempt();\n\
      \  }\n  delay(1);\n}\n"
