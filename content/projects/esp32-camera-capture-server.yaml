  eli12: The ESP32-CAM is a tiny digital camera with a web window. The camera captures a frame, the ESP32 compresses
    or buffers it, and the browser asks for the latest picture.
  parent_safety: Keep the camera pointed at a non-sensitive test target. Get permission before viewing people or
    private spaces. This is a low-voltage bench setup, not surveillance or an access-control system. Unplug all
    power before changing connections or the ribbon; supply and UART voltage are different domains.
