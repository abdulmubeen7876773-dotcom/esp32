  behavior:
  - condition: Camera initialization fails
    result: No Wi-Fi or HTTP service starts; Serial error, reset after checking hardware.
  - condition: Three Wi-Fi attempts fail
    result: Retry stops; correct network/credentials and reset.
  - condition: Wi-Fi lost after serving
    result: Stop server, then bounded reconnect cycle; print IP after recovery.
  - condition: GET /capture
    result: One JPEG, or 503/500 if capture/format fails. Not a video stream.
