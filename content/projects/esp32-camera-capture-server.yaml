  wiring:
    full_size_link: true
    illustration_alt: 'Logical AI-Thinker ESP32-CAM programming and power map: separate 5 V board supply, verified
      3.3 V UART crossed TX/RX, common ground, IO0 strap for upload reset only. Not physical header order.'
    summary: The OV2640 bus is already on the board. External wiring is only separate 5 V board power, common ground
      and 3.3 V UART. Adapter power outputs stay disconnected. Follow the manual IO0/RST sequence below.
    steps:
    - Unplug USB and switch external power off before wiring. Identify the exact AI-Thinker/OV2640 board and the
      adapter signal voltage; stop if either is unknown.
    - Connect adapter TX (3.3 V TTL) → U0R/GPIO3, adapter RX ← U0T/GPIO1, and GND ↔ GND. Leave adapter 5V, 3V3,
      DTR and RTS unconnected; this procedure uses manual reset.
    - Connect external regulated 5 V positive only to the documented 5V input, and negative to board GND/common
      adapter ground. Never join two supply positive outputs. Check the actual board regulator and connector labels.
    - Select Espressif board package 3.3.2 and AI Thinker ESP32-CAM in Arduino IDE. Verify the PSRAM setting/profile.
      Use the board-compatible partition menu; this sketch does not implement OTA. Open the adapter port.
    - With all power off fit IO0→GND. Power the board and adapter, press/release the onboard RST button to sample
      GPIO0 LOW, then upload. Manual GPIO0 wiring alone does not reset the chip.
    - After upload, power off both sources, remove IO0→GND, restore power and press/release RST for normal boot.
      GPIO0 now supplies camera XCLK; leaving it grounded prevents operation. Open Serial at 115200.
    - Keep UART and board powered together while connected; disconnect both before altering signals/ribbon. Do not
      use GPIO16/17 (PSRAM), SD pins or GPIO4 flash LED for this example.
  gpio_map:
  - signal: Programmer TX / RX
    esp32_pin: U0R GPIO3 / U0T GPIO1
    direction: UART input / output
    notes: Cross TX→RX; 3.3 V TTL only. Not RS-232 or 5 V UART.
  - signal: External regulated supply
    esp32_pin: 5V / GND
    direction: Board power
    notes: Board regulator input, not chip/GPIO voltage. Adapter positive outputs NC.
  - signal: Upload strap / camera clock
    esp32_pin: GPIO0 → GND for reset into upload only
    direction: Boot strap, then XCLK output
    notes: Remove strap with power off and reset to run.
  - signal: OV2640 D0…D7
    esp32_pin: 5, 18, 19, 21, 36, 39, 34, 35
    direction: Camera data input
    notes: Onboard ribbon/internal wiring; do not externally rewire.
  - signal: OV2640 XCLK/PCLK/VSYNC/HREF
    esp32_pin: 0 / 22 / 25 / 23
    direction: Clock output / timing inputs
    notes: AI-Thinker only, not WROVER-KIT or S3 map.
  - signal: OV2640 SCCB SDA/SCL
    esp32_pin: 26 / 27
    direction: Configuration bus
    notes: Modern pin_sccb_sda/pin_sccb_scl API names.
  - signal: Camera PWDN / RESET
    esp32_pin: 32 / -1
    direction: Power-down / no dedicated sensor reset
    notes: Board RST resets the ESP32; camera reset=-1 is not the upload reset button.
  circuit_explanation: The ESP32-CAM board already connects the OV2640 camera to the ESP32 internally. Programming
    usually uses an FTDI adapter. Stable 5 V power is important because camera capture and Wi-Fi transmit peaks
    can reset weak supplies. IO0 is grounded only for flashing and released for normal boot.
  engineering_explanation: 'The manufacturer V1.0 board specification lists a 5 V supply and external PSRAM; the
    ESP32 and UART remain in the 3.3 V signal domain. This does not establish the regulator or pinout of an unmarked
    clone. JPEG QVGA (320×240), one buffer, can use the driver''s low-resolution DRAM path when PSRAM is unavailable.
    Grayscale QR capture explicitly requires PSRAM here. More buffers/resolution are not free upgrades: upstream
    recommends multiple frame buffers only with JPEG. No frame rate or memory availability is guaranteed.'
