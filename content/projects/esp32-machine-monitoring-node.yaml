  faqs:
  - question: Does this measure current or protect a machine?
    answer: No. The potentiometer is a signal simulator and the load is a battery LED. No current measurement,
      machinery wiring or independent protective function is implemented.
  - question: Does LOW prove the contact is open?
    answer: No. It is a software command; contact state needs independent observation and faults are not excluded.
  complete:
    summary: Compare prospective states with separately recorded observations. No successful hardware operation
      or safety validation is supplied.
