  what_you_build: A potentiometer simulates a changing signal. The ESP32 screens its divided ADC input and
    applies two thresholds to an explicitly supported relay controlling only a separate battery/LED circuit.
    The historical machine-monitoring URL is retained; no current sensor, real machine, cloud sync, protective
    trip or maintenance diagnosis is implemented.
  eli12: Two thresholds prevent a small change from repeatedly toggling the relay. An enable command allows
    a short demonstration; it is not a physical emergency stop.
  assumptions: Classic ESP32-WROOM-32/32E DevKit, Arduino IDE 2.x and Arduino-ESP32 3.3.2 review baseline;
    built-in ADC/GPIO only, no external library. Free GPIO35 (ADC1 input only, no internal pulls) and GPIO19.
    Not a pin map for S3/C3/C5. Identify the actual board 3V3 rail and verify 3.0–3.45 V before relying on
    the bounds below.
  parent_safety: Only the documented 3 V battery/LED contact circuit is supported. No mains, motors, real machines
    or unattended operation. Remove all three power sources before rewiring. Software commands/timeouts and
    normally-open contacts are not independent safety protection; welded contacts or hardware failure can leave
    a load on.
