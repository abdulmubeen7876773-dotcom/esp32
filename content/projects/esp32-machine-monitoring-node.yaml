levels:
  beginner:
    level: beginner
    overview_html: <p>Practice ADC hysteresis and a timed manual enable with a potentiometer, specified STEMMA
      relay and separate low-voltage LED load. No machine monitoring or current measurement.</p>
    components:
    - Classic ESP32-WROOM-32/32E DevKit
    - 10 kΩ linear potentiometer
    - 15 kΩ and 10 kΩ divider resistors, both 1%; 100 nF capacitor
    - Adafruit STEMMA Non-Latching Mini Relay 4409 and JST-PH 3-pin cable
    - External regulated 5 V relay supply rated at least 100 mA
    - Separate 3 V battery, red LED and 330 ohm resistor
    - Breadboard, jumper leads and USB data cable
    code: "#include <Arduino.h>\n// Classic ESP32-WROOM DevKit; Arduino-ESP32 3.3.2 review baseline.\n// 10k\
      \ linear potentiometer outer terminals: board 3V3 and GND.\n// Wiper -- 15k (1%) -- GPIO35 node; 10k\
      \ (1%) and 100 nF node to GND.\n// GPIO19 -> STEMMA 4409 Signal; 10k Signal to common GND.\nconstexpr\
      \ uint8_t INPUT_PIN = 35, RELAY_PIN = 19;\nconstexpr uint32_t ENABLE_MS = 10000;\nconstexpr float ON_MV\
      \ = 900, OFF_MV = 650;\nbool enabled = false, relayOn = false;\nuint32_t enabledAt = 0;\nvoid off() {\
      \ relayOn = false; digitalWrite(RELAY_PIN, LOW); }\nvoid setup() {\n  digitalWrite(RELAY_PIN, LOW);\n\
      \  pinMode(RELAY_PIN, OUTPUT);\n  off();\n  Serial.begin(115200);\n  analogReadResolution(12);\n  analogSetPinAttenuation(INPUT_PIN,\
      \ ADC_11db);\n  Serial.println(\"Potentiometer/LED bench lesson only; no machine or current measurement\"\
      );\n  Serial.println(\"E enables for 10 seconds; X disables. Use Serial Monitor at 115200.\");\n}\nvoid\
      \ loop() {\n  while (Serial.available()) {\n    char c = Serial.read();\n    if (c == 'x' || c == 'X')\
      \ { enabled = false; off(); }\n    if (c == 'e' || c == 'E') { enabled = true; enabledAt = millis();\
      \ }\n  }\n  uint32_t sum = 0, rawSum = 0, lo = 100000, hi = 0;\n  bool rail = false;\n  for (int i =\
      \ 0; i < 16; ++i) {\n    uint16_t raw = analogRead(INPUT_PIN);\n    uint32_t mv = analogReadMilliVolts(INPUT_PIN);\n\
      \    rawSum += raw; sum += mv;\n    if (raw <= 16 || raw >= 4079) rail = true;\n    if (mv < lo) lo =\
      \ mv;\n    if (mv > hi) hi = mv;\n    delay(2);\n  }\n  float pinMv = sum / 16.0f;\n  bool valid = !rail\
      \ && lo >= 250 && hi <= 1500 && hi - lo <= 30;\n  if (!valid || (enabled && uint32_t(millis() - enabledAt)\
      \ >= ENABLE_MS)) {\n    enabled = false; off();\n  }\n  if (!enabled) off();\n  else {\n    if (!relayOn\
      \ && pinMv >= ON_MV) relayOn = true;\n    else if (relayOn && pinMv <= OFF_MV) relayOn = false;\n   \
      \ digitalWrite(RELAY_PIN, relayOn ? HIGH : LOW);\n  }\n  Serial.printf(\"raw_counts=%.1f ADC_pin_mV_est=%.1f\
      \ input=%s enabled=%s command=%s\\n\",\n    rawSum / 16.0f, pinMv, valid ? \"screened\" : \"INVALID\"\
      ,\n    enabled ? \"yes\" : \"no\", relayOn ? \"ON\" : \"OFF\");\n  delay(100); // Acquisition + reporting\
      \ delay: not an exact sampling period.\n}\n"
    code_filename: esp32-machine-monitoring-node.ino
