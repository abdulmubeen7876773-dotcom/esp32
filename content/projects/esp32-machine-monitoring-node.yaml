  wiring:
    summary: USB powers the ESP32. Board 3V3 supplies only the potentiometer; its divided wiper reaches GPIO35.
      A separate 5 V supply powers the identified relay with common control ground. GPIO19 commands Signal
      with a pull-down. Relay COM/NO switches a separate 3 V battery/LED circuit.
    full_size_link: true
    illustration_alt: Logical GPIO35 potentiometer divider, GPIO19 active-HIGH STEMMA 4409 and separate 3 V
      LED contact circuit; not physical pin order or tested hardware.
    steps:
    - Disconnect USB, relay supply and LED battery before wiring. Verify actual connector and contact labels;
      the diagram is logical, not physical pin order.
    - Pot outer terminals → board 3V3/GND. Wiper → 15k → GPIO35 node; 10k and 100 nF separately node → GND.
      Never use VIN/5V for the pot.
    - STEMMA red Vin → separate regulated +5 V; black GND → supply negative and ESP32 GND. Never join external
      +5 V with USB/DevKit positive rails.
    - STEMMA white Signal → GPIO19; additional 10k Signal → common GND. Confirm model 4409, not a generic relay
      input.
    - Separate 3 V battery positive → COM; NO → 330 ohm → red LED anode; LED cathode → battery negative. NC
      unused. Do not join this battery return to controller ground.
    - Check circuit while unpowered, then power controller/relay together. Upload; open Serial Monitor at 115200.
      Command starts OFF. Turn pot slowly; send E to enable for 10 seconds or X to disable.
