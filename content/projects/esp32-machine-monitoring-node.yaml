    esp32_pin: GPIO19; 10k → GND
    direction: Active-HIGH command
    notes: HIGH commands COM–NO; LOW commands coil OFF. Not generic relay polarity.
  - signal: STEMMA Vin / GND (red / black)
    esp32_pin: External +5 V / common GND
    direction: Control supply
    notes: GPIO never powers the coil; do not join positive rails.
  - signal: Relay COM / NO / NC
    esp32_pin: No GPIO connection
    direction: Battery LED contacts
    notes: 3 V + to COM; NO to resistor/LED; cathode to battery −. NC unused.
