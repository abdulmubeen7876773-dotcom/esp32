    note: Arduino.h only; no current-sensor, MQTT, OLED or relay library.
  configuration: Use Serial Monitor at 115200; E enables or renews a 10-second window, X disables; newline
    characters are ignored. Start with the LED circuit connected, not a real load. Valid input is screened
    to 250–1500 mV with no rail samples and at most 30 mV span in a 16-sample window. These are lesson choices,
    not certified sensor-fault detection. The lowest pot position deliberately rejects and disables. Re-enable
    with E after a rejected window or timeout.
  code:
    filename: esp32-machine-monitoring-node.ino
    content: "#include <Arduino.h>\n// Classic ESP32-WROOM DevKit; Arduino-ESP32 3.3.2 review baseline.\n//\
      \ 10k linear potentiometer outer terminals: board 3V3 and GND.\n// Wiper -- 15k (1%) -- GPIO35 node;\
      \ 10k (1%) and 100 nF node to GND.\n// GPIO19 -> STEMMA 4409 Signal; 10k Signal to common GND.\nconstexpr\
      \ uint8_t INPUT_PIN = 35, RELAY_PIN = 19;\nconstexpr uint32_t ENABLE_MS = 10000;\nconstexpr float ON_MV\
      \ = 900, OFF_MV = 650;\nbool enabled = false, relayOn = false;\nuint32_t enabledAt = 0;\nvoid off() {\
      \ relayOn = false; digitalWrite(RELAY_PIN, LOW); }\nvoid setup() {\n  digitalWrite(RELAY_PIN, LOW);\n\
      \  pinMode(RELAY_PIN, OUTPUT);\n  off();\n  Serial.begin(115200);\n  analogReadResolution(12);\n  analogSetPinAttenuation(INPUT_PIN,\
      \ ADC_11db);\n  Serial.println(\"Potentiometer/LED bench lesson only; no machine or current measurement\"\
      );\n  Serial.println(\"E enables for 10 seconds; X disables. Use Serial Monitor at 115200.\");\n}\nvoid\
      \ loop() {\n  while (Serial.available()) {\n    char c = Serial.read();\n    if (c == 'x' || c == 'X')\
      \ { enabled = false; off(); }\n    if (c == 'e' || c == 'E') { enabled = true; enabledAt = millis();\
      \ }\n  }\n  uint32_t sum = 0, rawSum = 0, lo = 100000, hi = 0;\n  bool rail = false;\n  for (int i =\
      \ 0; i < 16; ++i) {\n    uint16_t raw = analogRead(INPUT_PIN);\n    uint32_t mv = analogReadMilliVolts(INPUT_PIN);\n\
      \    rawSum += raw; sum += mv;\n    if (raw <= 16 || raw >= 4079) rail = true;\n    if (mv < lo) lo =\
      \ mv;\n    if (mv > hi) hi = mv;\n    delay(2);\n  }\n  float pinMv = sum / 16.0f;\n  bool valid = !rail\
      \ && lo >= 250 && hi <= 1500 && hi - lo <= 30;\n  if (!valid || (enabled && uint32_t(millis() - enabledAt)\
      \ >= ENABLE_MS)) {\n    enabled = false; off();\n  }\n  if (!enabled) off();\n  else {\n    if (!relayOn\
      \ && pinMv >= ON_MV) relayOn = true;\n    else if (relayOn && pinMv <= OFF_MV) relayOn = false;\n   \
      \ digitalWrite(RELAY_PIN, relayOn ? HIGH : LOW);\n  }\n  Serial.printf(\"raw_counts=%.1f ADC_pin_mV_est=%.1f\
      \ input=%s enabled=%s command=%s\\n\",\n    rawSum / 16.0f, pinMv, valid ? \"screened\" : \"INVALID\"\
      ,\n    enabled ? \"yes\" : \"no\", relayOn ? \"ON\" : \"OFF\");\n  delay(100); // Acquisition + reporting\
      \ delay: not an exact sampling period.\n}\n"
  code_explanation: Raw counts and calibrated ADC-pin mV estimates come from separate conversions, not a simultaneous
    measurement. Startup is disabled/OFF. While enabled, input >=900 mV commands HIGH/ON; <=650 mV commands
    LOW/OFF; between those boundaries retains the prior state. X, invalid screening or elapsed 10 seconds commands
    OFF and clears enable. E can allow ON at the next valid sample when input is already high; there is no
    mechanical interlock. The finite sampling loop and report delay mean commands/timeouts are not instantaneous.
  circuit_explanation: For model 4409 only, 3.3 V GPIO19 is an accepted HIGH signal; the relay board contains
    its own driver. External 5 V powers the coil; Signal has an external 10k pull-down during high-impedance
    reset. The LED battery is on COM/NO, so it is normally open with the coil off; this does not guarantee
    fail-safe behavior. This lesson is not permission to substitute unidentified 5 V-pulled or active-LOW modules.
  engineering_explanation: Vpin = Vwiper × Rbottom/(Rtop+Rbottom). Nominal 15k/10k ratio is 0.4; the 1% maximum
    ratio is 10.1/(14.85+10.1)=0.40481. With a verified board rail no higher than 3.45 V, maximum pin voltage
    is approximately 1.3966 V. Pot resistance/loading changes the wiper response, so angle is not a calibrated
    voltage scale. Classic ESP32 11 dB usable measurement range is about 150–3100 mV, separate from 3.3 V logic
    and supply ratings. The lesson rejects below 250 mV instead of estimating accurately near zero. A divider
    calculation is not transient protection, ADC accuracy or physical electrical validation. A disconnected
    wiper is pulled down, but an in-range stuck signal can pass. Hysteresis thresholds are arbitrary demonstration
    values, not current, machine-health or protective-trip settings.
  expected_output: 'Prospective behavior, not observed hardware results: Serial reports raw counts, estimated
    ADC-pin mV, input screen, enable and command. Without E, command remains OFF. With E and a valid input
    >=900 mV it becomes ON; <=650 mV becomes OFF; the interval keeps state. Invalid input, X or timeout commands
    OFF. Actual contact/LED operation has not been tested; do not equate a printed ON with verified contacts.'
  common_mistakes:
  - text: Connecting a real machine or unidentified relay/current module.
  - text: Using the pot wiper directly at a 5 V rail or joining USB/external positives.
  - text: Treating E/X or timeout as an independent emergency stop.
  troubleshooting:
  - problem: Command stays OFF
    fix: Read input/enable states. E is required; reject states or a low pot position disable the window. Do
      not bypass screening.
  - problem: Command and LED disagree
    fix: Remove all power; identify 4409 and COM/NO labels, LED polarity, battery and resistor. A printed command
      is not contact feedback.
  - problem: Repeated invalid/noisy input
    fix: Power off; verify pot wiper, ground, divider and capacitor. Record diagnostics; do not treat a software
      range test as proof of electrical safety.
  testing_checklist:
  - Documentation/API and numerical review only; no compilation or hardware results supplied.
  - Use only the specified LED circuit; record actual signal, commanded state and observed LED separately.
  - Check disabled startup, upper/lower thresholds, deadband, X, low-input rejection and timeout.
  engineer_tips:
  - Keep module supply separate from signal levels.
  - Record expected behavior separately from observed results.
  upgrade_ideas:
  - A real current-sensor interface requires a separately documented transfer function, voltage limits, wiring
    and calibration.
  - Cloud, OLED and protective functions are not implemented here.
  real_world_applications:
  - Classroom state-machine and hysteresis lesson
