  wiring:
    illustration_alt: ESP32 RFID Access Control System wiring diagram
    summary: Wire the MFRC522 RFID reader first, verify card UID reads in Serial Monitor, then connect the GPIO26
      relay or servo output. Treat this as a low-voltage access-control lesson, not a certified lock system.
    steps:
    - Unplug USB before placing modules on the breadboard.
    - Connect the MFRC522 RFID reader VCC to 3.3 V unless your exact module documentation says otherwise.
    - Connect MFRC522 GND to ESP32 GND.
    - Connect MFRC522 SS/SDA to GPIO5 and RST to GPIO22 to match the sketch constants.
    - Connect the remaining MFRC522 SPI lines to the ESP32 board SPI pins used by SPI.begin().
    - Connect the relay module input or servo signal to GPIO26 and share ground with the ESP32.
    - Power any actuator from suitable low-voltage hardware; do not power a lock, relay coil, or servo directly
      from an ESP32 GPIO.
  gpio_map:
  - signal: MFRC522 VCC
    esp32_pin: 3.3 V
    direction: Power
    notes: MFRC522/RC522 readers are normally 3.3 V logic devices.
  - signal: MFRC522 GND
    esp32_pin: GND
    direction: Ground
    notes: Shared ground with ESP32.
  - signal: MFRC522 SS/SDA
    esp32_pin: GPIO5
    direction: Output
    notes: Chip-select pin defined as SS_PIN in the sketch.
  - signal: MFRC522 RST
    esp32_pin: GPIO22
    direction: Output
    notes: Reset pin defined as RST_PIN in the sketch.
  - signal: MFRC522 SPI bus
    esp32_pin: Board SPI pins
    direction: I/O
    notes: SPI.begin() uses the ESP32 board/library SPI setup.
  - signal: Relay or servo lock output
    esp32_pin: GPIO26
    direction: Output
    notes: Control signal only; use a relay module, servo supply, or driver appropriate to the actuator.
  - signal: Status LED
    esp32_pin: GPIO2
    direction: Output
    notes: Optional debug indicator
  - signal: Serial Monitor
    esp32_pin: USB
    direction: Debug
    notes: 115200 baud
  code:
    filename: rfid-access-control-system.ino
    content: "#include <SPI.h>\n#include <MFRC522.h>\n\n#define SS_PIN 5\n#define RST_PIN 22\n#define RELAY_PIN\
      \ 26\n\nMFRC522 rfid(SS_PIN, RST_PIN);\nbyte allowedUid[] = {0xDE, 0xAD, 0xBE, 0xEF};\n\nbool uidMatches()\
      \ {\n  if (rfid.uid.size != sizeof(allowedUid)) return false;\n  for (byte i = 0; i < rfid.uid.size; i++)\
      \ {\n    if (rfid.uid.uidByte[i] != allowedUid[i]) return false;\n  }\n  return true;\n}\n\nvoid setup() {\n\
      \  Serial.begin(115200);\n  pinMode(RELAY_PIN, OUTPUT);\n  digitalWrite(RELAY_PIN, LOW);\n  SPI.begin();\n\
      \  rfid.PCD_Init();\n  Serial.println(\"Scan RFID card\");\n}\n\nvoid loop() {\n  if (!rfid.PICC_IsNewCardPresent()\
      \ || !rfid.PICC_ReadCardSerial()) return;\n  bool allowed = uidMatches();\n  Serial.println(allowed ? \"Access\
      \ granted\" : \"Access denied\");\n  digitalWrite(RELAY_PIN, allowed ? HIGH : LOW);\n  delay(1500);\n  digitalWrite(RELAY_PIN,\
      \ LOW);\n  rfid.PICC_HaltA();\n}\n"
  expected_output: Serial Monitor should print "Scan RFID card" after boot. A UID that matches allowedUid should
    print "Access granted" and activate GPIO26 for about 1.5 seconds. Any other card should print "Access denied"
    and leave the output inactive.
  common_mistakes:
  - text: Testing input and output for the first time together.
  - text: Using a GPIO pin that does not match the code constant.
  - text: Expecting an ESP32 GPIO to power a motor, pump, or lock directly.
  - text: Forgetting the shared ground between modules.
  troubleshooting:
  - problem: MFRC522 RFID reader never detects a card
    fix: Check 3.3 V power, GND, SS on GPIO5, RST on GPIO22, SPI wiring, and card position over the antenna.
  - problem: Every card is denied
    fix: Print the scanned UID bytes first, then replace allowedUid with the exact UID from your own card.
  - problem: Relay or servo output does not switch
    fix: Test GPIO26 with a simple output sketch, then test the relay module or servo with its own safe low-voltage supply.
  - problem: ESP32 resets under load
    fix: Use a separate supply for motors, pumps, or locks and keep only control signals connected to ESP32.
  - problem: Behavior is reversed
    fix: Your module may be active LOW; invert the output logic after confirming with Serial Monitor.
