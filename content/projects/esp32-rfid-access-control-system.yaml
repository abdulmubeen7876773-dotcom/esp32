  story: 'ESP32 RFID Access Control System turns the ESP32 into a real object that senses something, decides what
    it means, and reacts in the physical world.


    The important lesson is not only the finished access control system. You learn how to separate input, decision
    logic, and output so a project stays debuggable instead of becoming a pile of wires and guesses.'
  eli12: Think of the ESP32 as the brain. The MFRC522 reader checks the card ID. The relay or servo output is the
    small action the brain takes when the card is approved.
  parent_safety: This tutorial is designed for low-voltage learning on USB or a regulated low-voltage supply. Unplug
    the ESP32 before changing wires. Keep motors, pumps, door hardware, and relay loads separate from the USB programming
    circuit. Do not use mains voltage on a breadboard, and do not treat hobby RFID cards as tamper-resistant security.
  learning_objectives:
  - Wire and test the MFRC522 RFID reader before connecting the rest of the circuit.
  - Map each signal to a named ESP32 GPIO and keep the code constants readable.
  - Control relay or servo lock output from a clear approved-card decision.
  - Use Serial Monitor as an engineering tool, not only as a success message.
  - Identify power, wiring, and timing faults using a repeatable test checklist.
  circuit_explanation: The circuit is split into an RFID input side and an actuator output side. The MFRC522 reader
    communicates over SPI and uses GPIO5 for SS and GPIO22 for reset in this sketch. GPIO26 controls the output
    module; it does not power the actuator directly.
  engineering_explanation: A reliable access control system is built in layers. First prove the input, then prove
    the output, then join them with simple state logic. This prevents a common beginner problem where the robot,
    lock, or automation fails and every wire looks suspicious at the same time.
  code_explanation: The example defines SS_PIN as GPIO5, RST_PIN as GPIO22, and RELAY_PIN as GPIO26. It compares
    the scanned UID bytes with allowedUid, prints "Access granted" or "Access denied", and pulses the output only
    for an approved card.
  testing_checklist:
  - ESP32 appears on the correct port and accepts a basic blink upload.
  - Ground is shared between every module that exchanges signals with the ESP32.
  - Each GPIO in the code matches the wire connected on the breadboard.
  - Serial Monitor prints startup text at 115200 baud.
  - A scanned card prints either Access granted or Access denied.
  - The relay or servo lock output changes only for an approved UID.
  - The circuit still behaves correctly after power is removed and restored.
