  code:
    filename: esp32-ecg-monitor.ino
    content: "// Classic ESP32-WROOM DevKit; Arduino-ESP32 3.3.2; no external library.\n// SparkFun AD8232\
      \ SEN-12650 v10: BENCH ONLY, no leads or electrodes attached.\n// USB Serial is permitted only in this\
      \ non-body-connected arrangement.\nconst int SIGNAL_PIN = 34; // AD8232 OUTPUT -> ADC1 input, never a\
      \ GPIO output.\nconst int LO_PLUS = 32;\nconst int LO_MINUS = 33;\nconst uint32_t PERIOD_US = 10000;\
      \ // Target 100 readings/s, not precision timing.\nuint32_t lastSampleUs = 0;\n\nvoid setup() {\n  Serial.begin(115200);\n\
      \  pinMode(SIGNAL_PIN, INPUT);\n  pinMode(LO_PLUS, INPUT);\n  pinMode(LO_MINUS, INPUT);\n  analogReadResolution(12);\n\
      \  analogSetPinAttenuation(SIGNAL_PIN, ADC_11db);\n  lastSampleUs = micros();\n}\n\nvoid loop() {\n \
      \ uint32_t now = micros();\n  if ((uint32_t)(now - lastSampleUs) < PERIOD_US) return;\n  lastSampleUs\
      \ = now; // Do not manufacture catch-up samples after a delay.\n  uint16_t raw = analogRead(SIGNAL_PIN);\n\
      \  int loPlus = digitalRead(LO_PLUS);\n  int loMinus = digitalRead(LO_MINUS);\n  // Always show actual\
      \ ADC conversion and actual flags, even with open inputs.\n  Serial.printf(\"raw:%u\\tlo_plus:%d\\tlo_minus:%d\\\
      n\",\n                (unsigned int)raw, loPlus, loMinus);\n}\n"
  code_explanation: About every 10 ms the sketch prints the actual ADC conversion and both actual digital states.
    It does not replace an open-lead sample with 2048 or invent a waveform. Serial Monitor shows labelled fields;
    Serial Plotter can show raw, lo_plus and lo_minus as three series, with the 0/1 flags close to the bottom
    of the ADC scale. The scheduler skips catch-up work rather than fabricating missed samples. It does not
    validate leads, guarantee cadence or determine heart rate.
  expected_output: At 115200 baud, records contain raw:<actual count>, lo_plus:<0 or 1> and lo_minus:<0 or
    1>, separated by tabs. In the selected dc leads-off configuration, open electrode inputs are expected to
    assert their corresponding flags; settling, noise or clipping may be visible. No numeric trace or measurement
    from hardware is supplied here. No ECG shape, BPM, diagnosis or medical accuracy is promised.
  common_mistakes:
  - text: Connecting electrodes while a USB cable provides a computer ground path.
  - text: Assuming a battery or a generic USB isolator establishes a complete patient-safe arrangement.
  - text: Reading GPIO34 as a GPIO output or powering the AD8232 carrier from 5 V.
  - text: Interpreting an open-input trace or synthetic midscale as a valid biological signal.
  troubleshooting:
  - problem: Flat, rail-limited or noisy trace
    fix: With electrode ports deliberately empty, this is not proof of a failed or working ECG system. Check
      the 3.3 V rail and OUTPUT-to-GPIO34 connection; do not attach electrodes to make the graph look better.
  - problem: LO flags differ from expectations
    fix: Check LO+/LO− labels, carrier revision, SDN pull-up and dc/ac leads-off configuration. Do not bypass
      the flags or treat LOW as permission for body contact.
  - problem: ADC path needs an independent check
    fix: Power off and disconnect module OUTPUT first. Ground GPIO34 and inspect its actual low-end counts
      after power-up. This checks the ADC path only, not the AD8232, isolation or biological operation.
  - problem: Plotter is blank
    fix: Select the correct port and 115200 baud; close other serial clients. Read the same labelled records
      in Serial Monitor. Confirm a USB data cable and matching board selection.
  testing_checklist:
  - Verify that electrode cable, jack and RA/LA/RL pads remain unconnected.
  - Check module power, common ground and GPIO34 input direction.
  - Confirm all output fields come from analogRead/digitalRead, with no forced 2048 value.
  - Distinguish the optional grounded-ADC check from sensor/hardware validation.
  - These are planned checks, not a record of hardware testing.
  engineer_tips:
  - Keep acquisition provenance with every saved trace.
  - Do not call a leads-off flag an isolation or physiological validity test.
  - Use the existing analog-input guide for an independently controlled signal.
