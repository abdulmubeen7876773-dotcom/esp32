      SparkFun v10 board includes its pull-up. Verify any different carrier before use.'
    - Keep the 3.5 mm jack and RA/LA/RL pads empty. Do not short them or attach a signal generator as an undocumented
      substitute.
    - Upload with Arduino-ESP32 3.3.2 and open Serial Monitor or Serial Plotter at 115200 baud. USB is used
      only with this non-body-connected arrangement.
    - Observe actual raw and lo_plus/lo_minus fields. Leads-off is expected with open inputs; no waveform or
      health value is being validated.
