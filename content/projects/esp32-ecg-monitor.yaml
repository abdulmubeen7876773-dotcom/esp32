  story: ''
  eli12: An analog front end amplifies and filters a small input. The ESP32 can digitize its output, but an
    unplugged input can float, clip or pick up interference. Drawing that output does not turn it into a heartbeat.
  parent_safety: No body connection is supported. Remove the electrode cable and leave the 3.5 mm jack and
    RA/LA/RL pads empty throughout upload, Serial Monitor and Plotter use. Do not connect a person or animal
    to any terminal. USB provides a computer ground path; a battery alone does not make the system medically
    isolated, and no isolated patient arrangement is specified here.
  safety_standards:
  - Bench-only, no electrodes, no skin contact and no health measurements.
  - Disconnect USB before wiring or changing the ADC test connection.
  - Use only ESP32 3V3 for the selected AD8232 board; no 5 V module supply or external signal generator is
    part of this exercise.
