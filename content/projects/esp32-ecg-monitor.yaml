    units. Classic ESP32 at 11 dB has an approximately 0.15–3.1 V documented measurement range; this differs
    from the board's 3.3 V supply and GPIO limits. A 3.3 V-powered AD8232 output can approach its rails and
    clip the measurement; a flat or noisy trace with open inputs is not a measured ECG. LO flags are status
