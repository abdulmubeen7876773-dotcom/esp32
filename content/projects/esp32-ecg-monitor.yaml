  faqs:
  - question: Can I attach electrodes if I use a battery?
    answer: No. This page specifies only an electrode-disconnected bench demo. It provides no complete isolated
      body-connected arrangement; a battery alone does not establish one.
  - question: Why keep samples when leads are off?
    answer: To inspect the actual electrical output alongside its status flags. These are open-input bench
      records, not valid ECG data; replacing them with 2048 would conceal that distinction.
