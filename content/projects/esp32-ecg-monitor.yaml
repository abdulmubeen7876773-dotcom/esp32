levels:
  beginner:
    level: beginner
    overview_html: <p>A non-body-connected acquisition demo using a SparkFun SEN-12650 AD8232 board (v10 schematic)
      and classic ESP32-WROOM DevKit. It prints actual raw ADC samples and leads-off flags to USB Serial. The
      historical ECG URL remains, but this exercise does not acquire an ECG from a person.</p>
    components:
    - Classic ESP32-WROOM DevKit
    - SparkFun AD8232 Single Lead Heart Rate Monitor SEN-12650
    - Breadboard, short jumper wires and USB data cable
    wiring:
    - - AD8232 OUTPUT
      - GPIO34
      - ADC1 input-only pin; 12-bit raw counts, not GPIO output.
    - - AD8232 LO+
      - GPIO32
      - Actual leads-off comparator status.
    - - AD8232 LO−
      - GPIO33
      - Actual leads-off comparator status.
    - - Board 3.3V / GND
      - 3V3 / GND
      - One USB-powered low-voltage bench; no patient isolation claimed.
    - - SDN
      - Not connected
      - SparkFun v10 pull-up holds it enabled.
    - - Electrode jack and RA/LA/RL
      - Not connected
      - No leads, pads or external source attached.
    key_concepts:
    - AD8232 is an analog signal-conditioning front end, not an ADC or an isolation barrier. The selected carrier
      sets its gain, filters and leads-off mode using external components. USB ground joins the ESP32 and board.
      No patient-safe power/data barrier is present; keeping the electrode ports empty is the actual supported
      boundary.
    - The code requests 12-bit raw ADC counts (0–4095), not millivolts or physiological units. Classic ESP32
      at 11 dB has an approximately 0.15–3.1 V documented measurement range; this differs from the board's
      3.3 V supply and GPIO limits. A 3.3 V-powered AD8232 output can approach its rails and clip the measurement;
      a flat or noisy trace with open inputs is not a measured ECG. LO flags are status bits, not signal-quality
      or safety certification. Target polling is 100 readings/s, with software/Serial jitter; this is not a
      clinical acquisition bandwidth claim.
    applications: &id002
    - Non-body-connected ADC interface lesson
    - Leads-off status and signal-provenance discussion
    troubleshooting:
    - - Flat, rail-limited or noisy trace
      - With electrode ports deliberately empty, this is not proof of a failed or working ECG system. Check
        the 3.3 V rail and OUTPUT-to-GPIO34 connection; do not attach electrodes to make the graph look better.
    - - LO flags differ from expectations
      - Check LO+/LO− labels, carrier revision, SDN pull-up and dc/ac leads-off configuration. Do not bypass
        the flags or treat LOW as permission for body contact.
    - - ADC path needs an independent check
      - Power off and disconnect module OUTPUT first. Ground GPIO34 and inspect its actual low-end counts after
        power-up. This checks the ADC path only, not the AD8232, isolation or biological operation.
    - - Plotter is blank
      - Select the correct port and 115200 baud; close other serial clients. Read the same labelled records
        in Serial Monitor. Confirm a USB data cable and matching board selection.
    improvements: &id001
    - Save raw bench records with configuration notes.
    - Study filtering offline without calling the result a verified ECG.
    code: "// Classic ESP32-WROOM DevKit; Arduino-ESP32 3.3.2; no external library.\n// SparkFun AD8232 SEN-12650\
      \ v10: BENCH ONLY, no leads or electrodes attached.\n// USB Serial is permitted only in this non-body-connected\
      \ arrangement.\nconst int SIGNAL_PIN = 34; // AD8232 OUTPUT -> ADC1 input, never a GPIO output.\nconst\
      \ int LO_PLUS = 32;\nconst int LO_MINUS = 33;\nconst uint32_t PERIOD_US = 10000; // Target 100 readings/s,\
      \ not precision timing.\nuint32_t lastSampleUs = 0;\n\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(SIGNAL_PIN,\
      \ INPUT);\n  pinMode(LO_PLUS, INPUT);\n  pinMode(LO_MINUS, INPUT);\n  analogReadResolution(12);\n  analogSetPinAttenuation(SIGNAL_PIN,\
      \ ADC_11db);\n  lastSampleUs = micros();\n}\n\nvoid loop() {\n  uint32_t now = micros();\n  if ((uint32_t)(now\
      \ - lastSampleUs) < PERIOD_US) return;\n  lastSampleUs = now; // Do not manufacture catch-up samples\
      \ after a delay.\n  uint16_t raw = analogRead(SIGNAL_PIN);\n  int loPlus = digitalRead(LO_PLUS);\n  int\
      \ loMinus = digitalRead(LO_MINUS);\n  // Always show actual ADC conversion and actual flags, even with\
      \ open inputs.\n  Serial.printf(\"raw:%u\\tlo_plus:%d\\tlo_minus:%d\\n\",\n                (unsigned\
      \ int)raw, loPlus, loMinus);\n}\n"
    code_filename: esp32-ecg-monitor.ino
