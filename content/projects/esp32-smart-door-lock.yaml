    notes: Do not join external positive to USB-powered board positive
  code:
    filename: smart-door-lock.ino
    content: "#include <Arduino.h>\n#include <SPI.h>\n#include <MFRC522.h>\n#include <ESP32Servo.h>\nconstexpr\
      \ uint8_t SS_PIN = 5, RST_PIN = 22, SERVO_PIN = 26;\nconstexpr bool PROVISIONED = false; // First record\
      \ your own UID, then enable.\nconst byte ALLOWED_UID[] = {0x00, 0x00, 0x00, 0x00}; // Replace whole array.\n\
      constexpr int START_US = 1400, OPEN_US = 1600;\nconstexpr uint32_t OPEN_MS = 5000;\nMFRC522 rfid(SS_PIN,\
      \ RST_PIN);\nServo demoServo;\nbool servoReady = false, openCommand = false;\nuint32_t openedAt = 0;\n\
      \nbool allowedCard() {\n  if (!PROVISIONED || rfid.uid.size != sizeof(ALLOWED_UID)) return false;\n \
      \ for (byte i=0; i<rfid.uid.size; ++i)\n    if (rfid.uid.uidByte[i] != ALLOWED_UID[i]) return false;\n\
      \  return true;\n}\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(SERVO_PIN, OUTPUT); digitalWrite(SERVO_PIN,\
      \ LOW);\n  SPI.begin(18, 19, 23, SS_PIN);\n  rfid.PCD_Init();\n  if (PROVISIONED) {\n    demoServo.setPeriodHertz(50);\n\
      \    demoServo.attach(SERVO_PIN, 1400, 1600);\n    servoReady = demoServo.attached();\n    if (servoReady)\
      \ demoServo.writeMicroseconds(START_US);\n  }\n  Serial.println(PROVISIONED ? \"Provisioned demo; inspect\
      \ servo state\" :\n    \"ENROLLMENT: scan card; servo pulses disabled\");\n  if (PROVISIONED && !servoReady)\
      \ Serial.println(\"Servo attach failed; no opening commands\");\n}\nvoid loop() {\n  if (openCommand\
      \ && millis()-openedAt >= OPEN_MS) {\n    demoServo.writeMicroseconds(START_US); openCommand=false;\n\
      \    Serial.println(\"Starting pulse restored; position not measured\");\n  }\n  if (!rfid.PICC_IsNewCardPresent()\
      \ || !rfid.PICC_ReadCardSerial()) return;\n  Serial.print(\"UID:\");\n  for (byte i=0; i<rfid.uid.size;\
      \ ++i) Serial.printf(\" 0x%02X\", rfid.uid.uidByte[i]);\n  Serial.println();\n  if (allowedCard() &&\
      \ servoReady && !openCommand) {\n    demoServo.writeMicroseconds(OPEN_US); openedAt=millis(); openCommand=true;\n\
      \    Serial.println(\"Open pulse requested for 5 seconds\");\n  } else Serial.println(\"No new opening\
      \ command (enrollment, unknown, busy or servo fault)\");\n  rfid.PICC_HaltA();\n  rfid.PCD_StopCrypto1();\n\
      }\n"
  expected_output: 'Enrollment prints UID: followed by all hexadecimal bytes. With your array provisioned,
    an allowed scan prints Open pulse requested for 5 seconds; after the interval it prints Starting pulse
    restored; position not measured. An unknown card requests no opening. These expectations are not recorded
    hardware results, and the messages do not establish mechanical locking.'
  common_mistakes:
  - text: Testing input and output for the first time together.
  - text: Using a GPIO pin that does not match the code constant.
  - text: Expecting an ESP32 GPIO to power a motor, pump, or lock directly.
  - text: Forgetting the shared ground between modules.
  troubleshooting:
  - problem: No UID prints
    fix: Check selected 13.56 MHz card, 3.3 V reader supply and SCK18/MISO19/MOSI23/SS5/RST22. A 125 kHz tag
      will not work.
  - problem: Every card denied
    fix: Enrollment intentionally denies all. Replace the complete byte array and its length, set PROVISIONED=true
      and re-upload; check Serial.
  - problem: Servo does not move
    fix: Use exact positional FS90, external 5 V and shared ground. Enrollment has no pulses; inspect attach
      status. Never power it from GPIO or 3V3.
  - problem: Resets or jams
    fix: Disconnect servo power. Check supply response, wiring, GPIO5 reset loading and mechanical obstruction;
      do not force the horn or broaden pulse limits.
