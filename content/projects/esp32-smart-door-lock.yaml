  story: 'ESP32 Smart Door Lock reads an MFRC522 RFID card, compares the scanned UID with the approved-card
    list, and moves the servo on GPIO26 only for the classroom card that should unlock the prototype.


    The important lesson is not only the finished door lock prototype. You learn to test the reader before
    the servo, keep actuator power separate from ESP32 GPIO control, and return the servo to the locked position
    after the timed unlock window.'
  eli12: Think of the ESP32 as the brain. The RFID reader checks the card. The servo is the small arm that
    moves when the card is approved. The code is the rule book that decides whether to unlock or stay locked.
  parent_safety: Keep this off a real door. Disconnect all supplies before wiring; remove the servo horn/load
    for initial tests. Use external regulated 5 V for the selected servo, never GPIO, 3V3 or the DevKit USB
    path. Share ground but not external +5 V with the USB-powered board. Pulses may cause immediate movement
    when provisioned code starts. Keep a power disconnect reachable.
  learning_objectives:
  - Wire and test the MFRC522 RFID reader before connecting the rest of the circuit.
  - Map each signal to a named ESP32 GPIO and keep the code constants readable.
  - Control the servo signal on GPIO26 using an explicit approved-card decision.
  - Use Serial Monitor as an engineering tool, not only as a success message.
  - Identify power, wiring, and timing faults using a repeatable test checklist.
  circuit_explanation: The circuit is split into an input side and an actuator side. The MFRC522 RFID reader
    tells the ESP32 which card is present. The servo receives only a control signal from GPIO26; actuator power
    must come from a suitable low-voltage source, not from an ESP32 GPIO pin.
  engineering_explanation: 'This teaches card identification and timed motion only. UID comparison is cloneable,
    and the pinned library does not provide a secure door authentication system. No anti-tailgating, door-position
    feedback, actuator supervision, backup power or emergency egress design exists. GPIO5 is a classic ESP32
    strapping pin: check the reader does not impose an incompatible reset level; if it does, review a different
    SS pin and update both table and sketch. Do not infer that a commanded pulse locks a real door.'
  code_explanation: Explicit SPI pins remove reliance on board defaults. The sketch prints the UID before comparison,
    checks its full length and uses a millis-based five-second window. It never treats a key fob appearance
    as compatibility evidence. ESP32Servo writes commanded pulse widths, not measured angles. A failed attach
    suppresses opening commands; a stalled or disconnected servo is not detected.
  testing_checklist:
  - Check enrollment prints the complete UID with servo power off.
  - Verify exact pins and separate servo positive supply.
  - With horn removed, compare allowed/unknown card messages and the five-second return command.
  - Confirm reset/power loss does not imply a secure mechanical state.
