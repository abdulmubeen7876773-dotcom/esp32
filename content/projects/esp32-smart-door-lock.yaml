  wiring:
    illustration_alt: ESP32 Smart Door Lock wiring diagram
    summary: Wire the MFRC522 RFID reader first, verify card reads in Serial Monitor, then connect the servo signal
      on GPIO26. Keep the build low-voltage and treat the servo or lock mechanism as a classroom prototype.
    steps:
    - Unplug USB before placing modules on the breadboard.
    - Connect the MFRC522 RFID reader power pins according to its module label; common MFRC522 boards use 3.3 V
      logic, not 5 V GPIO signals.
    - Connect MFRC522 SS/SDA to GPIO5 and RST to GPIO22 to match the code constants.
    - Connect the MFRC522 SPI bus to the ESP32 SPI pins used by your board and library setup.
    - Connect the servo signal wire to GPIO26 and share ground with the ESP32.
    - Power the servo or lock actuator from a suitable low-voltage supply if USB power is not stable; do not power
      a motorized lock directly from an ESP32 GPIO.
    - Upload the sketch, scan a known card, and verify Serial Monitor before attaching the lock mechanism.
