  story: 'ESP32 Smart Door Lock turns the ESP32 into a real object that senses something, decides what it means,
    and reacts in the physical world.


    The important lesson is not only the finished door lock prototype. You learn how to separate input, decision
    logic, and output so a project stays debuggable instead of becoming a pile of wires and guesses.'
  eli12: Think of the ESP32 as the brain. The RFID reader checks the card. The servo is the small arm that moves
    when the card is approved. The code is the rule book that decides whether to unlock or stay locked.
  parent_safety: This tutorial is designed for low-voltage learning on USB or a regulated low-voltage supply. Unplug
    the ESP32 before changing wires. Keep motors, pumps, door hardware, and relay loads separate from the USB programming
    circuit. Do not use mains voltage on a breadboard, and do not treat this classroom prototype as a certified
    physical security system.
  learning_objectives:
  - Wire and test the MFRC522 RFID reader before connecting the rest of the circuit.
  - Map each signal to a named ESP32 GPIO and keep the code constants readable.
  - Control the servo signal on GPIO26 using an explicit approved-card decision.
  - Use Serial Monitor as an engineering tool, not only as a success message.
  - Identify power, wiring, and timing faults using a repeatable test checklist.
  circuit_explanation: The circuit is split into an input side and an actuator side. The MFRC522 RFID reader tells
    the ESP32 which card is present. The servo receives only a control signal from GPIO26; actuator power must come
    from a suitable low-voltage source, not from an ESP32 GPIO pin.
  engineering_explanation: A reliable door lock prototype is built in layers. First prove the input, then prove
    the output, then join them with simple state logic. This prevents a common beginner problem where the robot,
    lock, or automation fails and every wire looks suspicious at the same time. RFID card IDs are identifiers for
    a prototype demo, not tamper-resistant authentication.
  code_explanation: The example defines SS_PIN as GPIO5, RST_PIN as GPIO22, and SERVO_PIN as GPIO26. It reads the
    RFID UID, compares it with allowedUid, moves the servo only for an approved card, and prints "Unknown card" for
    anything else.
  testing_checklist:
  - ESP32 appears on the correct port and accepts a basic blink upload.
  - Ground is shared between every module that exchanges signals with the ESP32.
  - Each GPIO in the code matches the wire connected on the breadboard.
  - Serial Monitor prints startup text at 115200 baud.
  - The MFRC522 reader reports card scans before the servo is attached.
  - An unknown card leaves the servo locked.
  - The approved card unlocks for 5 seconds and then returns to locked.
  - The circuit still behaves correctly after power is removed and restored.
