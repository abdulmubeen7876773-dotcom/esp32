  mission_title: Build Your Smart Door Lock
  difficulty: Intermediate
  age: Ages 12+
  estimated_time: 90-150 min
  budget: Under $35
  what_you_build: A tabletop RFID access-decision demonstration. An MFRC522 reads a compatible card UID; after
    explicit provisioning, a matching UID commands a small unloaded servo for five seconds, then returns to
    its starting command. Enrollment mode prints UIDs without starting servo pulses. No real door, solenoid
    or certified security system is supported.
  components:
  - item: Classic ESP32-WROOM DevKit
    note: USB data cable; explicit SPI pins in code.
    link: /components/esp32-devkit.html
  - item: Documented 3.3 V MFRC522 SPI breakout and matching card
    note: Verify actual labels; pin marked SDA is chip select in SPI mode.
    link: /components/mfrc522-rfid-reader.html
  - item: 'FEETECH FS90 positional servo, Pololu #2818'
    note: External regulated 5 V, at least 1 A bench budget for one unloaded servo; verify actual peaks.
  - item: 10 kΩ resistor and short wires
    note: Servo Signal-to-GND pull-down; motor power via suitable terminals.
    link: /components/through-hole-resistors.html
  bom: []
  wiring:
    illustration_alt: Logical MFRC522 SPI and externally powered FS90 circuit; not physical connector pin order
    summary: Use 3V3 and GND for the selected reader; SCK18, MISO19, MOSI23, SS/SDA5 and RST22 match explicit
      SPI.begin(18,19,23,5). Leave IRQ unused. FS90 signal uses GPIO26 with 10 kΩ to GND; positive uses external
      regulated 5 V and ground joins supply negative and ESP32 GND. Keep external positive separate from USB.
      Read the actual connector documentation, not generic colors or this logical drawing.
    steps:
    - Disconnect USB and servo power. Wire the reader by labels using the table.
    - Leave servo power off; upload enrollment-mode code and open Serial at 115200. Scan a compatible card
      and record its complete UID byte sequence.
    - Replace ALLOWED_UID with those bytes, including all 4, 7 or 10 bytes as printed. Set PROVISIONED=true
      only for the demonstration card; re-upload.
    - Wire the selected unloaded servo and pull-down, verify shared ground and separate positive supply, then
      enable external servo power with the area clear.
    - Verify unknown cards leave the commanded starting state; an allowed card requests 1600 µs for five seconds
      then 1400 µs. Actual position and mechanical locking are not sensed.
