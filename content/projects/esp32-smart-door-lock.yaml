  faqs:
  - question: Can a solenoid replace this servo?
    answer: No. It needs a separately specified driver, supply, protection and control design; this sketch
      sends servo pulses only.
  - question: Can I secure a real door with this?
    answer: No. UID matching and commanded hobby-servo motion are educational; real access control needs secure
      authentication and a professionally reviewed mechanical/egress design.
  tutorial_flow: true
  assumptions: 'Classic ESP32-WROOM DevKit with the named pins exposed; Arduino IDE 2.x and Arduino-ESP32 3.3.2
    review baseline, not a latest-release claim. Other chip families require their own pin review. Serial Monitor:
    115200 baud. Documentation/code review does not establish compilation or hardware operation; neither has
    been performed for these changes. Use a documented 3.3 V SPI MFRC522 breakout and compatible 13.56 MHz
    ISO/IEC 14443-A card (for example MIFARE Classic); a 125 kHz fob is not compatible and arbitrary NFC phones/cards
    are not promised. Servo: positional FEETECH FS90 as documented by Pololu #2818, which supports 3.3 V control.
    FS90R, SG90 clones and solenoid locks are excluded. Keep the servo unloaded; the narrow 1400/1600 µs commands
    are not guaranteed lock angles.'
  libraries:
  - Arduino-ESP32 3.3.2 review baseline, built-in SPI.
  - 'Library Manager: MFRC522 by GithubCommunity / Miguel Balboa, version 1.4.12; ESP32Servo version 3.0.9.
    These exact sources were reviewed, not compiled here. MFRC522 maintenance is limited; this UID comparison
    is not a production access-control design.'
  configuration: The default PROVISIONED=false prints each scanned UID and leaves servo pulses disabled. Use
    a private demonstration card, replace the entire ALLOWED_UID array with its printed hexadecimal bytes and
    then set PROVISIONED=true. The dummy array is not a usable credential. UID length is checked as well as
    content. A UID can be copied on some cards; it is an identifier, not secure authentication. Start with
    an unloaded FS90 and review START_US=1400 and OPEN_US=1600. Do not enlarge travel or attach a latch without
    measuring the mechanical range and reviewing stall/recovery behavior.
  behavior:
  - - Enrollment
    - Print complete UID; no servo attachment/pulses.
  - - Provisioned boot
    - Requests the starting pulse immediately if servo attachment succeeds. No position sensing.
  - - Allowed card
    - Requests open pulse for five seconds; timer services return without a five-second delay. Extra scans
      do not extend an active window.
  - - Unknown / power failure
    - Unknown scan gives no new opening command. Loss of power does not guarantee a physical locked or unlocked
      state.
