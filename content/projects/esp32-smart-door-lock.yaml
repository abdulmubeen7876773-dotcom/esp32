  faqs:
  - question: Why does my RFID reader or keypad input reading look wrong?
    answer: Check MFRC522 power, ground, SS on GPIO5, RST on GPIO22, and SPI wiring before changing access logic.
      Test the reader alone first.
  - question: Why does the servo lock not respond?
    answer: Check the shared ground, GPIO26 signal wire, servo power supply, and servo horn position before changing
      the allowed card list.
  - question: Can this protect a real door?
    answer: No. Treat it as a low-voltage classroom prototype. Real locks need mechanical fail-safe planning, secure
      installation, and adult review.
