  story: 'ESP32 Smart Irrigation System reads a soil moisture probe, compares the calibrated dry/wet range
    with a watering threshold, and switches a relay-controlled pump output only when the measured soil condition
    calls for it.


    The important lesson is not only the finished irrigation controller. You learn to calibrate the probe in
    real soil, choose thresholds from those readings, and keep pump power isolated from the ESP32 control signal.'
  eli12: Think of the ESP32 as the brain. The soil moisture probe is how it notices the world. The relay-controlled
    pump is how it answers back. The code is the rule book that tells the brain what to do when the numbers
    change.
  parent_safety: Disconnect USB and both external supplies before wiring. Keep the controller, connections
    and supply dry; this probe is not permission to submerge its electronics. Start with the pump supply unplugged.
    Use a reachable power disconnect and supervise all watering; welded contacts, siphoning, dry running and
    plausible sensor faults are not prevented by firmware. No mains wiring is covered. Keep the selected pump
    inlet submerged/primed during its brief supervised run, but keep the sensor electronics and all connections
    dry. Do not use it for drinking water.
  learning_objectives:
  - Wire and test the soil moisture probe before connecting the rest of the circuit.
  - Map each signal to a named ESP32 GPIO and keep the code constants readable.
  - Control relay-controlled pump using a clear threshold or command instead of hidden magic numbers.
  - Use Serial Monitor as an engineering tool, not only as a success message.
  - Identify power, wiring, and timing faults using a repeatable test checklist.
  circuit_explanation: The circuit is split into an input side and an output side. The soil moisture probe
    tells the ESP32 what is happening. The relay-controlled pump receives a controlled signal from the ESP32,
    usually through a driver, relay, or module that can handle more current than a GPIO pin.
  engineering_explanation: A probe reports an electrical response affected by soil, salinity, depth and installation.
    Relative calibration is useful for a pot experiment, not a universal moisture percentage. The SEN0193 specified
    output fits this selected ESP32 input configuration; attenuation is not overvoltage protection. Follow
    the detailed ADC guide for measurement limits. A plausible stuck reading can escape these guards. Use no
    unattended pump until the whole hydraulic/electrical design has independent fault protection.
  code_explanation: The sketch explicitly selects 12-bit ADC1 raw counts and attenuation. Calibration produces
    a relative scale, then two thresholds provide hysteresis. Timeout is checked every loop; sensor checks
    run nominally once a second. Faults latch, so the software does not repeatedly restart a timed-out pump.
    No status LED is driven. Hardware contacts, water flow and soil health are not measured.
  testing_checklist:
  - Verify the default sketch never commands the relay ON.
  - Record endpoints with pump power disconnected.
  - Check relay reset/OFF/ON using contact continuity before attaching the pump.
  - In a supervised test verify hysteresis, soak delay and timeout latch with suitable spill containment.
  - Power off before simulating a missing sensor; a floating input may not be detected.
