  what_you_build: 'A supervised plant-watering prototype: calibrate the probe with the pump disabled, then
    use two moisture thresholds to control a normally-open relay contact. Startup is OFF, each watering run
    is limited, and an out-of-range reading or run timeout latches OFF until reset. It is not an unattended
    irrigation or plant-safety guarantee.'
  components:
  - item: Classic ESP32-WROOM DevKit
    note: USB data cable; GPIO34 ADC1 and GPIO26 output.
    link: /components/esp32-devkit.html
  - item: DFRobot SEN0193 probe
    note: Supply from 3V3; manufacturer specifies analog output 0–3.0 V. Identify labelled terminals.
  - item: 'Adafruit STEMMA relay #4409'
    note: External regulated 5 V control supply; 10 kΩ Signal-to-GND pull-down.
    link: /components/relay-module.html
  - item: 'Adafruit #4547 3 V submersible pump, tubing and separate regulated 3 V supply'
    note: Listed operating draw 100 mA is not a stall rating; verify startup/stall load, DC contact rating,
      fuse, leads and flyback diode before use.
  - item: 10 kΩ resistor and suitable terminals
    note: Keep pump current off breadboard/GPIO wiring.
    link: /components/through-hole-resistors.html
  bom: []
  wiring:
    illustration_alt: Logical SEN0193 and STEMMA irrigation circuit with separate pump supply and flyback diode;
      not physical pin positions
    summary: SEN0193 VCC goes to 3V3, GND to ESP32 GND and OUT to GPIO34. STEMMA Signal goes to GPIO26 with
      10 kΩ to GND; its Vin uses external regulated 5 V, with control supply negative joined to ESP32 GND.
      Keep external positive separate from USB. In the isolated contact circuit, pump supply positive goes
      through an appropriate fuse to COM; NO goes to pump positive; pump negative returns to pump supply negative.
      Fit a flyback diode directly across the brushed pump, cathode/stripe at pump positive and anode at pump
      negative; select forward/surge current and reverse voltage ratings for the motor/supply. Contact isolation
      means the separate pump return need not join control ground. Read labels, not illustration positions.
    steps:
    - Disconnect all power. Wire and test the sensor and relay control side without pump power.
    - Upload the default calibration-only sketch. Observe stable raw readings with the same soil, insertion
      depth and supply at a dry condition and after watering/draining. Do not immerse the upper electronics.
    - Set DRY_RAW and WET_RAW from your own observations; this build requires dry counts greater than wet counts.
      Set CALIBRATED true only after reviewing the measured range.
    - With the pump supply still unplugged, verify LOW=OFF and HIGH=ON at COM/NO. Unknown relay polarity needs
      a different reviewed interface, not a blind code inversion.
    - Verify pump/contact/supply ratings and suppression, wire the contact circuit, then supervise a short
      test with the disconnect reachable.
