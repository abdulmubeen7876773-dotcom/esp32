    direction: Input ADC1
    notes: 3.0 V maximum documented output; raw counts are not water-content percentage
  - signal: STEMMA Signal
    esp32_pin: GPIO26
    direction: Output
    notes: Active HIGH; 10 kΩ to control GND
  - signal: STEMMA Vin / GND
    esp32_pin: External +5 V / shared GND
    direction: Power
    notes: Do not join external +5 V to USB-powered board positive
  - signal: Relay COM → NO
    esp32_pin: Pump supply + → pump +
    direction: Switched load
    notes: NC unused; pump − returns to its own supply −; diode across pump
  code:
    filename: smart-irrigation-system.ino
    content: "#include <Arduino.h>\nconstexpr uint8_t SOIL_PIN = 34, RELAY_PIN = 26;\nconstexpr bool CALIBRATED\
      \ = false; // Enable only after measuring your own soil.\nconstexpr int DRY_RAW = 0, WET_RAW = 0; //\
      \ Replace both; dry must be higher.\nconstexpr uint32_t SAMPLE_MS = 1000, MAX_RUN_MS = 10000, SOAK_MS\
      \ = 60000;\nbool pumpOn = false, fault = false, calibrationOK = false;\nuint32_t lastSample = 0, runStarted\
      \ = 0, stoppedAt = 0;\n\nvoid stopPump() {\n  digitalWrite(RELAY_PIN, LOW); // Supported STEMMA 4409\
      \ only: LOW is OFF.\n  pumpOn = false;\n  stoppedAt = millis();\n}\nvoid failOff(const char* reason)\
      \ {\n  stopPump(); fault = true;\n  Serial.print(\"LATCHED OFF: \"); Serial.println(reason);\n}\nvoid\
      \ setup() {\n  digitalWrite(RELAY_PIN, LOW);\n  pinMode(RELAY_PIN, OUTPUT); // External 10k pull-down\
      \ covers high-impedance reset.\n  stopPump();\n  Serial.begin(115200);\n  analogReadResolution(12);\n\
      \  analogSetPinAttenuation(SOIL_PIN, ADC_11db);\n  calibrationOK = WET_RAW > 100 && DRY_RAW < 4000 &&\
      \ DRY_RAW-WET_RAW >= 200;\n  if (CALIBRATED && !calibrationOK) failOff(\"invalid calibration constants\"\
      );\n  Serial.println(CALIBRATED ? \"Configured; startup soak before watering\" :\n    \"CALIBRATION ONLY:\
      \ pump OFF; record raw values\");\n}\nvoid loop() {\n  uint32_t now = millis();\n  if (pumpOn && now-runStarted\
      \ >= MAX_RUN_MS) failOff(\"watering timeout; inspect before reset\");\n  if (now-lastSample < SAMPLE_MS)\
      \ return;\n  lastSample = now;\n  int raw = analogRead(SOIL_PIN);\n  Serial.printf(\"Soil raw: %d\",\
      \ raw);\n  if (!CALIBRATED) { Serial.println(\" | calibration only, OFF\"); return; }\n  if (fault) {\
      \ Serial.println(\" | LATCHED OFF\"); return; }\n  if (raw < 100 || raw > 4000 || raw < WET_RAW-100 ||\
      \ raw > DRY_RAW+100) {\n    Serial.println(); failOff(\"reading outside configured guard band\"); return;\n\
      \  }\n  float relative = 100.0f * (DRY_RAW-raw) / (DRY_RAW-WET_RAW);\n  relative = constrain(relative,\
      \ 0.0f, 100.0f);\n  if (pumpOn && relative >= 55.0f) stopPump();\n  else if (!pumpOn && relative <= 30.0f\
      \ && now-stoppedAt >= SOAK_MS) {\n    digitalWrite(RELAY_PIN, HIGH); pumpOn = true; runStarted = now;\n\
      \  }\n  Serial.printf(\" | relative %.1f %% | Pump %s\\n\", relative, pumpOn ? \"ON\" : \"OFF\");\n}\n"
  expected_output: Initially Serial prints raw counts and calibration only, OFF. With measured constants and
    calibration enabled, a supervised dry condition can start the relay after the startup soak. A wet threshold
    stops it. A ten-second run without reaching the wet threshold produces LATCHED OFF; reset only after diagnosis.
    These are expected checks, not recorded hardware results.
  common_mistakes:
  - text: Testing input and output for the first time together.
  - text: Using a GPIO pin that does not match the code constant.
  - text: Expecting an ESP32 GPIO to power a motor, pump, or lock directly.
  - text: Forgetting the shared ground between modules.
  troubleshooting:
  - problem: Pump starts during reset
    fix: Disconnect load power. Confirm exact active-HIGH relay, Signal pull-down and COM/NO. An active-LOW
      module is outside this circuit.
  - problem: Raw counts barely change or run backwards
    fix: Check selected sensor, 3.3 V supply, depth and soil contact. Measure endpoints again; do not reverse
      thresholds to hide an unknown variant.
  - problem: LATCHED OFF
    fix: Read the reason. Check calibration and watering response with pump power off; verify time/flow suitability
      before a manual reset.
  - problem: Relay clicks but pump does not run
    fix: With power off inspect COM/NO, supply, fuse, polarity and motor ratings. GPIO does not supply pump
      power.
  - problem: Controller resets or water continues after OFF
    fix: Disconnect pump supply immediately. Inspect supply noise, suppression, welded contacts and siphoning;
      software OFF is not physical isolation.
