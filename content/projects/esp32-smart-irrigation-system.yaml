  faqs:
  - question: Does 50% mean the soil contains 50% water?
    answer: No. It is halfway between the two configured raw-count endpoints, not volumetric water content.
  - question: Can I use an active-LOW relay?
    answer: Not with this wiring and startup assumption. Select a separately reviewed interface and its reset
      behavior first.
  tutorial_flow: true
  assumptions: 'Classic ESP32-WROOM DevKit with the named pins exposed; Arduino IDE 2.x and Arduino-ESP32 3.3.2
    review baseline, not a latest-release claim. Other chip families require their own pin review. Serial Monitor:
    115200 baud. Documentation/code review does not establish compilation or hardware operation; neither has
    been performed for these changes. Use a DFRobot SEN0193 capacitive probe at 3.3 V and Adafruit STEMMA non-latching
    relay #4409 at external 5 V. Its input is active HIGH and accepts this 3.3 V command. A generic probe or
    active-LOW relay is not a drop-in substitute. Selected load: Adafruit #4547 submersible pump at a separate
    regulated 3 V, with the inlet submerged while running. Its listed 100 mA operating draw is not a startup/stall
    rating. Verify worst-case current, fuse and relay DC motor-switching suitability before powering it; otherwise
    stop at the contact-only test. This is not for drinking water or long-term installations.'
  libraries:
  - Arduino-ESP32 3.3.2 built-in ADC and GPIO APIs; no third-party library.
  configuration: Default CALIBRATED=false keeps the pump OFF while printing raw counts. Record dry and watered/drained
    soil readings in the actual pot; air/water endpoints alone do not establish a plant watering threshold.
    Replace both zero constants, then set CALIBRATED=true. The code requires 100 < WET_RAW < DRY_RAW < 4000
    and a span of at least 200 counts; these are illustrative fault guards, not sensor specifications. It switches
    ON below 30% and OFF above 55% of that relative calibrated span. Those percentages are not volumetric water
    content. Tune them for your plant before any supervised pump run. MAX_RUN_MS=10000 and SOAK_MS=60000 are
    bench limits, not validated watering amounts; shorter runs may be necessary.
  behavior:
  - - Startup / uncalibrated
    - Relay command LOW. Calibration-only mode never enables the pump. Configured mode waits at least 60 seconds.
  - - Dry / wet
    - Start at relative ≤30%; stop at ≥55%; after a normal stop wait at least 60 seconds before another run.
  - - Run limit / invalid reading
    - Command OFF and latch until reset. Diagnose with all load power disconnected before resetting.
  - - Undetected fault
    - A disconnected or damaged sensor may still produce plausible counts. There is no flow, tank-level, current
      or independent watchdog feedback.
