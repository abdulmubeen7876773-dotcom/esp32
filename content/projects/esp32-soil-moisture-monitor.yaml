  code_explanation: 'All LEDs start OFF. REFERENCES_RECORDED defaults false and both endpoints zero. Finite/range/separation
    checks precede division; outside-interval readings are withheld, not clamped. Bands at 33/67 are arbitrary display
    practice, not watering thresholds. Screening cannot establish sensor health: disconnected probes or stuck signals
    may look plausible.'
  expected_output: Serial prints raw_counts/ADC_pin_mV_est with REFERENCE_REQUIRED and LEDs OFF until references
    are entered. In-interval signals print relative_index / 100 and light one band; invalid/outside-reference signals
    withhold the index and turn LEDs OFF. These are prospective message types, not recorded measurements or proof
    of calibration.
  common_mistakes:
  - text: Treating driver mV or endpoint fitting as independent accuracy verification.
  - text: Changing module, divider or board without new records.
  - text: Clamping failed signals into plausible results.
  - text: Immersing electronics or altering powered wiring.
  troubleshooting:
  - problem: No calculated result
    fix: Read the named state; record both stable endpoints with the same circuit. Zero defaults deliberately fail;
      enabling the flag alone is insufficient.
  - problem: INVALID_SIGNAL
    fix: Power off; check module, common ground, divider and GPIO34. Rail/zero, outside 250–2200 mV or >20 mV within-window
      span is rejected. Do not force a result.
  - problem: OUTSIDE interval
    fix: Do not clamp to 0/100. Recheck sensor, depth, supply and references. A relative index is not water-content
      calibration.
  - problem: Plausible but stuck reading
    fix: A disconnected electrode, floating module input or stuck signal may look plausible. Use controlled references
      and independent instruments; software cannot prove connection/health.
  testing_checklist:
  - Documentation/API and numerical review only; no compilation or hardware/calibration result supplied.
  - Identify actual module and verify rail/interface with suitable instruments before trusting output.
  - Record reference conditions and unedited diagnostics separately from expected messages.
  - Check rejected readings withhold the index and turn all three LEDs OFF.
  engineer_tips:
  - Keep the full measurement chain unchanged.
  - Separate ADC calibration, endpoint fitting and independent accuracy checks.
