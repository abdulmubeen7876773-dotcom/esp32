  what_you_build: A Serial relative-index display for an identified DFRobot SEN0193 sensor, plus green/yellow/red
    LEDs. The index locates a reading between your air/water references; it is not percent water, relative humidity,
    watering advice or an automatic pump controller. The buzzer and incomplete cloud/pump alternatives are not supported
    here. The overview is a logical illustration, not a photograph or recorded result.
  eli12: Two reference readings make a ruler for comparison, not a universal measure of how much water a plant needs.
