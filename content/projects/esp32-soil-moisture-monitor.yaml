  assumptions: Classic ESP32-WROOM-32/32E DevKit with free GPIO34 (ADC1 input only), Arduino-ESP32 3.3.2 review
    baseline, Arduino IDE 2.x and built-in ADC functions only. Not a latest-release claim or a pin map for S3/C3/C5.
    No external sensor library is needed for this explicit recorded-point calculation.
  safety_badge: Low-voltage measurement lesson — unverified hardware
  configuration: 'With REFERENCES_RECORDED=false, record repeated stable ADC_pin_mV_est windows in air as AIR_PIN_MV.
    Briefly place only the sensing portion in water, no further than the manufacturer''s marked limit; electronics/connector
    stay dry. Record WATER_PIN_MV using the same board, supply, divider and attenuation. Do not copy Arduino Uno
    counts. Air voltage must exceed water voltage by at least 100 mV before enabling the flag. The separation and
    20 mV short-window noise limits are lesson screening choices, not manufacturer accuracy specifications.


    relative_index = 100×(Vair−Vpin)/(Vair−Vwater). This dimensionless 0–100 scale is NOT volumetric/gravimetric
    water percentage, %RH or a plant-water requirement. Outside-reference readings are withheld, not clipped. Soil
    composition, insertion depth, packing, salinity and temperature can change response. Record those conditions.
    Air/water endpoint adjustment alone does not validate a soil-water-content model.


    LEDs show arbitrary lower/middle/upper bands (<33, 33–<67, ≥67); they are not watering thresholds. No buzzer,
    relay, pump or cloud logger is implemented. Such extensions need separate complete circuits and validation.'
