    full_size_link: true
    illustration_alt: 'Logical DFRobot Gravity SEN0193 capacitive soil sensor circuit: separate regulated 5 V, common
      ground, 15k/10k divider and 100 nF at GPIO34; not physical pin order or tested hardware.'
    summary: Power the identified module from a separate regulated 5.0 V supply, ±5%, not from a GPIO. Its documented
      supply range is 3.3–5.5 V and output envelope is 0–3.0 V. USB powers the ESP32; never join the two positive
      supply outputs. Module AOUT feeds 15 kΩ (1%) then GPIO34; 10 kΩ (1%) and 100 nF connect this node to GND.
      Grounds are common. This divider scales the signal, not the module supply. Power both sides together while
      connected; power off USB and module supply before rewiring. Never connect a bare electrode or unknown output
      directly to GPIO34.
    steps:
    - Switch USB and module supply off. Identify exact module, rail and connector labels.
    - Module +/VCC → external regulated 5.0 V (±5%); module −/GND → common ESP32/external-supply GND. Never join
      positive rails. Keep sensor electronics and connector above the marked immersion limit.
    - Module A/AOUT → 15 kΩ → GPIO34 node; 10 kΩ and 100 nF separately node → GND. Never bypass the divider.
    - GPIO25/26/27 each → its own 330 ohm resistor → green/yellow/red LED anode; all cathodes → GND. GPIO32 unused;
      no buzzer.
    - Check logical diagram before powering. Serial 115200; first leave the record-enable flag false and inspect
      raw counts/pin-mV diagnostics.
    - Record both stable endpoints and conditions with this same chain before enabling calculation. Invalid/outside-interval
      signals deliberately give no calculated result.
