levels:
  beginner:
    level: beginner
    overview_html: <p>Read a defined SEN0193 sensor on classic ESP32, record your own references and display a relative
      0–100 index without claiming water-content percentage.</p>
    components:
    - Classic ESP32-WROOM DevKit
    - DFRobot Gravity SEN0193 capacitive soil sensor
    - 15 kΩ and 10 kΩ resistors, both 1%, and 100 nF capacitor
    - Regulated 5.0 V module supply (±5%), breadboard, leads and USB data cable
    - Three low-current LEDs and three separate 330 ohm resistors
    code: "#include <Arduino.h>\n#include <math.h>\n// Classic ESP32-WROOM DevKit; Arduino-ESP32 3.3.2 review baseline.\n\
      constexpr uint8_t SENSOR_PIN = 34; // ADC1 input only; no internal pull resistor.\n// AOUT -- 15k (1%) --\
      \ GPIO34 -- 10k (1%) -- GND; 100 nF GPIO34 to GND.\n// Raw and mV are separate conversions, averaged over\
      \ the same short window.\nfloat rawMean = 0, pinMv = 0;\nbool readWindow() {\n  uint32_t rawSum = 0, mvSum\
      \ = 0, minMv = 100000, maxMv = 0;\n  bool rails = false;\n  for (int i = 0; i < 32; ++i) {\n    uint16_t raw\
      \ = analogRead(SENSOR_PIN);\n    uint32_t mv = analogReadMilliVolts(SENSOR_PIN);\n    rawSum += raw; mvSum\
      \ += mv;\n    if (raw <= 16 || raw >= 4079) rails = true;\n    if (mv < minMv) minMv = mv;\n    if (mv > maxMv)\
      \ maxMv = mv;\n    delay(5);\n  }\n  rawMean = rawSum / 32.0f; pinMv = mvSum / 32.0f;\n  // Lesson screening,\
      \ not electrical protection or sensor-health proof.\n  return !rails && minMv >= 250 && maxMv <= 2200 && maxMv\
      \ - minMv <= 20;\n}\n\nconstexpr uint8_t LED_GREEN = 25, LED_YELLOW = 26, LED_RED = 27;\nconstexpr bool REFERENCES_RECORDED\
      \ = false;\nconstexpr float AIR_PIN_MV = 0.0f, WATER_PIN_MV = 0.0f;\nvoid indicatorsOff() {\n  digitalWrite(LED_GREEN,\
      \ LOW); digitalWrite(LED_YELLOW, LOW); digitalWrite(LED_RED, LOW);\n}\nbool validReferences() {\n  return\
      \ REFERENCES_RECORDED && isfinite(AIR_PIN_MV) && isfinite(WATER_PIN_MV) &&\n    WATER_PIN_MV >= 250 && AIR_PIN_MV\
      \ <= 2200 && AIR_PIN_MV - WATER_PIN_MV >= 100;\n}\nvoid setup() {\n  Serial.begin(115200);\n  analogReadResolution(12);\n\
      \  analogSetPinAttenuation(SENSOR_PIN, ADC_11db);\n  digitalWrite(LED_GREEN, LOW); digitalWrite(LED_YELLOW,\
      \ LOW); digitalWrite(LED_RED, LOW);\n  pinMode(LED_GREEN, OUTPUT); pinMode(LED_YELLOW, OUTPUT); pinMode(LED_RED,\
      \ OUTPUT);\n  indicatorsOff();\n  Serial.println(\"SEN0193 relative index; NOT water-content percent or watering\
      \ advice\");\n}\nvoid loop() {\n  indicatorsOff();\n  bool valid = readWindow();\n  Serial.printf(\"raw_counts=%.1f\
      \ ADC_pin_mV_est=%.1f\\n\", rawMean, pinMv);\n  if (!valid) Serial.println(\"INVALID_SIGNAL: rail, range or\
      \ short-window noise; index withheld\");\n  else if (!validReferences()) Serial.println(\"REFERENCE_REQUIRED:\
      \ record air/water pin mV; index withheld\");\n  else if (pinMv < WATER_PIN_MV || pinMv > AIR_PIN_MV)\n  \
      \  Serial.println(\"OUTSIDE_REFERENCE_INTERVAL: index withheld, not clamped\");\n  else {\n    float index\
      \ = 100.0f * (AIR_PIN_MV - pinMv) / (AIR_PIN_MV - WATER_PIN_MV);\n    if (!isfinite(index)) Serial.println(\"\
      INVALID_CALCULATION: index withheld\");\n    else {\n      Serial.printf(\"relative_index=%.1f / 100; NOT\
      \ percent water\\n\", index);\n      // Arbitrary display bands, not plant-specific watering thresholds.\n\
      \      if (index >= 67) digitalWrite(LED_GREEN, HIGH);\n      else if (index >= 33) digitalWrite(LED_YELLOW,\
      \ HIGH);\n      else digitalWrite(LED_RED, HIGH);\n    }\n  }\n  delay(5000);\n}\n"
