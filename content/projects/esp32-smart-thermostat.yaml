  story: |-
    ESP32 Smart Thermostat turns the ESP32 into a real object that senses room temperature, decides whether the value is above or below the thermostat thresholds, and commands a low-voltage relay fan output.

    The important lesson is not only the finished thermostat controller. You learn why separate fan-on and fan-off thresholds prevent relay chatter, how failed DHT22 reads leave the fan command safely off, and why sensor placement matters near heat sources.
  eli12: Think of the ESP32 as the brain. The DHT22 temperature sensor is how it notices the room. The relay module is how it commands a separate
    low-voltage fan. The code is the rule book that tells the brain what to do when the numbers change.
  parent_safety: This supervised low-voltage fan/indicator prototype is not an HVAC or safety controller. USB powers ESP32; use a separately rated
    low-voltage load supply. Unplug every supply before rewiring. Mains wiring is not covered or verified. OFF on sensor failure is a demo policy;
    cooling systems may need a fault alarm and independent protection.
  learning_objectives:
  - Wire and test the DHT22 temperature sensor on GPIO4 before connecting the relay circuit.
  - Map each signal to a named ESP32 GPIO and keep the code constants readable.
  - Control a relay module from GPIO26 using clear threshold and relay-polarity constants instead of hidden magic numbers.
  - Use Serial Monitor as an engineering tool, not only as a success message.
  - Identify power, wiring, and timing faults using a repeatable test checklist.
  circuit_explanation: The DHT22 side is a low-current digital sensor input on GPIO4 using 3.3 V logic. Many 3-pin DHT22 modules already include
    the DATA pull-up resistor; a bare 4-pin DHT22 normally needs about a 10 k ohm pull-up from DATA to 3.3 V. The relay input side is a low-voltage
    control signal on GPIO26. The relay contacts are a separate load-switching side for a low-voltage fan or indicator load, and the ESP32 must
    not power the fan or relay load directly from a GPIO.
  engineering_explanation: |-
    Hysteresis prevents switching around one setpoint. Output changes at the next valid sample, not immediately after a temperature change. This is a learning controller, not precision/fail-safe HVAC equipment.

    Coil supply, logic input and contact load have separate ratings. A 5 V coil does not prove 3.3 V input compatibility or safe pull-ups. Use the actual schematic. Shared signal ground does not establish optoisolation; motor transients matter even at low voltage.
  code_explanation: |-
    One flag sets both electrical levels. setup configures GPIO26, immediately writes OFF and waits for DHT22. Arduino-ESP32 3.x requires GPIO configuration before digitalWrite. This cannot guarantee a quiet relay while GPIO floats during reset: module-specific hardware bias may be needed.

    A failed sample clears both fanOn and output, so recovery in the middle band does not restore a previous ON state. Serial reports commands, not measured contacts or motor operation.
  testing_checklist:
  - Verify Serial-only upload before sensor wiring.
  - Check startup OFF and polarity with contacts unloaded.
  - Verify DHT22 readings about every 2.5 seconds away from heat.
  - Check both thresholds and middle-band hold in controlled low-voltage conditions.
  - 'Power off, remove DATA and restart: verify fault/OFF. Restore wiring powered off and check recovery.'
  - Check actual contacts/load separately from Serial commands.
