  faqs:
  - question: Why does my DHT22 thermostat reading look wrong?
    answer: Check 3.3 V power, ground, DATA on GPIO4, the pull-up resistor if using a bare 4-pin DHT22, and whether
      the sensor is near heat from the ESP32 regulator, relay module, fan exhaust, heater, or direct sunlight.
  - question: Why does the relay fan output not respond?
    answer: Check the ground connection first. Then confirm GPIO26, relay power, the separate low-voltage load circuit,
      and whether RELAY_ON and RELAY_OFF match your active-HIGH or active-LOW relay module.
  - question: Why does the thermostat use two temperatures instead of one?
    answer: The 27.0 C ON threshold and 25.5 C OFF threshold create hysteresis. The middle band keeps the previous fan
      state so the relay does not chatter near the setpoint.
  - question: Can I connect this to household HVAC wiring?
    answer: No. This tutorial is for a low-voltage fan or indicator prototype only. Do not connect mains or HVAC
      wiring to the breadboard circuit.
