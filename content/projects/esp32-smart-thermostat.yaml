  wiring:
    illustration_alt: ESP32 Smart Thermostat wiring diagram
    summary: Wire the low-voltage sensing side first. DHT22 VCC goes to 3.3 V, DHT22 GND goes to GND, and DHT22 DATA
      or OUT goes to GPIO4. After temperature readings work, connect relay VCC to the voltage your relay module requires,
      relay GND to ESP32 GND, and relay IN to GPIO26. The relay contacts are only for a separate low-voltage test fan
      or indicator load in this tutorial.
    steps:
    - Unplug USB and keep the relay load disconnected.
    - Connect a 3-pin DHT22 module VCC to 3.3 V, GND to GND, and DATA or OUT to GPIO4.
    - If you use a bare 4-pin DHT22 sensor, add about a 10 k ohm pull-up resistor from DATA to 3.3 V and leave the NC pin disconnected.
    - Connect relay VCC to 5 V if your relay module requires it, GND to ESP32 GND, and IN to GPIO26.
    - Keep the ESP32 GPIO side separate from the relay contact/load side; GPIO26 controls only the relay module input.
    - Connect only a separate low-voltage test fan or indicator load to the relay contacts during learning.
    - Power the ESP32 and watch Serial Monitor before connecting any moving fan.
