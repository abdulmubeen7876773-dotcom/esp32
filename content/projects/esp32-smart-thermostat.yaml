  faqs:
  - question: What happens if the sensor fails?
    answer: The next invalid sample clears fanOn and commands OFF; retry interval is 2.5 seconds. This is not fail-safe cooling protection.
  - question: Can I use an active-LOW relay?
    answer: Verify input compatibility/supply first, set RELAY_ACTIVE_LOW=true and check with contacts unloaded. Reset behavior needs separate
      hardware review.
  - question: Can I connect mains or household HVAC?
    answer: No. Only a low-voltage prototype is covered; mains wiring and HVAC safety behavior are not covered or verified.
  tutorial_flow: true
  assumptions: |-
    Classic ESP32-WROOM-32/32E DevKit with the named GPIOs exposed and unused. Select its exact board profile, or ESP32 Dev Module for an otherwise undocumented generic WROOM board. Arduino IDE 2.x and Arduino-ESP32 3.x; API review baseline 3.3.2, not a claim that it is the latest release. Other ESP32 families need their own pin/USB settings. Serial Monitor: 115200 baud. Examples are reviewed against documentation, not compiled or hardware tested in this content review.

    DHT22/AM2302 uses 3.3 V and GPIO4 with a DATA pull-up to 3.3 V. The relay example assumes a documented driver module with built-in coil protection, a 3.3 V-compatible input and active-HIGH operation (one flag selects active-LOW). No exact relay model is provided: confirm supply, input thresholds/pull-ups and reset behavior first. Never connect a bare relay coil to GPIO26.
  safety_standards:
  - Unplug USB and load power before rewiring.
  - Use a low-voltage load on COM/NO only; mains/HVAC wiring is outside this tutorial.
  - Verify module supply, input voltage/polarity and coil driver/protection.
  - Software OFF does not guarantee OFF during reset, boot, crash or welded contacts; appropriate hardware protection is separate.
  libraries:
  - name: DHT sensor library by Adafruit
    note: Install in Library Manager with Adafruit Unified Sensor. Sketch uses DHT22, not DHT11.
  - name: esp32 by Espressif Systems 3.x
    note: Select WROOM board/port; verify IDE guide Serial-only sketch first.
  configuration: |-
    FAN_ON_C=27.0 and FAN_OFF_C=25.5 describe cooling, not heating. Keep OFF below ON. RELAY_ACTIVE_LOW defaults false for active-HIGH. Set true only for a verified active-LOW module; ON/OFF levels change together.

    Wait 2.5 seconds before the first sample and between reads. DHT22 refreshes slowly and data can be roughly one sample old. Keep it away from regulator/relay heat, fan exhaust and sunlight. Serial reports commands, not feedback proving the fan works.
  behavior:
  - - Startup / first sample wait
    - fanOn=false; relay OFF command begins in setup, not throughout reset/boot.
  - - Valid temperature ≥27.0 C
    - Command ON.
  - - Valid temperature ≤25.5 C
    - Command OFF.
  - - Valid sample strictly between thresholds
    - Keep prior state; after startup/fault that state is OFF.
  - - Invalid read / NaN
    - Clear fanOn and command OFF at that sample; print fault and retry in 2.5 seconds.
  - - Valid readings return
    - Resume from OFF; restart only at/above 27.0 C.
