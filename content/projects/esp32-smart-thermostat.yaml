  code:
    filename: smart-thermostat.ino
    content: |-
      #include <DHT.h>
      #include <math.h>

      constexpr uint8_t DHT_PIN = 4, RELAY_PIN = 26;
      constexpr bool RELAY_ACTIVE_LOW = false; // Verify with contacts unloaded.
      constexpr uint8_t RELAY_ON = RELAY_ACTIVE_LOW ? LOW : HIGH;
      constexpr uint8_t RELAY_OFF = RELAY_ACTIVE_LOW ? HIGH : LOW;
      constexpr float FAN_ON_C = 27.0F, FAN_OFF_C = 25.5F;
      constexpr uint32_t SAMPLE_MS = 2500;
      static_assert(FAN_OFF_C < FAN_ON_C, "OFF threshold must be below ON");
      DHT dht(DHT_PIN, DHT22);
      bool fanOn = false;

      void setup() {
        Serial.begin(115200);
        // Configure GPIO before digitalWrite on Arduino-ESP32 3.x.
        pinMode(RELAY_PIN, OUTPUT);
        digitalWrite(RELAY_PIN, RELAY_OFF);
        dht.begin();
        Serial.println("Thermostat demo: OFF; waiting for first DHT22 sample");
        delay(SAMPLE_MS);
      }
      void loop() {
        const float tempC = dht.readTemperature();
        if (!isfinite(tempC)) {
          fanOn = false; // Reset hysteresis memory as well as output.
          digitalWrite(RELAY_PIN, RELAY_OFF);
          Serial.println("DHT22 fault: fan command OFF; retry in 2.5 s");
        } else {
          if (!fanOn && tempC >= FAN_ON_C) fanOn = true;
          else if (fanOn && tempC <= FAN_OFF_C) fanOn = false;
          digitalWrite(RELAY_PIN, fanOn ? RELAY_ON : RELAY_OFF);
          Serial.print("Temp C: "); Serial.print(tempC, 1);
          Serial.print(" | Fan command: "); Serial.println(fanOn ? "ON" : "OFF");
        }
        delay(SAMPLE_MS);
      }
  expected_output: Startup reports OFF. Valid readings command ON at/above 27.0 C, OFF at/below 25.5 C and hold state between. Invalid readings
    print a fault, clear state and command OFF. Recovery in the middle band stays OFF; an ON-threshold sample can restart. These are expected
    states to verify with contacts unloaded before adding the load.
  common_mistakes:
  - text: Driving a fan motor directly from an ESP32 GPIO.
  - text: Using mains voltage on a breadboard.
  - text: Forgetting hysteresis and making the relay chatter.
  - text: Placing the DHT22 beside the ESP32 regulator, relay coil, fan exhaust, heating element, or direct sunlight.
  - text: Using a relay module that needs more current than the USB port can provide.
  troubleshooting:
  - problem: DHT22 fault / NaN
    fix: Check DATA4, 3.3 V, GND, DHT22 type, pin orientation and pull-up. Keep 2.5-second timing; remove power before correcting wires.
  - problem: Relay reversed
    fix: Verify polarity with contacts unloaded, then change RELAY_ACTIVE_LOW. COM/NO, not COM/NC, is assumed.
  - problem: Relay clicks at boot
    fix: GPIO26 is not actively driven throughout reset. Verify an external OFF bias or interface; setup alone cannot promise glitch-free boot.
  - problem: Relay LED changes but fan does not
    fix: Check separate supply, COM/NO, starting current and ratings. LED/Serial command is not contact feedback.
  - problem: Unexpected sensor-fault recovery
    fix: This sketch clears fanOn. Middle-band recovery stays OFF; only ON threshold restarts. Check uploaded code/thresholds.
  - problem: Chatter or resets
    fix: Retain hysteresis, move sensor away from airflow/heat and verify coil/load supply and suppression. Never put load current through GPIO.
