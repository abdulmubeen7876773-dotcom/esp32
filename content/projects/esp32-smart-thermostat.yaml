  wiring:
    illustration_alt: ESP32 Smart Thermostat wiring diagram
    summary: GPIO4 reads DHT22; GPIO26 drives only a verified relay-module input. COM/NO contacts switch a separate low-voltage load, disconnected
      when released. The diagram is a logical map, not module pin order.
    steps:
    - Unplug USB and every supply; leave load disconnected for initial checks.
    - 'Wire a verified 3.3 V DHT22 breakout by labels: VCC to 3.3 V, GND to GND, DATA/OUT to GPIO4.'
    - 'For a standard bare DHT22, vented front facing you with leads down: pins1–4 are VCC, DATA, NC, GND. Add 10 kΩ from DATA to 3.3 V; leave
      NC open.'
    - Confirm relay IN accepts 3.3 V and cannot feed 5 V into GPIO26. Connect IN to GPIO26 and signal GND to ESP32 GND for the shared-ground driver
      module assumed here; use a suitable interface if incompatible.
    - Supply relay VCC/coil as documented; do not assume ESP32 5 V/VIN capacity. Follow exact JD-VCC/jumper/isolation instructions if present.
    - With contacts unloaded verify released at startup and on failed readings. Change RELAY_ACTIVE_LOW only when module documentation and unloaded
      checks require it.
    - After checks connect rated low-voltage supply positive to COM, NO to load positive, load negative to supply negative. Follow load switching/transient-protection
      requirements. Never route load current through GPIO.
