  code:
    filename: smart-thermostat.ino
    content: |
      #include "DHT.h"

      #define DHTPIN 4
      #define DHTTYPE DHT22
      #define RELAY_PIN 26

      const int RELAY_ON = HIGH;   // Change to LOW for an active-LOW relay module.
      const int RELAY_OFF = LOW;   // Change to HIGH for an active-LOW relay module.

      const float FAN_ON_C = 27.0;
      const float FAN_OFF_C = 25.5;
      bool fanOn = false;
      DHT dht(DHTPIN, DHTTYPE);

      void setup() {
        Serial.begin(115200);
        pinMode(RELAY_PIN, OUTPUT);
        digitalWrite(RELAY_PIN, RELAY_OFF);
        dht.begin();
        Serial.println("Smart thermostat ready");
      }

      void loop() {
        float tempC = dht.readTemperature();
        if (isnan(tempC)) {
          Serial.println("Temperature read failed");
          digitalWrite(RELAY_PIN, RELAY_OFF);
          delay(2000);
          return;
        }

        if (!fanOn && tempC >= FAN_ON_C) fanOn = true;
        if (fanOn && tempC <= FAN_OFF_C) fanOn = false;

        digitalWrite(RELAY_PIN, fanOn ? RELAY_ON : RELAY_OFF);
        Serial.print("Temp C: "); Serial.print(tempC, 1);
        Serial.print(" | Fan: "); Serial.println(fanOn ? "ON" : "OFF");
        delay(2000);
      }
  expected_output: 'Below 25.5 C, Serial Monitor prints Fan: OFF. Between 25.5 C and 27.0 C, the sketch keeps the previous fan state so the relay does not chatter. Warm the DHT22 to 27.0 C or higher and the relay command switches ON. Let the sensor cool to 25.5 C or lower and the relay command switches OFF.'
  common_mistakes:
  - text: Driving a fan motor directly from an ESP32 GPIO.
  - text: Using mains voltage on a breadboard.
  - text: Forgetting hysteresis and making the relay chatter.
  - text: Placing the DHT22 beside the ESP32 regulator, relay coil, fan exhaust, heating element, or direct sunlight.
  - text: Using a relay module that needs more current than the USB port can provide.
  troubleshooting:
  - problem: DHT22 returns NaN or "Temperature read failed"
    fix: Confirm 3.3 V, GND, DATA on GPIO4, the DHT library type is DHT22, and add about a 10 k ohm DATA-to-3.3 V pull-up if you are using a bare 4-pin sensor.
  - problem: Temperature seems too high
    fix: Move the DHT22 away from the ESP32 regulator, relay module heat, fan exhaust, heating element, and direct sunlight so it measures room air instead of local hot spots.
  - problem: Relay LED works but the fan does not
    fix: The ESP32 may be driving the relay input correctly while the separate low-voltage load circuit is not powered or not connected through the relay contacts.
  - problem: Relay logic is reversed
    fix: Some relay modules are active HIGH and some are active LOW. Swap RELAY_ON and RELAY_OFF in the constants instead of rewriting the thermostat logic.
  - problem: Relay chatters near the threshold
    fix: Keep the separate 27.0 C ON and 25.5 C OFF thresholds. If chatter remains, move the sensor away from the fan airflow and use a steadier low-voltage supply.
  - problem: ESP32 resets when relay switches
    fix: Use a suitable separate supply for the fan or load, keep relay/load wiring short, and make sure only signal ground is shared where the module requires it.
  - problem: Fan stays ON or OFF unexpectedly
    fix: Check the current temperature against FAN_ON_C and FAN_OFF_C, confirm GPIO26 reaches the relay IN pin, and verify the relay polarity constants match your module.
