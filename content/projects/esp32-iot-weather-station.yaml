  story: 'ESP32 IoT Weather Station turns the ESP32 into a local environmental monitor. The core build reads a BME280
    over I2C and prints temperature, humidity, and local pressure in Serial Monitor before you add any dashboard.


    The important lesson is not only the finished weather station. You learn how to make sensor data trustworthy first:
    wire the bus, verify the address, place the sensor well, and understand what each reading actually means.'
  eli12: Think of the ESP32 as the brain. The BME280 environmental sensor is how it notices the world. The Serial
    Monitor is how it reports the numbers. Once the readings are reliable, an optional OLED or dashboard can show
    the same data without changing the basic measurement idea.
  parent_safety: This tutorial is designed for low-voltage learning on USB or a regulated low-voltage supply. Unplug
    the ESP32 before changing wires. Use 3.3 V for the BME280 breakout unless its documentation clearly supports
    another supply, and do not feed unsafe signal voltages into ESP32 GPIO pins. This breadboard build is not weatherproof.
  safety_standards:
  - Unplug USB before changing jumper wires. Recheck 3.3 V, GND, SDA, and SCL before reconnecting power.
  - Use 3.3 V operation for the BME280 breakout unless that exact module documents safe 5 V input and level shifting.
  - Keep I2C signal levels ESP32-safe and share ground between the ESP32 and any connected BME280 or OLED module.
  - Protect outdoor sensors from rain and condensation while still allowing representative airflow.
  learning_objectives:
  - Wire a BME280 sensor over I2C using common Arduino-ESP32 GPIO21/GPIO22 defaults.
  - Detect whether the BME280 responds at 0x76 or 0x77.
  - Read temperature, humidity, and pressure and print clear labeled Serial Monitor values.
  - Interpret local pressure in hPa without confusing it with sea-level adjusted weather reports.
  - Identify placement-induced errors from heat, breath, sunlight, enclosures, and poor airflow.
  - Share the I2C bus with an optional SSD1306 OLED later when addresses do not conflict.
  - Extend reliable local sensor data into MQTT, logging, or a Wi-Fi dashboard after the core reading works.
  circuit_explanation: The BME280 uses I2C, so the ESP32 communicates over SDA and SCL. GPIO21 and GPIO22 are common
    Arduino-ESP32 defaults, but I2C pins are configurable in code. Most BME280 modules respond at 0x76 or 0x77.
    An optional SSD1306 OLED can share the same bus when its address, often 0x3C or sometimes 0x3D, does not conflict.
  engineering_explanation: Environmental readings are sensitive to placement. Heat from the ESP32, USB regulator,
    OLED, fingers, direct breath, direct sunlight, closed enclosures, and poor airflow can skew temperature and
    humidity. For meaningful room readings, place the BME280 away from heat-producing electronics, allow airflow,
    avoid touching it during measurement, and let readings stabilize. For outdoor use, protect the sensor from rain
    and condensation without sealing it away from representative airflow.
  code_explanation: The sketch starts Serial Monitor at 115200 baud, tries BME280 address 0x76 first, then tries
    0x77 if needed. After the sensor is found, it reads temperature, humidity, and pressure every two seconds and
    converts pressure from pascals to hPa for readable weather-station output.
  testing_checklist:
  - ESP32 appears on the correct port and accepts a basic blink upload.
  - Ground is shared between every module that exchanges signals with the ESP32.
  - Each GPIO in the code matches the wire connected on the breadboard.
  - Serial Monitor prints startup text at 115200 baud.
  - Startup text reports whether the BME280 was found at 0x76 or 0x77.
  - Temperature, humidity, and pressure print every two seconds with clear labels.
  - The BME280 readings change slowly when the air around the sensor changes.
  - Optional OLED or dashboard work is added only after Serial Monitor readings are stable.
  - The circuit still behaves correctly after power is removed and restored.
