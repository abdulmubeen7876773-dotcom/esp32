  code:
    filename: iot-weather-station.ino
    content: |
      #include <Wire.h>
      #include <Adafruit_BME280.h>

      Adafruit_BME280 bme;

      bool beginBME280() {
        if (bme.begin(0x76)) {
          Serial.println("BME280 found at I2C address 0x76");
          return true;
        }

        if (bme.begin(0x77)) {
          Serial.println("BME280 found at I2C address 0x77");
          return true;
        }

        return false;
      }

      void setup() {
        Serial.begin(115200);
        delay(200);

        Serial.println("ESP32 BME280 weather station");
        if (!beginBME280()) {
          Serial.println("BME280 not found at 0x76 or 0x77.");
          Serial.println("Check 3.3 V, GND, SDA=GPIO21, SCL=GPIO22, and module address.");
          while (true) delay(100);
        }

        Serial.println("Reading temperature, humidity, and pressure every 2 seconds");
      }

      void loop() {
        float tempC = bme.readTemperature();
        float humidity = bme.readHumidity();
        float pressureHpa = bme.readPressure() / 100.0F;

        Serial.print("Temperature C: ");
        Serial.print(tempC, 1);
        Serial.print(" | Humidity %: ");
        Serial.print(humidity, 1);
        Serial.print(" | Pressure hPa: ");
        Serial.println(pressureHpa, 1);

        delay(2000);
      }
  expected_output: Serial Monitor should show the detected BME280 address, then temperature in Celsius, humidity
    in percent, and local atmospheric pressure in hPa every two seconds. Warm air from your hand should change the
    temperature slowly, and breath near the sensor may raise humidity after a short delay.
  common_mistakes:
  - text: Using a BMP280 board and expecting humidity readings; BMP280 measures temperature and pressure only.
  - text: Assuming a missing or bad humidity value always proves BMP280; wiring, library, or module faults can also cause bad readings.
  - text: Powering the sensor from 5 V when the breakout is not documented as 5 V tolerant or level shifted.
  - text: Forgetting that common BME280 addresses are 0x76 and 0x77.
  - text: Placing the sensor directly above the warm ESP32 module, USB regulator, or OLED.
  troubleshooting:
  - problem: BME280 not found
    fix: Confirm SDA on GPIO21, SCL on GPIO22, shared GND, 3.3 V power, and loose breadboard rows. The sketch automatically tries 0x76 and 0x77, so scan the bus if both fail.
  - problem: Humidity is missing, NAN, or unrealistic
    fix: Check that the module is really BME280, not BMP280. Also check wiring, library selection, power, and whether the sensor has been touched or exposed to condensation.
  - problem: Temperature reads too high
    fix: Move the BME280 away from the ESP32, USB regulator, OLED, fingers, direct breath, direct sunlight, and closed enclosures. Let readings stabilize with airflow.
  - problem: Pressure differs from a weather app
    fix: The sketch prints local absolute pressure in hPa. Weather services often show sea-level adjusted pressure, so altitude compensation is needed for direct comparison.
  - problem: OLED is not detected after adding it
    fix: Confirm OLED SDA/SCL wiring, shared ground, module voltage compatibility, and address. SSD1306 OLED modules are often 0x3C and sometimes 0x3D.
  - problem: Readings jump or drift
    fix: Improve airflow, avoid breathing on the sensor, secure loose wires, check USB power, and move the BME280 away from heat sources.
  upgrade_ideas:
  - Add optional SSD1306 OLED pages for current readings after the Serial Monitor version is stable.
  - Publish readings to MQTT or a local web dashboard over Wi-Fi.
  - Store pressure history and show rising or falling trend.
  - Add deep sleep and proper weather shielding for outdoor battery logging.
