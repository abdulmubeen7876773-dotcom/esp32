  faqs:
  - question: Why does my BME280 environmental sensor reading look wrong?
    answer: Most wrong readings come from reversed power, loose breadboard rows, wrong SDA/SCL wiring, heat from
      nearby electronics, direct breath, or reading the sensor before it has settled.
  - question: Why is the BME280 not found on I2C?
    answer: Check SDA on GPIO21, SCL on GPIO22, 3.3 V power, ground, and loose wires. The sketch automatically tries
      both common BME280 addresses, 0x76 and 0x77.
  - question: Why do readings drift when the board is on the desk?
    answer: Heat from the ESP32 or nearby electronics can warm the air around the sensor. Move the BME280 away from
      the ESP32 module for steadier room readings.
  - question: Why does pressure differ from my weather app?
    answer: The sketch prints local absolute pressure in hPa. Weather apps often show pressure adjusted to sea level,
      so altitude compensation is needed for a direct comparison.
  - question: Is OLED or MQTT included in the core sketch?
    answer: No. The core sketch is Serial Monitor only. Add OLED, MQTT, logging, or a dashboard after the BME280
      readings are reliable.
