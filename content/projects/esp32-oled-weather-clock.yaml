    summary: You built an ESP32 OLED weather clock that combines Wi-Fi time, local timezone configuration, BME280 environmental readings, and a compact SSD1306 display.
    skills:
    - Wire SSD1306 and BME280 modules on the same I2C bus
    - Sync ESP32 time with NTP over Wi-Fi
    - Configure timezone offset for local clock display
    - Show temperature, humidity, and pressure on an OLED
  story: 'ESP32 OLED Weather Clock turns the ESP32 into a small desk display that combines network time with local room conditions.


    The useful lesson is how several layers work together: Wi-Fi gets time from NTP, the timezone settings turn that into a local clock, the BME280 measures the environment, and the SSD1306 turns those values into something easy to read.'
  eli12: Think of the ESP32 as a tiny clock brain. Wi-Fi lets it ask the internet for the current time, the timezone setting tells it what that time should look like where you live, the BME280 checks the room, and the OLED is the little screen that shows the result.
  parent_safety: This tutorial is designed for low-voltage learning on USB power and 3.3 V modules. Unplug the ESP32 before changing wires, keep the OLED and BME280 wiring tidy, and do not use mains voltage on a breadboard.
  safety_standards:
  - Unplug USB before changing jumper wires. Recheck 3.3 V and GND before reconnecting power.
  - Keep the OLED and BME280 on the ESP32 I2C pins shown in the wiring table, or update the Wire.begin pins to match your board.
  - Breadboards are for supervised, low-voltage prototypes. Move any permanent clock build into an insulated enclosure with strain relief for the USB cable.
  learning_objectives:
  - Wire an SSD1306 OLED and BME280 sensor on the ESP32 I2C pins.
  - Match SDA and SCL wiring to Wire.begin(21, 22) in the sketch.
  - Connect ESP32 Wi-Fi and sync time from NTP.
  - Configure UTC offset and daylight saving offset for local clock display.
  - Read BME280 temperature, humidity, and pressure and format them for a 128x64 OLED.
  circuit_explanation: The OLED and BME280 both use I2C, so they share SDA on GPIO21 and SCL on GPIO22 while keeping separate device addresses. The SSD1306 display is usually at 0x3C, while many BME280 boards use 0x76 or 0x77. Those addresses let the ESP32 talk to both modules on the same two signal wires.
  engineering_explanation: A reliable weather clock is built in layers. First initialize I2C, then confirm the OLED address, connect Wi-Fi, sync NTP time, apply the correct timezone offset, check the BME280 address, and only then draw the clock and weather values. Testing in that order makes a blank display or wrong time much easier to troubleshoot.
  code_explanation: The sketch starts I2C with Wire.begin(21, 22), initializes the SSD1306 at 0x3C, connects to Wi-Fi, and starts NTP with configTime. In the loop, getLocalTime returns the current local time, strftime formats it for the screen, the BME280 readings are collected when the sensor is detected, and the OLED is refreshed every two seconds.
  testing_checklist:
  - ESP32 appears on the correct port and accepts a basic upload.
  - OLED VCC is on 3.3 V, GND is shared, SDA is GPIO21, and SCL is GPIO22.
  - OLED address 0x3C is correct, or the code is changed to 0x3D for your module.
  - BME280 is connected to the same SDA and SCL lines and is detected at 0x76 or 0x77.
  - Serial Monitor prints the Wi-Fi IP address.
  - The OLED shows local time after NTP sync.
  - Temperature, humidity, and pressure update about every two seconds.
