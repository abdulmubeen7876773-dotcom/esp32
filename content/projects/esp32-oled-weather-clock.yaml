  complete:
    summary: You built an ESP32 OLED weather clock that combines Wi-Fi time, local timezone configuration, BME280 environmental readings, and
      a compact SSD1306 display.
    skills:
    - Wire SSD1306 and BME280 modules on the same I2C bus
    - Sync ESP32 time with NTP over Wi-Fi
    - Configure POSIX timezone rules for local time
    - Show temperature, humidity, and pressure on an OLED
  story: |-
    ESP32 OLED Weather Clock turns the ESP32 into a small desk display that combines network time with local room conditions.

    The useful lesson is how several layers work together: Wi-Fi gets time from NTP, the timezone settings turn that into a local clock, the BME280 measures the environment, and the SSD1306 turns those values into something easy to read.
  eli12: Think of the ESP32 as a tiny clock brain. Wi-Fi lets it ask the internet for the current time, the timezone setting tells it what that
    time should look like where you live, the BME280 checks the room, and the OLED is the little screen that shows the result.
  parent_safety: This tutorial is designed for low-voltage learning on USB power and 3.3 V modules. Unplug the ESP32 before changing wires, keep
    the OLED and BME280 wiring tidy, and do not use mains voltage on a breadboard.
  safety_standards:
  - Unplug USB before changing jumper wires. Recheck 3.3 V and GND before reconnecting power.
  - Keep the OLED and BME280 on the ESP32 I2C pins shown in the wiring table, or update the Wire.begin pins to match your board.
  - Breadboards are for supervised, low-voltage prototypes. Move any permanent clock build into an insulated enclosure with strain relief for
    the USB cable.
  learning_objectives:
  - Wire an SSD1306 OLED and BME280 sensor on the ESP32 I2C pins.
  - Match SDA and SCL wiring to Wire.begin(21, 22) in the sketch.
  - Connect ESP32 Wi-Fi and sync time from NTP.
  - Configure POSIX timezone rules for local time.
  - Read BME280 temperature, humidity, and pressure and format them for a 128x64 OLED.
  circuit_explanation: The OLED and BME280 both use I2C, so they share SDA on GPIO21 and SCL on GPIO22 while keeping separate device addresses.
    The SSD1306 display is usually at 0x3C, while many BME280 boards use 0x76 or 0x77. Those addresses let the ESP32 talk to both modules on the
    same two signal wires.
  engineering_explanation: |-
    Bring up OLED, BME280, Wi-Fi and time sync in that order. Place BME280 away from regulator heat and direct sunlight. The local display remains useful when a network service fails.

    Module supply and bus pull-up voltages are separate checks: a VIN regulator does not prove SDA/SCL are ESP32-safe. Parallel breakout pull-ups can become too strong on larger buses; consult actual module documentation and keep this two-device bus short.
  code_explanation: |-
    setup starts I2C, checks the OLED address, tries both sensor addresses and starts Wi-Fi without a blocking connection loop. display.begin uses periphBegin=false because Wire is configured already. An I2C ACK proves a responding device, not the controller identity.

    The loop tracks connection changes and retries Wi-Fi at 30-second intervals. Every two seconds it draws time/date, valid readings and status. Missing sensor initialization is retried every ten seconds; non-finite values are not shown as weather. The short getLocalTime timeout keeps a missing time sync from freezing the display.
  testing_checklist:
  - Verify the Serial-only first sketch and board/port before adding modules.
  - Scan addresses and verify the shared bus at 3.3 V.
  - Compare local time/date against a trusted clock after sync.
  - 'Remove router access: readings/status should continue; restore it and check reconnection.'
  - 'With power off remove BME280 and restart: clock/status should still work.'
  - Check units and room readings; this is not a calibrated weather instrument.
