  faqs:
  - question: Does this fetch a weather forecast?
    answer: No. BME280 measures local room conditions; Wi-Fi supplies NTP clock synchronization.
  - question: Can it work offline?
    answer: After sync the system clock continues while powered, with possible drift. A restart without internet has no valid time until NTP succeeds.
      No battery-backed RTC is included.
  - question: Why is local time wrong?
    answer: Set TIME_ZONE to verified POSIX rules. UTC0 is UTC and PKT-5 is UTC+5; daylight-saving regions need transition rules.
  tutorial_flow: true
  assumptions: |-
    Classic ESP32-WROOM-32/32E DevKit with the named GPIOs exposed and unused. Select its exact board profile, or ESP32 Dev Module for an otherwise undocumented generic WROOM board. Arduino IDE 2.x and Arduino-ESP32 3.x; API review baseline 3.3.2, not a claim that it is the latest release. Other ESP32 families need their own pin/USB settings. Serial Monitor: 115200 baud. Examples are reviewed against documentation, not compiled or hardware tested in this content review.

    Use a 128×64 I2C SSD1306 module (0x3C in this example; verify 0x3D if needed), and a BME280 I2C breakout documented for 3.3 V supply and 3.3 V bus signals. SH1106 displays need another driver. BMP280 has no humidity measurement. Both modules share SDA21/SCL22 with pull-ups to 3.3 V. No specific breakout vendor is assumed.
  libraries:
  - name: Board and port
    note: Install esp32 by Espressif Systems 3.x; verify the Serial-only first sketch from the IDE setup guide.
  - name: Adafruit SSD1306 and Adafruit GFX Library
    note: Install in Library Manager with required dependencies, including Adafruit BusIO.
  - name: Adafruit BME280 Library and Adafruit Unified Sensor
    note: Install in Library Manager; accept required dependencies.
  - name: WiFi, Wire and time.h
    note: Provided by the ESP32 board package; no separate generic WiFi library needed.
  configuration: |-
    Replace YOUR_WIFI_SSID and YOUR_WIFI_PASSWORD with a reachable 2.4 GHz network. Do not publish real credentials. Captive portals or blocked DNS/NTP can prevent time sync even when Wi-Fi connects.

    TIME_ZONE uses POSIX rules: UTC0 is UTC; PKT-5 is Pakistan UTC+5 (opposite sign to the usual UTC offset). A daylight-saving region needs verified transition rules, not a permanently added hour. For example, EST5EDT,M3.2.0/2,M11.1.0/2 describes US Eastern rules currently used; verify local rules. configTzTime applies local-time rules; NTP supplies the clock time.

    Match OLED_ADDRESS and SCREEN_WIDTH/HEIGHT to the module. Sensor detection tries 0x76 then 0x77. readPressure returns Pa; dividing by 100 gives hPa. This is local absolute pressure, not a sea-level weather report.
  behavior:
  - - Wi-Fi absent at boot
    - Continue drawing sensor/status data; retry every 30 seconds without an indefinite setup wait.
  - - Wi-Fi drops after sync
    - Keep the system clock running and show offline status. It can drift; there is no battery-backed RTC.
  - - Network returns
    - Request NTP on the disconnected-to-connected transition; periodic SNTP updates then continue.
  - - Time not yet synced
    - Show a waiting message; use a 10 ms getLocalTime timeout rather than its default multi-second wait.
  - - Sensor absent or invalid
    - Keep time/status visible and show a warning; retry missing sensor initialization every 10 seconds.
