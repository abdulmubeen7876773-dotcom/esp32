  code:
    filename: oled-weather-clock.ino
    content: |
      #include <WiFi.h>
      #include <Wire.h>
      #include <Adafruit_GFX.h>
      #include <Adafruit_SSD1306.h>
      #include <Adafruit_BME280.h>
      #include <time.h>

      #define I2C_SDA 21
      #define I2C_SCL 22
      #define OLED_ADDRESS 0x3C
      #define SCREEN_WIDTH 128
      #define SCREEN_HEIGHT 64

      const char* ssid = "YOUR_WIFI";
      const char* password = "YOUR_PASSWORD";

      // NTP supplies UTC. Set these values for your local time zone.
      const long GMT_OFFSET_SEC = 0;
      const int DAYLIGHT_OFFSET_SEC = 0;

      Adafruit_SSD1306 display(SCREEN_WIDTH, SCREEN_HEIGHT, &Wire, -1);
      Adafruit_BME280 bme;
      bool bmeReady = false;

      void showMessage(const char* line1, const char* line2) {
        display.clearDisplay();
        display.setTextSize(1);
        display.setTextColor(SSD1306_WHITE);
        display.setCursor(0, 0);
        display.println(line1);
        display.println(line2);
        display.display();
      }

      bool beginBME280() {
        if (bme.begin(0x76)) return true;
        if (bme.begin(0x77)) return true;
        return false;
      }

      void setup() {
        Serial.begin(115200);
        Wire.begin(I2C_SDA, I2C_SCL);

        if (!display.begin(SSD1306_SWITCHCAPVCC, OLED_ADDRESS)) {
          Serial.println("SSD1306 not found. Check address, power, SDA, and SCL.");
          while (true) delay(1000);
        }

        showMessage("OLED Weather Clock", "Connecting WiFi...");

        WiFi.begin(ssid, password);
        while (WiFi.status() != WL_CONNECTED) {
          delay(300);
          Serial.print(".");
        }
        Serial.println();
        Serial.print("WiFi connected: ");
        Serial.println(WiFi.localIP());

        configTime(GMT_OFFSET_SEC, DAYLIGHT_OFFSET_SEC, "pool.ntp.org", "time.nist.gov");

        bmeReady = beginBME280();
        Serial.println(bmeReady ? "BME280 ready" : "BME280 not found");
        showMessage("Clock ready", bmeReady ? "BME280 ready" : "Check BME280");
        delay(1200);
      }

      void loop() {
        struct tm timeinfo;
        if (!getLocalTime(&timeinfo)) {
          Serial.println("Waiting for NTP time...");
          showMessage("NTP sync", "Waiting...");
          delay(1000);
          return;
        }

        char timeText[6];
        char dateText[18];
        strftime(timeText, sizeof(timeText), "%H:%M", &timeinfo);
        strftime(dateText, sizeof(dateText), "%a %d %b", &timeinfo);

        display.clearDisplay();
        display.setTextColor(SSD1306_WHITE);
        display.setTextSize(2);
        display.setCursor(0, 0);
        display.println(timeText);

        display.setTextSize(1);
        display.setCursor(0, 22);
        display.println(dateText);

        if (bmeReady) {
          display.print("Temp: ");
          display.print(bme.readTemperature(), 1);
          display.println(" C");
          display.print("Hum:  ");
          display.print(bme.readHumidity(), 0);
          display.println(" %");
          display.print("Pres: ");
          display.print(bme.readPressure() / 100.0F, 0);
          display.println(" hPa");
        } else {
          display.println("BME280 not found");
          display.println("Clock only mode");
        }

        display.display();
        delay(2000);
      }
  expected_output: The OLED should show local HH:MM time, the date, temperature in Celsius, humidity percent, and pressure in hPa when a BME280 is connected. Serial Monitor should report Wi-Fi connection, BME280 status, and any NTP waiting messages.
  common_mistakes:
  - text: Leaving GMT_OFFSET_SEC at 0 and expecting local time in every country.
  - text: Buying a BMP280 board and expecting humidity; use BME280 if humidity is required.
  - text: Swapping SDA and SCL or using pins that do not match Wire.begin(21, 22).
  - text: Assuming every OLED is address 0x3C; some modules use 0x3D.
  - text: Powering an I2C module from 5 V when the board is not clearly 3.3 V safe.
  troubleshooting:
  - problem: OLED stays blank
    fix: Confirm 3.3 V, GND, SDA on GPIO21, SCL on GPIO22, and the OLED address. Try 0x3D if your module is not found at 0x3C.
  - problem: BME280 is not detected
    fix: Check the shared I2C wiring and sensor address. Most BME280 modules answer at 0x76 or 0x77.
  - problem: Time is wrong
    fix: NTP gives network time in UTC. Set GMT_OFFSET_SEC and DAYLIGHT_OFFSET_SEC for your location before judging the displayed time.
  - problem: NTP sync keeps waiting
    fix: Verify SSID, password, router access, and that the ESP32 can reach pool.ntp.org from your network.
  - problem: OLED works alone but fails with the BME280 connected
    fix: Make sure both modules share SDA and SCL cleanly, use short jumpers, and confirm the devices do not use the same I2C address.
