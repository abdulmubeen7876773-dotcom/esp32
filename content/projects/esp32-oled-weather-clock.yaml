  faqs:
  - question: Why is the displayed time not my local time?
    answer: NTP supplies UTC time. Set GMT_OFFSET_SEC and DAYLIGHT_OFFSET_SEC for your location before using the clock as a local display.
  - question: Can I build the clock without a BME280?
    answer: Yes. The sketch will still show the NTP clock and a BME280 warning, but the complete weather clock needs a BME280 for temperature, humidity, and pressure.
  - question: Why does the OLED not respond?
    answer: Check OLED power, ground, SDA on GPIO21, SCL on GPIO22, and the display I2C address before replacing the screen.
