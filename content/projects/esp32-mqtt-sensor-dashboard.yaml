  wiring:
    illustration_alt: ESP32 MQTT Sensor Dashboard wiring diagram
    summary: Connect the documented DHT22 VCC to 3V3, GND to GND and DATA to GPIO4. For a bare sensor
      add 10 kOhm from DATA to 3V3; inspect a breakout’s fitted pull-up before adding another. The existing
      diagram shows electrical signal relationships, not a universal module connector order.
    steps:
    - Unplug USB and identify VCC, DATA and GND from the actual sensor documentation.
    - Connect VCC to 3V3 and GND to GND.
    - Connect DATA to GPIO4 and verify its pull-up to 3V3. Leave a bare DHT22 NC pin unconnected.
    - Reconnect USB; first verify the matching DHT22 standalone example, then upload this MQTT sketch.
  gpio_map:
  - signal: DHT22 VCC
    esp32_pin: 3.3 V
    direction: Power
    notes: Match this wire to the code constant.
  - signal: DHT22 DATA
    esp32_pin: GPIO 4
    direction: Power
    notes: 10 kΩ pull-up to 3.3 V
  - signal: DHT22 GND
    esp32_pin: GND
    direction: Ground
    notes: Match this wire to the code constant.
  circuit_explanation: The DHT22 data pin uses a pull-up resistor so the signal idles HIGH. The ESP32
    reads the sensor locally, then uses Wi-Fi to publish the value to the broker. The hardware circuit
    is simple; the engineering challenge is reliable network behavior.
  engineering_explanation: 'MQTT separates producers from consumers: the broker routes messages by topic,
    not by a dashboard URL. Unique client IDs prevent one node disconnecting another; client IDs do not
    authenticate users. PubSubClient supports QoS 0 publishing and QoS 0/1 subscribing, so do not promise
    QoS 1 publishing from this sketch.


    This is plain TCP with WiFiClient on port 1883. TLS requires a suitable secure client, broker TLS
    listener and certificate/hostname verification; changing a port number alone is not TLS. Broker credentials
    and topic ACLs remain necessary. The command only requests a sample; it controls no actuator. Protect
    broader command interfaces separately. DHT22 sampling here is greater than two seconds and separate
    from the library’s 2000 ms cache.'
  libraries:
  - Built-in WiFi from Arduino-ESP32 3.3.2; install PubSubClient by Nick O’Leary version 2.8 through Library
    Manager.
  - Install Adafruit DHT sensor library 1.4.6 and Adafruit Unified Sensor 1.1.15 (dependency) through
    Library Manager. No JSON or dashboard library is required on the board.
  - 'Configure Mosquitto before uploading: 2.x without a listener binds to loopback only; that is not
    reachable from ESP32. A LAN listener also needs explicitly configured authentication. Follow the linked
    broker documentation and your platform’s service/firewall instructions.'
  code:
    filename: esp32-mqtt-sensor-dashboard.ino
    content: "#include <WiFi.h>\n#include <PubSubClient.h>\n#include <DHT.h>\n#include <cstring>\n\nconst\
      \ char* SSID = \"YOUR_WIFI_SSID\";\nconst char* PASSWORD = \"YOUR_WIFI_PASSWORD\";\nIPAddress BROKER(192,\
      \ 168, 1, 100); // Replace with your broker's LAN IPv4 address.\nconst char* MQTT_USER = \"YOUR_MQTT_USER\"\
      ;\nconst char* MQTT_PASSWORD = \"YOUR_MQTT_PASSWORD\";\nconst char* TEMP = \"esp32engine/sensors/room1/temperature\"\
      ;\nconst char* HUM = \"esp32engine/sensors/room1/humidity\";\nconst char* AVAIL = \"esp32engine/sensors/room1/availability\"\
      ;\nconst char* CMD = \"esp32engine/sensors/room1/cmd\";\nconst char* REPLY = \"esp32engine/sensors/room1/reply\"\
      ;\nconstexpr uint32_t WIFI_WINDOW = 15000, WIFI_RETRY = 30000, MQTT_RETRY = 10000;\nDHT dht(4, DHT22);\n\
      WiFiClient net; // Plain TCP. This sketch does NOT provide TLS.\nPubSubClient mqtt(net);\nString\
      \ clientId;\nbool wifiTrying = false, sampleRequested = false;\nuint32_t wifiStarted = 0, mqttAttempt\
      \ = 0, lastSample = 0;\n\nvoid onMessage(char* topic, byte* payload, unsigned int length) {\n  //\
      \ Payload is a byte span, not a null-terminated string.\n  if (strcmp(topic, CMD) == 0 && length\
      \ == 6 && memcmp(payload, \"sample\", 6) == 0)\n    sampleRequested = true;\n}\nvoid startWiFi()\
      \ {\n  wifiStarted = millis(); wifiTrying = true;\n  WiFi.begin(SSID, PASSWORD);\n  Serial.println(\"\
      Starting 15-second Wi-Fi window\");\n}\nvoid setup() {\n  Serial.begin(115200);\n  dht.begin();\n\
      \  WiFi.mode(WIFI_STA); WiFi.setAutoReconnect(false);\n  clientId = String(\"esp32-\") + WiFi.macAddress();\n\
      \  clientId.replace(\":\", \"\"); // Different hardware gets a different client ID.\n  Serial.print(\"\
      MQTT client ID: \"); Serial.println(clientId);\n  net.setConnectionTimeout(3000); // TCP connection\
      \ timeout, milliseconds.\n  mqtt.setSocketTimeout(3);       // MQTT response/read timeout, seconds.\n\
      \  mqtt.setServer(BROKER, 1883);\n  mqtt.setCallback(onMessage);\n  mqttAttempt = millis() - MQTT_RETRY;\n\
      \  startWiFi();\n}\nvoid loop() {\n  uint32_t now = millis();\n  if (WiFi.status() != WL_CONNECTED)\
      \ {\n    net.stop(); // Drop a stale broker socket; keep the sensor loop active.\n    if (wifiTrying\
      \ && now - wifiStarted >= WIFI_WINDOW) {\n      WiFi.disconnect(false); wifiTrying = false;\n  \
      \    Serial.println(\"Wi-Fi window ended; retry at 30-second cadence\");\n    }\n    if (!wifiTrying\
      \ && now - wifiStarted >= WIFI_RETRY) startWiFi();\n  } else {\n    wifiTrying = false;\n    if\
      \ (!mqtt.connected() && now - mqttAttempt >= MQTT_RETRY) {\n      Serial.println(\"Attempting broker\
      \ connection\");\n      if (mqtt.connect(clientId.c_str(), MQTT_USER, MQTT_PASSWORD, AVAIL, 0, true,\
      \ \"offline\")) {\n        const bool subscribed = mqtt.subscribe(CMD, 0);\n        const bool announced\
      \ = mqtt.publish(AVAIL, \"online\", true);\n        Serial.printf(\"Connected: subscribe queued=%d,\
      \ online queued=%d\\n\", subscribed, announced);\n      } else Serial.printf(\"Broker connect failed:\
      \ state=%d\\n\", mqtt.state());\n      mqttAttempt = millis(); // Backoff starts AFTER the synchronous\
      \ call returns.\n    }\n    if (mqtt.connected()) mqtt.loop();\n  }\n  now = millis();\n  // Never\
      \ let command bursts violate the DHT22's >2-second sampling interval.\n  if (now - lastSample >=\
      \ 30000 || (sampleRequested && now - lastSample >= 2500)) {\n    lastSample = now; sampleRequested\
      \ = false;\n    const float h = dht.readHumidity(), t = dht.readTemperature();\n    if (isnan(h)\
      \ || isnan(t)) Serial.println(\"DHT22 read failed; no new values published\");\n    else {\n   \
      \   Serial.printf(\"Sensor: temp=%.2f C, humidity=%.2f %%\\n\", t, h);\n      if (mqtt.connected())\
      \ {\n        const bool a = mqtt.publish(TEMP, String(t, 2).c_str(), true);\n        const bool\
      \ b = mqtt.publish(HUM, String(h, 2).c_str(), true);\n        const bool c = mqtt.publish(REPLY,\
      \ \"sample read; values attempted\", false);\n        Serial.printf(\"QoS 0 publish results: temp=%d,\
      \ humidity=%d, reply=%d\\n\", a, b, c);\n      } else Serial.println(\"Offline: reading not buffered\
      \ for replay\");\n    }\n  }\n  delay(10);\n}\n"
  code_explanation: 'PubSubClient 2.8 implements MQTT 3.1.1 by default. Its publish API uses QoS 0; true
    means the local write was accepted, not an application acknowledgement or guaranteed delivery. subscribe’s
    return similarly confirms local submission, not that your account received permission. mqtt.loop()
    processes incoming messages and keepalive; it must run regularly while connected. The payload callback
    uses its length and never assumes a terminating zero byte.


    There are no while-not-connected loops. Wi-Fi attempts have a finite window; broker connect is still
    a synchronous call that can pause loop for seconds. The TCP connection timeout is 3000 ms and MQTT
    socket timeout is 3 seconds; these are separate phases, not a hard three-second total-loop guarantee.
    Use an asynchronous design for strict real-time workloads. After a connection loss, stale TCP is stopped
    and the client reconnects/resubscribes.


    A retained temperature/humidity is the broker’s latest value, not evidence of current sensor health.
    The retained availability topic becomes online on connection; the broker’s last will announces offline
    after it detects an unexpected disconnect, not instantly at power loss. A sensor failure while connected
    does not change that connection-level availability. Subscribers should track age/status separately.'
  expected_output: 'Illustrative expectations only: Serial prints a unique client ID, connection diagnostics
    and Sensor: temp=... C, humidity=... %. The subscriber should receive retained temperature/humidity
    and online availability. Send sample without retain; after the 2500 ms minimum sample spacing, a successful
    read attempts values and a non-retained reply. This reply is an application message, but itself uses
    QoS 0 and is not proof of delivery. No Node-RED flow is supplied; configure your own MQTT-in node
    for the exact topics after the CLI exchange works.'
  common_mistakes:
  - text: Publishing every loop cycle and flooding the broker.
  - text: Hardcoding wrong Wi-Fi credentials and not printing connection status.
  - text: Forgetting the DHT22 pull-up resistor.
  - text: Using inconsistent MQTT topic names.
  - text: Ignoring reconnect logic after Wi-Fi drops.
  troubleshooting:
  - problem: Wi-Fi or broker never connects
    fix: Use the Wi-Fi diagnostic guide. Check broker LAN IP, listener/interface, firewall and service
      logs. Mosquitto loopback-only mode cannot accept the board.
  - problem: MQTT state is -2 or -4
    fix: -2 is connect failed; -4 is MQTT connection timeout. Check reachable listener and broker response.
      TCP timeout and MQTT response timeout are different stages.
  - problem: State 4/5 or subscription receives nothing
    fix: Check broker username/password and topic ACLs. States 4 and 5 indicate credential/authorization
      refusal at connection. A subscribe return true alone does not prove topic authorization.
  - problem: One device repeatedly disconnects another
    fix: Ensure distinct client IDs; this sketch derives one from each STA MAC. Also separate room topic
      namespaces.
  - problem: Old readings look current
    fix: Retained values persist; inspect availability and last-received age. A failed DHT22 read publishes
      no replacement.
  - problem: DHT22 returns NAN
    fix: Use the separate DHT22 wiring/code reference; verify GPIO4, pull-up, voltage and minimum sample
      spacing. The DHT11 quick build uses a different sensor type.
  testing_checklist:
  - Verify the standalone DHT22 reading with the actual sensor before adding MQTT.
  - Use the local subscriber to observe all topics; request sample without retain.
  - Stop/restart the broker and check reconnection/resubscription. Interrupt Wi-Fi and confirm sensor
    Serial output remains scheduled.
  - Check two boards use different client IDs/topics. Observe stale retained values deliberately; do not
    mistake them for new measurements.
  engineer_tips:
  - Use readable topics such as esp32/room1/temperature.
  - Publish JSON only when you need grouped values.
  - Keep sensor publishing interval slower than the sensor response time.
  - Never put real passwords in public screenshots or repositories.
  - Add Last Will and Testament for production MQTT nodes.
  performance_tips:
  - Publish every 5-30 seconds instead of every loop.
  - Reuse the MQTT client connection.
  - Avoid long blocking delays in reconnect code.
  - Use retained messages only for state values that should be remembered.
  upgrade_ideas:
  - Connect a configured Node-RED/Home Assistant MQTT subscriber to the proven topics.
  - Add a last-reading timestamp/validity field before using the readings for decisions.
  - Design a TLS connection with certificate verification for networks beyond this trusted bench.
