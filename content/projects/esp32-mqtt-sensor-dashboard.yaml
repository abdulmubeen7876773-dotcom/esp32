  tutorial_flow: true
  assumptions: 'Classic ESP32-WROOM DevKit / ESP32 Dev Module, Arduino-ESP32 3.3.2 review baseline (not
    latest). DHT22 on GPIO4, 3.3 V supply and DATA pull-up to 3.3 V. Use a documented 3.3 V-compatible
    sensor/module; verify its pin orientation and existing pull-up using the DHT22 reference. This is
    not the DHT11 quick build.


    A computer or Raspberry Pi runs an already installed/configured Mosquitto 2.x broker on the same trusted
    LAN. You need its reachable IPv4 address, a permitted listener, username/password and topic permissions.
    The broker is not hosted by ESP32 Engine. No sensor measurements, compilation or physical hardware
    testing were performed for this review.'
  configuration: 'Set SSID/PASSWORD for your 2.4 GHz WPA2-Personal network and replace BROKER’s four IPv4
    octets with the broker computer’s LAN address. Set MQTT_USER/MQTT_PASSWORD to a broker account permitted
    to publish and subscribe under esp32engine/sensors/room1/. Do not use the ESP32’s address or 127.0.0.1
    as the broker. Change room1 consistently across all five topics when adding another room. The MAC-derived
    client ID distinguishes boards; topics still need deliberate separation.


    From an authorized computer with Mosquitto clients, replace the uppercase placeholders and run: mosquitto_sub
    -h BROKER_IP -p 1883 -u USER -P PASSWORD -t "esp32engine/sensors/room1/#" -v. In another terminal
    send: mosquitto_pub -h BROKER_IP -p 1883 -u USER -P PASSWORD -t "esp32engine/sensors/room1/cmd" -m
    sample. Do not set retain on this command. These are local test instructions, not commands executed
    during review. Command-line passwords can appear in history/process listings; use disposable local
    test credentials and your client’s supported secure configuration for real deployments.'
  behavior:
  - - Wi-Fi unavailable
    - 15-second asynchronous connection window; starts no more often than every 30 seconds. Sensor schedule
      keeps running.
  - - Broker unavailable
    - One synchronous connect attempt, then at least 10 seconds of backoff; no endless retry loop.
  - - Broker reconnects
    - Clean-session connection; subscribe to CMD again and publish retained online availability.
  - - sample command
    - Callback validates the byte span and sets a flag; loop samples when at least 2500 ms has elapsed.
  - - Sensor fails
    - No new values; previous retained readings remain old. No offline replay buffer.
