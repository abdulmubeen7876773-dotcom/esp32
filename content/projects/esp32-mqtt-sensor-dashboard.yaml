meta_title: ESP32 MQTT Sensor Dashboard Tutorial with ESP32
project:
  icon: MQTT
  mission_title: Build an MQTT Sensor Dashboard
  difficulty: Intermediate
  age: Ages 12+
  estimated_time: 90-120 min
  budget: Under 25 USD
  what_you_build: A classic ESP32-WROOM sensor node publishes DHT22 temperature and relative humidity
    every 30 seconds. An MQTT client subscribes to those topics and can request a fresh sample. Prove
    the broker exchange first; an existing Node-RED or Home Assistant installation can then display the
    same topics. This page provides the sensor sketch and CLI verification, not a downloadable dashboard
    flow.
  story: 'ESP32 MQTT Sensor Dashboard solves a real beginner problem: turning an ESP32 reading into a
    useful physical or networked result. Build this after basic sensor missions when you are ready to
    learn the publish/subscribe pattern used in real IoT systems.


    The tutorial focuses on the engineering path: prove the input, understand the circuit, write readable
    code, then test the output under real conditions.'
  eli12: MQTT is like a notice board. The ESP32 posts sensor readings to a topic, and any dashboard that
    subscribes to that topic can read the latest message.
  parent_safety: 'USB-powered low-voltage sensor demonstration only. Unplug power before changing wiring.
    Keep DATA at ESP32-safe 3.3 V logic. Use no public broker or production credentials: port 1883 carries
    this example’s username, password and readings without TLS. Do not forward that port to the internet.'
  learning_objectives:
  - Wire and read a DHT22 sensor.
  - Connect ESP32 to Wi-Fi safely in Arduino code.
  - Publish readings to an MQTT topic.
  - Understand broker, publisher, subscriber, and topic names.
  - Design topic names that scale beyond one sensor.
