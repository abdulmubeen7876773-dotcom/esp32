  faqs:
  - question: Does changing port 1883 to 8883 enable TLS?
    answer: No. This sketch uses a plain WiFiClient. A TLS design needs the secure client and a verified
      broker certificate/hostname plus the broker’s TLS listener.
  - question: Are readings saved while offline?
    answer: No. Serial can show readings, but the sketch has no replay buffer. Retained broker values
      remain old until a new publish succeeds.
  - question: Can PubSubClient publish with QoS 1?
    answer: Its 2.8 publish API uses QoS 0. It can subscribe at QoS 0 or 1; use a different reviewed client/protocol
      design if you need QoS 1 publishing.
