    note: Serial at 115200; 2.4 GHz router network
    icon: ESP
    link: /components/esp32-devkit.html
  - item: DHT22 and 10 kOhm DATA pull-up when absent
    note: Documented 3.3 V operation; GPIO4. Verify module pin labels.
    icon: DHT
    link: /components/dht22.html
