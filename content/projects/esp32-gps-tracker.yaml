  wiring:
    full_size_link: true
    illustration_alt: Build a Local NEO-6M GPS Reader wiring diagram
    summary: 'Read-only UART connection: documented 3.3 V carrier TX -> classic ESP32-WROOM GPIO16 (RX2), with common
      GND. GPS RX is left disconnected. Identify the actual carrier supply circuit first.'
    steps:
    - Disconnect power. Obtain the exact carrier schematic and identify its supply input, regulator and UART output
      voltage. If these are unknown, stop rather than applying 5 V.
    - The supported carrier must accept regulated 3.3 V at the identified input and expose native 3.3 V UART TX.
      Use an adequately rated external 3.3 V supply, with its positive kept off ESP32 USB/VIN/3V3.
    - Join carrier GND, external supply GND and ESP32 GND. Connect GPS TX to ESP32 GPIO16 (RX2). Leave GPS RX disconnected;
      this sketch sends no configuration commands.
    - Use a classic ESP32-WROOM board that exposes GPIO16; some WROVER boards reserve GPIO16/17 for PSRAM.
    - Power ESP32 USB before the carrier supply; switch carrier power off before USB. Confirm a 9600-baud NMEA stream
      before diagnosing satellite reception.
    - Give the antenna clear sky view with permission to record location; indoor satellite acquisition is not promised.
  gpio_map:
  - signal: Carrier TX, native 3.3 V UART
    esp32_pin: GPIO16 / RX2
    direction: Input
    notes: TX crosses to ESP32 RX; default NEO-6 NMEA setting is 9600 baud unless reconfigured.
  - signal: Carrier RX
    esp32_pin: Not connected
    direction: Unused
    notes: Read-only example; ESP32 TX GPIO17 is configured but physically unwired.
  - signal: Documented carrier supply input
    esp32_pin: External regulated 3.3 V
    direction: Power
    notes: Only a carrier explicitly rated for this input; common ground. Not universal VIN.
  - signal: Common reference
    esp32_pin: GND
    direction: Ground
    notes: GPS and ESP32 UART require a shared reference.
  circuit_explanation: The GNSS module streams NMEA sentences at 9600 baud. TinyGPS++ decodes bytes into fix status,
    coordinates, satellites, and HDOP.
  engineering_explanation: GPS needs sky view and time for a cold start. Indoor tests often receive UART text but
    no valid coordinates. The u-blox NEO-6M silicon module is specified for 2.7–3.6 V VCC; that is not the same
    as a carrier VIN rating. Some carrier regulators need a higher input because of dropout; those carriers are
    outside this 3.3 V-input exercise unless their documentation identifies a supported 3.3 V connection. A regulator
    on VIN does not prove that UART tolerates 5 V. No particular unmarked carrier has been verified here.
  libraries:
  - name: Arduino-ESP32 3.3.2
    note: Classic ESP32-WROOM UART2 review baseline.
  - name: TinyGPSPlus 1.0.3
    note: Mikal Hart official release tag v1.0.3 (package version); the TinyGPS++.h parsing API used here is present
      in that tag. Serial communication and satellite fix are separate checks.
  code:
    filename: esp32-gps-tracker.ino
    content: "// ESP32 NEO-6M GPS reader\n// Prints only valid fixes; no fabricated coordinates are used.\n#include\
      \ <TinyGPS++.h>\n\nTinyGPSPlus gps;\nHardwareSerial gpsSerial(2);\n\nconst int GPS_RX = 16; // ESP32 receives\
      \ GPS TX here\nconst int GPS_TX = 17; // Configured UART TX, physically unwired; no commands sent.\n\nunsigned\
      \ long lastStatusMs = 0;\n\nvoid setup() {\n  Serial.begin(115200);\n  gpsSerial.begin(9600, SERIAL_8N1, GPS_RX,\
      \ GPS_TX);\n  Serial.println(\"GPS reader ready. Place the antenna with a clear sky view.\");\n}\n\nvoid loop()\
      \ {\n  while (gpsSerial.available()) {\n    gps.encode(gpsSerial.read());\n  }\n\n  if (gps.location.isUpdated())\
      \ {\n    if (gps.location.isValid()) {\n      Serial.print(\"Latitude: \");\n      Serial.println(gps.location.lat(),\
      \ 6);\n      Serial.print(\"Longitude: \");\n      Serial.println(gps.location.lng(), 6);\n      Serial.print(\"\
      Satellites: \");\n      Serial.println(gps.satellites.value());\n      Serial.print(\"HDOP: \");\n      Serial.println(gps.hdop.isValid()\
      \ ? gps.hdop.hdop() : 0.0, 2);\n      Serial.println(\"---\");\n    } else {\n      Serial.println(\"GPS data\
      \ received, but no valid location fix yet.\");\n    }\n  }\n\n  if (millis() - lastStatusMs > 5000) {\n  \
      \  lastStatusMs = millis();\n    if (gps.charsProcessed() < 10) {\n      Serial.println(\"No NMEA characters\
      \ yet. Check TX-to-RX wiring and module power.\");\n    } else if (!gps.location.isValid()) {\n      Serial.println(\"\
      Waiting for satellite lock. Move antenna near a window or outdoors.\");\n    }\n  }\n}\n"
  code_explanation: UART2 receives 9600-baud NMEA on GPIO16. GPIO17 is configured as UART TX but left physically
    unconnected; the sketch sends no configuration commands. TinyGPS++ parses the incoming stream; received characters
    alone do not prove a valid satellite fix.
  expected_output: Before satellite lock, Serial Monitor says it is waiting for a fix. After a valid fix, it prints
    latitude, longitude, satellites, and HDOP.
  common_mistakes:
  - text: Swapping GPS TX/RX incorrectly.
  - text: Publishing real private coordinates.
  - text: Expecting indoor fixes.
  - text: Claiming guaranteed precision.
