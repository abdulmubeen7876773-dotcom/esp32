    direction: Output
    notes: Right direction; no reverse command implemented.
  - signal: STBY
    esp32_pin: GPIO25
    direction: Output
    notes: 10kΩ to GND at carrier; LOW → high-impedance standby.
  - signal: VCC / PWMA / PWMB
