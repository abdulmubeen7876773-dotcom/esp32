  wiring:
    full_size_link: true
    illustration_alt: 'Logical classic-WROOM to Pololu TB6612FNG map: GPIO16/17/18/19 direction, GPIO25 standby
      with pull-down, 3.3 V logic and separate 6 V motor power. Not physical pin order.'
    summary: 'Carrier #713 VCC, PWMA and PWMB connect to 3V3; GPIO25 drives STBY with 10kΩ to GND. Direction pins
      are GPIO16→AIN1, 17→AIN2, 18→BIN1, 19→BIN2. VMOT takes separate switched 6 V; AO1/AO2 and BO1/BO2 feed the
      two selected motors. All grounds share a reference; positive rails do not join.'
    steps:
    - Disconnect USB and motor power. Identify the exact carrier and motors from documentation, not the hero illustration.
      Secure the chassis with wheels lifted.
    - Wire VCC, PWMA and PWMB to ESP32 3V3, all grounds together, direction pins as listed, and STBY to GPIO25 with
      a 10kΩ pull-down at the carrier. Do not hard-wire STBY HIGH.
    - Connect motor A to AO1/AO2 and motor B to BO1/BO2. Fit a 100 nF ceramic across each motor terminal pair. Motor
      mounting determines the physical forward direction.
    - Wire switched 6 V positive to VMOT and return directly to carrier GND. Fit 470 µF/16 V bulk capacitance nearby,
      positive to VMOT. Keep motor currents out of signal rails.
    - With motor power OFF, upload and open Serial at 115200. Set your own 8–63-character AP password, join ESP32-Robot
      and use the printed local address. No router or internet is required.
    - Keep the independent power switch accessible. Apply motor power for supervised lifted-wheel bursts only. If
      direction is wrong, power everything off before swapping that motor’s output leads.
    - Turn motor power off before removing USB; disconnect both sources before changing connections. Do not unplug
      a motor from an energized driver.
  gpio_map:
  - signal: AIN1 / AIN2
