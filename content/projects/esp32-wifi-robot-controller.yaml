  complete:
    summary: Compare wiring and actual observations with these intended checks. A successful web request or build
      does not establish motor operation or electrical/mechanical safety.
    skills:
    - Trace separate power rails
    - Use defined standby
    - Distinguish commands from feedback
  story: A web command is information, not a motor power source. The ESP32 sets direction inputs and a standby line;
    a separate supply delivers motor current through the carrier. Short bursts replace the former indefinitely latched
    movement.
  eli12: The browser asks for a short movement. The driver supplies the current. When the software returns to standby
    the wheels can coast, so a Stop label does not mean the robot has physically stopped.
  parent_safety: Secure the chassis with wheels clear of the bench, restrain loose wires and keep fingers away from
    gears. Keep an independent switch in the motor supply within reach. Software standby leaves VMOT energized and
    permits coasting; it is not a brake, emergency stop or isolation. Disconnect motor power before USB shutdown
    or any wiring change. No floor-running, collision avoidance or unattended operation is validated.
  learning_objectives:
  - Separate logic from motor power.
  - Trace direction, PWM-enable and standby states.
  - Explain bounded commands, network loss and coasting limitations.
  circuit_explanation: 'Classic ESP32-WROOM supplies 3.3 V logic to Pololu TB6612FNG #713 VCC. Motor power goes
    only to carrier VMOT; all negative rails share a reference without routing motor return current through the
    DevKit or solderless breadboard. STBY is active HIGH and has an external 10kΩ pull-down to GND, supplementing
    the selected driver’s internal pull-down. PWMA/PWMB are deliberately tied HIGH for direction-only full-drive
    bursts.'
  engineering_explanation: 'The reference pair is Pololu #992 LP 6 V gearmotors, not arbitrary toy motors. The supplier
    labels 0.36 A stall current per motor at 6 V as an extrapolation, not a permitted sustained stall. Two such
    figures sum to 0.72 A; a regulated, current-limited 6 V / 2 A bench source is a planning allowance, not measured
    startup performance or universal protection. Carrier continuous rating is 1 A per channel; do not design around
    its brief peak rating or substitute a high-current motor. Its H-bridge provides regenerative current paths and
    its carrier includes decoupling; retain those parts, add a 100 nF ceramic across each motor and a selected 470
    µF/16 V bulk capacitor at VMOT. These do not replace adequate supply wiring or an overcurrent design. Do not
    place a single ordinary flyback diode across a bidirectional motor output. Input thresholds depend on VCC: use
    3.3 V logic supply, not 5 V VCC with assumed ESP32 compatibility. AP password is network admission, not HTTP
    user authentication. This plain-HTTP bench has no TLS, CSRF protection, obstacle sensing, encoder feedback or
    certified stop system. Do not expose it through a router.'
  code_explanation: Only POST /move with exactly dir=F, L or R can initiate motion. The handler validates input
    and completes its potentially blocking HTTP response before asserting STBY. During a burst the loop does not
    service synchronous HTTP; it checks elapsed time and station presence, then returns the carrier to standby.
    Requests queued during motion, including /s, wait until the current burst ends. Closing a browser tab does not
    necessarily disconnect its Wi-Fi station; the independent 250 ms command duration still expires. Timing remains
    best-effort MCU software, not a hard real-time safety guarantee. A reset is electrically biased to standby by
    the external pull-down, but no motor-power isolation or fault tolerance is implied.
  testing_checklist:
  - 'Planned checks only: no compilation or hardware operation has been performed.'
  - Verify selected hardware, polarity and reset-time STBY with motor power off.
  - Check GET/invalid commands cannot start motion; use the exact POST form.
  - Observe a supervised lifted-wheel burst, automatic standby and a station disconnect without assuming measured
    timing.
  - Use an appropriate instrument for actual pulse/current/timing verification; software status is not feedback.
