  what_you_build: A local access-point control page for two small brushed gearmotors through a specified dual H-bridge.
    Forward, left and right request one 250 ms command burst; there is no continuous drive, reverse command or automatic
    repeat. Start with wheels lifted and chassis secured. This is a control lesson, not an unattended or autonomous-safe
    robot. The overview is a logical illustration, not a hardware photo or test result. Use the specified parts
    and wiring map below; physical connector orientation must be checked separately.
  components:
  - item: Classic ESP32-WROOM DevKit
    note: Arduino-ESP32 3.3.2 review baseline; GPIO16/17 must be free, so this map excludes WROVER/PSRAM variants.
    link: /components/esp32-devkit.html
  - item: 'Pololu TB6612FNG dual motor carrier #713'
    note: Use its documented pins, logic supply, motor supply and standby behavior; not an assumed L298N substitute.
  - item: 'Two Pololu #992 100:1 Micro Metal Gearmotors LP 6 V'
    note: Matched low-power reference motors; secure a suitable small chassis with wheels lifted.
  - item: Separately switched, regulated 6 V / 2 A current-limited bench supply
    note: Motor supply only. Check current/transient behavior; no power from ESP32 GPIO, 3V3 or USB.
  - item: 10kΩ pull-down, 470 µF/16 V electrolytic and two 100 nF ceramics
    note: STBY pull-down, VMOT bulk decoupling and one ceramic across each motor. Check capacitor polarity.
  - item: Suitable motor-current connections and USB data cable
    note: Motor supply/returns bypass breadboard signal rails; USB powers the DevKit only.
