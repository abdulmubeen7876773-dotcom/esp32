  faqs:
  - question: Will closing the page stop Wi-Fi immediately?
    answer: Not necessarily. A station can remain associated after its tab closes. Every command is limited to one
      software burst, but only the independent power switch removes motor power.
  - question: Can I substitute L298N or larger motors?
    answer: Not using this circuit unchanged. Recheck that driver’s inputs, supply paths, enable states, current
      and protection; no universal module compatibility is claimed.
