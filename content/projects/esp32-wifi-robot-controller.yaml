    direction: Logic power / enable
    notes: PWM inputs HIGH; no speed-control PWM in this sketch.
  - signal: VMOT
    esp32_pin: External switched 6 V +
    direction: Motor power
    notes: Never connect to DevKit positive rails.
  - signal: AO1/AO2 / BO1/BO2
    esp32_pin: Motor A / motor B
    direction: Driver outputs
    notes: No motor lead connects to a GPIO.
  - signal: All grounds
    esp32_pin: Common GND
    direction: Reference / return
    notes: High-current loop returns directly to carrier/supply.
  code:
    filename: wifi-robot-controller.ino
    content: "// Classic ESP32-WROOM DevKit; Arduino-ESP32 3.3.2 review baseline.\n// Pololu TB6612FNG #713, two\
      \ Pololu #992 motors, wheels lifted.\n// Software standby is NOT power isolation or an emergency stop.\n#include\
      \ <Arduino.h>\n#include <WiFi.h>\n#include <WebServer.h>\n\nconstexpr uint8_t L1 = 16, L2 = 17, R1 = 18, R2\
      \ = 19, STBY = 25;\nconstexpr uint32_t BURST_MS = 250;\nconst char* AP_PASSWORD = \"CHANGE_ME_1234\"; // Set\
      \ your own 8-63 character password.\nWebServer server(80);\nbool httpReady = false, moving = false;\nuint32_t\
      \ burstStarted = 0;\nchar lastCommand = 'S';\n\nvoid standby() {\n  digitalWrite(STBY, LOW); // High-impedance\
      \ outputs: wheels may coast.\n  digitalWrite(L1, LOW); digitalWrite(L2, LOW);\n  digitalWrite(R1, LOW); digitalWrite(R2,\
      \ LOW);\n  moving = false;\n}\nvoid sendHome() {\n  server.sendHeader(\"Location\", \"/\");\n  server.sendHeader(\"\
      Cache-Control\", \"no-store\");\n  server.send(303, \"text/plain\", \"Return to control page\\n\");\n}\nvoid\
      \ showPage() {\n  String page = \"<!doctype html><html lang='en'><head><meta name='viewport' content='width=device-width,initial-scale=1'>\"\
      ;\n  page += \"<title>ESP32 bench robot</title><style>body{font:1.1rem system-ui;max-width:38rem;margin:2rem\
      \ auto;padding:1rem}button{font:inherit;margin:.5rem;padding:.7rem}</style></head><body>\";\n  page += \"\
      <h1>Wheels-lifted robot demonstration</h1><p>One accepted command requests a 250 ms burst. No continuous drive\
      \ or automatic repeats.</p>\";\n  page += String(\"<p>Last accepted command: \") + lastCommand + \". This\
      \ is not motor feedback.</p>\";\n  page += \"<form method='post' action='/move'><button name='dir' value='F'>Forward\
      \ burst</button><button name='dir' value='L'>Left burst</button><button name='dir' value='R'>Right burst</button></form>\"\
      ;\n  page += \"<form method='post' action='/s'><button>Request standby</button></form>\";\n  page += \"<p>HTTP\
      \ is not serviced during a burst; a network stop waits until that burst ends. Standby permits coasting. Keep\
      \ the independent motor-power switch reachable.</p></body></html>\";\n  server.sendHeader(\"Cache-Control\"\
      , \"no-store\");\n  server.send(200, \"text/html; charset=utf-8\", page);\n}\nvoid moveRequest() {\n  if (server.args()\
      \ != 1 || !server.hasArg(\"dir\")) {\n    server.send(400, \"text/plain\", \"Exactly one dir=F, L or R required\\\
      n\"); return;\n  }\n  String dir = server.arg(\"dir\");\n  if (dir != \"F\" && dir != \"L\" && dir != \"R\"\
      ) {\n    server.send(400, \"text/plain\", \"Unknown direction\\n\"); return;\n  }\n  if (WiFi.softAPgetStationNum()\
      \ == 0) {\n    standby(); server.send(409, \"text/plain\", \"No connected station\\n\"); return;\n  }\n  //\
      \ Complete the potentially blocking response BEFORE enabling the bridge.\n  sendHome();\n  standby();\n  lastCommand\
      \ = dir.charAt(0);\n  digitalWrite(L1, lastCommand == 'L' ? LOW : HIGH);\n  digitalWrite(R1, lastCommand ==\
      \ 'R' ? LOW : HIGH);\n  // L2/R2 remain LOW. Both LOW on the idle side means coast, not reverse.\n  burstStarted\
      \ = millis();\n  moving = true;\n  digitalWrite(STBY, HIGH);\n}\nvoid setup() {\n  // External 10k pulldown\
      \ on STBY defines standby before/during reset.\n  digitalWrite(STBY, LOW); pinMode(STBY, OUTPUT);\n  const\
      \ uint8_t directionPins[] = {L1, L2, R1, R2};\n  for (uint8_t pin : directionPins) {\n    digitalWrite(pin,\
      \ LOW); pinMode(pin, OUTPUT);\n  }\n  standby();\n  Serial.begin(115200);\n  server.on(\"/\", HTTP_GET, showPage);\n\
      \  server.on(\"/move\", HTTP_POST, moveRequest);\n  server.on(\"/s\", HTTP_POST, []() {\n    if (server.args()\
      \ != 0) { server.send(400, \"text/plain\", \"No arguments expected\\n\"); return; }\n    standby(); lastCommand\
      \ = 'S'; sendHome();\n  });\n  server.onNotFound([]() { server.send(404, \"text/plain\", \"No such route\\\
      n\"); });\n  if (!WiFi.mode(WIFI_AP) || !WiFi.softAP(\"ESP32-Robot\", AP_PASSWORD, 6, false, 1)) {\n    Serial.println(\"\
      AP failed; driver remains in standby\"); return;\n  }\n  server.begin(); httpReady = true;\n  Serial.print(\"\
      Join ESP32-Robot; open http://\"); Serial.println(WiFi.softAPIP());\n  Serial.println(\"Motor power off until\
      \ wiring and lifted-wheel checks are complete\");\n}\nvoid loop() {\n  if (moving) {\n    if (uint32_t(millis()\
      \ - burstStarted) >= BURST_MS || WiFi.softAPgetStationNum() == 0) {\n      standby();\n    }\n    // Do not\
      \ enter synchronous HTTP parsing/sending while motors are commanded.\n    delay(1);\n    return;\n  }\n  if\
      \ (httpReady) server.handleClient();\n  delay(1);\n}\n"
  expected_output: With only USB powered, the AP should appear and Serial at 115200 should print its local http://
    address. The page reports the last accepted command, not measured wheel speed or position. On the correctly
    identified lifted-wheel setup, a burst should briefly drive both motors or coast one side for turning, then
    return to high-impedance standby. There is no supplied hardware result or measured stopping distance.
  common_mistakes:
  - text: Leaving enable/standby floating or assuming all driver boards share a pinout.
  - text: Feeding motor current through USB, GPIO or breadboard signal rails.
  - text: Treating 250 ms as a safety-certified maximum or standby as physical stopped motion.
  - text: Calling a web response proof of a motor movement.
  troubleshooting:
  - problem: AP or control page unavailable
    fix: Keep motor power off. Check classic ESP32 board selection, data cable and password length; use the Serial-printed
      local address and remain connected despite no-internet warnings.
  - problem: No motor movement
    fix: With all power off check VCC versus VMOT, common ground, PWMA/PWMB HIGH, STBY pull-down and GPIO25 connection.
      Do not bypass standby by tying it HIGH.
  - problem: A side runs backward
    fix: Power down both sources and swap only that motor’s two output leads. Do not rewire energized outputs or
      assume chassis orientation matches the sketch.
  - problem: Motor continues to coast after standby
    fix: That is not a commanded brake. Remove motor power using the independent switch and keep wheels clear; no
      stopping-distance or braking performance is supplied.
  - problem: Motor stalls, driver heats or ESP32 resets
    fix: Stop external motor power. Check mechanical binding, actual motor identity/current, supply transient response,
      direct return wiring and capacitor polarity. Do not repeatedly stall it or increase supply limits to force
      motion.
  - problem: A network stop appears delayed
    fix: HTTP is deliberately not serviced during a motion burst. New requests are handled after its elapsed-time
      loop returns to standby. This page provides no immediate network emergency stop.
