    code: |-
      // Classic ESP32 Dev Module; Arduino-ESP32 3.x (>= 3.0.0)
      // ESP32 common-cathode RGB LED pattern controller
      // Single low-power RGB LED, not an addressable strip.
      const int RED_PIN = 25;
      const int GREEN_PIN = 26;
      const int BLUE_PIN = 27;
      const int BUTTON_PIN = 14;

      const int PWM_FREQ = 5000;
      const int PWM_RES = 8;

      int pattern = 0;
      bool lastButton = HIGH;
      unsigned long lastDebounceMs = 0;
      unsigned long frameMs = 0;

      void writeRgb(uint8_t r, uint8_t g, uint8_t b) {
        ledcWrite(RED_PIN, r);
        ledcWrite(GREEN_PIN, g);
        ledcWrite(BLUE_PIN, b);
      }

      void setupPwm() {
        if (!ledcAttach(RED_PIN, PWM_FREQ, PWM_RES) ||
            !ledcAttach(GREEN_PIN, PWM_FREQ, PWM_RES) ||
            !ledcAttach(BLUE_PIN, PWM_FREQ, PWM_RES)) {
          Serial.println("RGB PWM attachment failed");
          while (true) delay(1000);
        }
      }

      void setup() {
        Serial.begin(115200);
        setupPwm();
        pinMode(BUTTON_PIN, INPUT_PULLUP);
        writeRgb(255, 0, 0);
      }

      void loop() {
        bool button = digitalRead(BUTTON_PIN);
        if (button != lastButton && millis() - lastDebounceMs > 40) {
          lastDebounceMs = millis();
          lastButton = button;
          if (button == LOW) {
            pattern = (pattern + 1) % 3;
            Serial.printf("Pattern %d\n", pattern);
          }
        }

        unsigned long now = millis();
        if (now - frameMs < 20) return;
        frameMs = now;

        uint8_t phase = (now / 8) & 0xFF;
        if (pattern == 0) {
          writeRgb(255, 0, 0);
        } else if (pattern == 1) {
          writeRgb(phase, 255 - phase, 128);
        } else {
          int step = (now / 500) % 6;
          const uint8_t colors[6][3] = {{255,0,0},{255,80,0},{0,255,0},{0,255,255},{0,0,255},{160,0,255}};
          writeRgb(colors[step][0], colors[step][1], colors[step][2]);
        }
      }
    code_filename: esp32-rgb-led-pattern-controller-beginner.ino
