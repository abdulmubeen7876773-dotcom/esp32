  code:
    filename: esp32-robot-arm-controller.ino
    content: "// Classic ESP32-WROOM; Arduino-ESP32 3.3.2; built-in LEDC only.\n// Three documented FEETECH FS90\
      \ positional units, no horns/load.\n// No homing, shaft feedback, limit switches or patient/safety function.\n\
      #include <Arduino.h>\n\nconstexpr uint8_t SERVO_PINS[3] = {13, 16, 17};\nconstexpr uint8_t AXIS_PINS[3] =\
      \ {34, 35, 36};\nconstexpr uint8_t ENABLE_PIN = 27, BITS = 16;\nconstexpr int MIN_US = 1400, CENTER_US = 1500,\
      \ MAX_US = 1600;\nconstexpr uint32_t LEASE_MS = 10000, UPDATE_MS = 20;\nint pulseUs[3] = {CENTER_US, CENTER_US,\
      \ CENTER_US};\nint center[3] = {2048, 2048, 2048};\nbool attached[3] = {false, false, false}, armed = false,\
      \ needsRelease = true;\nuint32_t armedAt = 0, lastUpdate = 0;\n\nuint32_t ticks(int us) {\n  return (uint32_t(us)\
      \ * (1UL << BITS) + 10000) / 20000;\n}\nvoid disableOutputs() {\n  armed = false; needsRelease = true;\n \
      \ bool ok = true;\n  for (int i = 0; i < 3; ++i) {\n    if (attached[i]) {\n      if (!ledcWrite(SERVO_PINS[i],\
      \ 0)) ok = false;\n      if (!ledcDetach(SERVO_PINS[i])) ok = false;\n      attached[i] = false;\n    }\n\
      \    digitalWrite(SERVO_PINS[i], LOW); pinMode(SERVO_PINS[i], OUTPUT);\n  }\n  if (!ok) Serial.println(\"\
      LEDC stop error: remove external servo power\");\n  Serial.println(\"Pulses disabled; external power and possible\
      \ torque remain\");\n}\nvoid armAtCenter() {\n  if (needsRelease) { Serial.println(\"Release enable before\
      \ arming again\"); return; }\n  if (armed) { Serial.println(\"Release enable before a new arm attempt\");\
      \ return; }\n  if (digitalRead(ENABLE_PIN) != LOW) {\n    Serial.println(\"Hold enable, center all axes, then\
      \ send A\"); return;\n  }\n  for (int i = 0; i < 3; ++i) {\n    long sum = 0;\n    for (int n = 0; n < 16;\
      \ ++n) sum += analogRead(AXIS_PINS[i]);\n    int value = int(sum / 16);\n    if (value < 1200 || value > 3000)\
      \ {\n      Serial.println(\"Axis not in plausible center window; remains disabled\"); return;\n    }\n   \
      \ center[i] = value; // Manual centered reference, not a continuity test.\n  }\n  if (digitalRead(ENABLE_PIN)\
      \ != LOW) return;\n  for (int i = 0; i < 3; ++i) {\n    pulseUs[i] = CENTER_US;\n    attached[i] = ledcAttach(SERVO_PINS[i],\
      \ 50, BITS);\n    if (!attached[i] || !ledcWrite(SERVO_PINS[i], ticks(CENTER_US))) {\n      disableOutputs();\
      \ Serial.println(\"Attach/write failed; inspect with power off\"); return;\n    }\n  }\n  armedAt = millis();\
      \ lastUpdate = armedAt; armed = true; needsRelease = true;\n  Serial.println(\"1500 us commanded: movement\
      \ may be immediate; no home position measured\");\n}\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(ENABLE_PIN,\
      \ INPUT_PULLUP); // Bare momentary button to GND; software gate only.\n  analogReadResolution(12);\n  for\
      \ (int i = 0; i < 3; ++i) {\n    pinMode(AXIS_PINS[i], INPUT);\n    analogSetPinAttenuation(AXIS_PINS[i],\
      \ ADC_11db);\n    digitalWrite(SERVO_PINS[i], LOW); pinMode(SERVO_PINS[i], OUTPUT);\n  }\n  Serial.println(\"\
      Disabled. External power off for wiring/upload. No automatic sweep.\");\n  Serial.println(\"Center axes, hold\
      \ enable and send A; X disables. Lease is 10 seconds.\");\n}\nvoid loop() {\n  if (!armed && digitalRead(ENABLE_PIN)\
      \ == HIGH) needsRelease = false;\n  if (armed && (digitalRead(ENABLE_PIN) != LOW || uint32_t(millis() - armedAt)\
      \ >= LEASE_MS)) {\n    disableOutputs();\n  }\n  if (Serial.available()) {\n    char cmd = Serial.read();\n\
      \    if (cmd == 'X' || cmd == 'x') disableOutputs();\n    else if (cmd == 'A' || cmd == 'a') armAtCenter();\n\
      \    // Newlines and unrelated characters do not move servos or extend the lease.\n  }\n  if (!armed || uint32_t(millis()\
      \ - lastUpdate) < UPDATE_MS) return;\n  lastUpdate = millis();\n  int raw[3];\n  for (int i = 0; i < 3; ++i)\
      \ {\n    raw[i] = analogRead(AXIS_PINS[i]);\n    if (raw[i] <= 100 || raw[i] >= 3900) {\n      disableOutputs();\
      \ Serial.println(\"Axis range fault; inspect disconnected input/rails\"); return;\n    }\n  }\n  for (int\
      \ i = 0; i < 3; ++i) {\n    int delta = raw[i] - center[i];\n    if (delta > 250) pulseUs[i] += 2;\n    else\
      \ if (delta < -250) pulseUs[i] -= 2;\n    pulseUs[i] = constrain(pulseUs[i], MIN_US, MAX_US);\n    if (!ledcWrite(SERVO_PINS[i],\
      \ ticks(pulseUs[i]))) {\n      disableOutputs(); Serial.println(\"Pulse write failed; remove external power\"\
      ); return;\n    }\n  }\n  // These are commands only; no shaft-angle or motion feedback exists.\n}\n"
  code_explanation: 'The sketch uses only core 3.3.2 LEDC: pin-based ledcAttach/ledcWrite/ledcDetach at 50 Hz and
    16 bits; no external ESP32Servo library is required. Reset does not attach PWM. First release the enable button;
    center the axes, hold the button and send A in Serial Monitor. The program averages each centered input, rejects
    values outside 1200–3000, then requests 1500 µs on all three outputs. It checks attach/write return values.
    Every target 20 ms it rejects raw endpoints (≤100 or ≥3900), applies a ±250-count dead zone and increments commands
    by 2 µs within 1400–1600. These arbitrary conservative software windows need actual bench checking; they are
    not continuity or travel calibration. Release, X, an input-range fault, a driver error or a 10-second nonrenewable
    lease disables all outputs. Releasing the button is required before another arm attempt. Loop/Serial timing
    is best effort, not a safety function. Sending A while armed does not renew the lease. A disconnected axis can
    still produce a plausible value: no universal disconnection detection is claimed.'
  expected_output: Serial at 115200 should report disabled after reset, with no automatic sweep. With the exact
    unloaded setup, deliberate A while holding enable should request 1500 µs; joystick deflection should change
    only its paired pulse command inside 1400–1600 µs. Release/X/expiry should remove pulses and drive signals LOW;
    this does not prove shaft stop, torque release or a home position. No measured pulse, position, current or successful
    hardware run is supplied.
  common_mistakes:
  - text: Applying 5–6 V indiscriminately to generic SG90-class parts.
  - text: Assuming ADC range checks detect every disconnected wire.
  - text: Calling 1500 µs a home position or narrow software limits mechanical end stops.
  - text: Powering servos from GPIO/USB or assuming pulse disable physically isolates power.
  troubleshooting:
  - problem: A is rejected
    fix: Release enable once after reset/disable, then center all three axes, hold enable and send A. Check power-off
      pot end/wiper identification and ADC node networks if a center is implausible; do not widen windows to conceal
      miswiring.
  - problem: An unplugged joystick is not reliably detected
    fix: The 100kΩ is at the ADC node, not the disconnected end of the cable. It helps pull an open wiper path LOW,
      but some faults remain plausible. Power off and inspect; do not claim the range check is a safety-rated continuity
      monitor.
  - problem: Immediate movement after A
    fix: 'That is possible: no shaft position is measured and 1500 µs is not homing. Remove power if unexpected;
      keep horns/loads removed. There is no startup motion ramp from a known physical position.'
  - problem: Servo buzzes, binds or supply resets ESP32
    fix: Switch servo power off immediately. Check exact unit, connector identity, supply transient capability,
      common ground and restrained mechanics. Do not increase endpoints, hold a stall or rely on a capacitor alone.
  - problem: Servo keeps torque after pulses disable
    fix: No universal torque-release behavior is assumed. Use the independent supply switch; a loaded arm could
      fall when released, which is why it is not part of this bench example.
  - problem: One direction feels reversed or response is coarse
    fix: Pot orientation changes sign, and servo deadband/mechanics affect movement. With power off verify the axis
      mapping. Commands are µs, not calibrated angles; do not infer position or smooth motion from Serial text.
  testing_checklist:
  - Planned bench checks only; no firmware compilation or hardware operation has been performed.
  - Verify model, connector, external supply and unpowered resistor networks.
  - Check no PWM is attached on reset and that enable held during reset does not automatically arm.
  - Check deliberate A, release, X, input-range fault and 10-second expiry with appropriate instruments before any
    mechanism is considered.
  - Treat a future loaded-arm design, mechanical limits, homing and independent protection as separate engineering
    work.
  engineer_tips:
  - Keep commands and measured positions separately labelled.
  - Do not leave a gravity-loaded mechanism supported only by hobby-servo torque.
  - Record the exact servo revision before considering any wider travel.
  upgrade_ideas:
  - Study feedback and limit switches in a separately designed mechanism; none are wired here.
