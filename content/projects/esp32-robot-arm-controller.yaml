  faqs:
  - question: Does reset return the arm home?
    answer: No. Reset disables pulse output. No home sensor or shaft position is available. Deliberate enable commands
      1500 µs and can cause immediate movement.
  - question: Are the existing SG90 page and this circuit interchangeable?
    answer: No. This example deliberately selects documented FS90 units accepting 3.3 V signals. Other servos need
      independent supply, threshold, pulse and mechanical review.
  complete:
    summary: A limited command window is not verified mechanical travel. Check the intended disabled/armed states
      and actual signals separately; build/browser checks do not validate electrical or mechanical safety.
