levels:
  beginner:
    level: beginner
    overview_html: <p>Three joystick axes increment three positional-servo pulse commands on a restrained, unloaded
      bench. The historical robot-arm URL remains, but no load-bearing arm assembly or mechanical travel calibration
      is supplied. There are no limit switches, homing sensors, encoders or verified joint positions. Keep horns
      and loads removed for this supported exercise.</p>
    components:
    - Classic ESP32-WROOM DevKit
    - 'Three FEETECH FS90 positional servos, Pololu #2818 reference'
    - Two passive SparkFun COM-09032 thumb joysticks
    - Separate switched, regulated 5 V / 3 A current-capable supply
    - Bare momentary enable button
    - 'Three each: 10kΩ, 1kΩ, 100kΩ resistors and 100 nF ceramics; 470 µF ≥10 V bulk capacitor'
    - Suitable power distribution, short signal connections and USB data cable
    wiring:
    - - Base / shoulder / elbow signal
      - GPIO13 / GPIO16 / GPIO17
      - 10kΩ to GND on each; pulse commands, not measured joint angles.
    - - Joystick 1 X / Y; joystick 2 X
      - GPIO34 / GPIO35 / GPIO36
      - 'Per axis: wiper→1kΩ→ADC; 100kΩ and100nF from ADC to GND.'
    - - Passive pot end terminals
      - 3V3 / GND
      - Use only ESP32 3V3; no external 5 V joystick signal.
    - - Enable button
      - GPIO27 to GND
      - Bare momentary button; INPUT_PULLUP; release required before arming.
    - - Servo positive
      - External switched 5 V +
      - Not the USB/DevKit positive rail.
    - - Servo returns / ESP32 reference
      - External supply minus + GND
      - Current returns go directly to the servo supply.
    - - Unused axis / click switches
      - Not connected
      - Identify physical terminals separately; no universal color/pin-order claim.
    key_concepts:
    - Servo power uses a separately switched, regulated 5 V rail; USB powers the ESP32 and 3.3 V passive joystick
      circuits only. Join grounds, never positive rails. The selected FS90 supplier supports 3.3 V control signals;
      another servo needs its own threshold review or a documented buffer. Fit 10kΩ from each servo signal to GND.
      For each used joystick axis connect its wiper through 1kΩ to the ADC node, with 100kΩ and 100 nF from that
      node to GND. Potentiometer ends connect only to ESP32 3V3/GND; identify ends/wipers electrically before soldering.
    - 'Use the documented FS90 positional variant supplied as Pololu #2818, with the FS90-C V1.0 manufacturer sheet.
      That specification describes 900–2100 µs, not a universal 500–2500 µs travel range. This sketch deliberately
      commands only 1400–1600 µs at 50 Hz and never converts commands into calibrated degrees. A 1500 µs command
      is not homing, and even narrow pulses do not establish mechanical clearance. The sheet gives 700/800 mA stall
      figures at 4.8/6 V; a separate 5 V / 3 A current-capable source for three units is a planning budget, not
      a measured peak guarantee or permission to stall. Check actual supply transients, wiring and the exact units.
      Retain 470 µF bulk decoupling (at least 10 V rated) at the distribution rail; it does not replace an adequate
      supply. Hobby servos contain their own drive electronics: do not add a flyback diode across the servo signal
      or assume bare-motor wiring. Classic ESP32 at 11 dB has a documented approximate 0.15–3.1 V ADC measurement
      range, different from its 3.3 V supply domain. ADC endpoint clipping deliberately causes a software fault
      here. GPIO34/35/36 lack internal pull resistors; external node pull-downs reduce floating on an open wiper
      path. They cannot detect every short, ground break or plausible intermediate fault. With 100kΩ/100 nF the
      nominal open-node RC is 10 ms, not an independently validated stop time.'
    applications:
    - Three-axis ADC-to-pulse mapping lesson
    - Manual-enable and reset-state demonstration
    troubleshooting:
    - - A is rejected
      - Release enable once after reset/disable, then center all three axes, hold enable and send A. Check power-off
        pot end/wiper identification and ADC node networks if a center is implausible; do not widen windows to conceal
        miswiring.
    - - An unplugged joystick is not reliably detected
      - The 100kΩ is at the ADC node, not the disconnected end of the cable. It helps pull an open wiper path LOW,
        but some faults remain plausible. Power off and inspect; do not claim the range check is a safety-rated
        continuity monitor.
    - - Immediate movement after A
      - 'That is possible: no shaft position is measured and 1500 µs is not homing. Remove power if unexpected;
        keep horns/loads removed. There is no startup motion ramp from a known physical position.'
    - - Servo buzzes, binds or supply resets ESP32
      - Switch servo power off immediately. Check exact unit, connector identity, supply transient capability, common
        ground and restrained mechanics. Do not increase endpoints, hold a stall or rely on a capacitor alone.
    - - Servo keeps torque after pulses disable
      - No universal torque-release behavior is assumed. Use the independent supply switch; a loaded arm could fall
        when released, which is why it is not part of this bench example.
    - - One direction feels reversed or response is coarse
      - Pot orientation changes sign, and servo deadband/mechanics affect movement. With power off verify the axis
        mapping. Commands are µs, not calibrated angles; do not infer position or smooth motion from Serial text.
    improvements:
    - Study feedback and limit switches in a separately designed mechanism; none are wired here.
    code: "// Classic ESP32-WROOM; Arduino-ESP32 3.3.2; built-in LEDC only.\n// Three documented FEETECH FS90 positional\
      \ units, no horns/load.\n// No homing, shaft feedback, limit switches or patient/safety function.\n#include\
      \ <Arduino.h>\n\nconstexpr uint8_t SERVO_PINS[3] = {13, 16, 17};\nconstexpr uint8_t AXIS_PINS[3] = {34, 35,\
      \ 36};\nconstexpr uint8_t ENABLE_PIN = 27, BITS = 16;\nconstexpr int MIN_US = 1400, CENTER_US = 1500, MAX_US\
      \ = 1600;\nconstexpr uint32_t LEASE_MS = 10000, UPDATE_MS = 20;\nint pulseUs[3] = {CENTER_US, CENTER_US, CENTER_US};\n\
      int center[3] = {2048, 2048, 2048};\nbool attached[3] = {false, false, false}, armed = false, needsRelease\
      \ = true;\nuint32_t armedAt = 0, lastUpdate = 0;\n\nuint32_t ticks(int us) {\n  return (uint32_t(us) * (1UL\
      \ << BITS) + 10000) / 20000;\n}\nvoid disableOutputs() {\n  armed = false; needsRelease = true;\n  bool ok\
      \ = true;\n  for (int i = 0; i < 3; ++i) {\n    if (attached[i]) {\n      if (!ledcWrite(SERVO_PINS[i], 0))\
      \ ok = false;\n      if (!ledcDetach(SERVO_PINS[i])) ok = false;\n      attached[i] = false;\n    }\n    digitalWrite(SERVO_PINS[i],\
      \ LOW); pinMode(SERVO_PINS[i], OUTPUT);\n  }\n  if (!ok) Serial.println(\"LEDC stop error: remove external\
      \ servo power\");\n  Serial.println(\"Pulses disabled; external power and possible torque remain\");\n}\n\
      void armAtCenter() {\n  if (needsRelease) { Serial.println(\"Release enable before arming again\"); return;\
      \ }\n  if (armed) { Serial.println(\"Release enable before a new arm attempt\"); return; }\n  if (digitalRead(ENABLE_PIN)\
      \ != LOW) {\n    Serial.println(\"Hold enable, center all axes, then send A\"); return;\n  }\n  for (int i\
      \ = 0; i < 3; ++i) {\n    long sum = 0;\n    for (int n = 0; n < 16; ++n) sum += analogRead(AXIS_PINS[i]);\n\
      \    int value = int(sum / 16);\n    if (value < 1200 || value > 3000) {\n      Serial.println(\"Axis not\
      \ in plausible center window; remains disabled\"); return;\n    }\n    center[i] = value; // Manual centered\
      \ reference, not a continuity test.\n  }\n  if (digitalRead(ENABLE_PIN) != LOW) return;\n  for (int i = 0;\
      \ i < 3; ++i) {\n    pulseUs[i] = CENTER_US;\n    attached[i] = ledcAttach(SERVO_PINS[i], 50, BITS);\n   \
      \ if (!attached[i] || !ledcWrite(SERVO_PINS[i], ticks(CENTER_US))) {\n      disableOutputs(); Serial.println(\"\
      Attach/write failed; inspect with power off\"); return;\n    }\n  }\n  armedAt = millis(); lastUpdate = armedAt;\
      \ armed = true; needsRelease = true;\n  Serial.println(\"1500 us commanded: movement may be immediate; no\
      \ home position measured\");\n}\nvoid setup() {\n  Serial.begin(115200);\n  pinMode(ENABLE_PIN, INPUT_PULLUP);\
      \ // Bare momentary button to GND; software gate only.\n  analogReadResolution(12);\n  for (int i = 0; i <\
      \ 3; ++i) {\n    pinMode(AXIS_PINS[i], INPUT);\n    analogSetPinAttenuation(AXIS_PINS[i], ADC_11db);\n   \
      \ digitalWrite(SERVO_PINS[i], LOW); pinMode(SERVO_PINS[i], OUTPUT);\n  }\n  Serial.println(\"Disabled. External\
      \ power off for wiring/upload. No automatic sweep.\");\n  Serial.println(\"Center axes, hold enable and send\
      \ A; X disables. Lease is 10 seconds.\");\n}\nvoid loop() {\n  if (!armed && digitalRead(ENABLE_PIN) == HIGH)\
      \ needsRelease = false;\n  if (armed && (digitalRead(ENABLE_PIN) != LOW || uint32_t(millis() - armedAt) >=\
      \ LEASE_MS)) {\n    disableOutputs();\n  }\n  if (Serial.available()) {\n    char cmd = Serial.read();\n \
      \   if (cmd == 'X' || cmd == 'x') disableOutputs();\n    else if (cmd == 'A' || cmd == 'a') armAtCenter();\n\
      \    // Newlines and unrelated characters do not move servos or extend the lease.\n  }\n  if (!armed || uint32_t(millis()\
      \ - lastUpdate) < UPDATE_MS) return;\n  lastUpdate = millis();\n  int raw[3];\n  for (int i = 0; i < 3; ++i)\
      \ {\n    raw[i] = analogRead(AXIS_PINS[i]);\n    if (raw[i] <= 100 || raw[i] >= 3900) {\n      disableOutputs();\
      \ Serial.println(\"Axis range fault; inspect disconnected input/rails\"); return;\n    }\n  }\n  for (int\
      \ i = 0; i < 3; ++i) {\n    int delta = raw[i] - center[i];\n    if (delta > 250) pulseUs[i] += 2;\n    else\
      \ if (delta < -250) pulseUs[i] -= 2;\n    pulseUs[i] = constrain(pulseUs[i], MIN_US, MAX_US);\n    if (!ledcWrite(SERVO_PINS[i],\
      \ ticks(pulseUs[i]))) {\n      disableOutputs(); Serial.println(\"Pulse write failed; remove external power\"\
      ); return;\n    }\n  }\n  // These are commands only; no shaft-angle or motion feedback exists.\n}\n"
    code_filename: esp32-robot-arm-controller.ino
