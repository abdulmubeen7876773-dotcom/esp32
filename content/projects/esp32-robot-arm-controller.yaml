  wiring:
    full_size_link: true
    illustration_alt: 'Logical unloaded FS90 bench: signals13/16/17 with pull-downs, joystick ADC34/35/36 with series/filter/pull-down
      networks, enable27 to GND, external5V and common ground. No mechanical pin layout or homing.'
    summary: 'Base/shoulder/elbow signal labels mean logical channels: GPIO13/16/17 respectively, each with 10kΩ
      to GND. Three used passive joystick wipers feed GPIO34/35/36 through separate 1kΩ resistors; each ADC node
      has 100kΩ and 100 nF to GND. Enable button joins GPIO27 to GND. Servos use external switched 5 V and common
      ground; no external positive reaches ESP32 USB/3V3.'
    steps:
    - Disconnect both supplies and remove all horns/loads. Identify exact FS90 connectors and passive joystick pot
      ends/wipers from documentation plus an unpowered continuity/resistance check. This is not a physical connector-order
      drawing.
    - Connect servo signals13/16/17 and their 10kΩ pull-downs. Route the servo positive leads to the separate 5
      V distribution rail, and their returns directly to the supply minus. Join that minus to ESP32 GND for signal
      reference.
    - Place the selected 470 µF ≥10 V capacitor across the external rail near distribution, with correct polarity.
      Do not route servo current through a solderless breadboard/DevKit or join the external positive to USB.
    - Wire joystick pot ends to ESP32 3V3/GND. One joystick X→1k→GPIO34; Y→1k→GPIO35. Second joystick X→1k→GPIO36.
      At EACH ADC node fit 100kΩ and 100 nF to GND. Leave unused wiper and joystick click switches unconnected;
      verify the actual breakout netlist.
    - Connect a bare momentary button from GPIO27 to GND. The sketch uses INPUT_PULLUP; the button affects software
      only.
    - With external servo power off, upload/reset and check disabled startup. Release the button once. Apply servo
      power only with the bench clear, center axes, hold enable and send A at 115200 baud. Be prepared for immediate
      movement toward the commanded center region.
    - Use only small unloaded changes. Release enable or send X before switching external power off. Power down
      both sources before rewiring; do not extend pulse ranges or attach an arm load to force travel.
