  what_you_build: Three joystick axes increment three positional-servo pulse commands on a restrained, unloaded
    bench. The historical robot-arm URL remains, but no load-bearing arm assembly or mechanical travel calibration
    is supplied. There are no limit switches, homing sensors, encoders or verified joint positions. Keep horns and
    loads removed for this supported exercise. The overview is a logical illustration, not a hardware photo or test
    result. Use the specified parts and wiring map below; physical connector orientation must be checked separately.
  story: A joystick can request a change without telling the ESP32 where a joint actually is. This lesson keeps
    the three-axis control idea while separating commanded pulse width from measured travel and deliberate enable
    from automatic startup motion.
  eli12: A pulse requests a servo position; it does not measure one. The program starts with no pulses. After a
    deliberate enable it requests 1500 µs, which can move the shaft immediately from an unknown starting position.
  parent_safety: Use three identified FEETECH FS90 positional units, not FS90R continuous-rotation or unknown SG90-labelled
    units. Restrain the cases, remove horns/load and keep the separate servo-power switch reachable. A released
    software-enable button, X or timeout only stops pulses; power remains and torque response is not guaranteed.
    A loaded arm could fall when pulses/power stop. This page does not supply a safe loaded-arm mechanism or independent
    emergency stop.
  learning_objectives:
  - Command three documented FS90 units without a startup sweep.
  - Bias ADC inputs while acknowledging undetected fault modes.
  - Use explicit enable and a nonrenewable command lease.
  - Distinguish pulse disable from power removal and homing.
