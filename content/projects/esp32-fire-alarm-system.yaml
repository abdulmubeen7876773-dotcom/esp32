  wiring:
    full_size_link: true
    illustration_alt: Logical MQ-2 bare-sensor heater, load resistor and 12 kΩ/10 kΩ ESP32 interface with qualified
      output stage
    summary: One bounded bare-sensor circuit. Heater and sensing-loop supply are 5.0 V ±0.1 V; ESP32 signals remain
      in the 3.3 V domain. Unknown comparator breakouts are not covered.
    steps:
    - Disconnect USB and the external supply. Confirm the manufacturer pin-view orientation; the logical drawing
      is not a physical pin layout.
    - Connect the bare MQ-2 H heater pair across external regulated 5.0 V ±0.1 V. Connect both A electrode pins
      to that same 5 V rail; join both B pins as RAW.
    - Connect a separate RL = 10 kΩ from RAW to common GND. Connect RAW through 12 kΩ (1%) to the ADC node, then
      10 kΩ (1%) from that node to GND.
    - Connect only the divided node to GPIO34. Add 100 nF from that node to GND. There is no DOUT connection in
      this circuit.
    - Join ESP32 GND, 5 V heater-supply GND and 4.5 V output-supply GND. Keep both external positive rails off USB/VIN/3V3
      and separate from each other.
    - GPIO25 -> 1 kΩ -> red LED anode; red cathode -> GND. GPIO26 -> a separate 1 kΩ -> green anode; green cathode
      -> GND.
    - GPIO27 -> 330 Ω -> P2N2222A base (2); 100 kΩ base to emitter (3); emitter -> GND. Collector (1) -> buzzer
      minus; buzzer S -> separate regulated 4.5 V ±5%; centre unused.
    - Before attaching GPIO34, check the divider values and output with a meter. Power USB first, then the heater/output
      supply; type d to disarm and switch both external rails off before USB to avoid back-power through a signal
      pin.
    - Complete the sensor conditioning procedure, observe the actual warm-up trend, and record stable reference
      conditions before typing b then a. No automatic delay proves stability.
  gpio_map:
  - signal: Divided RAW
    esp32_pin: GPIO34
    direction: Analog input
    notes: 12 kΩ upper / 10 kΩ lower, 1%; 100 nF to GND. Never RAW directly.
  - signal: Sensor H pair / A pair
    esp32_pin: External regulated 5.0 V ±0.1 V
    direction: Power
    notes: Not ESP32 3V3; external positive remains off board power pins.
  - signal: B pair RAW
    esp32_pin: RL 10 kΩ to GND
    direction: Analog node
    notes: Also feeds the upper 12 kΩ resistor; no DOUT.
  - signal: Common reference
    esp32_pin: GND
    direction: Ground
    notes: ESP32 and both external supplies share GND; positive rails remain separate.
  - signal: Red LED
    esp32_pin: GPIO25
    direction: Output
    notes: Own 1 kΩ series resistor; HIGH = relative threshold active.
  - signal: Green LED
    esp32_pin: GPIO26
    direction: Output
    notes: Own 1 kΩ resistor; below threshold only while armed, not a safety indication.
  - signal: Buzzer transistor base
    esp32_pin: GPIO27
    direction: Output
    notes: 330 Ω base resistor; 100 kΩ base-emitter; HIGH switches the selected buzzer on.
  - signal: Selected relay/buzzer power
    esp32_pin: External regulated 4.5 V ±5%
    direction: Power
    notes: Separate ≥200 mA rail, common GND. Not the 5.1 V worst-case heater rail.
  circuit_explanation: 'The A/B sensing element and RL form a resistance-to-voltage circuit. The extra 12 kΩ + 10
    kΩ ADC divider also loads RAW: the effective load is 10 kΩ || 22 kΩ ≈ 6.875 kΩ. Do not reuse a manufacturer
    response curve as a ppm conversion for this altered load. The upper divider resistor is 12 kΩ; the lower is
    10 kΩ, not reversed.'
  engineering_explanation: 'Interface calculation: assume RAW can reach the full 5.1 V supply. Nominal ratio is
    10/22, so 5.0 V becomes 2.273 V. With 1% resistors, maximum ratio is 10.1/(11.88+10.1): 5.1 V becomes 2.344
    V. This leaves about 0.756 V below the classic ESP32 11 dB documented 3.1 V measurement ceiling, as well as
    margin below the GPIO logic supply. Even 5.25 V would stay below 2.413 V, but that does not permit exceeding
    the heater’s 5.1 V maximum. Readings below about 150 mV are outside the documented ADC measurement range. These
    calculations assume intact resistors, correct wiring, common ground and a powered ESP32; the divider is not
    fault-rated protection or isolation. Verify actual voltages before connecting the pin. The separate 4.5 V ±5%
    output rail spans 4.275–4.725 V, inside the selected relay/buzzer 3–5 V supply range. Do not simply parallel
    it with the 5 V heater rail. With a 330 Ω (1%) base resistor, 2.4 V GPIO HIGH at the classic ESP32 3.0 V minimum
    operating supply and a conservative 1.2 V base-emitter drop give about 3.60 mA before the small base pull-down
    current base current for the selected buzzer’s 30 mA maximum. This is a driver-design check, not an observed
    current or saturation measurement.'
  libraries:
  - name: Arduino-ESP32 3.3.2
    note: Classic ESP32-WROOM review baseline; analogReadResolution(12) and analogSetPinAttenuation(GPIO34, ADC_11db).
      No extra sensor library. No firmware compilation or hardware test is established by this example.
  code:
    filename: esp32-fire-alarm-system.ino
    content: "// Classic ESP32-WROOM DevKit; Arduino-ESP32 3.3.2 review baseline.\n// Bare Winsen MQ-2, RL 10k;\
      \ RAW -> 12k -> GPIO34 -> 10k -> GND (1%).\n// Educational relative-count demo, NOT a safety alarm or calibrated\
      \ gas meter.\nconst int SENSOR_PIN = 34;\nconst int RED_PIN = 25, GREEN_PIN = 26, BUZZER_PIN = 27;\nconst\
      \ int ON_OFFSET = 200;   // Illustrative raw counts, not a gas limit.\nconst int OFF_OFFSET = 100;  // Hysteresis\
      \ below ON_OFFSET.\nbool armed = false, baselineSet = false, active = false, sampled = false;\nint baseline\
      \ = 0, reading = 0;\nunsigned long lastSample = 0;\n\nbool usable() { return sampled && reading > 20 && reading\
      \ < 3800; }\n\nvoid setOutputs(bool enabled, bool alert) {\n  digitalWrite(RED_PIN, enabled && alert ? HIGH\
      \ : LOW);\n  digitalWrite(GREEN_PIN, enabled && !alert ? HIGH : LOW);\n  // Short bench chirp, not a fire-alarm\
      \ cadence.\n  digitalWrite(BUZZER_PIN, enabled && alert && millis() % 3000 < 200 ? HIGH : LOW);\n}\n\nvoid\
      \ setup() {\n  Serial.begin(115200);\n  const int outputs[] = {RED_PIN, GREEN_PIN, BUZZER_PIN};\n  for (int\
      \ pin : outputs) {\n    pinMode(pin, OUTPUT);\n    digitalWrite(pin, LOW);\n  }\n  pinMode(SENSOR_PIN, INPUT);\n\
      \  analogReadResolution(12);\n  analogSetPinAttenuation(SENSOR_PIN, ADC_11db);\n  Serial.println(\"DISARMED.\
      \ Complete sensor conditioning and observe baseline stability first.\");\n  Serial.println(\"b = capture reference\
      \ count; a = arm demo; d = disarm. Not calibration.\");\n}\n\nvoid loop() {\n  if (millis() - lastSample >=\
      \ 1000) {\n    lastSample = millis();\n    unsigned long sum = 0;\n    for (int i = 0; i < 16; ++i) {\n  \
      \    sum += analogRead(SENSOR_PIN);\n      delayMicroseconds(200);\n    }\n    reading = sum / 16;\n    sampled\
      \ = true;\n    if (!usable()) { armed = false; active = false; }\n    if (armed) {\n      if (!active && reading\
      \ >= baseline + ON_OFFSET) active = true;\n      if (active && reading <= baseline + OFF_OFFSET) active =\
      \ false;\n    }\n    Serial.printf(\"raw=%d reference=%d armed=%d thresholdState=%d\\n\",\n              \
      \    reading, baseline, armed, active);\n    if (!usable()) Serial.println(\"ADC near a rail: demo disabled;\
      \ inspect power and wiring.\");\n  }\n  while (Serial.available()) {\n    char c = Serial.read();\n    if\
      \ (c == 'd' || c == 'b') { armed = false; active = false; }\n    if (c == 'b') {\n      baselineSet = usable()\
      \ && reading <= 3500;\n      if (baselineSet) baseline = reading;\n      Serial.println(baselineSet ? \"Reference\
      \ captured; still disarmed.\" : \"Reference refused.\");\n    }\n    if (c == 'a') {\n      armed = baselineSet\
      \ && usable();\n      Serial.println(armed ? \"Demo armed; not a safety monitor.\" : \"Capture a usable reference\
      \ first.\");\n    }\n  }\n  setOutputs(armed && usable(), active);\n}\n"
  code_explanation: Startup and reset are disarmed with all outputs OFF. Once per second the sketch averages 16
    raw ADC samples. Type b to capture a reference count only after independently checking conditioning and stability;
    type a to arm, d to disarm. The +200/+100 raw-count thresholds provide illustrative hysteresis, not a health
    or fire limit. Near-rail counts disable the output, but this cannot detect every disconnected sensor or wiring
    fault.
  expected_output: At 115200 baud, expect raw, reference, armed and thresholdState fields. A reboot never arms automatically.
    After b then a, outputs change only with the chosen relative-count thresholds. No ppm, AQI, gas identity, safe-air
    status or confirmed fire detection is produced.
  common_mistakes:
  - text: Substituting an unidentified comparator module for the bare sensor circuit.
  - text: Connecting RAW, heater power or a 5 V DOUT to a GPIO.
  - text: Reversing the 12 kΩ upper and 10 kΩ lower divider resistors.
  - text: Treating a green LED or a plausible number as evidence of safe air.
  - text: Using a fixed 30-second timer as proof of conditioning or stability.
  troubleshooting:
  - problem: Counts drift after switch-on
    fix: 'Winsen specifies at least 48 hours initial preheating under its standard conditions (MQ135: over 48 hours).
      Storage may require additional aging. Later power-ups still need warm-up; log the actual trend under unchanged
      conditions. No universal short delay establishes stability or calibration.'
  - problem: ADC near zero or full scale
    fix: Disarm, turn both supplies off, inspect H/A/B identification, common ground, RL and divider orientation.
      Measure the divided voltage before reconnecting GPIO34. Do not raise the threshold to conceal an electrical
      fault.
  - problem: Output remains OFF
    fix: Reboot is deliberately disarmed. Observe usable counts, type b then a; verify the exact active-HIGH output
      stage. Do not test with smoke or gas.
  - problem: Reference changes with environment
    fix: Humidity, temperature, oxygen, contamination and multiple gases influence MQ response. A stable baseline
      is a record of conditions, not proof of air safety or calibration.
  testing_checklist:
  - With power off, compare the H/A/B wiring with the manufacturer lead-view drawing.
  - Verify the 5.0 V ±0.1 V rail and the divided node with a meter before attaching the ESP32 input.
  - Complete initial conditioning; record actual power-up settling observations separately.
  - Check disarmed startup, b/a/d commands and output polarity using only low-voltage bench loads.
  - If demonstrating threshold logic without a sensor change, adjust the illustrative offsets in code; never create
    smoke or release gas.
  - Switch off the external supply before USB. These are checks to perform, not a claim that this build was tested.
  engineer_tips:
  - The divider upper bound is an electrical calculation, not hardware verification.
  - A captured reference count is not a calibration.
  - Keep heater heat away from the ESP32 regulator and flammable materials.
  upgrade_ideas:
  - Log raw counts with temperature, humidity and elapsed powered time.
  - Display the armed/disarmed state clearly on an OLED.
  real_world_applications:
  - Supervised analog-interface lesson
  - Relative-count threshold and hysteresis demonstration
