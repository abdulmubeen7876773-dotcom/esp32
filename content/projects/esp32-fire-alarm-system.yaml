  what_you_build: A manually armed MQ-2 relative-reading demonstration on a classic ESP32-WROOM DevKit. It uses
    the bare six-pin Winsen sensor, not an unidentified AOUT/DOUT breakout. GPIO25/GPIO26 LEDs and a transistor-switched
    buzzer show the threshold state.
  story: Follow one documented electrical circuit before interpreting changing numbers. This page does not establish
    gas concentration, AQI, clean-air safety, smoke detection or successful hardware operation.
  eli12: The heated sensing material changes resistance. A resistor turns that change into a voltage; a second network
    reduces the voltage before the ESP32 reads it. Many gases and environmental changes can affect the same reading.
  parent_safety: Not a certified smoke/fire alarm, gas detector or safety system. Do not use flame, fuel gas, deliberate
    smoke or solvents as classroom stimuli. The sensor heater becomes hot; use a ventilated, nonflammable bench
    and supervised power. No mains loads. Turn off both supplies before rewiring.
  learning_objectives:
  - Separate heater power from 3.3 V GPIO signals.
  - Read a divided analog voltage on ADC1 GPIO34.
  - Distinguish initial conditioning, power-up warm-up and observed baseline stability.
  - Use manually armed relative-count thresholds without claiming calibration.
