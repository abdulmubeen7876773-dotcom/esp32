  faqs:
  - question: Is this LoRaWAN?
    answer: No. It is point-to-point LoRa only.
  - question: Why is the antenna mandatory?
    answer: Transmitting without a matched antenna can damage the radio output stage.
  - question: How far will it go?
    answer: It depends on legal power, antenna, terrain, and obstruction; no fixed range is promised.
