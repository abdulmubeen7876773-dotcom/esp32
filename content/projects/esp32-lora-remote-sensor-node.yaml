    content: "// ESP32 LoRa point-to-point DHT22 sender/receiver\n// Set NODE_MODE_SENDER to 1 on the sender and\
      \ 0 on the receiver.\n// Always connect the correct antenna before transmitting.\n#include <SPI.h>\n#include\
      \ <LoRa.h>\n#include <DHT.h>\n\n#define NODE_MODE_SENDER 1\n\nconst long LORA_FREQUENCY_HZ = 915E6; // Change\
      \ to a legal frequency for your region and module.\nconst int LORA_SCK = 18;\nconst int LORA_MISO = 19;\n\
      const int LORA_MOSI = 23;\nconst int LORA_CS = 5;\nconst int LORA_RST = 14;\nconst int LORA_DIO0 = 26;\nconst\
      \ int DHT_PIN = 4;\n\nDHT dht(DHT_PIN, DHT22);\nuint32_t sequenceNumber = 0;\nuint32_t badPackets = 0;\n\n\
      bool initLoRa() {\n  SPI.begin(LORA_SCK, LORA_MISO, LORA_MOSI, LORA_CS);\n  LoRa.setPins(LORA_CS, LORA_RST,\
      \ LORA_DIO0);\n  if (!LoRa.begin(LORA_FREQUENCY_HZ)) return false;\n  LoRa.setTxPower(10); // Conservative\
      \ starter value; obey local legal limits.\n  return true;\n}\n\nbool parsePacket(String packet, int &node,\
      \ float &tempC, float &humidity, uint32_t &seq) {\n  packet.trim();\n  int a = packet.indexOf(',');\n  int\
      \ b = packet.indexOf(',', a + 1);\n  int c = packet.indexOf(',', b + 1);\n  if (a < 0 || b < 0 || c < 0) return\
      \ false;\n  node = packet.substring(0, a).toInt();\n  tempC = packet.substring(a + 1, b).toFloat();\n  humidity\
      \ = packet.substring(b + 1, c).toFloat();\n  seq = (uint32_t) packet.substring(c + 1).toInt();\n  if (node\
      \ < 1 || node > 99) return false;\n  if (tempC < -40.0 || tempC > 80.0) return false;\n  if (humidity < 0.0\
      \ || humidity > 100.0) return false;\n  return true;\n}\n\nvoid setup() {\n  Serial.begin(115200);\n  dht.begin();\n\
      \  if (!initLoRa()) {\n    Serial.println(\"LoRa init failed. Check SPI wiring, power, frequency, and antenna.\"\
      );\n    while (true) delay(10);\n  }\n  Serial.println(NODE_MODE_SENDER ? \"LoRa sender ready.\" : \"LoRa\
      \ receiver ready.\");\n}\n\nvoid loop() {\n#if NODE_MODE_SENDER\n  float tempC = dht.readTemperature();\n\
      \  float humidity = dht.readHumidity();\n  if (isnan(tempC) || isnan(humidity)) {\n    Serial.println(\"DHT22\
      \ read failed; packet not sent.\");\n    delay(5000);\n    return;\n  }\n\n  String packet = \"1,\" + String(tempC,\
      \ 1) + \",\" + String(humidity, 1) + \",\" + String(sequenceNumber++);\n  LoRa.beginPacket();\n  LoRa.print(packet);\n\
      \  LoRa.endPacket();\n  Serial.print(\"Sent: \");\n  Serial.println(packet);\n  delay(15000);\n#else\n  int\
      \ size = LoRa.parsePacket();\n  if (!size) return;\n  String packet = LoRa.readString();\n  int node = 0;\n\
      \  float tempC = 0;\n  float humidity = 0;\n  uint32_t seq = 0;\n  if (!parsePacket(packet, node, tempC, humidity,\
      \ seq)) {\n    badPackets++;\n    Serial.print(\"Rejected malformed packet #\");\n    Serial.println(badPackets);\n\
      \    return;\n  }\n  Serial.printf(\"Node %d seq %lu  temp %.1f C  humidity %.1f %%  RSSI %d dBm\\n\",\n \
      \               node, (unsigned long)seq, tempC, humidity, LoRa.packetRssi());\n#endif\n}\n"
  code_explanation: One compile-time mode sends DHT22 packets. Receiver mode parses field count and plausible ranges,
    then logs RSSI.
  expected_output: Receiver prints node ID, sequence number, temperature, humidity, and RSSI for valid packets;
    malformed packets are rejected.
  common_mistakes:
