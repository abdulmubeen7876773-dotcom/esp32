  wiring:
    full_size_link: true
    illustration_alt: ESP32 LoRa Remote Sensor Node (Point-to-Point) wiring diagram
    summary: Each LoRa breakout uses VSPI SCK GPIO18, MISO GPIO19, MOSI GPIO23, CS GPIO5, RST GPIO14, and DIO0 GPIO26.
      Sender DHT22 DATA uses GPIO4. This is an external RFM95W adapter on a classic ESP32-WROOM DevKit, not a Heltec
      integrated-board pin map. Connections are logical net labels, not a physical module orientation.
    steps:
    - Unplug USB before wiring both nodes.
    - Use a regulated 3.3 V radio supply with at least 150 mA capacity per RFM95W and local 100 nF + 10 µF decoupling.
      Join its ground to ESP32 GND. Never apply 5 V; do not parallel external positive with ESP32 3V3.
    - Wire SCK GPIO18, MISO GPIO19, MOSI GPIO23, NSS/CS GPIO5, RST GPIO14, and DIO0 GPIO26.
    - Connect the correct antenna before powering or transmitting.
    - 'Sender only: DHT22 VCC to ESP32 3V3, GND to common GND, DATA to GPIO4 with 10 kΩ pull-up to 3V3 unless the
      documented module already includes one.'
    - Set LORA_FREQUENCY_HZ to a legal frequency for your region and module.
