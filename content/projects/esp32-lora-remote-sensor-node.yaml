  circuit_explanation: The radio uses SPI for control and the DHT22 supplies sender readings. The receiver validates
    comma-separated packets before printing.
  engineering_explanation: 'Range depends on legal power, antennas, terrain, obstruction, and frequency. The page
    intentionally avoids fixed distance claims. HopeRF datasheet v2.0 distinguishes the 868/915 MHz RFM95W from
    other RF variants. The 915 MHz code setting is only for matching hardware in a region where permitted; otherwise
    configure both radios for a permitted frequency supported by that exact module. RF legality, duty cycle and
    antenna gain still require local review. GPIO5 is a classic ESP32 strapping pin: do not add an external pull-down
    or use an adapter that drives NSS during reset.'
