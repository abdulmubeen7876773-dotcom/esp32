  faqs:
  - question: Does a captured frame prove a QR code was decoded?
    answer: No. Only QUIRC_SUCCESS identifies a successful library decode. Compare returned bytes with known content;
      an IP address, image or upload log is different evidence.
  - question: Can this unlock a door or trust scanned URLs?
    answer: No. Decoded bytes are untrusted, may repeat and may not be text. No identity, replay prevention, access-control
      protocol or actuator is implemented.
