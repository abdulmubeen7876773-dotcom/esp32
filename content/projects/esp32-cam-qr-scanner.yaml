  code_explanation: Initialization failure leaves scanning disabled. quirc_new/resize must succeed. Each frame must
    be exactly 320×240 one-byte grayscale, with matching Quirc dimensions and length, before memcpy. Return the
    camera frame before Quirc detection/decoding. Candidate count is not a decode-success count. Large code/data
    objects are static; failed decode attempts print an error. A successful result prints payload_len bytes with
    non-printable bytes escaped, never as an assumed zero-terminated UTF-8 string. The 500 ms scheduling interval
    is not a measured decoding rate; a slow decode extends it.
  expected_output: At 115200 baud, initialization should report camera/PSRAM and Quirc version. A readable non-sensitive
    printed code may yield a decoded byte count and escaped payload. Otherwise expect no candidate, decode error
    or capture failure messages. Compare the exact bytes against your known test content. No sample payload or decoded
    success is supplied as a recorded result.
  common_mistakes:
  - text: Testing with a tiny QR code too close to the camera.
  - text: Using glossy phone screens with glare.
  - text: Leaving IO0 grounded after upload.
  - text: Running high camera resolution that leaves too little memory for decoding.
  - text: Adding door-lock hardware before QR decoding is reliable.
  troubleshooting:
  - problem: Upload waits for connection
    fix: Power off and verify crossed 3.3 V UART, common ground and port. Fit IO0→GND, power up and press RST before
      retrying upload. Do not infer UART voltage from a supply jumper.
  - problem: Bootloader messages repeat after upload
    fix: Power off, remove the IO0 jumper and restart with RST. GPIO0 must be available for camera XCLK in run mode.
  - problem: Brownout or camera init error
    fix: Record the printed error code. Disconnect power before checking board identity, camera orientation/ribbon
      latch, supply/regulator and short return leads. A higher current label alone does not diagnose the fault;
      do not disable brownout protection.
  - problem: Unexpected sensor or missing PSRAM
    fix: Use only the identified OV2640/AI-Thinker arrangement. Check board profile and PSRAM setting. The QR example
      stops without PSRAM; the QVGA JPEG checks use explicit one-buffer DRAM fallback. Do not substitute another
      camera map blindly.
  - problem: quirc.h missing or undefined quirc symbols
    fix: Verify all six v1.2 files beside the .ino, .c file extensions and no duplicate wrapper library. A header
      alone is not the implementation.
  - problem: No candidate or repeated decode errors
    fix: Use a simple large non-sensitive printed QR with quiet border, even light, stable camera and correct focus.
      Glare, blur, orientation, code density and memory can matter. Error correction is not a blanket guarantee
      of decoding 30% arbitrary image damage.
  - problem: Quirc allocation fails
    fix: Stop and inspect free heap, PSRAM configuration and exact package. PSRAM framebuffer availability does
      not guarantee every Quirc allocation. Do not ignore null/resize failures or force a decode.
  testing_checklist:
  - 'Documentation/API review only: no compilation or camera hardware operation recorded for this sketch.'
  - Check exact board/sensor, UART signal level, regulator input and supply wiring with power off.
  - Record upload, boot, initialization and actual output separately. Upload completion alone is not camera-function
    evidence.
  engineer_tips:
  - Prove camera capture before QR decoding.
  - Use matte printed codes for testing.
  - Keep the first decoded action harmless, such as Serial output.
  - Do not connect locks or relays until false reads are handled.
  - Add a timeout so the same QR code does not trigger repeatedly.
  performance_tips:
  - Use modest resolution to preserve RAM.
  - Decode only when a new frame is ready.
  - Avoid unnecessary Wi-Fi while decoding if memory is tight.
  - Use simple payload strings in QR codes.
