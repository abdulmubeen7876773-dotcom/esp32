    Quirc setup: download upstream dlbeer/quirc tag v1.2 (not zbar or an unspecified Arduino wrapper). Save the
    .ino in its own sketch folder. Beside it put these six unmodified files from that tag’s lib/ directory: quirc.h,
    quirc_internal.h, quirc.c, identify.c, decode.c and version_db.c. Keep the .c extensions so Arduino compiles
    C separately; retain their license notices. Do not copy the desktop demo, JPEG/PNG/SDL tools or a second Quirc
    copy. Save/reopen the sketch folder so all source tabs/files are present. This source integration has been API-reviewed,
    not compiled in this environment.


    Version-label caveat: upstream quirc.c at tag v1.2 still returns the string 1.0 from quirc_version(). The Serial
    label is not a reliable release check; identify the six files by the pinned v1.2 tag, not that string.'
