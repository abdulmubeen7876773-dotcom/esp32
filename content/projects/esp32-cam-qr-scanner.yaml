levels:
  beginner:
    level: beginner
    overview_html: <p>An offline QR-to-Serial demonstration on an identified classic AI-Thinker ESP32-CAM/OV2640
      with working PSRAM. Captured grayscale frames pass through Quirc v1.2; only successful decode results print
      length-bounded escaped bytes. It does not open URLs, stream images, log to SD/MQTT or operate a lock. The
      existing illustration is conceptual, not a photograph or supplied decoded result.</p>
    components:
    - Documented AI-Thinker classic ESP32-CAM with OV2640
    - USB–UART adapter with verified 3.3 V TTL signals
    - Regulated 5 V / 2 A current-capable external supply and short leads
    - USB data cable, removable IO0 jumper and accessible RST button
    wiring:
    - - Programmer TX / RX
      - U0R GPIO3 / U0T GPIO1
      - Cross TX→RX; 3.3 V TTL only. Not RS-232 or 5 V UART.
    - - External regulated supply
      - 5V / GND
      - Board regulator input, not chip/GPIO voltage. Adapter positive outputs NC.
    - - Upload strap / camera clock
      - GPIO0 → GND for reset into upload only
      - Remove strap with power off and reset to run.
    - - OV2640 D0…D7
      - 5, 18, 19, 21, 36, 39, 34, 35
      - Onboard ribbon/internal wiring; do not externally rewire.
    - - OV2640 XCLK/PCLK/VSYNC/HREF
      - 0 / 22 / 25 / 23
      - AI-Thinker only, not WROVER-KIT or S3 map.
    - - OV2640 SCCB SDA/SCL
      - 26 / 27
      - Modern pin_sccb_sda/pin_sccb_scl API names.
    - - Camera PWDN / RESET
      - 32 / -1
      - Board RST resets the ESP32; camera reset=-1 is not the upload reset button.
    key_concepts:
    - 'The manufacturer V1.0 board specification lists a 5 V supply and external PSRAM; the ESP32 and UART remain
      in the 3.3 V signal domain. This does not establish the regulator or pinout of an unmarked clone. JPEG QVGA
      (320×240), one buffer, can use the driver''s low-resolution DRAM path when PSRAM is unavailable. Grayscale
      QR capture explicitly requires PSRAM here. More buffers/resolution are not free upgrades: upstream recommends
      multiple frame buffers only with JPEG. No frame rate or memory availability is guaranteed.'
    applications: &id002
    - Learning the image-to-payload pipeline
    - Non-sensitive classroom label experiments
    troubleshooting:
    - - Upload waits for connection
      - Power off and verify crossed 3.3 V UART, common ground and port. Fit IO0→GND, power up and press RST before
        retrying upload. Do not infer UART voltage from a supply jumper.
    - - Bootloader messages repeat after upload
      - Power off, remove the IO0 jumper and restart with RST. GPIO0 must be available for camera XCLK in run mode.
    - - Brownout or camera init error
      - Record the printed error code. Disconnect power before checking board identity, camera orientation/ribbon
        latch, supply/regulator and short return leads. A higher current label alone does not diagnose the fault;
        do not disable brownout protection.
    - - Unexpected sensor or missing PSRAM
      - Use only the identified OV2640/AI-Thinker arrangement. Check board profile and PSRAM setting. The QR example
        stops without PSRAM; the QVGA JPEG checks use explicit one-buffer DRAM fallback. Do not substitute another
        camera map blindly.
    - - quirc.h missing or undefined quirc symbols
      - Verify all six v1.2 files beside the .ino, .c file extensions and no duplicate wrapper library. A header
        alone is not the implementation.
    - - No candidate or repeated decode errors
      - Use a simple large non-sensitive printed QR with quiet border, even light, stable camera and correct focus.
        Glare, blur, orientation, code density and memory can matter. Error correction is not a blanket guarantee
        of decoding 30% arbitrary image damage.
    - - Quirc allocation fails
      - Stop and inspect free heap, PSRAM configuration and exact package. PSRAM framebuffer availability does not
        guarantee every Quirc allocation. Do not ignore null/resize failures or force a decode.
    improvements: &id001
    - SD, MQTT, validation and duplicate filtering require separate complete designs; the old incomplete advanced
      snippets are not supported examples.
    code: "// AI-Thinker classic ESP32-CAM + OV2640 only; Arduino-ESP32 3.3.2.\n// The board takes regulated 5 V\
      \ at 5V; UART signals must be 3.3 V.\n#include <Arduino.h>\n#include \"esp_camera.h\"\n\nbool initCamera(bool\
      \ grayscale) {\n  if (grayscale && !psramFound()) {\n    Serial.println(\"Grayscale example requires enabled\
      \ PSRAM; stopped\");\n    return false;\n  }\n  camera_config_t c = {};\n  c.ledc_channel = LEDC_CHANNEL_0;\n\
      \  c.ledc_timer = LEDC_TIMER_0;\n  c.pin_d0 = 5; c.pin_d1 = 18; c.pin_d2 = 19; c.pin_d3 = 21;\n  c.pin_d4\
      \ = 36; c.pin_d5 = 39; c.pin_d6 = 34; c.pin_d7 = 35;\n  c.pin_xclk = 0; c.pin_pclk = 22; c.pin_vsync = 25;\
      \ c.pin_href = 23;\n  c.pin_sccb_sda = 26; c.pin_sccb_scl = 27;\n  c.pin_pwdn = 32; c.pin_reset = -1;\n  c.xclk_freq_hz\
      \ = 20000000;\n  c.pixel_format = grayscale ? PIXFORMAT_GRAYSCALE : PIXFORMAT_JPEG;\n  c.frame_size = FRAMESIZE_QVGA;\
      \ // 320 x 240; not a promised frame rate.\n  c.jpeg_quality = 12; // Used only for JPEG.\n  c.fb_count =\
      \ 1;\n  c.grab_mode = CAMERA_GRAB_WHEN_EMPTY;\n  c.fb_location = psramFound() ? CAMERA_FB_IN_PSRAM : CAMERA_FB_IN_DRAM;\n\
      \  esp_err_t err = esp_camera_init(&c);\n  if (err != ESP_OK) {\n    Serial.printf(\"Camera init failed: 0x%x;\
      \ stopped\\n\", unsigned(err));\n    return false;\n  }\n  sensor_t *sensor = esp_camera_sensor_get();\n \
      \ if (!sensor || sensor->id.PID != OV2640_PID) {\n    Serial.println(\"This example requires OV2640; stopped\"\
      );\n    esp_camera_deinit();\n    return false;\n  }\n  Serial.printf(\"Camera initialized; PSRAM %s\\n\"\
      , psramFound() ? \"found\" : \"not found\");\n  return true;\n}\n\n#include \"quirc.h\" // Upstream dlbeer/quirc\
      \ v1.2; see exact source-file setup.\n#include <cstring>\nstruct quirc *decoder = nullptr;\nstatic struct\
      \ quirc_code qrCode;\nstatic struct quirc_data qrData; // Avoid putting these large objects on loop's stack.\n\
      bool ready = false;\nuint32_t lastScan = 0;\n\nvoid setup() {\n  Serial.begin(115200);\n  if (!initCamera(true))\
      \ return;\n  decoder = quirc_new();\n  if (!decoder || quirc_resize(decoder, 320, 240) != 0) {\n    Serial.println(\"\
      Quirc allocation failed; no scans will run\");\n    if (decoder) quirc_destroy(decoder);\n    decoder = nullptr;\n\
      \    esp_camera_deinit();\n    return;\n  }\n  Serial.printf(\"Quirc %s; show a non-sensitive printed test\
      \ QR\\n\", quirc_version());\n  ready = true;\n}\nvoid loop() {\n  if (!ready) { delay(100); return; }\n \
      \ if (uint32_t(millis() - lastScan) < 500) { delay(1); return; }\n  lastScan = millis();\n  camera_fb_t *fb\
      \ = esp_camera_fb_get();\n  if (!fb) { Serial.println(\"Frame unavailable; retrying later\"); return; }\n\
      \  int w = 0, h = 0;\n  uint8_t *pixels = quirc_begin(decoder, &w, &h);\n  if (!pixels || fb->format != PIXFORMAT_GRAYSCALE\
      \ ||\n      w != 320 || h != 240 || fb->width != size_t(w) || fb->height != size_t(h) ||\n      fb->len !=\
      \ size_t(w) * size_t(h)) {\n    Serial.println(\"Unexpected frame/buffer layout; scan skipped\");\n    esp_camera_fb_return(fb);\n\
      \    return;\n  }\n  memcpy(pixels, fb->buf, size_t(w) * size_t(h));\n  esp_camera_fb_return(fb); // Do not\
      \ retain the driver's frame during decoding.\n  quirc_end(decoder);\n  int count = quirc_count(decoder);\n\
      \  if (count == 0) Serial.println(\"No QR candidate in this frame\");\n  for (int i = 0; i < count; ++i) {\n\
      \    quirc_extract(decoder, i, &qrCode);\n    quirc_decode_error_t err = quirc_decode(&qrCode, &qrData);\n\
      \    if (err != QUIRC_SUCCESS) {\n      Serial.printf(\"Candidate decode failed: %s\\n\", quirc_strerror(err));\n\
      \      continue;\n    }\n    if (qrData.payload_len < 0 || qrData.payload_len > QUIRC_MAX_PAYLOAD) {\n   \
      \   Serial.println(\"Unexpected payload length; ignored\"); continue;\n    }\n    Serial.printf(\"Decoded\
      \ %d bytes, ECI %lu: \", qrData.payload_len, (unsigned long)qrData.eci);\n    // Print length-bounded bytes,\
      \ not a presumed UTF-8 or zero-terminated string.\n    for (int j = 0; j < qrData.payload_len; ++j) {\n  \
      \    uint8_t b = qrData.payload[j];\n      if (b >= 32 && b <= 126 && b != '\\\\') Serial.write(b);\n    \
      \  else Serial.printf(\"\\\\x%02X\", unsigned(b));\n    }\n    Serial.println(); // No URL opening, relay,\
      \ lock, web UI, SD or MQTT action.\n  }\n}\n"
