levels:
  beginner:
    level: beginner
    overview_html: <p>Read two defined resistor-divider inputs on classic ESP32 ADC1. Log raw counts in Serial
      Monitor; no voltage/current sensor, power or energy measurement is implemented.</p>
    components:
    - Classic ESP32-WROOM-32/32E DevKit with exposed GPIO36 and GPIO34
    - Three 10 kΩ and one 20 kΩ resistors, all 1%
    - Two 100 nF ceramic capacitors, breadboard and short jumper leads
    - USB data cable and computer with Arduino IDE 2.x
    code: "#include <Arduino.h>\n// Classic ESP32-WROOM-32/32E DevKit; Arduino-ESP32 3.3.2 review baseline.\n\
      // A: 3V3 -- 10k -- GPIO36 node -- 10k -- GND.\n// B: 3V3 -- 20k -- GPIO34 node -- 10k -- GND.\n// All\
      \ resistors 1%; each ADC node also has 100 nF to GND.\nconstexpr uint8_t CHANNEL_A = 36, CHANNEL_B =\
      \ 34;\nstruct Reading { float counts; bool nearRail; };\nReading readCounts(uint8_t pin) {\n  uint32_t\
      \ sum = 0;\n  bool rail = false;\n  for (int i = 0; i < 32; ++i) {\n    uint16_t raw = analogRead(pin);\n\
      \    sum += raw;\n    if (raw <= 16 || raw >= 4079) rail = true;\n    delay(2);\n  }\n  return {sum /\
      \ 32.0f, rail};\n}\nvoid setup() {\n  Serial.begin(115200);\n  analogReadResolution(12);\n  analogSetPinAttenuation(CHANNEL_A,\
      \ ADC_11db);\n  analogSetPinAttenuation(CHANNEL_B, ADC_11db);\n  Serial.println(\"Two sequential raw\
      \ ADC channels; NOT an energy meter\");\n}\nvoid loop() {\n  Reading a = readCounts(CHANNEL_A);\n  Reading\
      \ b = readCounts(CHANNEL_B);\n  Serial.printf(\"A_GPIO36_raw_counts=%.1f B_GPIO34_raw_counts=%.1f\\n\"\
      ,\n                a.counts, b.counts);\n  if (a.nearRail || b.nearRail)\n    Serial.println(\"CHECK_WIRING:\
      \ near-rail sample; no derived result\");\n  delay(500); // Pause after acquisition; not an exact 500\
      \ ms sampling period.\n}\n"
    code_filename: esp32-smart-energy-meter.ino
