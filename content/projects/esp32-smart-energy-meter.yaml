  wiring:
    full_size_link: true
    illustration_alt: 'Logical two-divider circuit: 3V3 through 10k/10k to GPIO36, 20k/10k to GPIO34, with
      one 100 nF node capacitor each; not physical pin order or tested hardware'
    summary: 'Two passive dividers use only the USB-powered board 3V3 rail: 10k/10k feeds GPIO36; 20k/10k feeds
      GPIO34. Each node has 100 nF to common GND. No external signal source, sensor, load, relay or display
      is part of the circuit.'
    steps:
    - Disconnect USB before wiring; do not connect external sources or loads. Identify board 3V3, GND, GPIO36
      and GPIO34 from its pin labels.
    - 'A: board 3V3 → 10 kΩ → node A → 10 kΩ → GND; node A → GPIO36.'
    - 'B: board 3V3 → 20 kΩ → node B → 10 kΩ → GND; node B → GPIO34.'
    - Connect one 100 nF capacitor separately from each ADC node to GND. Use common board ground; keep the
      two nodes distinct.
    - Check resistance/continuity while unpowered. Verify the board 3V3 rail is within 3.0–3.45 V before relying
      on the stated voltage bounds; never use VIN/5V as the divider rail.
    - Reconnect USB, upload for the matching classic ESP32 board, then open Serial Monitor at 115200. Do not
      alter powered wiring.
  gpio_map:
  - signal: Channel A node
    esp32_pin: GPIO36
    direction: ADC1 input only
    notes: 10k top and 10k bottom; 100 nF node to GND.
  - signal: Channel B node
    esp32_pin: GPIO34
    direction: ADC1 input only
    notes: 20k top and 10k bottom; 100 nF node to GND.
  - signal: Divider rail / return
    esp32_pin: 3V3 / GND
    direction: Board supply / common return
    notes: Not GPIO output power or VIN/5V. No external rail.
  circuit_explanation: 'Two passive dividers use only the USB-powered board 3V3 rail: 10k/10k feeds GPIO36;
    20k/10k feeds GPIO34. Each node has 100 nF to common GND. No external signal source, sensor, load, relay
    or display is part of the circuit.'
  engineering_explanation: 'Vnode=Vrail×Rbottom/(Rtop+Rbottom). Nominal 3.3 V gives 1.65 V at A and 1.10 V
    at B: calculated circuit values, not observed readings. For a verified 3.0–3.45 V rail and 1% resistors,
    A is bounded about 1.485–1.7423 V; B about 0.9867–1.1654 V, ignoring loading. These are inside the documented
    classic ESP32 11 dB measurement range of approximately 150–3100 mV. Supply voltage, 3.3 V GPIO logic and
    usable ADC range are different concepts; 5 V is not an acceptable GPIO signal. GPIO34/36 are ADC1 input-only
    with no internal pull resistors. This sketch reports uncalibrated 12-bit counts (0–4095), not pin voltage.
    Do not use counts×3.3/4095 as a calibrated voltage conversion. ADC nonlinearity, rail tolerance, loading
    and wiring affect observations. No exact count ratio or accuracy is promised. Averages are sequential,
    not simultaneous waveforms; multiplying these counts does not measure power. Real power requires a defined
    voltage/current transfer function, offset handling and time-aligned acquisition appropriate to the waveform.
    Energy additionally requires integration over elapsed time. None is implemented here.'
  libraries:
  - text: Arduino-ESP32 3.3.2 built-in ADC API
    note: Arduino.h only; no sensor, display or metering library.
  configuration: Select the matching classic ESP32 board and port. Set Serial Monitor to 115200. No credentials,
    calibration coefficients or sensor defaults are required. Keep Wi-Fi disabled in this example; ADC1 selection
    does not make it an energy meter.
  code:
    filename: esp32-smart-energy-meter.ino
    content: "#include <Arduino.h>\n// Classic ESP32-WROOM-32/32E DevKit; Arduino-ESP32 3.3.2 review baseline.\n\
      // A: 3V3 -- 10k -- GPIO36 node -- 10k -- GND.\n// B: 3V3 -- 20k -- GPIO34 node -- 10k -- GND.\n// All\
      \ resistors 1%; each ADC node also has 100 nF to GND.\nconstexpr uint8_t CHANNEL_A = 36, CHANNEL_B =\
      \ 34;\nstruct Reading { float counts; bool nearRail; };\nReading readCounts(uint8_t pin) {\n  uint32_t\
      \ sum = 0;\n  bool rail = false;\n  for (int i = 0; i < 32; ++i) {\n    uint16_t raw = analogRead(pin);\n\
      \    sum += raw;\n    if (raw <= 16 || raw >= 4079) rail = true;\n    delay(2);\n  }\n  return {sum /\
      \ 32.0f, rail};\n}\nvoid setup() {\n  Serial.begin(115200);\n  analogReadResolution(12);\n  analogSetPinAttenuation(CHANNEL_A,\
      \ ADC_11db);\n  analogSetPinAttenuation(CHANNEL_B, ADC_11db);\n  Serial.println(\"Two sequential raw\
      \ ADC channels; NOT an energy meter\");\n}\nvoid loop() {\n  Reading a = readCounts(CHANNEL_A);\n  Reading\
      \ b = readCounts(CHANNEL_B);\n  Serial.printf(\"A_GPIO36_raw_counts=%.1f B_GPIO34_raw_counts=%.1f\\n\"\
      ,\n                a.counts, b.counts);\n  if (a.nearRail || b.nearRail)\n    Serial.println(\"CHECK_WIRING:\
      \ near-rail sample; no derived result\");\n  delay(500); // Pause after acquisition; not an exact 500\
      \ ms sampling period.\n}\n"
  code_explanation: Each channel averages 32 raw samples, then prints counts. A and B are acquired at different
    times. A near-rail sample produces CHECK_WIRING, but a plausible count cannot prove correct wiring or connection.
    The delay is a reporting pause after acquisition, not a precise sample period.
  expected_output: Serial prints two labelled raw-count averages and may print CHECK_WIRING. With the stated
    network A should generally read higher than B; no recorded counts, voltage measurement, watts or watt-hours
    are supplied. If not, stop and inspect the unpowered circuit. This is expected behavior, not hardware test
    evidence.
  common_mistakes:
  - text: Using board VIN/5V instead of 3V3.
  - text: Joining the two ADC nodes or swapping top/bottom resistors.
  - text: Calling counts a measured current, voltage, power or energy.
  troubleshooting:
  - problem: Zero or near-rail readings
    fix: Disconnect USB. Check divider orientation, common GND, GPIO labels and rail continuity. Never fix
      saturation by forcing a plausible software value.
  - problem: A is not generally higher than B
    fix: Check the 20k top resistor belongs to channel B, both 10k bottom resistors reach GND and nodes are
      not joined. Actual counts are not calibration data.
  - problem: Plausible but unchanged reading
    fix: Fixed dividers intentionally give near-steady inputs. A disconnected/floating pin can also look plausible;
      use unpowered continuity checks and appropriate instruments, not a count alone.
  testing_checklist:
  - Documentation/API and divider arithmetic reviewed only; compilation and hardware operation unperformed.
  - Verify actual rail, resistor values and connections independently before interpreting readings.
  - Compare Copy text with the full sketch; record actual observations separately from this expected-output
    description.
  engineer_tips:
  - Keep channel labels and resistor values on your wiring notes.
  - Change wiring only while USB is unplugged.
  upgrade_ideas:
  - 'Deferred: OLED output requires a separate complete display initialization/rendering sketch; no OLED is
    wired or driven here.'
  - A future metering project needs exact documented transducers, signal conditioning, sampling design and
    independent reference checks; arbitrary modules are not drop-in additions.
