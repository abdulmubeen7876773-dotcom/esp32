meta_description: Diagnose classic ESP32 Wi-Fi by separating radio association, IP allocation and application
  failures. Use a bounded Serial diagnostic sketch before debugging MQTT or HTTP.
lead: Diagnose classic ESP32 Wi-Fi by separating radio association, IP allocation and application failures.
  Use a bounded Serial diagnostic sketch before debugging MQTT or HTTP.
