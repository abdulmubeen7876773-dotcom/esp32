faqs:
  - question: What does a BME280 measure?
    answer: The BME280 measures temperature, relative humidity, and barometric pressure. Altitude is estimated from pressure and a sea-level pressure reference; the sensor does not measure altitude directly.
  - question: What I2C address should I use for an ESP32 BME280?
    answer: Common BME280 breakout configurations use 0x76 or 0x77. The address depends on the sensor board's SDO pin or address-jumper configuration, so check its documentation or scan the I2C bus instead of assuming one address for every board.
  - question: Which ESP32 pins connect to BME280 SDA and SCL?
    answer: For a common original ESP32 DevKit, this example uses GPIO21 for SDA and GPIO22 for SCL. Other ESP32 boards may have different defaults; choose available pins for your board and set them in Wire.begin().
  - question: Is a BME280 better than a DHT22?
    answer: They both measure temperature and relative humidity. The BME280 also measures barometric pressure, which supports pressure trends and approximate pressure-based altitude. Choose based on the readings and interface your project needs.
  - question: Why does my BME280 show pressure but not humidity?
    answer: Check that the module actually contains a BME280 and that the library initialized the expected device. Some visually similar pressure-sensor modules, such as BMP280 modules, do not provide humidity readings.
  - question: Does the example altitude match GPS altitude?
    answer: Not necessarily. The library estimates altitude from pressure and the sea-level pressure value supplied to the sketch. Local weather changes, elevation, and the reference pressure affect the result, so treat it as approximate.
