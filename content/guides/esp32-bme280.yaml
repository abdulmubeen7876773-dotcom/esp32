body_html: |
  <h2 id="what-bme280-measures">What the BME280 measures</h2>
  <p>The BME280 is a digital environmental sensor that reports three measurements:</p>
  <ul>
    <li><strong>Temperature:</strong> ambient temperature in degrees Celsius or Fahrenheit after conversion in your code.</li>
    <li><strong>Relative humidity:</strong> how much water vapor is in the air relative to saturation, reported as a percentage.</li>
    <li><strong>Barometric pressure:</strong> air pressure, commonly displayed in hectopascals (hPa).</li>
  </ul>
  <p>Altitude is not a fourth direct measurement. A library can estimate it from pressure and a sea-level pressure reference. The estimate shifts with weather and with the reference value, so it is useful for a rough elevation or trend rather than a GPS replacement. The <a href="/components/bme280.html">BME280 component reference</a> covers the module as a component; this page focuses on connecting it to an ESP32 and using its readings.</p>

  <h3 id="bme280-vs-dht22">BME280 vs DHT22</h3>
  <p>Both can report temperature and relative humidity. The BME280 adds barometric pressure, which enables pressure tracking and approximate pressure-based altitude. A DHT22 is a reasonable fit when temperature and humidity are all you need; choose a BME280 when pressure is useful. See the <a href="/components/dht22.html">DHT22 reference</a> for its component details.</p>

  <h2 id="interfaces">I2C or SPI?</h2>
  <p>The BME280 chip supports both <strong>I2C</strong> and <strong>SPI</strong>. I2C is the simplest starting point for an ESP32: connect power and ground plus SDA and SCL, and the same two signal wires can be shared with other I2C devices when their addresses do not conflict. SPI uses clock, data-in, data-out, and chip-select signals; it can be useful when a project already uses SPI or needs that interface. This guide uses I2C. For a bus introduction, see <a href="/guides/i2c-communication.html">I2C communication with ESP32</a>.</p>

  <h2 id="pins">BME280 pins and wiring</h2>
  <p>Breakout boards do not all use identical labels or power circuitry. The BME280 integrated circuit itself has a 1.71–3.6 V supply range, but the voltage accepted by a breakout's VIN/VCC pin depends on that board's design. Check the documentation for your exact module, and make sure its I2C logic levels are compatible with the ESP32. Do not assume an unspecified breakout is 5 V tolerant.</p>
  <div class="pin-table-wrap">
    <table class="pin-table pin-table-3">
      <thead><tr><th>BME280 breakout pin</th><th>Connect for I2C</th><th>Notes</th></tr></thead>
      <tbody>
        <tr><td>VIN or VCC</td><td>ESP32 3V3 when the breakout documentation permits it</td><td>Use the module's documented supply range. A bare sensor and a breakout board can have different electrical requirements.</td></tr>
        <tr><td>GND</td><td>ESP32 GND</td><td>Both devices need a common ground.</td></tr>
        <tr><td>SDA or SDI</td><td>ESP32 SDA</td><td>Some breakouts label the I2C data pin SDI; connect SDA/SDI to ESP32 SDA. This example uses GPIO21 on a common original ESP32 DevKit.</td></tr>
        <tr><td>SCL or SCK</td><td>ESP32 SCL</td><td>Some breakouts label the I2C clock pin SCK; connect SCL/SCK to ESP32 SCL. This example uses GPIO22 on a common original ESP32 DevKit.</td></tr>
        <tr><td>CS or CSB</td><td>Not used for this I2C example</td><td>Chip-select is used for SPI. Board instructions may specify how to hold/configure it for I2C.</td></tr>
        <tr><td>SDO</td><td>Not used as data for this I2C example</td><td>On many designs this pin selects the I2C address; see the board documentation. In SPI mode it is data-out.</td></tr>
        
      </tbody>
    </table>
  </div>
  <p>In I2C mode, some boards label the shared pins by their SPI names, such as SCK for SCL and SDI for SDA. Use the markings and pinout for your exact breakout. The <a href="/assets/visuals/components/illustrations/bme280-pinout.svg">BME280 pinout illustration</a> is a visual reference; the board manufacturer's documentation remains authoritative for electrical details.</p>

  <h2 id="esp32-i2c-wiring">ESP32 BME280 I2C wiring example</h2>
  <p>For the common original ESP32 DevKit pin mapping used by the sketch below, wire the BME280 breakout as follows. If you have a different ESP32 family board, confirm its usable I2C pins and change the two constants in the code.</p>
  <figure style="margin:1rem auto;max-width:900px"><img src="/assets/visuals/components/wiring/bme280-wiring.svg" alt="ESP32 DevKit connected to a BME280 breakout using I2C: 3.3 V-compatible power, ground, SDA on GPIO21, and SCL on GPIO22" width="1280" height="760" loading="lazy" decoding="async" style="display:block;width:100%;height:auto"><figcaption>Example I2C wiring for a common original ESP32 DevKit. Confirm the power input and signal-level compatibility for your breakout.</figcaption></figure>
  <ol>
    <li>Disconnect USB power while wiring.</li>
    <li>Connect breakout GND to ESP32 GND.</li>
    <li>Connect SDA to GPIO21 and SCL to GPIO22 for the board mapping used in this example.</li>
    <li>Connect VIN/VCC to a supply allowed by the breakout documentation. The module must also present ESP32-safe I2C logic levels.</li>
    <li>Reconnect USB only after checking the wiring and power requirements.</li>
  </ol>
  <p>For ESP32 boards where default I2C pins differ, the Arduino-ESP32 <code>Wire.begin(sda, scl)</code> call in this example sets the pins explicitly. Choose appropriate pins for your exact board.</p>

  <h2 id="arduino-ide-setup">Arduino IDE setup and library</h2>
  <ol>
    <li>Install the ESP32 board support package and confirm you can upload a basic sketch. Follow the <a href="/guides/esp32-arduino-ide.html">ESP32 Arduino IDE setup guide</a> if needed.</li>
    <li>In Arduino IDE, open <strong>Sketch → Include Library → Manage Libraries</strong>.</li>
    <li>Search for and install <strong>Adafruit BME280 Library</strong>. Accept installation of its required dependencies, including Adafruit Unified Sensor and Adafruit BusIO if the Library Manager prompts you.</li>
    <li>Select the correct ESP32 board and port, upload the sketch below, then open Serial Monitor at <strong>115200 baud</strong>.</li>
  </ol>
  <p>The sketch creates an Adafruit BME280 object, starts I2C on the selected pins, and calls <code>begin()</code> with each common address in turn. If initialization succeeds, it reads the four displayed values once per second.</p>

  <h2 id="complete-code">Complete ESP32 + BME280 code</h2>
  <pre><code>
    #include &lt;Wire.h&gt;
    #include &lt;Adafruit_BME280.h&gt;
    
    // Example pins for a common original ESP32 DevKit. Adjust for your board.
    const int I2C_SDA = 21;
    const int I2C_SCL = 22;
    
    // Replace with a suitable local sea-level pressure reference for better altitude estimates.
    const float SEA_LEVEL_PRESSURE_HPA = 1013.25F;
    
    Adafruit_BME280 bme;
    
    void setup() {
      Serial.begin(115200);
      delay(100);
    
      Wire.begin(I2C_SDA, I2C_SCL);
    
      bool sensorFound = bme.begin(0x76, &amp;Wire);
      if (!sensorFound) {
        sensorFound = bme.begin(0x77, &amp;Wire);
      }
    
      if (!sensorFound) {
        Serial.println("BME280 not found. Check wiring and I2C address.");
        while (true) {
          delay(1000);
        }
      }
    
      Serial.println("BME280 ready");
    }
    
    void loop() {
      const float temperatureC = bme.readTemperature();
      const float humidityPercent = bme.readHumidity();
      const float pressureHpa = bme.readPressure() / 100.0F;
      const float altitudeMeters = bme.readAltitude(SEA_LEVEL_PRESSURE_HPA);
    
      Serial.print("Temperature: ");
      Serial.print(temperatureC, 2);
      Serial.println(" °C");
    
      Serial.print("Humidity: ");
      Serial.print(humidityPercent, 2);
      Serial.println(" %");
    
      Serial.print("Pressure: ");
      Serial.print(pressureHpa, 2);
      Serial.println(" hPa");
    
      Serial.print("Approx. altitude: ");
      Serial.print(altitudeMeters, 1);
      Serial.println(" m");
      Serial.println();
    
      delay(1000);
    }</code></pre>

  <h2 id="code-explained">What the important code does</h2>
  <ul>
    <li><strong>Pin constants and <code>Wire.begin()</code>:</strong> select SDA and SCL for the board mapping in this example. If using a different ESP32, set pins appropriate to that board.</li>
    <li><strong>Two <code>begin()</code> attempts:</strong> the sketch checks 0x76, then 0x77. It stops with a clear serial message if neither initializes.</li>
    <li><strong>Temperature and humidity:</strong> <code>readTemperature()</code> returns degrees Celsius and <code>readHumidity()</code> returns relative humidity percent.</li>
    <li><strong>Pressure conversion:</strong> <code>readPressure()</code> returns pascals; dividing by 100 converts the value to hPa.</li>
    <li><strong>Altitude estimate:</strong> <code>readAltitude()</code> uses the pressure reading and the supplied sea-level reference. The example's 1013.25 hPa is a standard reference starting point, not a live local weather reading.</li>
    <li><strong>Serial output:</strong> Serial Monitor at 115200 baud displays each value. The one-second delay makes the example easy to read; use a deliberate sampling interval in a larger project.</li>
  </ul>

  <h2 id="understanding-readings">Reading and interpreting the output</h2>
  <p>Temperature appears in °C, humidity in percent, pressure in hPa, and altitude in meters. Pressure is the sensor's local barometric pressure. Weather services often report pressure adjusted to sea level, so those numbers may differ. Change <code>SEA_LEVEL_PRESSURE_HPA</code> to a suitable local sea-level pressure reference when you want the altitude estimate to better match a known elevation.</p>
  <p>For steadier room measurements, let the sensor settle and keep it away from heat produced by the ESP32 regulator, USB interface, sunlight, or your breath. Compare trends under similar conditions rather than expecting two uncalibrated devices in different locations to match exactly.</p>

  <h2 id="i2c-address">BME280 I2C address</h2>
  <p>Two common BME280 I2C addresses are <code>0x76</code> and <code>0x77</code>. The address is selected by the sensor's SDO pin or a breakout-specific address pad/jumper. The exact jumper behavior depends on the board, so consult its documentation. This sketch tries both addresses, but it cannot fix a wiring, power, or device-identification problem.</p>
  <p>If neither address responds, run an I2C scanner with the same SDA and SCL pins, check the board's address setting, and verify that the module is actually a BME280. A BMP280-shaped breakout may look similar but does not include humidity sensing.</p>

  <h2 id="troubleshooting">Troubleshooting</h2>
  <h3 id="not-detected">Sensor not detected</h3>
  <ul>
    <li>Check that SDA and SCL are not swapped, the ground is shared, and each jumper is seated in the intended breadboard row.</li>
    <li>Confirm the selected I2C pins match the board and the <code>Wire.begin()</code> values.</li>
    <li>Verify the breakout's supply and logic-level requirements against its documentation; do not infer them from the BME280 chip alone.</li>
    <li>Scan the bus and check both 0x76 and 0x77. Confirm any address jumper or SDO wiring for that board.</li>
    <li>Check Arduino IDE's selected ESP32 board, installed Adafruit library and dependencies, and compiler output for missing-library errors.</li>
  </ul>
  <h3 id="incorrect-readings">Readings seem incorrect</h3>
  <ul>
    <li>Confirm the board is a BME280, rather than a similar pressure-only BMP280 module.</li>
    <li>Check that the code prints pressure in hPa after dividing the library's pascal value by 100.</li>
    <li>Remember that the altitude estimate depends on the supplied sea-level pressure. The reference affects altitude, not the raw pressure reading.</li>
    <li>Move the sensor away from warm ESP32 components, direct sunlight, drafts, and breath; allow readings to stabilize.</li>
    <li>Review the breakout's pin labels and wiring diagram. Shared SPI/I2C labels can make SDA, SCL, SDI, and SCK easy to confuse.</li>
  </ul>

  <h2 id="next-steps">Practical next steps</h2>
  <ul>
    <li><strong>OLED weather display:</strong> show temperature, humidity, and pressure on an I2C display. Start with <a href="/guides/connect-oled-esp32.html">connecting an OLED to ESP32</a>; confirm each device's address before sharing the bus.</li>
    <li><strong>Weather station:</strong> build on the <a href="/projects/esp32-iot-weather-station.html">ESP32 IoT weather station project</a> after the sensor works over Serial Monitor.</li>
    <li><strong>Data logging:</strong> add a timed record of readings to a file or database, and include timestamps so you can compare trends later.</li>
    <li><strong>MQTT and IoT:</strong> adapt the sensor publishing pattern in the <a href="/projects/esp32-mqtt-sensor-dashboard.html">ESP32 MQTT sensor dashboard project</a> to send BME280 readings to a broker.</li>
  </ul>


