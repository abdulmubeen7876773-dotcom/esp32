    "component_spotlight_lead": "The SSD1306 OLED is the beginner-friendly display that turns a hidden microcontroller program into something you can read at a glance.",
    "concept": {
      "title": "The OLED Is a Tiny Output Device",
      "image": "/assets/visuals/guides/concepts/oled-display-esp32-concept.svg",
      "illustration_alt": "ESP32 connected to an SSD1306 OLED over I2C using GPIO21 SDA and GPIO22 SCL, showing ADC value on screen",
      "body": "An OLED display is an output device. It does not decide what to show. Your ESP32 code decides what text and numbers to draw.\n\nMost small SSD1306 OLED modules use I2C. That means the ESP32 does not need many wires. It sends commands and display data over two signal lines: SDA and SCL.\n\nThe important beginner idea is simple: Serial Monitor shows data on your computer, while an OLED shows data on the project itself."
    },
    "engineering_explanation": "Classic ESP32-WROOM DevKit; Arduino-ESP32 3.3.2 review baseline (not latest). Selected display: a documented 3.3 V-compatible 128×64 I2C SSD1306 module with bus pull-ups to 3.3 V, four labelled VCC/GND/SDA/SCL pins and suitable reset circuitry. SH1106 and SPI displays need another driver/wiring. Pins are SDA21/SCL22; set OLED_ADDRESS from the module documentation/scanner. An ACK checks address response, not controller identity. Install Adafruit SSD1306 2.5.13, Adafruit GFX 1.12.1 and Adafruit BusIO 1.17.0. Documentation reviewed; no compilation or hardware testing performed.\n\nThe SSD1306 OLED module contains a display panel and a controller chip. The controller remembers what each pixel should do, and the OLED panel lights those pixels.\n\nThe ESP32 communicates with the controller over I2C in this tutorial. SDA carries the data bits. SCL is the clock signal that keeps both sides moving together. This site's examples use GPIO21 for SDA and GPIO22 for SCL. ESP32 I2C pins can be changed, but the wiring and Wire.begin(SDA, SCL) call must agree.\n\nThe OLED also has an I2C address, usually 0x3C and sometimes 0x3D. The address tells the ESP32 which device on the bus should listen. If the screen stays blank even though power and wiring look correct, run an I2C scanner before guessing.\n\nThe Adafruit SSD1306 library hides most of the low-level commands. Your sketch draws into a screen buffer in memory using functions such as setCursor(), print(), and println(). When you call display.display(), the library sends the buffer to the OLED controller and the visible screen updates.\n\nThis is why clearDisplay() matters. The screen buffer keeps old pixels until you clear or overwrite them. A clean refresh usually means: clear the buffer, draw the new text, then send it to the screen.\n\nThe pinned SSD1306 begin() result checks buffer/init success, not display detection. The separate I2C ACK check still cannot prove model identity or visible display operation. Confirm the actual screen output.\n\nReview baseline: classic ESP32-WROOM DevKit and Arduino-ESP32 3.3.2, not a latest-release claim. GPIO34 is input-only ADC1 without internal pull resistors. This 3V3-powered potentiometer can approach the supply rail, but the classic ADC measurement range at 11 dB is approximately 150–3100 mV and can saturate near either end. Attenuation is not overvoltage protection: never apply 5 V or negative voltage. Raw full scale does not prove 3.3 V or a particular shaft position. Documentation reviewed; compilation and physical hardware testing have not been performed. analogReadMilliVolts() takes another conversion, so a moving dial can give a raw/millivolt pair from slightly different moments. It is a calibrated estimate, not a precision voltmeter.",
    "real_life_analogy": "Think of I2C like a classroom with one teacher and several students. The teacher is the ESP32. The students are devices such as displays and sensors. Everyone hears the same two wires, but the teacher says an address first. Only the student with that address answers.\n\nThe OLED buffer is like writing on a small whiteboard before showing it to the class. You prepare the message, then hold it up. display.display() is the moment the class sees the whiteboard.\n\nThe Serial Monitor is like a notebook on your desk. Useful while learning, but the OLED is like a label on the product itself. Anyone can read it without opening your computer.",
