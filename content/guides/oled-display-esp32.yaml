    "code": {
      "filename": "oled_display_values.ino",
      "notes": "Classic ESP32-WROOM DevKit; Arduino-ESP32 3.3.2 review baseline (not latest). Selected display: a documented 3.3 V-compatible 128×64 I2C SSD1306 module with bus pull-ups to 3.3 V, four labelled VCC/GND/SDA/SCL pins and suitable reset circuitry. SH1106 and SPI displays need another driver/wiring. Pins are SDA21/SCL22; set OLED_ADDRESS from the module documentation/scanner. An ACK checks address response, not controller identity. Install Adafruit SSD1306 2.5.13, Adafruit GFX 1.12.1 and Adafruit BusIO 1.17.0. Documentation reviewed; no compilation or hardware testing performed.\n\nRaw counts and calibrated millivolts are separate samples, not measured shaft position. ADC range can clip before a 3.3 V rail.",
      "content": "#include <Arduino.h>\n#include <Wire.h>\n#include <Adafruit_GFX.h>\n#include <Adafruit_SSD1306.h>\n\nconst int SCREEN_WIDTH = 128;\nconst int SCREEN_HEIGHT = 64;\nconst int OLED_RESET = -1;\nconst int POT_PIN = 34;\n\nconst int I2C_SDA = 21;\nconst int I2C_SCL = 22;\nconst int OLED_ADDRESS = 0x3C;\n\nAdafruit_SSD1306 display(SCREEN_WIDTH, SCREEN_HEIGHT, &Wire, OLED_RESET);\n\nbool oledResponds() {\n  Wire.beginTransmission(OLED_ADDRESS);\n  return Wire.endTransmission() == 0; // ACK only, not controller identification.\n}\n\nvoid setup() {\n  Serial.begin(115200);\n\n  Wire.begin(I2C_SDA, I2C_SCL);\n  analogReadResolution(12);\n  analogSetPinAttenuation(POT_PIN, ADC_11db);\n\n  Wire.setTimeOut(50); // Per bus operation, not a whole-sketch deadline.\n  if (!oledResponds()) {\n    Serial.println(\"No I2C ACK at OLED_ADDRESS; check power, bus and address, then reset\");\n    while (true) delay(1000);\n  }\n  if (!display.begin(SSD1306_SWITCHCAPVCC, OLED_ADDRESS, true, false)) {\n    Serial.println(\"SSD1306 buffer/init failed; this is not a presence test\");\n    while (true) delay(1000);\n  }\n\n  display.clearDisplay();\n  display.setTextColor(SSD1306_WHITE);\n  display.setTextSize(1);\n  display.setCursor(0, 0);\n  display.println(\"ESP32 Engine\");\n  display.println(\"OLED ready\");\n  display.display();\n\n  delay(1500);\n}\n\nvoid loop() {\n  int rawValue = analogRead(POT_PIN);\n  uint32_t millivolts = analogReadMilliVolts(POT_PIN); // A separate conversion.\n\n  Serial.print(\"ADC: \");\n  Serial.print(rawValue);\n  Serial.print(\" | mV estimate: \");\n  Serial.print(millivolts);\n  Serial.println(\" mV\");\n\n  display.clearDisplay();\n\n  display.setTextSize(1);\n  display.setCursor(0, 0);\n  display.println(\"Mission 09 OLED\");\n\n  display.setCursor(0, 18);\n  display.print(\"ADC: \");\n  display.println(rawValue);\n\n  display.setCursor(0, 34);\n  display.print(\"mV est: \");\n  display.print(millivolts);\n  display.println(\" mV\");\n\n  display.setCursor(0, 52);\n  display.println(\"GPIO34 -> screen\");\n\n  display.display();\n  delay(250);\n}\n"
    },
    "code_explanation": [
