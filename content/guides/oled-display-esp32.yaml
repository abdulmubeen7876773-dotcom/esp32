    "expected_output": "After the intended startup message, the display shows Mission 09 OLED, ADC: <raw>, mV est: <estimate> mV and GPIO34 -> screen. Serial prints the same two quantities. Placeholders describe output format, not supplied measurements. Raw counts are not a dial percentage; separate conversions, noise and endpoint clipping can affect comparisons.",
