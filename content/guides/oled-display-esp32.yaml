    "story": "So far, your ESP32 has mostly talked through Serial Monitor. That is perfect while learning, but real embedded products cannot depend on a laptop window.\n\nThis mission uses an SSD1306 OLED module with the I2C interface. It is the four-pin style with VCC, GND, SDA, and SCL, not an SPI OLED with extra signal pins.\n\nA thermostat needs to show the temperature. A weather station needs to show readings. A robot might show battery level or mode. Mission 09 gives your ESP32 a small local display so your project can communicate directly with the person using it.",
