meta_description: Install CircuitPython 9.2.8 on the Adafruit Feather ESP32-S3 4 MB Flash / 2 MB PSRAM.
  Use its UF2 bootloader, CIRCUITPY drive and Serial-only first program.
lead: Install CircuitPython 9.2.8 on the Adafruit Feather ESP32-S3 4 MB Flash / 2 MB PSRAM. Use its UF2
  bootloader, CIRCUITPY drive and Serial-only first program.
