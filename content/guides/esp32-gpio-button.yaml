lead: 'Connect a push button between a suitable ESP32 GPIO and GND, then use INPUT_PULLUP to get a stable released state. This guide explains the wiring, HIGH/LOW logic, a complete debounce sketch, and the board-specific pin details to check.'
intro:
  story: 'A push button is one of the simplest ways to let a project listen to a person. The small trick is giving the GPIO a known resting state, then translating the electrical HIGH and LOW into the everyday meanings released and pressed.'
  eli12: 'A GPIO input is like a tiny listener that can report HIGH or LOW. A button changes the signal, and a pull-up resistor makes sure the signal does not wander when nobody is pressing it.'
  safety:
    - text: Disconnect USB power before moving button wires, and check your exact ESP32 board pinout before choosing a GPIO.
    - text: This example connects the button only between a GPIO and GND; do not wire a button so it shorts 3.3 V directly to GND.
