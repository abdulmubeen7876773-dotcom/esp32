conclusion: 'Start with a button between a suitable GPIO and GND, enable INPUT_PULLUP, and interpret LOW as pressed. The millis()-based debounce example turns noisy mechanical transitions into one stable state change. Once it works in Serial Monitor, continue to the pull-up, floating-pin, debouncing, and button-controlled LED lessons.'
faqs:
  - question: Why does INPUT_PULLUP read HIGH when the button is released?
    answer: The internal pull-up weakly connects the input to the ESP32 logic supply, so the open button rests at HIGH. Pressing the button connects the input to GND, making it LOW.
  - question: Do I need an external resistor with INPUT_PULLUP?
    answer: For this simple button-to-GND circuit, the internal pull-up provides the bias resistor, so a separate pull-up is usually unnecessary. Some GPIOs or board variants may not provide the requested internal pull-up; check the exact board documentation.
  - question: Which ESP32 GPIO is safe for a button?
    answer: GPIO27 is used here as an example on a common original ESP32 DevKit. GPIO availability and boot-strapping behavior vary across ESP32 families and boards, so verify the exact pinout before choosing a pin.
  - question: Why does one press print several times?
    answer: Mechanical contacts can rapidly switch between open and closed for a short time when pressed or released. Debouncing waits for the reading to stay stable before reporting a state change.
  - question: Why is my button reading random values?
    answer: The GPIO may be floating because no pull-up or pull-down sets its idle state. Enable INPUT_PULLUP with the button connected to GND, or use a correctly wired external bias resistor.
