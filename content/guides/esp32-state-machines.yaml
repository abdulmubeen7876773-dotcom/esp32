setup:
  items:
  - label: Hardware
    value: Classic ESP32-WROOM DevKit, USB data cable and computer. No external sensor or output circuit for this
      exercise.
  - label: Software baseline
    value: Arduino IDE 2 and Arduino-ESP32 3.3.2 for the stated classic ESP32 examples. This is an API review baseline,
      not a latest-version claim.
  - label: Before this lesson
    value: Complete the first Serial-only upload. For the logic lessons, read the variables, decisions, loops and
      functions references first.
  - label: Your goal
    value: Trace IDLE, WAITING and DONE, including start, report, cancel and elapsed-time transitions.
  - label: Verification limits
