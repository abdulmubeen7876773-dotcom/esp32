headline: 'ESP32 PWM: Complete Guide to PWM, Pins, Frequency & Duty Cycle'
meta_description: 'Learn ESP32 PWM with Arduino IDE: PWM pins, channels, frequency, duty cycle, resolution, LED brightness control, code examples, and troubleshooting.'
lead: ESP32 PWM lets a digital GPIO create smooth-looking LED brightness, motor-driver speed commands, buzzer tones, and other adjustable outputs. This guide explains PWM from first principles, then shows the current Arduino IDE pattern for changing duty cycle safely.
intro:
  story: 'A normal digital output is simple: ON or OFF. PWM is what you use when a project needs something that feels adjustable, such as dim LED light, RGB color mixing, or a speed command sent to a motor driver.'
  eli12: 'PWM means the ESP32 switches a pin ON and OFF very quickly. More ON time looks brighter. Less ON time looks dimmer. The pin is still digital, but the average effect becomes useful.'
  safety:
  - text: Use a current-limiting resistor with LEDs, even when PWM makes the LED look dim.
  - text: Do not power motors, pumps, relays, or large LED loads directly from an ESP32 GPIO pin.
  - text: ESP32 GPIO is 3.3 V logic. Choose parts and driver modules that accept 3.3 V control signals.
