headline: 'Basic ESP32 Web Server: A Local Access-Point Example'
meta_description: Serve a page and an uptime route from a classic ESP32 access point. Connect directly
  to the board, use its printed HTTP address and learn the limits of this local demo.
lead: Serve a page and an uptime route from a classic ESP32 access point. Connect directly to the board,
  use its printed HTTP address and learn the limits of this local demo.
