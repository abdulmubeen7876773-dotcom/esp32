headline: Install Arduino IDE for ESP32 and Upload Your First Sketch
meta_description: Set up Arduino IDE 2 and the official ESP32 board package. Choose board and port, upload
  a Serial test, and solve common Windows USB and upload errors.
lead: Install Arduino IDE 2, add the official esp32 board package, choose your board and port, then upload
  a Serial-only sketch. This first test needs no sensor, external wiring or onboard LED.
