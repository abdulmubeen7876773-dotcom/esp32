conclusion: Keep the board family, installed core version, selected port and working first sketch noted for
  future projects. Add one documented circuit at a time and repeat the simple Serial test when debugging.
faqs:
- question: Do I need an onboard LED for the first upload?
  answer: No. This sketch prints a repeating Serial message and assumes no LED pin. Add a documented external
    LED circuit afterward.
- question: Which core version does the site use?
  answer: Examples target Arduino-ESP32 3.x; 3.3.2 is the API review baseline, not a latest-version claim.
    Record your installed stable package version.
- question: Should I press BOOT if Windows shows no COM port?
  answer: First check the cable and actual bridge driver. BOOT selects download mode on a classic board; it
    does not install a USB driver.
