    "internal_resistor_explanation": "Arduino ESP32 supports INPUT_PULLUP and INPUT_PULLDOWN on GPIOs that provide those internal pull resistors. These modes are a convenient way to give an input a default state without adding a separate resistor.\n\nFor the original classic ESP32, GPIO34-GPIO39 are input-only and do not provide integrated pull-up or pull-down resistors. If you need a defined default state on one of those pins, use an external pull-up or pull-down resistor. Do not assume every ESP32 family member or board has identical GPIO behavior; check the board and chip documentation when choosing pins.",
