    "component_spotlight_lead": "This mission focuses on the ESP32 DevKit GPIO input itself.",
    "concept": {
      "title": "What Is a Floating ESP32 GPIO?",
      "illustration_alt": "ESP32 GPIO27 input connected sometimes to 3.3 V for HIGH, sometimes to GND for LOW, and sometimes left floating",
      "body": "A digital input is a GPIO pin that the ESP32 reads instead of controls. In code, pinMode(pin, INPUT) tells the ESP32 to listen to the pin without enabling an internal pull-up or pull-down resistor.\n\nThat input is high impedance, so it draws very little current. If nothing externally drives the pin to a valid logic level, the voltage is undefined. The pin is floating.\n\nESP32 uses 3.3 V logic, but digitalRead() does not measure the exact voltage. LOW means the pin voltage is below the logic LOW threshold. HIGH means the pin voltage is above the logic HIGH threshold. A floating pin can wander between those regions, so digitalRead() may alternate between HIGH and LOW.\n\nNoise, capacitive coupling, a long jumper wire, nearby electronics, or your hand can influence a floating GPIO. The important beginner trap is this: a pin that is not connected to HIGH or LOW is not automatically LOW. It is unknown until a circuit gives it a defined default state."
    },
    "engineering_explanation": "Inside the ESP32, each GPIO input is connected to a tiny sensing circuit. That circuit has very high impedance, which means it does not draw much current from the outside world. High impedance is useful because sensors and buttons do not have to supply much current.\n\nBut high impedance also means the input is easy to influence when it is undriven. A nearby jumper wire, your finger, USB noise, Wi-Fi activity, static charge, or capacitive coupling from nearby electronics can move the pin voltage enough to cross a logic threshold. The ESP32 is not confused; it is reporting HIGH or LOW from a voltage that has not been forced to a stable value.\n\nA stable digital input needs a defined path to either 3.3 V or GND. That path can come from a switch, a sensor output, INPUT_PULLUP, INPUT_PULLDOWN on a supported GPIO, an external pull-up, or an external pull-down. Mission 03 explains the problem and demonstrates the unstable reading. Mission 04, ESP32 pull-up and pull-down resistors, teaches the wiring patterns that create the reliable default state.",
    "real_life_analogy": "Think of a digital input like a door sensor in a quiet hallway. If the door is fully closed, the answer is clear. If the door is fully open, the answer is clear. But if the sensor wire is not connected to the door at all, the alarm system is just listening to a dangling wire. It may report open, closed, open, closed because the wire is picking up noise from the room.\n\nA pull-up or pull-down resistor is like a gentle spring that keeps the door sensor in one default position until a real action moves it.",
    "engineer_tip": "A random input is usually not random software. It is usually an input pin without a defined voltage. Before changing code, ask what physical connection forces the pin HIGH or LOW.",
    "remember_forever": "A digital input must have a decision.\n\nHIGH means the pin voltage is high enough to count as logic 1.\n\nLOW means the pin voltage is low enough to count as logic 0.\n\ndigitalRead() reports the logic state; it does not measure exact voltage.\n\nFloating means nobody is making the decision, so noise can decide for you.",
