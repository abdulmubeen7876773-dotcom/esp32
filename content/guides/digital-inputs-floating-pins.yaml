      "body": "INPUT is high impedance: the pin draws very little current. Without a driven signal or pull resistor, leakage and charge on the wire can move its voltage. Nearby electric fields can couple into a loose lead, which is why moving your hand may change the reading.\n\nUnconnected does not mean grounded. A floating pin might read HIGH, LOW, alternate, or remain at one value during this experiment. There is no required random pattern and no guaranteed LOW. digitalRead() returns a logic state, not an exact voltage measurement."
