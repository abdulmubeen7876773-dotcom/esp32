headline: 'ESP32 Deep Sleep: Timer, Button Wake and Retained State'
meta_description: Wake a classic ESP32 from a ten-second timer or GPIO33 button. Understand restart behavior,
  RTC state and why a powered DevKit is not a chip-current measurement.
lead: Wake a classic ESP32 from a ten-second timer or GPIO33 button. Understand restart behavior, RTC
  state and why a powered DevKit is not a chip-current measurement.
