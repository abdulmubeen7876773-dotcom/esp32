meta_description: Learn what ESP32 is, how chips, modules and development boards differ, and how to start with
  a classic ESP32-WROOM board. Follow the five-step beginner route.
lead: ESP32 is a family of programmable microcontroller chips from Espressif. A development board adds the
  power and USB circuitry needed to connect one to your computer. Start with a classic ESP32-WROOM DevKit,
  upload a simple program, then add one circuit at a time.
reading_time: Beginner introduction
