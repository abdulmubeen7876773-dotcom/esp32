intro: {}
setup:
  items:
  - label: Example board
    value: Classic ESP32-WROOM-32/32E DevKit with a USB-to-UART bridge. ESP32-DevKitC V4 is the pinout reference;
      clone layouts can differ.
  - label: Software route
    value: Arduino IDE 2 and esp32 by Espressif Systems. Arduino-ESP32 3.3.2 is this site’s API review baseline,
      not a latest-release claim.
  - label: First result
    value: The linked setup guide prints ESP32 upload OK in Serial Monitor with no external circuit. Then follow
      the external-LED Blink guide. Documentation reviewed; no compilation or hardware test performed for this
      introduction.
sections:
- id: chip-module-board
  heading: Chip, module and development board
  html: <dl class="article-setup"><dt>Chip (SoC)</dt><dd>The silicon device containing the processor, on-chip
    memory and peripherals. It runs firmware rather than a desktop operating system.</dd><dt>Module</dt><dd>A
    small board containing the chip and supporting parts. ESP32-WROOM-32E adds flash, a crystal and an antenna;
    module markings identify the particular product.</dd><dt>Development board</dt><dd>A larger board carrying
    a module, regulator, USB-to-UART bridge, buttons and headers. This is the convenient starting point for
    breadboard projects.</dd></dl><p>For example, an ESP32-WROOM module is soldered onto a DevKitC board. The
    board’s USB connector is not a GPIO input. Check the <a href="/components/esp32-devkit.html">DevKit pinout
    and power reference</a> before attaching wires.</p>
- id: first-project
  heading: 'Start here: your first working project'
  html: '<p>Use this existing beginner sequence. Finish each guide’s expected result before moving to the next;
    its wiring and software assumptions take precedence over generic board labels.</p><ol><li><a href="/guides/installing-arduino-ide-esp32.html">Arduino
    IDE setup</a>: install the board package, choose board and port, then verify a Serial-only upload. You
    need the DevKit, a USB data cable and a supported computer.</li><li><a href="/guides/blink-led-esp32.html">Blink
    LED</a>: add an external LED, a 220 Ω series resistor, breadboard and jumper wires. Learn how a digital
    output switches a small circuit. Do not assume an onboard LED is on GPIO2.</li><li><a href="/guides/button-led-control.html">Button
    input</a>: add a tactile button and the pull resistor specified by that tutorial. Learn how a stable input
    controls the LED.</li><li><a href="/guides/read-temperature-dht22.html">DHT11 sensor</a>: add the documented
    DHT11 and its required pull-up arrangement. Read temperature and humidity. This DHT11 tutorial retains
    its historical URL; it is not a DHT22 example.</li><li><a href="/guides/connect-oled-esp32.html">OLED display</a>:
    add the specified 128×64 SSD1306 I2C module and display text using the documented SDA/SCL wiring.</li></ol><p>These
    links lead to complete tutorials; there is no separate sketch to copy from this introduction. After the
    five steps, try a <a href="/projects/esp32-oled-weather-clock.html">BME280 weather clock</a>. An analog
    sensor or local web dashboard is a later extension, not an unfinished example here.</p>'
- id: classic-and-family
  heading: What the classic ESP32 example supports
  html: <p>The WROOM-32E example uses a dual-core Xtensa LX6 processor, with a rated maximum clock of 240 MHz.
    It supports 2.4 GHz Wi-Fi and Bluetooth Classic plus Bluetooth LE. These are properties of this classic
    hardware, not every chip with ESP32 in its name.</p><p>The classic chip has 520 KB of on-chip SRAM; firmware
    and wireless software use part of it, so this is not the available space for your variables. Flash stores
    the program, and its capacity depends on the module variant. PSRAM is extra memory present on some modules;
    do not assume a WROOM board includes it or that more flash fixes a RAM allocation problem.</p><p>Other
    families differ. ESP32-S2 has no Bluetooth. ESP32-S3 supports Bluetooth LE rather than Classic and uses
    LX7 processors. ESP32-C3 uses a RISC-V processor. S2/S3 chips have native USB capabilities; whether a board
    exposes a suitable connector and how it uploads depends on that board and firmware. The classic WROOM DevKit
    used here uploads through its USB-to-UART bridge, not native chip USB.</p><p>GPIO labels, peripheral counts
    and memory arrangements also vary. See <a href="/guides/esp32-vs-esp32-s3.html">classic ESP32 versus ESP32-S3</a>
    before carrying a pin map or Bluetooth example to another family.</p>
- id: voltage-and-inputs
  heading: Supply voltage, GPIO logic and analog measurements
  html: <ul><li><strong>Board supply:</strong> use the documented USB power input for the first build. A regulator
    supplies the module’s operating rail. A USB or 5V supply label does not make the GPIO pins 5 V tolerant.
    DevKitC V4 power inputs are alternative methods, not inputs to connect together.</li><li><strong>Signals:</strong>
    the classic board uses 3.3 V GPIO logic. Do not connect a 5 V output directly to a GPIO. Verify each sensor’s
    supply requirement and signal levels separately; use suitable level conversion where required.</li><li><strong>ADC
    measurements:</strong> analog-capable pins convert voltage into a number. The usable measurement range
    depends on the chip and attenuation setting, and is not a universal 0–3.3 V range. A safe logic-level signal
    can still exceed the configured ADC measurement range. Raw counts are not automatically calibrated volts.</li></ul><p>On
    classic ESP32, GPIO34–39 are input-only with no internal pull resistors, and not all are exposed on every
    module. Flash-connected and boot-strapping pins have other restrictions. ADC2 also shares hardware with
    Wi-Fi; prefer a documented ADC1 input for introductory analog builds.</p><p>Use the <a href="/guides/analog-inputs.html">ADC
    guide for raw versus calibrated readings, attenuation and input limits</a> rather than guessing a voltage
    conversion. Follow the actual board pin map before choosing a pin.</p>
- id: power-and-sleep
  heading: 'Power and deep sleep: board limits matter'
  html: <p>Current changes with radio activity, CPU settings, attached loads and board design. Size the supply
    from the actual board and load documentation, including startup demand. A headline chip-current figure
    does not describe a complete DevKit. Motors, servos and relay coils need a suitable driver and rated supply;
    a GPIO is a control signal, not their power source.</p><p>Deep sleep powers down most of the classic chip
    while selected RTC functions can remain active. A timer or supported wake pin can restart the application;
    ordinary RAM state is not simply continued. The board’s regulator, USB bridge, LEDs and sensors can keep
    consuming power. Chip microamp specifications are not a promise for a USB DevKit or a battery runtime estimate.
    Follow the <a href="/guides/esp32-deep-sleep.html">board-qualified deep-sleep guide</a> when ready.</p>
- id: comparison
  heading: Compare named boards, not product families
  html: <div class="wiring-table-wrap"><table class="wiring-table" style="table-layout:fixed;width:100%;min-width:560px"><caption>Documented
    board examples; firmware support and expansion hardware can change what a project does.</caption><thead
    style="white-space:normal;overflow-wrap:anywhere"><tr><th scope="col" style="white-space:normal;overflow-wrap:anywhere">Feature</th><th
    scope="col" style="white-space:normal;overflow-wrap:anywhere">DevKitC V4 with WROOM-32E</th><th scope="col"
    style="white-space:normal;overflow-wrap:anywhere">Arduino Uno Rev3</th><th scope="col" style="white-space:normal;overflow-wrap:anywhere">Raspberry
    Pi Pico W</th></tr></thead><tbody><tr><th scope="row" style="white-space:normal;overflow-wrap:anywhere">GPIO
    logic</th><td style="white-space:normal;overflow-wrap:anywhere">3.3 V</td><td style="white-space:normal;overflow-wrap:anywhere">5
    V</td><td style="white-space:normal;overflow-wrap:anywhere">3.3 V</td></tr><tr><th scope="row" style="white-space:normal;overflow-wrap:anywhere">Onboard
    wireless</th><td style="white-space:normal;overflow-wrap:anywhere">2.4 GHz Wi-Fi; Bluetooth Classic and
    LE</td><td style="white-space:normal;overflow-wrap:anywhere">No onboard radio</td><td style="white-space:normal;overflow-wrap:anywhere">2.4
    GHz Wi-Fi; Bluetooth Classic and LE with supported firmware</td></tr><tr><th scope="row" style="white-space:normal;overflow-wrap:anywhere">USB
    path</th><td style="white-space:normal;overflow-wrap:anywhere">USB-to-UART bridge for upload/Serial</td><td
    style="white-space:normal;overflow-wrap:anywhere">USB-to-serial interface</td><td style="white-space:normal;overflow-wrap:anywhere">Native
    USB; available function depends on firmware</td></tr><tr><th scope="row" style="white-space:normal;overflow-wrap:anywhere">Choose
    for</th><td style="white-space:normal;overflow-wrap:anywhere">The classic ESP32 examples on this site</td><td
    style="white-space:normal;overflow-wrap:anywhere">Uno Rev3 lessons or compatible 5 V shields</td><td style="white-space:normal;overflow-wrap:anywhere">RP2040/Pico-specific
    projects and software</td></tr></tbody></table></div><p>These are microcontroller boards, not general-purpose
    Linux computers. A Raspberry Pi single-board computer is a different product class. Do not select a board
    by clock speed alone or assume all Arduino-branded boards have Uno Rev3 specifications.</p>
- id: troubleshooting
  heading: If the first upload or circuit does not work
  html: <h3>No USB port</h3><p>Try a known data cable and another port. Identify the actual USB bridge before
    installing its manufacturer’s driver. Holding BOOT does not turn a charge-only cable into a data cable.</p><h3>Upload
    fails</h3><p>Check board family and port first. Only use BOOT/EN recovery when appropriate to the documented
    classic UART board; native USB boards can need different settings. Use the setup guide’s recovery steps.</p><h3>Repeated
    resets</h3><p>Disconnect external loads with power off and retest the Serial-only sketch. Read reset messages,
    inspect wiring and verify the rated supply/cable. Do not add an arbitrary large capacitor as a universal
    repair.</p><h3>Blank Serial Monitor</h3><p>Match the sketch’s baud rate (115200 in the linked first test),
    choose the correct port and reset the board. USB CDC settings apply only to a supported native-USB workflow,
    not every classic DevKit.</p><h3>Noisy analog readings</h3><p>Check common reference, voltage limits, ADC-capable
    pin and attenuation. On classic ESP32, account for ADC2/Wi-Fi sharing. See the ADC guide before averaging
    or claiming voltage accuracy.</p>
conclusion: Begin with the Serial-only upload in the Arduino IDE setup guide, then wire the external LED exactly
  as the Blink tutorial shows. Add the remaining beginner circuits one at a time; do not treat specifications
  from one ESP32 family as a pinout for another.
faqs:
- question: Can I use Python instead of Arduino?
  answer: MicroPython or CircuitPython is an option only with firmware built for the exact supported board.
    USB workflows differ. This beginner route uses Arduino-ESP32; the separate CircuitPython Feather ESP32-S3
    guide identifies its supported board and installation path.
- question: Do I need the internet after programming?
  answer: A local LED, button or sensor program can run without a network. Wi-Fi features need the network
    they were written for; a local-network project does not automatically require a cloud service.
