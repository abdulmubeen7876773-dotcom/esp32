    "code": {
      "filename": "analog_potentiometer_read.ino",
      "notes": "GPIO34 reads the potentiometer wiper; outer terminals use 3V3 and GND.\n\nResolution and attenuation are explicit for the stated board/core.\n\nRaw counts are not voltage or shaft-position percentage.",
      "content": "#include <Arduino.h>\nconstexpr uint8_t POT_PIN = 34;\nvoid setup() {\n  Serial.begin(115200);\n  analogReadResolution(12);\n  analogSetPinAttenuation(POT_PIN, ADC_11db);\n  Serial.println(\"Analog input ready: raw counts, not dial percent\");\n}\nvoid loop() {\n  const uint16_t raw = analogRead(POT_PIN);\n  Serial.print(\"Raw ADC: \");\n  Serial.println(raw);\n  delay(200);\n}\n"
    },
