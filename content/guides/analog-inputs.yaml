    "component_spotlight_lead": "The potentiometer is the safest beginner analog sensor because you control the voltage by turning the knob.",
    "concept": {
      "title": "Analog Values Are In-Between Values",
      "image": "/assets/visuals/guides/concepts/analog-inputs-concept.svg",
      "illustration_alt": "Logical flow from potentiometer voltage through classic ESP32 GPIO34 ADC to Serial Monitor readings",
      "body": "An analog input measures a changing voltage rather than only HIGH or LOW. A potentiometer produces that voltage at its wiper.\n\nWith the sketch configured for 12 bits, analogRead() returns raw counts from 0 to 4095. Counts are not volts and are not a calibrated knob-position percentage. analogReadMilliVolts() performs another conversion and returns a calibrated voltage estimate in millivolts."
    },
    "engineering_explanation": "This example assumes a classic ESP32-WROOM DevKit, GPIO34 (ADC1), and Arduino-ESP32 3.3.2 as the review baseline, not a claim about the latest release. GPIO34 is input-only and has no internal pull-up or pull-down. Other ESP32 families have different ADC pins and ranges.\n\nThe potentiometer is a voltage divider between 3V3 and GND. Its wiper can approach the full supply voltage. Never apply 5 V or a negative voltage to GPIO34. Keep external signals within the board's 3.3 V supply rails; attenuation is a measurement setting, not overvoltage protection.\n\nanalogReadResolution(12) selects 0–4095 raw counts. analogSetPinAttenuation(POT_PIN, ADC_11db) selects the wider ADC input range. Espressif documents approximately 150–3100 mV for this setting on classic ESP32. A 3.3 V-powered dial can therefore saturate near its upper end; readings near either endpoint are less useful for accurate voltage measurement. A count of 4095 does not prove the voltage is 3.3 V.\n\nanalogReadMilliVolts() uses ADC calibration to estimate voltage. It and analogRead() take separate samples, so the displayed pair can differ slightly as the dial moves. Calibration reduces chip-to-chip error; it does not turn the ADC into a precision voltmeter. Check important measurements against known voltages and a suitable meter within the documented measurement range.\n\nOn classic ESP32, ADC2 shares hardware with Wi-Fi. Use an ADC1 pin such as GPIO34 for readings while Wi-Fi operates. This restriction is not a universal rule for every ESP32 family. Short wires, stable power and averaging can reduce noise, but cannot correct saturation or unsafe input voltage.",
    "real_life_analogy": "A light switch is digital: it is either off or on. A volume knob is analog: it can be quiet, medium, loud, or anywhere between. That is the first analog idea: not two answers, but a range of answers.\n\nA thermometer is another example. Temperature does not jump only between cold and hot. It moves gradually. Analog inputs let a microcontroller notice those gradual changes.\n\nThink of the ADC like a ruler for voltage. The voltage is the real-world length. The ADC number is the ruler marking closest to where the voltage lands. The ruler is useful, but it still has marks, so the ESP32 reports a nearby number rather than an infinite perfect value.",
