    "code": {
      "filename": "analog_potentiometer_read.ino",
      "notes": "Classic ESP32-WROOM DevKit / ESP32 Dev Module, Arduino-ESP32 3.3.2 review baseline. GPIO34 is ADC1 and input-only. No additional library. Documentation reviewed; compilation and hardware testing were not performed.\n\nRaw counts and millivolts come from separate conversions. ADC_11db does not make the pin 5 V tolerant. Expect saturation near the ends of a 3.3 V-powered potentiometer.",
      "content": "#include <Arduino.h>\n\nconst int POT_PIN = 34;\n\nvoid setup() {\n  Serial.begin(115200);\n  analogReadResolution(12);\n  analogSetPinAttenuation(POT_PIN, ADC_11db);\n  delay(500);\n  Serial.println(\"Mission 08: raw ADC counts and calibrated millivolts\");\n}\n\nvoid loop() {\n  const uint16_t raw = analogRead(POT_PIN);\n  const uint32_t millivolts = analogReadMilliVolts(POT_PIN);\n  Serial.print(\"Raw ADC: \");\n  Serial.print(raw);\n  Serial.print(\"  |  Calibrated estimate: \");\n  Serial.print(millivolts);\n  Serial.println(\" mV\");\n  delay(200);\n}\n"
    },
