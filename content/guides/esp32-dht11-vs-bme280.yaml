faqs:
- question: Can I replace DHT11 with BME280 by changing DHT_TYPE?
  answer: No. BME280 uses another interface and library. Use its own complete wiring and code guide.
- question: Does BME280 measure air quality?
  answer: No. Its measurements are temperature, relative humidity and pressure, not gas concentration or air-quality
    index.
