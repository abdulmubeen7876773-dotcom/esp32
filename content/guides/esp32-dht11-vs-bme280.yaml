body_html: "<span id=\"decision\" aria-hidden=\"true\"></span>\n<span id=\"comparison\" aria-hidden=\"true\"></span>\n\
  <span id=\"accuracy\" aria-hidden=\"true\"></span>\n<span id=\"sampling\" aria-hidden=\"true\"></span>\n<span\
  \ id=\"interpretation\" aria-hidden=\"true\"></span>\n<span id=\"choose\" aria-hidden=\"true\"></span>\n<span\
  \ id=\"back-to-roadmap\" aria-hidden=\"true\"></span>\n<h2 id=\"short-answer\">Short answer: what is the difference?</h2>\n\
  <p>The <strong>DHT11</strong> measures air temperature and relative humidity over a timed single-wire digital\
  \ connection. The <strong>BME280</strong> measures temperature, relative humidity, and barometric pressure, and\
  \ communicates using I2C or SPI. Choose based on the readings and interface your project needs; neither is the\
  \ universal winner.</p>\n<p>For a room monitor that only needs temperature and humidity, DHT11 may be enough.\
  \ For a weather-station experiment, pressure trend, or pressure-based altitude estimate, the extra BME280 pressure\
  \ measurement is useful. Both still need sensible placement and realistic expectations about sensor tolerance.</p>\n\
  \n<h2 id=\"measurements\">What each sensor measures</h2>\n<p>DHT11 reports temperature and <strong>relative humidity</strong>.\
  \ It does not measure air pressure, altitude, air quality, or wind. Its comparatively slow measurement cycle makes\
  \ it suitable for room and greenhouse monitoring, not rapid control loops.</p>\n<p>BME280 reports temperature,\
  \ relative humidity, and <strong>barometric pressure</strong>. Software can use pressure and a reference pressure\
  \ to estimate altitude, but that is an estimate: weather changes and local pressure must be considered. Neither\
  \ sensor measures wind, rainfall, or the full set of quantities needed for a calibrated outdoor weather station.</p>\n\
  \n<h2 id=\"comparison-table\">DHT11 vs BME280 comparison</h2>\n<div class=\"pin-table-wrap\"><table class=\"pin-table\
  \ pin-table-3\">\n  <thead><tr><th>Category</th><th>DHT11</th><th>BME280</th></tr></thead>\n  <tbody>\n    <tr><td>Measurements</td><td>Temperature\
  \ and relative humidity</td><td>Temperature, relative humidity, and pressure</td></tr>\n    <tr><td>Accuracy and\
  \ resolution</td><td>A basic, low-rate sensor. Check the DHT11-specific tolerance and range for your part; DHT22/AM2302\
  \ specifications do not apply.</td><td>Check Bosch tolerances for each measurement and operating condition. Extra\
  \ display decimals do not establish better accuracy.</td></tr>\n    <tr><td>ESP32 interface</td><td>One timed\
  \ digital data wire plus power and ground; not I2C</td><td>I2C or SPI; I2C uses SDA and SCL, SPI uses clock, data,\
  \ and chip-select signals</td></tr>\n    <tr><td>Update pace</td><td>Slow; the supplied DHT11 lesson uses a two-second\
  \ example delay. Check the timing requirements of your exact sensor.</td><td>Configurable measurement and standby\
  \ settings; faster sampling is possible, depending on settings and power mode</td></tr>\n    <tr><td>Pressure\
  \ / altitude</td><td>No pressure measurement, so no pressure-based altitude estimate</td><td>Measures pressure;\
  \ software can estimate altitude from pressure and a reference</td></tr>\n    <tr><td>Pull-up needs</td><td>DATA\
  \ needs a pull-up; bare sensors generally need an external resistor, while many modules include one</td><td>I2C\
  \ lines need pull-ups; many breakouts include them, but check the exact board. SPI does not use I2C pull-ups</td></tr>\n\
  \    <tr><td>Setup</td><td>Simple wiring, but timing and pull-up matter</td><td>More interface and configuration\
  \ choices; confirm I2C address or SPI pin setup</td></tr>\n    <tr><td>Best fit</td><td>Basic, low-rate temperature\
  \ and humidity projects</td><td>Projects that need pressure too, or prefer I2C/SPI bus integration</td></tr>\n\
  \  </tbody>\n</table></div>\n<p>These published figures are examples, not a head-to-head score. Conditions and\
  \ test methods differ. Check the exact part revision, specified temperature/humidity/pressure range, mounting,\
  \ airflow and self-heating before applying any accuracy figure to a build. No side-by-side measurements are reported\
  \ here.</p>\n\n<h2 id=\"accuracy-limitations\">Accuracy and operating limitations</h2>\n<p>The BME280 chip's datasheet\
  \ gives temperature, humidity, and pressure error figures under particular test conditions. Pressure-based altitude\
  \ can be sensitive to local weather and the reference pressure; it is useful for relative changes and learning,\
  \ but is not automatically a surveyed elevation measurement. The sensor package and breakout board can also warm\
  \ up from the ESP32 or nearby electronics.</p>\n<p>DHT11 readings update slowly and should not be requested more\
  \ often than the sensor supports; the linked DHT11 lesson retains the supplied two-second example delay. Humidity\
  \ response and readings are affected by placement, condensation, airflow, contamination, and exposure to conditions\
  \ outside the documented range. Keep either sensor away from direct sunlight, warm regulators, and heat-producing\
  \ components when measuring ambient air.</p>\n\n<h2 id=\"interfaces\">Communication interface</h2>\n<h3>DHT11:\
  \ a timed single-wire signal</h3>\n<p>DHT11 uses one bidirectional data connection with a device-specific timing\
  \ protocol. Arduino libraries handle the pulse timing and decoding. Despite some boards marking a signal pin SDA,\
  \ it is not an I2C sensor and does not share the ESP32 I2C bus in the normal way.</p>\n<h3>BME280: I2C or SPI</h3>\n\
  <p>I2C uses two shared signal lines, SDA and SCL, and typically only a few wires overall. A BME280 is commonly\
  \ found at I2C address <code>0x76</code> or <code>0x77</code>, depending on the SDO/address selection and breakout\
  \ implementation. SPI uses separate clock, data-in, data-out, and chip-select signals, with some signal names\
  \ varying by board. The ESP32 can map these peripherals to supported GPIOs, but use a pinout and library example\
  \ for your specific board.</p>\n\n<h2 id=\"wiring\">ESP32 wiring differences</h2>\n<p>The supplied DHT11 photograph\
  \ and BME280 diagram are wiring references. Module pin order, labeling, pull-ups, regulators, and level shifting\
  \ differ, so read the silkscreen and documentation for your exact breakout.</p>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1rem;align-items:start\"\
  >\n  <figure style=\"margin:1rem auto;max-width:640px\"><img src=\"/assets/visuals/guides/photos/contributor-media-20261103/dht11-wiring.jpeg\"\
  \ alt=\"Owner-supplied DHT11 module wiring with an ESP32\" width=\"1600\" height=\"900\" loading=\"lazy\" decoding=\"\
  async\" style=\"display:block;width:100%;height:auto\"><figcaption>Supplied DHT11 module: DATA connects to GPIO4\
  \ in the linked lesson. Check the module labels and its pull-up to 3.3 V.</figcaption></figure>\n  <figure style=\"\
  margin:1rem auto;max-width:640px\"><img src=\"/assets/visuals/components/wiring/bme280-wiring.svg\" alt=\"Existing\
  \ BME280 wiring diagram showing a breakout connected to ESP32 I2C\" width=\"800\" height=\"500\" loading=\"lazy\"\
  \ decoding=\"async\" style=\"display:block;width:100%;height:auto\"><figcaption>BME280 example: connect the breakout's\
  \ I2C SDA and SCL pins to the ESP32 I2C pins shown for your board.</figcaption></figure>\n</div>\n<h3>DHT11 wiring\
  \ and pull-up</h3>\n<p>Connect VCC, DATA, and GND according to the sensor's pinout, with a common ground. A bare\
  \ DHT11 normally needs a pull-up resistor between DATA and a suitable logic supply. For direct connection to an\
  \ ESP32 GPIO, keep DATA pulled up to 3.3 V. Many three-pin modules include a pull-up, but board designs vary;\
  \ inspect its schematic or documentation before adding another. A DHT11 module that accepts 5 V at VCC may still\
  \ pull DATA up to 5 V, which is not safe to assume for an ESP32 input.</p>\n<h3>BME280 wiring, voltage, and breakout\
  \ boards</h3>\n<p>For I2C, wire the breakout's GND, SDA, and SCL to the matching ESP32 connections. For SPI, follow\
  \ the module's labels and library example for SCK, MOSI/SDI, MISO/SDO, and CS. The BME280 chip itself is a low-voltage\
  \ device; a breakout marked VIN may add a regulator or level shifting, while another board may expose chip-level\
  \ connections directly. Never infer safe 5 V operation from the BME280 name alone. Check the exact board's permitted\
  \ supply and signal voltage. Pull-up resistors may already be fitted to I2C breakouts; several modules on one\
  \ bus can result in overly strong combined pull-ups, so check board documentation if the bus behaves unreliably.</p>\n\
  \n<h2 id=\"arduino-setup\">Arduino IDE and library setup</h2>\n<p>Both sensors work with Arduino libraries, but\
  \ the code and library are different. For DHT11, install the Adafruit DHT sensor library and its stated dependency\
  \ through Library Manager, then select the DHT11 sensor type in code (<code>#define DHTTYPE DHT11</code>). For\
  \ BME280, choose a library that explicitly supports BME280 and install its required dependencies; the Adafruit\
  \ BME280 library, for example, lists Adafruit Unified Sensor and Adafruit BusIO dependencies. Avoid similarly\
  \ named libraries or BMP280-only drivers, which do not support every BME280 feature.</p>\n<p>The ESP32 board package\
  \ and upload setup are shared. Follow the <a href=\"/guides/esp32-arduino-ide.html\">ESP32 Arduino IDE sketch\
  \ and Serial reference</a> if you have not yet selected a board and port. Then use the matching <a href=\"/guides/read-temperature-dht22.html\"\
  >DHT11 wiring and code guide</a> or <a href=\"/guides/esp32-bme280.html\">BME280 complete guide</a> for documented\
  \ sensor-specific examples. This comparison intentionally focuses on the differences instead of duplicating both\
  \ tutorials.</p>\n\n<h2 id=\"practical-code-differences\">What changes in the code?</h2>\n<p>A DHT11 sketch configures\
  \ a data GPIO and the DHT11 type, initializes the DHT library, and reads temperature and humidity. It should wait\
  \ long enough between measurements; the linked DHT11 lesson retains the supplied two-second example delay and\
  \ checks for invalid readings.</p>\n<p>A BME280 sketch initializes the I2C or SPI bus, starts the sensor at its\
  \ selected address or chip-select pin, and reads temperature, humidity, and pressure. An I2C sketch may try the\
  \ address used by the module, commonly <code>0x76</code> or <code>0x77</code>; SPI setup instead requires the\
  \ correct wiring and chip-select pin. Use the complete BME280 guide for its working code and address troubleshooting.\
  \ These are not interchangeable drop-in libraries or pin configurations.</p>\n\n<h2 id=\"choose-sensor\">Which\
  \ sensor should you choose?</h2>\n<ul>\n  <li><strong>Basic temperature and humidity monitor:</strong> DHT11 can\
  \ be a reasonable choice if its measurement pace and documented tolerance fit your needs. Consider other modern\
  \ humidity sensors too when size, power, or responsiveness matter.</li>\n  <li><strong>Weather-station learning\
  \ project:</strong> BME280 is the more useful of these two when you want pressure readings as well as temperature\
  \ and humidity. A complete station needs other measurements and outdoor-appropriate placement too.</li>\n  <li><strong>Pressure\
  \ and altitude experiments:</strong> Choose BME280. Treat altitude as an estimate that depends on reference pressure\
  \ and changing weather.</li>\n  <li><strong>First sensor lesson:</strong> DHT11 has a direct, easy-to-see reading\
  \ flow, though the pull-up and slow sampling still need care. BME280 is also beginner-friendly when you are ready\
  \ to learn I2C.</li>\n  <li><strong>Cost-sensitive build:</strong> Compare the actual local prices and features\
  \ of complete modules, including shipping and required components. Price and board quality vary; do not choose\
  \ from the sensor name alone.</li>\n</ul>\n<p>For outdoor forecasts, calibrated records, or robust industrial\
  \ monitoring, neither hobby breakout automatically provides a complete solution. Enclosure, radiation shielding,\
  \ ventilation, calibration, logging, and sensor environmental rating can matter as much as the chip.</p>\n\n<h2\
  \ id=\"common-mistakes\">Common beginner mistakes</h2>\n<ul>\n  <li>Expecting a DHT11 to provide pressure or altitude\
  \ data.</li>\n  <li>Assuming a DHT11 signal pin labeled SDA is an I2C connection.</li>\n  <li>Assuming every BME280\
  \ breakout accepts 5 V or includes level shifting and pull-ups.</li>\n  <li>Using the wrong BME280 I2C address,\
  \ or confusing a BME280 with a BMP280 that lacks humidity measurement.</li>\n  <li>Copying pin order from a different\
  \ module or ESP32 board without checking labels and pinout.</li>\n  <li>Reading DHT11 too frequently, or treating\
  \ one failed/invalid read as proof that the sensor is defective.</li>\n  <li>Placing either sensor next to a warm\
  \ ESP32 regulator, in direct sun, or where condensation can form.</li>\n</ul>\n\n<h2 id=\"next-steps\">Next steps</h2>\n\
  <p>Check the concise <a href=\"/guides/read-temperature-dht22.html\">DHT11 wiring and code guide</a> and <a href=\"\
  /components/bme280.html\">BME280 component reference</a> for the specific module details. The DHT11 reference\
  \ includes its wiring and example; use the <a href=\"/guides/esp32-bme280.html\">complete ESP32 BME280 guide</a>\
  \ for BME280 wiring, library setup and code. To combine pressure, temperature, and humidity readings into a build,\
  \ continue to the <a href=\"/projects/esp32-iot-weather-station.html\">ESP32 IoT Weather Station project</a>.</p>\n\
  \n<h2 id=\"supplied-readings\">What the supplied builds show</h2>\n<p>The DHT11 capture reports 30.1 C and 47.0%\
  \ RH. The separate BME280 capture reports about 29.06–29.07 C, 49.92–49.95% RH and 999.27–999.31 hPa. These recordings\
  \ were not a simultaneous, side-by-side test against a calibrated reference. Their difference cannot tell us which\
  \ sensor is more accurate.</p>\n<p>The DHT11 capture used the original two-second sketch. The linked lesson retains\
  \ that supplied version. The BME280 altitude value is calculated using a 1013.25 hPa reference, not measured elevation.</p>\n\
  <span id=\"faq\" aria-hidden=\"true\"></span>\n"
