    "expected_output": "Illustrative output, not a recorded hardware result:\n\nI2C scanner: SDA GPIO21, SCL GPIO22, 100 kHz\nACK at 7-bit address 0x3C (identity not checked)\nACK at 7-bit address 0x76 (identity not checked)\nScan: 2 responding address(es), 0 bus error(s)\n\nYour addresses may differ. 0x3C/0x3D are common OLED addresses; 0x76/0x77 can belong to BME280 or BMP280. Confirm controller, sensor and interface using their documentation and component-specific initialization. The count is responding addresses, not necessarily physical devices. An ACK does not prove that a display works or sensor data is valid.\n\nStatus 2 is an address NACK, normally expected at unused addresses. Other statuses are reported as bus errors; status 5 means a transaction timeout on the reviewed ESP32 Wire implementation. Check power and common ground, shorten wires, inspect pull-ups and isolate one module. A stuck-low line can produce repeated timeouts; disconnect power before rewiring.",
