    "component_spotlight_lead": "I2C matters because it lets one ESP32 talk to several smart parts without using a separate pin for every signal.",
    "concept": {
      "title": "I2C Is a Shared Conversation Bus",
      "image": "/assets/visuals/guides/concepts/i2c-communication-concept.svg",
      "illustration_alt": "ESP32 I2C bus with GPIO21 SDA and GPIO22 SCL shared by an SSD1306 OLED and BME280 sensor",
      "body": "A protocol is a rulebook for communication. It defines who talks, when they talk, how bits are timed, and how the receiver knows the message is meant for it.\n\nI2C uses two signal wires. SDA carries data. SCL carries the clock. The ESP32 usually controls the conversation, and the connected modules respond when their address is called.\n\nOlder tutorials often say master and slave. You will still see those words in datasheets and library code. A clearer modern way to say the same idea is controller and peripheral. In this mission, the ESP32 is the controller. The OLED and BME280 are peripherals."
    },
    "engineering_explanation": "The ESP32 needs protocols because raw wires are not enough. A GPIO can be HIGH or LOW, but a display or sensor needs structured information: start here, send this address, write this command, read these bytes, stop now.\n\nI2C solves that with a bus. The bus is shared by all connected I2C devices. The controller pulls the clock line to create timing. The data line changes in sync with that clock. At the start of a transaction, the controller sends a device address. Only the peripheral with that address should respond.\n\nThis is why the OLED and BME280 can both use GPIO21 and GPIO22 in this mission. GPIO21 and GPIO22 are the common Arduino ESP32 example pins used across this site, but ESP32 I2C pins are configurable in code when Wire.begin(SDA, SCL) matches the wires.\n\nThey are not connected to private signal wires. They share the same bus, but they use different addresses. The OLED might answer at 0x3C or 0x3D, while the BME280 might answer at 0x76 or 0x77. If two devices have the same fixed address on one bus, the ESP32 cannot reliably choose between them without changing an address or adding extra hardware such as an I2C multiplexer.\n\nI2C lines normally rest HIGH because of pull-up resistors. Devices communicate by pulling the lines LOW at the right times. Many breakout modules already include pull-up resistors, which is why beginner circuits often work without adding extra resistors. But if the wires are long, the modules are many, or the pull-ups are missing or too strong together, the bus can become unreliable.\n\nI2C is excellent for short, low-pin-count communication inside a project. It is not the best choice for long cables, very high speed, or devices that all have the same fixed address.\n\nFor this classic ESP32 circuit, use documented 3.3 V-compatible I2C breakouts and pull SDA/SCL up to 3.3 V. A regulator on a module does not prove its bus is level shifted. Check where onboard pull-ups connect before powering a module at 5 V; use suitable bidirectional I2C level shifting if the bus levels differ. The ESP32 internal pulls are weak and should not replace appropriate external bus pull-ups. For a short 100 kHz breadboard bus, 4.7 kOhm on each line is a common starting point when none are fitted; verify rise time/loading for your circuit rather than adding another pair blindly. Parallel module pull-ups reduce the effective resistance.\n\nThe scanner prints 7-bit addresses, not the shifted 8-bit read/write bytes some datasheets show. A response at 0x76/0x77 can come from BME280 or BMP280; compare the chip-ID register and module documentation in the BME280 guide. A response at 0x3C/0x3D does not establish OLED controller or dimensions. Two devices sharing an address may appear as one response; isolate modules to diagnose collisions.",
    "real_life_analogy": "Think of I2C like an apartment building intercom. Everyone is connected to the same intercom system, but the visitor presses one apartment number. Only that apartment should answer.\n\nSDA is the spoken message. SCL is the rhythm that keeps the message understandable, like a metronome.\n\nThe address is the apartment number. Without the address, every device would hear noise and nobody would know who should respond.",
