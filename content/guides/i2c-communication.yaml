    "code": {
      "filename": "i2c_scanner_esp32.ino",
      "notes": "Classic ESP32-WROOM DevKit / ESP32 Dev Module; Arduino-ESP32 3.3.2 review baseline, not a latest-release claim. Only built-in Wire is required. SDA is GPIO21, SCL is GPIO22, bus speed is 100 kHz. Other ESP32 families/boards may need different pins. Documentation reviewed; compilation and hardware testing were not performed.\n\nThis scanner tests non-reserved 7-bit addresses 0x08–0x77. An ACK proves only that something answered at an address: it does not identify an SSD1306, BME280 or BMP280, validate all wiring, or prove measurement/display operation. Use the device-specific guide next. Do not scan a bus containing parts whose datasheet prohibits this probe.",
      "content": "#include <Arduino.h>\n#include <Wire.h>\n\nconstexpr int I2C_SDA = 21;\nconstexpr int I2C_SCL = 22;\n\nvoid setup() {\n  Serial.begin(115200);\n  delay(1000);\n  if (!Wire.begin(I2C_SDA, I2C_SCL, 100000)) {\n    Serial.println(\"I2C initialization failed: check board and pin selection.\");\n    while (true) delay(1000);\n  }\n  Wire.setTimeOut(50); // Milliseconds per transaction, not the scan interval.\n  Serial.println(\"I2C scanner: SDA GPIO21, SCL GPIO22, 100 kHz\");\n}\n\nvoid loop() {\n  unsigned int found = 0;\n  unsigned int faults = 0;\n  for (uint8_t address = 0x08; address <= 0x77; ++address) {\n    Wire.beginTransmission(address);\n    const uint8_t status = Wire.endTransmission();\n    if (status == 0) {\n      Serial.printf(\"ACK at 7-bit address 0x%02X (identity not checked)\\n\", address);\n      ++found;\n    } else if (status != 2) { // 2: address NACK; no response at this address.\n      Serial.printf(\"Bus error %u at 0x%02X\\n\", status, address);\n      ++faults;\n    }\n  }\n  Serial.printf(\"Scan: %u responding address(es), %u bus error(s)\\n\", found, faults);\n  if (found == 0) Serial.println(\"Check power, common GND, pins and pull-ups.\");\n  delay(5000);\n}\n"
    },
