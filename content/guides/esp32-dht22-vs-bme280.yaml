conclusion: 'For temperature and humidity alone, a DHT22 can be a straightforward starting point. Choose a BME280 when your project needs pressure as well, or when I2C/SPI integration suits the rest of the build. Use the exact module documentation for pin and power details, then follow the matching ESP32 guide for a complete setup.'
faqs:
  - question: Does a BME280 measure humidity as well as pressure?
    answer: Yes. The BME280 measures temperature, relative humidity, and barometric pressure. Some similar-looking Bosch sensors, such as the BMP280, do not measure humidity, so check the exact chip marking or module documentation.
  - question: Can the DHT22 estimate altitude?
    answer: No. The DHT22 does not measure pressure. Pressure-based altitude estimates require a barometric sensor such as the BME280, and the result depends on the reference pressure and conditions.
  - question: Which sensor is more accurate?
    answer: There is no single answer across every measurement and condition. Published tolerances depend on the specific sensor, operating range, and test conditions; the breakout board, placement, airflow, and self-heating also affect real readings. Compare the datasheets for the exact parts and intended conditions.
  - question: Are DHT22 and BME280 wiring interchangeable?
    answer: No. A DHT22 uses a timed single-wire digital data line, while a BME280 normally uses I2C or SPI. Their power and pin labels also differ, so follow the wiring example and board documentation for the specific sensor.
  - question: Can I use both sensors with one ESP32?
    answer: Yes, if your wiring and libraries support both and you have suitable GPIO and bus connections. The BME280 uses I2C or SPI, while the DHT22 has its own data GPIO; make sure the chosen pins do not conflict with other hardware.
