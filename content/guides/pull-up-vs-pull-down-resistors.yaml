    "component_spotlight_lead": "This mission focuses on ESP32 GPIO input behavior and the resistor that defines a safe default state.",
    "concept": {
      "title": "The Default State Problem",
      "image": "/assets/visuals/guides/concepts/pull-up-vs-pull-down-resistors-concept.svg",
      "illustration_alt": "ESP32 button input shown with a weak resistor pulling the GPIO to a default HIGH or LOW state",
      "body": "A button is not always connected. When it is open, it leaves one side of the circuit disconnected unless you add a default path.\n\nA pull resistor gives the input a weak default. Pull-up means the default is HIGH. Pull-down means the default is LOW. Pressing the button creates a stronger path to the opposite state.\n\nThe resistor is important because it limits current. It is strong enough to guide the input, but weak enough that a button press can safely override it."
    },
    "internal_resistor_explanation": "pinMode(pin, INPUT) leaves the digital input without an internal pull. INPUT_PULLUP enables a weak pull toward HIGH; INPUT_PULLDOWN enables one toward LOW. Use the wiring and pressed-state test from the comparison table. These modes do not debounce the switch.\n\nUse GPIO27 for these examples. On classic ESP32, GPIO34–39 are input-only and have no internal pull-up or pull-down: use an external resistor there. Other ESP32 families have different restrictions.\n\nAvoid boot-strapping pins GPIO0, GPIO2, GPIO5, GPIO12 and GPIO15 for this first button circuit: a button or resistor can change the boot configuration. GPIO6–11 are normally connected to flash. Check your board pin map before substituting a GPIO.",
    "external_resistor_explanation": "Use INPUT with an external pull-up or pull-down so the physical resistor defines the default. External pulls let you choose a stronger pull and work on input-only pins without internal pulls. They also provide a default while the GPIO is not yet configured by setup().\n\nA pull resistor biases an input; it does not convert a 5 V signal into safe ESP32 logic. Use 3.3 V rails in these circuits. A sensor that actively drives HIGH and LOW may need no pull, while an open-drain output needs the pull specified by its manufacturer.",
    "resistor_value_explanation": "For this short-wire, 3.3 V button exercise, start with 10 kΩ. With the button pressed, the resistor has approximately 3.3 V across it: 3.3 V / 10,000 Ω = 0.33 mA. This is a calculated value, not a measured result or a universal resistor recommendation.\n\nThe classic ESP32 datasheet lists about 45 kΩ as the typical internal pull resistance; actual resistance varies. A lower external resistance is a stronger pull but draws more current when pressed. A higher value is more vulnerable to leakage and interference. Long cables and other modules need their own electrical requirements checked.",
