setup:
  items:
  - label: Hardware
    value: Classic ESP32-WROOM DevKit, USB data cable and computer. No sensor, LED or other external circuit.
  - label: Software baseline
    value: Arduino IDE 2 and Arduino-ESP32 3.3.2 for the stated classic ESP32 examples. This is an API review baseline,
      not a latest-version claim.
  - label: Before this lesson
    value: Finish the Serial-only first upload and the setup()/loop() lesson. Open Serial Monitor at 115200 baud;
      use your exact board and port.
  - label: Your goal
    value: Choose a type for a count, a flag and a decimal value; explain why 5 / 2 differs from 5.0f / 2.0f.
  - label: Verification limits
    value: Documentation/API and local content/browser review only. No sketch compilation, board upload or physical
      hardware test was performed for this lesson.
sections:
- id: declare-values
  heading: Start with the value you need to represent
  text: 'A variable is a named object with a type and a value. In int sampleCount = 5;, int is the type, sampleCount
    is the name and 5 initializes it. Later assignment changes the value; it does not change the declared type.
    Use a meaningful name and initialize local variables before reading them. An uninitialized local integer does
    not provide a useful default reading.


    Use bool for a true/false condition, an integer for whole counts and a floating-point type when a fraction is
    needed. A value called temperature is not automatically a sensor measurement: this lesson uses a fixed illustrative
    number. Keep units in names such as temperatureC or intervalMs so later calculations are easier to review.'
- id: type-choices
  heading: Choose by range and meaning
  html: <div class="wiring-table-wrap"><table class="wiring-table"><caption>Types used in small ESP32 sketches</caption><thead><tr><th
    scope="col">Need</th><th scope="col">Example type</th><th scope="col">What to check</th></tr></thead><tbody><tr><th
    scope="row">Whole count</th><td>int</td><td>Signed range depends on target; avoid signed overflow.</td></tr><tr><th
    scope="row">Fixed-width quantity</th><td>uint32_t</td><td>Exactly 32 bits when the type is provided; no negative
    values.</td></tr><tr><th scope="row">True / false</th><td>bool</td><td>Use true and false, not text such as
    &quot;false&quot;.</td></tr><tr><th scope="row">Fractional value</th><td>float</td><td>Binary approximation;
    printed decimals are formatting, not accuracy.</td></tr><tr><th scope="row">One character</th><td>char</td><td>Use
    single quotes, for example &#x27;C&#x27;.</td></tr><tr><th scope="row">Elapsed-time value</th><td>unsigned long</td><td>Use
    the millis() type and elapsed subtraction pattern.</td></tr></tbody></table></div>
- id: division
  heading: The operands decide the division
  text: 'The expression 5 / 2 performs integer division and yields 2. Assigning that result to float afterwards
    produces 2.0; the fraction was already lost. In 5.0f / 2.0f the operands are floating-point, so the expected
    result is 2.5. Conversion must happen before the operation when you want fractional arithmetic.


    Serial.println(value, 2) requests two decimal places for a floating-point value. It does not make the underlying
    value more precise. Avoid using exact equality as a general test for calculated decimal values. Also check for
    a zero denominator before dividing values that come from inputs.'
- id: scope
  heading: Separate lifetime from visibility
  text: 'The global savedCount is initialized before setup() and can be used by both sketch functions. The local
    insideCount belongs to setup(). A local static value retains its value across calls but has local visibility.
    Persistent variables are still RAM state; reset or power loss restarts this example. Saving settings to flash
    is a separate topic.


    constexpr identifies a compile-time constant here. It helps express fixed configuration; it does not save a
    changing value across reset. const also prevents normal modification through that name, but not every const
    object is a compile-time expression. Do not fix a scope error by making every variable global.'
- id: expected-results
  heading: Read the source walkthrough
  text: 'Expected key results: integer quotient 2, fractional quotient 2.50, temperature 23.75 C and ready 1. sizeof
    prints the byte size on the selected target. Use those results on your own toolchain rather than copying AVR
    Uno size assumptions into ESP32 code. This lesson does not assert that all Arduino boards use the same int,
    long or double widths.


    The fixed-width counter begins at 7 and increments to 8. Unsigned arithmetic has defined wraparound, but that
    does not make wrapping correct for every application. A counter meant to stop at a limit needs an explicit limit.
    Signed overflow must be avoided; changing the printed format does not enlarge the stored range.'
- id: troubleshooting
  heading: Diagnose a surprising value
  text: 'If a fraction disappears, inspect the operand types before the assignment. If an identifier is not declared,
    check spelling and the braces that determine its scope. If a number becomes unexpectedly large, check conversions
    between signed and unsigned values. If a decimal only appears rounded, compare print precision with the original
    calculation.


    Practice: predict both quotient lines, change sampleCount to 7, then recompute the expected results before uploading.
    Replace the fixed temperature with another illustrative decimal and keep its unit label. Change one thing at
    a time; do not treat these printed constants as sensor evidence.'
- id: upload-steps
  heading: Run one complete sketch
  text: Save the complete example as variables_demo.ino. Keep only this sketch in its folder, select your board
    and port, and upload. Open Serial Monitor at 115200 baud, then press EN/reset if the initial output was missed.
    The program prints its demonstration once in setup(); the empty-working loop yields with delay(10). No GPIO
    wiring or extra library is required.
- id: back-to-roadmap
  heading: Continue your learning path
  html: <p><a href="/learning.html#programming">Back to this Learning path</a> · <a href="/learning.html">See the
    full ESP32 roadmap</a></p>
code_examples:
- title: Complete USB and Serial-only example
  filename: variables_demo.ino
  wiring: 'USB only. No GPIO wiring. Serial Monitor: 115200 baud.'
  content: "#include <Arduino.h>\n#include <stdint.h>\n\nconstexpr int DIVISOR = 2;\nuint32_t savedCount = 7;\n\n\
    void setup() {\n  Serial.begin(115200);\n  delay(1000);\n  int sampleCount = 5;\n  int insideCount = 3;\n  bool\
    \ ready = true;\n  char unit = 'C';\n  float temperatureC = 23.75f;  // Illustrative, not a sensor reading.\n\
    \  int integerQuotient = sampleCount / DIVISOR;\n  float fractionalQuotient = static_cast<float>(sampleCount)\
    \ / DIVISOR;\n\n  Serial.print(\"integer quotient: \"); Serial.println(integerQuotient);\n  Serial.print(\"\
    fractional quotient: \"); Serial.println(fractionalQuotient, 2);\n  Serial.print(\"temperature: \"); Serial.print(temperatureC,\
    \ 2);\n  Serial.print(' '); Serial.println(unit);\n  Serial.print(\"ready: \"); Serial.println(ready);\n  Serial.print(\"\
    local count: \"); Serial.println(insideCount);\n  ++savedCount;\n  Serial.print(\"saved RAM count: \"); Serial.println(savedCount);\n\
    \  Serial.print(\"sizeof int: \"); Serial.println(sizeof(int));\n  Serial.print(\"sizeof float: \"); Serial.println(sizeof(float));\n\
    \  Serial.print(\"sizeof double: \"); Serial.println(sizeof(double));\n}\n\nvoid loop() {\n  delay(10);\n}\n"
  notes: Expected results below are a source walkthrough, not a captured hardware log. No firmware compilation or
    board upload was performed for this lesson.
faqs:
- question: Does float recover a fraction lost by integer division?
  answer: No. Convert an operand before division, not only the result afterwards.
- question: Does a global variable survive power loss?
  answer: No. A global RAM variable has application lifetime, not persistent storage.
