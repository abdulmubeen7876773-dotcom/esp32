body_html: |
  <h2 id="goal">Read and understand an Arduino IDE session</h2>
  <p>Use this reference after the first-upload setup works. Follow the recorded Serial sketch, distinguish compiling from transferring firmware, and connect the messages to <code>setup()</code> and <code>loop()</code>.</p>
  <p>The supplied captures document Arduino IDE 2.3.10, Espressif core 2.0.17 and the Hello sketch below. They do not establish a hardware test on the separate 3.3.2 documentation-review baseline.</p>

  <h2 id="what-you-need">What you need before starting</h2>
  <ul>
    <li><strong>ESP32 development board:</strong> a common ESP32 DevKit or ESP32-WROOM board with USB.</li>
    <li><strong>USB data cable:</strong> many charging cables power the board but cannot upload code.</li>
    <li><strong>Computer:</strong> Windows, macOS, or Linux with permission to install software.</li>
    <li><strong>Arduino IDE 2.x:</strong> the current beginner-friendly Arduino editor.</li>
    <li><strong>Internet access:</strong> needed for package, dependency and later update downloads.</li>
  </ul>
  <p>If you are still choosing a board, read the <a href="/components/esp32-devkit.html">ESP32 DevKit component guide</a> first. It explains USB, pins, power, and why ESP32 GPIO is 3.3 V.</p>

  <h2 id="what-arduino-ide-does">What Arduino IDE does for ESP32</h2>
  <p>Arduino IDE is the program where you write sketches. A sketch is a small C++ program with two important functions: <code>setup()</code>, which runs once, and <code>loop()</code>, which repeats.</p>
  <p>Arduino IDE does not support ESP32 by default. You add the official Espressif board package so the IDE knows which compiler, upload tool, board menu, and ESP32 core libraries to use. After that, uploading to ESP32 feels similar to uploading to a classic Arduino board, but the voltage, pin behavior, and board selection are ESP32-specific.</p>

  <h2 id="install-arduino-ide">Setup prerequisites and the installation route</h2>
  <span id="connect-esp32"></span><span id="add-board-manager-url"></span><span id="install-board-package"></span><span id="select-board"></span><span id="select-port"></span>
  <p>Complete the <a href="/guides/installing-arduino-ide-esp32.html">Arduino IDE installation and first-upload guide</a> before using this reference. It is the full procedure for package installation, board selection and USB recovery.</p>
  <ul>
  <li><a href="/guides/installing-arduino-ide-esp32.html#board-package">Install the official board package</a> if ESP32 profiles are missing.</li>
  <li><a href="/guides/installing-arduino-ide-esp32.html#board-port">Check the board and port</a> for your exact chip family; this recorded example uses a classic ESP32 Dev Module.</li>
  <li><a href="/guides/installing-arduino-ide-esp32.html#usb-drivers">Resolve a missing USB device</a> before interpreting a sketch or upload error.</li>
  </ul>
  <p>The installation lesson prints <code>ESP32 upload OK</code>. The separate sketch below prints <code>Hello from ESP32</code> and matches the supplied Serial-session captures on this page.</p>

  <h2 id="first-sketch">Verify and upload the recorded Serial sketch</h2>
  <p>This recorded-session example needs only USB and Serial Monitor. It does not depend on an onboard LED or external circuit.</p>
  <pre><code>void setup() {
    Serial.begin(115200);
    delay(1000);
    Serial.println("ESP32 is running from Arduino IDE!");
  }

  void loop() {
    Serial.println("Hello from ESP32");
    delay(1000);
  }</code></pre>
  <ol>
    <li>Copy the sketch into Arduino IDE.</li>
    <li>Click <strong>Verify</strong> to compile for the selected board. A successful compile does not transfer firmware or test the physical circuit.</li>
    <li>Click <strong>Upload</strong> to compile and transfer firmware through the selected port. A successful transfer is separate from observing the expected program output.</li>
    <li>Wait for the upload to finish and the board to reset.</li>
  </ol>
  <p>A successful upload usually ends with a message similar to <code>Hard resetting via RTS pin</code>. The wording can vary by board and Arduino core version.</p>

  <h2 id="serial-monitor">Interpret the Serial Monitor messages</h2>
  <ol>
    <li>Open <strong>Tools > Serial Monitor</strong>.</li>
    <li>Set the baud rate to <strong>115200</strong>.</li>
    <li>Press the board's EN or RESET button if the first line does not appear.</li>
  </ol>
  <p>You should now see <code>ESP32 is running from Arduino IDE!</code>, followed by <code>Hello from ESP32</code> once per second. That proves the board package, board selection, port selection, upload process, and serial monitor are all working together.</p>

  <h2 id="understand-sketch">How setup() and loop() produce the output</h2>
  <div class="pin-table-wrap">
    <table class="pin-table pin-table-3">
      <thead><tr><th>Line</th><th>What it means</th><th>Why it matters</th></tr></thead>
      <tbody>
        <tr><td><code>setup()</code></td><td>Runs once after reset.</td><td>Good place to start Serial, configure pins, and print a ready message.</td></tr>
        <tr><td><code>Serial.begin(115200)</code></td><td>Starts serial communication at 115200 baud.</td><td>Serial Monitor must use the same baud rate.</td></tr>
        <tr><td><code>loop()</code></td><td>Runs repeatedly forever.</td><td>Most beginner ESP32 behavior starts here.</td></tr>
        <tr><td><code>delay(1000)</code></td><td>Waits for 1000 milliseconds.</td><td>Slows the messages so you can read them.</td></tr>
      </tbody>
    </table>
  </div>
  <p>Later projects replace the Serial message with GPIO output, button input, sensor readings, OLED display updates, Wi-Fi requests, and MQTT messages.</p>

  <h2 id="optional-blink">Next hardware check: an external LED</h2>
  <p>If your board has a documented user LED, you can blink it after Serial output works. Do not assume every ESP32 board uses GPIO2. Some boards use a different GPIO, and some have no user LED.</p>
  <p>For a reliable beginner hardware check, follow the dedicated <a href="/guides/blink-led-esp32.html">Blink an LED with ESP32</a> mission. It uses an external LED, a resistor, and a clear wiring diagram, so the result does not depend on a board-specific onboard LED.</p>

  <h2 id="troubleshooting">Common ESP32 Arduino IDE problems</h2>
  <div class="pin-table-wrap">
    <table class="pin-table pin-table-3">
      <thead><tr><th>Problem</th><th>Likely cause</th><th>Safest fix</th></tr></thead>
      <tbody>
        <tr><td>ESP32 board does not appear in Boards Manager</td><td>Board manager URL missing or mistyped.</td><td>Recheck the Espressif URL in Preferences, restart Arduino IDE, then search for esp32 again.</td></tr>
        <tr><td>No COM or serial port appears</td><td>Charge-only cable, missing driver, bad port, or unsupported USB adapter.</td><td>Try a known data cable, another USB port, and identify its actual USB bridge and install only its manufacturer driver if needed; CP210x, CH34x and FTDI adapters differ.</td></tr>
        <tr><td>Upload says Failed to connect</td><td>ESP32 did not enter bootloader mode.</td><td>For a documented classic BOOT/EN board, hold BOOT, tap EN, start upload, then release BOOT when writing begins. Lower upload speed if needed.</td></tr>
        <tr><td>Port busy or access denied</td><td>Serial Monitor, another IDE, or a terminal app is using the port.</td><td>Close Serial Monitor and other serial tools, unplug and reconnect the board, then upload again.</td></tr>
        <tr><td>Sketch compiles for the wrong chip</td><td>Wrong board selected.</td><td>Select the exact ESP32 family or a safe generic entry for your DevKit, then compile again.</td></tr>
        <tr><td>Serial Monitor shows unreadable text</td><td>Baud rate mismatch.</td><td>Set Serial Monitor to the same baud rate as <code>Serial.begin()</code>, usually 115200.</td></tr>
        <tr><td>Upload worked but no Serial output appears</td><td>Board did not reset, wrong baud rate, or native USB setting differs.</td><td>Press EN/RESET, check 115200 baud, and review USB CDC settings for native USB ESP32-S3 or C3 boards.</td></tr>
        <tr><td>Linux permission denied</td><td>User account cannot access serial devices.</td><td>Add your user to the serial or dialout group according to your distro, log out, and reconnect the board.</td></tr>
      </tbody>
    </table>
  </div>

  <h2 id="boot-reset">BOOT, EN and the upload stage</h2>
  <p>On the classic UART DevKit used here, EN resets the chip and BOOT selects the download-mode input during reset. An error while connecting to the bootloader is different from a compiler error that occurs before transfer.</p>
  <p>Use the <a href="/guides/installing-arduino-ide-esp32.html#upload-recovery">documented classic BOOT/EN recovery procedure</a> when appropriate for your board. Native USB C3/S2/S3 boards need their own documented settings; the classic sequence is not universal.</p>

  <h2 id="what-to-learn-next">What to learn next</h2>
  <p>Once Serial output works, follow a build-first path. Each step uses a real existing ESP32 Engine page:</p>
  <ol>
    <li><a href="/guides/what-is-esp32.html">Understand ESP32 basics</a> so 3.3 V GPIO and board families make sense.</li>
    <li><a href="/guides/blink-led-esp32.html">Blink an LED</a> to control a GPIO output safely.</li>
    <li><a href="/guides/button-led-control.html">Control an LED with a button</a> to read digital input.</li>
    <li><a href="/guides/digital-inputs-floating-pins.html">Learn floating pins</a>, then <a href="/guides/pull-up-vs-pull-down-resistors.html">pull-up and pull-down resistors</a>.</li>
    <li><a href="/guides/analog-inputs.html">Read analog inputs</a> and understand ADC limits.</li>
    <li><a href="/guides/read-temperature-dht22.html">Read a DHT11 temperature sensor</a> or explore <a href="/components/bme280.html">BME280</a> for weather data.</li>
    <li><a href="/guides/oled-display-esp32.html">Show values on an OLED display</a>.</li>
    <li>Build a complete project such as the <a href="/projects/esp32-iot-weather-station.html">ESP32 IoT Weather Station</a>, <a href="/projects/esp32-smart-thermostat.html">ESP32 Smart Thermostat</a>, or <a href="/projects/esp32-line-following-robot.html">ESP32 Line Following Robot</a>.</li>
  </ol>

  <h2 id="quick-checklist">Quick checklist before every upload</h2>
  <ul>
    <li>Correct board selected in <strong>Tools > Board</strong>.</li>
    <li>Correct port selected in <strong>Tools > Port</strong>.</li>
    <li>USB cable supports data.</li>
    <li>Serial Monitor is closed during upload.</li>
    <li>No external circuit is pulling BOOT strapping pins into the wrong state.</li>
    <li>Serial Monitor baud rate matches the sketch after upload.</li>
  </ul>
