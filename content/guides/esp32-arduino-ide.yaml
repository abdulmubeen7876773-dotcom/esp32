title: 'ESP32 Arduino IDE: Sketch and Serial Reference | ESP32 Engine'
headline: Understand ESP32 Sketches and Serial Output
meta_description: Understand ESP32 setup() and loop(), Verify versus Upload, and Serial Monitor output using
  a supplied Arduino IDE session and a matching USB-only sketch.
lead: Already completed the first upload? Read a matching Serial sketch, understand setup() and loop(), and
  separate compiler, upload and runtime output checks.
intro:
  story: Your first upload is working. Now connect each message in Serial Monitor to the sketch that produced
    it, and learn which checks happen at compilation, transfer and runtime.
  eli12: Arduino IDE is the app where you write small programs called sketches. The ESP32 board package teaches
    Arduino IDE how to compile those sketches for ESP32 boards and upload them through USB.
  safety:
  - text: Use a USB data cable, not a charge-only cable.
  - text: ESP32 GPIO pins use 3.3 V logic. Do not connect 5 V signals directly to GPIO pins.
  - text: Download Arduino IDE and the ESP32 board package only from official Arduino and Espressif sources.
