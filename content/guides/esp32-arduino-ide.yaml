headline: 'ESP32 with Arduino IDE: Complete Beginner Guide'
meta_description: Program ESP32 with Arduino IDE from zero. Install the ESP32 board package, select board and port, upload your first sketch, use Serial Monitor, and fix upload errors.
lead: Want to program your ESP32 from Arduino IDE? This guide takes you from a fresh setup to a successful upload, Serial Monitor output, and the next beginner project to build.
intro:
  story: 'You have an ESP32 board on the desk and Arduino IDE on your computer. This lesson turns that into a working upload path: install the tools, connect the board, send your first sketch, and know what to check when something does not appear.'
  eli12: 'Arduino IDE is the app where you write small programs called sketches. The ESP32 board package teaches Arduino IDE how to compile those sketches for ESP32 boards and upload them through USB.'
  safety:
  - text: Use a USB data cable, not a charge-only cable.
  - text: ESP32 GPIO pins use 3.3 V logic. Do not connect 5 V signals directly to GPIO pins.
  - text: Download Arduino IDE and the ESP32 board package only from official Arduino and Espressif sources.
