conclusion: Use the installation guide for first-time setup. This reference explains the separate Hello from
  ESP32 sketch, its recorded Serial session, setup() and loop(), and the difference between compiling, uploading
  and observing output. Continue to the external LED lesson when the USB-only checks work.
faqs:
- question: What is the difference between Verify and Upload?
  answer: Verify compiles for the selected board. Upload compiles and transfers firmware through the selected
    port. Observing the expected Serial output is a separate runtime check.
- question: Why is the first Serial message missing?
  answer: setup() prints once after reset, so the monitor may open too late to show its message. The loop repeats
    Hello from ESP32 once per second; check 115200 baud and reset the board when appropriate.
- question: Which sketch matches the supplied screenshots?
  answer: The USB-only Hello from ESP32 sketch on this page matches the recorded session. The installation
    guide uses a different ESP32 upload OK sketch. The captures record core 2.0.17, not a tested 3.3.2 upload.
- question: Does successful compilation prove the board is running the sketch?
  answer: No. Compilation checks the selected software target. Firmware transfer and the expected Serial output
    must be checked separately.
- question: Where are the full installation and USB recovery steps?
  answer: Use the Arduino IDE installation and first-upload guide linked in Setup prerequisites. It covers
    the board package, board/port selection, actual USB bridge and classic BOOT/EN recovery.
