conclusion: 'Start with the 3.3 V wiring, a suitable DATA pull-up, and a six-second sampling interval. Once the Serial Monitor readings are stable, continue to the guided DHT11 beginner build or adapt the sensor for a climate-control or MQTT project. Use a different sensor when your project needs pressure, faster updates, or tighter documented performance.'
faqs:
  - question: Is DHT11 the same sensor as DHT22 or AM2302?
    answer: No. DHT22 and AM2302 refer to a different sensor family. This page now uses DHT11; its historical URL is retained. Match the library type, pinout and supply requirements to your actual part.
  - question: Does every DHT11 module need an external pull-up resistor?
    answer: A bare four-pin sensor needs a pull-up on DATA. Many three-pin modules include one, but module designs vary; check its documentation or circuit before adding another resistor.
  - question: Which GPIO should I use for ESP32 DHT11 DATA?
    answer: This example uses GPIO4 on a common original ESP32 DevKit. GPIO availability varies across ESP32 boards, so confirm the pinout for your board and update DHT_PIN to match the wire.
  - question: Why does the DHT11 return NaN?
    answer: NaN means the library did not get a valid reading. Check the selected GPIO, VCC and GND, the DATA pull-up, the DHTTYPE setting, library installation, and the interval between reads.
  - question: How often should I read a DHT11?
    answer: The linked DHT11 manual specifies a period greater than two seconds and recommends more than five seconds between reads. This example waits six seconds. The separate 2000 ms cache in Adafruit DHT 1.4.6 is a library policy, not the sensor sampling specification.
  - question: Can the DHT11 measure air pressure?
    answer: No. It measures temperature and relative humidity. For pressure readings or pressure-based altitude estimates, use a sensor such as the BME280 instead.
