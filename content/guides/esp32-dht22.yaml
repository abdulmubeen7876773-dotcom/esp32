intro:
  story: 'A room sensor is a useful first step toward a climate monitor. The DHT22 gives your ESP32 two simple readings, but a reliable build depends on identifying the right pins and letting the sensor work at its own pace.'
  eli12: 'The DHT22 is a small digital sensor that reports how warm and humid the air is. The ESP32 asks it over one data wire, then prints the two readings on your computer.'
  safety:
