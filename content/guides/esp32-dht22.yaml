faqs:
  - question: Is DHT22 the same sensor as AM2302?
    answer: DHT22 and AM2302 are commonly used names for the same temperature-and-humidity sensor family. Physical packaging and breakout boards vary, so check the markings and documentation for the exact part you have.
  - question: Does every DHT22 module need an external pull-up resistor?
    answer: A bare four-pin sensor needs a pull-up on DATA. Many three-pin modules include one, but module designs vary; check its documentation or circuit before adding another resistor.
  - question: Which GPIO should I use for ESP32 DHT22 DATA?
    answer: This example uses GPIO4 on a common original ESP32 DevKit. GPIO availability varies across ESP32 boards, so confirm the pinout for your board and update DHT_PIN to match the wire.
  - question: Why does the DHT22 return NaN?
    answer: NaN means the library did not get a valid reading. Check the selected GPIO, VCC and GND, the DATA pull-up, the DHTTYPE setting, library installation, and the interval between reads.
  - question: How often should I read a DHT22?
    answer: Allow at least two seconds between measurements. The sensor updates slowly, and requesting readings more frequently can return an old value or cause a failed read.
  - question: Can the DHT22 measure air pressure?
    answer: No. It measures temperature and relative humidity. For pressure readings or pressure-based altitude estimates, use a sensor such as the BME280 instead.
