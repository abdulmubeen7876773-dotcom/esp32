title: ESP32 DHT11 Pinout, Limits and Troubleshooting | ESP32 Engine
headline: DHT11 Pin Identification, Limits and Troubleshooting
meta_description: Identify DHT11 sensor and module pins, check 3.3 V DATA pull-ups, understand sampling and diagnose
  NaN or unchanged readings. Links to the GPIO4 build and supplied code.
lead: Use this reference to identify your DHT11, check its power and DATA connections, and diagnose invalid or unchanged
  readings. Follow the linked GPIO4 lesson for assembly, the supplied two-second sketch and recorded results.
intro:
  story: A room sensor is a useful first step toward a climate monitor. The DHT11 gives your ESP32 two simple readings,
    but a reliable build depends on identifying the right pins and letting the sensor work at its own pace.
  eli12: The DHT11 is a small digital sensor that reports how warm and humid the air is. The ESP32 asks it over
    one data wire, then prints the two readings on your computer.
  safety:
  - text: Unplug the ESP32 before moving wires and check the pin labels on your exact sensor or module.
  - text: Keep the data pull-up at 3.3 V when it connects directly to an ESP32 GPIO; do not connect a 5 V pulled-up
      data line to the ESP32.
keywords: DHT11 pinout ESP32, DHT11 module pins, DHT11 NaN troubleshooting, DHT11 DATA pull-up, DHT11 sampling limits
primary_keyword: DHT11 pinout and troubleshooting
secondary_keywords: DHT11 module pin labels, DHT11 NaN, DHT11 unchanged readings, DHT11 electrical limits
proficiency_level: Beginner
date_published: '2026-10-01'
date_modified: '2026-11-04'
conclusion: Identify the exact sensor and module, verify the DATA pull-up and GPIO assignment, and check timing
  before diagnosing a failed reading. Use the linked DHT11 practical lesson for the complete build, supplied code
  and recorded results.
faqs:
- question: Is DHT11 the same sensor as DHT22 or AM2302?
  answer: No. DHT22 and AM2302 refer to a different sensor family. This page now uses DHT11; its historical URL
    is retained. Match the library type, pinout and supply requirements to your actual part.
- question: Does every DHT11 module need an external pull-up resistor?
  answer: A bare four-pin sensor needs a pull-up on DATA. Many three-pin modules include one, but module designs
    vary; check its documentation or circuit before adding another resistor.
- question: Which GPIO should I use for ESP32 DHT11 DATA?
  answer: The linked practical lesson uses GPIO4 on a classic ESP32 DevKit. Confirm that GPIO is exposed and available
    on your board, then match the library pin setting to the actual DATA wire.
- question: Why does the DHT11 return NaN?
  answer: NaN means the library did not get a valid reading. Check the selected GPIO, VCC and GND, the DATA pull-up,
    the DHTTYPE setting, library installation, and the interval between reads.
- question: How often should I read a DHT11?
  answer: The linked DHT11 manual specifies a period greater than two seconds and recommends more than five seconds
    between reads. This supplied example uses a two-second delay; that does not establish compliance with the manual
    recommendation. The separate 2000 ms cache in Adafruit DHT 1.4.6 is a library policy, not the sensor sampling
    specification.
- question: Can the DHT11 measure air pressure?
  answer: No. It measures temperature and relative humidity. For pressure readings or pressure-based altitude estimates,
    use a sensor such as the BME280 instead.
