headline: 'ESP32 DHT11 Reference: Pinout, Wiring and Troubleshooting'
meta_description: 'Learn how to wire a DHT11 to ESP32, install the Arduino library, read temperature and humidity, and troubleshoot common sensor errors.'
lead: 'Build a dependable ESP32 temperature-and-humidity reader with the DHT11. Identify the sensor pins, wire a bare sensor or module safely, install the Arduino library, and understand the complete sketch before extending it.'
intro:
  story: 'A room sensor is a useful first step toward a climate monitor. The DHT11 gives your ESP32 two simple readings, but a reliable build depends on identifying the right pins and letting the sensor work at its own pace.'
  eli12: 'The DHT11 is a small digital sensor that reports how warm and humid the air is. The ESP32 asks it over one data wire, then prints the two readings on your computer.'
  safety:
    - text: Unplug the ESP32 before moving wires and check the pin labels on your exact sensor or module.
    - text: Keep the data pull-up at 3.3 V when it connects directly to an ESP32 GPIO; do not connect a 5 V pulled-up data line to the ESP32.
