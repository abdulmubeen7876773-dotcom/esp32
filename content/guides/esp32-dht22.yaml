body_html: "<nav aria-label=\"On this page\"><p><strong>On this page:</strong> <a href=\"#identify-pins\">Pin identification</a>\
  \ · <a href=\"#wiring\">Wiring</a> · <a href=\"#arduino-setup\">Model selection</a> · <a href=\"#complete-code\"\
  >Get the sketch</a> · <a href=\"#serial-output\">Reading interpretation</a> · <a href=\"#troubleshooting\">Troubleshooting</a>\
  \ · <a href=\"#references\">References</a></p></nav>\n<p>This reference now uses DHT11 throughout. Its historical\
  \ URL is retained for existing links. For the step-by-step assembly lesson and existing video, use <a href=\"\
  /guides/read-temperature-dht22.html\">Read Temperature with DHT11</a>. The reference below concentrates on pin\
  \ identification, electrical assumptions and diagnosis.</p>\n<h2 id=\"what-dht22-measures\">What the DHT11 measures</h2>\n\
  <p>The DHT11 is a digital sensor for <strong>air temperature</strong> and <strong>relative humidity</strong>.\
  \ Its controller sends the measurements as a timed digital signal on one bidirectional data line. The ESP32 library\
  \ decodes that signal; this is not an analog sensor and it does not use the I2C bus.</p>\n<p>A DHT11 does not\
  \ measure barometric pressure, air quality, or altitude. It is useful for basic room, greenhouse, or classroom\
  \ monitoring, but its update rate is slow and readings depend on placement and the sensor's documented operating\
  \ conditions. Do not treat it as a precision instrument or as a fast feedback sensor. This reference assumes an\
  \ actual DHT11, a classic ESP32-WROOM DevKit exposing GPIO4, short breadboard leads, a USB data cable and a documented\
  \ 3.3 V-compatible sensor/module. Colour alone does not establish the sensor model.</p>\n\n<h2 id=\"dht22-am2302\"\
  >DHT11 is different from DHT22 and AM2302</h2>\n<p>DHT11 is not the same sensor as DHT22/AM2302. Match the actual\
  \ part to the library type. A bare four-pin sensor and a three-pin breakout can also have different physical pin\
  \ orders and power circuitry. Follow the exact part documentation and labels; do not infer the pinout from an\
  \ illustration.</p>\n\n<h2 id=\"identify-pins\">Identify the sensor pins</h2>\n<p>A common bare DHT11 package\
  \ has four pins: <strong>VDD/VCC</strong>, <strong>DATA</strong> (sometimes marked SDA), <strong>NC</strong> (no\
  \ connection), and <strong>GND</strong>. On the usual front view with the grille toward you and pins pointing\
  \ down, those pins are arranged left to right in that order. Check the datasheet for your exact sensor before\
  \ wiring because package drawings and clone markings can differ.</p>\n<p>Three-pin breakout boards typically label\
  \ the connections with some combination of <strong>VCC/+ </strong>, <strong>DATA/S/OUT</strong>, and <strong>GND/-</strong>.\
  \ A module's physical pin order is board-specific; follow its silkscreen or wiring diagram rather than copying\
  \ the bare sensor's left-to-right order. The <a href=\"/assets/visuals/guides/wiring/read-temperature-dht11-wiring.svg\"\
  >DHT11 wiring diagram</a> shows one example connection.</p>\n<div class=\"pin-table-wrap\">\n  <table class=\"\
  pin-table pin-table-3\">\n    <thead><tr><th>Sensor connection</th><th>ESP32 example</th><th>What to check</th></tr></thead>\n\
  \    <tbody>\n      <tr><td>VDD, VCC, or +</td><td>3V3</td><td>Use a bare sensor or module documented to operate\
  \ from 3.3 V for this direct-connection example.</td></tr>\n      <tr><td>DATA, SDA, S, OUT</td><td>GPIO4</td><td>The\
  \ linked practical lesson uses GPIO4 on a classic ESP32 DevKit. Match its DATA pin setting to a suitable GPIO\
  \ exposed by your board.</td></tr>\n      <tr><td>GND or -</td><td>GND</td><td>Sensor and ESP32 need a common\
  \ ground.</td></tr>\n      <tr><td>NC on a bare four-pin sensor</td><td>Leave unconnected</td><td>NC means no\
  \ connection. Do not use this pin as a second data line.</td></tr>\n    </tbody>\n  </table>\n</div>\n\n<h2 id=\"\
  wiring\">Check the connection pattern</h2>\n<p>Use the pin-identification table above to verify VCC, DATA, GND\
  \ and any unused NC pin on your exact part. For the ordered assembly steps, breadboard photograph and matching\
  \ GPIO4 wiring diagram, follow <a href=\"/guides/read-temperature-dht22.html#wiring\">the DHT11 practical lesson</a>.</p>\n\
  <h3 id=\"pullup\">DATA pull-up checks</h3>\n<p>DATA must have a suitable pull-up to 3.3 V for direct connection\
  \ to an ESP32. A module may already include that resistor; inspect its labels and documentation before adding\
  \ another. A printed SDA label does not make DHT11 an I2C sensor.</p>\n\n<h2 id=\"arduino-setup\">Check model\
  \ and library selection</h2>\n<p>Match the actual DHT11 part to <code>DHTTYPE DHT11</code> and use the DATA GPIO\
  \ you wired. A DHT22/AM2302 setting is not interchangeable. The <a href=\"/guides/read-temperature-dht22.html#code\"\
  >practical lesson</a> contains the library installation notes and the complete supplied sketch.</p>\n<h2 id=\"\
  complete-code\">Get the matching DHT11 sketch</h2>\n<p>Use the <a href=\"/guides/read-temperature-dht22.html#code\"\
  >complete two-second sketch in the practical lesson</a>, or <a href=\"/assets/downloads/guides/contributor-media-20261101/dht11_original_2s.ino\"\
  \ download>download that supplied original</a>. Keep its GPIO4 assignment, DHT11 model and Serial baud rate consistent\
  \ with your build. This reference does not maintain a second copy of the firmware.</p>\n<h2 id=\"code-explained\"\
  >Distinguish sensor timing from library caching</h2>\n<p>The linked DHT11 manual specifies a sampling period greater\
  \ than two seconds and recommends more than five seconds between reads. The contributor sketch retains its recorded\
  \ two-second delay. Separately, Adafruit DHT 1.4.6 caches requests within 2000 ms. A print interval, library cache\
  \ and physical sensor update are different things; repeated lines do not prove new measurements.</p>\n<h2 id=\"\
  serial-output\">Interpret reported values</h2>\n<p><code>NaN</code> or the failed-read message means a valid reading\
  \ was not obtained. A repeated numeric value can result from steady air conditions, the sensor response or library\
  \ caching. Printed decimal places do not establish sensor accuracy. Compare the <a href=\"/guides/read-temperature-dht22.html#recorded-media\"\
  >recorded Serial capture</a> with the supplied sketch before using the symptom checks below.</p>\n\n<h2 id=\"\
  troubleshooting\">DHT11 troubleshooting</h2>\n<h3 id=\"failed-readings\">Failed readings or NaN</h3>\n<ul>\n \
  \ <li>Verify <code>DHTPIN</code> matches the DATA wire and <code>DHTTYPE</code> is <code>DHT11</code>.</li>\n\
  \  <li>Check VCC, GND, common ground, loose breadboard rows, and the sensor/module's pin order.</li>\n  <li>For\
  \ a bare sensor, add a pull-up from DATA to 3.3 V. For a module, check whether its board already has a pull-up.</li>\n\
  \  <li>Use the supplied two-second example as recorded; check the exact sensor manual when selecting a measurement\
  \ interval.</li>\n  <li>Confirm the IDE installed Adafruit's DHT sensor library and Unified Sensor dependency,\
  \ and resolve duplicate <code>DHT.h</code> libraries if the compiler reports ambiguity.</li>\n</ul>\n<h3 id=\"\
  wrong-values\">Readings look wrong or stay unchanged</h3>\n<ul>\n  <li>Confirm the part is DHT11 and DHTTYPE is\
  \ DHT11; do not use DHT22 timing for this sensor.</li>\n  <li>Check the exact pin labels and verify the bare sensor\
  \ or module pin order against its own documentation.</li>\n  <li>Do not power an undocumented module from an assumed\
  \ voltage, and make sure the DATA pull-up does not expose the ESP32 GPIO to 5 V.</li>\n  <li>Give the sensor time\
  \ to respond to changes. Avoid touching the sensing grille, breathing directly on it, or placing it beside warm\
  \ ESP32 components.</li>\n  <li>Read at the supported pace; the library may return a cached earlier reading if\
  \ asked too soon.</li>\n</ul>\n\n<p>Printed decimal places are formatting, not evidence of 0.1-degree accuracy.\
  \ Repeated values are normal in steady room conditions; the supplied build records are not a calibration test.</p>\n\
  \n<h2 id=\"limits\">Limitations and choosing a different sensor</h2>\n<p>The DHT11 is a useful learning sensor\
  \ for basic temperature and humidity logging, but it updates slowly and has no pressure measurement. Choose a\
  \ BME280 if pressure or pressure-based altitude estimation matters. For faster response, a different sensor may\
  \ be a better fit; check the model's documented update rate, accuracy, interface, and electrical requirements\
  \ before choosing it.</p>\n\n<h2 id=\"references\">Technical references</h2>\n<ul><li><a href=\"https://seeeddoc.github.io/Grove-Temperature_and_Humidity_Sensor/res/DHT11.pdf\"\
  >Aosong DHT11 manual hosted by Seeed</a>: pinout, documented supply, pull-ups and sampling.</li><li><a href=\"\
  https://github.com/adafruit/DHT-sensor-library/blob/1.4.6/DHT.cpp\">Adafruit DHT 1.4.6 implementation</a>: sensor\
  \ handling and separate read caching.</li><li><a href=\"https://github.com/adafruit/Adafruit_Sensor/tree/1.1.15\"\
  >Adafruit Unified Sensor 1.1.15</a>: reviewed dependency.</li><li><a href=\"https://github.com/espressif/arduino-esp32/tree/3.3.2\"\
  >Arduino-ESP32 3.3.2</a>: core review baseline.</li></ul>\n<h2 id=\"next-steps\">What to build next</h2>\n<ul>\n\
  \  <li>Follow the <a href=\"/guides/read-temperature-dht22.html\">DHT11 hands-on mission</a> to practice sensor\
  \ reads, timing, and error handling.</li>\n  <li>This separate project uses DHT22; review its hardware before\
  \ adapting a DHT11 sketch for <a href=\"/projects/esp32-home-climate-automation.html\">ESP32 home climate automation</a>.</li>\n\
  \  <li>After the serial readings are reliable, explore the <a href=\"/projects/esp32-mqtt-sensor-dashboard.html\"\
  >ESP32 MQTT sensor dashboard</a> or add an OLED using the <a href=\"/guides/connect-oled-esp32.html\">ESP32 OLED\
  \ guide</a>.</li>\n  <li>If your project needs barometric pressure, continue to the <a href=\"/guides/esp32-bme280.html\"\
  >ESP32 BME280 complete guide</a>.</li>\n</ul>\n"
