body_html: |
  <nav aria-label="On this page"><p><strong>On this page:</strong> <a href="#identify-pins">Pin identification</a> · <a href="#wiring">Wiring</a> · <a href="#arduino-setup">Setup</a> · <a href="#complete-code">Code</a> · <a href="#serial-output">Expected output</a> · <a href="#troubleshooting">Troubleshooting</a> · <a href="#references">References</a></p></nav>
  <p>This reference now uses DHT11 throughout. Its historical URL is retained for existing links. For the step-by-step assembly lesson and existing video, use <a href="/guides/read-temperature-dht22.html">Read Temperature with DHT11</a>. The reference below concentrates on pin identification, electrical assumptions and diagnosis.</p>
  <h2 id="what-dht22-measures">What the DHT11 measures</h2>
  <p>The DHT11 is a digital sensor for <strong>air temperature</strong> and <strong>relative humidity</strong>. Its controller sends the measurements as a timed digital signal on one bidirectional data line. The ESP32 library decodes that signal; this is not an analog sensor and it does not use the I2C bus.</p>
  <p>A DHT11 does not measure barometric pressure, air quality, or altitude. It is useful for basic room, greenhouse, or classroom monitoring, but its update rate is slow and readings depend on placement and the sensor's documented operating conditions. Do not treat it as a precision instrument or as a fast feedback sensor. This reference assumes an actual DHT11, a classic ESP32-WROOM DevKit exposing GPIO4, short breadboard leads, a USB data cable and a documented 3.3 V-compatible sensor/module. Colour alone does not establish the sensor model.</p>

  <h2 id="dht22-am2302">DHT11 is different from DHT22 and AM2302</h2>
  <p>DHT11 is not the same sensor as DHT22/AM2302. Match the actual part to the library type. A bare four-pin sensor and a three-pin breakout can also have different physical pin orders and power circuitry. Follow the exact part documentation and labels; do not infer the pinout from an illustration.</p>

  <h2 id="identify-pins">Identify the sensor pins</h2>
  <p>A common bare DHT11 package has four pins: <strong>VDD/VCC</strong>, <strong>DATA</strong> (sometimes marked SDA), <strong>NC</strong> (no connection), and <strong>GND</strong>. On the usual front view with the grille toward you and pins pointing down, those pins are arranged left to right in that order. Check the datasheet for your exact sensor before wiring because package drawings and clone markings can differ.</p>
  <p>Three-pin breakout boards typically label the connections with some combination of <strong>VCC/+ </strong>, <strong>DATA/S/OUT</strong>, and <strong>GND/-</strong>. A module's physical pin order is board-specific; follow its silkscreen or wiring diagram rather than copying the bare sensor's left-to-right order. The <a href="/assets/visuals/guides/wiring/read-temperature-dht11-wiring.svg">DHT11 wiring diagram</a> shows one example connection.</p>
  <div class="pin-table-wrap">
    <table class="pin-table pin-table-3">
      <thead><tr><th>Sensor connection</th><th>ESP32 example</th><th>What to check</th></tr></thead>
      <tbody>
        <tr><td>VDD, VCC, or +</td><td>3V3</td><td>Use a bare sensor or module documented to operate from 3.3 V for this direct-connection example.</td></tr>
        <tr><td>DATA, SDA, S, OUT</td><td>GPIO4</td><td>The code uses GPIO4 on a common original ESP32 DevKit; change DHT_PIN if your board or wiring uses another suitable GPIO.</td></tr>
        <tr><td>GND or -</td><td>GND</td><td>Sensor and ESP32 need a common ground.</td></tr>
        <tr><td>NC on a bare four-pin sensor</td><td>Leave unconnected</td><td>NC means no connection. Do not use this pin as a second data line.</td></tr>
      </tbody>
    </table>
  </div>

  <h2 id="wiring">ESP32 DHT11 wiring</h2>
  <ol>
    <li>Disconnect USB before wiring.</li>
    <li>Connect the sensor's VDD/VCC to ESP32 3V3, but only if the exact sensor or module documentation allows a 3.3 V supply.</li>
    <li>Connect GND to ESP32 GND.</li>
    <li>Connect DATA to GPIO4 for the example code below. Confirm GPIO4 is available on your board; otherwise select a board-appropriate digital GPIO and change <code>DHT_PIN</code>.</li>
    <li>Leave the bare sensor's NC pin unconnected.</li>
    <li>Check whether DATA already has a pull-up resistor before adding one. Keep the pull-up voltage at 3.3 V for a direct ESP32 connection.</li>
  </ol>
  <figure style="margin:1rem auto;max-width:900px"><img src="/assets/visuals/guides/wiring/read-temperature-dht11-wiring.svg" alt="DHT11 connected to an ESP32: VCC to 3.3 volts, ground to ground, and data to GPIO4 with a pull-up to 3.3 volts" width="1600" height="900" loading="lazy" decoding="async" style="display:block;width:100%;height:auto"><figcaption>Conceptual wiring illustration, not a verified physical module layout. Bare sensors need the pull-up; modules may include one. Follow your exact part labels.</figcaption></figure>

  <h3 id="pullup">Why the DATA pull-up matters</h3>
  <p>The DHT11's one-wire data line is released between signals, so it needs a pull-up to return to a HIGH level. A bare sensor normally needs an external resistor between DATA and its supply. The manufacturer shows 5.1 kΩ as a typical pull-up for short connections; Adafruit's example uses 10 kΩ. For this ESP32 example, connect the pull-up to <strong>3.3 V</strong>, not 5 V.</p>
  <p>Many three-pin modules include a pull-up on the small board, but this is not guaranteed. Check the module documentation or circuit. If a pull-up is already present, an additional resistor may be unnecessary. Never allow a 5 V pull-up to drive an ESP32 GPIO directly. The exact bare-sensor electrical limits and timing are in the <a href="https://seeeddoc.github.io/Grove-Temperature_and_Humidity_Sensor/res/DHT11.pdf" target="_blank" rel="noopener noreferrer">manufacturer's DHT11 manual</a>.</p>

  <h2 id="arduino-setup">Arduino IDE and library setup</h2>
  <p>Review baseline: <strong>Arduino-ESP32 3.3.2</strong>, <strong>Adafruit DHT sensor library 1.4.6</strong> and <strong>Adafruit Unified Sensor 1.1.15</strong>. These are reviewed versions, not latest-release claims. Compilation and physical hardware testing were not performed for this update.</p>
  <p>The linked DHT11 manual permits 3.3–5.5 V for that revision, but other revisions/modules can specify a higher minimum. Use the direct circuit only for a documented 3.3 V-compatible part, with DATA pulled up to 3.3 V. Otherwise use a documented compatible signal interface; do not simply change this circuit to 5 V. A module regulator does not prove its DATA level is safe.</p>
  <ol>
    <li>Install the ESP32 board package and verify you can upload a simple sketch. Follow the <a href="/guides/esp32-arduino-ide.html">ESP32 Arduino IDE setup guide</a> if you have not configured the IDE.</li>
    <li>Open <strong>Sketch → Include Library → Manage Libraries</strong>.</li>
    <li>Search for <strong>DHT sensor library</strong> by Adafruit and install it. Also install <strong>Adafruit Unified Sensor</strong> if Library Manager does not install it as a dependency.</li>
    <li>Select your ESP32 board and port. Match <code>DHT_PIN</code> to the GPIO connected to DATA and keep <code>DHT_TYPE</code> set to <code>DHT11</code>.</li>
    <li>Upload the sketch, then open Serial Monitor at <strong>115200 baud</strong>.</li>
  </ol>
  <p>The library and its current dependencies are documented in the <a href="https://github.com/adafruit/DHT-sensor-library/tree/1.4.6" target="_blank" rel="noopener noreferrer">Adafruit DHT sensor library repository</a>. Avoid installing multiple libraries that provide a different <code>DHT.h</code> header; that can cause compile errors or inconsistent behavior.</p>

  <h2 id="complete-code">Complete ESP32 DHT11 Arduino code</h2>
  <pre><code>
    #include &lt;Arduino.h&gt;
    #include &lt;DHT.h&gt;

    // Example for a common original ESP32 DevKit. Match this to your wiring.
    const uint8_t DHT_PIN = 4;
    #define DHT_TYPE DHT11

    DHT dht(DHT_PIN, DHT_TYPE);

    void setup() {
      Serial.begin(115200);
      dht.begin();

      // Let the sensor settle before the first measurement.
      delay(6000);
      Serial.println("ESP32 DHT11 reader ready");
    }

    void loop() {
      const float humidity = dht.readHumidity();
      const float temperatureC = dht.readTemperature();

      if (isnan(humidity) || isnan(temperatureC)) {
        Serial.println("Failed to read from DHT sensor; check wiring and settings.");
      } else {
        Serial.print("Temperature: ");
        Serial.print(temperatureC, 1);
        Serial.println(" °C");

        Serial.print("Humidity: ");
        Serial.print(humidity, 1);
        Serial.println(" %");
      }

      // Wait six seconds: more than the linked manual's five-second recommendation.
      delay(6000);
    }</code></pre>

  <h2 id="code-explained">How the code works</h2>
  <ul>
    <li><strong><code>DHT_PIN</code>:</strong> the ESP32 GPIO connected to the sensor's DATA line. If you change the wire, update this constant too.</li>
    <li><strong><code>DHT_TYPE</code>:</strong> tells the library to use DHT11 timing rather than another DHT model.</li>
    <li><strong><code>dht.begin()</code>:</strong> initializes the library for the selected sensor and pin.</li>
    <li><strong>First-read wait and loop delay:</strong> wait six seconds at startup and between loop iterations. The DHT11 manual specifies greater than two seconds and recommends more than five seconds between reads. Separately, Adafruit DHT 1.4.6 caches requests made within 2000 ms; the humidity and temperature calls can reuse one transaction. That cache is not the sensor sampling specification.</li>
    <li><strong><code>readTemperature()</code>:</strong> returns Celsius by default. <code>readTemperature(true)</code> requests Fahrenheit if you need it.</li>
    <li><strong><code>readHumidity()</code>:</strong> returns relative humidity as a percentage.</li>
    <li><strong><code>isnan()</code>:</strong> detects an invalid reading so the sketch can report an error instead of printing a misleading number.</li>
  </ul>

  <h2 id="serial-output">Serial Monitor output</h2>
  <p>Choose <strong>115200 baud</strong> in Serial Monitor to match <code>Serial.begin(115200)</code>. The following is illustrative output, not recorded hardware measurements; your room's values will differ:</p>
  <pre><code>ESP32 DHT11 reader ready
  Temperature: 24.0 °C
  Humidity: 58.0 %</code></pre>
  <p>If you see the failure message or <code>nan</code>, the reading did not succeed. Use the checks below before changing the library or repeatedly resetting the board.</p>

  <h2 id="troubleshooting">DHT11 troubleshooting</h2>
  <h3 id="failed-readings">Failed readings or NaN</h3>
  <ul>
    <li>Verify <code>DHT_PIN</code> matches the DATA wire and <code>DHT_TYPE</code> is <code>DHT11</code>.</li>
    <li>Check VCC, GND, common ground, loose breadboard rows, and the sensor/module's pin order.</li>
    <li>For a bare sensor, add a pull-up from DATA to 3.3 V. For a module, check whether its board already has a pull-up.</li>
    <li>Keep the six-second startup wait and six-second loop interval in this example.</li>
    <li>Confirm the IDE installed Adafruit's DHT sensor library and Unified Sensor dependency, and resolve duplicate <code>DHT.h</code> libraries if the compiler reports ambiguity.</li>
  </ul>
  <h3 id="wrong-values">Readings look wrong or stay unchanged</h3>
  <ul>
    <li>Confirm the part is DHT11 and DHT_TYPE is DHT11; do not use DHT22 timing for this sensor.</li>
    <li>Check the exact pin labels and verify the bare sensor or module pin order against its own documentation.</li>
    <li>Do not power an undocumented module from an assumed voltage, and make sure the DATA pull-up does not expose the ESP32 GPIO to 5 V.</li>
    <li>Give the sensor time to respond to changes. Avoid touching the sensing grille, breathing directly on it, or placing it beside warm ESP32 components.</li>
    <li>Read at the supported pace; the library may return a cached earlier reading if asked too soon.</li>
  </ul>

  <p>Printed decimal places are formatting, not evidence of 0.1-degree accuracy. Repeated values are normal in steady room conditions; this example is not a calibration test.</p>

  <h2 id="limits">Limitations and choosing a different sensor</h2>
  <p>The DHT11 is a useful learning sensor for basic temperature and humidity logging, but it updates slowly and has no pressure measurement. Choose a BME280 if pressure or pressure-based altitude estimation matters. For faster response, a different sensor may be a better fit; check the model's documented update rate, accuracy, interface, and electrical requirements before choosing it.</p>

  <h2 id="references">Technical references</h2>
  <ul><li><a href="https://seeeddoc.github.io/Grove-Temperature_and_Humidity_Sensor/res/DHT11.pdf">Aosong DHT11 manual hosted by Seeed</a>: pinout, documented supply, pull-ups and sampling.</li><li><a href="https://github.com/adafruit/DHT-sensor-library/blob/1.4.6/DHT.cpp">Adafruit DHT 1.4.6 implementation</a>: sensor handling and separate read caching.</li><li><a href="https://github.com/adafruit/Adafruit_Sensor/tree/1.1.15">Adafruit Unified Sensor 1.1.15</a>: reviewed dependency.</li><li><a href="https://github.com/espressif/arduino-esp32/tree/3.3.2">Arduino-ESP32 3.3.2</a>: core review baseline.</li></ul>
  <h2 id="next-steps">What to build next</h2>
  <ul>
    <li>Follow the <a href="/guides/read-temperature-dht22.html">DHT11 hands-on mission</a> to practice sensor reads, timing, and error handling.</li>
    <li>This separate project uses DHT22; review its hardware before adapting the DHT11 example for <a href="/projects/esp32-home-climate-automation.html">ESP32 home climate automation</a>.</li>
    <li>After the serial readings are reliable, explore the <a href="/projects/esp32-mqtt-sensor-dashboard.html">ESP32 MQTT sensor dashboard</a> or add an OLED using the <a href="/guides/connect-oled-esp32.html">ESP32 OLED guide</a>.</li>
    <li>If your project needs barometric pressure, continue to the <a href="/guides/esp32-bme280.html">ESP32 BME280 complete guide</a>.</li>
  </ul>
