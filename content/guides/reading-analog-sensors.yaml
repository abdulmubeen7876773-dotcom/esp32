    "component_spotlight_lead": "The LDR is a simple analog sensor: light changes resistance, and the voltage divider converts that resistance change into a voltage the ESP32 can read.",
    "concept": {
      "title": "Sensors Turn Conditions into Signals",
      "image": "/assets/visuals/guides/concepts/reading-analog-sensors-concept.svg",
      "illustration_alt": "ESP32 reading an LDR voltage divider on GPIO34 while light changes the ADC value",
      "body": "The ESP32 cannot see light directly. It can only read electrical signals.\n\nAn LDR changes resistance when light changes. A resistor divider converts that changing resistance into a changing voltage. The ADC converts that voltage into a number.\n\nThat chain is the core idea of analog sensing: real world change, electrical change, digital number, software decision."
    },
    "engineering_explanation": "For the wiring shown, the LDR is above the divider midpoint and the fixed 10 kΩ resistor is below it. Vout = V3V3 × Rfixed / (RLDR + Rfixed). A typical LDR has lower resistance in brighter light, so this arrangement produces higher midpoint voltage and usually higher ADC counts in bright light. Darkness lowers the count. Reversing the two divider parts reverses that trend.\n\nUse raw readings to characterize your own bright/dark conditions before setting LIGHT_THRESHOLD. The value 2000 is illustrative, not calibrated lux or a universal light boundary. This sketch configures 12-bit ADC resolution and 11 dB attenuation explicitly. Classic ESP32's documented useful range at that attenuation is approximately 150–3100 mV; a 3V3-powered divider can saturate near an endpoint. Attenuation is not overvoltage protection.\n\nUse GPIO34 (ADC1) when adding Wi-Fi on the classic chip; its ADC2 sharing restriction is not universal to all ESP32 families. Noise can cause a single-threshold decision to chatter. Start by inspecting wiring and raw counts, then use the existing hysteresis or moving-average lesson if the application needs steadier decisions. Relative bright/dark characterization is not calibrated illuminance measurement.",
    "real_life_analogy": "Think of a weather thermometer. The outside world changes gradually, but you still need a number before you can make a decision such as 'wear a jacket.'\n\nAn analog sensor does the same kind of translation. The LDR does not tell the ESP32 'sunny' or 'dark.' It changes an electrical value. Your code decides what that value means.\n\nCharacterizing the range is like learning a new person's handwriting. You do not guess from one mark. You look at examples, learn the range, and then read it with confidence.",
