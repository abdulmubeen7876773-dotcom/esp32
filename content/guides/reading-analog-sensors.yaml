    "code": {
      "filename": "ldr_light_sensor_threshold.ino",
      "notes": "LDR to 3V3; fixed 10 kΩ to GND; midpoint on GPIO34. With this topology bright light normally increases counts. The 2000-count threshold is illustrative; characterize your own conditions. Core 3.3.2, 12-bit ADC and 11 dB attenuation; no extra library.",
      "content": "const int LDR_PIN = 34;\n\nconst int LIGHT_THRESHOLD = 2000;\n\nvoid setup() {\n  Serial.begin(115200);\n  analogReadResolution(12);\n  analogSetPinAttenuation(LDR_PIN, ADC_11db);\n  delay(500);\n\n  Serial.println(\"Mission 09: Analog light sensor ready\");\n  Serial.println(\"Cover the LDR, then shine light on it, and watch the raw values.\");\n}\n\nvoid loop() {\n  int rawLight = analogRead(LDR_PIN);\n\n  Serial.print(\"Light ADC: \");\n  Serial.print(rawLight);\n\n  if (rawLight < LIGHT_THRESHOLD) {\n    Serial.println(\"  |  DARK\");\n  } else {\n    Serial.println(\"  |  BRIGHT\");\n  }\n\n  delay(250);\n}\n"
    },
