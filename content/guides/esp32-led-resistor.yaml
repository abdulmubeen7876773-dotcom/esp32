faqs:
- question: Is 220 ohms correct for every ESP32 LED?
  answer: No. Calculate with actual output conditions, LED specification and permitted current. The linked Blink
    circuit states one indicator example.
- question: Can I use one resistor for parallel LEDs?
  answer: Do not apply this single-LED example unchanged. Separate branches generally need separate current limiting;
    design for the actual driver and load.
