faqs:
  - question: Can I power the DHT11 from 5 V with an ESP32?
    answer: This circuit assumes a documented 3.3 V-compatible DHT11/module with DATA pulled up to 3.3 V. Some revisions specify a higher minimum supply; check the actual part. A 5 V-powered module may pull DATA to 5 V and require suitable signal-level interfacing. Do not simply change this circuit’s supply to 5 V.
  - question: Why does the DHT11 sometimes return NaN?
    answer: NaN means the library did not receive a valid reading. The usual causes are wrong pin number, missing pull-up resistor, loose jumper wires, incorrect library, or reading faster than the sensor can update.
  - question: Can I use a DHT22 instead?
    answer: Yes. Change DHTTYPE to DHT22 and follow the separate DHT22 reference guide at /guides/esp32-dht22.html. This mission and its code use DHT11.
  - question: Which ESP32 GPIO should I use for DHT11 data?
    answer: GPIO4 is a safe beginner choice. GPIO16, GPIO17, GPIO18, GPIO19, GPIO21, GPIO22, GPIO23, GPIO25, GPIO26, and GPIO27 can also work. Avoid boot strapping pins until you understand their startup behavior.
mission:
  badge: Mission 2
  icon: 🌡
  title: Teach Your ESP32 to Feel the Weather
  story: |
    Your ESP32 already knows how to blink an LED. Now it needs a sense of the room around it.

    The DHT11 is a beginner-friendly digital sensor that measures air temperature and relative humidity. It is used in small weather stations, room comfort monitors, greenhouse controllers, smart thermostats, and school science projects.

    In this mission you will connect the DHT11 to one ESP32 GPIO pin, read live values in Serial Monitor, and learn why sensor timing, pull-up resistors, and clean power matter.
  eli12: |
    The DHT11 is like a tiny weather reporter. It has power, ground, and one data wire. The ESP32 asks, "What is the room like right now?" and the sensor replies with two numbers: temperature and humidity.

    Humidity means how much water vapor is in the air. High humidity can feel sticky. Low humidity can feel dry. Temperature tells you how warm the air is.
  what_you_build: |
    - A breadboard circuit with a DHT11 connected to ESP32 GPIO4.
    - Arduino code that reads humidity and temperature every 6 seconds.
    - Serial Monitor output that shows real room values.
    - A safe troubleshooting checklist for the most common DHT11 problems.
  things_you_need:
    - item: ESP32 DevKit board
      note: Classic ESP32-WROOM DevKit / ESP32 Dev Module. This guide uses GPIO4; other families require their own pin check.
      link: /components/esp32-devkit.html
      icon: 🖥
    - item: DHT11 temperature and humidity sensor module
      note: A 3-pin module is easiest because it usually includes the pull-up resistor.
      icon: 🌡
    - item: 10 k ohm resistor
      note: Only required if you use a bare 4-pin DHT11 sensor without a module board.
      icon: 🎚
    - item: Breadboard
      note: Half-size breadboard is enough.
      icon: 🧩
    - item: Jumper wires
      note: Use short, firm male-to-male wires for stable readings.
      icon: 🔗
    - item: USB data cable
      note: Charge-only cables can power the board but cannot upload code.
      icon: 🔌
  safety:
    - text: Use a DHT11 sensor/module whose own documentation supports 3.3 V supply, with DATA pulled up to 3.3 V. The linked Aosong manual supports this supply, but other revisions may specify a higher minimum; do not assume all modules match.
    - text: Do not connect a 5 V pulled-up data signal to an ESP32 input pin.
    - text: Unplug USB before moving wires on the breadboard.
    - text: Keep water, soil, and condensation away from the ESP32 and breadboard.
  component_spotlight_lead: "These two parts do most of the work: the ESP32 reads the signal, and the DHT11 measures the air."
  concept:
    title: How the DHT11 Actually Works

    image: /assets/visuals/guides/concepts/read-temperature-dht11-concept.svg
    illustration_alt: DHT11 data line connected to ESP32 GPIO4 with 3.3 V, ground, and a pull-up resistor
    body: |
      The DHT11 is a digital temperature and humidity sensor. Inside the package are a humidity sensing element, a temperature sensor, and a small controller that converts the measurement into a digital signal.

      It does not behave like an analog sensor. The ESP32 cannot use analogRead() here. Instead, the ESP32 sends a start signal on one GPIO pin. The DHT11 replies by pulling that same data line HIGH and LOW in a timed pattern. The Arduino DHT library measures those pulses and converts them into humidity and temperature values.

      The data line needs a pull-up resistor so it normally rests at 3.3 V. Many DHT11 modules already include this resistor. A bare DHT11 sensor usually needs an external 10 k ohm resistor between DATA and 3.3 V.

      The linked Aosong DHT11 manual specifies a sampling period greater than 2 seconds and recommends more than 5 seconds between reads for accurate data. This example waits 6 seconds. Separately, Adafruit DHT 1.4.6 returns its cached result if another read is requested within 2000 ms. That library limit does not establish the sensor’s sampling specification or guarantee a new physical measurement on every line. The DHT11 provides coarse readings; showing a decimal digit does not imply greater sensor accuracy.
  wiring:
    illustration_alt: DHT11 VCC to ESP32 3.3 V, GND to ESP32 GND, DATA to ESP32 GPIO4, optional 10 k ohm pull-up from DATA to 3.3 V
    image: /assets/visuals/guides/wiring/read-temperature-dht11-wiring.svg
    steps:
      - Unplug the ESP32 USB cable before wiring.
      - Place the DHT11 module on the breadboard so each pin has its own row. Follow its printed labels; module pin order varies.
      - For a bare 4-pin sensor viewed from the front grille, pins left to right are VCC, DATA, NC, and GND.
      - Connect DHT11 VCC or + to ESP32 3.3 V.
      - Connect DHT11 GND or - to ESP32 GND.
      - Connect DHT11 DATA or OUT to ESP32 GPIO4.
      - If you are using a bare 4-pin DHT11, add a 10 k ohm resistor from DATA to 3.3 V.
      - Leave the unused NC pin on a bare DHT11 disconnected.
      - In Arduino IDE, install "DHT sensor library" by Adafruit and "Adafruit Unified Sensor" from Library Manager.
  code:
    filename: dht11_esp32_room_sensor.ino
    notes: |
      - DHTPIN must match the GPIO you wired to the DATA pin.
      - DHTTYPE must be DHT11 to match the sensor used in this mission and video.
      - Review baseline: classic ESP32-WROOM, Arduino-ESP32 3.3.2, Adafruit DHT sensor library 1.4.6 and Adafruit Unified Sensor. This is not a latest-release claim.
      - The code waits 6 seconds between reads, exceeding the linked DHT11 manual’s greater-than-2-second minimum and more-than-5-second recommendation. The library’s separate cache interval is 2000 ms.
      - Humidity and temperature calls use the same cached transaction; do not force repeated reads to bypass timing.
      - Documentation review only; compilation and hardware testing were not performed.
      - isnan() protects your program from printing bad values when a read fails.
    content: |
      #include "DHT.h"

      // DHT11 data pin connected to ESP32 GPIO4.
      #define DHTPIN 4

      // Tell the library which DHT sensor model you are using.
      #define DHTTYPE DHT11

      DHT dht(DHTPIN, DHTTYPE);

      void setup() {
        Serial.begin(115200);
        delay(6000);

        dht.begin();
        Serial.println("DHT11 ESP32 room sensor ready");
        Serial.println("Reading every 6 seconds...");
      }

      void loop() {
        float humidity = dht.readHumidity();
        float temperatureC = dht.readTemperature();
        float temperatureF = dht.readTemperature(true);

        if (isnan(humidity) || isnan(temperatureC) || isnan(temperatureF)) {
          Serial.println("Read failed. Check wiring, power, pull-up resistor, and library setup.");
          delay(6000);
          return;
        }

        float heatIndexC = dht.computeHeatIndex(temperatureC, humidity, false);

        Serial.print("Temperature: ");
        Serial.print(temperatureC, 1);
        Serial.print(" C / ");
        Serial.print(temperatureF, 1);
        Serial.print(" F  |  Humidity: ");
        Serial.print(humidity, 1);
        Serial.print(" %  |  Heat index: ");
        Serial.print(heatIndexC, 1);
        Serial.println(" C");

        delay(6000);
      }
  expected_output: |
    Open Serial Monitor at 115200 baud. After the startup delay, readings appear about every 6 seconds. Illustrative output, not a recorded measurement:

    Temperature: 24.0 C / 75.2 F  |  Humidity: 55.0 %  |  Heat index: 23.9 C

    Warm the sensor gently with your hand or breathe near it from a short distance. Temperature or humidity should change slowly. Do not touch the sensor grill or expose the board to moisture.
  quiz:
    - question: Why does this DHT11 example wait 6 seconds between reads?
      options:
        - It respects the linked sensor manual; the library cache is a separate limit
        - The ESP32 cannot run faster than that
        - Serial Monitor only updates every 6 seconds
      correct: 0
      explanation: The manufacturer manual specifies more than 2 seconds and recommends more than 5 seconds. The sketch waits 6 seconds; Adafruit 1.4.6 separately caches calls within 2000 ms. A cache policy is not the sensor specification.
    - question: What does NaN mean in the Serial output?
      options:
        - The reading failed, usually because of wiring, timing, or library setup
        - The room temperature is zero
        - The sensor is measuring humidity perfectly
      correct: 0
      explanation: NaN means Not a Number. The library could not decode a valid measurement from the sensor.
    - question: Why does the DATA pin need a pull-up resistor?
      options:
        - It keeps the data line stable when the sensor is not pulling it low
        - It converts humidity into voltage
        - It makes the ESP32 Wi-Fi stronger
      correct: 0
      explanation: The pull-up resistor holds the one-wire data line HIGH so the timed pulses can be read cleanly.
  challenge_items:
    - icon: ⚠
      text: Print "Too warm" when temperature is above 28 C.
    - icon: 💧
      text: Print "Very humid" when humidity is above 70 percent.
    - icon: 📊
      text: Average five readings before printing to make the output calmer.
    - icon: 🖥
      text: Combine this with the OLED mission and show the values on a display.
  common_problems:
    - problem: Serial Monitor says "Read failed"
      cause: DATA is on the wrong GPIO, DHTTYPE does not match the sensor, the pull-up resistor is missing, or the sensor is being read too quickly.
      fix: Confirm DHTTYPE is DHT11 and DATA goes to GPIO4, use 3.3 V and GND, add a 10 k ohm pull-up for a bare sensor, and keep delay(6000).
    - problem: Code does not compile because DHT.h is missing
      cause: The Adafruit DHT library is not installed, or the wrong library was installed.
      fix: Open Arduino IDE Library Manager and install "DHT sensor library" by Adafruit plus "Adafruit Unified Sensor".
    - problem: Values are unrealistic or stuck
      cause: Loose jumper wires, poor breadboard contact, heat from your fingers, or airflow directly onto the sensor.
      fix: Reseat the wires, keep the sensor away from the warm ESP32 board, and wait a few readings for the value to settle.
    - problem: ESP32 uploads fail after wiring the sensor
      cause: The sensor may be connected to a boot strapping pin or a wiring mistake may pull a pin into the wrong state during reset.
      fix: Use GPIO4 for this beginner circuit and disconnect power before rewiring.
    - problem: Sensor works on Arduino Uno examples but not ESP32
      cause: Some examples use 5 V assumptions or a different pin number.
      fix: Use 3.3 V logic, update DHTPIN to your ESP32 GPIO number, and select an ESP32 board in Arduino IDE.
  complete:
    summary: |
      Your ESP32 can now measure the real world. You connected a digital sensor safely, learned why pull-up resistors matter, read temperature and humidity in Arduino code, and practiced debugging failed sensor reads.

      These same skills appear in weather stations, smart thermostats, greenhouse monitors, classroom data loggers, and home automation systems.
    skills:
      - Wire a DHT11 to ESP32 3.3 V, GND, and GPIO4
      - Choose safe ESP32 GPIO pins for a digital sensor
      - Install and use the Arduino DHT library
      - Read Celsius, Fahrenheit, humidity, and heat index
      - Troubleshoot NaN readings and library errors
