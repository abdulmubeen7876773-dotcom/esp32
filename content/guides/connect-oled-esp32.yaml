  troubleshooting:
  - problem: No I2C ACK at OLED_ADDRESS
    cause: No responding device at the selected address.
    fix: Power off to check VCC/GND/SDA21/SCL22. Run the linked scanner; choose 0x3C or 0x3D only when supported
      by your module.
  - problem: SSD1306 buffer/init failed
    cause: The library could not allocate/initialize its framebuffer; not proof of a missing OLED.
    fix: Verify reviewed library versions and available memory; inspect the exact error. An ACK alone does not establish
      SSD1306 compatibility.
  - problem: ACK present, panel still blank
    cause: Controller/dimensions/reset/power may be incompatible, or drawing was not transferred.
    fix: Verify 128×64 I2C SSD1306, module reset requirements and display.display(). Do not hot-rewire or assume
      SH1106 uses this driver.
  code_explanation:
  - text: Wire.begin(21, 22) selects the pins shown in the wiring table; the ACK probe runs before framebuffer initialization.
  - text: clearDisplay(), setCursor() and println() prepare the text in RAM. display.display() transfers that buffer
      to the panel.
  - text: loop() is empty because this static greeting is drawn once. Startup errors require checking the module
      with power off and restarting.
