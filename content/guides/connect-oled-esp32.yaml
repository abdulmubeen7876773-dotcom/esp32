mission:
  repeat_explanations: false
  badge: Mission 3
  icon: 📺
  title: Give Your Project a Face!
  story: 'Blinking lights and sensor numbers are cool — but every great gadget has a screen. Game consoles, phones,
    even microwave ovens show you what''s happening.


    Your ESP32 will talk to a four-pin SSD1306 OLED display over I2C using VCC, GND, SDA, and SCL. This is not SPI
    wiring; SPI OLED modules use extra signal pins and different code. When you see "Hello, Maker!" glow on that
    blue screen, your project starts to feel like a real product.

    '
  eli12: 'The OLED is a tiny TV screen with only four wires: power, ground, and two communication wires called SDA
    and SCL. They form a language called I2C — like a two-lane road where the ESP32 sends drawing instructions and
    the screen shows them.

    '
  what_you_build: 'An SSD1306 128×64 I2C OLED connected to ESP32 with VCC, GND, SDA, and SCL. Your code starts I2C
    on GPIO21/GPIO22, clears the screen, and displays a message in large text - the foundation for showing sensor
    readings, menus, and game scores.

    '
  things_you_need:
  - item: ESP32 DevKit board
    link: /components/esp32-devkit.html
  - item: SSD1306 OLED display
    note: 0.96 inch, 128×64, I2C interface
    link: /components/ssd1306-oled.html
  - item: Breadboard and jumper wires
    note: Four wires for VCC, GND, SDA, SCL
  - item: USB cable
  safety:
  - text: Use a module explicitly documented for 3.3 V supply and 3.3 V I2C pull-ups. Do not assume 5 V module power
      is safe for ESP32 signals.
  - text: Handle the glass screen gently — OLED panels can crack if dropped.
  - text: Unplug USB before moving wires.
  concept:
    title: What Is I2C?
    image: /assets/visuals/guides/concepts/connect-oled-esp32-concept.svg
    illustration_alt: ESP32 connected to OLED via SDA and SCL lines with shared ground, labeled 0x3C address
    body: 'I2C lets multiple devices share two wires — SDA (data) and SCL (clock). Each device has an address; SSD1306
      OLED modules usually use 0x3C and some use 0x3D.


      This site uses GPIO21 for SDA and GPIO22 for SCL in ESP32 examples. Those pins are common, not universal fixed
      I2C pins. If you choose different ESP32 pins later, the wiring and Wire.begin(SDA, SCL) call must match.


      The Adafruit SSD1306 library handles the hard work. You call display.println() like Serial, then display.display()
      to refresh the pixels.

      '
  wiring:
    illustration_alt: OLED VCC to 3.3V, GND to GND, SDA to GPIO21, SCL to GPIO22
    image: /assets/visuals/guides/wiring/connect-oled-esp32-wiring.svg
    steps:
    - Unplug USB. Place the OLED module on the breadboard or connect its pins directly.
    - Connect OLED VCC to ESP32 3.3 V.
    - Connect OLED GND to ESP32 GND.
    - Connect OLED SDA to ESP32 GPIO21, the common SDA example pin used here.
    - Connect OLED SCL to ESP32 GPIO22, the common SCL example pin used here.
    - If your module is labeled differently or has SPI pins such as MOSI, CLK, DC, or CS, do not copy this I2C wiring.
    - Install Adafruit SSD1306 and Adafruit GFX libraries in Arduino IDE.
  gpio_table:
  - signal: OLED VCC
    esp32_pin: 3.3 V
    mode: Power
    notes: Use 3.3 V for this ESP32 beginner build. Some modules tolerate 5 V, but do not assume it.
  - signal: OLED GND
    esp32_pin: GND
    mode: Ground
    notes: The OLED and ESP32 must share ground.
  - signal: OLED SDA
    esp32_pin: GPIO21
    mode: I2C data
    notes: Common ESP32 Arduino example SDA pin used by this site; match Wire.begin(21, 22).
  - signal: OLED SCL
    esp32_pin: GPIO22
    mode: I2C clock
    notes: Common ESP32 Arduino example SCL pin used by this site; match Wire.begin(21, 22).
  - signal: OLED address
    esp32_pin: 0x3C or 0x3D
    mode: I2C address
    notes: Try 0x3C first, then run an I2C scanner or test 0x3D if the screen stays blank.
  code:
    filename: oled_hello.ino
    content: "#include <Arduino.h>\n#include <Wire.h>\n#include <Adafruit_GFX.h>\n#include <Adafruit_SSD1306.h>\n\
      \n#define SCREEN_WIDTH 128\n#define SCREEN_HEIGHT 64\n#define OLED_RESET -1\n#define OLED_ADDRESS 0x3C\n\n\
      Adafruit_SSD1306 display(SCREEN_WIDTH, SCREEN_HEIGHT, &Wire, OLED_RESET);\n\nbool oledResponds() {\n  Wire.beginTransmission(OLED_ADDRESS);\n\
      \  return Wire.endTransmission() == 0; // ACK only, not controller identification.\n}\n\nvoid setup() {\n\
      \  Serial.begin(115200);\n  Wire.begin(21, 22);\n\n  Wire.setTimeOut(50); // Per bus operation, not a whole-sketch\
      \ deadline.\n  if (!oledResponds()) {\n    Serial.println(\"No I2C ACK at OLED_ADDRESS; check power, bus and\
      \ address, then reset\");\n    while (true) delay(1000);\n  }\n  if (!display.begin(SSD1306_SWITCHCAPVCC,\
      \ OLED_ADDRESS, true, false)) {\n    Serial.println(\"SSD1306 buffer/init failed; this is not a presence test\"\
      );\n    while (true) delay(1000);\n  }\n  display.clearDisplay();\n  display.setTextSize(2);\n  display.setTextColor(SSD1306_WHITE);\n\
      \  display.setCursor(0, 20);\n  display.println(\"Hello,\");\n  display.println(\"Maker!\");\n  display.display();\n\
      }\n\nvoid loop() {\n}\n"
    notes: 'Classic ESP32-WROOM DevKit; Arduino-ESP32 3.3.2 review baseline (not latest). Selected display: a documented
      3.3 V-compatible 128×64 I2C SSD1306 module with bus pull-ups to 3.3 V, four labelled VCC/GND/SDA/SCL pins
      and suitable reset circuitry. SH1106 and SPI displays need another driver/wiring. Pins are SDA21/SCL22; set
      OLED_ADDRESS from the module documentation/scanner. An ACK checks address response, not controller identity.
      Install Adafruit SSD1306 2.5.13, Adafruit GFX 1.12.1 and Adafruit BusIO 1.17.0. Documentation reviewed; no
      compilation or hardware testing performed.


      Read Serial at 115200 before diagnosing a blank panel. ACK and buffer allocation are separate checks.'
  expected_output: 'Illustrative expected output, not recorded hardware data:


    Serial should remain available at 115200. A selected address with no ACK prints the bus/address diagnostic;
    framebuffer initialization failure prints a separate message. With the supported module, the intended output
    is Hello, then Maker! on the screen. These are expected checks, not recorded hardware results. An ACK or successful
    library begin does not prove that visible pixels appeared.'
  quiz:
  - question: Which two pins carry I2C communication on ESP32?
    options:
    - GPIO21 (SDA) and GPIO22 (SCL)
    - GPIO2 and GPIO4
    - GPIO34 and GPIO35
    correct: 0
    explanation: This site uses GPIO21 for SDA and GPIO22 for SCL in its ESP32 I2C examples.
  - question: What function updates the pixels on the screen?
    options:
    - display.display()
    - display.clearDisplay()
    - pinMode()
    correct: 0
    explanation: You draw into a buffer, then display.display() pushes those pixels to the OLED.
  challenge: 'Show live DHT11 temperature on the OLED after completing the Read Temperature with DHT11 quick build
    linked below — combine both sketches! Or animate text: scroll "ESP32 Engine" across the screen using setCursor
    in a loop.

    '
  complete:
    summary: This lesson connects a qualified I2C SSD1306 and sends a text framebuffer. Check the actual pixels
      and Serial diagnostics on your own display before adding sensor values.
    skills:
    - Wire SSD1306 OLED via I2C (SDA, SCL, 3.3 V, GND)
    - Use Adafruit SSD1306 and GFX libraries
    - Draw text on a 128×64 screen
