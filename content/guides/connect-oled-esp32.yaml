headline: Connect OLED Display with ESP32
meta_description: Connect an SSD1306 I2C OLED to ESP32 with VCC, GND, SDA GPIO21, SCL GPIO22, address 0x3C or 0x3D,
  Arduino libraries, test code, and blank-screen fixes.
lead: Wire a four-pin SSD1306 I2C OLED to ESP32 using 3.3 V, GND, SDA on GPIO21, and SCL on GPIO22 in this site's
  examples, then show Hello, Maker on the screen.
keywords: ESP32 OLED, SSD1306 ESP32, I2C display beginner, ESP32 screen
