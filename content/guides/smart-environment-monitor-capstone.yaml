    "code": {
      "filename": "smart_environment_monitor_capstone.ino",
      "notes": "Required libraries: Adafruit BME280, Adafruit Unified Sensor, Adafruit SSD1306, and Adafruit GFX.\n\nThe BME280 and OLED share GPIO21 SDA and GPIO22 SCL.\n\nThe button uses INPUT_PULLUP, so pressed means LOW.\n\nGreen LED means normal, red LED means temperature warning.\n\nChange TEMP_WARNING_C and TEMP_APPROACH_C to match your room.\n\nReview baseline: Arduino-ESP32 3.3.2; SSD1306 2.5.13, GFX 1.12.1, BME280 2.3.0, Unified Sensor 1.1.15 and BusIO 1.17.0.\n\nUNAVAILABLE is not NORMAL; range/bus checks do not certify sensor health or calibration.",
      "content": "#include <Arduino.h>\n#include <math.h>\n#include <Wire.h>\n#include <Adafruit_GFX.h>\n#include <Adafruit_SSD1306.h>\n#include <Adafruit_BME280.h>\n\nconst int I2C_SDA = 21;\nconst int I2C_SCL = 22;\n\nconst int GREEN_LED_PIN = 18;\nconst int RED_LED_PIN = 19;\nconst int BUTTON_PIN = 23;\n\nconst int SCREEN_WIDTH = 128;\nconst int SCREEN_HEIGHT = 64;\nconst int OLED_RESET = -1;\nconst int OLED_ADDRESS = 0x3C;\n\nconst float TEMP_APPROACH_C = 28.0;\nconst float TEMP_WARNING_C = 30.0;\n\nconst unsigned long SAMPLE_INTERVAL_MS = 2000;\nconst unsigned long DEBOUNCE_MS = 40;\n\nAdafruit_SSD1306 display(SCREEN_WIDTH, SCREEN_HEIGHT, &Wire, OLED_RESET);\nAdafruit_BME280 bme;\nuint8_t bmeAddress = 0;\n\nfloat temperatureC = NAN;\nfloat humidity = NAN;\nfloat pressureHpa = NAN;\nbool sampleValid = false;\n\nint currentPage = 0;\nint lastButtonReading = HIGH;\nint stableButtonState = HIGH;\nunsigned long lastButtonChangeTime = 0;\nunsigned long lastSampleTime = 0;\n\nbool oledResponds() {\n  Wire.beginTransmission(OLED_ADDRESS);\n  return Wire.endTransmission() == 0; // ACK only, not controller identification.\n}\n\nbool bmeResponds() {\n  Wire.beginTransmission(bmeAddress); Wire.write(0xD0);\n  if (Wire.endTransmission(false) != 0) return false;\n  if (Wire.requestFrom(bmeAddress, uint8_t(1)) != 1) return false;\n  return Wire.read() == 0x60; // Compatibility check, not authenticity/calibration.\n}\nbool valuesPlausible(float t, float rh, float hpa) {\n  return isfinite(t) && isfinite(rh) && isfinite(hpa) &&\n    t >= -40 && t <= 85 && rh >= 0 && rh <= 100 && hpa >= 300 && hpa <= 1100;\n}\n\nvoid setup() {\n  Serial.begin(115200);\n  delay(1000);\n\n  pinMode(GREEN_LED_PIN, OUTPUT);\n  pinMode(RED_LED_PIN, OUTPUT);\n  digitalWrite(GREEN_LED_PIN, LOW);\n  digitalWrite(RED_LED_PIN, LOW);\n  pinMode(BUTTON_PIN, INPUT_PULLUP);\n\n  Wire.begin(I2C_SDA, I2C_SCL);\n\n  Wire.setTimeOut(50); // Per bus operation, not a whole-sketch deadline.\n  if (!oledResponds()) {\n    Serial.println(\"No I2C ACK at OLED_ADDRESS; check power, bus and address, then reset\");\n    while (true) delay(1000);\n  }\n  if (!display.begin(SSD1306_SWITCHCAPVCC, OLED_ADDRESS, true, false)) {\n    Serial.println(\"SSD1306 buffer/init failed; this is not a presence test\");\n    while (true) delay(1000);\n  }\n\n  bmeAddress = 0x76;\n  bool bmeReady = bme.begin(bmeAddress, &Wire);\n  if (!bmeReady) {\n    bmeAddress = 0x77;\n    bmeReady = bme.begin(bmeAddress, &Wire);\n  }\n\n  if (!bmeReady) {\n    Serial.println(\"BME280 not found at 0x76 or 0x77.\");\n    showMessage(\"BME280 not found\", \"Check I2C wiring\");\n    while (true) {\n      delay(1000);\n    }\n  }\n\n  showMessage(\"Course 01\", \"Capstone ready\");\n  Serial.println(\"Mission 12: Smart Environment Monitor ready\");\n  delay(1500);\n}\n\nvoid loop() {\n  handleButton();\n\n  unsigned long now = millis();\n  if (now - lastSampleTime >= SAMPLE_INTERVAL_MS) {\n    lastSampleTime = now;\n    readSensorData();\n    updateAlerts();\n    printSerialReport();\n    updateDisplay();\n  }\n}\n\nvoid handleButton() {\n  int reading = digitalRead(BUTTON_PIN);\n\n  if (reading != lastButtonReading) {\n    lastButtonChangeTime = millis();\n    lastButtonReading = reading;\n  }\n\n  if ((millis() - lastButtonChangeTime) > DEBOUNCE_MS) {\n    if (reading != stableButtonState) {\n      stableButtonState = reading;\n\n      if (stableButtonState == LOW) {\n        currentPage = 1 - currentPage;\n        updateDisplay();\n      }\n    }\n  }\n}\n\nvoid readSensorData() {\n  sampleValid = false;\n  temperatureC = humidity = pressureHpa = NAN;\n  if (!bmeResponds()) return;\n  temperatureC = bme.readTemperature();\n  humidity = bme.readHumidity();\n  pressureHpa = bme.readPressure() / 100.0;\n  sampleValid = valuesPlausible(temperatureC, humidity, pressureHpa);\n}\n\nString environmentStatus() {\n  if (!sampleValid) return \"UNAVAILABLE\";\n  if (temperatureC >= TEMP_WARNING_C) {\n    return \"WARNING\";\n  }\n\n  if (temperatureC >= TEMP_APPROACH_C) {\n    return \"WARM\";\n  }\n\n  return \"NORMAL\";\n}\n\nvoid updateAlerts() {\n  String status = environmentStatus();\n\n  digitalWrite(GREEN_LED_PIN, status == \"NORMAL\" ? HIGH : LOW);\n  digitalWrite(RED_LED_PIN, status == \"WARNING\" ? HIGH : LOW);\n}\n\nvoid updateDisplay() {\n  if (!sampleValid) { showMessage(\"Sensor unavailable\", \"Check bus; see Serial\"); return; }\n  display.clearDisplay();\n  display.setTextColor(SSD1306_WHITE);\n  display.setTextSize(1);\n\n  if (currentPage == 0) {\n    display.setCursor(0, 0);\n    display.println(\"Page 1: Climate\");\n    display.setCursor(0, 20);\n    display.print(\"Temp: \");\n    display.print(temperatureC, 1);\n    display.println(\" C\");\n    display.setCursor(0, 38);\n    display.print(\"Hum:  \");\n    display.print(humidity, 1);\n    display.println(\" %\");\n  } else {\n    display.setCursor(0, 0);\n    display.println(\"Page 2: Status\");\n    display.setCursor(0, 20);\n    display.print(\"Pres: \");\n    display.print(pressureHpa, 1);\n    display.println(\" hPa\");\n    display.setCursor(0, 42);\n    display.print(\"Status: \");\n    display.println(environmentStatus());\n  }\n\n  display.display();\n}\n\nvoid printSerialReport() {\n  if (!sampleValid) { Serial.println(\"Sensor unavailable | Status: UNAVAILABLE\"); return; }\n  Serial.print(\"Temperature: \");\n  Serial.print(temperatureC, 1);\n  Serial.print(\" C | Humidity: \");\n  Serial.print(humidity, 1);\n  Serial.print(\" % | Pressure: \");\n  Serial.print(pressureHpa, 1);\n  Serial.print(\" hPa | Status: \");\n  Serial.println(environmentStatus());\n}\n\nvoid showMessage(const char* line1, const char* line2) {\n  display.clearDisplay();\n  display.setTextColor(SSD1306_WHITE);\n  display.setTextSize(1);\n  display.setCursor(0, 14);\n  display.println(line1);\n  display.setCursor(0, 34);\n  display.println(line2);\n  display.display();\n}\n"
    },
    "code_explanation": [
      {
        "text": "The include lines load the I2C, OLED, graphics, and BME280 libraries needed by the project."
      },
      {
        "text": "GPIO21 and GPIO22 are used for the shared I2C bus, matching the OLED and BME280 lessons."
      },
      {
        "text": "GPIO18 and GPIO19 control the green and red LED alert outputs."
      },
      {
        "text": "GPIO23 reads the page button with INPUT_PULLUP, so pressing the button connects the pin to GND and reads LOW."
      },
      {
        "text": "TEMP_APPROACH_C and TEMP_WARNING_C are the decision thresholds. They turn numbers into status."
      },
      {
        "text": "SAMPLE_INTERVAL_MS keeps sensor reading stable instead of reading as fast as possible."
      },
      {
        "text": "The button handler uses debounce timing so one physical press changes the page once."
      },
      {
        "text": "readSensorData() keeps measurement code separate from display and alert code."
      },
      {
        "text": "environmentStatus() is the decision-making function. It returns UNAVAILABLE for an invalid sample, otherwise NORMAL, WARM, or WARNING."
      },
      {
        "text": "updateAlerts() turns the LEDs on or off based on the current status."
      },
      {
        "text": "updateDisplay() shows either Page 1 or Page 2 depending on the button-selected page."
      },
      {
        "text": "printSerialReport() prints complete formatted data for debugging and testing."
      },
      {
        "text": "sampleValid starts false. Invalid data returns UNAVAILABLE before threshold comparisons, so both status LEDs stay OFF; a later valid scheduled sample can restore normal classification."
      }
    ],
    "expected_output": "Illustrative expected output, not recorded hardware data:\n\nOLED Page 1 should show:\n\nPage 1: Climate\nTemp: 24.8 C\nHum:  47.2 %\n\nOLED Page 2 should show:\n\nPage 2: Status\nPres: 1012.4 hPa\nStatus: NORMAL\n\nSerial Monitor should print formatted reports:\n\nMission 12: Smart Environment Monitor ready\nTemperature: 24.8 C | Humidity: 47.2 % | Pressure: 1012.4 hPa | Status: NORMAL\nTemperature: 29.1 C | Humidity: 46.8 % | Pressure: 1012.3 hPa | Status: WARM\nTemperature: 30.2 C | Humidity: 46.5 % | Pressure: 1012.1 hPa | Status: WARNING\n\nAn invalid/unavailable sample must instead show Sensor unavailable and Status: UNAVAILABLE; neither green NORMAL nor red temperature WARNING is asserted. Restoring plausible readings can restore a valid state on a later sample. These are expected checks, not recorded hardware results.",
    "common_mistakes": [
      {
        "problem": "Forgetting LED resistors",
        "cause": "The LEDs need current limiting even in a capstone project.",
        "fix": "Use a 220 ohm or 330 ohm resistor in series with each LED."
      },
      {
        "problem": "Expecting yellow LED hardware",
        "cause": "The project uses yellow as an OLED status text, not a separate LED.",
        "fix": "Use NORMAL, WARM, and WARNING text on the OLED, with green and red LEDs for hardware status."
      },
      {
        "problem": "Button switches pages many times",
        "cause": "Mechanical bounce creates repeated transitions.",
        "fix": "Keep the debounce logic and do not remove DEBOUNCE_MS."
      },
      {
        "problem": "OLED and BME280 disappear together",
        "cause": "Shared I2C wiring means one bad SDA or SCL connection can affect both modules.",
        "fix": "Recheck GPIO21, GPIO22, 3.3 V, and GND."
