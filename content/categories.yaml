categories:
- name: AI Projects
  intro: Practical ESP32 AI and computer-vision builds using ESP32-CAM, camera capture, QR scanning, and safe edge-AI learning limits.
- name: Agriculture
  intro: Build ESP32 agriculture projects for soil readings, greenhouse conditions, irrigation decisions, and cautious pump or relay control after real calibration.
- name: ESP32-CAM
  intro: Camera capture, streaming, and image server projects using ESP32-CAM modules and OTA updates.
- name: Education
  intro: Classroom-friendly trainer projects that teach GPIO, sensors, and displays in progressive difficulty
    stages.
- name: Display Projects
  intro: Show ESP32 sensor values, time, status, and compact dashboards on OLED or matrix displays after checking I2C wiring and address setup.
- name: Energy Monitoring
  intro: Learn ESP32 energy-monitoring patterns for educational current sensing, display output, logging, calibration, and safe boundaries around real AC installations.
- name: Environmental
  intro: Air quality, weather, and environmental monitoring builds with gas sensors, BME modules, and
    fans.
- name: Healthcare
  intro: Educational biosignal and wellness logging projects for learning — not for medical diagnosis
    or treatment.
- name: Home Automation
  intro: Build ESP32 home automation projects for climate control, lighting, sensing, relays, and smart low-voltage control.
- name: Industrial Automation
  intro: Prototype ESP32 industrial-style monitoring for bench machines, vibration, RFID movement, CNC status, and workshop signals without bypassing safety controls.
- name: IoT Projects
  intro: Connected ESP32 builds that publish sensor data to dashboards, APIs, and local web servers over
    Wi-Fi.
- name: LED Projects
  intro: RGB strips, patterns, and addressable LED control with ESP32 — from breadboard demos to Wi-Fi
    control.
- name: Robotics
  intro: Motor control, teleoperation, and sensor-assisted navigation projects powered by ESP32 microcontrollers.
- name: Security Projects
  intro: Motion detection, alerts, and access monitoring tutorials with PIR sensors, relays, and Wi-Fi
    notifications.
- name: Sensor Projects
  intro: Learn analog and digital sensing on ESP32 — distance, environmental, and signal processing project
    guides.
- name: Smart City
  intro: Street lighting, urban sensing, and infrastructure-style automation prototypes using ESP32.
